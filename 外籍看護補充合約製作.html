<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外籍看護補充合約製作工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1B4F8A;
    --primary-light: #E8F0FB;
    --primary-mid: #3A7BD5;
    --accent: #C75B2A;
    --accent-light: #FAF0EB;
    --border: #D4D8DE;
    --border-dark: #9AA3AD;
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --text: #1A2233;
    --muted: #5A6478;
    --success: #1D7A4F;
    --success-light: #E6F5EE;
    --section-gap: 2rem;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.7; }

  /* HEADER */
  .header { background: var(--primary); color: #fff; padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo { font-family: 'Noto Serif TC', serif; font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; }
  .header-sub { font-size: 0.75rem; opacity: 0.75; margin-top: 2px; }
  .lang-switcher { display: flex; gap: 6px; flex-wrap: wrap; }
  .lang-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35); color: #fff; padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: 0.82rem; font-family: inherit; transition: background 0.15s; }
  .lang-btn:hover, .lang-btn.active { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.7); }
  .lang-btn.active { font-weight: 700; }

  /* LAYOUT */
  .main-wrap { display: flex; min-height: calc(100vh - 64px); }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem 0; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
  .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 1.25rem; font-size: 0.88rem; color: var(--muted); text-decoration: none; border-left: 3px solid transparent; transition: all 0.15s; }
  .sidebar-nav a:hover { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary-mid); }
  .sidebar-nav a.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); font-weight: 500; }
  .sidebar-num { width: 22px; height: 22px; border-radius: 50%; background: var(--border); color: var(--muted); font-size: 0.75rem; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .sidebar-nav a.active .sidebar-num { background: var(--primary); color: #fff; }

  .content { flex: 1; padding: 2rem; max-width: 860px; }

  /* SECTION CARDS */
  .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 2rem; overflow: hidden; }
  .section-header { background: var(--primary-light); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 12px; }
  .section-badge { background: var(--primary); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }
  .section-title { font-size: 1rem; font-weight: 700; color: var(--primary); }
  .section-body { padding: 1.5rem; }

  /* FORM ELEMENTS */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.82rem; font-weight: 500; color: var(--muted); }
  .label-zh { display: block; }
  .label-en, .label-id, .label-vi { font-size: 0.72rem; color: #9AA3AD; display: block; margin-top: 1px; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 11px; font-family: inherit; font-size: 0.92rem; color: var(--text); background: #fff; width: 100%; transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-mid); box-shadow: 0 0 0 3px rgba(58,123,213,0.12); }
  textarea { min-height: 80px; resize: vertical; }

  /* CHECKBOXES */
  .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 4px; }
  .check-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .check-item:hover { border-color: var(--primary-mid); background: var(--primary-light); }
  .check-item input[type=checkbox] { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--primary); flex-shrink: 0; }
  .check-label { font-size: 0.85rem; }
  .check-sub { font-size: 0.7rem; color: var(--muted); display: block; }

  /* SALARY ROW */
  .salary-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .salary-row input { flex: 1; min-width: 120px; }
  .salary-row span { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }

  /* DIVIDER */
  .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

  /* ACTION BAR */
  .action-bar { background: var(--surface); border-top: 1px solid var(--border); padding: 1rem 2rem; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; position: sticky; bottom: 0; z-index: 50; }
  .btn { padding: 9px 22px; border-radius: 7px; font-family: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn-outline:hover { background: var(--primary-light); }
  .btn-danger { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-danger:hover { background: var(--accent-light); }

  /* CONTRACT PREVIEW */
  .preview-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; overflow-y: auto; padding: 2rem 1rem; }
  .preview-modal.open { display: flex; align-items: flex-start; justify-content: center; }
  .preview-box { background: #fff; border-radius: 10px; max-width: 820px; width: 100%; padding: 0; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
  .preview-header { background: var(--primary); color: #fff; padding: 1rem 1.5rem; border-radius: 10px 10px 0 0; display: flex; align-items: center; justify-content: space-between; }
  .preview-header h2 { font-size: 1rem; font-weight: 600; }
  .preview-header button { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; border-radius: 5px; padding: 5px 12px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
  .preview-content { padding: 2rem; }

  /* CONTRACT LAYOUT */
  .contract-doc { font-family: 'Noto Sans TC', sans-serif; font-size: 14px; line-height: 1.8; color: #111; }
  .contract-doc h1 { text-align: center; font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
  .contract-doc .contract-sub { text-align: center; font-size: 0.85rem; color: #555; margin-bottom: 1.5rem; }
  .contract-doc .info-table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; }
  .contract-doc .info-table td { padding: 5px 10px; border: 1px solid #ccc; font-size: 13px; vertical-align: top; }
  .contract-doc .info-table td:first-child { background: #f5f5f5; font-weight: 500; width: 35%; }
  .contract-doc .clause { margin-bottom: 1rem; }
  .contract-doc .clause-num { font-weight: 700; }
  .contract-doc .sign-row { display: flex; gap: 3rem; margin-top: 2rem; flex-wrap: wrap; }
  .contract-doc .sign-block { flex: 1; min-width: 180px; border-top: 1px solid #999; padding-top: 8px; font-size: 13px; color: #555; text-align: center; }
  .lang-block { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 2px dashed #ccc; }
  .lang-block h3 { font-size: 0.9rem; color: #888; margin-bottom: 6px; text-align: center; letter-spacing: 0.05em; }

  @media print {
    .header, .sidebar, .action-bar, .preview-header button { display: none !important; }
    .preview-modal { position: static; background: none; padding: 0; display: block !important; }
    .preview-box { box-shadow: none; border-radius: 0; max-width: 100%; }
    .preview-content { padding: 0; }
    body { background: #fff; }
    .lang-block { page-break-before: always; }
  }

  @media (max-width: 700px) {
    .sidebar { display: none; }
    .content { padding: 1rem; }
    .header { padding: 1rem; }
    .form-grid { grid-template-columns: 1fr; }
    .check-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 440px) {
    .check-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div>
      <div class="header-logo">外籍看護補充合約製作工具</div>
      <div class="header-sub" id="headerSub">Foreign Caregiver Supplemental Contract Builder</div>
    </div>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('zh')">中文</button>
    <button class="lang-btn" onclick="setLang('en')">中英</button>
    <button class="lang-btn" onclick="setLang('id')">中印</button>
    <button class="lang-btn" onclick="setLang('vi')">中越</button>
  </div>
</div>

<div class="main-wrap">
  <nav class="sidebar">
    <ul class="sidebar-nav" style="list-style:none;">
      <li><a href="#sec1" class="active"><span class="sidebar-num">1</span><span class="nav-txt" data-key="nav1">當事人資訊</span></a></li>
      <li><a href="#sec2"><span class="sidebar-num">2</span><span class="nav-txt" data-key="nav2">被照顧者</span></a></li>
      <li><a href="#sec3"><span class="sidebar-num">3</span><span class="nav-txt" data-key="nav3">工作內容</span></a></li>
      <li><a href="#sec4"><span class="sidebar-num">4</span><span class="nav-txt" data-key="nav4">薪資休假</span></a></li>
      <li><a href="#sec5"><span class="sidebar-num">5</span><span class="nav-txt" data-key="nav5">紀律規範</span></a></li>
      <li><a href="#sec6"><span class="sidebar-num">6</span><span class="nav-txt" data-key="nav6">特別條款</span></a></li>
    </ul>
  </nav>

  <div class="content">

    <!-- SECTION 1: 當事人 -->
    <div class="section-card" id="sec1">
      <div class="section-header">
        <div class="section-badge">1</div>
        <div class="section-title" data-key="sec1title">當事人資訊</div>
      </div>
      <div class="section-body">
        <div class="form-grid">
          <div class="form-group">
            <label><span class="label-zh" data-key="contractDate">合約簽訂日期</span><span class="label-en">Contract Date</span></label>
            <input type="date" id="contractDate">
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="contractStart">合約起始日</span><span class="label-en">Start Date</span></label>
            <input type="date" id="contractStart">
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="contractEnd">合約終止日</span><span class="label-en">End Date</span></label>
            <input type="date" id="contractEnd">
          </div>
        </div>
        <hr class="divider">
        <div style="font-size:0.85rem; font-weight:700; color:var(--primary); margin-bottom:12px;" data-key="employerInfo">▍雇主資訊</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="label-zh" data-key="empName">雇主姓名</span><span class="label-en">Employer Name</span></label>
            <input type="text" id="empName" placeholder="請輸入">
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="empId">身分證字號</span><span class="label-en">ID Number</span></label>
            <input type="text" id="empId" placeholder="A123456789">
          </div>
          <div class="form-group full">
            <label><span class="label-zh" data-key="empAddr">戶籍地址</span><span class="label-en">Address</span></label>
            <input type="text" id="empAddr" placeholder="縣市鄉鎮路段">
          </div>
          <div class="form-group full">
            <label><span class="label-zh" data-key="workAddr">工作地址（照護地點）</span><span class="label-en">Work Address</span></label>
            <input type="text" id="workAddr" placeholder="如與戶籍地址相同請填相同">
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="empPhone">聯絡電話</span><span class="label-en">Phone</span></label>
            <input type="text" id="empPhone" placeholder="0912-345-678">
          </div>
        </div>
        <hr class="divider">
        <div style="font-size:0.85rem; font-weight:700; color:var(--primary); margin-bottom:12px;" data-key="nurseInfo">▍看護工資訊</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="label-zh" data-key="nurseName">看護工姓名</span><span class="label-en">Caregiver Name</span></label>
            <input type="text" id="nurseName" placeholder="Full name">
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="nursePassport">護照號碼</span><span class="label-en">Passport No.</span></label>
            <input type="text" id="nursePassport" placeholder="AB1234567">
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="nurseNation">國籍</span><span class="label-en">Nationality</span></label>
            <select id="nurseNation">
              <option value="">-- 請選擇 --</option>
              <option value="印尼">印尼 / Indonesia</option>
              <option value="越南">越南 / Việt Nam</option>
              <option value="菲律賓">菲律賓 / Philippines</option>
              <option value="泰國">泰國 / Thailand</option>
            </select>
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="nurseARC">居留證號</span><span class="label-en">ARC No.</span></label>
            <input type="text" id="nurseARC" placeholder="AA12345678">
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="nurseGender">性別</span><span class="label-en">Gender</span></label>
            <select id="nurseGender">
              <option value="女">女 / Female</option>
              <option value="男">男 / Male</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION 2: 被照顧者 -->
    <div class="section-card" id="sec2">
      <div class="section-header">
        <div class="section-badge">2</div>
        <div class="section-title" data-key="sec2title">被照顧者資訊</div>
      </div>
      <div class="section-body">
        <div class="form-grid">
          <div class="form-group">
            <label><span class="label-zh" data-key="careName">被照顧者姓名</span><span class="label-en">Care Recipient Name</span></label>
            <input type="text" id="careName" placeholder="請輸入姓名">
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="careAge">年齡</span><span class="label-en">Age</span></label>
            <input type="number" id="careAge" placeholder="歲" min="0" max="120">
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="careRelation">與雇主關係</span><span class="label-en">Relation to Employer</span></label>
            <select id="careRelation">
              <option value="本人">本人</option>
              <option value="父親">父親</option>
              <option value="母親">母親</option>
              <option value="配偶">配偶</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="careMobility">行動能力</span><span class="label-en">Mobility</span></label>
            <select id="careMobility">
              <option value="臥床">完全臥床</option>
              <option value="輪椅">需輪椅輔助</option>
              <option value="輔具">需輔具行走</option>
              <option value="自行行走">可自行行走</option>
            </select>
          </div>
          <div class="form-group full">
            <label><span class="label-zh" data-key="careDisease">主要疾病/狀況</span><span class="label-en">Medical Conditions</span></label>
            <input type="text" id="careDisease" placeholder="如：失智症、腦中風後遺症…">
          </div>
          <div class="form-group full">
            <label><span class="label-zh" data-key="careNote">其他特殊需求說明</span><span class="label-en">Special Needs</span></label>
            <textarea id="careNote" placeholder="如特殊飲食需求、過敏史…"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION 3: 工作內容 -->
    <div class="section-card" id="sec3">
      <div class="section-header">
        <div class="section-badge">3</div>
        <div class="section-title" data-key="sec3title">工作內容</div>
      </div>
      <div class="section-body">
        <div style="font-size:0.82rem; color:var(--muted); margin-bottom:12px;" data-key="sec3hint">請勾選看護工須執行的工作項目：</div>
        <div class="check-grid" id="workChecks">
          <label class="check-item"><input type="checkbox" value="個人衛生（洗澡、口腔護理）" checked><span class="check-label">個人衛生<span class="check-sub">洗澡、口腔護理</span></span></label>
          <label class="check-item"><input type="checkbox" value="飲食協助（餵食、備餐）" checked><span class="check-label">飲食協助<span class="check-sub">餵食、備餐</span></span></label>
          <label class="check-item"><input type="checkbox" value="排泄照護（尿布更換、如廁協助）" checked><span class="check-label">排泄照護<span class="check-sub">尿布更換、如廁協助</span></span></label>
          <label class="check-item"><input type="checkbox" value="服藥管理"><span class="check-label">服藥管理<span class="check-sub">按時提醒服藥</span></span></label>
          <label class="check-item"><input type="checkbox" value="翻身復位（每2小時）"><span class="check-label">翻身復位<span class="check-sub">每2小時一次</span></span></label>
          <label class="check-item"><input type="checkbox" value="復健運動協助"><span class="check-label">復健運動協助<span class="check-sub">按醫囑執行</span></span></label>
          <label class="check-item"><input type="checkbox" value="就醫陪同"><span class="check-label">就醫陪同<span class="check-sub">外出就診陪伴</span></span></label>
          <label class="check-item"><input type="checkbox" value="被照顧者衣物洗滌"><span class="check-label">衣物洗滌<span class="check-sub">被照顧者衣物</span></span></label>
          <label class="check-item"><input type="checkbox" value="病房/臥室清潔"><span class="check-label">環境清潔<span class="check-sub">病房/臥室</span></span></label>
          <label class="check-item"><input type="checkbox" value="生命徵象量測（血壓、血糖）"><span class="check-label">生命徵象量測<span class="check-sub">血壓、血糖記錄</span></span></label>
          <label class="check-item"><input type="checkbox" value="緊急狀況通報"><span class="check-label">緊急狀況通報<span class="check-sub">立即聯繫雇主</span></span></label>
          <label class="check-item"><input type="checkbox" value="日間陪伴與精神照護"><span class="check-label">日間陪伴<span class="check-sub">精神支持照護</span></span></label>
        </div>
        <div class="form-group" style="margin-top:1rem;">
          <label><span class="label-zh" data-key="workOther">其他工作項目（自填）</span></label>
          <textarea id="workOther" placeholder="如有其他工作需求請填寫…" style="min-height:60px;"></textarea>
        </div>
      </div>
    </div>

    <!-- SECTION 4: 薪資 -->
    <div class="section-card" id="sec4">
      <div class="section-header">
        <div class="section-badge">4</div>
        <div class="section-title" data-key="sec4title">薪資與休假</div>
      </div>
      <div class="section-body">
        <div class="form-grid">
          <div class="form-group">
            <label><span class="label-zh" data-key="salary">月薪（新台幣）</span><span class="label-en">Monthly Salary (NTD)</span></label>
            <div class="salary-row">
              <input type="number" id="salary" placeholder="20000" min="0">
              <span>元整</span>
            </div>
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="payDay">發薪日</span><span class="label-en">Pay Day</span></label>
            <div class="salary-row">
              <span>每月</span>
              <input type="number" id="payDay" placeholder="5" min="1" max="31" style="max-width:80px;">
              <span>日</span>
            </div>
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="restDays">例假日（天/月）</span><span class="label-en">Rest Days/Month</span></label>
            <div class="salary-row">
              <input type="number" id="restDays" placeholder="4" min="0" max="31" style="max-width:80px;">
              <span>天/月</span>
            </div>
          </div>
          <div class="form-group">
            <label><span class="label-zh" data-key="payMethod">薪資給付方式</span><span class="label-en">Payment Method</span></label>
            <select id="payMethod">
              <option value="現金">現金</option>
              <option value="轉帳">銀行轉帳</option>
              <option value="匯款">匯款至母國帳戶</option>
            </select>
          </div>
        </div>
        <hr class="divider">
        <div style="font-size:0.85rem; font-weight:700; color:var(--primary); margin-bottom:12px;" data-key="benefits">▍福利勾選</div>
        <div class="check-grid">
          <label class="check-item"><input type="checkbox" id="benFood" checked><span class="check-label">提供三餐<span class="check-sub">雇主供食</span></span></label>
          <label class="check-item"><input type="checkbox" id="benRoom" checked><span class="check-label">提供住宿<span class="check-sub">雇主供房</span></span></label>
          <label class="check-item"><input type="checkbox" id="benInsurance" checked><span class="check-label">全民健保<span class="check-sub">雇主代繳</span></span></label>
          <label class="check-item"><input type="checkbox" id="benLabor"><span class="check-label">勞工保險<span class="check-sub">雇主代繳</span></span></label>
          <label class="check-item"><input type="checkbox" id="benBonus"><span class="check-label">年終獎金<span class="check-sub">視表現給予</span></span></label>
          <label class="check-item"><input type="checkbox" id="benPhone"><span class="check-label">提供手機門號<span class="check-sub">限家用</span></span></label>
        </div>
        <div class="form-group" style="margin-top:1rem;">
          <label><span class="label-zh" data-key="overTime">加班費約定</span><span class="label-en">Overtime Pay</span></label>
          <input type="text" id="overTime" placeholder="如：超時工作以日薪1/30計算…">
        </div>
      </div>
    </div>

    <!-- SECTION 5: 紀律 -->
    <div class="section-card" id="sec5">
      <div class="section-header">
        <div class="section-badge">5</div>
        <div class="section-title" data-key="sec5title">紀律規範</div>
      </div>
      <div class="section-body">
        <div style="font-size:0.82rem; color:var(--muted); margin-bottom:12px;" data-key="sec5hint">請勾選適用之禁止事項：</div>
        <div class="check-grid">
          <label class="check-item"><input type="checkbox" value="未經允許不得外出" checked><span class="check-label">未經允許不得外出</span></label>
          <label class="check-item"><input type="checkbox" value="不得擅自接待外人" checked><span class="check-label">不得擅自接待外人</span></label>
          <label class="check-item"><input type="checkbox" value="不得吸菸、飲酒" checked><span class="check-label">不得吸菸、飲酒</span></label>
          <label class="check-item"><input type="checkbox" value="不得使用雇主個人電話"><span class="check-label">不得使用雇主電話</span></label>
          <label class="check-item"><input type="checkbox" value="不得擅自拍攝被照顧者影像" checked><span class="check-label">不得拍攝被照顧者</span></label>
          <label class="check-item"><input type="checkbox" value="不得洩漏家庭隱私" checked><span class="check-label">不得洩漏家庭隱私</span></label>
          <label class="check-item"><input type="checkbox" value="不得攜帶危險物品"><span class="check-label">不得攜帶危險物品</span></label>
          <label class="check-item"><input type="checkbox" value="不得接受雇主以外人員指派工作"><span class="check-label">不得被第三方指派</span></label>
          <label class="check-item"><input type="checkbox" value="不得自行與仲介聯繫更換雇主"><span class="check-label">不得私下換雇主</span></label>
          <label class="check-item"><input type="checkbox" value="不得竊取或損毀財物" checked><span class="check-label">不得竊取損毀財物</span></label>
        </div>
        <hr class="divider">
        <div class="form-grid">
          <div class="form-group">
            <label><span class="label-zh" data-key="penalty">違約金（元）</span><span class="label-en">Breach Penalty (NTD)</span></label>
            <input type="number" id="penalty" placeholder="如：30000" min="0">
          </div>
          <div class="form-group full">
            <label><span class="label-zh" data-key="disciplineNote">其他紀律說明</span></label>
            <textarea id="disciplineNote" placeholder="其他約定事項…" style="min-height:60px;"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION 6: 特別條款 -->
    <div class="section-card" id="sec6">
      <div class="section-header">
        <div class="section-badge">6</div>
        <div class="section-title" data-key="sec6title">特別條款</div>
      </div>
      <div class="section-body">
        <div class="check-grid" id="specialChecks">
          <label class="check-item"><input type="checkbox" value="手機使用限制：每日休息時間內可使用，工作時間禁止使用個人手機" checked><span class="check-label">手機限制條款<span class="check-sub">工作時間禁用</span></span></label>
          <label class="check-item"><input type="checkbox" value="病假須提交醫院開立之診斷證明書，否則視為曠職" checked><span class="check-label">病假舉證要求<span class="check-sub">需醫院證明</span></span></label>
          <label class="check-item"><input type="checkbox" value="夜間待命時間（22:00-06:00）計入工作時數，每月以___小時為上限"><span class="check-label">夜間待命時間<span class="check-sub">計入工時</span></span></label>
          <label class="check-item"><input type="checkbox" value="看護工不得擅自調換工作崗位或委託他人代班" checked><span class="check-label">不得擅自代班<span class="check-sub">需雇主同意</span></span></label>
          <label class="check-item"><input type="checkbox" value="被照顧者緊急狀況時，看護工應立即通知雇主，不得超過10分鐘" checked><span class="check-label">緊急通報時限<span class="check-sub">10分鐘內通知</span></span></label>
          <label class="check-item"><input type="checkbox" value="合約期間如需中途終止，應提前30日書面通知"><span class="check-label">提前終止通知<span class="check-sub">提前30日書面</span></span></label>
          <label class="check-item"><input type="checkbox" value="看護工不得借款於雇主或雇主家屬" checked><span class="check-label">不得借款<span class="check-sub">禁止向雇主借貸</span></span></label>
          <label class="check-item"><input type="checkbox" value="合約爭議以中華民國法律為準據法，並以雇主戶籍地法院為第一審管轄法院"><span class="check-label">爭議管轄約定<span class="check-sub">適用中華民國法律</span></span></label>
        </div>
        <div class="form-group" style="margin-top:1rem;">
          <label><span class="label-zh" data-key="specialNote">自訂特別條款（自填）</span></label>
          <textarea id="specialNote" placeholder="請輸入自訂條款，每項請換行…" style="min-height:80px;"></textarea>
        </div>
      </div>
    </div>

  </div><!-- end content -->
</div><!-- end main-wrap -->

<div class="action-bar">
  <button class="btn btn-primary" onclick="generateContract()">📄 產生合約預覽</button>
  <button class="btn btn-outline" onclick="window.print()">🖨️ 列印 / 儲存PDF</button>
  <button class="btn btn-danger" onclick="resetForm()">↺ 清除重填</button>
  <span style="font-size:0.8rem; color:var(--muted); margin-left:auto;">※ 本工具產生之合約草稿，請依實際情況調整後再使用</span>
</div>

<!-- Preview Modal -->
<div class="preview-modal" id="previewModal">
  <div class="preview-box">
    <div class="preview-header">
      <h2>合約預覽 / Contract Preview</h2>
      <div style="display:flex;gap:8px;">
        <button onclick="window.print()">🖨️ 列印</button>
        <button onclick="closePreview()">✕ 關閉</button>
      </div>
    </div>
    <div class="preview-content" id="previewContent"></div>
  </div>
</div>

<script>
var currentLang = 'zh';

var labels = {
  zh: {
    nav1:'當事人資訊', nav2:'被照顧者', nav3:'工作內容', nav4:'薪資休假', nav5:'紀律規範', nav6:'特別條款',
    sec1title:'當事人資訊', sec2title:'被照顧者資訊', sec3title:'工作內容', sec4title:'薪資與休假', sec5title:'紀律規範', sec6title:'特別條款',
  },
  en: {
    nav1:'Parties Info', nav2:'Care Recipient', nav3:'Work Scope', nav4:'Pay & Leave', nav5:'Discipline', nav6:'Special Terms',
    sec1title:'Parties Information', sec2title:'Care Recipient', sec3title:'Work Scope', sec4title:'Pay & Leave', sec5title:'Discipline', sec6title:'Special Terms',
  },
  id: {
    nav1:'Info Pihak', nav2:'Penerima Rawat', nav3:'Lingkup Kerja', nav4:'Gaji & Cuti', nav5:'Disiplin', nav6:'Syarat Khusus',
    sec1title:'Informasi Pihak', sec2title:'Penerima Perawatan', sec3title:'Lingkup Kerja', sec4title:'Gaji & Cuti', sec5title:'Peraturan Disiplin', sec6title:'Syarat Khusus',
  },
  vi: {
    nav1:'Thông tin Các Bên', nav2:'Người Được Chăm', nav3:'Nội Dung Công Việc', nav4:'Lương & Nghỉ', nav5:'Kỷ Luật', nav6:'Điều Khoản Đặc Biệt',
    sec1title:'Thông Tin Các Bên', sec2title:'Thông Tin Người Được Chăm Sóc', sec3title:'Nội Dung Công Việc', sec4title:'Tiền Lương & Nghỉ Phép', sec5title:'Quy Định Kỷ Luật', sec6title:'Điều Khoản Đặc Biệt',
  }
};

var headerSubs = {
  zh:'外籍看護補充合約製作工具',
  en:'Foreign Caregiver Supplemental Contract Builder',
  id:'Alat Pembuat Kontrak Tambahan Pengasuh Asing',
  vi:'Công Cụ Soạn Hợp Đồng Bổ Sung Người Chăm Sóc Nước Ngoài'
};

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active', b.textContent.includes({zh:'中文',en:'中英',id:'中印',vi:'中越'}[lang]));
  });
  document.getElementById('headerSub').textContent = headerSubs[lang];
  var map = labels[lang] || labels.zh;
  Object.keys(map).forEach(function(k){
    document.querySelectorAll('[data-key="'+k+'"]').forEach(function(el){
      el.textContent = map[k];
    });
  });
  var enVis = lang !== 'zh';
  document.querySelectorAll('.label-en').forEach(function(el){ el.style.display = enVis && lang==='en' ? 'block':'none'; });
  document.querySelectorAll('.label-id').forEach(function(el){ el.style.display = lang==='id' ? 'block':'none'; });
  document.querySelectorAll('.label-vi').forEach(function(el){ el.style.display = lang==='vi' ? 'block':'none'; });
}

function v(id){ return (document.getElementById(id)||{}).value||''; }

function getChecked(containerId) {
  var items = [];
  var container = document.getElementById(containerId) || document.querySelector('#'+containerId);
  var checks = document.getElementById(containerId)
    ? document.getElementById(containerId).querySelectorAll('input[type=checkbox]')
    : [];
  if (!checks.length) {
    document.querySelectorAll('#'+containerId+' input[type=checkbox]').forEach(function(c){ if(c.checked) items.push(c.value); });
    return items;
  }
  checks.forEach(function(c){ if(c.checked) items.push(c.value); });
  return items;
}

function getAllChecked(selector){
  var items = [];
  document.querySelectorAll(selector+' input[type=checkbox]').forEach(function(c){ if(c.checked && c.value) items.push(c.value); });
  return items;
}

function getBenefits(){
  var list = [];
  if(document.getElementById('benFood').checked) list.push('提供三餐');
  if(document.getElementById('benRoom').checked) list.push('提供住宿');
  if(document.getElementById('benInsurance').checked) list.push('全民健保（雇主代繳）');
  if(document.getElementById('benLabor').checked) list.push('勞工保險（雇主代繳）');
  if(document.getElementById('benBonus').checked) list.push('年終獎金（視表現）');
  if(document.getElementById('benPhone').checked) list.push('提供手機門號（限家用）');
  return list;
}

function closePreview(){ document.getElementById('previewModal').classList.remove('open'); }

function generateContract(){
  var d = {
    contractDate: v('contractDate'),
    contractStart: v('contractStart'),
    contractEnd: v('contractEnd'),
    empName: v('empName')||'＿＿＿',
    empId: v('empId')||'＿＿＿＿＿＿',
    empAddr: v('empAddr')||'＿＿＿＿＿＿',
    workAddr: v('workAddr')||v('empAddr')||'＿＿＿＿＿＿',
    empPhone: v('empPhone')||'＿＿＿',
    nurseName: v('nurseName')||'＿＿＿',
    nursePassport: v('nursePassport')||'＿＿＿',
    nurseNation: v('nurseNation')||'＿＿',
    nurseARC: v('nurseARC')||'＿＿＿',
    nurseGender: v('nurseGender')||'女',
    careName: v('careName')||'＿＿＿',
    careAge: v('careAge')||'＿＿',
    careRelation: v('careRelation')||'＿＿',
    careMobility: v('careMobility')||'＿＿',
    careDisease: v('careDisease')||'＿＿＿',
    careNote: v('careNote')||'無',
    workItems: getAllChecked('#sec3'),
    workOther: v('workOther'),
    salary: v('salary')||'＿＿＿',
    payDay: v('payDay')||'＿＿',
    restDays: v('restDays')||'4',
    payMethod: v('payMethod')||'現金',
    overTime: v('overTime')||'依勞基法規定',
    benefits: getBenefits(),
    disciplineItems: getAllChecked('#sec5'),
    penalty: v('penalty')||'30,000',
    disciplineNote: v('disciplineNote')||'無',
    specialItems: getAllChecked('#sec6'),
    specialNote: v('specialNote'),
  };

  var html = buildZH(d);
  if(currentLang === 'en') html += buildEN(d);
  if(currentLang === 'id') html += buildID(d);
  if(currentLang === 'vi') html += buildVI(d);

  document.getElementById('previewContent').innerHTML = html;
  document.getElementById('previewModal').classList.add('open');
}

function infoRow(label, value){
  return '<tr><td>'+label+'</td><td>'+value+'</td></tr>';
}

function buildZH(d){
  var workList = d.workItems.map(function(i){ return '（'+'\u25cf'+'）'+i; }).join('<br>');
  if(d.workOther) workList += '<br>（其他）'+d.workOther;
  var disciplineList = d.disciplineItems.map(function(i,n){ return (n+1)+'、'+i; }).join('<br>');
  if(d.disciplineNote && d.disciplineNote !== '無') disciplineList += '<br>其他：'+d.disciplineNote;
  var specialList = d.specialItems.map(function(i,n){ return '第'+(n+1)+'條、'+i; }).join('<br>');
  if(d.specialNote) specialList += '<br>'+d.specialNote.split('\n').map(function(l,n){ return '第'+(d.specialItems.length+n+1)+'條、'+l; }).join('<br>');

  return '<div class="contract-doc">'
    +'<h1>外籍看護工補充合約書</h1>'
    +'<p class="contract-sub">Supplemental Employment Contract for Foreign Caregiver</p>'
    +'<table class="info-table"><tbody>'
    +infoRow('簽訂日期', d.contractDate||'＿＿＿年＿＿月＿＿日')
    +infoRow('合約期間', (d.contractStart||'＿＿＿') + ' 至 ' + (d.contractEnd||'＿＿＿'))
    +'</tbody></table>'
    +'<table class="info-table"><tbody>'
    +'<tr><td colspan="2" style="background:#e8effa;font-weight:700;">甲方（雇主）</td></tr>'
    +infoRow('姓名', d.empName)
    +infoRow('身分證字號', d.empId)
    +infoRow('戶籍地址', d.empAddr)
    +infoRow('照護地點', d.workAddr)
    +infoRow('聯絡電話', d.empPhone)
    +'<tr><td colspan="2" style="background:#e8effa;font-weight:700;">乙方（看護工）</td></tr>'
    +infoRow('姓名', d.nurseName)
    +infoRow('國籍', d.nurseNation)
    +infoRow('護照號碼', d.nursePassport)
    +infoRow('居留證號', d.nurseARC)
    +'</tbody></table>'
    +'<div class="clause"><span class="clause-num">第一條 被照顧者</span><br>被照顧者：'+d.careName+'，年齡'+d.careAge+'歲，與雇主關係為'+d.careRelation+'。行動能力：'+d.careMobility+'。主要疾病狀況：'+d.careDisease+'。特殊需求：'+d.careNote+'。</div>'
    +'<div class="clause"><span class="clause-num">第二條 工作範圍</span><br>乙方同意執行以下照護工作：<br>'+workList+'</div>'
    +'<div class="clause"><span class="clause-num">第三條 薪資與福利</span><br>月薪新台幣 <strong>'+d.salary+'</strong> 元整，每月'+d.payDay+'日以'+d.payMethod+'方式給付。每月例假'+d.restDays+'天。加班費：'+d.overTime+'。<br>其他福利：'+d.benefits.join('、')+'。</div>'
    +'<div class="clause"><span class="clause-num">第四條 紀律規範</span><br>'+disciplineList+'<br>如違反上述規定，乙方應賠償違約金新台幣 '+d.penalty+' 元整。</div>'
    +'<div class="clause"><span class="clause-num">第五條 特別條款</span><br>'+(specialList||'雙方另無特別約定。')+'</div>'
    +'<div class="clause"><span class="clause-num">第六條 其他</span><br>本合約如有未盡事宜，依中華民國勞動基準法及相關法規辦理。本合約一式二份，甲、乙各執一份，雙方簽字後生效。</div>'
    +'<div class="sign-row">'
    +'<div class="sign-block">甲方（雇主）簽名<br><br><br>'+d.empName+'<br>日期：__________</div>'
    +'<div class="sign-block">乙方（看護工）簽名<br><br><br>'+d.nurseName+'<br>日期：__________</div>'
    +'</div>'
    +'</div>';
}

function buildEN(d){
  var workList = d.workItems.map(function(i){ return '• '+i; }).join('<br>');
  return '<div class="lang-block"><h3>── English Version ──</h3>'
    +'<div class="contract-doc">'
    +'<h1>Supplemental Employment Contract</h1>'
    +'<p class="contract-sub">外籍看護工補充合約書（英文對照）</p>'
    +'<table class="info-table"><tbody>'
    +infoRow('Contract Date', d.contractDate)
    +infoRow('Contract Period', d.contractStart + ' to ' + d.contractEnd)
    +'<tr><td colspan="2" style="background:#e8effa;font-weight:700;">Party A (Employer)</td></tr>'
    +infoRow('Name', d.empName)
    +infoRow('ID No.', d.empId)
    +infoRow('Address', d.empAddr)
    +infoRow('Work Location', d.workAddr)
    +'<tr><td colspan="2" style="background:#e8effa;font-weight:700;">Party B (Caregiver)</td></tr>'
    +infoRow('Name', d.nurseName)
    +infoRow('Nationality', d.nurseNation)
    +infoRow('Passport No.', d.nursePassport)
    +'</tbody></table>'
    +'<div class="clause"><span class="clause-num">Article 1 – Care Recipient</span><br>The care recipient is '+d.careName+', aged '+d.careAge+', '+d.careRelation+' of Party A. Mobility: '+d.careMobility+'. Condition: '+d.careDisease+'.</div>'
    +'<div class="clause"><span class="clause-num">Article 2 – Scope of Work</span><br>Party B agrees to perform the following care duties:<br>'+workList+'</div>'
    +'<div class="clause"><span class="clause-num">Article 3 – Salary & Benefits</span><br>Monthly salary: NTD <strong>'+d.salary+'</strong>, paid on the '+d.payDay+'th of each month via '+d.payMethod+'. Rest days: '+d.restDays+' days/month. Benefits: '+d.benefits.join(', ')+'.</div>'
    +'<div class="clause"><span class="clause-num">Article 4 – Discipline</span><br>'+d.disciplineItems.map(function(i){ return '• '+i; }).join('<br>')+'<br>Breach penalty: NTD '+d.penalty+'.</div>'
    +'<div class="clause"><span class="clause-num">Article 5 – Special Terms</span><br>'+(d.specialItems.map(function(i,n){ return (n+1)+'. '+i; }).join('<br>')||'No additional terms.')+'</div>'
    +'<div class="clause"><span class="clause-num">Article 6 – General</span><br>Disputes shall be governed by the laws of the Republic of China. This contract is made in duplicate; each party retains one copy. This contract becomes effective upon signature by both parties.</div>'
    +'<div class="sign-row">'
    +'<div class="sign-block">Party A (Employer) Signature<br><br><br>'+d.empName+'<br>Date: __________</div>'
    +'<div class="sign-block">Party B (Caregiver) Signature<br><br><br>'+d.nurseName+'<br>Date: __________</div>'
    +'</div></div></div>';
}

function buildID(d){
  return '<div class="lang-block"><h3>── Versi Bahasa Indonesia ──</h3>'
    +'<div class="contract-doc">'
    +'<h1>Kontrak Kerja Tambahan Pengasuh Asing</h1>'
    +'<p class="contract-sub">外籍看護工補充合約書（印尼文對照）</p>'
    +'<table class="info-table"><tbody>'
    +infoRow('Tanggal Kontrak', d.contractDate)
    +infoRow('Periode Kontrak', d.contractStart + ' s/d ' + d.contractEnd)
    +'<tr><td colspan="2" style="background:#e8effa;font-weight:700;">Pihak A (Pemberi Kerja)</td></tr>'
    +infoRow('Nama', d.empName)
    +infoRow('No. KTP', d.empId)
    +infoRow('Alamat', d.empAddr)
    +'<tr><td colspan="2" style="background:#e8effa;font-weight:700;">Pihak B (Pengasuh)</td></tr>'
    +infoRow('Nama', d.nurseName)
    +infoRow('Kewarganegaraan', d.nurseNation)
    +infoRow('No. Paspor', d.nursePassport)
    +'</tbody></table>'
    +'<div class="clause"><span class="clause-num">Pasal 1 – Penerima Perawatan</span><br>Penerima perawatan adalah '+d.careName+', usia '+d.careAge+' tahun, '+d.careRelation+' dari Pihak A. Mobilitas: '+d.careMobility+'. Kondisi: '+d.careDisease+'.</div>'
    +'<div class="clause"><span class="clause-num">Pasal 2 – Lingkup Pekerjaan</span><br>Pihak B setuju untuk melaksanakan tugas perawatan berikut:<br>'+d.workItems.map(function(i){ return '• '+i; }).join('<br>')+'</div>'
    +'<div class="clause"><span class="clause-num">Pasal 3 – Gaji & Tunjangan</span><br>Gaji bulanan: NTD <strong>'+d.salary+'</strong>, dibayarkan pada tanggal '+d.payDay+' setiap bulan melalui '+d.payMethod+'. Hari libur: '+d.restDays+' hari/bulan. Tunjangan: '+d.benefits.join(', ')+'.</div>'
    +'<div class="clause"><span class="clause-num">Pasal 4 – Peraturan Disiplin</span><br>'+d.disciplineItems.map(function(i){ return '• '+i; }).join('<br>')+'<br>Denda pelanggaran: NTD '+d.penalty+'.</div>'
    +'<div class="clause"><span class="clause-num">Pasal 5 – Syarat Khusus</span><br>'+(d.specialItems.map(function(i,n){ return (n+1)+'. '+i; }).join('<br>')||'Tidak ada syarat tambahan.')+'</div>'
    +'<div class="clause"><span class="clause-num">Pasal 6 – Umum</span><br>Perselisihan diatur oleh hukum Republik Tiongkok. Kontrak ini dibuat rangkap dua; masing-masing pihak menyimpan satu salinan dan berlaku setelah ditandatangani kedua pihak.</div>'
    +'<div class="sign-row">'
    +'<div class="sign-block">Pihak A (Pemberi Kerja)<br><br><br>'+d.empName+'<br>Tanggal: __________</div>'
    +'<div class="sign-block">Pihak B (Pengasuh)<br><br><br>'+d.nurseName+'<br>Tanggal: __________</div>'
    +'</div></div></div>';
}

function resetForm(){
  if(!confirm('確定要清除所有填寫內容？')) return;
  document.querySelectorAll('input[type=text], input[type=date], input[type=number], select, textarea').forEach(function(el){ el.value=''; });
  document.querySelectorAll('input[type=checkbox]').forEach(function(el){ el.checked=false; });
}

document.getElementById('previewModal').addEventListener('click', function(e){
  if(e.target === this) closePreview();
});

var navLinks = document.querySelectorAll('.sidebar-nav a');
navLinks.forEach(function(link){
  link.addEventListener('click', function(){
    navLinks.forEach(function(l){ l.classList.remove('active'); });
    link.classList.add('active');
  });
});
</script>
