<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="料理基礎學習平台 v0.29 — 多語言廚藝入門，圖文並茂，自由學習無關卡無證書">
<title>料理基礎學習平台 v0.29</title>
<link rel="preconnect" href="https://gs.jurieo.com/gemini/fonts-googleapis">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.19.0/webfont/tabler-icons.min.css">
<style>
/* ── Design tokens (GitHub Pages standalone mode) ── */
:root{
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  --color-text-primary: #1a1a1a;
  --color-text-secondary: #555;
  --color-text-tertiary: #888;
  --color-text-success: #1a7248;
  --color-text-danger: #c0392b;
  --color-background-primary: #fff;
  --color-background-secondary: #f6f6f6;
  --color-background-tertiary: #f0f0f0;
  --color-background-success: #e8f5ee;
  --color-background-danger: #fdecea;
  --color-border-primary: #aaa;
  --color-border-secondary: #d0d0d0;
  --color-border-tertiary: #e8e8e8;
  --color-border-success: #b2dfcc;
  --color-border-danger: #f5c6c2;
  --border-radius-sm: 4px;
  --border-radius-md: 6px;
  --border-radius-lg: 10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --color-text-primary: #f0f0f0;
    --color-text-secondary: #aaa;
    --color-text-tertiary: #777;
    --color-text-success: #4caf82;
    --color-text-danger: #e57373;
    --color-background-primary: #1e1e1e;
    --color-background-secondary: #252525;
    --color-background-tertiary: #2c2c2c;
    --color-background-success: #1a3328;
    --color-background-danger: #3b1a1a;
    --color-border-primary: #555;
    --color-border-secondary: #3a3a3a;
    --color-border-tertiary: #2e2e2e;
    --color-border-success: #2a5c40;
    --color-border-danger: #5c2a2a;
  }
}
html,body{margin:0;padding:0;background:var(--color-background-secondary);min-height:100vh}
body{display:flex;justify-content:center;padding:16px}
.platform-wrapper{width:100%;max-width:980px}

</style>
</head>
<body>
<div class="platform-wrapper">
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">料理基礎學習平台 v0.25 — 自由點選課程，無關卡無證書</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:14px;color:var(--color-text-primary);line-height:1.6}
.platform{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}

/* ── device bar ── */
.dbar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);flex-wrap:wrap}
.dbar-lbl{font-size:11px;color:var(--color-text-tertiary);letter-spacing:.3px}
.dvb{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:5px 11px;cursor:pointer;font-size:11.5px;color:var(--color-text-secondary);font-family:var(--font-sans);display:flex;align-items:center;gap:5px;transition:all .15s}
.dvb:hover{background:var(--color-background-secondary);border-color:var(--color-border-primary)}
.dvb.on{background:#5a1800;border-color:#5a1800;color:#fff;font-weight:500}
.dbgap{flex:1}
.dbadge{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--color-text-tertiary);padding:4px 0}

/* ── topbar ── */
.topbar{background:linear-gradient(135deg,#4a1200 0%,#6b2000 100%);padding:0 16px;display:flex;align-items:center;gap:10px;height:56px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.tlogo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tico{width:36px;height:36px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:var(--border-radius-lg);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tnm{font-size:14px;font-weight:600;color:#fff;letter-spacing:-.1px}
.tsub{font-size:10px;opacity:.5;color:#fff;letter-spacing:.2px;margin-top:1px}
.tsp{flex:1}
.tnav{display:flex;gap:1px;background:rgba(0,0,0,.18);padding:4px;border-radius:var(--border-radius-lg);border:1px solid rgba(255,255,255,.08)}
.tnb{background:none;border:none;color:rgba(255,255,255,.65);padding:5px 12px;border-radius:var(--border-radius-md);cursor:pointer;font-size:12px;font-family:var(--font-sans);white-space:nowrap;transition:all .18s;display:flex;align-items:center;gap:5px;line-height:1}
.tnb i{font-size:13px;opacity:.8}
.tnb:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.tnb.act{background:rgba(255,255,255,.18);color:#fff;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlang{display:flex;background:rgba(0,0,0,.2);border-radius:var(--border-radius-md);overflow:hidden;border:1px solid rgba(255,255,255,.12);flex-shrink:0}
.tlb{background:none;border:none;color:rgba(255,255,255,.55);padding:5px 9px;cursor:pointer;font-size:11px;font-family:var(--font-sans);transition:all .15s;white-space:nowrap;line-height:1}
.tlb:hover{color:#fff;background:rgba(255,255,255,.08)}
.tlb.on{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.thmb{background:none;border:none;color:#fff;cursor:pointer;padding:6px;border-radius:var(--border-radius-md);display:none;align-items:center;justify-content:center;transition:background .15s}
.thmb:hover{background:rgba(255,255,255,.15)}

/* ── hero ── */
.hero{background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);padding:18px 20px 14px}
.hero-row{display:flex;align-items:flex-start;gap:14px}
.hero-ico{width:52px;height:52px;background:linear-gradient(135deg,#5a1800,#8a3000);border-radius:var(--border-radius-lg);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 2px 8px rgba(90,24,0,.25)}
.hero-text{flex:1;min-width:0}
.hero h1{font-size:16px;font-weight:600;color:var(--color-text-primary);line-height:1.3;letter-spacing:-.2px}
.hero-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:3px;letter-spacing:.2px}
.hero-desc{font-size:12px;color:var(--color-text-secondary);margin-top:6px;line-height:1.7}
.hero-stats{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center}
.spill{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:14px;padding:3px 10px;font-size:11.5px;color:var(--color-text-secondary)}
.spill strong{color:var(--color-text-primary);font-weight:600}
/* hero overall progress bar */
.hero-prog-wrap{margin-top:12px;display:flex;align-items:center;gap:10px}
.hero-prog-bar{flex:1;height:5px;background:var(--color-background-tertiary);border-radius:3px;overflow:hidden}
.hero-prog-fill{height:100%;background:linear-gradient(90deg,#8a2800,#c04020);border-radius:3px;transition:width .5s ease}
.hero-prog-label{font-size:11px;color:var(--color-text-secondary);white-space:nowrap;min-width:56px;text-align:right}


/* ── body layout ── */
.body{display:flex;min-height:520px;position:relative}
.sidebar{width:210px;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);flex-shrink:0;transition:all 0.2s ease;display:flex;flex-direction:column}
.sidebar.gone{display:none}
.ss-header{padding:12px 14px 8px;border-bottom:0.5px solid var(--color-border-tertiary)}
.ss-header-title{font-size:10px;font-weight:600;color:var(--color-text-tertiary);letter-spacing:.7px;text-transform:uppercase}
.sslbl{font-size:10px;font-weight:600;color:var(--color-text-tertiary);letter-spacing:.6px;text-transform:uppercase;padding:10px 14px 5px}
.si{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--border-radius-md);cursor:pointer;transition:all .15s;color:var(--color-text-secondary);font-size:12.5px;margin:1px 8px;position:relative}
.si:hover{background:var(--color-background-secondary)}
.si.act{background:rgba(90,24,0,.08);color:#8a2800}
.si.sdone{color:var(--color-text-success)}
.si i{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.si .sbadge{margin-left:auto;background:var(--color-background-secondary);border-radius:8px;padding:1px 6px;font-size:10px;color:var(--color-text-secondary);flex-shrink:0}
.si.act .sbadge{background:rgba(90,24,0,.12);color:#8a2800}
.si.sdone .sbadge{background:rgba(26,114,72,.12);color:#1a7248}
/* sidebar mini progress dot */
.si .sprogdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-left:auto}
.si-emoji{font-size:13px;flex-shrink:0;width:18px;text-align:center}
.si-sub{font-size:9.5px;color:var(--color-text-tertiary);margin-top:1px}
.sdiv{height:0.5px;background:var(--color-border-tertiary);margin:6px 12px}
/* sidebar tools at bottom */
.ss-tools{margin-top:auto;border-top:0.5px solid var(--color-border-tertiary);padding:8px 0 6px}

/* ── content area ── */
.content{flex:1;padding:16px;background:var(--color-background-secondary);min-width:0;overflow:hidden}

/* section headers */
.sechd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sechd h2{font-size:11px;font-weight:600;color:var(--color-text-tertiary);white-space:nowrap;letter-spacing:.6px;text-transform:uppercase}
.sechd .ln{flex:1;height:0.5px;background:var(--color-border-tertiary)}

/* ── language grid ── */
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:18px}
.lcard{background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:10px 10px 9px;cursor:pointer;transition:all .18s;text-align:center;position:relative}
.lcard:hover{border-color:var(--color-border-primary);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.lcard.on{border:1.5px solid #8a2800;background:rgba(90,24,0,.03);box-shadow:0 0 0 3px rgba(138,40,0,.06)}
.lcard.on::after{content:'✓';position:absolute;top:7px;right:9px;font-size:10px;color:#8a2800;font-weight:700}
.lcard .flag{font-size:22px;margin-bottom:5px;line-height:1}
.lcard .lname{font-size:12.5px;font-weight:600;color:var(--color-text-primary)}
.lcard .lsub{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}

/* ── module grid ── */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:18px}
.mcard{background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:12px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.mcard:hover{border-color:var(--color-border-primary);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.mcard.actm{border:1.5px solid #8a2800;background:rgba(90,24,0,.02);box-shadow:0 0 0 3px rgba(138,40,0,.05)}
.mcard.mdone{border-color:rgba(26,114,72,.4);background:rgba(26,114,72,.01)}
.mcheck{position:absolute;top:9px;right:9px;font-size:14px;color:#1a7248}
.memoji{font-size:22px;margin-bottom:6px;line-height:1}
.mtitle{font-size:12.5px;font-weight:600;color:var(--color-text-primary);line-height:1.3}
.men{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}
.mlvl{display:inline-block;font-size:9.5px;color:var(--color-text-tertiary);background:var(--color-background-secondary);border-radius:4px;padding:1px 5px;margin-top:5px;border:0.5px solid var(--color-border-tertiary)}
.mcnt{font-size:11px;color:var(--color-text-secondary);margin-top:6px}
.mbar{height:3px;background:var(--color-background-tertiary);border-radius:2px;margin-top:7px;overflow:hidden}
.mfill{height:100%;background:#8a2800;border-radius:2px;transition:width .4s ease}
.mfill.full{background:#1a7248}

/* lesson & topics */
.lesson{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:14px}
.leshd{background:#5a1800;padding:13px 14px;display:flex;align-items:center;gap:11px}
.lesico{width:40px;height:40px;background:rgba(255,255,255,.15);border:0.5px solid rgba(255,255,255,.25);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.leshd h3{font-size:13px;font-weight:500;color:#fff;line-height:1.3}
.lessub{font-size:10px;opacity:.7;color:#fff;margin-top:1px}
.leschips{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.17);border:0.5px solid rgba(255,255,255,.22);border-radius:10px;padding:2px 8px;font-size:10px;color:#fff}
.lesbody{padding:12px 14px}
.topics{display:flex;flex-direction:column;gap:7px}
.trow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);cursor:pointer;transition:all .15s}
.trow:hover{background:var(--color-background-primary);border-color:var(--color-border-secondary)}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-done{background:#1a7248}.dot-cur{background:#8a2800}.dot-next{background:var(--color-border-primary)}
.ttxt{font-size:12px;color:var(--color-text-primary);line-height:1.4}
.ten{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}
.ttag{font-size:10px;padding:2px 7px;border-radius:6px;margin-left:auto;white-space:nowrap;flex-shrink:0;min-width:44px;text-align:center}
.tag-done{background:var(--color-background-success);color:var(--color-text-success)}
.tag-cur{background:rgba(138,40,0,.1);color:#8a2800}
.tag-nx{background:var(--color-background-secondary);color:var(--color-text-tertiary);border:0.5px solid var(--color-border-tertiary)}

/* safety */
.safepanel{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:14px}
.safehd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.safehd i{font-size:16px;color:var(--color-text-danger)}
.safehd .shtitle{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.safehd .shen{font-size:10px;color:var(--color-text-tertiary);margin-left:auto}
.safebody{padding:9px 12px}
.saferow{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
.saferow:last-child{border-bottom:none}
.saferow i{font-size:15px;flex-shrink:0;margin-top:1px}
.saferow.ok i{color:var(--color-text-success)}
.saferow.no i{color:var(--color-text-danger)}
.stxt{color:var(--color-text-primary)}
.sen{font-size:10px;color:var(--color-text-secondary);margin-top:2px}

/* quiz */
.quiz-wrap{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:16px;margin-bottom:14px}
.quiz-q{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:12px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:7px}
.qopt{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:9px 12px;cursor:pointer;font-size:12px;color:var(--color-text-primary);transition:all .15s;text-align:left;font-family:var(--font-sans);line-height:1.4}
.qopt:hover:not([disabled]){border-color:var(--color-border-primary);background:var(--color-background-primary)}
.qopt.correct{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.qopt.wrong{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}
.quiz-fb{margin-top:10px;font-size:12px;min-height:18px;color:var(--color-text-secondary);padding:0 2px;line-height:1.5}
.quiz-prog{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.quiz-prog-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary)}
.quiz-prog-label{font-size:11px;color:var(--color-text-tertiary);white-space:nowrap}
.quiz-q-counter{font-size:13px;font-weight:600;color:var(--color-text-primary)}
.quiz-q-total{font-size:11px;color:var(--color-text-tertiary)}
.quiz-dots{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.quiz-dot{width:22px;height:6px;border-radius:3px;background:var(--color-background-tertiary);border:0.5px solid var(--color-border-secondary);transition:all .2s;flex-shrink:0}
.quiz-dot.cur{background:#8a2800;border-color:#8a2800}
.quiz-dot.done{background:rgba(138,40,0,.35);border-color:rgba(138,40,0,.3)}
.qptrack{flex:1;height:4px;background:var(--color-background-tertiary);border-radius:2px;overflow:hidden}
.qpfill{height:100%;background:#8a2800;border-radius:2px;transition:width .3s}

/* (certificate styles removed) */

/* ── quick action buttons ── */
.quick{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.qbtn{background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:16px;padding:7px 14px;font-size:12px;color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-sans);transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;font-weight:500}
.qbtn i{font-size:13px;opacity:.7}
.qbtn:hover{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary)}
.qbtn.pri{background:#5a1800;border-color:#5a1800;color:#fff}
.qbtn.pri:hover{background:#7a2200;border-color:#7a2200}
.qbtn.pri i{opacity:.85}

/* knowledge cards */
.kcard{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:14px}
.kcard-hd{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
.kcard-hd i{font-size:16px;color:#8a2800}
.kcard-hd .khtitle{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.kcard-hd .khen{font-size:10px;color:var(--color-text-tertiary);margin-left:auto}
.kcard-body{padding:9px 13px}
.krow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kitem{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:7px 10px;border:0.5px solid var(--color-border-tertiary)}
.kitem .ki-icon{font-size:16px;margin-bottom:3px}
.kitem .ki-title{font-size:11.5px;font-weight:500;color:var(--color-text-primary);line-height:1.35}
.kitem .ki-en{font-size:10px;color:var(--color-text-tertiary);margin-top:1px}
.kitem .ki-desc{font-size:11px;color:var(--color-text-secondary);margin-top:3px;line-height:1.5}
.ktip{background:rgba(90,24,0,.04);border:0.5px solid rgba(90,24,0,.15);border-radius:var(--border-radius-md);padding:7px 10px;margin-top:7px;font-size:11.5px;color:var(--color-text-secondary);line-height:1.6}
.ktip strong{color:#8a2800}
/* visual diagram cards */
.kdiagram{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;margin-bottom:8px;overflow-x:auto}
.kdiagram-title{font-size:11px;font-weight:600;color:#8a2800;letter-spacing:.4px;margin-bottom:8px;text-transform:uppercase}
.kdiagram svg{display:block;max-width:100%;height:auto}
/* visual table */
.kvtable{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:7px}
.kvtable th{background:#5a1800;color:#fff;padding:5px 8px;text-align:left;font-weight:500;font-size:10.5px}
.kvtable td{padding:5px 8px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);vertical-align:top}
.kvtable tr:nth-child(even) td{background:var(--color-background-secondary)}
.kvtable tr:hover td{background:rgba(90,24,0,.04)}
/* step list */
.ksteps{display:flex;flex-direction:column;gap:5px;margin-bottom:7px}
.kstep{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;background:var(--color-background-secondary);border-radius:var(--border-radius-sm);border:0.5px solid var(--color-border-tertiary)}
.kstep-num{width:20px;height:20px;border-radius:50%;background:#5a1800;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.kstep-txt{font-size:11px;color:var(--color-text-secondary);line-height:1.5;flex:1}
.kstep-txt strong{color:var(--color-text-primary);font-size:11.5px}
/* color badge chips */
.kchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}
.kchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:10.5px;font-weight:500;border:1px solid transparent}
/* info highlight box */
.kbox{border-left:3px solid #8a2800;background:rgba(90,24,0,.04);padding:7px 10px;border-radius:0 var(--border-radius-sm) var(--border-radius-sm) 0;margin-bottom:7px;font-size:11.5px;color:var(--color-text-secondary);line-height:1.6}
.kbox.success{border-left-color:#1a7248;background:rgba(26,114,72,.04)}
.kbox.danger{border-left-color:#c0392b;background:rgba(192,57,43,.04)}

/* empty / locked state */
.empty-state{text-align:center;padding:28px 20px;color:var(--color-text-secondary)}
.empty-state i{font-size:38px;display:block;margin-bottom:10px;opacity:.35}
.empty-state .et{font-size:13px;font-weight:500;margin-bottom:5px;color:var(--color-text-primary)}
.empty-state .es{font-size:12px}

/* ── bottom nav ── */
.bnav{display:none;background:var(--color-background-primary);border-top:0.5px solid var(--color-border-tertiary)}
.bninner{display:flex;justify-content:space-around;padding:6px 0 5px}
.bnb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;cursor:pointer;color:var(--color-text-tertiary);font-size:10.5px;font-family:var(--font-sans);border-radius:var(--border-radius-md);transition:all .15s;min-width:52px}
.bnb i{font-size:22px}
.bnb:hover,.bnb.act{color:#8a2800}

/* ── footer ── */
.footer{background:var(--color-background-primary);border-top:0.5px solid var(--color-border-tertiary);padding:9px 18px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--color-text-tertiary);flex-wrap:wrap;gap:4px}

/* topic done toggle */
.ttick{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--color-border-secondary);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;cursor:pointer;transition:all .2s;background:var(--color-background-secondary);margin-left:6px}
.ttick.checked{background:#1a7248;border-color:#1a7248;color:#fff}

/* lesson tabs */
.les-tabs{display:flex;gap:0;border-bottom:0.5px solid var(--color-border-tertiary);margin:-12px -14px 12px;padding:0 14px}
.les-tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;font-size:12px;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font-sans);margin-bottom:-0.5px;transition:all .15s;white-space:nowrap}
.les-tab:hover{color:var(--color-text-primary)}
.les-tab.act{border-bottom-color:#8a2800;color:#8a2800;font-weight:500}
.les-tabpanel{display:none}
.les-tabpanel.act{display:block}

/* ── Responsive Shell overrides ── */
.shell.mobile .sidebar, .shell.tablet .sidebar { display: none; width: 100%; position: absolute; left: 0; top: 0; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,.12); border-right: none; border-bottom: 0.5px solid var(--color-border-tertiary); }
.shell.mobile .sidebar.open, .shell.tablet .sidebar.open { display: flex !important; }

   {q:{zh:'砧板使用完畢後，正確的清潔方式是？',en:'After using a cutting board, what is the correct cleaning method?',id:'Setelah menggunakan talenan, cara pembersihan yang benar adalah?',vi:'Sau khi dùng thớt, cách vệ sinh đúng là?'},
    opts:[{zh:'直接浸泡在水中，方便下次使用',en:'Soak in water so it is ready for next time',id:'Rendam dalam air agar siap digunakan lagi',vi:'Ngâm trong nước cho tiện dùng lần sau',ok:false},

    opts:[{zh:'同一塊砧板依序使用，用完後一起洗',en:'Use the same board for all, then wash at the end',id:'Gunakan talenan yang sama untuk semua, lalu cuci di akhir',vi:'Dùng chung một thớt, rửa sau khi dùng xong tất cả',ok:false},

   {q:{zh:'蒸食物時，通常需要等水沸騰後再放入食材，這樣做的目的是？',en:'When steaming, why should you put food in after the water boils?',id:'Saat mengukus, mengapa makanan dimasukkan setelah air mendidih?',vi:'Khi hấp, tại sao nên cho thức ăn vào sau khi nước sôi?'},

   {q:{zh:'中火最適合哪一種烹調法？',en:'Medium heat is best suited for which cooking method?',id:'Api sedang paling cocok untuk metode memasak apa?',vi:'Lửa vừa phù hợp nhất với phương pháp nấu nào?'},
    opts:[{zh:'快炒青菜（需要大火快速翻炒）',en:'Stir-frying vegetables (needs high heat and speed)',id:'Tumis sayuran (butuh api besar dan cepat)',vi:'Xào rau (cần lửa lớn và nhanh)',ok:false},

   {q:{zh:'快炒蔬菜時，加入少量鹽的最佳時機是？',en:'When stir-frying vegetables, the best time to add a small amount of salt is?',id:'Saat tumis sayuran, kapan waktu terbaik menambahkan garam?',vi:'Khi xào rau, thời điểm tốt nhất để cho muối vào là?'},
    opts:[{zh:'起鍋前最後一刻加入',en:'Right before taking off heat at the very end',id:'Tepat sebelum diangkat dari api di akhir',vi:'Ngay trước khi tắt bếp ở cuối',ok:false},

          {zh:'下鍋前先在蔬菜上撒鹽',en:'Sprinkle salt on the vegetables before they go into the pan',id:'Taburkan garam pada sayuran sebelum dimasukkan ke wajan',vi:'Rắc muối lên rau trước khi cho vào chảo',ok:false}],

   {q:{zh:'生鮮蔬菜放入冰箱前，哪個處理方式最正確？',en:'Before putting fresh vegetables in the refrigerator, which method is most correct?',id:'Sebelum memasukkan sayuran segar ke kulkas, cara mana yang paling benar?',vi:'Trước khi cho rau tươi vào tủ lạnh, cách nào đúng nhất?'},

    fb:{zh:'正確！蔬菜在放入冰箱前不應洗濕，水分殘留會加速腐爛。應以透氣紙張或有孔袋包裝，防止水分散失又避免積濕，要使用時再清洗。',en:'Correct! Vegetables should not be washed before refrigeration — residual moisture accelerates decay. Wrap in breathable paper or perforated bags. Wash just before use.',id:'Benar! Sayuran tidak boleh dicuci sebelum didinginkan. Bungkus dengan kertas atau kantong berlubang.',vi:'Đúng! Không nên rửa rau trước khi cất tủ lạnh — độ ẩm còn lại làm rau mau hỏng. Bọc bằng giấy thoáng. Rửa trước khi dùng.'}},
   {q:{zh:'冰箱中食材的擺放，從上到下正確順序是？',en:'The correct storage order in the refrigerator from top to bottom is?',id:'Urutan penyimpanan di kulkas dari atas ke bawah yang benar adalah?',vi:'Thứ tự cất thực phẩm trong tủ lạnh từ trên xuống dưới đúng là?'},
    opts:[{zh:'熟食→生肉→蔬菜（由上而下）',en:'Cooked food → raw meat → vegetables (top to bottom)',id:'Makanan matang → daging mentah → sayuran (atas ke bawah)',vi:'Thức ăn chín → thịt sống → rau (từ trên xuống)',ok:true},
          {zh:'生肉→熟食→蔬菜（由上而下）',en:'Raw meat → cooked food → vegetables (top to bottom)',id:'Daging mentah → makanan matang → sayuran (atas ke bawah)',vi:'Thịt sống → thức ăn chín → rau (từ trên xuống)',ok:false},
          {zh:'只要放得進去就可以，位置不重要',en:'As long as it fits, placement doesn\'t matter',id:'Selama muat, penempatan tidak penting',vi:'Miễn là vừa là được, vị trí không quan trọng',ok:false}],
    fb:{zh:'正確！冰箱應由上而下擺放：最上層熟食或即食品，中層生肉（避免汁液滴落污染），下層蔬果。',en:'Correct! Fridge order (top to bottom): cooked/ready-to-eat on top, raw meat in the middle (to prevent drip contamination), vegetables below.',id:'Benar! Urutan kulkas (atas ke bawah): makanan matang di atas, daging mentah di tengah, sayuran di bawah.',vi:'Đúng! Thứ tự tủ lạnh từ trên xuống: thức ăn chín trên cùng, thịt sống ở giữa, rau củ ngăn dưới.'}},
   {q:{zh:'食材開封後若沒有用完，最正確的保存方式是？',en:'After opening food that hasn\'t been fully used, what is the most correct storage method?',id:'Setelah membuka makanan yang belum habis, cara penyimpanan yang paling benar adalah?',vi:'Sau khi mở thực phẩm chưa dùng hết, cách bảo quản nào đúng nhất?'},
    opts:[{zh:'繼續放在原包裝袋中不需要額外處理',en:'Keep in original packaging, no extra handling',id:'Simpan di kemasan asli, tidak perlu penanganan ekstra',vi:'Để trong bao bì gốc, không cần xử lý thêm',ok:false},
          {zh:'移入密封容器，標記日期後放入冰箱',en:'Transfer to an airtight container, label with the date, then refrigerate',id:'Pindahkan ke wadah kedap udara, beri label tanggal, lalu simpan di kulkas',vi:'Chuyển vào hộp kín, ghi ngày tháng và cho vào tủ lạnh',ok:true},

    fb:{zh:'正確！開封後應移入密封容器並標記日期，避免交叉污染，也能清楚掌握食材保鮮期限，避免食用過期食品。',en:'Correct! Transfer to an airtight container and label with the date to prevent cross-contamination and track freshness.',id:'Benar! Pindahkan ke wadah kedap udara dan beri label tanggal untuk mencegah kontaminasi silang dan melacak kesegaran.',vi:'Đúng! Chuyển vào hộp kín và ghi ngày để tránh nhiễm chéo và theo dõi độ tươi, tránh ăn nhầm thực phẩm hết hạn.'}},
   {q:{zh:'哪一種食材在室溫下最容易滋生危險細菌？',en:'Which type of food most easily harbors dangerous bacteria at room temperature?',id:'Jenis makanan mana yang paling mudah menumbuhkan bakteri berbahaya pada suhu ruang?',vi:'Loại thực phẩm nào dễ sinh vi khuẩn nguy hiểm nhất ở nhiệt độ phòng?'},
    opts:[{zh:'水果',en:'Fruit',id:'Buah-buahan',vi:'Trái cây',ok:false},
          {zh:'含蛋白質的食品（如熟肉、乳製品、蛋製品）',en:'Protein-rich foods (e.g., cooked meat, dairy, egg products)',id:'Makanan kaya protein (seperti daging matang, susu, produk telur)',vi:'Thực phẩm giàu đạm (như thịt chín, sữa, sản phẩm trứng)',ok:true},
          {zh:'乾燥的麵粉或糖',en:'Dry flour or sugar',id:'Tepung atau gula kering',vi:'Bột hoặc đường khô',ok:false}],
    fb:{zh:'正確！蛋白質豐富的食品（熟肉、乳製品、蛋製品）在危險溫度帶（5–60°C）中最容易滋生致病細菌，應儘快冷藏或加熱食用，不可在室溫長時間放置。',en:'Correct! Protein-rich foods (cooked meat, dairy, eggs) support the most dangerous bacterial growth in the danger zone (5–60°C). Refrigerate or heat promptly; don\'t leave at room temperature for long.',id:'Benar! Makanan kaya protein (daging matang, susu, telur) mendukung pertumbuhan bakteri paling berbahaya di zona bahaya (5–60°C).',vi:'Đúng! Thực phẩm giàu đạm (thịt chín, sữa, trứng) dễ sinh vi khuẩn nguy hiểm nhất trong vùng nhiệt độ nguy hiểm (5–60°C). Phải cất tủ lạnh hoặc hâm nóng ngay.'}}

   {q:{zh:'燉煮（紅燒）料理時，鍋蓋的使用原則是？',en:'When braising, what is the general rule about using a lid?',id:'Saat braising, aturan umum penggunaan penutup panci adalah?',vi:'Khi kho, nguyên tắc chung về việc dùng nắp nồi là gì?'},
    opts:[{zh:'全程開蓋，用大火將湯汁收乾',en:'Keep the lid off throughout and reduce on high heat',id:'Biarkan terbuka sepanjang waktu dan kentalkan dengan api besar',vi:'Để mở nắp suốt quá trình và cô đặc bằng lửa lớn',ok:false},

   {q:{zh:'煎魚時，要避免魚皮黏鍋破裂，最關鍵的技巧是？',en:'When pan-frying fish, the key technique to keep the skin from sticking and tearing is?',id:'Saat menggoreng ikan, teknik kunci untuk mencegah kulit lengket dan robek adalah?',vi:'Khi chiên cá, kỹ thuật quan trọng nhất để tránh da cá dính và rách là gì?'},
    opts:[{zh:'魚皮表面保持濕潤直接下鍋',en:'Keep the fish skin damp and place it straight into the pan',id:'Biarkan kulit ikan basah dan langsung masukkan ke wajan',vi:'Để da cá còn ướt và cho thẳng vào chảo',ok:false},
          {zh:'將魚皮充分擦乾，待鍋與油熱後下鍋且勿過早翻動',en:'Pat the skin completely dry, wait until pan and oil are hot, then avoid flipping too early',id:'Keringkan kulit ikan, tunggu wajan dan minyak panas, lalu jangan dibalik terlalu cepat',vi:'Lau khô kỹ da cá, đợi chảo và dầu đủ nóng rồi mới cho vào, không lật quá sớm',ok:true},
          {zh:'用大火快速連續翻面數次',en:'Use high heat and flip it repeatedly in quick succession',id:'Gunakan api besar dan balik berulang kali dengan cepat',vi:'Dùng lửa lớn và lật liên tục nhiều lần',ok:false}],
    fb:{zh:'正確！魚皮水分在高溫下產生蒸氣造成沾黏與破皮，因此下鍋前須充分擦乾。鍋與油要充分加熱，讓魚皮先煎至定型、邊緣金黃再翻面，過早翻動容易使皮肉分離。',en:'Correct! Moisture on the skin turns to steam causing sticking and tearing — pat dry before cooking. Wait until pan and oil are properly hot; let the skin set and turn golden before flipping.',id:'Benar! Kelembapan kulit berubah menjadi uap menyebabkan lengket — keringkan sebelum dimasak. Tunggu wajan dan minyak panas; biarkan kulit mengeras dan keemasan sebelum dibalik.',vi:'Đúng! Hơi ẩm da cá biến thành hơi nước gây dính và rách — lau khô trước. Đợi chảo và dầu đủ nóng; để da định hình và vàng rồi mới lật.'}}

          {zh:'生熟食使用同一塊砧板',en:'Using the same board for raw and cooked food',id:'Menggunakan talenan yang sama untuk makanan mentah dan matang',vi:'Dùng chung thớt cho thực phẩm sống và chín',ok:true},
          {zh:'烹調溫度不足',en:'Insufficient cooking temperature',id:'Suhu memasak tidak cukup',vi:'Nhiệt độ nấu tidak đủ',ok:false}],
    fb:{zh:'正確！生熟同板是最典型的交叉汙染。室溫放置超過2小時屬於「增殖」問題；加熱不足屬「加熱不足」問題。四大原因：汙染、增殖、加熱不足、個人衛生不良。',en:'Correct! Sharing boards is classic contamination. Leaving food at room temp over 2 hours is \"proliferation\". The 4 causes: contamination, proliferation, insufficient heating, poor personal hygiene.',id:'Benar! Berbagi talenan adalah kontaminasi. Makanan di suhu ruang lebih dari 2 jam adalah \"proliferasi\". 4 penyebab: kontaminasi, proliferasi, pemanasan tidak cukup, kebersihan buruk.',vi:'Đúng! Dùng chung thớt là ô nhiễm. Để thức ăn ở nhiệt độ phòng hơn 2 giờ là \"sinh sôi\". 4 nguyên nhân: ô nhiễm, sinh sôi, nhiệt không đủ, vệ sinh kém.'}},
   {q:{zh:'食品處理人員應多久洗一次手？',en:'How often should food handlers wash their hands?',id:'Seberapa sering penangan makanan harus mencuci tangan?',vi:'Người chế biến thực phẩm cần rửa tay bao lâu một lần?'},
    opts:[{zh:'每天開始工作前洗一次即可',en:'Once at the beginning of each workday',id:'Sekali di awal setiap hari kerja',vi:'Một lần vào đầu mỗi ngày làm việc',ok:false},
          {zh:'處理食材前後、如廁後、觸摸臉部或頭髮後都應洗手',en:'Before and after handling food, after using the toilet, after touching face or hair',id:'Sebelum dan sesudah menangani makanan, setelah ke toilet, setelah menyentuh wajah atau rambut',vi:'Trước và sau khi xử lý thực phẩm, sau khi vào nhà vệ sinh, sau khi chạm vào mặt hoặc tóc',ok:true},
          {zh:'只需在接觸生肉後洗手',en:'Only after touching raw meat',id:'Hanya setelah menyentuh daging mentah',vi:'Chỉ cần sau khi chạm vào thịt sống',ok:false}],
    fb:{zh:'正確！洗手是食品衛生的基礎。處理食材前後、如廁後、打噴嚏後、觸摸臉部或手機後均應洗手，使用七步驟洗手法確保徹底清潔。',en:'Correct! Handwashing is the foundation of food hygiene. Wash before/after handling food, after using the toilet, sneezing, or touching face/phone. Use the 7-step method.',id:'Benar! Mencuci tangan adalah dasar kebersihan pangan. Cuci sebelum/sesudah menangani makanan, setelah ke toilet, bersin, atau menyentuh wajah.',vi:'Đúng! Rửa tay là nền tảng vệ sinh thực phẩm. Rửa trước/sau khi xử lý thực phẩm, sau khi đi vệ sinh, hắt hơi, hoặc chạm vào mặt.'}},
   {q:{zh:'廚房砧板顏色管理中，紅色砧板通常用於哪類食材？',en:'In kitchen color-coded cutting boards, what is the red board typically used for?',id:'Dalam sistem talenan berwarna, talenan merah biasanya digunakan untuk apa?',vi:'Trong hệ thống thớt phân màu, thớt đỏ thường dùng cho nguyên liệu nào?'},
    opts:[{zh:'蔬菜與水果',en:'Vegetables and fruits',id:'Sayuran dan buah-buahan',vi:'Rau củ và trái cây',ok:false},
          {zh:'生的紅肉（牛、豬）',en:'Raw red meat (beef, pork)',id:'Daging merah mentah (sapi, babi)',vi:'Thịt đỏ sống (bò, heo)',ok:true},
          {zh:'麵包與烘焙品',en:'Bread and baked goods',id:'Roti dan produk bakery',vi:'Bánh mì và các sản phẩm nướng',ok:false}],
    fb:{zh:'正確！國際廚房顏色管理規範：紅色用於生的紅肉（牛、豬）、黃色用於生禽肉、藍色用於生魚海鮮、綠色用於蔬果、白色用於乳製品與麵包。',en:'Correct! International color-coding: red for raw red meat, yellow for raw poultry, blue for raw fish/seafood, green for vegetables/fruit, white for dairy/bread.',id:'Benar! Kode warna internasional: merah untuk daging merah mentah, kuning untuk unggas mentah, biru untuk ikan/seafood mentah, hijau untuk sayuran/buah.',vi:'Đúng! Quy chuẩn màu quốc tế: đỏ cho thịt đỏ sống, vàng cho gia cầm sống, xanh cho cá/hải sản sống, xanh lá cho rau/trái cây.'}},
   {q:{zh:'廚師在工作時，哪項個人衛生習慣最重要？',en:'Which personal hygiene habit is most important for kitchen workers?',id:'Kebiasaan kebersihan pribadi mana yang paling penting bagi pekerja dapur?',vi:'Thói quen vệ sinh cá nhân nào quan trọng nhất với người làm bếp?'},
    opts:[{zh:'每天更換廚師服但不需要戴帽子',en:'Change chef\'s uniform daily but no hat required',id:'Ganti seragam koki setiap hari tapi tidak perlu topi',vi:'Thay đồng phục đầu bếp mỗi ngày nhưng không cần đội mũ',ok:false},
          {zh:'保持指甲短且乾淨，不佩戴首飾，並正確佩戴廚師帽',en:'Keep nails short and clean, remove jewelry, and wear a chef\'s hat properly',id:'Jaga kuku pendek dan bersih, lepas perhiasan, dan pakai topi koki dengan benar',vi:'Giữ móng tay ngắn và sạch, không đeo trang sức và đội mũ đầu bếp đúng cách',ok:true},
          {zh:'只要手部清潔，其他個人衛生不影響食品安全',en:'Hand hygiene alone is sufficient; other personal hygiene doesn\'t affect food safety',id:'Kebersihan tangan saja sudah cukup; kebersihan pribadi lainnya tidak mempengaruhi keamanan pangan',vi:'Chỉ cần vệ sinh tay là đủ; vệ sinh cá nhân khác không ảnh hưởng đến an toàn thực phẩm',ok:false}],
    fb:{zh:'正確！食品從業人員應保持指甲短且無塗指甲油、不佩戴首飾（避免異物掉入食物）、正確佩戴廚師帽（遮住頭髮），是預防物理性污染的重要措施。',en:'Correct! Food workers should keep nails short and unpolished, remove all jewelry, and wear a proper chef\'s hat — all key measures against physical contamination.',id:'Benar! Pekerja pangan harus menjaga kuku pendek tanpa cat, lepas perhiasan, dan pakai topi koki untuk mencegah kontaminasi fisik.',vi:'Đúng! Người làm thực phẩm cần giữ móng tay ngắn không sơn, không đeo trang sức và đội mũ đầu bếp — biện pháp quan trọng ngăn nhiễm vật lý.'}},
   {q:{zh:'冰箱應定期進行哪些衛生管理？',en:'What hygiene maintenance should be done regularly for the refrigerator?',id:'Perawatan kebersihan apa yang harus dilakukan secara teratur untuk kulkas?',vi:'Cần thực hiện vệ sinh định kỳ nào cho tủ lạnh?'},
    opts:[{zh:'只要溫度正常就不需要清理',en:'No cleaning needed as long as temperature is normal',id:'Tidak perlu dibersihkan selama suhu normal',vi:'Không cần vệ sinh miễn là nhiệt độ bình thường',ok:false},
          {zh:'定期清除過期食材、擦拭內壁、確認溫度設定',en:'Regularly remove expired items, wipe the interior, and verify temperature settings',id:'Rutin hapus bahan kedaluwarsa, lap bagian dalam, dan verifikasi pengaturan suhu',vi:'Định kỳ loại bỏ thực phẩm hết hạn, lau bên trong và kiểm tra cài đặt nhiệt độ',ok:true},
          {zh:'每天用熱水沖洗冰箱內部',en:'Rinse the refrigerator interior with hot water every day',id:'Bilas bagian dalam kulkas dengan air panas setiap hari',vi:'Tráng nước nóng bên trong tủ lạnh mỗi ngày',ok:false}],
    fb:{zh:'正確！冰箱衛生管理包含定期清除過期食材、擦拭內壁與隔板，並確認冷藏溫度維持在4°C以下、冷凍在-18°C以下。',en:'Correct! Refrigerator hygiene includes regularly removing expired items, wiping the interior, and verifying fridge stays below 4°C and freezer below -18°C.',id:'Benar! Kebersihan kulkas meliputi hapus bahan kedaluwarsa, lap interior, dan pastikan suhu kulkas di bawah 4°C dan freezer di bawah -18°C.',vi:'Đúng! Vệ sinh tủ lạnh bao gồm loại bỏ thực phẩm hết hạn, lau bên trong và đảm bảo ngăn mát dưới 4°C, ngăn đông dưới -18°C.'}}
  ],
  /* Lv7 菜單規劃 */
  [
   {q:{zh:'均衡飲食中，蔬菜應佔餐盤的多少比例？',en:'In a balanced diet, what proportion of the plate should be vegetables?',id:'Dalam diet seimbang, berapa proporsi sayuran di piring?',vi:'Trong chế độ ăn cân bằng, rau chiếm bao nhiêu phần đĩa?'},
    opts:[{zh:'約1/4',en:'About 1/4',id:'Sekitar 1/4',vi:'Khoảng 1/4',ok:false},
          {zh:'約1/2',en:'About 1/2',id:'Sekitar 1/2',vi:'Khoảng 1/2',ok:true},
          {zh:'約3/4',en:'About 3/4',id:'Sekitar 3/4',vi:'Khoảng 3/4',ok:false}],
    fb:{zh:'正確！蔬菜應佔餐盤約一半，搭配適量蛋白質與全穀類。',en:'Correct! Vegetables should fill about half the plate, with protein and whole grains.',id:'Benar! Sayuran harus mengisi sekitar setengah piring.',vi:'Đúng! Rau nên chiếm khoảng một nửa đĩa.'}},
   {q:{zh:'規劃一週菜單時，應優先考慮哪個因素？',en:'When planning a weekly menu, which factor should be prioritized?',id:'Saat merencanakan menu mingguan, faktor apa yang harus diprioritaskan?',vi:'Khi lên thực đơn tuần, yếu tố nào nên ưu tiên?'},
    opts:[{zh:'只做自己擅長的料理',en:'Only cook what you know',id:'Hanya masak yang Anda kuasai',vi:'Chỉ nấu những gì bạn quen',ok:false},
          {zh:'食材多樣性、季節性與家庭成員需求',en:'Variety, seasonality, and family dietary needs',id:'Variasi, musiman, dan kebutuhan anggota keluarga',vi:'Đa dạng, theo mùa và nhu cầu thành viên gia đình',ok:true},
          {zh:'選擇最便宜的食材',en:'Choose the cheapest ingredients',id:'Pilih bahan yang paling murah',vi:'Chọn nguyên liệu rẻ nhất',ok:false}],

   {q:{zh:'製作採購清單時，最有效率的方式是？',en:'What is the most efficient way to make a shopping list?',id:'Cara paling efisien membuat daftar belanja adalah?',vi:'Cách hiệu quả nhất để lập danh sách mua sắm là?'},
    opts:[{zh:'邊逛超市邊決定買什麼',en:'Decide what to buy while browsing the store',id:'Putuskan apa yang dibeli saat keliling toko',vi:'Quyết định mua gì khi đang ở siêu thị',ok:false},
          {zh:'根據一週菜單，按食材分類列出所需數量',en:'Based on the weekly menu, list quantities organized by food category',id:'Berdasarkan menu mingguan, daftar jumlah yang dibutuhkan berdasarkan kategori bahan',vi:'Dựa vào thực đơn tuần, liệt kê số lượng theo từng loại thực phẩm',ok:true},
          {zh:'只買促銷商品',en:'Only buy items on sale',id:'Hanya beli barang yang diskon',vi:'Chỉ mua hàng đang giảm giá',ok:false}],
    fb:{zh:'正確！先定好菜單再依食材分類列清單，能避免重複購買、漏買，也方便在超市快速找到商品。',en:'Correct! Plan the menu first, then list by category — avoids over-buying, missing items, and speeds up shopping.',id:'Benar! Rencanakan menu dulu, lalu daftar berdasarkan kategori — menghindari pembelian berlebihan.',vi:'Đúng! Lên thực đơn trước, rồi liệt kê theo danh mục — tránh mua thừa, thiếu và mua nhanh hơn.'}},
   {q:{zh:'規劃菜單時，「均衡飲食」的核心概念是？',en:'When planning a menu, what is the core concept of a "balanced diet"?',id:'Saat merencanakan menu, apa konsep inti dari "diet seimbang"?',vi:'Khi lên thực đơn, khái niệm cốt lõi của "chế độ ăn cân bằng" là gì?'},
    opts:[{zh:'每天都吃同一種食物，以確保營養攝取穩定',en:'Eat the same foods every day for consistent nutrition',id:'Makan makanan yang sama setiap hari untuk nutrisi yang konsisten',vi:'Ăn cùng một loại thực phẩm mỗi ngày để đảm bảo dinh dưỡng ổn định',ok:false},
          {zh:'多樣化攝取六大類食物，以適當比例組成每日飲食',en:'Eat a variety of the six food groups in appropriate proportions each day',id:'Makan beragam enam kelompok makanan dalam proporsi yang tepat setiap hari',vi:'Ăn đa dạng sáu nhóm thực phẩm theo tỷ lệ thích hợp mỗi ngày',ok:true},
          {zh:'以低卡路里為主要考量，盡量少吃',en:'Prioritize low calories and eat as little as possible',id:'Prioritaskan kalori rendah dan makan sesedikit mungkin',vi:'Ưu tiên ít calo và ăn càng ít càng tốt',ok:false}],
    fb:{zh:'正確！均衡飲食指的是均衡攝取全穀雜糧類、蔬菜類、水果類、豆魚蛋肉類、乳品類與油脂及堅果種子類六大類食物，且各類比例符合身體需求。',en:'Correct! A balanced diet means eating appropriate amounts from all six food groups: whole grains, vegetables, fruits, protein foods, dairy, and oils/nuts — in proportions suited to the body\'s needs.',id:'Benar! Diet seimbang berarti mengonsumsi jumlah yang tepat dari enam kelompok makanan dalam proporsi yang sesuai dengan kebutuhan tubuh.',vi:'Đúng! Chế độ ăn cân bằng là ăn lượng thích hợp từ sáu nhóm thực phẩm theo tỷ lệ phù hợp với nhu cầu cơ thể.'}},
   {q:{zh:'在預算有限的情況下，如何透過菜單規劃減少餐費支出？',en:'With a limited budget, how can menu planning help reduce food costs?',id:'Dengan anggaran terbatas, bagaimana perencanaan menu membantu mengurangi biaya makanan?',vi:'Với ngân sách hạn chế, lên kế hoạch thực đơn giúp giảm chi phí ăn uống như thế nào?'},
    opts:[{zh:'每天外食，避免在家備料浪費',en:'Eat out every day to avoid wasting food at home',id:'Makan di luar setiap hari untuk menghindari pemborosan bahan di rumah',vi:'Ăn ngoài mỗi ngày để tránh lãng phí thực phẩm ở nhà',ok:false},
          {zh:'提前規劃週菜單，批量採購當季食材，減少食材浪費',en:'Plan the weekly menu in advance, buy seasonal ingredients in bulk, and minimize waste',id:'Rencanakan menu mingguan sebelumnya, beli bahan musiman dalam jumlah besar, dan minimalkan pemborosan',vi:'Lên thực đơn tuần trước, mua nguyên liệu theo mùa số lượng lớn và giảm lãng phí',ok:true},
          {zh:'只買高價食材，品質好代表物超所值',en:'Only buy expensive ingredients — high quality means better value',id:'Hanya beli bahan mahal — kualitas tinggi berarti lebih hemat',vi:'Chỉ mua nguyên liệu đắt tiền — chất lượng cao đồng nghĩa đáng đồng tiền',ok:false}],
    fb:{zh:'正確！提前規劃週菜單，依清單集中採購當季食材，能有效避免衝動購買和食材過期浪費。當季食材通常價格低且新鮮度最佳。',en:'Correct! Planning the weekly menu in advance and buying seasonal ingredients in bulk reduces impulse purchases and food spoilage. Seasonal ingredients are usually the cheapest and freshest.',id:'Benar! Merencanakan menu mingguan dan membeli bahan musiman dalam jumlah besar mengurangi pembelian impulsif dan pemborosan.',vi:'Đúng! Lên thực đơn tuần trước và mua nguyên liệu theo mùa giảm mua bốc đồng và lãng phí. Nguyên liệu theo mùa thường rẻ và tươi nhất.'}},
   {q:{zh:'份量計算時，成人每日建議攝取的蛋白質食物份量大約是？',en:'When calculating portions, approximately how much protein food should an adult consume daily?',id:'Saat menghitung porsi, berapa banyak makanan protein yang harus dikonsumsi orang dewasa setiap hari?',vi:'Khi tính khẩu phần, người lớn nên ăn bao nhiêu thực phẩm giàu đạm mỗi ngày?'},
    opts:[{zh:'每天至少500克',en:'At least 500 g per day',id:'Setidaknya 500 g per hari',vi:'Ít nhất 500 g mỗi ngày',ok:false},
          {zh:'約3–8份，每份約35克（一份相當於大拇指大小）',en:'About 3–8 servings, ~35 g each (roughly thumb-sized)',id:'Sekitar 3–8 porsi, ~35 g per porsi (sekitar ukuran ibu jari)',vi:'Khoảng 3–8 phần, mỗi phần khoảng 35 g (cỡ ngón cái)',ok:true},
          {zh:'每天只需要吃一次，不用特別計算',en:'Once a day is enough, no need to calculate',id:'Sehari sekali sudah cukup, tidak perlu menghitung',vi:'Một lần mỗi ngày là đủ, không cần tính',ok:false}],
    fb:{zh:'正確！依台灣每日飲食指南，成人每日建議攝取3–8份豆魚蛋肉類，每份約35克，依個人體重與活動量調整。菜單規劃時可依此估算食材用量。',en:'Correct! Taiwan\'s dietary guidelines recommend 3–8 daily servings of protein foods for adults, ~35 g each, adjusted for weight and activity. Use this to estimate ingredient amounts when planning.',id:'Benar! Panduan diet Taiwan merekomendasikan 3–8 porsi makanan protein per hari untuk orang dewasa, ~35 g per porsi.',vi:'Đúng! Hướng dẫn dinh dưỡng Đài Loan khuyến nghị 3–8 phần thực phẩm đạm mỗi ngày cho người lớn, ~35 g mỗi phần.'}},
   {q:{zh:'製作一週菜單時，如何確保每天攝取足夠的蔬菜？',en:'When creating a weekly menu, how do you ensure adequate daily vegetable intake?',id:'Saat membuat menu mingguan, bagaimana memastikan asupan sayuran harian yang cukup?',vi:'Khi lên thực đơn tuần, làm thế nào để đảm bảo lượng rau củ đủ mỗi ngày?'},
    opts:[{zh:'只在週末吃大量蔬菜補足',en:'Only eat large amounts of vegetables on weekends to compensate',id:'Hanya makan banyak sayuran di akhir pekan untuk mengimbangi',vi:'Chỉ ăn nhiều rau vào cuối tuần để bù đắp',ok:false},
          {zh:'每餐至少規劃一到兩道蔬菜料理，選用不同顏色蔬菜',en:'Plan at least one to two vegetable dishes per meal using different colored vegetables',id:'Rencanakan setidaknya satu hingga dua hidangan sayuran per makan menggunakan sayuran berbeda warna',vi:'Lên kế hoạch ít nhất một đến hai món rau mỗi bữa, chọn rau nhiều màu khác nhau',ok:true},
          {zh:'每天只吃一種固定蔬菜，確保食材利用最大化',en:'Eat only one fixed vegetable each day to maximize ingredient use',id:'Makan hanya satu sayuran tetap setiap hari untuk memaksimalkan penggunaan bahan',vi:'Chỉ ăn một loại rau cố định mỗi ngày để tối đa hóa việc sử dụng nguyên liệu',ok:false}],
    fb:{zh:'正確！每餐規劃1–2道蔬菜料理，並搭配不同顏色（深綠、橘紅、紫色等）的蔬菜，能確保每日蔬菜攝取量，也能獲得多元的植化素與維生素。',en:'Correct! Planning 1–2 vegetable dishes per meal with a variety of colors (dark green, orange, purple, etc.) ensures adequate daily vegetable intake and diverse phytonutrients and vitamins.',id:'Benar! Merencanakan 1–2 hidangan sayuran per makan dengan berbagai warna memastikan asupan sayuran harian yang cukup dan beragam nutrisi.',vi:'Đúng! Lên kế hoạch 1–2 món rau mỗi bữa với nhiều màu sắc khác nhau đảm bảo lượng rau đủ mỗi ngày và cung cấp đa dạng phytonutrients và vitamin.'}}
