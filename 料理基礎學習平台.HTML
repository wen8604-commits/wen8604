  /* Lv8 結業測驗 */
  [
   {q:{zh:'下列哪項不屬於廚房基本安全規則？',en:'Which of the following is NOT a basic kitchen safety rule?',id:'Mana yang bukan aturan keselamatan dapur dasar?',vi:'Điều nào tidak phải quy tắc an toàn bếp cơ bản?'},
    opts:[{zh:'保持地板乾燥',en:'Keep floor dry',id:'Jaga lantai tetap kering',vi:'Giữ sàn khô ráo',ok:false},
          {zh:'炸物時蓋上鍋蓋',en:'Cover pot while deep-frying',id:'Tutup panci saat menggoreng',vi:'Đậy nắp khi chiên ngập dầu',ok:true},
          {zh:'刀具使用後立即收納',en:'Store knives immediately after use',id:'Simpan pisau segera setelah digunakan',vi:'Cất dao ngay sau khi dùng',ok:false}],
    fb:{zh:'正確！炸物時絕對不能蓋鍋蓋，蒸汽積聚會導致油爆危險。',en:'Correct! Never cover the pot while deep-frying — steam buildup causes dangerous oil explosions.',id:'Benar! Jangan pernah menutup panci saat menggoreng — uap menyebabkan ledakan minyak.',vi:'Đúng! Không bao giờ đậy nắp khi chiên — hơi tích tụ gây bùng nổ dầu nguy hiểm.'}},
   {q:{zh:'以下哪種食材最適合用「蒸」的方式烹調，以保留最多營養？',en:'Which ingredient is best cooked by steaming to preserve the most nutrients?',id:'Bahan makanan mana yang paling baik dikukus untuk menjaga nutrisi?',vi:'Nguyên liệu nào thích hợp nhất để hấp nhằm giữ nhiều dinh dưỡng nhất?'},
    opts:[{zh:'根莖類（紅蘿蔔、馬鈴薯）',en:'Root vegetables (carrots, potatoes)',id:'Sayuran akar (wortel, kentang)',vi:'Rau củ (cà rốt, khoai tây)',ok:false},
          {zh:'魚類與海鮮',en:'Fish & seafood',id:'Ikan & makanan laut',vi:'Cá & hải sản',ok:true},
          {zh:'乾燥豆類',en:'Dried legumes',id:'Kacang-kacangan kering',vi:'Đậu khô',ok:false}],
    fb:{zh:'正確！魚類與海鮮肉質細嫩、含豐富蛋白質與Omega-3，蒸製可避免高溫破壞營養素，又能保持鮮嫩口感。',en:'Correct! Fish and seafood are delicate and rich in protein and Omega-3. Steaming avoids high heat that destroys nutrients.',id:'Benar! Ikan dan makanan laut kaya protein dan Omega-3. Mengukus menghindari panas tinggi yang merusak nutrisi.',vi:'Đúng! Cá và hải sản giàu protein và Omega-3. Hấp tránh nhiệt cao làm hỏng dinh dưỡng.'}},
   {q:{zh:'食品冷藏時，熟食應放在冰箱的哪個位置？',en:'When refrigerating food, cooked food should be placed where in the fridge?',id:'Saat menyimpan makanan di kulkas, makanan matang sebaiknya diletakkan di mana?',vi:'Khi để thực phẩm trong tủ lạnh, thức ăn chín nên để ở đâu?'},
    opts:[{zh:'下層，靠近冷凍室',en:'Lower shelf, near the freezer',id:'Rak bawah, dekat freezer',vi:'Ngăn dưới, gần ngăn đá',ok:false},
          {zh:'上層，避免生食滴液汙染',en:'Upper shelf, away from raw food drips',id:'Rak atas, jauh dari tetesan makanan mentah',vi:'Ngăn trên, tránh dịch từ thực phẩm sống',ok:true},
          {zh:'門邊格架，方便取用',en:'Door shelf for easy access',id:'Rak pintu untuk kemudahan akses',vi:'Ngăn cửa để dễ lấy',ok:false}],
    fb:{zh:'正確！熟食應放上層，生食放下層，避免生食的汁液滴落汙染熟食，造成交叉汙染與食物中毒風險。',en:'Correct! Cooked food goes on the upper shelf, raw food on the lower shelf, to prevent raw juices dripping onto cooked food.',id:'Benar! Makanan matang di rak atas, makanan mentah di rak bawah, mencegah jus makanan mentah menetes ke makanan matang.',vi:'Đúng! Thức ăn chín ở ngăn trên, thực phẩm sống ở ngăn dưới, tránh dịch từ thực phẩm sống nhỏ vào thức ăn chín.'}},
   {q:{zh:'下列哪一項是「刀工基礎」中最重要的安全守則？',en:'Which is the most important safety rule in "Knife Skills"?',id:'Manakah aturan keselamatan paling penting dalam "Teknik Pisau"?',vi:'Quy tắc an toàn quan trọng nhất trong "Kỹ thuật dao" là gì?'},
    opts:[{zh:'刀越大越安全',en:'Bigger knives are safer',id:'Pisau lebih besar lebih aman',vi:'Dao càng lớn càng an toàn',ok:false},
          {zh:'切食材時使用貓爪式握法保護手指',en:'Use the claw grip when cutting to protect fingers',id:'Gunakan cakar kucing saat memotong untuk melindungi jari',vi:'Dùng kiểu vuốt mèo khi cắt để bảo vệ ngón tay',ok:true},
          {zh:'刀具使用後直接放入抽屜',en:'Put knives directly in a drawer after use',id:'Simpan pisau langsung di laci setelah digunakan',vi:'Cho dao thẳng vào ngăn kéo sau khi dùng',ok:false}],
    fb:{zh:'正確！切食材時應使用「貓爪式」：指尖向後彎曲、指節朝前引導刀面，這是刀工基礎中最核心的安全守則。',en:'Correct! The "claw grip" — fingertips curled back and knuckles forward guiding the blade — is the core safety rule in knife skills.',id:'Benar! "Cakar kucing" — ujung jari ditekuk ke belakang dan buku jari ke depan memandu pisau — adalah aturan keselamatan inti.',vi:'Đúng! Kiểu "vuốt mèo" — đầu ngón tay cong lại và đốt ngón tay hướng ra trước dẫn dao — là quy tắc an toàn cốt lõi trong kỹ thuật dao.'}},
   {q:{zh:'食品「危險溫度帶」是指哪個範圍？',en:'What range does the food "danger zone" refer to?',id:'Kisaran apa yang dimaksud "zona bahaya" makanan?',vi:'"Vùng nguy hiểm" của thực phẩm là trong khoảng nào?'},
    opts:[{zh:'0°C至20°C',en:'0°C to 20°C',id:'0°C hingga 20°C',vi:'0°C đến 20°C',ok:false},
          {zh:'5°C至60°C',en:'5°C to 60°C',id:'5°C hingga 60°C',vi:'5°C đến 60°C',ok:true},
          {zh:'60°C至100°C',en:'60°C to 100°C',id:'60°C hingga 100°C',vi:'60°C đến 100°C',ok:false}],
    fb:{zh:'正確！食品危險溫度帶為5–60°C，細菌在此溫度範圍內增殖最快。食品應保持在4°C以下冷藏或60°C以上加熱，避免在危險溫度帶停留超過2小時。',en:'Correct! The food danger zone is 5–60°C, where bacteria multiply fastest. Keep food below 4°C or above 60°C, and avoid leaving it in the danger zone for more than 2 hours.',id:'Benar! Zona bahaya makanan adalah 5–60°C, di mana bakteri berkembang biak paling cepat. Simpan makanan di bawah 4°C atau di atas 60°C.',vi:'Đúng! Vùng nguy hiểm thực phẩm là 5–60°C, nơi vi khuẩn sinh sôi nhanh nhất. Giữ thực phẩm dưới 4°C hoặc trên 60°C, không để trong vùng nguy hiểm quá 2 giờ.'}},
   {q:{zh:'使用砧板顏色管理系統，哪種顏色通常用於生魚海鮮？',en:'In a color-coded cutting board system, which color is typically used for raw fish and seafood?',id:'Dalam sistem talenan berwarna, warna apa yang biasanya digunakan untuk ikan dan seafood mentah?',vi:'Trong hệ thống thớt phân màu, màu nào thường dùng cho cá và hải sản sống?'},
    opts:[{zh:'紅色',en:'Red',id:'Merah',vi:'Đỏ',ok:false},
          {zh:'藍色',en:'Blue',id:'Biru',vi:'Xanh dương',ok:true},
          {zh:'綠色',en:'Green',id:'Hijau',vi:'Xanh lá',ok:false}],
    fb:{zh:'正確！國際廚房顏色管理規範中，藍色砧板用於生魚海鮮、紅色用於生紅肉（牛、豬）、黃色用於生禽肉、綠色用於蔬果、白色用於乳製品與麵包。',en:'Correct! In international kitchen color coding, blue is for raw fish/seafood, red for raw red meat, yellow for raw poultry, green for vegetables/fruit, and white for dairy/bread.',id:'Benar! Dalam kode warna internasional, biru untuk ikan/seafood mentah, merah untuk daging merah, kuning untuk unggas, hijau untuk sayuran, putih untuk susu/roti.',vi:'Đúng! Trong quy chuẩn màu quốc tế, xanh dương cho cá/hải sản sống, đỏ cho thịt đỏ sống, vàng cho gia cầm sống, xanh lá cho rau/trái cây, trắng cho sữa/bánh mì.'}},
   {q:{zh:'烤箱烘焙前必須「預熱」，主要原因是什麼？',en:'Why must you "preheat" an oven before baking?',id:'Mengapa Anda harus "memanaskan awal" oven sebelum memanggang?',vi:'Tại sao phải "làm nóng lò" trước khi nướng?'},
    opts:[{zh:'讓烤箱顯示正確的溫度數字',en:'So the oven displays the correct temperature number',id:'Agar oven menampilkan angka suhu yang benar',vi:'Để lò nướng hiển thị số nhiệt độ đúng',ok:false},
          {zh:'確保食材一入爐即受到均勻穩定的熱能，影響烘焙成敗',en:'Ensure food receives even, stable heat from the moment it enters, affecting baking success',id:'Memastikan makanan menerima panas yang merata dan stabil sejak masuk, mempengaruhi keberhasilan pemanggangan',vi:'Đảm bảo thực phẩm nhận được nhiệt đều và ổn định ngay từ khi vào lò, ảnh hưởng đến sự thành công của nướng bánh',ok:true},
          {zh:'節省烘焙時間',en:'Save baking time',id:'Menghemat waktu pemanggangan',vi:'Tiết kiệm thời gian nướng',ok:false}],
    fb:{zh:'正確！預熱確保食材一入爐即受到穩定均勻的熱能，是烘焙成功的基礎。未預熱會導致成品膨脹不良、底部受熱不均，影響口感與外觀。',en:'Correct! Preheating ensures food receives stable, even heat from the moment it enters — the foundation of successful baking. Skipping it causes poor rise and uneven cooking.',id:'Benar! Pemanasan awal memastikan makanan menerima panas stabil dan merata sejak masuk — dasar keberhasilan memanggang.',vi:'Đúng! Làm nóng lò đảm bảo thực phẩm nhận được nhiệt ổn định và đều ngay khi vào lò — nền tảng của việc nướng bánh thành công.'}}
  ],
  /* Lv9 醃漬與醬料調味 */
  [
   {q:{zh:'紅燒滷汁常用的萬用比例「醬油:水:糖」大約是？',en:'A common all-purpose braising ratio \"soy sauce:water:sugar\" is about?',id:'Rasio kaldu serbaguna \"kecap:air:gula\" yang umum adalah?',vi:'Tỷ lệ nước kho thông dụng \"nước tương:nước:đường\" khoảng?'},
    opts:[{zh:'1:3:0.5',en:'1:3:0.5',id:'1:3:0.5',vi:'1:3:0.5',ok:true},
          {zh:'3:1:1',en:'3:1:1',id:'3:1:1',vi:'3:1:1',ok:false},
          {zh:'1:1:3',en:'1:1:3',id:'1:1:3',vi:'1:1:3',ok:false}],
    fb:{zh:'正確！醬油:水:糖約1:3:0.5是常用的萬用滷汁基礎比例，可依個人口味微調鹹甜。',en:'Correct! Soy sauce:water:sugar ≈ 1:3:0.5 is a common all-purpose braising ratio, adjustable to taste.',id:'Benar! Kecap:air:gula ≈ 1:3:0.5 adalah rasio kaldu serbaguna yang umum, bisa disesuaikan rasa.',vi:'Đúng! Nước tương:nước:đường ≈ 1:3:0.5 là tỷ lệ kho万用 phổ biến, có thể điều chỉnh theo khẩu vị.'}},
   {q:{zh:'使用檸檬汁或醋醃肉時，建議的浸泡時間是？',en:'When marinating meat with lemon juice or vinegar, the recommended soaking time is?',id:'Saat marinasi daging dengan jeruk nipis atau cuka, waktu rendam yang disarankan adalah?',vi:'Khi ướp thịt với nước cốt chanh hoặc giấm, thời gian ngâm khuyến nghị là?'},
    opts:[{zh:'越久越入味越好',en:'The longer the better',id:'Semakin lama semakin baik',vi:'Càng lâu càng ngon',ok:false},
          {zh:'不超過30分鐘',en:'No more than 30 minutes',id:'Tidak lebih dari 30 menit',vi:'Không quá 30 phút',ok:true},
          {zh:'至少浸泡3小時',en:'At least 3 hours',id:'Setidaknya 3 jam',vi:'Ít nhất 3 giờ',ok:false}],
    fb:{zh:'正確！酸性醃料會分解蛋白質讓肉質軟嫩，但浸泡過久（超過30分鐘）會使肉質變得過於軟爛、口感不佳。',en:'Correct! Acidic marinades break down protein for tenderness, but soaking too long (over 30 min) makes meat mushy.',id:'Benar! Marinasi asam melembutkan protein, tapi terlalu lama (lebih 30 menit) membuat daging terlalu lembek.',vi:'Đúng! Nước ướp có axit làm mềm protein, nhưng ngâm quá lâu (hơn 30 phút) sẽ làm thịt nhũn, mất ngon.'}},
   {q:{zh:'製作醃漬蔬菜（如泡菜、醃黃瓜）時，蔬菜應如何放置？',en:'When making pickled vegetables (e.g. kimchi, pickled cucumber), how should the vegetables be placed?',id:'Saat membuat acar sayuran (kimchi, acar timun), bagaimana sayuran harus diletakkan?',vi:'Khi làm rau ngâm chua (kim chi, dưa leo ngâm), rau nên được đặt như thế nào?'},
    opts:[{zh:'完全浸泡於醃汁液面下',en:'Fully submerged below the brine surface',id:'Terendam penuh di bawah permukaan air acar',vi:'Ngập hoàn toàn dưới mặt nước ngâm',ok:true},
          {zh:'露出液面接觸空氣風味較佳',en:'Exposed to air above the liquid for better flavor',id:'Terbuka ke udara di atas cairan untuk rasa lebih baik',vi:'Để hở trên mặt nước cho hương vị tốt hơn',ok:false},
          {zh:'放在容器最上層即可，不需壓住',en:'Just place on top of the container, no need to weigh down',id:'Letakkan di atas wadah saja, tidak perlu pemberat',vi:'Chỉ cần đặt trên cùng hộp, không cần đè',ok:false}],
    fb:{zh:'正確！蔬菜必須完全浸泡於醃汁中，可用乾淨重物壓住，避免接觸空氣導致長黴或雜菌滋生。',en:'Correct! Vegetables must be fully submerged in the brine, weighed down with a clean object, to prevent air exposure and mold growth.',id:'Benar! Sayuran harus terendam penuh dalam air acar, gunakan pemberat bersih untuk mencegah kontak udara dan jamur.',vi:'Đúng! Rau phải ngập hoàn toàn trong nước ngâm, dùng vật nặng sạch đè xuống để tránh tiếp xúc không khí gây nấm mốc.'}},
   {q:{zh:'製作醬油膏時，加入太白粉（澱粉）的主要作用是？',en:'When making soy sauce paste, what is the main function of adding starch?',id:'Saat membuat saus kecap, apa fungsi utama menambahkan tepung kanji?',vi:'Khi làm tương nước tương, tác dụng chính của việc thêm bột năng là gì?'},
    opts:[{zh:'增加鹹味',en:'Increase saltiness',id:'Menambah rasa asin',vi:'Tăng vị mặn',ok:false},
          {zh:'增稠，讓醬汁更濃郁附著在食材上',en:'Thicken the sauce so it coats the food more richly',id:'Mengentalkan saus agar lebih kental menempel pada makanan',vi:'Làm đặc sốt để bám tốt hơn vào thực phẩm',ok:true},
          {zh:'減少鹹度讓醬汁更清爽',en:'Reduce saltiness for a lighter sauce',id:'Mengurangi rasa asin untuk saus yang lebih ringan',vi:'Giảm độ mặn cho sốt nhẹ hơn',ok:false}],
    fb:{zh:'正確！澱粉（太白粉）加熱後會糊化，使醬汁變濃稠且光亮，更能包覆食材表面，讓料理的外觀和口味更有層次。這是勾芡（thickening）技術的核心原理。',en:'Correct! Starch gelatinizes when heated, thickening and glossing the sauce so it better coats food surfaces, adding visual appeal and depth of flavor. This is the core of the thickening technique.',id:'Benar! Pati menggelatin saat dipanaskan, mengentalkan dan mengkilapkan saus agar lebih baik melapisi permukaan makanan.',vi:'Đúng! Tinh bột gelatin hóa khi đun nóng, làm đặc và bóng sốt để bám tốt hơn lên bề mặt thực phẩm, tăng thẩm mỹ và độ phong phú của hương vị.'}},
   {q:{zh:'製作沙拉醬（油醋醬）時，油與醋的基本比例通常是？',en:'When making vinaigrette, what is the typical basic ratio of oil to vinegar?',id:'Saat membuat vinaigrette, berapa rasio dasar minyak dan cuka yang biasa digunakan?',vi:'Khi làm sốt dầu giấm, tỷ lệ cơ bản thông thường của dầu và giấm là?'},
    opts:[{zh:'油:醋 = 1:1',en:'Oil:Vinegar = 1:1',id:'Minyak:Cuka = 1:1',vi:'Dầu:Giấm = 1:1',ok:false},
          {zh:'油:醋 = 3:1',en:'Oil:Vinegar = 3:1',id:'Minyak:Cuka = 3:1',vi:'Dầu:Giấm = 3:1',ok:true},
          {zh:'油:醋 = 1:3',en:'Oil:Vinegar = 1:3',id:'Minyak:Cuka = 1:3',vi:'Dầu:Giấm = 1:3',ok:false}],
    fb:{zh:'正確！傳統油醋醬的基本比例為油:醋 = 3:1，油的比例較高以平衡醋的酸度。可依口味調整，加入芥末、蜂蜜、香草等提升風味層次。',en:'Correct! The classic vinaigrette ratio is oil:vinegar = 3:1, with more oil to balance the acidity. Adjust to taste and add mustard, honey, or herbs for extra complexity.',id:'Benar! Rasio vinaigrette klasik adalah minyak:cuka = 3:1, dengan lebih banyak minyak untuk menyeimbangkan keasaman.',vi:'Đúng! Tỷ lệ sốt dầu giấm cổ điển là dầu:giấm = 3:1, dầu nhiều hơn để cân bằng độ chua. Điều chỉnh theo khẩu vị và thêm mù tạt, mật ong hoặc thảo mộc để tăng độ phức tạp.'}},
   {q:{zh:'醃肉時，加入「料理酒」的主要作用是？',en:'When marinating meat, what is the main purpose of adding "cooking wine"?',id:'Saat marinasi daging, apa fungsi utama menambahkan "arak masak"?',vi:'Khi ướp thịt, tác dụng chính của việc thêm "rượu nấu ăn" là gì?'},
    opts:[{zh:'讓肉的顏色變深',en:'Make the meat color darker',id:'Membuat warna daging lebih gelap',vi:'Làm màu thịt đậm hơn',ok:false},
          {zh:'去除腥味、幫助入味，並讓肉質更嫩',en:'Remove gamey odor, help flavor absorption, and tenderize the meat',id:'Menghilangkan bau amis, membantu penyerapan rasa, dan mengempukkan daging',vi:'Khử mùi tanh, giúp thấm vị và làm mềm thịt',ok:true},
          {zh:'增加肉的保存期限',en:'Extend the meat\'s shelf life',id:'Memperpanjang masa simpan daging',vi:'Kéo dài thời gian bảo quản thịt',ok:false}],
    fb:{zh:'正確！料理酒（如米酒、紹興酒）含有酒精能與腥臭味物質結合並在加熱時揮發，同時酒中的有機酸能幫助肉類軟化，使調味料更容易滲入肉中。',en:'Correct! Cooking wine (e.g., rice wine, Shaoxing wine) contains alcohol that binds with odor compounds and evaporates with heat; its organic acids also tenderize meat and help seasonings penetrate.',id:'Benar! Arak masak mengandung alkohol yang mengikat senyawa bau dan menguap saat dipanaskan; asam organiknya juga mengempukkan daging dan membantu bumbu meresap.',vi:'Đúng! Rượu nấu ăn chứa cồn liên kết với hợp chất mùi và bay hơi khi đun nóng; axit hữu cơ trong đó cũng làm mềm thịt và giúp gia vị ngấm sâu hơn.'}},
   {q:{zh:'以下哪種調味料屬於「酸味」調味料？',en:'Which of the following condiments is a "sour" seasoning?',id:'Kondimen mana dari berikut ini yang merupakan bumbu "asam"?',vi:'Loại gia vị nào sau đây thuộc nhóm gia vị "chua"?'},
    opts:[{zh:'醬油',en:'Soy sauce',id:'Kecap',vi:'Nước tương',ok:false},
          {zh:'白醋',en:'White vinegar',id:'Cuka putih',vi:'Giấm trắng',ok:true},
          {zh:'味噌',en:'Miso',id:'Miso',vi:'Tương miso',ok:false}],
    fb:{zh:'正確！白醋主要成分是醋酸，屬於酸味調味料，常用於提亮料理色澤、去除腥味、製作泡菜或油醋醬。醬油和味噌屬於鹹鮮味（umami）調味料。',en:'Correct! White vinegar is mainly acetic acid — a sour condiment used to brighten dish colors, remove odors, make pickles or vinaigrette. Soy sauce and miso are savory/umami seasonings.',id:'Benar! Cuka putih mengandung asam asetat — bumbu asam yang digunakan untuk mencerahkan warna masakan, menghilangkan bau amis, membuat acar atau vinaigrette.',vi:'Đúng! Giấm trắng chủ yếu là axit acetic — gia vị chua dùng để tăng độ sáng màu món ăn, khử mùi tanh, làm dưa muối hoặc sốt dầu giấm.'}}
  ],
  /* Lv10 蔬食料理入門 */
  [
   {q:{zh:'豆腐在烹調前，用鹽水浸泡或撒鹽靜置的主要目的是？',en:'What is the main purpose of salting or brining tofu before cooking?',id:'Apa tujuan utama merendam atau menggarami tahu sebelum memasak?',vi:'Mục đích chính của việc ngâm muối đậu phụ trước khi nấu là gì?'},
    opts:[{zh:'增加鹹味',en:'Add saltiness',id:'Menambah rasa asin',vi:'Thêm vị mặn',ok:false},
          {zh:'去除多餘水分，使口感更紮實',en:'Draw out excess moisture for a firmer texture',id:'Mengeluarkan kelebihan air untuk tekstur lebih padat',vi:'Rút bớt nước để kết cấu chắc hơn',ok:true},
          {zh:'讓豆腐變軟',en:'Make the tofu softer',id:'Membuat tahu lebih lembut',vi:'Làm đậu phụ mềm hơn',ok:false}],
    fb:{zh:'正確！去除多餘水分能讓豆腐在煎炒時更不易碎，並更容易上色入味。',en:'Correct! Drawing out moisture helps tofu hold its shape when pan-frying or stir-frying, and allows better browning and flavor absorption.',id:'Benar! Mengeluarkan kelembapan membantu tahu mempertahankan bentuk saat digoreng.',vi:'Đúng! Rút nước giúp đậu phụ giữ hình dạng khi chiên và hấp thụ hương vị tốt hơn.'}},
   {q:{zh:'蔬食料理中，哪一種食材最常用來取代肉類帶來「鮮味（Umami）」？',en:'In plant-based cooking, which ingredient is most commonly used to add umami flavor instead of meat?',id:'Dalam masak nabati, bahan apa yang paling umum digunakan untuk menambah umami sebagai pengganti daging?',vi:'Trong nấu ăn thuần chay, nguyên liệu nào phổ biến nhất để thay thế vị umami của thịt?'},
    opts:[{zh:'白糖',en:'White sugar',id:'Gula putih',vi:'Đường trắng',ok:false},
          {zh:'味噌、醬油或香菇',en:'Miso, soy sauce, or shiitake mushrooms',id:'Miso, kecap, atau jamur shiitake',vi:'Tương miso, nước tương hoặc nấm shiitake',ok:true},
          {zh:'檸檬汁',en:'Lemon juice',id:'Air lemon',vi:'Nước cốt chanh',ok:false}],
    fb:{zh:'正確！味噌、醬油、香菇、昆布等都含有天然麩胺酸，是蔬食料理增添深層鮮味的關鍵。',en:'Correct! Miso, soy sauce, shiitake mushrooms, and kombu all contain natural glutamates — key to building deep umami in plant-based dishes.',id:'Benar! Miso, kecap, jamur shiitake, dan kombu mengandung glutamat alami — kunci membangun umami dalam masak nabati.',vi:'Đúng! Miso, nước tương, nấm shiitake và tảo kombu đều chứa glutamate tự nhiên — chìa khóa tạo umami cho món chay.'}},
   {q:{zh:'從營養均衡角度看，蔬食飲食者最需要特別注意補充哪種營養素？',en:'From a nutritional balance perspective, which nutrient do plant-based eaters need to be most mindful of supplementing?',id:'Dari sudut pandang gizi seimbang, nutrisi apa yang perlu diperhatikan oleh pemakan nabati?',vi:'Từ góc độ dinh dưỡng cân bằng, người ăn chay cần bổ sung dưỡng chất nào nhất?'},
    opts:[{zh:'維生素C',en:'Vitamin C',id:'Vitamin C',vi:'Vitamin C',ok:false},
          {zh:'維生素B12',en:'Vitamin B12',id:'Vitamin B12',vi:'Vitamin B12',ok:true},
          {zh:'碳水化合物',en:'Carbohydrates',id:'Karbohidrat',vi:'Carbohydrate',ok:false}],
    fb:{zh:'正確！維生素B12主要存在於動物性食物中，全素食者須透過補充劑或強化食品攝取，以避免神經系統問題。',en:'Correct! Vitamin B12 is found mainly in animal products. Vegans must supplement or eat fortified foods to avoid neurological issues.',id:'Benar! Vitamin B12 terutama ditemukan dalam produk hewani. Vegan harus suplemen atau makan makanan yang diperkaya untuk mencegah masalah neurologis.',vi:'Đúng! Vitamin B12 chủ yếu có trong thực phẩm động vật. Người ăn thuần chay cần bổ sung hoặc ăn thực phẩm tăng cường để tránh vấn đề thần kinh.'}},
   {q:{zh:'烹調豆腐時，哪種方式能讓豆腐表面最容易上色（金黃）？',en:'When cooking tofu, which method most easily achieves a golden-brown surface?',id:'Saat memasak tahu, metode mana yang paling mudah menghasilkan permukaan berwarna keemasan?',vi:'Khi nấu đậu phụ, phương pháp nào dễ đạt được bề mặt vàng nâu nhất?'},
    opts:[{zh:'直接加入滾水中煮',en:'Boil it directly in hot water',id:'Rebus langsung dalam air panas',vi:'Luộc thẳng trong nước nóng',ok:false},
          {zh:'用廚房紙巾擦乾水分後，以熱油中火煎',en:'Pat dry with paper towels, then pan-fry on medium heat with hot oil',id:'Keringkan dengan tisu dapur, lalu goreng dengan minyak panas di api sedang',vi:'Lau khô bằng khăn giấy, rồi chiên với dầu nóng lửa vừa',ok:true},
          {zh:'用冷油低溫煎製',en:'Pan-fry in cold oil at low temperature',id:'Goreng dalam minyak dingin dengan api kecil',vi:'Chiên trong dầu lạnh ở nhiệt độ thấp',ok:false}],
    fb:{zh:'正確！豆腐表面含有大量水分，煎前充分擦乾，用熱油中火煎能使表面快速脫水並產生梅納反應（Maillard reaction），形成金黃酥脆的外皮。',en:'Correct! Tofu\'s high moisture content means you must pat it dry before frying. Hot oil on medium heat causes rapid moisture evaporation and the Maillard reaction, creating a golden crispy surface.',id:'Benar! Tahu mengandung banyak air, jadi keringkan sebelum digoreng. Minyak panas di api sedang menyebabkan penguapan cepat dan reaksi Maillard, menghasilkan permukaan keemasan.',vi:'Đúng! Đậu phụ chứa nhiều nước, nên lau khô trước khi chiên. Dầu nóng ở lửa vừa gây bốc hơi nhanh và phản ứng Maillard, tạo bề mặt vàng giòn.'}},
   {q:{zh:'蔬食飲食中，要攝取足夠的鐵質，最好搭配哪種食物一起吃？',en:'In a plant-based diet, what should you pair with iron-rich plant foods to improve iron absorption?',id:'Dalam diet nabati, apa yang harus dipasangkan dengan makanan nabati kaya zat besi untuk meningkatkan penyerapan zat besi?',vi:'Trong chế độ ăn thuần chay, nên ăn kèm gì với thực phẩm giàu sắt để cải thiện hấp thu sắt?'},
    opts:[{zh:'高鈣食品（如豆腐）',en:'High-calcium foods (e.g., tofu)',id:'Makanan tinggi kalsium (seperti tahu)',vi:'Thực phẩm giàu canxi (như đậu phụ)',ok:false},
          {zh:'富含維生素C的食物（如彩椒、柑橘類）',en:'Foods rich in vitamin C (e.g., bell peppers, citrus fruits)',id:'Makanan kaya vitamin C (seperti paprika, buah sitrus)',vi:'Thực phẩm giàu vitamin C (như ớt chuông, trái cây họ cam quýt)',ok:true},
          {zh:'富含脂肪的食物（如酪梨）',en:'Foods rich in fat (e.g., avocado)',id:'Makanan kaya lemak (seperti alpukat)',vi:'Thực phẩm giàu chất béo (như bơ)',ok:false}],
    fb:{zh:'正確！植物性食物中的鐵質為非血基質鐵，吸收率較動物性食物低。同時攝取富含維生素C的食物（如彩椒、柑橘類）能將非血基質鐵轉化為更易吸收的形式，顯著提升吸收率。',en:'Correct! Plant-based iron is non-heme iron, which has lower absorption than animal iron. Pairing it with vitamin C-rich foods (bell peppers, citrus) converts non-heme iron to a more absorbable form, significantly improving absorption.',id:'Benar! Zat besi nabati adalah zat besi non-heme, yang penyerapannya lebih rendah. Memasangkannya dengan makanan kaya vitamin C mengubahnya menjadi bentuk yang lebih mudah diserap.',vi:'Đúng! Sắt từ thực vật là sắt non-heme, hấp thu kém hơn sắt động vật. Ăn kèm với thực phẩm giàu vitamin C chuyển sắt non-heme thành dạng dễ hấp thu hơn.'}},
   {q:{zh:'以下哪種食材是蔬食飲食中優質的植物性蛋白質來源？',en:'Which of the following is an excellent plant-based protein source for a vegan diet?',id:'Mana dari berikut ini yang merupakan sumber protein nabati yang sangat baik untuk diet vegan?',vi:'Nguyên liệu nào sau đây là nguồn đạm thực vật tốt cho chế độ ăn thuần chay?'},
    opts:[{zh:'白米飯',en:'White rice',id:'Nasi putih',vi:'Cơm trắng',ok:false},
          {zh:'毛豆（大豆）',en:'Edamame (soybeans)',id:'Edamame (kedelai)',vi:'Đậu edamame (đậu nành)',ok:true},
          {zh:'高麗菜',en:'Cabbage',id:'Kubis',vi:'Cải bắp',ok:false}],
    fb:{zh:'正確！毛豆（大豆）含有完整的必需胺基酸，蛋白質品質接近動物性蛋白，是蔬食飲食中最優質的蛋白質來源之一。其他優質植物蛋白來源還包括天貝、豆腐、扁豆、鷹嘴豆等。',en:'Correct! Edamame/soybeans contain all essential amino acids and protein quality close to animal protein — one of the best plant-based protein sources. Other quality sources include tempeh, tofu, lentils, and chickpeas.',id:'Benar! Edamame/kedelai mengandung semua asam amino esensial dan kualitas protein mendekati protein hewani — salah satu sumber protein nabati terbaik.',vi:'Đúng! Đậu nành chứa đầy đủ axit amin thiết yếu và chất lượng đạm gần với đạm động vật — một trong những nguồn đạm thực vật tốt nhất.'}},
   {q:{zh:'蔬食料理中常用「昆布」增添鮮味，其主要鮮味成分是？',en:'Kombu is commonly used in plant-based cooking to add umami. What is its main umami compound?',id:'Kombu sering digunakan dalam masakan nabati untuk menambah umami. Apa senyawa umami utamanya?',vi:'Tảo kombu thường dùng trong nấu ăn thuần chay để tăng umami. Hợp chất umami chính của nó là gì?'},
    opts:[{zh:'鈉（鹽分）',en:'Sodium (saltiness)',id:'Natrium (rasa asin)',vi:'Natri (vị mặn)',ok:false},
          {zh:'麩胺酸（Glutamate）',en:'Glutamate',id:'Glutamat',vi:'Glutamate',ok:true},
          {zh:'葡萄糖（糖分）',en:'Glucose (sweetness)',id:'Glukosa (rasa manis)',vi:'Glucose (vị ngọt)',ok:false}],
    fb:{zh:'正確！昆布富含麩胺酸（L-glutamate），是「第五味」鮮味（Umami）的主要來源之一。昆布高湯（昆布出汁）是日式及蔬食料理中增添鮮味的基礎，且完全植物性。',en:'Correct! Kombu is rich in L-glutamate, one of the primary sources of umami (the fifth taste). Kombu dashi is a foundation of Japanese and plant-based cooking for adding depth — and it\'s completely plant-based.',id:'Benar! Kombu kaya L-glutamat, salah satu sumber utama umami (rasa kelima). Kaldu kombu adalah dasar masakan Jepang dan nabati untuk menambahkan kedalaman.',vi:'Đúng! Kombu giàu L-glutamate, một trong những nguồn umami chính (vị thứ năm). Nước dùng kombu là nền tảng của ẩm thực Nhật Bản và nấu ăn thuần chay.'}}
  ],
  /* Lv11 高湯與湯品基礎 ── 新增 */
  [
   {q:{zh:'製作清澈雞高湯時，雞肉與骨頭應該如何下鍋？',en:'For a clear chicken stock, how should the chicken and bones go into the pot?',id:'Untuk kaldu ayam jernih, bagaimana ayam dan tulang dimasukkan?',vi:'Để có nước dùng gà trong, gà và xương nên cho vào nồi như thế nào?'},
    opts:[{zh:'冷水下鍋，慢慢加熱',en:'Cold water, heat gradually',id:'Air dingin, panaskan perlahan',vi:'Nước lạnh, đun từ từ',ok:true},
          {zh:'滾水下鍋，快速煮滾',en:'Boiling water, bring to rapid boil',id:'Air mendidih, didihkan cepat',vi:'Nước sôi, đun nhanh',ok:false},
          {zh:'先用大火炸過再加水',en:'Deep-fry first then add water',id:'Goreng dulu lalu tambah air',vi:'Chiên trước rồi thêm nước',ok:false}],
    fb:{zh:'正確！冷水下鍋慢慢加熱，可讓蛋白質緩慢釋出並隨浮沫一起撈除，湯頭才會清澈。',en:'Correct! Starting with cold water and heating slowly lets proteins release gradually so foam can be skimmed, keeping the stock clear.',id:'Benar! Memulai dengan air dingin dan memanaskan perlahan membuat protein keluar bertahap sehingga buih bisa diangkat.',vi:'Đúng! Bắt đầu với nước lạnh và đun từ từ giúp protein thoát ra dần để có thể hớt bọt, giữ nước dùng trong.'}},
   {q:{zh:'焯水（汆燙）大骨或肉類的主要目的是？',en:'What is the main purpose of blanching bones or meat before making stock?',id:'Apa tujuan utama merebus sebentar tulang atau daging sebelum membuat kaldu?',vi:'Mục đích chính của việc chần xương hoặc thịt trước khi nấu nước dùng là gì?'},
    opts:[{zh:'讓肉變得更軟嫩',en:'Make the meat more tender',id:'Membuat daging lebih lembut',vi:'Làm thịt mềm hơn',ok:false},
          {zh:'去除血水與雜質，減少腥味與浮沫',en:'Remove blood and impurities, reducing odor and foam',id:'Menghilangkan darah dan kotoran, mengurangi bau dan buih',vi:'Loại bỏ máu và tạp chất, giảm mùi và bọt',ok:true},
          {zh:'幫助肉類上色',en:'Help the meat brown',id:'Membantu daging berwarna',vi:'Giúp thịt lên màu',ok:false}],
    fb:{zh:'正確！焯水可去除大量血水與雜質，讓後續熬煮的湯頭更清澈、氣味更乾淨。',en:'Correct! Blanching removes much of the blood and impurities, resulting in a cleaner-tasting, clearer stock.',id:'Benar! Merebus sebentar menghilangkan banyak darah dan kotoran, menghasilkan kaldu yang lebih jernih dan bersih rasanya.',vi:'Đúng! Chần loại bỏ phần lớn máu và tạp chất, cho nước dùng trong và sạch hơn.'}},
   {q:{zh:'熬煮高湯時，要保持湯頭清澈，火候應該如何控制？',en:'To keep the stock clear while simmering, how should the heat be controlled?',id:'Untuk menjaga kaldu tetap jernih saat dimasak, bagaimana api harus dikontrol?',vi:'Để giữ nước dùng trong khi ninh, lửa nên kiểm soát như thế nào?'},
    opts:[{zh:'全程大火滾煮，縮短時間',en:'Boil rapidly throughout to save time',id:'Didihkan keras sepanjang waktu untuk hemat waktu',vi:'Đun sôi mạnh suốt thời gian để tiết kiệm thời gian',ok:false},
          {zh:'保持小火微滾，並隨時撈除浮沫油脂',en:'Keep at a gentle simmer, skimming foam and fat regularly',id:'Pertahankan api kecil mendidih perlahan, sambil rutin mengangkat buih dan lemak',vi:'Giữ lửa nhỏ sôi lăn tăn, thường xuyên hớt bọt và mỡ',ok:true},
          {zh:'熬煮中途加入大量冷水',en:'Add a large amount of cold water midway',id:'Tambahkan banyak air dingin di tengah proses',vi:'Thêm nhiều nước lạnh giữa quá trình',ok:false}],
    fb:{zh:'正確！大滾會讓油脂與雜質乳化混入湯中變混濁，小火微滾並撈除浮沫，湯頭才會清澈鮮美。',en:'Correct! Rapid boiling emulsifies fat and impurities into the broth, making it cloudy. A gentle simmer with regular skimming keeps it clear and flavorful.',id:'Benar! Mendidih keras membuat lemak dan kotoran teremulsi ke dalam kaldu sehingga keruh. Mendidih perlahan sambil mengangkat buih membuat kaldu jernih dan gurih.',vi:'Đúng! Sôi mạnh làm mỡ và tạp chất nhũ hóa vào nước dùng gây đục. Sôi lăn tăn và hớt bọt thường xuyên giữ nước dùng trong và ngon.'}},
   {q:{zh:'製作高湯時，為什麼建議加入蔬菜根莖（如洋蔥、胡蘿蔔、西芹）？',en:'Why is it recommended to add root vegetables (e.g., onion, carrot, celery) when making stock?',id:'Mengapa disarankan menambahkan sayuran akar (seperti bawang, wortel, seledri) saat membuat kaldu?',vi:'Tại sao nên thêm rau củ cứng (như hành tây, cà rốt, cần tây) khi nấu nước dùng?'},
    opts:[{zh:'增加湯的顏色',en:'Add color to the soup',id:'Menambah warna pada sup',vi:'Thêm màu sắc cho súp',ok:false},
          {zh:'提供甜味、風味層次與香氣，使湯底更豐富',en:'Add sweetness, flavor depth, and aroma to enrich the stock base',id:'Menambah rasa manis, kedalaman rasa, dan aroma untuk memperkaya dasar kaldu',vi:'Thêm vị ngọt, chiều sâu hương vị và mùi thơm để làm phong phú nền nước dùng',ok:true},
          {zh:'讓高湯更快煮好',en:'Make the stock cook faster',id:'Membuat kaldu lebih cepat matang',vi:'Giúp nước dùng nấu nhanh hơn',ok:false}],
    fb:{zh:'正確！洋蔥帶甜味與鮮味、胡蘿蔔增色澤與甜度、西芹提供清新香氣與鮮味，三者合稱「Mirepoix（蔬菜香料底）」，是西式高湯的基礎食材，能讓湯底更有層次。',en:'Correct! Onion adds sweetness and savory depth, carrot adds color and sweetness, and celery provides fresh aroma — together called "Mirepoix," the base for Western stocks, adding complexity.',id:'Benar! Bawang menambah manis dan gurih, wortel menambah warna dan manis, seledri memberikan aroma segar — bersama disebut "Mirepoix", dasar kaldu Barat.',vi:'Đúng! Hành tây thêm ngọt và đậm đà, cà rốt thêm màu và ngọt, cần tây tạo mùi thơm tươi mát — cùng gọi là "Mirepoix", nền tảng nước dùng kiểu Tây.'}},
   {q:{zh:'高湯熬好後，要長期保存應如何處理？',en:'After making stock, what is the best way to store it long-term?',id:'Setelah membuat kaldu, cara terbaik untuk menyimpannya jangka panjang adalah?',vi:'Sau khi nấu xong nước dùng, cách tốt nhất để bảo quản lâu dài là gì?'},
    opts:[{zh:'放入冰箱冷藏，可保存3個月',en:'Refrigerate; it keeps for 3 months',id:'Simpan di kulkas; tahan 3 bulan',vi:'Cất tủ lạnh; bảo quản được 3 tháng',ok:false},
          {zh:'冷卻後分裝入容器，冷凍保存可達1–3個月',en:'Cool, portion into containers, and freeze — keeps for 1–3 months',id:'Dinginkan, bagi ke wadah, dan bekukan — tahan 1–3 bulan',vi:'Để nguội, chia vào hộp và đông lạnh — bảo quản được 1–3 tháng',ok:true},
          {zh:'直接在室溫下放置即可',en:'Leave at room temperature',id:'Biarkan di suhu ruang',vi:'Để ở nhiệt độ phòng là được',ok:false}],
    fb:{zh:'正確！高湯冷卻後應分裝入密封容器，冷凍可保存1–3個月。冷藏只能保存3–4天。可製作成冰塊方便日後取用適量，是廚師節省時間的好習慣。',en:'Correct! After cooling, portion stock into sealed containers and freeze for 1–3 months. Refrigerated stock lasts only 3–4 days. Freezing in ice cube trays is a convenient way to use small amounts later.',id:'Benar! Setelah didinginkan, bagi kaldu ke wadah tertutup dan bekukan selama 1–3 bulan. Di kulkas hanya tahan 3–4 hari.',vi:'Đúng! Sau khi nguội, chia nước dùng vào hộp kín và đông lạnh 1–3 tháng. Tủ lạnh chỉ bảo quản được 3–4 ngày. Đông thành khối đá rất tiện dùng lượng nhỏ sau này.'}},
   {q:{zh:'什麼是「濃縮高湯（Glace）」？',en:'What is a "glace" (concentrated stock)?',id:'Apa itu "glace" (kaldu pekat)?',vi:'"Glace" (nước dùng cô đặc) là gì?'},
    opts:[{zh:'加了大量香料的高湯',en:'Stock with a lot of added spices',id:'Kaldu dengan banyak rempah tambahan',vi:'Nước dùng thêm nhiều gia vị',ok:false},
          {zh:'高湯經過長時間煮沸減量，濃縮至原始體積的1/4或更少',en:'Stock simmered long enough to reduce to 1/4 or less of its original volume',id:'Kaldu yang direbus lama hingga berkurang menjadi 1/4 atau kurang dari volume aslinya',vi:'Nước dùng được đun lâu cho đến khi cô lại còn 1/4 hoặc ít hơn thể tích ban đầu',ok:true},
          {zh:'冷藏後表面結成的油脂層',en:'The fat layer that solidifies on top when refrigerated',id:'Lapisan lemak yang membeku di atas saat didinginkan',vi:'Lớp mỡ đông đặc trên bề mặt khi để lạnh',ok:false}],
    fb:{zh:'正確！Glace（如Glace de viande）是將高湯長時間熬煮濃縮至原始體積的1/10以內，形成高度濃縮的膠狀精華，少量即可大幅提升料理的鮮味與濃郁度。',en:'Correct! Glace (e.g., glace de viande) is stock reduced to 1/10 or less of its volume through prolonged simmering, creating a highly concentrated gelatinous essence that dramatically boosts flavor.',id:'Benar! Glace (seperti glace de viande) adalah kaldu yang direduksi hingga 1/10 atau kurang dari volumenya, menghasilkan esensi gelatin yang sangat pekat.',vi:'Đúng! Glace (như glace de viande) là nước dùng cô lại đến 1/10 thể tích hoặc ít hơn, tạo ra tinh chất cô đặc cao có thể tăng đáng kể hương vị món ăn.'}},
   {q:{zh:'烹調西式濃湯（Cream Soup）時，最後加入鮮奶油的時機是？',en:'When making Western cream soup, when should you add the cream?',id:'Saat membuat sup krim Barat, kapan waktu menambahkan krim?',vi:'Khi nấu súp kem kiểu Tây, thời điểm nào nên thêm kem?'},
    opts:[{zh:'一開始就加入，與其他食材一起煮',en:'At the very beginning, cooking with other ingredients',id:'Di awal sekali, memasak dengan bahan lain',vi:'Ngay từ đầu, nấu cùng các nguyên liệu khác',ok:false},
          {zh:'湯底完成、熄火前或盛碗前加入，避免過度加熱導致乳脂分離',en:'After the soup base is done, just before serving or turning off heat, to avoid excessive heat causing the fat to separate',id:'Setelah sup selesai, sesaat sebelum disajikan atau mematikan api, untuk menghindari panas berlebih yang menyebabkan lemak memisah',vi:'Sau khi nền súp xong, ngay trước khi tắt lửa hoặc múc ra, để tránh nhiệt quá cao làm mỡ tách ra',ok:true},
          {zh:'加鮮奶油前先煮沸，讓鮮奶油充分融入湯中',en:'Boil the cream first, then add it so it blends fully into the soup',id:'Rebus krim terlebih dahulu, lalu tambahkan agar menyatu sepenuhnya dengan sup',vi:'Đun sôi kem trước rồi mới thêm để nó hòa tan đều vào súp',ok:false}],
    fb:{zh:'正確！鮮奶油（Heavy Cream）過度加熱會導致乳脂蛋白質分解、油脂分離，影響湯的口感與外觀。應在湯底完成後，轉小火或熄火後再加入，攪拌均勻即可。',en:'Correct! Heavy cream that overheats can cause fat-protein breakdown and separation, ruining the texture and appearance. Add it after the soup base is done, on low heat or off heat, then stir to combine.',id:'Benar! Krim berat yang terlalu panas menyebabkan pemisahan lemak-protein, merusak tekstur dan penampilan. Tambahkan setelah sup selesai, di api kecil atau matikan api.',vi:'Đúng! Kem đặc đun quá nhiệt gây tách béo-protein, làm hỏng kết cấu và ngoại quan. Thêm sau khi nền súp xong, ở lửa nhỏ hoặc tắt lửa, rồi khuấy đều.'}}
  ],
  /* Lv12 食材辨識與採購 ── 新增 */
  [
   {q:{zh:'挑選新鮮魚類時，下列哪一項是正確的判斷依據？',en:'When choosing fresh fish, which of the following is a correct indicator?',id:'Saat memilih ikan segar, mana indikator yang benar?',vi:'Khi chọn cá tươi, dấu hiệu nào sau đây là đúng?'},
    opts:[{zh:'眼睛凹陷混濁、魚鰓灰白',en:'Sunken, cloudy eyes and pale gray gills',id:'Mata cekung keruh, insang abu-abu pucat',vi:'Mắt lõm đục, mang cá xám nhạt',ok:false},
          {zh:'眼睛清澈凸出、魚鰓鮮紅、按壓肉質有彈性',en:'Clear, bulging eyes; bright red gills; firm flesh that springs back',id:'Mata jernih menonjol, insang merah cerah, daging kenyal saat ditekan',vi:'Mắt trong lồi, mang đỏ tươi, thịt đàn hồi khi ấn',ok:true},
          {zh:'魚身散發強烈腥臭味',en:'Strong fishy/rotten odor',id:'Bau busuk yang kuat',vi:'Mùi tanh nồng nặc',ok:false}],
    fb:{zh:'正確！新鮮魚的眼睛清澈凸出、魚鰓鮮紅無黏液、按壓魚肉會立即回彈，這些都是判斷新鮮度的重要指標。',en:'Correct! Fresh fish has clear, bulging eyes, bright red gills without slime, and flesh that springs back when pressed — all key freshness indicators.',id:'Benar! Ikan segar memiliki mata jernih menonjol, insang merah cerah tanpa lendir, dan daging yang kembali saat ditekan — semua indikator kesegaran penting.',vi:'Đúng! Cá tươi có mắt trong lồi, mang đỏ tươi không nhớt, và thịt đàn hồi trở lại khi ấn — đều là dấu hiệu quan trọng để nhận biết độ tươi.'}},
   {q:{zh:'食品包裝上同時標示「製造日期」與「有效日期（保存期限）」，採購時應優先注意哪一項？',en:'When food packaging shows both a \"manufacture date\" and an \"expiry date\", which should you prioritize when shopping?',id:'Saat kemasan makanan menampilkan \"tanggal produksi\" dan \"tanggal kedaluwarsa\", mana yang harus diprioritaskan?',vi:'Khi bao bì thực phẩm có cả \"ngày sản xuất\" và \"ngày hết hạn\", nên ưu tiên điều gì khi mua?'},
    opts:[{zh:'製造日期，越接近今天越好',en:'Manufacture date — the closer to today, the better',id:'Tanggal produksi — semakin baru semakin baik',vi:'Ngày sản xuất — càng gần hôm nay càng tốt',ok:false},
          {zh:'有效日期，確保購買後有足夠時間食用完畢',en:'Expiry date — to ensure enough time to use the product after purchase',id:'Tanggal kedaluwarsa — memastikan cukup waktu untuk menggunakan produk',vi:'Ngày hết hạn — để đảm bảo có đủ thời gian sử dụng sau khi mua',ok:true},
          {zh:'兩者皆不重要，依外觀判斷即可',en:'Neither matters — judge by appearance alone',id:'Keduanya tidak penting — cukup lihat penampilan',vi:'Cả hai không quan trọng — chỉ cần nhìn bề ngoài',ok:false}],
    fb:{zh:'正確！有效日期（保存期限）代表食品在此日期前品質與安全無虞，採購時應確認有效日期是否足夠涵蓋你預計使用的時間，避免買回家後很快過期。',en:'Correct! The expiry date indicates the product remains safe and good quality until that date. Check that it leaves enough time before you plan to use the product, so it doesn\'t expire too soon after purchase.',id:'Benar! Tanggal kedaluwarsa menunjukkan produk aman dan berkualitas hingga tanggal tersebut. Pastikan ada cukup waktu sebelum Anda berencana menggunakannya.',vi:'Đúng! Ngày hết hạn cho biết sản phẩm vẫn an toàn và chất lượng đến ngày đó. Hãy kiểm tra để có đủ thời gian sử dụng trước khi sản phẩm hết hạn.'}},
   {q:{zh:'要在預算內採購又能確保新鮮度，最有效的做法是？',en:'To shop within budget while ensuring freshness, what is the most effective approach?',id:'Untuk berbelanja sesuai anggaran sambil memastikan kesegaran, apa pendekatan paling efektif?',vi:'Để mua sắm trong ngân sách mà vẫn đảm bảo độ tươi, cách hiệu quả nhất là gì?'},
    opts:[{zh:'依採購清單按計畫購買，並優先選擇當季食材',en:'Shop with a planned list and prioritize seasonal ingredients',id:'Berbelanja dengan daftar terencana dan memilih bahan musiman',vi:'Mua theo danh sách có kế hoạch và ưu tiên nguyên liệu theo mùa',ok:true},
          {zh:'只買最便宜的品牌，不考慮新鮮度',en:'Buy only the cheapest brand regardless of freshness',id:'Beli hanya merek termurah tanpa memperhatikan kesegaran',vi:'Chỉ mua thương hiệu rẻ nhất, không quan tâm độ tươi',ok:false},
          {zh:'看到促銷就大量購買囤貨',en:'Stockpile large quantities whenever there\'s a sale',id:'Menimbun dalam jumlah besar setiap ada promo',vi:'Mua trữ số lượng lớn mỗi khi có giảm giá',ok:false}],
    fb:{zh:'正確！依計畫清單採購可避免衝動購買與浪費，當季食材通常價格較低且新鮮度與營養較佳，是兼顧預算與品質的關鍵習慣。',en:'Correct! Shopping with a planned list avoids impulse buying and waste, and seasonal ingredients are usually cheaper, fresher, and more nutritious — a key habit for balancing budget and quality.',id:'Benar! Berbelanja dengan daftar terencana menghindari pembelian impulsif dan pemborosan, dan bahan musiman biasanya lebih murah, segar, dan bergizi.',vi:'Đúng! Mua theo danh sách có kế hoạch tránh mua sắm bốc đồng và lãng phí, nguyên liệu theo mùa thường rẻ hơn, tươi hơn và bổ dưỡng hơn.'}},
   {q:{zh:'挑選新鮮雞蛋時，下列哪個判斷方式最可靠？',en:'When choosing fresh eggs, which method is most reliable?',id:'Saat memilih telur segar, metode mana yang paling dapat diandalkan?',vi:'Khi chọn trứng tươi, phương pháp nào đáng tin cậy nhất?'},
    opts:[{zh:'蛋殼顏色越白越新鮮',en:'Whiter shells mean fresher eggs',id:'Cangkang lebih putih berarti lebih segar',vi:'Vỏ trứng trắng hơn là tươi hơn',ok:false},
          {zh:'將蛋放入冷水中，沉底者較新鮮，浮起者較不新鮮',en:'Place eggs in cold water; those that sink are fresher, those that float are less fresh',id:'Letakkan telur dalam air dingin; yang tenggelam lebih segar, yang mengapung kurang segar',vi:'Thả trứng vào nước lạnh; trứng chìm thì tươi hơn, trứng nổi thì kém tươi hơn',ok:true},
          {zh:'蛋越大越新鮮',en:'Larger eggs are fresher',id:'Telur lebih besar berarti lebih segar',vi:'Trứng to hơn là tươi hơn',ok:false}],
    fb:{zh:'正確！新鮮雞蛋氣室小，放入水中會沉底；隨時間增加，蛋內水分蒸發、氣室擴大，浮力增加，較不新鮮的蛋會站立甚至漂浮。這是判斷雞蛋新鮮度的簡單有效方法。',en:'Correct! Fresh eggs have a small air cell and sink. As they age, moisture evaporates and the air cell grows, increasing buoyancy. Less-fresh eggs stand upright or float — a simple and effective freshness test.',id:'Benar! Telur segar memiliki ruang udara kecil dan tenggelam. Seiring waktu, kelembapan menguap dan ruang udara membesar, meningkatkan daya apung.',vi:'Đúng! Trứng tươi có buồng khí nhỏ và chìm xuống. Theo thời gian, độ ẩm bay hơi và buồng khí lớn lên, lực nổi tăng. Trứng kém tươi đứng thẳng hoặc nổi lên.'}},
   {q:{zh:'挑選新鮮蔬菜時，下列哪個指標最能代表蔬菜的新鮮度？',en:'When selecting fresh vegetables, which indicator best represents freshness?',id:'Saat memilih sayuran segar, indikator mana yang paling mewakili kesegaran?',vi:'Khi chọn rau tươi, chỉ số nào thể hiện độ tươi tốt nhất?'},
    opts:[{zh:'顏色越深越好',en:'Deeper color is always better',id:'Warna lebih gelap selalu lebih baik',vi:'Màu càng đậm càng tốt',ok:false},
          {zh:'葉片挺立飽滿、切面濕潤有光澤、無枯黃或腐爛',en:'Upright firm leaves, moist and glossy cut surfaces, no yellowing or rot',id:'Daun tegak dan segar, permukaan potongan lembap dan mengkilap, tidak ada kuning atau busuk',vi:'Lá đứng thẳng và căng, bề mặt cắt ẩm và bóng, không vàng héo hay thối',ok:true},
          {zh:'重量越重越好，代表水分足夠',en:'Heavier is always better — it means adequate moisture',id:'Lebih berat selalu lebih baik — artinya kelembapan yang cukup',vi:'Nặng hơn là tốt hơn — nghĩa là đủ nước',ok:false}],
    fb:{zh:'正確！新鮮蔬菜的最佳指標是：葉片挺立不萎軟、切面或斷裂處濕潤有光澤、顏色鮮亮無枯黃斑點、聞起來有自然清香。重量只是參考，不同蔬菜差異大。',en:'Correct! The best freshness indicators are: upright firm leaves (not wilted), moist and glossy cut/broken surfaces, bright colors without yellowing or spots, and a natural fresh aroma. Weight is just a rough guide.',id:'Benar! Indikator kesegaran terbaik: daun tegak tidak layu, permukaan potong lembap dan mengkilap, warna cerah tanpa bercak kuning, dan aroma segar alami.',vi:'Đúng! Dấu hiệu tươi tốt nhất: lá đứng thẳng không héo, bề mặt cắt ẩm và bóng, màu sắc tươi sáng không vàng, mùi thơm tự nhiên.'}},
   {q:{zh:'採購食材時，「有機農產品」與「一般農產品」的主要差異是？',en:'When shopping, what is the main difference between "organic" and "conventional" produce?',id:'Saat berbelanja, apa perbedaan utama antara produk "organik" dan "konvensional"?',vi:'Khi mua sắm, sự khác biệt chính giữa nông sản "hữu cơ" và "thông thường" là gì?'},
    opts:[{zh:'有機農產品不含任何水分，所以保存更久',en:'Organic produce contains no moisture, so it lasts longer',id:'Produk organik tidak mengandung kelembapan, sehingga lebih tahan lama',vi:'Nông sản hữu cơ không chứa độ ẩm nên bảo quản lâu hơn',ok:false},
          {zh:'有機農產品使用較少或不使用合成農藥與化學肥料',en:'Organic produce uses little or no synthetic pesticides or chemical fertilizers',id:'Produk organik menggunakan sedikit atau tidak ada pestisida sintetis dan pupuk kimia',vi:'Nông sản hữu cơ sử dụng ít hoặc không dùng thuốc trừ sâu tổng hợp và phân bón hóa học',ok:true},
          {zh:'有機農產品的營養價值一定比一般農產品高兩倍以上',en:'Organic produce definitely has more than twice the nutritional value of conventional produce',id:'Produk organik pasti memiliki nilai gizi lebih dari dua kali produk konvensional',vi:'Nông sản hữu cơ chắc chắn có giá trị dinh dưỡng cao hơn gấp đôi so với nông sản thông thường',ok:false}],
    fb:{zh:'正確！有機農產品是依照有機農業規範栽培，限制或不使用合成農藥、化學肥料與基因改造生物。但有機並不代表完全無農藥，且營養含量的優勢研究尚未有一致結論。',en:'Correct! Organic produce is grown according to organic farming standards, limiting or avoiding synthetic pesticides, chemical fertilizers, and GMOs. However, organic doesn\'t mean zero pesticides, and nutritional advantages are not yet conclusive.',id:'Benar! Produk organik ditanam sesuai standar pertanian organik, membatasi pestisida sintetis, pupuk kimia, dan GMO.',vi:'Đúng! Nông sản hữu cơ được trồng theo tiêu chuẩn nông nghiệp hữu cơ, hạn chế thuốc trừ sâu tổng hợp, phân bón hóa học và GMO. Nhưng hữu cơ không có nghĩa là không có thuốc, và lợi thế dinh dưỡng chưa có kết luận nhất quán.'}},
   {q:{zh:'採購海鮮時，下列哪個現象代表蝦子不新鮮？',en:'When buying seafood, which sign indicates that shrimp is not fresh?',id:'Saat membeli seafood, tanda mana yang menunjukkan udang tidak segar?',vi:'Khi mua hải sản, dấu hiệu nào cho thấy tôm không tươi?'},
    opts:[{zh:'蝦頭與蝦身連接緊實',en:'The head is firmly attached to the body',id:'Kepala menempel erat pada tubuh',vi:'Đầu gắn chắc vào thân',ok:false},
          {zh:'蝦頭出現黑化或呈現脫離狀態，蝦身軟塌無彈性',en:'The head is blackening or detaching, and the body is soft and not springy',id:'Kepala menghitam atau terlepas, dan tubuh lembek tanpa elastisitas',vi:'Đầu bị đen hoặc rời ra, thân mềm nhão không đàn hồi',ok:true},
          {zh:'蝦子顏色為半透明淺灰色',en:'The shrimp has a translucent light gray color',id:'Udang berwarna abu-abu muda transparan',vi:'Tôm có màu xám nhạt trong suốt',ok:false}],
    fb:{zh:'正確！新鮮蝦子蝦頭緊實、蝦殼有光澤、蝦身透明偏灰或偏綠、按壓有彈性。蝦頭變黑是氧化與細菌活動的結果，蝦身軟塌代表蛋白質已開始降解，都是不新鮮的明顯跡象。',en:'Correct! Fresh shrimp has a firm head, glossy shell, translucent gray-green body, and springs back when pressed. A blackening head indicates oxidation and bacterial activity; a limp body means protein degradation has begun — both clear signs of poor freshness.',id:'Benar! Udang segar memiliki kepala yang kencang, cangkang berkilap, tubuh transparan abu-abu-hijau, dan elastis saat ditekan. Kepala yang menghitam menunjukkan oksidasi dan aktivitas bakteri.',vi:'Đúng! Tôm tươi có đầu chắc, vỏ bóng, thân trong xanh xám và đàn hồi khi ấn. Đầu đen là dấu hiệu oxy hóa và vi khuẩn hoạt động; thân nhão nghĩa là protein đã bắt đầu phân giải.'}}
  ],
  /* Lv13 烘焙入門 */
  [
   {q:{zh:'使用烤箱前，正確的預熱步驟是？',en:'What is the correct preheating step before using an oven?',id:'Apa langkah pemanasan awal yang benar sebelum menggunakan oven?',vi:'Bước làm nóng lò nướng đúng cách là gì?'},
    opts:[{zh:'放入食材後再開始加熱',en:'Put food in first, then start heating',id:'Masukkan makanan dulu, lalu mulai memanaskan',vi:'Cho thức ăn vào trước rồi mới bật lò',ok:false},
          {zh:'先將烤箱預熱至指定溫度，再放入食材',en:'Preheat the oven to the target temperature first, then add food',id:'Panaskan oven ke suhu yang ditentukan dulu, lalu masukkan makanan',vi:'Làm nóng lò đến nhiệt độ yêu cầu trước, rồi mới cho thức ăn vào',ok:true},
          {zh:'預熱與否對烘焙結果沒有影響',en:'Preheating makes no difference to baking results',id:'Pemanasan awal tidak berpengaruh pada hasil pemanggangan',vi:'Làm nóng lò trước không ảnh hưởng đến kết quả nướng',ok:false}],
    fb:{zh:'正確！預熱確保食材一入爐即受到穩定均勻的熱能，是烘焙成功的基礎。未預熱會導致成品膨脹不良、底部受熱不均。',en:'Correct! Preheating ensures food receives stable, even heat from the moment it enters the oven — the foundation of successful baking. Skipping it causes poor rise and uneven cooking.',id:'Benar! Pemanasan awal memastikan makanan menerima panas stabil dan merata sejak masuk oven — dasar keberhasilan memanggang.',vi:'Đúng! Làm nóng lò giúp thức ăn nhận được nhiệt ổn định và đều từ lúc vào lò — nền tảng của nướng bánh thành công.'}},
   {q:{zh:'製作蛋糕時使用低筋麵粉的主要原因是？',en:'Why is low-gluten (cake) flour used for making cakes?',id:'Mengapa tepung rendah gluten digunakan untuk membuat kue?',vi:'Tại sao dùng bột mì ít gluten khi làm bánh?'},
    opts:[{zh:'低筋麵粉比較便宜',en:'Low-gluten flour is cheaper',id:'Tepung rendah gluten lebih murah',vi:'Bột ít gluten rẻ hơn',ok:false},
          {zh:'低筋麵粉蛋白質含量低，成品口感較鬆軟細緻',en:'Low protein content results in a softer, more tender crumb',id:'Kandungan protein rendah menghasilkan tekstur lebih lembut dan halus',vi:'Hàm lượng protein thấp cho kết cấu bánh mềm và mịn hơn',ok:true},
          {zh:'低筋麵粉吸水性最強，不容易失敗',en:'Low-gluten flour absorbs the most water, making it foolproof',id:'Tepung rendah gluten paling banyak menyerap air sehingga tidak mudah gagal',vi:'Bột ít gluten hấp thụ nhiều nước nhất nên không dễ thất bại',ok:false}],
    fb:{zh:'正確！低筋麵粉蛋白質（麩質）含量約8–9%，能形成較少的麵筋網絡，讓蛋糕體更鬆軟；高筋麵粉則適合製作需要嚼勁的麵包。',en:'Correct! Cake flour has ~8–9% protein (gluten), forming less gluten network for a softer, more tender cake. Bread flour with higher protein creates the chewy structure needed for bread.',id:'Benar! Tepung kue memiliki ~8–9% protein (gluten), membentuk jaringan gluten lebih sedikit untuk kue yang lebih lembut.',vi:'Đúng! Bột mì làm bánh có ~8–9% protein, tạo ít mạng gluten hơn cho bánh mềm mịn. Bột mì nhiều gluten phù hợp làm bánh mì cần độ dai.'}},
   {q:{zh:'食譜要求泡打粉（Baking Powder），其主要作用是？',en:'When a recipe calls for baking powder, its main function is?',id:'Saat resep membutuhkan baking powder, fungsi utamanya adalah?',vi:'Khi công thức yêu cầu bột nở, tác dụng chính của nó là gì?'},
    opts:[{zh:'增加甜味',en:'Add sweetness',id:'Menambah rasa manis',vi:'Thêm vị ngọt',ok:false},
          {zh:'產生二氧化碳氣泡，使成品膨脹鬆軟',en:'Generate CO₂ bubbles to make the product rise and become light',id:'Menghasilkan gelembung CO₂ agar produk mengembang dan ringan',vi:'Tạo bong bóng CO₂ làm sản phẩm nở và nhẹ xốp',ok:true},
          {zh:'防止麵糊變色',en:'Prevent the batter from discoloring',id:'Mencegah adonan berubah warna',vi:'Ngăn bột biến màu',ok:false}],
    fb:{zh:'正確！泡打粉在接觸液體與熱能時會釋放二氧化碳，形成無數小氣泡，使成品在烤箱中膨脹並產生鬆軟的組織。',en:'Correct! Baking powder releases CO₂ when it contacts liquid and heat, creating countless tiny bubbles that make the product rise in the oven and produce a light, airy texture.',id:'Benar! Baking powder melepaskan CO₂ saat bersentuhan dengan cairan dan panas, menciptakan gelembung kecil yang membuat produk mengembang di oven.',vi:'Đúng! Bột nở giải phóng CO₂ khi tiếp xúc với chất lỏng và nhiệt, tạo bong bóng nhỏ làm sản phẩm nở trong lò và có kết cấu nhẹ, xốp.'}},
   {q:{zh:'奶油「打發」（cream）的正確描述是？',en:'What best describes "creaming" butter?',id:'Apa deskripsi yang tepat untuk "mengocok" mentega?',vi:'Mo ta dung ve ky thuat danh bong bo la gi?'},
    opts:[{zh:'將奶油加熱融化後混合糖',en:'Melt butter then mix with sugar',id:'Lelehkan mentega lalu campur gula',vi:'Dun chay bo roi tron duong',ok:false},
          {zh:'將室溫軟化的奶油與糖一起攪打至蓬鬆泛白',en:'Beat softened butter with sugar until light and fluffy',id:'Kocok mentega lunak suhu ruang dengan gula hingga mengembang',vi:'Danh bo mem cung duong cho den khi bong nhe va trang',ok:true},
          {zh:'將冷藏奶油切小塊後直接使用',en:'Cut cold butter into small cubes and use directly',id:'Potong mentega dingin menjadi dadu kecil dan gunakan langsung',vi:'Cat bo lanh thanh khoi nho roi dung truc tiep',ok:false}],
    fb:{zh:'正確！打發奶油需使用室溫軟化的奶油，與糖一起攪打讓空氣進入，形成蓬鬆質地，是製作奶油蛋糕的關鍵步驟。',en:'Correct! Creaming requires softened butter at room temperature — beating it with sugar incorporates air, creating a light texture essential for butter cakes.',id:'Benar! Mengocok mentega memerlukan mentega lunak suhu ruang untuk menciptakan tekstur ringan yang penting untuk kue.',vi:'Dung! Danh bong bo can dung bo mem o nhiet do phong de khong khi vao, tao ket cau bong xop, la buoc then chot cho banh bo.'}},
   {q:{zh:'烘焙時，雞蛋的主要功能不包括下列哪項？',en:'Which is NOT a main function of eggs in baking?',id:'Fungsi utama telur dalam memanggang yang bukan termasuk berikut?',vi:'Dau KHONG phai chuc nang chinh cua trung trong nuong banh?'},
    opts:[{zh:'提供結構與凝固力',en:'Provide structure and coagulation',id:'Memberikan struktur dan koagulasi',vi:'Cung cap cau truc va kha nang dong dac',ok:false},
          {zh:'增加色澤與風味',en:'Add color and flavor',id:'Menambah warna dan rasa',vi:'Tang mau sac va huong vi',ok:false},
          {zh:'取代所有麵粉的功能',en:'Replace all the functions of flour',id:'Menggantikan semua fungsi tepung',vi:'Thay the toan bo chuc nang cua bot mi',ok:true}],
    fb:{zh:'正確！雞蛋能提供結構、乳化、色澤與風味，但無法取代麵粉形成麵筋網絡、支撐整體骨架的主要功能。',en:'Correct! Eggs provide structure, emulsification, color, and flavor, but cannot replace the main role of flour — forming gluten networks that support the overall structure.',id:'Benar! Telur memberikan struktur, emulsifikasi, warna, dan rasa, tetapi tidak dapat menggantikan peran utama tepung dalam membentuk jaringan gluten.',vi:'Dung! Trung cung cap cau truc, nhu hoa, mau sac va huong vi, nhung khong the thay the chuc nang chinh cua bot mi la tao mang gluten.'}},
   {q:{zh:'下列哪種油脂最適合製作層次分明的酥皮麵糰（如可頌）？',en:'Which fat is best for making laminated dough with distinct layers (e.g. croissants)?',id:'Lemak mana yang paling cocok untuk membuat adonan berlapis?',vi:'Loai chat beo nao phu hop nhat de lam bot nhieu lop (nhu banh sung bo)?'},
    opts:[{zh:'橄欖油',en:'Olive oil',id:'Minyak zaitun',vi:'Dau o liu',ok:false},
          {zh:'豬油',en:'Lard',id:'Lemak babi',vi:'Mo lon',ok:false},
          {zh:'片狀奶油（乾式奶油）',en:'Sheet butter (dry butter)',id:'Mentega lembaran (mentega kering)',vi:'Bo tam (bo kho)',ok:true}],
    fb:{zh:'正確！製作可頌等千層酥皮需使用含水量低、可塑性高的片狀奶油，才能在折疊時形成清晰的油脂與麵糰層次，烤後呈現蓬鬆酥脆的效果。',en:'Correct! Laminated pastry like croissants needs low-moisture, pliable sheet butter so fat layers stay distinct during folding and create flaky results after baking.',id:'Benar! Pastri berlapis seperti croissant memerlukan mentega lembaran berkadar air rendah agar lapisan lemak tetap jelas saat dilipat.',vi:'Dung! Banh nhieu lop nhu croissant can dung bo tam it nuoc de lop chat beo giu nguyen khi gap va tao ket cau xop gion sau khi nuong.'}},
   {q:{zh:'烘焙成品出爐後，應如何處理才能避免底部受潮？',en:'After baking, what should you do to prevent the bottom from getting soggy?',id:'Setelah memanggang, apa yang harus dilakukan untuk mencegah bagian bawah menjadi lembek?',vi:'Sau khi nuong xong, can lam gi de day banh khong bi am?'},
    opts:[{zh:'立刻放入密封容器保存',en:'Immediately seal in an airtight container',id:'Segera simpan dalam wadah kedap udara',vi:'Day kin ngay vao hop bao quan',ok:false},
          {zh:'移至冷卻架上散熱，讓底部蒸氣散發',en:'Transfer to a cooling rack so steam can escape from the bottom',id:'Pindahkan ke rak pendingin agar uap di bagian bawah bisa keluar',vi:'Chuyen sang gia lam nguoi de hoi nuoc thoat ra khoi day banh',ok:true},
          {zh:'繼續放在烤盤上靜置即可',en:'Leave it on the baking tray to rest',id:'Biarkan saja di atas loyang',vi:'De nguyen tren khay nuong la duoc',ok:false}],
    fb:{zh:'正確！剛出爐的烘焙品底部有殘餘蒸氣，若直接留在烤盤上會使底部變濕軟；放在鐵網冷卻架上能讓空氣從四面流通，保持酥脆。',en:'Correct! Freshly baked goods have residual steam on the bottom; leaving them on the tray traps moisture. A cooling rack allows air to circulate on all sides, keeping the crust crisp.',id:'Benar! Produk yang baru dipanggang memiliki uap sisa di bagian bawah; membiarkannya di loyang akan menjebak kelembapan. Rak pendingin memungkinkan sirkulasi udara dari semua sisi.',vi:'Dung! Banh vua ra lo co hoi nuoc con dong o day; de tren khay se giu am lam day uot. Gia lam nguoi cho khong khi luu thong bon phia, giu banh gion.'}}
  ],
  /* Lv14 節慶料理與宴客技巧 */
  [
   {q:{zh:'宴客時，規劃菜色最重要的原則是？',en:'When hosting a dinner party, the most important principle for menu planning is?',id:'Saat menjamu tamu, prinsip terpenting perencanaan menu adalah?',vi:'Khi chiêu đãi khách, nguyên tắc quan trọng nhất để lên thực đơn là gì?'},
    opts:[{zh:'所有菜色都需要現炒現做，不可提前準備',en:'All dishes must be cooked fresh on the spot, no advance prep allowed',id:'Semua hidangan harus dimasak saat itu juga, tidak boleh disiapkan lebih awal',vi:'Tất cả món phải nấu tươi tại chỗ, không được chuẩn bị trước',ok:false},
          {zh:'菜色冷熱搭配，部分可提前備好，減少上菜前的手忙腳亂',en:'Mix hot and cold dishes; prep some in advance to avoid last-minute chaos',id:'Padukan hidangan panas-dingin; siapkan sebagian lebih awal untuk menghindari kepanikan',vi:'Kết hợp món nóng lạnh; chuẩn bị trước một số món để tránh lộn xộn phút chót',ok:true},
          {zh:'只準備一道主菜即可，避免過於複雜',en:'Prepare only one main dish to avoid complexity',id:'Siapkan hanya satu hidangan utama untuk menghindari kerumitan',vi:'Chỉ chuẩn bị một món chính để tránh phức tạp',ok:false}],
    fb:{zh:'正確！成功的宴客菜單應包含冷盤（可提前做）、熱炒（現做）與主食，這樣分工安排能讓廚師在上菜前從容不迫，也能保證每道菜的品質。',en:'Correct! A successful party menu should include cold dishes (make ahead), hot stir-fries (cook to order), and a main. This split approach lets the cook stay calm before service and maintains quality.',id:'Benar! Menu pesta yang sukses harus mencakup hidangan dingin (buat lebih awal), tumisan panas (masak saat itu), dan makanan utama.',vi:'Đúng! Thực đơn tiệc thành công nên có món nguội (làm trước), món xào nóng (nấu tại chỗ) và món chính.'}},
   {q:{zh:'宴客前一天最應該完成哪些準備工作？',en:'What preparation work should ideally be completed the day before a dinner party?',id:'Pekerjaan persiapan apa yang idealnya diselesaikan sehari sebelum pesta makan malam?',vi:'Công việc chuẩn bị nào nên hoàn thành một ngày trước buổi tiệc?'},
    opts:[{zh:'所有菜色全部烹調完成，隔天加熱即可',en:'Cook all dishes completely, just reheat the next day',id:'Masak semua hidangan sepenuhnya, tinggal dipanaskan keesokan harinya',vi:'Nấu chín tất cả món, hôm sau chỉ hâm nóng lại',ok:false},
          {zh:'完成醃漬備料、切配食材、製作醬汁與可提前做的冷盤',en:'Complete marinating, cutting/prepping ingredients, making sauces, and any make-ahead cold dishes',id:'Selesaikan marinasi, memotong/mempersiapkan bahan, membuat saus, dan hidangan dingin yang bisa dibuat lebih awal',vi:'Hoàn thành ướp gia vị, cắt/sơ chế nguyên liệu, làm nước sốt và các món nguội làm trước được',ok:true},
          {zh:'等當天再做所有準備，才能確保最新鮮',en:'Do all preparation on the day for maximum freshness',id:'Lakukan semua persiapan di hari H untuk kesegaran maksimal',vi:'Làm tất cả vào ngày tiệc để đảm bảo tươi nhất',ok:false}],
    fb:{zh:'正確！提前完成醃漬、切配與醬汁製作，不僅讓食材更入味，也能讓宴客當天只需專注在烹調，大幅降低時間壓力與出錯機率。',en:'Correct! Completing marinating, prepping, and sauce-making the day before not only deepens flavors but also lets you focus solely on cooking on the day, dramatically reducing time pressure and mistakes.',id:'Benar! Menyelesaikan marinasi, persiapan, dan pembuatan saus sehari sebelumnya tidak hanya memperdalam rasa tetapi juga memungkinkan Anda fokus hanya pada memasak di hari H.',vi:'Đúng! Hoàn thành ướp, sơ chế và làm nước sốt từ hôm trước không chỉ giúp gia vị ngấm hơn mà còn cho phép bạn chỉ tập trung nấu vào ngày tiệc.'}},
   {q:{zh:'節慶宴客最後一道菜「甜點」的主要作用是？',en:'What is the main role of \"dessert\" as the final course at a festive dinner?',id:'Apa peran utama \"dessert\" sebagai hidangan terakhir di pesta perayaan?',vi:'Vai trò chính của \"tráng miệng\" trong bữa tiệc lễ hội là gì?'},
    opts:[{zh:'甜點只是額外選項，沒有功能性意義',en:'Dessert is just an optional extra with no functional significance',id:'Dessert hanyalah pilihan tambahan tanpa makna fungsional',vi:'Tráng miệng chỉ là món thêm tùy chọn, không có ý nghĩa chức năng',ok:false},
          {zh:'作為餐宴句點，帶給賓客愉悅的收尾感受，並象徵對賓客的心意',en:'A sweet finish that leaves guests with a pleasant final impression, symbolizing care and warmth',id:'Penutup manis yang memberi kesan akhir yang menyenangkan, melambangkan perhatian kepada tamu',vi:'Kết thúc ngọt ngào tạo ấn tượng cuối tốt cho khách, tượng trưng cho sự quan tâm',ok:true},
          {zh:'補充正餐不足的熱量',en:'Make up for any calories lacking from the main meal',id:'Menambah kalori yang kurang dari makanan utama',vi:'Bổ sung calo còn thiếu từ bữa chính',ok:false}],
    fb:{zh:'正確！甜點是宴席的收尾，能在賓客心中留下美好的最後印象。在文化上，節慶甜點也象徵主人對賓客的心意與祝福，是整場宴會評價的重要一環。',en:'Correct! Dessert closes the meal on a high note, leaving guests with a lasting positive impression. Culturally, festive sweets also symbolize the host\'s care and well-wishes — a key part of the overall reception.',id:'Benar! Dessert menutup hidangan dengan nada tinggi, meninggalkan kesan positif yang bertahan. Secara budaya, manisan perayaan juga melambangkan perhatian dan harapan baik dari tuan rumah.',vi:'Đúng! Tráng miệng kết thúc bữa ăn ở đỉnh cao, để lại ấn tượng tốt lâu dài cho khách. Về văn hóa, đồ ngọt lễ hội tượng trưng cho sự quan tâm và chúc phúc của chủ nhà.'}},
   {q:{zh:'宴客時，哪種擺盤技巧最能提升菜餚的視覺吸引力？',en:'Which plating technique best enhances the visual appeal of a dish at a banquet?',id:'Teknik plating mana yang paling meningkatkan daya tarik visual hidangan dalam jamuan?',vi:'Kỹ thuật trình bày nào giúp tăng sức hấp dẫn thị giác của món ăn trong tiệc?'},
    opts:[{zh:'將所有食材堆成一大堆放在盤中央',en:'Pile all ingredients into a large mound at the center',id:'Tumpuk semua bahan dalam tumpukan besar di tengah piring',vi:'Chất tất cả nguyên liệu thành đống lớn ở giữa đĩa',ok:false},
          {zh:'善用留白、色彩對比與醬汁點綴，讓食材有層次感',en:'Use negative space, color contrast, and sauce accents to create layered visual depth',id:'Gunakan ruang kosong, kontras warna, dan hiasan saus untuk menciptakan kedalaman visual berlapis',vi:'Dùng khoảng trống, tương phản màu sắc và điểm xốt để tạo chiều sâu thị giác có lớp lang',ok:true},
          {zh:'盡量把食材壓扁以節省空間',en:'Flatten ingredients as much as possible to save space',id:'Ratakan bahan sebanyak mungkin untuk menghemat ruang',vi:'Dàn phẳng nguyên liệu để tiết kiệm diện tích',ok:false}],
    fb:{zh:'正確！專業擺盤講究「留白」（給視線休息的空間）、色彩搭配與高低層次，讓整道菜在視覺上如同一件藝術品，提升賓客的用餐期待感。',en:'Correct! Professional plating emphasizes negative space, color harmony, and height variation — making the dish look like a work of art and heightening guests appreciation.',id:'Benar! Plating profesional menekankan ruang kosong, harmoni warna, dan variasi ketinggian — membuat hidangan tampak seperti karya seni.',vi:'Đúng! Trình bày chuyên nghiệp chú trọng khoảng trống, hài hòa màu sắc và chiều cao — khiến món ăn như một tác phẩm nghệ thuật và tăng sự hồi hộp cho khách.'}},
   {q:{zh:'宴客菜單設計時，下列哪項原則最重要？',en:'When designing a banquet menu, which principle is most important?',id:'Saat merancang menu jamuan, prinsip mana yang paling penting?',vi:'Khi thiết kế thực đơn tiệc, nguyên tắc nào quan trọng nhất?'},
    opts:[{zh:'所有菜色都使用同一種主要食材以節省成本',en:'Use the same main ingredient for all dishes to save cost',id:'Gunakan bahan utama yang sama untuk semua hidangan agar hemat biaya',vi:'Dùng cùng một nguyên liệu chính cho tất cả món để tiết kiệm chi phí',ok:false},
          {zh:'考量烹調方法多樣性、食材搭配均衡與賓客飲食限制',en:'Consider cooking method variety, ingredient balance, and guests dietary restrictions',id:'Pertimbangkan variasi metode memasak, keseimbangan bahan, dan pantangan diet tamu',vi:'Cân nhắc sự đa dạng phương pháp nấu, cân bằng nguyên liệu và hạn chế ăn uống của khách',ok:true},
          {zh:'只選擇最昂貴的食材以顯示誠意',en:'Choose only the most expensive ingredients to show sincerity',id:'Pilih hanya bahan paling mahal untuk menunjukkan ketulusan',vi:'Chỉ chọn nguyên liệu đắt nhất để thể hiện sự thành tâm',ok:false}],

    items:[
      {icon:'🔥',zh:'油炸安全 3 大原則',en:'3 Deep-Frying Safety Rules',desc:{zh:'①油量不超過鍋深1/3。②全程保持通風、不離開爐邊。③油溫超過250°C會自燃，出現白煙立即關火。一旦起火：關火→蓋鍋蓋（隔絕氧氣），絕對不可潑水！',en:'①Fill max 1/3 of pot. ②Stay present, keep ventilated. ③Oil auto-ignites above 250°C — white smoke = turn off heat. If fire: off heat → cover pot (cut oxygen). NEVER pour water!',id:'①Isi maks 1/3 panci. ②Tetap ada, ventilasi. ③Minyak terbakar otomatis di atas 250°C — asap putih = matikan api. Jika terbakar: tutup panci, JANGAN air!',vi:'①Đổ tối đa 1/3 nồi. ②Luôn có mặt, thông gió. ③Dầu tự bốc cháy trên 250°C — khói trắng = tắt bếp. Nếu cháy: đậy nắp, KHÔNG đổ nước!'}},
      {icon:'🟦',zh:'瓦斯安全 SOP',en:'Gas Safety SOP',desc:{zh:'聞到瓦斯味：①不開燈/不開關電器。②立即關閉瓦斯總開關。③打開所有門窗通風。④離開室內後再打電話。每日離開廚房前確認旋鈕全關，定期（每3個月）檢查橡膠管。',en:'Smell gas: ①No lights/switches. ②Close main gas valve. ③Open all doors/windows. ④Call from outside. Before leaving kitchen daily: confirm all knobs off. Check rubber hose every 3 months.',id:'Bau gas: ①Jangan nyalakan lampu. ②Tutup katup gas utama. ③Buka semua pintu/jendela. ④Telepon dari luar. Periksa selang karet setiap 3 bulan.',vi:'Ngửi mùi gas: ①Không bật đèn. ②Đóng van gas chính. ③Mở tất cả cửa. ④Gọi điện từ bên ngoài. Kiểm tra ống cao su mỗi 3 tháng.'}},
      {icon:'💧',zh:'防滑與地板安全',en:'Slip & Floor Safety',desc:{zh:'廚房地板意外佔所有廚房事故60%以上。預防三步驟：①穿有防滑底的廚房鞋。②所有液體滴落立即用乾布擦乾並放置濕地警示牌。③繁忙時段在爐前鋪防滑橡膠墊。',en:'Floor accidents = 60%+ of kitchen injuries. Prevent: ①Wear non-slip kitchen shoes. ②Dry all spills immediately + wet floor sign. ③Use anti-slip rubber mat in front of stove during busy hours.',id:'Kecelakaan lantai = 60%+ cedera dapur. Cegah: ①Sepatu dapur anti-slip. ②Keringkan tumpahan segera + tanda lantai basah. ③Karpet karet di depan kompor.',vi:'Tai nạn sàn = 60%+ chấn thương bếp. Phòng ngừa: ①Giày bếp chống trượt. ②Lau khô ngay + biển cảnh báo. ③Thảm cao su trước bếp khi bận.'}},
      {icon:'⚡',zh:'用電安全要點',en:'Electrical Safety',desc:{zh:'①濕手禁止觸碰任何電器（包括開關）。②電線不可橫跨水槽、爐台或置物架。③不可多個大功率電器共用同一插座。④定期（每6個月）檢查電線外皮是否破損，發現破裂立即更換。',en:'①Never touch appliances with wet hands. ②Cords must not cross sink, stove, or racks. ③Do not share outlets between high-wattage appliances. ④Check cords every 6 months for damage.',id:'①Jangan sentuh peralatan dengan tangan basah. ②Kabel tidak boleh melintasi wastafel atau kompor. ③Jangan berbagi stopkontak peralatan berdaya tinggi. ④Periksa kabel setiap 6 bulan.',vi:'①Không chạm thiết bị tay ướt. ②Dây điện không qua bồn rửa. ③Không dùng chung ổ cắm thiết bị công suất cao. ④Kiểm tra dây điện 6 tháng một lần.'}},
      {icon:'🩹',zh:'燙傷緊急處理（5步驟）',en:'Burn First Aid (5 Steps)',desc:{zh:'① 沖：立即以流動冷水沖15–20分鐘（不可用冰水）。② 脫：輕輕移除衣物和飾品（若黏住皮膚不可強行撕除）。③ 泡：持續在冷水中浸泡保持涼爽。④ 蓋：用乾淨紗布或保鮮膜輕蓋傷口。⑤ 送：面積大於手掌或起水泡立即就醫。絕對禁止：牙膏、醬油、沙拉油等民間偏方！',en:'①Cool: cold running water 15–20 min (not ice). ②Remove: gently remove clothing/jewelry (do not tear if stuck). ③Soak: keep in cool water. ④Cover: clean gauze or cling wrap. ⑤Send: seek medical help if larger than palm or blistered. NEVER: toothpaste, soy sauce, or folk remedies!',id:'①Dinginkan: air mengalir 15–20 menit. ②Lepas: pakaian/perhiasan perlahan. ③Rendam: tetap dalam air dingin. ④Tutup: kain kasa bersih. ⑤Kirim ke dokter jika lebih besar dari telapak tangan. JANGAN: pasta gigi atau obat tradisional!',vi:'①Làm mát: nước lạnh chảy 15–20 phút. ②Gỡ: quần áo/đồ trang sức nhẹ nhàng. ③Ngâm: tiếp tục ngâm nước lạnh. ④Che: gạc sạch hoặc màng bọc. ⑤Đến bệnh viện nếu lớn hơn lòng bàn tay. KHÔNG: kem đánh răng hay thuốc dân gian!'}},

    items:[
      {icon:'✋',zh:'正確握刀法（夾刀式）',en:'Correct Grip: Pinch Grip',desc:{zh:'大拇指與食指夾住刀跟（刀身最寬處），其餘三指環繞刀柄。這是專業廚師標準握法：①控制力道精準。②刀具不易滑落。③減少手腕疲勞。初學者常犯錯誤：食指放在刀面上——這樣施力不均、容易割傷！',en:'Pinch the blade heel (widest part) between thumb and index finger; wrap remaining fingers around handle. Benefits: ①precise control ②prevents slipping ③reduces wrist fatigue. Beginner mistake: placing index finger on the flat — causes uneven force and cuts!',id:'Jepit tumit bilah antara ibu jari dan jari telunjuk; jari lainnya melingkupi gagang. Manfaat: ①kontrol tepat ②mencegah tergelincir ③kurangi kelelahan. Kesalahan pemula: jari telunjuk di sisi bilah!',vi:'Kẹp gót lưỡi dao giữa ngón cái và ngón trỏ; các ngón khác ôm cán dao. Lợi ích: ①kiểm soát chính xác ②không trượt ③giảm mỏi cổ tay. Lỗi phổ biến: đặt ngón trỏ lên thân dao!'}},
      {icon:'🐾',zh:'貓爪式保護手（關鍵技法）',en:'Claw Grip: Protecting Your Hand',desc:{zh:'非慣用手保護食材的標準姿勢：指尖向內彎曲（如貓爪），以第一指節引導刀面側面向下切割。好處：①指尖縮進，物理性保護。②指節當作刀面導軌，讓每刀距離均等。③切割速度加快。練習方法：先用大黃瓜慢速練習，待動作自然後再提速。',en:'Guiding hand position: curl fingertips inward (like cat paws); let knuckles guide the flat of the blade. Benefits: ①physical fingertip protection ②knuckles as blade guide for even cuts ③faster cutting. Practice: start slow with a cucumber, speed up once natural.',id:'Posisi tangan pengarah: tekuk ujung jari ke dalam (seperti cakar kucing); buku jari memandu sisi pisau. Manfaat: ①proteksi ujung jari ②potongan merata ③lebih cepat. Latihan: mulai lambat dengan mentimun.',vi:'Vị trí tay dẫn: cong đầu ngón tay vào trong (như móng mèo); đốt ngón dẫn thân dao. Lợi ích: ①bảo vệ đầu ngón tay ②cắt đều ③nhanh hơn. Luyện: bắt đầu chậm với dưa leo.'}},
      {icon:'🔪',zh:'六大刀工技法對照表',en:'6 Knife Cuts Reference',desc:{zh:'①切片（Slice）：厚度一致，適合炒菜。②切絲（Julienne）：3mm×5cm，炒絲瓜、醬菜。③切丁（Dice）：大2cm、中1cm、細0.5cm，燉煮、沙拉。④切段（Chunk）：3–5cm，紅燒、燉湯。⑤剁碎（Mince）：<2mm，蒜末薑末醬料。⑥切末（Fine chop）：2–3mm，蔥花香料。',en:'①Slice: even thickness for stir-fry. ②Julienne: 3mm×5cm for salads. ③Dice: 2cm large/1cm medium/0.5cm brunoise. ④Chunk: 3–5cm for braises/soups. ⑤Mince: <2mm for garlic/ginger/sauces. ⑥Fine chop: 2–3mm for herbs/scallions.',id:'①Iris: ketebalan merata. ②Julienne: 3mm×5cm. ③Dadu: 2cm besar/1cm sedang/0.5cm halus. ④Potongan: 3–5cm untuk rebusan. ⑤Cincang: <2mm untuk bumbu. ⑥Cacah halus: 2–3mm untuk rempah.',vi:'①Thái lát: độ dày đều. ②Sợi: 3mm×5cm. ③Hạt lựu: 2cm lớn/1cm vừa/0.5cm nhỏ. ④Miếng: 3–5cm cho hầm. ⑤Băm: <2mm cho tỏi/gừng. ⑥Băm nhuyễn: 2–3mm cho gia vị.'}},
      {icon:'🗡️',zh:'刀具種類與用途',en:'Knife Types & Uses',desc:{zh:'①主廚刀（18–21cm）：萬用，切肉切菜剁碎皆宜，廚房首選。②蔬菜刀（15cm）：輕盈，適合切葉菜、水果。③去骨刀（細長）：緊貼骨頭分割肉類，刃薄彎曲設計。④麵包刀（鋸齒）：切硬皮麵包不壓扁，不適合切肉蔬菜。⑤削皮刀：去除蔬果外皮，輕巧靈活。',en:'①Chef knife (18–21cm): all-purpose, meat and veg. ②Santoku/veg knife (15cm): light, leafy veg and fruit. ③Boning knife (thin flexible): meat off bone, follows curves. ④Bread knife (serrated): hard crusts without crushing. ⑤Paring knife: peeling, small precision work.',id:'①Pisau chef (18–21cm): serbaguna. ②Pisau sayur (15cm): ringan. ③Pisau tulang (fleksibel tipis): daging dari tulang. ④Pisau roti (bergerigi): kerak keras. ⑤Pisau pengupas: mengupas.',vi:'①Dao đầu bếp (18–21cm): đa năng. ②Dao rau (15cm): nhẹ. ③Dao gỡ xương (mỏng linh hoạt): tách thịt. ④Dao bánh mì (răng cưa): vỏ cứng. ⑤Dao gọt vỏ: gọt vỏ rau củ.'}},
      {icon:'🔧',zh:'磨刀與保養',en:'Knife Sharpening & Care',desc:{zh:'鈍刀是危險的刀！判斷是否需磨刀：用刀腹輕壓番茄皮，若無法切入即需磨刀。磨刀方法：①磨刀石：20度角推磨，兩面各磨10–15次（最佳方法）。②磨刀棒：日常維護，每次烹調前快速修整。③電動磨刀器：方便但損耗較大。保養：每次使用後立即手洗擦乾，不可放入洗碗機，以防鋼材氧化。',en:'A dull knife is a dangerous knife! Test: press blade against tomato skin — if it slips, sharpen it. Methods: ①whetstone at 20°: best, 10–15 strokes each side ②honing steel: quick daily maintenance ③electric sharpener: convenient but removes more metal. Care: hand wash immediately after use, never dishwasher.',id:'Pisau tumpul itu berbahaya! Tes: tekan ke kulit tomat — kalau tergelincir, perlu diasah. Metode: ①batu asah 20°: terbaik ②pengasah baja: perawatan harian ③listrik: nyaman tapi lebih boros. Perawatan: cuci tangan segera setelah digunakan.',vi:'Dao cùn là dao nguy hiểm! Kiểm tra: ép vào vỏ cà chua — nếu trượt là cần mài. Cách mài: ①đá mài 20°: tốt nhất ②gậy mài: bảo dưỡng hàng ngày ③máy mài: tiện nhưng hao dao. Bảo quản: rửa tay ngay sau khi dùng, không rửa máy.'}},
      {icon:'🗂️',zh:'砧板選擇與衛生管理',en:'Cutting Board Selection & Hygiene',desc:{zh:'材質比較：①木頭砧板：抑菌性佳但難清洗，適合生鮮以外用途。②塑膠砧板：容易清洗消毒，推薦用於生肉生魚。③竹砧板：環保但容易有裂縫藏菌。顏色分色系統（國際標準）：紅=生肉、黃=生禽肉、藍=生海鮮、綠=蔬果、白=熟食、棕=烘焙。每次使用後熱水清洗，每週以稀釋漂白水（1:99）浸泡消毒10分鐘。',en:'Materials: ①Wood: natural antibacterial but hard to sanitize — avoid raw meat. ②Plastic: easy to clean/sanitize — recommended for raw meat/fish. ③Bamboo: eco-friendly but prone to cracks. Color system: Red=raw meat, Yellow=raw poultry, Blue=raw seafood, Green=produce, White=cooked, Brown=bakery. Hot-water wash after each use; weekly soak in diluted bleach (1:99) for 10 min.',id:'Bahan: ①Kayu: antibakteri alami tapi sulit disterilkan. ②Plastik: mudah dibersihkan, untuk daging mentah. ③Bambu: ramah lingkungan tapi mudah retak. Sistem warna: Merah=daging mentah, Kuning=unggas, Biru=seafood, Hijau=sayuran, Putih=matang, Coklat=roti.',vi:'Vật liệu: ①Gỗ: kháng khuẩn tự nhiên nhưng khó khử trùng. ②Nhựa: dễ vệ sinh, dùng cho thịt sống. ③Tre: thân thiện môi trường nhưng dễ nứt. Màu sắc: Đỏ=thịt sống, Vàng=gia cầm, Xanh=hải sản, Xanh lá=rau, Trắng=thức ăn chín, Nâu=bánh mì.'}}
    ],
    safeRows:[
      {ok:true,zh:'使用夾刀式（Pinch Grip）握刀',en:'Use pinch grip when holding knife'},
      {ok:true,zh:'非慣用手保持貓爪式保護手指',en:'Keep guiding hand in claw grip'},
      {ok:true,zh:'刀具使用後放回刀架或刀鞘',en:'Return knife to rack or sheath after use'},

      {ok:false,zh:'食指放在刀面上引導（容易割傷）',en:'Placing index finger on blade flat'},
      {ok:false,zh:'刀口朝外放在桌邊',en:'Leaving knife with blade facing outward at table edge'},
      {ok:false,zh:'刀具泡在水槽中',en:'Soaking knives in the sink'},
      {ok:false,zh:'手指平放在食材上（未採用貓爪式）',en:'Laying fingers flat on food instead of using claw grip'}

    tip:{zh:'💡 刀工練習黃金三法則：①慢→準→快（先求準確再提速）。②每天練習比偶爾練習效果好3倍。③切大黃瓜是最佳基礎練習——食材大、好拿、練習貓爪式節奏感。',en:'💡 3 Golden Rules of Knife Practice: ①Slow → Accurate → Fast. ②Daily practice 3× more effective than occasional. ③Cucumber is the best beginner practice — large, easy to hold, great for claw rhythm.',id:'💡 3 Aturan Emas: ①Lambat → Akurat → Cepat. ②Latihan harian 3× lebih efektif. ③Mentimun adalah latihan pemula terbaik.',vi:'💡 3 quy tắc vàng luyện dao: ①Chậm → Chính xác → Nhanh. ②Luyện hàng ngày hiệu quả gấp 3. ③Dưa leo là bài tập tốt nhất cho người mới.'}
  },
  /* Lv3 火候控制 ── 大幅擴充 */
  {
    title:{zh:'火候掌控完全指南',en:'Complete Heat Control Guide',id:'Panduan Lengkap Kontrol Api',vi:'Hướng dẫn kiểm soát lửa toàn diện'},
    visual:{
      title:{zh:'火候溫度帶視覺圖解',en:'Heat Level Temperature Chart'},
      html:`<div style="display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:56px;text-align:right;font-size:10px;color:#888">保溫<br>60–100°C</div>
          <div style="flex:1;height:26px;background:linear-gradient(90deg,#e8f4fd,#bde0f5);border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:#1a4a6b">🔵 保溫・蒸蛋定形</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:56px;text-align:right;font-size:10px;color:#888">小火<br>100–140°C</div>
          <div style="flex:1.5;height:26px;background:linear-gradient(90deg,#d4edda,#a8d5b5);border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:#1a5c30">🟢 慢燉・滷・燜</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:56px;text-align:right;font-size:10px;color:#888">中火<br>140–180°C</div>
          <div style="flex:2;height:26px;background:linear-gradient(90deg,#fff3cd,#ffe08a);border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:#7c5000">🟡 煎・炒蛋・煮湯</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:56px;text-align:right;font-size:10px;color:#888">大火<br>180°C+</div>
          <div style="flex:3;height:26px;background:linear-gradient(90deg,#fdecea,#e57373);border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:#7f1d1d">🔴 快炒・爆香・炸</div></div>
      </div>
      <div style="margin-top:8px;background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:6px 10px;font-size:10.5px;color:#6d4c00">
        🥢 竹筷測油溫：細小穩定氣泡 ≈ 160°C 最佳炸物溫度・劇烈大量冒泡 ≈ 200°C+ 過熱！立即關小火！
      </div>`
    },
    items:[
      {icon:'🌡️',zh:'四段火候對照表',en:'4-Level Heat Reference',desc:{zh:'🔴大火（180°C+）：快炒、爆香、煮沸、燒滾—食材快速上色，水分迅速蒸發。🟡中火（140–180°C）：煎（兩面金黃）、煮湯、炒蛋—平穩加熱，兩面均勻熟透。🟢小火（100–140°C）：慢燉、滷、保溫—湯汁入味、食材軟嫩不焦底。🔵微火（60–100°C）：保溫、蒸蛋定形—維持溫度不繼續烹調。',en:'🔴High (180°C+): stir-fry, searing, boiling — fast browning, rapid moisture loss. 🟡Medium (140–180°C): pan-frying, soup, scrambled egg — even heat, both sides done. 🟢Low (100–140°C): braise, stew, keep warm — deep flavor, tender not burned. 🔵Keep warm (60–100°C): holding temp, setting steamed egg.',id:'🔴Besar (180°C+): tumis, menumis, merebus. 🟡Sedang (140–180°C): goreng, sup, telur orak-arik. 🟢Kecil (100–140°C): rebus lambat, semur. 🔵Hangat (60–100°C): menjaga suhu.',vi:'🔴Lớn (180°C+): xào, phi thơm, đun sôi. 🟡Vừa (140–180°C): chiên, nấu súp, trứng xào. 🟢Nhỏ (100–140°C): hầm, kho. 🔵Ấm (60–100°C): giữ nhiệt.'}},
      {icon:'🥢',zh:'竹筷測油溫（5段判斷法）',en:'Chopstick Oil Test (5 Levels)',desc:{zh:'將竹筷末端插入油中觀察：①無任何反應：油溫低於100°C，太冷勿下料。②出現細小緩慢氣泡：約120–140°C，適合低溫油浸（Oil poaching）。③持續穩定細氣泡：約160°C，一般炸物最佳溫度，外皮酥脆。④快速大量氣泡：約180°C，適合迅速上色的快炸。⑤劇烈冒泡+白煙：超過200°C，過熱危險，立即關小火！',en:'Insert dry chopstick end into oil: ①No reaction: below 100°C — too cold. ②Small slow bubbles: 120–140°C — oil poaching. ③Steady small bubbles: ~160°C — ideal for most frying, crispy result. ④Rapid large bubbles: ~180°C — quick fry for browning. ⑤Violent bubbles + white smoke: 200°C+ — dangerously hot, reduce heat immediately!',id:'Masukkan ujung sumpit ke dalam minyak: ①Tidak ada reaksi: di bawah 100°C. ②Gelembung kecil lambat: 120–140°C. ③Gelembung kecil stabil: ~160°C ideal. ④Gelembung besar cepat: ~180°C. ⑤Gelembung hebat + asap: 200°C+, kurangi api!',vi:'Cắm đũa vào dầu: ①Không phản ứng: dưới 100°C. ②Bong bóng nhỏ chậm: 120–140°C. ③Bong bóng nhỏ ổn định: ~160°C — lý tưởng. ④Bong bóng lớn nhanh: ~180°C. ⑤Sôi bùng + khói trắng: 200°C+, nguy hiểm!'}},
      {icon:'🍳',zh:'六大烹調法火候對應',en:'6 Cooking Methods × Heat Level',desc:{zh:'①快炒（Stir-fry）→大火全程。②炸（Deep-fry）→中大火維持160–180°C。③煎（Pan-fry）→中火，下鍋前先熱鍋至水滴即蒸發。④蒸（Steam）→中大火保持蒸氣量足夠。⑤燉滷（Braise）→大火燒開後轉小火維持微沸。⑥烤（Bake/Roast）→依食材：雞肉190°C、蛋糕170°C、麵包220°C。',en:'①Stir-fry → high heat throughout. ②Deep-fry → medium-high, hold 160–180°C. ③Pan-fry → medium; hot pan test: water droplet evaporates instantly. ④Steam → medium-high, maintain good steam. ⑤Braise → bring to boil on high, then reduce to low simmer. ⑥Bake/Roast → chicken 190°C, cake 170°C, bread 220°C.',id:'①Tumis → api besar. ②Goreng → sedang-besar, 160–180°C. ③Goreng datar → sedang, uji panas wajan. ④Kukus → sedang-besar. ⑤Rebus lambat → besar lalu kecil. ⑥Panggang → ayam 190°C, kue 170°C, roti 220°C.',vi:'①Xào → lửa lớn suốt. ②Chiên ngập → lửa vừa-lớn, giữ 160–180°C. ③Chiên chảo → lửa vừa. ④Hấp → lửa vừa-lớn. ⑤Hầm → sôi lửa lớn rồi giảm lửa nhỏ. ⑥Nướng → gà 190°C, bánh 170°C, bánh mì 220°C.'}},
      {icon:'📊',zh:'鍋具材質與導熱特性',en:'Pan Material & Heat Characteristics',desc:{zh:'①不鏽鋼：導熱均勻但慢，耐高溫，適合煎肉上色。使用前需充分預熱（30–60秒）。②鑄鐵：保溫性極佳，適合長時間燉煮和烤箱使用，但很重、需要開鍋養護。③不沾鍋：中小火使用，勿空燒，不可使用金屬鏟，壽命約2–3年需更換。④銅鍋：導熱最快、最均勻，專業廚房首選，價格高。選擇原則：新手推薦不沾鍋，進階推薦不鏽鋼。',en:'①Stainless steel: even but slow heat, high-temp safe, good searing — preheat 30–60 sec. ②Cast iron: excellent heat retention, ideal for long braises and oven use — heavy, needs seasoning. ③Non-stick: medium-low heat only, no empty heating, no metal utensils, replace every 2–3 years. ④Copper: fastest and most even heat, professional choice, expensive. Recommendation: non-stick for beginners, stainless for advanced.',id:'①Stainless: panas merata tapi lambat, tahan suhu tinggi. ②Besi cor: retensi panas sangat baik. ③Anti lengket: api sedang-kecil saja, ganti tiap 2–3 tahun. ④Tembaga: panas paling merata, mahal.',vi:'①Thép không gỉ: nhiệt đều nhưng chậm. ②Gang: giữ nhiệt tốt, nặng. ③Chống dính: lửa vừa-nhỏ, thay 2–3 năm. ④Đồng: nhanh nhất và đều nhất, đắt tiền.'}}
    ],
    safeRows:[
      {ok:true,zh:'炸物前用竹筷確認油溫',en:'Test oil temperature with chopstick before frying'},
      {ok:true,zh:'食材下鍋前確保油溫達標（約160°C）',en:'Ensure oil reaches correct temp (~160°C) before adding food'},

      {ok:false,zh:'不鏽鋼鍋未預熱就下食材（黏鍋）',en:'Adding food to cold stainless pan (food sticks)'}
    ],
    tip:{zh:'💡 「鍋熱油冷食材新」是炒出鑊氣的關鍵：①大火把鍋燒到冒煙。②再下冷油搖均。③油溫升起後立刻下食材大火快炒。這樣食材不黏鍋、快速上色、保留鮮脆！',en:'💡 \"Hot pan, cool oil, fresh ingredients\" — the secret to wok hei: ①Heat pan until it smokes on high. ②Add cold oil and swirl. ③Once oil shimmers, add ingredients and stir-fry fast. Result: nothing sticks, quick browning, crispy texture!',id:'💡 \"Wajan panas, minyak dingin, bahan segar\" — rahasia wok hei: ①Panaskan wajan sampai berasap. ②Tambah minyak dingin. ③Segera tambah bahan dan tumis cepat.',vi:'💡 \"Chảo nóng, dầu nguội, nguyên liệu tươi\" — bí quyết wok hei: ①Đun nóng chảo đến khi bốc khói. ②Cho dầu lạnh vào xoáy đều. ③Khi dầu nóng, cho nguyên liệu vào xào nhanh.'}
  },
  /* Lv4 食材保存 ── 大幅擴充 */
  {
    title:{zh:'食材保存完全指南',en:'Complete Food Storage Guide',id:'Panduan Lengkap Penyimpanan Bahan',vi:'Hướng dẫn bảo quản thực phẩm toàn diện'},
    visual:{
      title:{zh:'冰箱分層黃金佈局',en:'Optimal Fridge Layout'},
      html:`<div style="border:2px solid #aaa;border-radius:10px;overflow:hidden;font-size:10.5px;max-width:420px;margin:0 auto">
        <div style="background:#c0d8f0;padding:6px 10px;text-align:center;font-weight:600;font-size:11px;color:#1a2a4a">🚪 冰箱門架 / Door Shelf — ⚠️ 溫度最不穩定</div>
        <div style="padding:4px 8px;border-bottom:1px dashed #ccc;background:#e8f5ee;display:flex;gap:8px;align-items:center">
          <span style="font-size:16px">🍳</span>

        <div style="padding:4px 8px;border-bottom:1px dashed #ccc;background:#f5f5f5;display:flex;gap:8px;align-items:center">
