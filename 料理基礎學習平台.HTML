      {ok:false,zh:'整批高湯反覆加熱多次後才用完',en:'Repeatedly reheating the whole batch of stock before using it up'}
    ],
    tip:{zh:'💡 一鍋好湯的關鍵口訣「冷水起、小火滾、勤撈沫、晚下鹽」：冷水下鍋讓風味慢慢釋出，小火維持清澈，隨時撈除浮沫雜質，最後才調味，就能熬出清澈鮮美的高湯，是中西式湯品共通的基本功。',en:'💡 The golden rule for great stock: \"cold start, gentle simmer, skim often, season last\" — starting with cold water lets flavors release slowly, gentle heat keeps it clear, regular skimming removes impurities, and seasoning at the end gives a clear, flavorful stock. This is a universal foundation for both Chinese and Western soups.',id:'💡 Kunci kaldu enak: \"mulai dingin, mendidih perlahan, sering angkat buih, garam di akhir\" — air dingin membuat rasa keluar perlahan, api kecil menjaga kejernihan, angkat buih secara rutin, dan beri garam di akhir untuk kaldu jernih dan gurih. Ini dasar universal untuk sup gaya Tionghoa maupun Barat.',vi:'💡 Bí quyết nước dùng ngon: \"bắt đầu lạnh, sôi lăn tăn, hớt bọt thường xuyên, nêm muối cuối cùng\" — nước lạnh giúp hương vị tan ra chậm, lửa nhỏ giữ độ trong, hớt bọt thường xuyên loại bỏ tạp chất, và nêm gia vị cuối cùng cho nước dùng trong và đậm đà. Đây là nền tảng chung cho cả súp kiểu Trung và Tây.'}
  },
  /* Lv12 食材辨識與採購 ── 新增 */
  {
    title:{zh:'食材辨識與採購完全指南',en:'Complete Ingredient ID & Shopping Guide',id:'Panduan Lengkap Identifikasi & Belanja Bahan',vi:'Hướng dẫn nhận biết & mua nguyên liệu toàn diện'},
    visual:{
      title:{zh:'食材新鮮度速查圖解：看・摸・聞・壓',en:'Freshness Check: Look · Touch · Smell · Press'},
      html:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
        <div style="background:#e8f5ee;border:1px solid #a5d6a7;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🐟 魚類 Fish</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            👁️ 眼睛清澈凸出<br>
            🔴 魚鰓鮮紅無黏液<br>
            👆 肉質按壓有彈性<br>
            👃 淡淡海腥味（非惡臭）
          </div>
        </div>
        <div style="background:#fce4ec;border:1px solid #f48fb1;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🥩 肉類 Meat</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            🌸 豬肉粉紅、牛肉鮮紅<br>
            ✋ 肉面有光澤不黏滑<br>
            💪 按壓有彈性回彈<br>
            👃 無異味或酸臭味
          </div>
        </div>
        <div style="background:#e3f2fd;border:1px solid #90caf9;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🥦 蔬菜 Vegetables</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            🌿 葉片挺立、色澤鮮亮<br>
            💧 無黃葉、軟爛或斑點<br>
            ✋ 根莖表面硬實<br>
            👃 無發酵酸腐氣味
          </div>
        </div>
        <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🍑 水果 Fruits</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            🎨 色澤均勻、無壓傷<br>
            ✋ 手感硬實（視種類）<br>
            👃 底部有自然果香<br>
            🔍 無滲汁或凹陷痕跡
          </div>
        </div>
      </div>
      <div style="margin-top:6px;background:#f5f5f5;border-radius:6px;padding:6px 10px;font-size:10.5px;color:#555">
        📦 看食品標籤三步：① 有效日期（選較晚的）② 保存方式（依標示存放）③ 成分表（第一項=主要成分）
      </div>`
    },
    items:[
      {icon:'🐟',zh:'海鮮新鮮度判斷要點',en:'Seafood Freshness Checkpoints',desc:{zh:'魚類：眼睛清澈凸出、魚鰓鮮紅無黏液、魚身按壓有彈性會回彈、魚鱗緊附不易脫落。蝦類：外殼透亮有光澤、頭尾緊連身體、無變黑現象。蛤蜊／貝類：購買時應仍緊閉或輕觸會閉合，聞起來應有淡淡海水味而非腥臭味。',en:'Fish: clear, bulging eyes; bright red, slime-free gills; flesh that springs back when pressed; scales that adhere tightly. Shrimp: translucent, shiny shell; head and tail firmly attached to the body; no black discoloration. Clams/shellfish: shells should be tightly closed or close when tapped, with a faint sea smell rather than a foul odor.',id:'Ikan: mata jernih menonjol; insang merah cerah tanpa lendir; daging kenyal saat ditekan; sisik menempel kuat. Udang: cangkang bening berkilau; kepala dan ekor menyatu kuat dengan badan; tidak menghitam. Kerang: cangkang harus tertutup rapat atau menutup saat disentuh, berbau laut tipis bukan bau busuk.',vi:'Cá: mắt trong lồi; mang đỏ tươi không nhớt; thịt đàn hồi khi ấn; vảy dính chặt. Tôm: vỏ trong sáng bóng; đầu và đuôi gắn chặt với thân; không bị đen. Sò/nghêu: vỏ phải khép chặt hoặc khép lại khi chạm, có mùi biển nhẹ chứ không phải mùi hôi.'}},
      {icon:'🥩',zh:'肉類新鮮度判斷要點',en:'Meat Freshness Checkpoints',desc:{zh:'豬肉：呈淡粉紅色，脂肪潔白，表面略濕潤但不黏手，按壓有彈性。雞肉：皮膚呈淡黃或淡粉色，無異味，肉質緊實。牛肉：呈鮮紅色，脂肪呈乳白或淡黃色，紋理清晰。所有肉類若出現灰綠色、表面黏液過多或散發酸臭異味，皆應避免購買。',en:'Pork: pale pink with white fat, slightly moist but not sticky surface, springs back when pressed. Chicken: pale yellow or pink skin, no off-odor, firm flesh. Beef: bright red with creamy white or pale yellow fat, clear marbling. Avoid any meat that is grayish-green, excessively slimy, or has a sour/foul smell.',id:'Babi: merah muda pucat dengan lemak putih, permukaan sedikit lembap tapi tidak lengket, kenyal saat ditekan. Ayam: kulit kuning pucat atau merah muda, tanpa bau, daging padat. Sapi: merah cerah dengan lemak krem atau kuning pucat, serat jelas. Hindari daging yang abu-abu kehijauan, terlalu berlendir, atau berbau asam/busuk.',vi:'Thịt heo: màu hồng nhạt với mỡ trắng, bề mặt hơi ẩm nhưng không nhớt, đàn hồi khi ấn. Thịt gà: da vàng nhạt hoặc hồng, không có mùi lạ, thịt chắc. Thịt bò: màu đỏ tươi với mỡ trắng kem hoặc vàng nhạt, vân thịt rõ. Tránh thịt có màu xám xanh, quá nhớt, hoặc có mùi chua/hôi.'}},
      {icon:'🥦',zh:'蔬果新鮮度判斷要點',en:'Produce Freshness Checkpoints',desc:{zh:'葉菜類：葉片挺立、色澤鮮綠、無黃葉或軟爛斑點。根莖類（紅蘿蔔、馬鈴薯）：表面硬實、無發芽或皺縮。水果：依香氣判斷熟度（如鳳梨、芒果底部聞起來應有自然果香），避免表皮有壓傷凹陷或滲出汁液。整體原則：用「看色澤、摸軟硬、聞氣味」三步驟快速檢查。',en:'Leafy greens: crisp, upright leaves with vibrant green color, no yellowing or mushy spots. Root vegetables (carrots, potatoes): firm surface, no sprouting or shriveling. Fruit: judge ripeness by aroma (e.g., pineapple and mango should smell fragrant at the base), and avoid bruised, dented, or leaking skin. General rule: \"look at color, feel firmness, smell the aroma\" as a quick 3-step check.',id:'Sayuran daun: daun tegak, hijau cerah, tanpa bagian kuning atau lembek. Sayuran akar (wortel, kentang): permukaan keras, tidak bertunas atau keriput. Buah: nilai kematangan dari aroma (nanas, mangga harus beraroma di bagian bawah), hindari kulit memar atau bocor. Aturan umum: \"lihat warna, raba kekerasan, cium aroma\".',vi:'Rau lá: lá đứng, xanh tươi, không vàng hoặc nhũn. Rau củ (cà rốt, khoai tây): bề mặt cứng, không mọc mầm hoặc nhăn nheo. Trái cây: đánh giá độ chín qua mùi hương (dứa, xoài nên có mùi thơm ở đáy), tránh vỏ bị bầm hoặc chảy nước. Quy tắc chung: \"nhìn màu, sờ độ cứng, ngửi mùi\".'}},
      {icon:'🏷️',zh:'食品標籤與保存期限解讀',en:'Reading Food Labels & Expiry Dates',desc:{zh:'標籤上應留意：①有效日期／保存期限（此日期前品質安全無虞，購買時應選擇較晚的日期）。②保存方式（常溫、冷藏、冷凍）需依標示正確存放。③成分表：成分依含量多寡排序，第一項即為主要成分。④過敏原標示：對特定食材過敏者務必確認。開封後即使尚未到期，也應依「開封後建議天數」儘快食用完畢。',en:'On labels, check: ①Expiry/best-before date (the food is safe and good quality before this date — choose later dates when shopping). ②Storage instructions (ambient, refrigerated, frozen) — store as directed. ③Ingredient list — ingredients are listed by quantity, with the first being the main ingredient. ④Allergen labeling — essential for those with food allergies. Even before expiry, follow \"use within X days after opening\" guidance.',id:'Pada label, perhatikan: ①Tanggal kedaluwarsa (makanan aman sebelum tanggal ini — pilih tanggal yang lebih lama saat berbelanja). ②Instruksi penyimpanan (suhu ruang, kulkas, beku) — simpan sesuai petunjuk. ③Daftar bahan — diurutkan berdasarkan jumlah, yang pertama adalah bahan utama. ④Label alergen — penting bagi yang memiliki alergi.',vi:'Trên nhãn, kiểm tra: ①Ngày hết hạn (thực phẩm an toàn trước ngày này — chọn ngày xa hơn khi mua). ②Hướng dẫn bảo quản (thường, lạnh, đông) — bảo quản theo chỉ dẫn. ③Danh sách thành phần — xếp theo số lượng, thành phần đầu là chính. ④Nhãn dị ứng — quan trọng với người có dị ứng thực phẩm.'}},
      {icon:'🧂',zh:'常見調味料與辛香料辨識',en:'Common Seasonings & Spices ID',desc:{zh:'醬油：依顏色與用途分「生抽」（淡色、調味提鮮）與「老抽」（深色、上色用）。醋：分「白醋」（清香、適合醃漬）、「烏醋」（風味濃郁、適合台式料理）、「米酒醋」（溫和、適合涼拌）。辛香料：八角（滷味常用，呈星形）、花椒（麻味來源，顆粒小）、肉桂（甜香，條狀或粉狀）。認識這些基本款，才能依食譜正確選用。',en:'Soy sauce: classified by color/use — \"light soy sauce\" (thin, for seasoning and umami) vs \"dark soy sauce\" (thick, for color). Vinegar: \"white vinegar\" (mild, for pickling), \"black vinegar\" (rich flavor, for Taiwanese dishes), \"rice vinegar\" (mild, for cold dishes). Spices: star anise (star-shaped, common in braises), Sichuan peppercorn (small, numbing flavor), cinnamon (sweet aroma, stick or powder). Knowing these basics helps you follow recipes correctly.',id:'Kecap: berdasarkan warna/penggunaan — \"kecap asin/encer\" (untuk rasa dan umami) vs \"kecap manis/kental\" (untuk warna). Cuka: \"cuka putih\" (ringan, untuk acar), \"cuka hitam\" (rasa kaya, untuk masakan Taiwan), \"cuka beras\" (ringan, untuk hidangan dingin). Rempah: bunga lawang (bentuk bintang, untuk masakan kuah), merica Sichuan (kecil, rasa kebas), kayu manis (aroma manis, batang atau bubuk).',vi:'Nước tương: theo màu/dùng — \"tương nhạt\" (loãng, để nêm và tạo umami) và \"tương đậm\" (đặc, để tạo màu). Giấm: \"giấm trắng\" (nhẹ, để ngâm chua), \"giấm đen\" (đậm vị, cho món Đài Loan), \"giấm gạo\" (nhẹ, cho món trộn). Gia vị: hồi (hình sao, dùng kho), tiêu Tứ Xuyên (nhỏ, gây tê), quế (thơm ngọt, dạng thanh hoặc bột).'}},
      {icon:'💰',zh:'採購預算與比價技巧',en:'Budgeting & Price Comparison',desc:{zh:'①以「單位價格」（每100克或每公斤價格）比較不同包裝大小的商品，避免被「特大包裝看似便宜」誤導。②列好採購清單並設定每週預算，到場後依清單採購可減少衝動消費。③優先選擇當季食材，價格通常較便宜且品質較佳。④冷凍食品與乾貨可在促銷時適量囤貨，但生鮮食材應依需求量購買，避免過期浪費。⑤善用「先進先出」原則整理採購回來的食材。',en:'①Compare \"unit price\" (per 100g or per kg) across different package sizes — large packages aren\'t always cheaper. ②Make a shopping list with a weekly budget and stick to it to reduce impulse buying. ③Prioritize seasonal ingredients, which are usually cheaper and better quality. ④Frozen and dry goods can be stocked up during sales, but buy fresh ingredients only in needed quantities to avoid waste. ⑤Apply \"first-in-first-out\" when organizing what you bring home.',id:'①Bandingkan \"harga per unit\" (per 100g atau per kg) antar ukuran kemasan — kemasan besar tidak selalu lebih murah. ②Buat daftar belanja dengan anggaran mingguan dan patuhi untuk mengurangi pembelian impulsif. ③Prioritaskan bahan musiman, biasanya lebih murah dan berkualitas. ④Makanan beku dan kering bisa ditimbun saat promo, tapi bahan segar beli sesuai kebutuhan. ⑤Terapkan \"first-in-first-out\" saat menyimpan belanjaan.',vi:'①So sánh \"giá trên đơn vị\" (mỗi 100g hoặc mỗi kg) giữa các kích cỡ gói — gói lớn không phải lúc nào cũng rẻ hơn. ②Lập danh sách mua sắm với ngân sách hàng tuần và tuân theo để giảm mua sắm bốc đồng. ③Ưu tiên nguyên liệu theo mùa, thường rẻ hơn và chất lượng tốt hơn. ④Thực phẩm đông lạnh và khô có thể mua khi giảm giá, nhưng thực phẩm tươi chỉ mua theo nhu cầu. ⑤Áp dụng \"nhập trước xuất trước\" khi sắp xếp đồ mua về.'}}
    ],
    safeRows:[
      {ok:true,zh:'挑選魚類時檢查眼睛、魚鰓與肉質彈性',en:'Check eyes, gills, and flesh firmness when choosing fish'},
      {ok:true,zh:'採購前列好清單並設定週預算',en:'Make a shopping list and set a weekly budget before shopping'},
      {ok:true,zh:'比較單位價格而非只看包裝總價',en:'Compare unit prices rather than total package price'},
      {ok:true,zh:'優先選購當季且即將到期日較晚的食材',en:'Prioritize seasonal items with later expiry dates'},
      {ok:true,zh:'依保存方式（冷藏／冷凍／常溫）正確存放食材',en:'Store ingredients correctly per their labeled storage method'},
      {ok:false,zh:'只看包裝大小決定划算與否',en:'Judging value only by package size'},
      {ok:false,zh:'看到促銷生鮮食材就大量購買囤積',en:'Stockpiling fresh perishables just because they are on sale'},
      {ok:false,zh:'忽略食品標籤上的有效日期與保存方式',en:'Ignoring the expiry date and storage instructions on food labels'}
    ],
    tip:{zh:'💡 採購三步驟口訣「看標籤、比單價、列清單」：出門前先列好清單與預算，到場後用單位價格比較商品，並隨手檢查有效日期與新鮮度三大指標（看色澤、摸軟硬、聞氣味），就能用最划算的價格買到最新鮮的食材。',en:'💡 The 3-step shopping rule: \"check labels, compare unit prices, follow your list\" — make a list and budget before you go, compare unit prices in-store, and check expiry dates plus the 3 freshness signs (color, firmness, smell) to get the freshest ingredients at the best value.',id:'💡 Aturan belanja 3 langkah: \"cek label, bandingkan harga per unit, ikuti daftar\" — buat daftar dan anggaran sebelum berangkat, bandingkan harga per unit di toko, dan periksa tanggal kedaluwarsa serta 3 tanda kesegaran (warna, kekerasan, aroma) untuk mendapatkan bahan paling segar dengan harga terbaik.',vi:'💡 Quy tắc mua sắm 3 bước: \"kiểm tra nhãn, so sánh giá đơn vị, theo danh sách\" — lập danh sách và ngân sách trước khi đi, so sánh giá đơn vị tại cửa hàng, và kiểm tra ngày hết hạn cùng 3 dấu hiệu tươi (màu, độ cứng, mùi) để mua được nguyên liệu tươi nhất với giá tốt nhất.'}
  },
  /* Lv13 烘焙入門 */
  {
    title:{zh:'烘焙入門完全指南',en:'Baking Basics Complete Guide',id:'Panduan Lengkap Dasar Memanggang',vi:'Hướng dẫn toàn diện cơ bản làm bánh'},
    visual:{
      title:{zh:'烘焙關鍵工具與材料一覽',en:'Key Baking Tools & Ingredients Overview'},
      html:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
        <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🌡️ 溫度控制</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            預熱：至少提前15分鐘<br>
            蛋糕：160–180°C<br>
            餅乾：170–190°C<br>
            麵包：180–220°C
          </div>
        </div>
        <div style="background:#f3e5f5;border:1px solid #ce93d8;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🌾 麵粉類型</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            低筋 8–9% → 蛋糕、餅乾<br>
            中筋 10–12% → 包子、饅頭<br>
            高筋 12–14% → 麵包、pizza
          </div>
        </div>
        <div style="background:#e8f5ee;border:1px solid #a5d6a7;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🧪 膨鬆劑</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            泡打粉：遇液+熱釋CO₂<br>
            小蘇打：需酸性材料活化<br>
            酵母：生物發酵，需時間
          </div>
        </div>
        <div style="background:#fce4ec;border:1px solid #f48fb1;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🧈 油脂處理</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            室溫軟化：按壓留印不融<br>
            融化奶油：隔水加熱最穩<br>
            植物油：適合濕潤蛋糕體
          </div>
        </div>
      </div>`
    },
    sections:[
      {
        heading:{zh:'烘焙基本原則',en:'Core Baking Principles'},
        body:{zh:'烘焙是精確的科學。與一般炒菜不同，烘焙的材料比例、溫度與操作順序直接決定成敗。每次烘焙前務必：①確認食材在室溫（雞蛋、奶油提前30分鐘回溫）②精確秤量材料（勿以目測）③依序加入材料（通常是乾濕分開再混合）。',

function applyI18N(){
  document.querySelectorAll('[data-i]').forEach(function(el){
    var k=el.getAttribute('data-i');
    var v=t(k);
    if(v)el.textContent=v;
  });
}

function calcPct(){
  var total=0,done=0;
  MODS.forEach(function(m){total+=m.total;done+=m.done});
  return total>0?Math.round(done/total*100):0;
}

function updateProgressUI(){
  var p=calcPct();
  var fill=document.getElementById('hero-prog-fill');
  var label=document.getElementById('hero-prog-label');
  if(fill) fill.style.width=p+'%';
  if(label) label.textContent='整體 '+p+'%';
}

function buildSidebar(){
  var el=document.getElementById('sb-modules');
  if(!el)return;
  var html='';
  MODS.forEach(function(m,i){
    var label=m.titles[curLang]||m.titles.zh;
    var isDone=m.done===m.total&&m.total>0;
    var isAct=(i===curMod && curView==='levels');
    var pct=m.total>0?Math.round(m.done/m.total*100):0;
    var dotColor=isDone?'#1a7248':(m.done>0?'#8a2800':'var(--color-border-primary)');
    html+='<div class=\"si'+(isAct?' act':'')+(isDone?' sdone':'')+'\" onclick=\"loadModule('+i+')\" title=\"主題'+m.lv+' '+label+'\">';
    html+='<span class=\"si-emoji\">'+m.emoji+'</span>';
    html+='<div style=\"flex:1;min-width:0\"><div style=\"font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+label+'</div><div class=\"si-sub\">主題'+m.lv+' · '+pct+'%</div></div>';
    html+='<div class=\"sprogdot\" style=\"background:'+dotColor+'\"></div>';
    html+='</div>';
  });
  el.innerHTML=html;
}

    html+='<div class=\"saferow '+(checked?'ok':'no')+'\">';
    html+='<i class=\"ti ti-'+(checked?'circle-check':'circle')+'\" aria-hidden=\"true\"></i>';
    html+='<div><div class=\"stxt\">'+tp.zh+'</div><div class=\"sen\">'+tp.en+'</div></div>';
    html+='</div>';
  });
  html+='</div></div>';
  html+='<div class=\"quick\" style=\"justify-content:center\">';
  html+='<button class=\"qbtn pri\" onclick=\"showView(\'quiz\', true)\">'+t('btn.quiz')+'</button>';
  if(idx<MODS.length-1)html+='<button class=\"qbtn\" onclick=\"loadModule('+(idx+1)+')\">下一個主題：'+(MODS[idx+1] ? (MODS[idx+1].titles[curLang]||MODS[idx+1].titles.zh) : '')+' →</button>';
  if(idx>0)html+='<button class=\"qbtn\" onclick=\"loadModule('+(idx-1)+')\">← 上一個主題：'+(MODS[idx-1] ? (MODS[idx-1].titles[curLang]||MODS[idx-1].titles.zh) : '')+'</button>';
  html+='</div></div></div>';
  html+='</div></div>';
  
  return html;
}

function switchLesTab(btn,name){
  var lesbody=btn.closest('.lesbody');
  if(!lesbody)return;
  lesbody.querySelectorAll('.les-tab').forEach(function(b){b.classList.remove('act')});
  btn.classList.add('act');
  lesbody.querySelectorAll('.les-tabpanel').forEach(function(p){p.classList.remove('act')});
  var panel=lesbody.querySelector('#les-tab-'+name);
  if(panel)panel.classList.add('act');
}

function toggleTopicDone(modIdx,topicIdx,tickEl){
  var m=MODS[modIdx];
  var tp=m.topics[topicIdx];
  var row=tickEl.closest('.trow');
  var dotEl=row?row.querySelector('.tdot'):null;
  var tagEl=row?row.querySelector('.ttag'):null;
  var isDone=tickEl.classList.contains('checked');
  if(isDone){
    tp.s=0;
    tickEl.classList.remove('checked');tickEl.textContent='';tickEl.title=t('topic.mark');
    if(dotEl)dotEl.className='tdot dot-next';
    if(tagEl){tagEl.className='ttag tag-nx';tagEl.textContent=t('tag.next');}
  }else{
    tp.s=2;
    tickEl.classList.add('checked');tickEl.textContent='✓';tickEl.title=t('topic.unmark');
    if(dotEl)dotEl.className='tdot dot-done';
    if(tagEl){tagEl.className='ttag tag-done';tagEl.textContent=t('tag.done');}
  }
  m.done=Math.min(m.topics.filter(function(tp){return tp.s===2}).length,m.total);
  updateProgressUI();buildSidebar();buildLevelPath();
}

function renderQuiz(){
  var qi_set=Math.min(curMod,QUIZZES.length-1);
  var qs=QUIZZES[qi_set]||QUIZZES[0];
  var qi=quizState.q%qs.length;
  var q=qs[qi];
  var totalQ=qs.length;
  var curQNum=qi+1;
  var pct=Math.round(quizState.q/totalQ*100);

  var html='<div class=\"sechd\"><h2>'+t('quiz.title')+' — '+MODS[curMod].titles[curLang]+'</h2><div class=\"ln\"></div></div>';

  // 進度區塊
  html+='<div class=\"quiz-prog\">';
  // 第一行：題號 + 答對數
  html+='<div class=\"quiz-prog-row\">';
  var qCounterLabel=curLang==='en'?('Q '+curQNum):curLang==='id'?('Soal '+curQNum):curLang==='vi'?('Câu '+curQNum):('第 '+curQNum+' 題');
  var qTotalLabel=curLang==='en'?('/'+totalQ):curLang==='id'?('/'+totalQ):curLang==='vi'?('/'+totalQ):('共'+totalQ+'題');
  html+='<span class=\"quiz-q-counter\">'+qCounterLabel+'</span>';
  html+='<span class=\"quiz-q-total\">'+qTotalLabel+'</span>';
  html+='<div style=\"flex:1\"></div>';
  html+='<span style=\"font-size:11px;color:var(--color-text-tertiary)\">答對</span>';
  html+='<span style=\"font-size:13px;font-weight:600;color:#8a2800;margin-left:3px\">'+quizState.score+'</span>';
  html+='<span style=\"font-size:11px;color:var(--color-text-tertiary);margin-left:1px\"> / '+totalQ+'</span>';
  html+='</div>';
  // 第二行：進度點點
  html+='<div class=\"quiz-dots\">';
  for(var di=0;di<totalQ;di++){
    var dotCls='quiz-dot';
    if(di<quizState.q) dotCls+=' done';
    else if(di===quizState.q) dotCls+=' cur';
    html+='<div class=\"'+dotCls+'\" title=\"第'+(di+1)+'題\"></div>';
  }
  html+='</div>';
  // 第三行：進度條
  html+='<div class=\"quiz-prog-row\">';
  html+='<div class=\"qptrack\"><div class=\"qpfill\" style=\"width:'+pct+'%\"></div></div>';
  html+='<span class=\"quiz-prog-label\">'+pct+'%</span>';
  html+='</div>';
  html+='</div>';

  html+='<div class=\"quiz-wrap\"><div class=\"quiz-q\">'+(q.q[curLang]||q.q.zh)+'</div>';
  html+='<div class=\"quiz-opts\">';
  q.opts.forEach(function(o,oi){
    html+='<button class=\"qopt\" onclick=\"answerQ(this,'+o.ok+',\''+encodeURIComponent(q.fb[curLang]||q.fb.zh)+'\')\">'+(o[curLang]||o.zh)+'</button>';
  });
  html+='</div><div class=\"quiz-fb\" id=\"quiz-fb\"></div></div>';
  html+='<div class=\"quick\"><button class=\"qbtn pri\" id=\"quiz-next-btn\" style=\"display:none\" onclick=\"nextQ()\">'+t('quiz.next')+'</button></div>';
  return html;
}

function renderCert(){
  var p=calcPct();
  var done=0,totalUnits=0;
  MODS.forEach(function(m){done+=m.done;totalUnits+=m.total});
  var modDone=MODS.filter(function(m){return m.done===m.total&&m.total>0}).length;

  // ── 頂部總覽 banner ──

  if(p===0) bannerBg='background:linear-gradient(135deg,#1a1a2e 0%,#2a2a4a 60%,#1a2a4a 100%)';
  else if(p<50) bannerBg='background:linear-gradient(135deg,#1a2030 0%,#2a3050 60%,#1a3060 100%)';

  var emoji=p>=100?'✨':p>=75?'⭐':p>=50?'🏆':p>=20?'🎯':'📖';
  var statusZh=p>=100?'太棒了，全部學完了！':p>=75?'快學完了，繼續加油':p>=50?'穩步前進':p>=20?'學習中':'剛起步';

  var html='';

  // 總覽卡
  html+='<div style=\"'+bannerBg+';border-radius:10px;padding:18px 16px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden\">';
  html+='<div style=\"position:absolute;top:-20px;right:-10px;font-size:80px;opacity:.1;pointer-events:none\">'+emoji+'</div>';
  html+='<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px\">';
  html+='<div style=\"font-size:32px\">'+emoji+'</div>';
  html+='<div>';
  html+='<div style=\"font-size:15px;font-weight:600\">'+statusZh+'</div>';
  html+='<div style=\"font-size:11px;opacity:.7;margin-top:2px\">'+statusEn+'</div>';
  html+='</div>';
  html+='<div style=\"margin-left:auto;text-align:right\">';
  html+='<div style=\"font-size:28px;font-weight:700;line-height:1\">'+p+'<span style=\"font-size:14px;font-weight:400\">%</span></div>';
  html+='<div style=\"font-size:10px;opacity:.65;margin-top:2px\">'+done+' / '+totalUnits+' 單元</div>';
  html+='</div>';
  html+='</div>';
  // 進度條
  html+='<div style=\"height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;margin-bottom:10px\">';
  html+='<div style=\"height:100%;width:'+p+'%;background:#f5c84a;border-radius:3px;transition:width .6s ease\"></div>';
  html+='</div>';
  // 統計小卡列
  html+='<div style=\"display:flex;gap:6px;flex-wrap:wrap\">';
  html+='<div style=\"background:rgba(255,255,255,.12);border-radius:6px;padding:5px 10px;font-size:11px\"><strong style=\"font-size:14px;display:block\">'+modDone+'<span style=\"font-size:10px;font-weight:400\">/'+MODS.length+'</span></strong>模組完成</div>';
  html+='<div style=\"background:rgba(255,255,255,.12);border-radius:6px;padding:5px 10px;font-size:11px\"><strong style=\"font-size:14px;display:block\">'+done+'</strong>單元已學</div>';
  html+='<div style=\"background:rgba(255,255,255,.12);border-radius:6px;padding:5px 10px;font-size:11px\"><strong style=\"font-size:14px;display:block\">'+(totalUnits-done)+'</strong>單元待學</div>';
  html+='<div style=\"background:rgba(255,255,255,.12);border-radius:6px;padding:5px 10px;font-size:11px\"><strong style=\"font-size:14px;display:block\">4</strong>語言支援</div>';
  html+='</div>';
  html+='</div>';

  // ── 各模組進度列 ──
  html+='<div class=\"sechd\"><h2>各模組學習進度</h2><div class=\"ln\"></div></div>';
  MODS.forEach(function(m,i){
    var label=m.titles[curLang]||m.titles.zh;
    var pct=m.total>0?Math.round(m.done/m.total*100):0;
    var isDone=m.done===m.total&&m.total>0;
    var barColor=isDone?'#1a7248':'#8a2800';
    html+='<div onclick=\"loadModule('+i+')\" role=\"button\" tabindex=\"0\" style=\"display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--color-background-primary);border:0.5px solid var(--color-border-'+(isDone?'success':'tertiary')+');border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .15s\" onmouseover=\"this.style.borderColor=\'var(--color-border-primary)\'\" onmouseout=\"this.style.borderColor=\'var(--color-border-'+(isDone?'success':'tertiary')+')\'\">';
    html+='<div style=\"font-size:20px;flex-shrink:0\">'+m.emoji+'</div>';
    html+='<div style=\"flex:1;min-width:0\">';
    html+='<div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px\">';
    html+='<span style=\"font-size:12px;font-weight:500;color:var(--color-text-primary)\">主題'+m.lv+' '+label+'</span>';
    if(isDone) html+='<i class=\"ti ti-circle-check\" style=\"font-size:13px;color:#1a7248\" aria-hidden=\"true\"></i>';
    html+='<span style=\"margin-left:auto;font-size:11px;color:'+(isDone?'#1a7248':'var(--color-text-secondary)')+'\">'+m.done+'/'+m.total+'</span>';
    html+='</div>';
    html+='<div style=\"height:4px;background:var(--color-background-tertiary);border-radius:2px;overflow:hidden\">';
    html+='<div style=\"height:100%;width:'+pct+'%;background:'+barColor+';border-radius:2px;transition:width .4s ease\"></div>';
    html+='</div>';
    html+='</div>';

    html+='</div>';
  });

  html+='<div class=\"quick\" style=\"justify-content:center;margin-top:8px\">';
  html+='<button class=\"qbtn pri\" onclick=\"showView(\'home\')\">'+t('btn.continue')+'</button>';
  html+='<button class=\"qbtn\" onclick=\"showView(\'quiz\', true)\">'+t('btn.quiz')+'</button>';
  html+='</div>';
  return html;
}

function updateNavActive(v){
  document.querySelectorAll('.tnb[data-view]').forEach(function(b){
    b.classList.toggle('act',b.getAttribute('data-view')===v);
  });
  document.querySelectorAll('.bnb[data-view]').forEach(function(b){
    b.classList.toggle('act',b.getAttribute('data-view')===v);
  });
}

function showView(v, resetQuiz){
  curView=v;
  var c=document.getElementById('content');
  
  // 關閉行動裝置端的側邊欄抽屜
  var sb=document.getElementById('sidebar');
  if(sb) sb.classList.remove('open');

  if(v==='home') c.innerHTML=renderHome();
  else if(v==='levels') c.innerHTML=renderLesson(curMod);
  else if(v==='quiz'){
    if(resetQuiz) { quizState={q:0,score:0,answered:false}; }
    c.innerHTML=renderQuiz();
  }
  else if(v==='cert') c.innerHTML=renderCert();
  
  buildSidebar();buildLevelPath();updateProgressUI();
  updateNavActive(v);
}

function loadModule(idx){
  curMod=idx;
  showView('levels');
}

function markProgress(idx){
  var m=MODS[idx];
  var found=false;
  for(var i=0;i<m.topics.length;i++){
    if((m.topics[i].s||0)!==2){m.topics[i].s=2;found=true;break;}
  }
  m.done=Math.min(m.topics.filter(function(tp){return tp.s===2}).length,m.total);
  updateProgressUI();buildSidebar();buildLevelPath();
  showView('levels');
}

function answerQ(btn,isOk,fbEnc){
  if(quizState.answered)return;
  quizState.answered=true;
  btn.classList.add(isOk?'correct':'wrong');
  if(isOk)quizState.score++;
  btn.closest('.quiz-opts').querySelectorAll('.qopt').forEach(function(b){b.setAttribute('disabled','');b.style.cursor='default'});
  var fb=document.getElementById('quiz-fb');
  if(fb)fb.textContent=decodeURIComponent(fbEnc);
  var nb=document.getElementById('quiz-next-btn');
  if(nb)nb.style.display='';
}

function nextQ(){
  quizState.q++;quizState.answered=false;
  var qs=QUIZZES[Math.min(curMod,QUIZZES.length-1)]||QUIZZES[0];
  if(quizState.q>=qs.length){
    var c=document.getElementById('content');
    var scorePct=Math.round(quizState.score/qs.length*100);
    var scoreEmoji=scorePct>=90?'🏆':scorePct>=70?'⭐':scorePct>=50?'👍':'📖';
    var scoreMsg=scorePct>=90?'太厲害了！':scorePct>=70?'答得不錯！':scorePct>=50?'繼續加油！':'多練習幾次吧！';
    var scoreHtml='<div style=\"background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:24px 20px;text-align:center;margin-bottom:14px\">';
    scoreHtml+='<div style=\"font-size:40px;margin-bottom:10px\">'+scoreEmoji+'</div>';
    scoreHtml+='<div style=\"font-size:15px;font-weight:600;margin-bottom:4px\">'+scoreMsg+'</div>';
    scoreHtml+='<div style=\"font-size:12px;color:var(--color-text-secondary);margin-bottom:16px\">'+MODS[curMod].titles[curLang]+' 測驗完成</div>';
    scoreHtml+='<div style=\"display:flex;justify-content:center;gap:12px;margin-bottom:16px\">';
    scoreHtml+='<div style=\"background:var(--color-background-secondary);border-radius:8px;padding:10px 18px\">';
    scoreHtml+='<div style=\"font-size:26px;font-weight:700;color:#8a2800;line-height:1\">'+quizState.score+'</div>';
    scoreHtml+='<div style=\"font-size:10px;color:var(--color-text-tertiary);margin-top:2px\">答對</div></div>';
    scoreHtml+='<div style=\"background:var(--color-background-secondary);border-radius:8px;padding:10px 18px\">';
    scoreHtml+='<div style=\"font-size:26px;font-weight:700;color:var(--color-text-secondary);line-height:1\">'+qs.length+'</div>';
    scoreHtml+='<div style=\"font-size:10px;color:var(--color-text-tertiary);margin-top:2px\">總題數</div></div>';
    scoreHtml+='<div style=\"background:var(--color-background-secondary);border-radius:8px;padding:10px 18px\">';
    scoreHtml+='<div style=\"font-size:26px;font-weight:700;color:'+(scorePct>=70?'#1a7248':'#c0392b')+';line-height:1\">'+scorePct+'%</div>';
    scoreHtml+='<div style=\"font-size:10px;color:var(--color-text-tertiary);margin-top:2px\">正確率</div></div>';
    scoreHtml+='</div>';
    scoreHtml+='<div style=\"height:6px;background:var(--color-background-tertiary);border-radius:3px;overflow:hidden;margin:0 auto;max-width:260px\">';
    scoreHtml+='<div style=\"height:100%;width:'+scorePct+'%;background:'+(scorePct>=70?'#1a7248':'#8a2800')+';border-radius:3px;transition:width .6s ease\"></div>';
    scoreHtml+='</div></div>';
    scoreHtml+='<div class=\"quick\" style=\"justify-content:center\">';
    scoreHtml+='<button class=\"qbtn pri\" onclick=\"showView(\'home\')\">'+t('btn.continue')+'</button>';
    scoreHtml+='<button class=\"qbtn\" onclick=\"showView(\'quiz\', true)\">'+t('quiz.retry')+'</button>';
    scoreHtml+='</div>';
    c.innerHTML=scoreHtml;
  } else {
    document.getElementById('content').innerHTML=renderQuiz();
  }
}

function setLangCard(lang,cardEl){
  document.querySelectorAll('.lcard').forEach(function(c){c.classList.remove('on')});
  if(cardEl)cardEl.classList.add('on');
  setLang(lang,null);
}

function setLang(lang,btn){
  curLang=lang;
  document.querySelectorAll('.tlb').forEach(function(b){b.classList.remove('on')});
  if(btn)btn.classList.add('on');
  else{
    document.querySelectorAll('.tlb').forEach(function(b){
      if(b.getAttribute('onclick')&&b.getAttribute('onclick').indexOf("'\"+lang+\"'")>-1)b.classList.add('on');
    });
  }
  applyI18N();
  document.getElementById('p-nm').textContent=I18N[lang]['hero.title']||I18N.zh['hero.title'];
  buildSidebar();buildLevelPath();updateProgressUI();
  showView(curView, false); // 避免切換語系時將進行到一半的測驗洗掉
}

function setDev(d){
  deviceMode = d;
  var s=document.getElementById('shell');
  s.className='shell '+d;
  ['mobile','tablet','desktop'].forEach(function(x){document.getElementById('btn-'+x).className='dvb'+(x===d?' on':'')});
  
  var sb=document.getElementById('sidebar');
  if(d==='desktop'){
    sbOK=true;
    sb.style.display='';
    sb.classList.remove('gone','open');
  } else {
    sbOK=false;
    sb.style.display='none';
    sb.classList.remove('open');
  }
}

function toggleSB(){
  var sb=document.getElementById('sidebar');
  if(deviceMode === 'desktop') {
    sbOK=!sbOK;
    sb.style.display=sbOK?'':'none';
    sb.classList.toggle('gone',!sbOK);
  } else {
    // 手機與平板端改為 CSS 抽屜 Drawer 樣式切換
    sb.style.display = '';
    sb.classList.toggle('open');
  }
}

// ── P3 模組數動態計算 (漏洞③修復：total 動態化，不依賴人工維護) ──
function updateStatCounts(){
  // 同步每個模組的 total 為 topics.length，防止人工筆誤
  MODS.forEach(function(m){ m.total=m.topics.length; });
  var modEl=document.getElementById('stat-mod-count');
  var topicEl=document.getElementById('stat-topic-count');
  if(modEl) modEl.textContent=MODS.length;
  if(topicEl){
    var total=0;MODS.forEach(function(m){total+=m.total});
    topicEl.textContent=total;
  }
}

// ── P4 LocalStorage 進度保存與載入 ──
var LS_KEY='culinary_platform_v029_progress';
function saveProgress(){
  try{
    var data=MODS.map(function(m){
      return{done:m.done,topics:m.topics.map(function(tp){return tp.s||0})};
    });
    localStorage.setItem(LS_KEY,JSON.stringify(data));
  }catch(e){}
}
function loadProgress(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    var data=JSON.parse(raw);
    data.forEach(function(saved,i){
      if(!MODS[i])return;
      var m=MODS[i];
      saved.topics.forEach(function(s,ti){
        if(m.topics[ti])m.topics[ti].s=s;
      });
      m.done=Math.min(m.topics.filter(function(tp){return tp.s===2}).length,m.total);
    });
  }catch(e){}
}
// 攔截 toggleTopicDone 在每次打勾後自動儲存
var _origToggle=toggleTopicDone;
toggleTopicDone=function(modIdx,topicIdx,tickEl){
  _origToggle(modIdx,topicIdx,tickEl);
  saveProgress();
};

// 首次加載初始化
loadProgress();
setDev('desktop');
showView('home');
updateStatCounts();
</script>
