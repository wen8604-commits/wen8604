/* ── Design tokens (GitHub Pages standalone mode) ── */
:root{
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  --color-text-primary: #1a1a1a;
  --color-text-secondary: #555;
  --color-text-tertiary: #888;
  --color-text-success: #1a7248;
  --color-text-danger: #c0392b;
  --color-background-primary: #fff;
  --color-background-secondary: #f6f6f6;
  --color-background-tertiary: #f0f0f0;
  --color-background-success: #e8f5ee;
  --color-background-danger: #fdecea;
  --color-border-primary: #aaa;
  --color-border-secondary: #d0d0d0;
  --color-border-tertiary: #e8e8e8;
  --color-border-success: #b2dfcc;
  --color-border-danger: #f5c6c2;
  --border-radius-sm: 4px;
  --border-radius-md: 6px;
  --border-radius-lg: 10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --color-text-primary: #f0f0f0;
    --color-text-secondary: #aaa;
    --color-text-tertiary: #777;
    --color-text-success: #4caf82;
    --color-text-danger: #e57373;
    --color-background-primary: #1e1e1e;
    --color-background-secondary: #252525;
    --color-background-tertiary: #2c2c2c;
    --color-background-success: #1a3328;
    --color-background-danger: #3b1a1a;
    --color-border-primary: #555;
    --color-border-secondary: #3a3a3a;
    --color-border-tertiary: #2e2e2e;
    --color-border-success: #2a5c40;
    --color-border-danger: #5c2a2a;
  }
}
/* ── GitHub Pages 全頁面佈局 ── */
*{box-sizing:border-box}
html{height:100%}
html,body{margin:0;padding:0;background:var(--color-background-secondary);min-height:100vh}
/* GitHub Pages: 無 padding，讓平台佔滿寬度 */
body{display:flex;flex-direction:column;align-items:stretch}
.platform-wrapper{width:100%;max-width:1200px;margin:0 auto;padding:0 0 env(safe-area-inset-bottom)}
/* 在較大螢幕加一點側邊距 */
@media(min-width:1240px){
  .platform-wrapper{padding:16px 20px env(safe-area-inset-bottom)}
}

</style>
</head>
<body>
<div class="platform-wrapper">
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">料理基礎學習平台 v0.39 — 自由點選課程，無關卡無證書</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:14px;color:var(--color-text-primary);line-height:1.6}
/* GitHub Pages: 平台佔滿 wrapper 寬度，有圓角（大螢幕）或無圓角（小螢幕） */
.platform{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
@media(max-width:640px){
  .platform{border-radius:0;border-left:none;border-right:none}
}

/* ── device bar ── */
.dbar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);flex-wrap:wrap}
.dbar-lbl{font-size:11px;color:var(--color-text-tertiary);letter-spacing:.3px}
.dvb{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:5px 11px;cursor:pointer;font-size:11.5px;color:var(--color-text-secondary);font-family:var(--font-sans);display:flex;align-items:center;gap:5px;transition:all .15s}
.dvb:hover{background:var(--color-background-secondary);border-color:var(--color-border-primary)}
.dvb.on{background:#5a1800;border-color:#5a1800;color:#fff;font-weight:500}
.dbgap{flex:1}
.dbadge{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--color-text-tertiary);padding:4px 0}

/* ── topbar ── */
.topbar{background:linear-gradient(135deg,#4a1200 0%,#6b2000 100%);padding:0 16px;display:flex;align-items:center;gap:10px;height:56px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.tlogo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tico{width:36px;height:36px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:var(--border-radius-lg);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tnm{font-size:14px;font-weight:600;color:#fff;letter-spacing:-.1px}
.tsub{font-size:10px;opacity:.5;color:#fff;letter-spacing:.2px;margin-top:1px}
.tsp{flex:1}
.tnav{display:flex;gap:1px;background:rgba(0,0,0,.18);padding:4px;border-radius:var(--border-radius-lg);border:1px solid rgba(255,255,255,.08)}
.tnb{background:none;border:none;color:rgba(255,255,255,.65);padding:5px 12px;border-radius:var(--border-radius-md);cursor:pointer;font-size:12px;font-family:var(--font-sans);white-space:nowrap;transition:all .18s;display:flex;align-items:center;gap:5px;line-height:1}
.tnb i{font-size:13px;opacity:.8}
.tnb:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.tnb.act{background:rgba(255,255,255,.18);color:#fff;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tlang{display:flex;background:rgba(0,0,0,.2);border-radius:var(--border-radius-md);overflow:hidden;border:1px solid rgba(255,255,255,.12);flex-shrink:0}
.tlb{background:none;border:none;color:rgba(255,255,255,.55);padding:5px 9px;cursor:pointer;font-size:11px;font-family:var(--font-sans);transition:all .15s;white-space:nowrap;line-height:1}
.tlb:hover{color:#fff;background:rgba(255,255,255,.08)}
.tlb.on{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.thmb{background:none;border:none;color:#fff;cursor:pointer;padding:6px;border-radius:var(--border-radius-md);display:none;align-items:center;justify-content:center;transition:background .15s}
.thmb:hover{background:rgba(255,255,255,.15)}

/* ── hero ── */
.hero{background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);padding:18px 20px 14px}
.hero-row{display:flex;align-items:flex-start;gap:14px}
.hero-ico{width:52px;height:52px;background:linear-gradient(135deg,#5a1800,#8a3000);border-radius:var(--border-radius-lg);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 2px 8px rgba(90,24,0,.25)}
.hero-text{flex:1;min-width:0}
.hero h1{font-size:16px;font-weight:600;color:var(--color-text-primary);line-height:1.3;letter-spacing:-.2px}
.hero-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:3px;letter-spacing:.2px}
.hero-desc{font-size:12px;color:var(--color-text-secondary);margin-top:6px;line-height:1.7}
.hero-stats{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center}
.spill{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:14px;padding:3px 10px;font-size:11.5px;color:var(--color-text-secondary)}
.spill strong{color:var(--color-text-primary);font-weight:600}
/* hero overall progress bar */
.hero-prog-wrap{margin-top:12px;display:flex;align-items:center;gap:10px}
.hero-prog-bar{flex:1;height:5px;background:var(--color-background-tertiary);border-radius:3px;overflow:hidden}
.hero-prog-fill{height:100%;background:linear-gradient(90deg,#8a2800,#c04020);border-radius:3px;transition:width .5s ease}
.hero-prog-label{font-size:11px;color:var(--color-text-secondary);white-space:nowrap;min-width:56px;text-align:right}


/* ── body layout ── */
.body{display:flex;min-height:calc(100svh - 180px);position:relative}
.sidebar{width:210px;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);flex-shrink:0;transition:all 0.2s ease;display:flex;flex-direction:column}
.sidebar.gone{display:none}
.ss-header{padding:12px 14px 8px;border-bottom:0.5px solid var(--color-border-tertiary)}
.ss-header-title{font-size:10px;font-weight:600;color:var(--color-text-tertiary);letter-spacing:.7px;text-transform:uppercase}
.sslbl{font-size:10px;font-weight:600;color:var(--color-text-tertiary);letter-spacing:.6px;text-transform:uppercase;padding:10px 14px 5px}
.si{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--border-radius-md);cursor:pointer;transition:all .15s;color:var(--color-text-secondary);font-size:12.5px;margin:1px 8px;position:relative}
.si:hover{background:var(--color-background-secondary)}
.si.act{background:rgba(90,24,0,.08);color:#8a2800}
.si.sdone{color:var(--color-text-success)}
.si i{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.si .sbadge{margin-left:auto;background:var(--color-background-secondary);border-radius:8px;padding:1px 6px;font-size:10px;color:var(--color-text-secondary);flex-shrink:0}
.si.act .sbadge{background:rgba(90,24,0,.12);color:#8a2800}
.si.sdone .sbadge{background:rgba(26,114,72,.12);color:#1a7248}
/* sidebar mini progress dot */
.si .sprogdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-left:auto}
.si-emoji{font-size:13px;flex-shrink:0;width:18px;text-align:center}
.si-sub{font-size:9.5px;color:var(--color-text-tertiary);margin-top:1px}
.sdiv{height:0.5px;background:var(--color-border-tertiary);margin:6px 12px}
/* sidebar tools at bottom */
.ss-tools{margin-top:auto;border-top:0.5px solid var(--color-border-tertiary);padding:8px 0 6px}

/* ── content area ── */
.content{flex:1;padding:16px;background:var(--color-background-secondary);min-width:0;overflow:hidden}

/* section headers */
.sechd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sechd h2{font-size:11px;font-weight:600;color:var(--color-text-tertiary);white-space:nowrap;letter-spacing:.6px;text-transform:uppercase}
.sechd .ln{flex:1;height:0.5px;background:var(--color-border-tertiary)}

/* ── language grid ── */
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:18px}
.lcard{background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:10px 10px 9px;cursor:pointer;transition:all .18s;text-align:center;position:relative}
.lcard:hover{border-color:var(--color-border-primary);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.lcard.on{border:1.5px solid #8a2800;background:rgba(90,24,0,.03);box-shadow:0 0 0 3px rgba(138,40,0,.06)}
.lcard.on::after{content:'✓';position:absolute;top:7px;right:9px;font-size:10px;color:#8a2800;font-weight:700}
.lcard .flag{font-size:22px;margin-bottom:5px;line-height:1}
.lcard .lname{font-size:12.5px;font-weight:600;color:var(--color-text-primary)}
.lcard .lsub{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}

/* ── module grid ── */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:18px}
.mcard{background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:12px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.mcard:hover{border-color:var(--color-border-primary);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.mcard.actm{border:1.5px solid #8a2800;background:rgba(90,24,0,.02);box-shadow:0 0 0 3px rgba(138,40,0,.05)}
.mcard.mdone{border-color:rgba(26,114,72,.4);background:rgba(26,114,72,.01)}
.mcheck{position:absolute;top:9px;right:9px;font-size:14px;color:#1a7248}
.memoji{font-size:22px;margin-bottom:6px;line-height:1}
.mtitle{font-size:12.5px;font-weight:600;color:var(--color-text-primary);line-height:1.3}
.men{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}
.mlvl{display:inline-block;font-size:9.5px;color:var(--color-text-tertiary);background:var(--color-background-secondary);border-radius:4px;padding:1px 5px;margin-top:5px;border:0.5px solid var(--color-border-tertiary)}
.mcnt{font-size:11px;color:var(--color-text-secondary);margin-top:6px}
.mbar{height:3px;background:var(--color-background-tertiary);border-radius:2px;margin-top:7px;overflow:hidden}
.mfill{height:100%;background:#8a2800;border-radius:2px;transition:width .4s ease}
.mfill.full{background:#1a7248}

/* lesson & topics */
.lesson{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:14px}
.leshd{background:#5a1800;padding:13px 14px;display:flex;align-items:center;gap:11px}
.lesico{width:40px;height:40px;background:rgba(255,255,255,.15);border:0.5px solid rgba(255,255,255,.25);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.leshd h3{font-size:13px;font-weight:500;color:#fff;line-height:1.3}
.lessub{font-size:10px;opacity:.7;color:#fff;margin-top:1px}
.leschips{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.17);border:0.5px solid rgba(255,255,255,.22);border-radius:10px;padding:2px 8px;font-size:10px;color:#fff}
.lesbody{padding:12px 14px}
.topics{display:flex;flex-direction:column;gap:7px}
.trow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);cursor:pointer;transition:all .15s}
.trow:hover{background:var(--color-background-primary);border-color:var(--color-border-secondary)}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-done{background:#1a7248}.dot-cur{background:#8a2800}.dot-next{background:var(--color-border-primary)}
.ttxt{font-size:12px;color:var(--color-text-primary);line-height:1.4}
.ten{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}
.ttag{font-size:10px;padding:2px 7px;border-radius:6px;margin-left:auto;white-space:nowrap;flex-shrink:0;min-width:44px;text-align:center}
.tag-done{background:var(--color-background-success);color:var(--color-text-success)}
.tag-cur{background:rgba(138,40,0,.1);color:#8a2800}
.tag-nx{background:var(--color-background-secondary);color:var(--color-text-tertiary);border:0.5px solid var(--color-border-tertiary)}

/* safety */
.safepanel{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:14px}
.safehd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.safehd i{font-size:16px;color:var(--color-text-danger)}
.safehd .shtitle{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.safehd .shen{font-size:10px;color:var(--color-text-tertiary);margin-left:auto}
.safebody{padding:9px 12px}
.saferow{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
.saferow:last-child{border-bottom:none}
.saferow i{font-size:15px;flex-shrink:0;margin-top:1px}
.saferow.ok i{color:var(--color-text-success)}
.saferow.no i{color:var(--color-text-danger)}
.stxt{color:var(--color-text-primary)}
.sen{font-size:10px;color:var(--color-text-secondary);margin-top:2px}

/* quiz */
.quiz-wrap{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:16px;margin-bottom:14px}
.quiz-q{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:12px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:7px}
.qopt{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:9px 12px;cursor:pointer;font-size:12px;color:var(--color-text-primary);transition:all .15s;text-align:left;font-family:var(--font-sans);line-height:1.4}
.qopt:hover:not([disabled]){border-color:var(--color-border-primary);background:var(--color-background-primary)}
.qopt.correct{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.qopt.wrong{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}
.quiz-fb{margin-top:10px;font-size:12px;min-height:18px;color:var(--color-text-secondary);padding:0 2px;line-height:1.5}
.quiz-prog{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.quiz-prog-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary)}
.quiz-prog-label{font-size:11px;color:var(--color-text-tertiary);white-space:nowrap}
.quiz-q-counter{font-size:13px;font-weight:600;color:var(--color-text-primary)}
.quiz-q-total{font-size:11px;color:var(--color-text-tertiary)}
.quiz-dots{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.quiz-dot{width:22px;height:6px;border-radius:3px;background:var(--color-background-tertiary);border:0.5px solid var(--color-border-secondary);transition:all .2s;flex-shrink:0}
.quiz-dot.cur{background:#8a2800;border-color:#8a2800}
.quiz-dot.done{background:rgba(138,40,0,.35);border-color:rgba(138,40,0,.3)}
.qptrack{flex:1;height:4px;background:var(--color-background-tertiary);border-radius:2px;overflow:hidden}
.qpfill{height:100%;background:#8a2800;border-radius:2px;transition:width .3s}

/* (certificate styles removed) */
/* ── Quiz Center (v0.31) ── */
.qc-hero{background:linear-gradient(135deg,#3a0e00 0%,#5a1800 55%,#7a2800 100%);border-radius:var(--border-radius-lg);padding:18px 16px 16px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.qc-hero::before{content:'📝';position:absolute;top:-12px;right:-8px;font-size:72px;opacity:.08;pointer-events:none}
.qc-hero-row{display:flex;align-items:flex-start;gap:12px}
.qc-hero-ico{width:44px;height:44px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:var(--border-radius-lg);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.qc-hero-text{flex:1;min-width:0}
.qc-hero-title{font-size:15px;font-weight:600;line-height:1.2;letter-spacing:-.2px}
.qc-hero-sub{font-size:10.5px;opacity:.65;margin-top:2px}
.qc-hero-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}

    fb:{zh:'正確！廚房地板因油水濕滑，是跌倒事故的高危環境。防滑墊能有效增加腳部摩擦力，降低滑倒風險，尤其在水槽旁、爐台前等常有水氣的區域更需要使用。此外，應穿著防滑廚房鞋，並隨時保持地板乾燥。',en:'Correct! Kitchen floors are high-risk for slips due to oil and water. Non-slip mats increase foot traction and reduce fall risk, especially near sinks and stoves where moisture is common. Also wear non-slip kitchen shoes and keep floors dry.',id:'Benar! Lantai dapur berisiko tinggi untuk tergelincir. Karpet anti-slip meningkatkan traksi dan mengurangi risiko jatuh, terutama di dekat wastafel dan kompor.',vi:'Đúng! Sàn bếp là môi trường nguy cơ cao trơn ngã do dầu mỡ và nước. Thảm chống trơn tăng ma sát, giảm nguy cơ ngã, đặc biệt gần bồn rửa và bếp. Nên đi giày chống trơn và giữ sàn khô ráo.'}},
   {q:{zh:'廚房中，安全儲存刀具最佳的方式是？',en:'What is the best way to safely store kitchen knives?',id:'Cara terbaik menyimpan pisau dapur dengan aman adalah?',vi:'Cách tốt nhất để cất dao bếp an toàn là gì?'},
    opts:[{zh:'放在抽屜中，刀刃朝上方便取用',en:'Store in a drawer blade-up for easy access',id:'Simpan di laci dengan mata pisau ke atas untuk kemudahan akses',vi:'Để trong ngăn kéo lưỡi hướng lên để dễ lấy',ok:false},
          {zh:'使用刀架或磁吸刀條，刀刃不外露，各刀分開存放',en:'Use a knife block or magnetic strip with blades shielded and knives stored separately',id:'Gunakan rak pisau atau strip magnet dengan bilah terlindung dan pisau disimpan terpisah',vi:'Dùng giá dao hoặc thanh từ, lưỡi không lộ ra ngoài và mỗi dao để riêng',ok:true},
          {zh:'所有刀具一起泡在水槽的清水中',en:'Soak all knives together in a sink of clean water',id:'Rendam semua pisau bersama dalam air bersih di wastafel',vi:'Ngâm tất cả dao cùng nhau trong nước sạch trong bồn',ok:false}],
    fb:{zh:'正確！刀具應使用刀架或磁吸刀條分別存放，刀刃不朝外露出，以防誤觸割傷。放入抽屜刀刃朝上危險；泡水會導致刀具生鏽、加速刀柄損壞，也可能因看不見刀刃而割傷手。',en:'Correct! Knife blocks or magnetic strips store knives separately with blades shielded. Blade-up in a drawer is dangerous; soaking causes rust, handle damage, and hidden blades are a cut risk.',id:'Benar! Rak pisau atau strip magnet menyimpan pisau secara terpisah dengan bilah terlindung. Mata pisau ke atas di laci berbahaya; merendam menyebabkan karat dan pegangan rusak.',vi:'Đúng! Giá dao hoặc thanh từ cất dao riêng biệt với lưỡi được che. Lưỡi hướng lên trong ngăn kéo nguy hiểm; ngâm nước gây gỉ, hỏng cán và lưỡi bị ẩn dễ gây đứt tay.'}}
  ],
  /* Lv2 刀工基礎 */
  [
   {q:{zh:'使用刀具時，切好後刀應如何擺放？',en:'After cutting, where should you place the knife?',id:'Setelah memotong, di mana pisau harus diletakkan?',vi:'Sau khi cắt, nên đặt dao ở đâu?'},
    opts:[{zh:'刀口朝外，放桌邊',en:'Blade out, at table edge',id:'Mata pisau keluar, di tepi meja',vi:'Lưỡi ra ngoài, mép bàn',ok:false},

   {q:{zh:'正確握刀方式是？',en:'Which is the correct knife grip?',id:'Cara memegang pisau yang benar adalah?',vi:'Cách cầm dao đúng là?'},

          {zh:'全手握刀柄，拇指在食指上方',en:'Full hand on handle, thumb over index finger',id:'Seluruh tangan di gagang',vi:'Nắm toàn bộ cán dao',ok:false},
          {zh:'三指握刀柄，食指放刀面',en:'Three fingers on handle, index on blade flat',id:'Tiga jari di gagang, telunjuk di sisi pisau',vi:'Ba ngón giữ cán, ngón trỏ ở thân dao',ok:false}],

   {q:{zh:'切食材時，另一隻手的手指應如何擺放（貓爪式）？',en:'When cutting, how should the guiding hand\'s fingers be positioned (the claw grip)?',id:'Saat memotong, bagaimana jari tangan pengarah diposisikan (cakar kucing)?',vi:'Khi cắt, tay giữ thức ăn nên để ngón tay như thế nào (kiểu vuốt mèo)?'},
    opts:[{zh:'手指平放在食材上',en:'Fingers flat on the ingredient',id:'Jari rata di atas bahan',vi:'Ngón tay thẳng trên thức ăn',ok:false},
          {zh:'指尖向後彎曲，指節朝前引導刀面',en:'Fingertips curled back, knuckles forward guiding the blade',id:'Ujung jari ditekuk ke belakang, buku jari ke depan',vi:'Đầu ngón tay cong lại, đốt ngón tay hướng ra trước dẫn dao',ok:true},
          {zh:'手完全離開食材',en:'Hand completely off the ingredient',id:'Tangan jauh dari bahan',vi:'Tay hoàn toàn tránh xa thức ăn',ok:false}],
    fb:{zh:'正確！貓爪式能保護手指，以指節引導刀面，是最安全的切食材手勢。',en:'Correct! The claw grip protects fingers — knuckles guide the blade safely.',id:'Benar! Cakar kucing melindungi jari — buku jari memandu pisau dengan aman.',vi:'Đúng! Kiểu vuốt mèo bảo vệ ngón tay — dùng đốt ngón hướng dao an toàn.'}},
   {q:{zh:'菜刀應多久磨一次才能保持鋒利？',en:'How often should a chef\'s knife be sharpened to maintain its edge?',id:'Seberapa sering pisau koki harus diasah agar tetap tajam?',vi:'Dao bếp nên mài bao lâu một lần để giữ sắc?'},
    opts:[{zh:'每天磨一次',en:'Every day',id:'Setiap hari',vi:'Mỗi ngày',ok:false},
          {zh:'每次使用後立刻磨',en:'Immediately after every use',id:'Langsung setelah setiap penggunaan',vi:'Ngay sau mỗi lần dùng',ok:false},
          {zh:'視使用頻率，一般每1–2週用磨刀棒修整，每幾個月深度磨刀',en:'Depending on use — hone with a steel every 1–2 weeks, sharpen fully every few months',id:'Tergantung penggunaan — asah dengan pengasah setiap 1–2 minggu, asah dalam setiap beberapa bulan',vi:'Tùy tần suất dùng — mài nhẹ với thỏi mài mỗi 1–2 tuần, mài sâu vài tháng một lần',ok:true}],
    fb:{zh:'正確！日常用磨刀棒修整可保持刀刃對齊，定期深度磨刀才能真正恢復鋒利。刀越鈍越容易因用力過大而造成滑刀意外。',en:'Correct! Regular honing realigns the edge for daily use; deep sharpening periodically restores the blade. A dull knife requires more force and is more likely to slip.',id:'Benar! Mengasah rutin meluruskan tepi untuk penggunaan harian; pengasahan mendalam memulihkan bilah.',vi:'Đúng! Mài nhẹ thường xuyên giúp thẳng lưỡi dao; mài sâu định kỳ phục hồi độ sắc. Dao cùn dễ trượt gây thương tích.'}},
   {q:{zh:'切洋蔥時，為了整齊的切丁，哪個步驟順序正確？',en:'To dice an onion cleanly, which step order is correct?',id:'Untuk memotong bawang menjadi dadu rapi, urutan langkah mana yang benar?',vi:'Để thái hạt lựu hành tây gọn đẹp, thứ tự bước nào đúng?'},
    opts:[{zh:'橫切→縱切→直切成丁',en:'Horizontal cuts → vertical cuts → crosscuts into dice',id:'Potongan horizontal → vertikal → silang menjadi dadu',vi:'Cắt ngang → cắt dọc → cắt ngang thành hạt lựu',ok:true},
          {zh:'先完全剝皮，再隨意切',en:'Fully peel first, then cut freely',id:'Kupas dulu, lalu potong bebas',vi:'Bóc vỏ hoàn toàn trước, rồi cắt tùy ý',ok:false},
          {zh:'整顆直接切片再剁碎',en:'Slice the whole onion then mince',id:'Iris bawang utuh lalu cincang',vi:'Cắt lát cả củ rồi băm nhỏ',ok:false}],
    fb:{zh:'正確！標準洋蔥切丁法：對半切→保留根部→橫向劃幾刀→縱向劃幾刀→最後橫切成丁。保留根部可防止洋蔥散開。',en:'Correct! Standard onion dice: halve → leave root intact → horizontal slices → vertical cuts → final crosscuts into dice. The root holds it together.',id:'Benar! Teknik memotong bawang: belah dua → biarkan akar utuh → iris horizontal → potong vertikal → potong silang menjadi dadu.',vi:'Đúng! Kỹ thuật thái hành: bổ đôi → giữ nguyên rễ → khía ngang → khía dọc → thái ngang thành hạt lựu. Giữ rễ tránh hành rời ra.'}},
   {q:{zh:'砧板使用完畢後，正確的清潔方式是？',en:'After using a cutting board, what is the correct cleaning method?',id:'Setelah menggunakan talenan, cara pembersihan yang benar adalah?',vi:'Sau khi dùng thớt, cách vệ sinh đúng là?'},
    opts:[{zh:'直接浸泡在水中，方便下次使用',en:'Soak in water so it is ready for next time',id:'Rendam dalam air agar siap digunakan lagi',vi:'Ngâm trong nước cho tiện dùng lần sau',ok:false},
          {zh:'清洗晾乾後直立放置，避免積水',en:'Wash, dry, and store upright to prevent moisture accumulation',id:'Cuci, keringkan, dan simpan tegak untuk mencegah penumpukan kelembapan',vi:'Rửa sạch, lau khô và đặt đứng để tránh đọng nước',ok:true},
          {zh:'只需用濕布擦拭即可',en:'Just wipe with a damp cloth',id:'Cukup lap dengan kain basah',vi:'Chỉ cần lau bằng khăn ướt là đủ',ok:false}],
    fb:{zh:'正確！砧板使用後應徹底清洗、風乾並直立存放，避免底部積水滋生細菌。木質砧板偶爾可用鹽巴搓洗並抹上食用油保養。',en:'Correct! Wash, dry, and store upright to prevent water pooling and bacterial growth. Wooden boards can occasionally be scrubbed with salt and oiled for maintenance.',id:'Benar! Cuci, keringkan, dan simpan tegak untuk mencegah penumpukan air dan pertumbuhan bakteri.',vi:'Đúng! Rửa sạch, để khô và cất đứng để tránh đọng nước và vi khuẩn. Thớt gỗ có thể chà muối và thoa dầu ăn để bảo dưỡng.'}},
   {q:{zh:'使用不同食材（如生肉與蔬菜）時，砧板應如何處理？',en:'When preparing different ingredients such as raw meat and vegetables, how should you handle cutting boards?',id:'Saat menyiapkan bahan berbeda seperti daging mentah dan sayuran, bagaimana cara menangani talenan?',vi:'Khi sơ chế các nguyên liệu khác nhau như thịt sống và rau củ, nên xử lý thớt như thế nào?'},
    opts:[{zh:'同一塊砧板依序使用，用完後一起洗',en:'Use the same board for all, then wash at the end',id:'Gunakan talenan yang sama untuk semua, lalu cuci di akhir',vi:'Dùng chung một thớt, rửa sau khi dùng xong tất cả',ok:false},
          {zh:'使用不同顏色的砧板分開處理生食與熟食',en:'Use color-coded boards to separate raw and cooked foods',id:'Gunakan talenan berbeda warna untuk memisahkan makanan mentah dan matang',vi:'Dùng thớt màu khác nhau để tách biệt thực phẩm sống và chín',ok:true},
          {zh:'蔬菜先切，然後同一塊砧板不洗直接切肉',en:'Cut vegetables first, then cut meat on the same unwashed board',id:'Potong sayuran dulu, lalu potong daging tanpa mencuci talenan',vi:'Cắt rau trước rồi cắt thịt trên cùng thớt chưa rửa',ok:false}],
    fb:{zh:'正確！使用顏色管理制度（如紅色砧板切生肉、綠色切蔬菜、黃色切熟食）是預防交叉污染的重要方式，也是專業廚房的基本規範。',en:'Correct! A color-coded board system (e.g., red for raw meat, green for vegetables, yellow for cooked foods) is the standard way to prevent cross-contamination in professional kitchens.',id:'Benar! Sistem talenan berbeda warna (merah untuk daging mentah, hijau untuk sayuran, kuning untuk makanan matang) adalah cara standar mencegah kontaminasi silang.',vi:'Đúng! Hệ thống thớt phân màu (đỏ cho thịt sống, xanh cho rau, vàng cho thức ăn chín) là tiêu chuẩn ngăn ngừa nhiễm chéo trong bếp chuyên nghiệp.'}},
   {q:{zh:'切魚片時，刀應如何運行才能得到薄而均勻的片？',en:'When slicing fish fillets, how should the knife move for thin, even slices?',id:'Saat mengiris fillet ikan, bagaimana pisau harus bergerak untuk irisan tipis dan merata?',vi:'Khi thái phi lê cá, nên di chuyển dao như thế nào để có lát mỏng đều?'},
    opts:[{zh:'刀垂直向下壓切',en:'Press the knife straight down',id:'Tekan pisau lurus ke bawah',vi:'Ấn dao thẳng xuống',ok:false},
          {zh:'斜角拉切，刀身傾斜約30–45度，以推拉動作完成',en:'Slice at an angle, blade tilted 30–45°, using a pulling motion',id:'Iris miring, pisau miring 30–45°, dengan gerakan menarik',vi:'Thái xiên, lưỡi dao nghiêng 30–45°, dùng chuyển động kéo',ok:true},
          {zh:'鋸齒狀來回切割',en:'Saw back and forth',id:'Gergaji maju mundur',vi:'Cưa qua lại',ok:false}],
    fb:{zh:'正確！切魚片宜用斜刀拉切，以刀身傾斜的拉切動作讓魚肉纖維均勻分離，得到光滑薄片；垂直壓切容易使魚肉碎裂，鋸切則損傷魚肉質地。',en:'Correct! Fish should be sliced at an angle using a pulling motion — this separates the fibers evenly for smooth, thin slices. Pressing straight down can break the flesh; sawing damages the texture.',id:'Benar! Ikan harus diiris miring dengan gerakan menarik — ini memisahkan serat secara merata untuk irisan halus dan tipis.',vi:'Đúng! Cá nên được thái xiên với chuyển động kéo — giúp tách thớ đều cho lát mỏng mịn. Ấn thẳng dễ vỡ thịt cá; cưa qua lại làm hỏng kết cấu.'}},
   {q:{zh:'剁碎大蒜時，下列哪個技巧最有效率？',en:'When mincing garlic, which technique is most efficient?',id:'Saat mencincang bawang putih, teknik mana yang paling efisien?',vi:'Khi băm tỏi, kỹ thuật nào hiệu quả nhất?'},
    opts:[{zh:'一瓣一瓣仔細切小',en:'Carefully cut each clove into tiny pieces',id:'Potong setiap siung menjadi potongan kecil',vi:'Cắt từng tép thành từng mảnh nhỏ',ok:false},
          {zh:'先用刀背拍扁後再切碎',en:'First crush with the flat of the blade then mince',id:'Pertama geprek dengan sisi pisau lalu cincang',vi:'Đầu tiên đập dẹt bằng phần phẳng dao rồi băm',ok:true},
          {zh:'用剪刀剪碎',en:'Snip it with scissors',id:'Gunting dengan gunting',vi:'Cắt bằng kéo',ok:false}],
    fb:{zh:'正確！用刀背拍扁大蒜後，外皮很容易剝落，同時蒜瓣已被壓碎，只需幾刀即可快速剁碎。這是廚師最常用的備料技巧。',en:'Correct! Crushing garlic with the flat of the blade makes the skin easy to remove and the clove partially minced already — just a few cuts to finish. This is the most common professional prep technique.',id:'Benar! Menggeprek bawang putih membuat kulitnya mudah dikupas dan siung sudah sebagian hancur — hanya perlu beberapa potong untuk menyelesaikan.',vi:'Đúng! Đập dẹt tỏi làm cho vỏ dễ bóc và tép đã bị nát một phần — chỉ cần vài nhát dao là xong. Đây là kỹ thuật sơ chế phổ biến nhất trong bếp chuyên nghiệp.'}},
   {q:{zh:'處理帶骨雞肉去骨時，最重要的原則是？',en:'When deboning chicken with bones, the most important principle is?',id:'Saat membuang tulang ayam bertulang, prinsip terpenting adalah?',vi:'Khi lọc xương gà có xương, nguyên tắc quan trọng nhất là?'},
    opts:[{zh:'儘量快速操作，節省時間',en:'Work as fast as possible to save time',id:'Bekerja secepat mungkin untuk menghemat waktu',vi:'Làm nhanh nhất có thể để tiết kiệm thời gian',ok:false},
          {zh:'刀緊貼骨頭運行，一邊切一邊向外撥開肉',en:'Keep the blade close to the bone and peel the flesh away as you cut',id:'Jaga bilah dekat tulang dan kupas daging saat Anda memotong',vi:'Giữ dao sát xương và gỡ thịt ra trong khi cắt',ok:true},
          {zh:'用大力從中間切開，不需要貼著骨頭',en:'Cut hard from the center; no need to follow the bone',id:'Potong keras dari tengah; tidak perlu mengikuti tulang',vi:'Cắt mạnh từ giữa; không cần theo sát xương',ok:false}],
    fb:{zh:'正確！去骨時刀尖緊貼骨骼輪廓滑動，減少浪費肉質，同時保持刀面與骨面的接觸，才能完整剝離肉塊。大力亂切不僅浪費食材，也容易造成刀具滑動受傷。',en:'Correct! Keep the blade tip gliding along the bone surface to minimize meat waste and cleanly separate the flesh. Hacking without following the bone wastes meat and increases injury risk.',id:'Benar! Jaga ujung pisau meluncur di sepanjang permukaan tulang untuk meminimalkan pemborosan daging dan memisahkan daging dengan bersih.',vi:'Đúng! Giữ mũi dao trượt dọc theo bề mặt xương để giảm thiểu lãng phí thịt và tách thịt sạch sẽ. Chặt bừa bãi vừa lãng phí vừa tăng nguy cơ dao trượt.'}}
  ],
  /* Lv3 火候控制 */
  [
   {q:{zh:'大火的建議溫度區間是？',en:'Recommended range for high heat is?',id:'Kisaran suhu api besar adalah?',vi:'Nhiệt độ lửa lớn là?'},
    opts:[{zh:'約50–100°C',en:'~50–100°C',id:'~50–100°C',vi:'~50–100°C',ok:false},
          {zh:'約180°C以上',en:'~180°C and above',id:'~180°C ke atas',vi:'~180°C trở lên',ok:true},

    fb:{zh:'正確！蔬菜在放入冰箱前不應洗濕，水分殘留會加速腐爛。應以透氣紙張或有孔袋包裝，防止水分散失又避免積濕，要使用時再清洗。',en:'Correct! Vegetables should not be washed before refrigeration — residual moisture accelerates decay. Wrap in breathable paper or perforated bags. Wash just before use.',id:'Benar! Sayuran tidak boleh dicuci sebelum didinginkan. Bungkus dengan kertas atau kantong berlubang.',vi:'Đúng! Không nên rửa rau trước khi cất tủ lạnh — độ ẩm còn lại làm rau mau hỏng. Bọc bằng giấy thoáng. Rửa trước khi dùng.'}},
   {q:{zh:'冰箱中食材的擺放，從上到下正確順序是？',en:'The correct storage order in the refrigerator from top to bottom is?',id:'Urutan penyimpanan di kulkas dari atas ke bawah yang benar adalah?',vi:'Thứ tự cất thực phẩm trong tủ lạnh từ trên xuống dưới đúng là?'},
    opts:[{zh:'熟食→生肉→蔬菜（由上而下）',en:'Cooked food → raw meat → vegetables (top to bottom)',id:'Makanan matang → daging mentah → sayuran (atas ke bawah)',vi:'Thức ăn chín → thịt sống → rau (từ trên xuống)',ok:true},
          {zh:'生肉→熟食→蔬菜（由上而下）',en:'Raw meat → cooked food → vegetables (top to bottom)',id:'Daging mentah → makanan matang → sayuran (atas ke bawah)',vi:'Thịt sống → thức ăn chín → rau (từ trên xuống)',ok:false},

   {q:{zh:'食材開封後若沒有用完，最正確的保存方式是？',en:'After opening food that hasn\'t been fully used, what is the most correct storage method?',id:'Setelah membuka makanan yang belum habis, cara penyimpanan yang paling benar adalah?',vi:'Sau khi mở thực phẩm chưa dùng hết, cách bảo quản nào đúng nhất?'},
    opts:[{zh:'繼續放在原包裝袋中不需要額外處理',en:'Keep in original packaging, no extra handling',id:'Simpan di kemasan asli, tidak perlu penanganan ekstra',vi:'Để trong bao bì gốc, không cần xử lý thêm',ok:false},
          {zh:'移入密封容器，標記日期後放入冰箱',en:'Transfer to an airtight container, label with the date, then refrigerate',id:'Pindahkan ke wadah kedap udara, beri label tanggal, lalu simpan di kulkas',vi:'Chuyển vào hộp kín, ghi ngày tháng và cho vào tủ lạnh',ok:true},

   {q:{zh:'哪一種食材在室溫下最容易滋生危險細菌？',en:'Which type of food most easily harbors dangerous bacteria at room temperature?',id:'Jenis makanan mana yang paling mudah menumbuhkan bakteri berbahaya pada suhu ruang?',vi:'Loại thực phẩm nào dễ sinh vi khuẩn nguy hiểm nhất ở nhiệt độ phòng?'},

   {q:{zh:'真空包裝的食品是否可以無限期保存？',en:'Can vacuum-sealed food be stored indefinitely?',id:'Apakah makanan vakum dapat disimpan tanpa batas?',vi:'Thực phẩm đóng gói chân không có thể bảo quản vô thời hạn không?'},
    opts:[{zh:'可以，因為真空環境完全無菌',en:'Yes, because vacuum environments are completely sterile',id:'Ya, karena lingkungan vakum benar-benar steril',vi:'Có, vì môi trường chân không hoàn toàn vô trùng',ok:false},

    fb:{zh:'正確！真空包裝能有效減少氧化和某些需氧菌的繁殖，但仍有保存期限。此外，真空包裝對不需氧的厭氧菌（如肉毒桿菌）無效，因此仍須在有效期內食用，開封後應冷藏並儘快使用。',en:'Correct! Vacuum sealing reduces oxidation and aerobic bacterial growth, but food still has an expiry date. It also has no effect on anaerobic bacteria like Clostridium botulinum, so always check the date and refrigerate after opening.',id:'Benar! Kemasan vakum mengurangi oksidasi dan pertumbuhan bakteri aerob, tetapi makanan masih memiliki tanggal kedaluwarsa.',vi:'Đúng! Đóng gói chân không giảm oxy hóa và vi khuẩn hiếu khí, nhưng thực phẩm vẫn có hạn sử dụng. Không có tác dụng với vi khuẩn kỵ khí như Clostridium botulinum, nên vẫn cần kiểm tra hạn và bảo quản lạnh sau khi mở.'}},

          {zh:'只要加熱一下再冷凍即可',en:'Just heat it briefly then refreeze',id:'Cukup panaskan sebentar lalu bekukan kembali',vi:'Hâm nóng sơ rồi tái đông là được',ok:false}],
    fb:{zh:'正確！解凍過程中食材表面進入危險溫度帶，細菌會快速繁殖；再次冷凍雖能抑制細菌，但無法殺死已滋生的細菌，且反覆冷凍解凍會破壞食材質地。應將解凍的食材完全煮熟後再冷凍，或趁新鮮儘快食用。',en:'Correct! During thawing, the food surface enters the danger zone where bacteria multiply rapidly. Refreezing suppresses but doesn\'t kill existing bacteria, and repeated freeze-thaw cycles degrade texture. Cook thoroughly before refreezing, or eat promptly.',id:'Benar! Saat mencair, permukaan makanan memasuki zona bahaya dan bakteri berkembang biak dengan cepat. Pembekuan ulang menekan tetapi tidak membunuh bakteri yang sudah ada.',vi:'Đúng! Khi rã đông, bề mặt thực phẩm vào vùng nguy hiểm và vi khuẩn sinh sôi nhanh. Tái đông ức chế nhưng không giết chết vi khuẩn đã có, và đông-rã nhiều lần phá hủy kết cấu. Hãy nấu chín kỹ trước khi tái đông hoặc ăn ngay.'}}

    opts:[{zh:'魚皮表面保持濕潤直接下鍋',en:'Keep the fish skin damp and place it straight into the pan',id:'Biarkan kulit ikan basah dan langsung masukkan ke wajan',vi:'Để da cá còn ướt và cho thẳng vào chảo',ok:false},
          {zh:'將魚皮充分擦乾，待鍋與油熱後下鍋且勿過早翻動',en:'Pat the skin completely dry, wait until pan and oil are hot, then avoid flipping too early',id:'Keringkan kulit ikan, tunggu wajan dan minyak panas, lalu jangan dibalik terlalu cepat',vi:'Lau khô kỹ da cá, đợi chảo và dầu đủ nóng rồi mới cho vào, không lật quá sớm',ok:true},
          {zh:'用大火快速連續翻面數次',en:'Use high heat and flip it repeatedly in quick succession',id:'Gunakan api besar dan balik berulang kali dengan cepat',vi:'Dùng lửa lớn và lật liên tục nhiều lần',ok:false}],
    fb:{zh:'正確！魚皮水分在高溫下產生蒸氣造成沾黏與破皮，因此下鍋前須充分擦乾。鍋與油要充分加熱，讓魚皮先煎至定型、邊緣金黃再翻面，過早翻動容易使皮肉分離。',en:'Correct! Moisture on the skin turns to steam causing sticking and tearing — pat dry before cooking. Wait until pan and oil are properly hot; let the skin set and turn golden before flipping.',id:'Benar! Kelembapan kulit berubah menjadi uap menyebabkan lengket — keringkan sebelum dimasak. Tunggu wajan dan minyak panas; biarkan kulit mengeras dan keemasan sebelum dibalik.',vi:'Đúng! Hơi ẩm da cá biến thành hơi nước gây dính và rách — lau khô trước. Đợi chảo và dầu đủ nóng; để da định hình và vàng rồi mới lật.'}},
   {q:{zh:'煮義大利麵時，水中加鹽的最佳時機是？',en:'When cooking pasta, the best time to add salt to the water is?',id:'Saat memasak pasta, kapan waktu terbaik menambahkan garam ke air?',vi:'Khi nấu mì pasta, thời điểm tốt nhất để cho muối vào nước là?'},
    opts:[{zh:'水煮沸後再加鹽再放麵',en:'Add salt after the water boils, then add pasta',id:'Tambahkan garam setelah air mendidih, lalu masukkan pasta',vi:'Cho muối sau khi nước sôi, rồi mới cho mì vào',ok:true},
          {zh:'麵條快熟時才加鹽',en:'Add salt just before the pasta is done',id:'Tambahkan garam tepat sebelum pasta matang',vi:'Cho muối ngay trước khi mì chín',ok:false},
          {zh:'起鍋後加在麵條上',en:'Add salt to the pasta after draining',id:'Tambahkan garam ke pasta setelah ditiriskan',vi:'Cho muối lên mì sau khi vớt ra',ok:false}],
    fb:{zh:'正確！水沸後加鹽（約每公升水10–15克）能讓麵條在烹煮過程中均勻吸入鹹味，形成由內而外的風味，是義大利麵美味的基礎。加在成品上則味道只停留在表面，效果相差甚遠。',en:'Correct! Adding salt after boiling (about 10–15 g per litre) allows pasta to absorb seasoning evenly from the inside out — the foundation of great pasta flavor. Adding it after cooking only seasons the surface.',id:'Benar! Menambahkan garam setelah mendidih memungkinkan pasta menyerap bumbu secara merata dari dalam ke luar.',vi:'Đúng! Thêm muối sau khi nước sôi (khoảng 10–15 g/lít) giúp mì thấm vị đều từ trong ra ngoài — nền tảng của hương vị pasta ngon. Thêm muối sau khi nấu xong chỉ tạo vị bề mặt.'}},
   {q:{zh:'製作炒飯時，隔夜飯比新鮮飯效果更好的原因是？',en:'When making fried rice, why does day-old rice work better than freshly cooked rice?',id:'Saat membuat nasi goreng, mengapa nasi semalam lebih baik dari nasi yang baru dimasak?',vi:'Khi làm cơm chiên, tại sao cơm nguội để qua đêm lại ngon hơn cơm mới nấu?'},
    opts:[{zh:'隔夜飯比較有味道',en:'Day-old rice has more flavor',id:'Nasi semalam memiliki lebih banyak rasa',vi:'Cơm nguội đậm vị hơn',ok:false},
          {zh:'隔夜飯水分蒸發較少，顆粒分明不易結塊，高溫翻炒時容易均勻上色',en:'Day-old rice has less moisture, stays separate and not clumped, and takes on color evenly when stir-fried at high heat',id:'Nasi semalam lebih sedikit kelembapan, tetap terpisah dan tidak menggumpal, dan mudah mewarna secara merata saat ditumis dengan api besar',vi:'Cơm nguội ít ẩm hơn, tơi không vón, và dễ lên màu đều khi xào lửa lớn',ok:true},
          {zh:'隔夜飯不含致病菌',en:'Day-old rice contains no pathogens',id:'Nasi semalam tidak mengandung patogen',vi:'Cơm nguội không chứa vi khuẩn gây bệnh',ok:false}],
    fb:{zh:'正確！新鮮米飯含水量高，下鍋容易黏成一團、不易上色；隔夜飯表面水分揮發，米粒乾爽分明，大火翻炒時每粒都能均勻受熱上色，炒出粒粒分明的效果。但要注意隔夜飯應冷藏保存，避免細菌滋生。',en:'Correct! Fresh rice is too moist and clumps easily without browning. Day-old rice has dried out on the surface, so each grain separates and colors evenly at high heat. Just make sure to refrigerate leftover rice to prevent bacterial growth.',id:'Benar! Nasi segar terlalu lembap dan mudah menggumpal. Nasi semalam kering di permukaan, sehingga setiap butir terpisah dan mewarna merata.',vi:'Đúng! Cơm mới ẩm dễ vón thành cục và khó lên màu; cơm nguội khô bề mặt, mỗi hạt tơi và lên màu đều khi xào lửa lớn. Nhưng nhớ bảo quản cơm nguội trong tủ lạnh để tránh vi khuẩn.'}},
   {q:{zh:'「走油」（過油）技術是指什麼？',en:'What does the "passing through oil" (velveting/par-cooking in oil) technique refer to?',id:'Apa yang dimaksud teknik "melewati minyak" (par-cooking dalam minyak)?',vi:'Kỹ thuật "qua dầu" có nghĩa là gì?'},
    opts:[{zh:'把食材浸泡在油中醃漬入味',en:'Marinating ingredients submerged in oil',id:'Merendam bahan dalam minyak untuk marinasi',vi:'Ngâm nguyên liệu trong dầu để ướp',ok:false},
          {zh:'食材先以低溫油泡炸至半熟，取出備用，正式烹調時再下鍋',en:'Par-cook ingredients in low-temperature oil until partially done, then remove for later final cooking',id:'Memasak sebagian bahan dalam minyak suhu rendah hingga setengah matang, lalu angkat untuk dimasak akhir',vi:'Sơ chế nguyên liệu trong dầu nhiệt độ thấp đến khi chín một phần, vớt ra để nấu chính thức sau',ok:true},
          {zh:'把多餘的油脂從成品中瀝乾',en:'Draining excess oil from finished dishes',id:'Meniriskan kelebihan minyak dari hidangan yang sudah jadi',vi:'Đổ bỏ dầu thừa từ món đã nấu xong',ok:false}],
    fb:{zh:'正確！走油（過油）是中式烹調的前置技法：將肉類或食材先在低溫油（約120–150°C）中泡炸至半熟，外層定型但內部仍嫩；正式烹調時再以大火快速完成。這樣能使食材受熱均勻且保持嫩滑。常用於宮保雞丁、滑蛋牛肉等料理。',en:'Correct! Par-cooking in oil (走油/過油) is a Chinese cooking prep technique: par-cook meat or ingredients in low-temperature oil (~120–150°C) until partially done — exterior set but interior still tender. Final cooking then takes place at high heat. This ensures even cooking and silky texture. Used in dishes like kung pao chicken.',id:'Benar! Par-cooking dalam minyak adalah teknik persiapan memasak Cina: masak daging dalam minyak suhu rendah (~120-150°C) hingga setengah matang — eksterior mengeras tapi interior masih empuk.',vi:'Đúng! Sơ chế qua dầu là kỹ thuật chuẩn bị trong nấu ăn Trung Hoa: sơ chế thịt hoặc nguyên liệu trong dầu nhiệt độ thấp (~120-150°C) cho đến khi chín một phần — bề ngoài định hình nhưng bên trong vẫn mềm. Nấu chính thức sau ở lửa lớn.'}},
   {q:{zh:'製作西式「醬汁」（Sauce）時，「Roux（麵糊）」是什麼？',en:'In Western sauce-making, what is a "roux"?',id:'Dalam pembuatan saus Barat, apa itu "roux"?',vi:'Trong làm nước sốt kiểu Tây, "roux" là gì?'},
    opts:[{zh:'用雞蛋與油脂製作的乳化醬',en:'A sauce emulsified from eggs and fat',id:'Saus yang diemulsifikasi dari telur dan lemak',vi:'Sốt nhũ tương từ trứng và chất béo',ok:false},
          {zh:'等量奶油與麵粉一起炒製的增稠基底',en:'Equal parts butter and flour cooked together to form a thickening base',id:'Bagian yang sama antara mentega dan tepung dimasak bersama untuk membentuk dasar pengental',vi:'Lượng bằng nhau bơ và bột mì nấu cùng để tạo nền làm đặc',ok:true},
          {zh:'高湯濃縮後的精華液',en:'A concentrated stock reduction',id:'Reduksi kaldu yang pekat',vi:'Tinh chất từ việc cô đặc nước dùng',ok:false}],
    fb:{zh:'正確！Roux是西式料理中最基礎的增稠劑，由等量（重量比）的奶油與麵粉在鍋中加熱炒製而成。依炒製時間不同分為白色Roux（White）、金黃色Roux（Blonde）、棕色Roux（Brown），分別用於不同醬汁。白色Roux是貝夏梅醬（Béchamel）的基礎。',en:'Correct! Roux is the most fundamental thickener in Western cooking — equal parts (by weight) butter and flour cooked together. Different cooking times produce white roux, blonde roux, and brown roux for different sauces. White roux is the base for béchamel.',id:'Benar! Roux adalah pengental paling mendasar dalam masak Barat — bagian yang sama antara mentega dan tepung dimasak bersama. Waktu memasak berbeda menghasilkan roux putih, pirang, dan coklat untuk saus yang berbeda.',vi:'Đúng! Roux là chất làm đặc cơ bản nhất trong nấu ăn kiểu Tây — lượng bằng nhau bơ và bột mì nấu cùng. Thời gian nấu khác nhau tạo ra roux trắng, vàng và nâu cho các loại sốt khác nhau. Roux trắng là nền cho sốt béchamel.'}},
   {q:{zh:'「Mise en place」（備料就位）在廚房工作中的重要性是？',en:'Why is "mise en place" (everything in its place) important in kitchen work?',id:'Mengapa "mise en place" (segalanya pada tempatnya) penting dalam pekerjaan dapur?',vi:'Tầm quan trọng của "mise en place" (sắp xếp mọi thứ vào đúng chỗ) trong công việc bếp là gì?'},
    opts:[{zh:'只是法式餐廳的傳統，家庭廚房不需要',en:'It is only a French restaurant tradition; home kitchens don\'t need it',id:'Itu hanya tradisi restoran Prancis; dapur rumah tidak perlu',vi:'Chỉ là truyền thống nhà hàng Pháp; bếp nhà không cần',ok:false},
          {zh:'烹調前將所有食材處理完畢並就位，讓烹調過程流暢、減少錯誤與事故',en:'Preparing and positioning all ingredients before cooking begins, making the cooking process smooth while reducing mistakes and accidents',id:'Menyiapkan dan memposisikan semua bahan sebelum memasak dimulai, membuat proses memasak lancar sambil mengurangi kesalahan dan kecelakaan',vi:'Chuẩn bị và sắp xếp tất cả nguyên liệu trước khi bắt đầu nấu, giúp quá trình nấu trôi chảy và giảm sai sót cũng như tai nạn',ok:true},
          {zh:'只對多人同時料理的專業廚房有幫助',en:'Only useful in professional kitchens cooking for many people at once',id:'Hanya berguna di dapur profesional yang memasak untuk banyak orang sekaligus',vi:'Chỉ hữu ích trong bếp chuyên nghiệp nấu cho nhiều người cùng lúc',ok:false}],
    fb:{zh:'正確！Mise en place（準備就緒）是廚房效率的核心：烹調前先完成所有切配、量取、醃漬等前置作業，並將食材按使用順序排列就位。這樣在高溫快炒時不需臨時找食材，避免手忙腳亂，也減少食材過熟或遺漏的情況，是職業廚師的基本工作習慣。',en:'Correct! Mise en place is the core of kitchen efficiency: complete all cutting, measuring, and marinating before cooking starts, and arrange ingredients in order of use. This prevents scrambling during high-heat cooking, avoids overcooked or forgotten ingredients, and is a fundamental habit for professional cooks.',id:'Benar! Mise en place adalah inti efisiensi dapur: selesaikan semua pemotongan, pengukuran, dan marinasi sebelum memasak dimulai, dan atur bahan sesuai urutan penggunaan. Ini mencegah kepanikan saat memasak dengan api besar.',vi:'Đúng! Mise en place là cốt lõi của hiệu quả bếp: hoàn thành tất cả cắt, đong đếm và ướp gia vị trước khi bắt đầu nấu, và sắp xếp nguyên liệu theo thứ tự sử dụng. Điều này ngăn lộn xộn khi nấu ở nhiệt độ cao, tránh nguyên liệu chín quá hoặc bị bỏ sót, là thói quen làm việc cơ bản của đầu bếp chuyên nghiệp.'}}
  ],
  /* Lv6 食品衛生 */
  [
   {q:{zh:'七步驟洗手法中，第一步是？',en:'The first step in the 7-step handwashing method is?',id:'Langkah pertama mencuci tangan 7 langkah adalah?',vi:'Bước đầu tiên trong quy trình rửa tay 7 bước là?'},
    opts:[{zh:'搓手掌',en:'Rub palms together',id:'Gosok telapak tangan',vi:'Chà lòng bàn tay',ok:false},
          {zh:'濕潤雙手並塗抹肥皂',en:'Wet hands and apply soap',id:'Basahi tangan lalu oleskan sabun',vi:'Làm ướt tay và thoa xà phòng',ok:true},
          {zh:'沖洗雙手',en:'Rinse hands',id:'Bilas tangan',vi:'Rửa sạch tay',ok:false}],
    fb:{zh:'正確！先用流水濕潤雙手，再取適量肥皂開始搓洗。',en:'Correct! First wet hands under running water, then apply an appropriate amount of soap.',id:'Benar! Pertama basahi tangan dengan air mengalir, lalu oleskan sabun.',vi:'Đúng! Đầu tiên làm ướt tay dưới vòi nước, sau đó thoa xà phòng.'}},
   {q:{zh:'根據砧板顏色管理，紅色砧板應用於？',en:'According to color-coded board system, the red board is for?',id:'Menurut sistem talenan berwarna, talenan merah digunakan untuk?',vi:'Theo hệ thống thớt màu, thớt đỏ dùng cho?'},
    opts:[{zh:'蔬菜與水果',en:'Vegetables & fruits',id:'Sayuran & buah',vi:'Rau củ và trái cây',ok:false},
          {zh:'生肉（牛豬羊）',en:'Raw meat (beef, pork, lamb)',id:'Daging mentah (sapi, babi, kambing)',vi:'Thịt sống (bò, heo, dê)',ok:true},
          {zh:'熟食',en:'Cooked food',id:'Makanan matang',vi:'Thực phẩm đã nấu chín',ok:false}],
    fb:{zh:'正確！紅=生肉，黃=生禽肉，藍=生海鮮，綠=蔬果，白=熟食，棕=麵包烘焙。分色管理能有效防止交叉汙染。',en:'Correct! Red=raw meat, Yellow=raw poultry, Blue=raw seafood, Green=produce, White=cooked, Brown=bakery. Color coding prevents cross-contamination.',id:'Benar! Merah=daging mentah, Kuning=unggas mentah, Biru=seafood mentah, Hijau=sayuran, Putih=matang, Coklat=roti. Kode warna mencegah kontaminasi silang.',vi:'Đúng! Đỏ=thịt sống, Vàng=gia cầm sống, Xanh dương=hải sản sống, Xanh lá=rau củ, Trắng=thức ăn chín, Nâu=bánh mì. Mã màu ngăn ô nhiễm chéo.'}},
   {q:{zh:'食品中毒四大原因中，下列哪項屬於「汙染」原因？',en:'Among the 4 causes of food poisoning, which is a \"contamination\" factor?',id:'Di antara 4 penyebab keracunan makanan, mana yang faktor \"kontaminasi\"?',vi:'Trong 4 nguyên nhân ngộ độc thực phẩm, điều nào là yếu tố \"ô nhiễm\"?'},
    opts:[{zh:'食物在室溫放置超過2小時',en:'Food left at room temperature for over 2 hours',id:'Makanan dibiarkan di suhu ruang lebih dari 2 jam',vi:'Thức ăn để ở nhiệt độ phòng hơn 2 giờ',ok:false},
          {zh:'生熟食使用同一塊砧板',en:'Using the same board for raw and cooked food',id:'Menggunakan talenan yang sama untuk makanan mentah dan matang',vi:'Dùng chung thớt cho thực phẩm sống và chín',ok:true},
          {zh:'烹調溫度不足',en:'Insufficient cooking temperature',id:'Suhu memasak tidak cukup',vi:'Nhiệt độ nấu tidak đủ',ok:false}],
    fb:{zh:'正確！生熟同板是最典型的交叉汙染。室溫放置超過2小時屬於「增殖」問題；加熱不足屬「加熱不足」問題。四大原因：汙染、增殖、加熱不足、個人衛生不良。',en:'Correct! Sharing boards is classic contamination. Leaving food at room temp over 2 hours is \"proliferation\". The 4 causes: contamination, proliferation, insufficient heating, poor personal hygiene.',id:'Benar! Berbagi talenan adalah kontaminasi. Makanan di suhu ruang lebih dari 2 jam adalah \"proliferasi\". 4 penyebab: kontaminasi, proliferasi, pemanasan tidak cukup, kebersihan buruk.',vi:'Đúng! Dùng chung thớt là ô nhiễm. Để thức ăn ở nhiệt độ phòng hơn 2 giờ là \"sinh sôi\". 4 nguyên nhân: ô nhiễm, sinh sôi, nhiệt không đủ, vệ sinh kém.'}},
   {q:{zh:'食品處理人員應多久洗一次手？',en:'How often should food handlers wash their hands?',id:'Seberapa sering penangan makanan harus mencuci tangan?',vi:'Người chế biến thực phẩm cần rửa tay bao lâu một lần?'},
    opts:[{zh:'每天開始工作前洗一次即可',en:'Once at the beginning of each workday',id:'Sekali di awal setiap hari kerja',vi:'Một lần vào đầu mỗi ngày làm việc',ok:false},
          {zh:'處理食材前後、如廁後、觸摸臉部或頭髮後都應洗手',en:'Before and after handling food, after using the toilet, after touching face or hair',id:'Sebelum dan sesudah menangani makanan, setelah ke toilet, setelah menyentuh wajah atau rambut',vi:'Trước và sau khi xử lý thực phẩm, sau khi vào nhà vệ sinh, sau khi chạm vào mặt hoặc tóc',ok:true},
          {zh:'只需在接觸生肉後洗手',en:'Only after touching raw meat',id:'Hanya setelah menyentuh daging mentah',vi:'Chỉ cần sau khi chạm vào thịt sống',ok:false}],
    fb:{zh:'正確！洗手是食品衛生的基礎。處理食材前後、如廁後、打噴嚏後、觸摸臉部或手機後均應洗手，使用七步驟洗手法確保徹底清潔。',en:'Correct! Handwashing is the foundation of food hygiene. Wash before/after handling food, after using the toilet, sneezing, or touching face/phone. Use the 7-step method.',id:'Benar! Mencuci tangan adalah dasar kebersihan pangan. Cuci sebelum/sesudah menangani makanan, setelah ke toilet, bersin, atau menyentuh wajah.',vi:'Đúng! Rửa tay là nền tảng vệ sinh thực phẩm. Rửa trước/sau khi xử lý thực phẩm, sau khi đi vệ sinh, hắt hơi, hoặc chạm vào mặt.'}},
   {q:{zh:'廚房砧板顏色管理中，紅色砧板通常用於哪類食材？',en:'In kitchen color-coded cutting boards, what is the red board typically used for?',id:'Dalam sistem talenan berwarna, talenan merah biasanya digunakan untuk apa?',vi:'Trong hệ thống thớt phân màu, thớt đỏ thường dùng cho nguyên liệu nào?'},
    opts:[{zh:'蔬菜與水果',en:'Vegetables and fruits',id:'Sayuran dan buah-buahan',vi:'Rau củ và trái cây',ok:false},
          {zh:'生的紅肉（牛、豬）',en:'Raw red meat (beef, pork)',id:'Daging merah mentah (sapi, babi)',vi:'Thịt đỏ sống (bò, heo)',ok:true},
          {zh:'麵包與烘焙品',en:'Bread and baked goods',id:'Roti dan produk bakery',vi:'Bánh mì và các sản phẩm nướng',ok:false}],
    fb:{zh:'正確！國際廚房顏色管理規範：紅色用於生的紅肉（牛、豬）、黃色用於生禽肉、藍色用於生魚海鮮、綠色用於蔬果、白色用於乳製品與麵包。',en:'Correct! International color-coding: red for raw red meat, yellow for raw poultry, blue for raw fish/seafood, green for vegetables/fruit, white for dairy/bread.',id:'Benar! Kode warna internasional: merah untuk daging merah mentah, kuning untuk unggas mentah, biru untuk ikan/seafood mentah, hijau untuk sayuran/buah.',vi:'Đúng! Quy chuẩn màu quốc tế: đỏ cho thịt đỏ sống, vàng cho gia cầm sống, xanh cho cá/hải sản sống, xanh lá cho rau/trái cây.'}},
   {q:{zh:'廚師在工作時，哪項個人衛生習慣最重要？',en:'Which personal hygiene habit is most important for kitchen workers?',id:'Kebiasaan kebersihan pribadi mana yang paling penting bagi pekerja dapur?',vi:'Thói quen vệ sinh cá nhân nào quan trọng nhất với người làm bếp?'},
    opts:[{zh:'每天更換廚師服但不需要戴帽子',en:'Change chef\'s uniform daily but no hat required',id:'Ganti seragam koki setiap hari tapi tidak perlu topi',vi:'Thay đồng phục đầu bếp mỗi ngày nhưng không cần đội mũ',ok:false},
          {zh:'保持指甲短且乾淨，不佩戴首飾，並正確佩戴廚師帽',en:'Keep nails short and clean, remove jewelry, and wear a chef\'s hat properly',id:'Jaga kuku pendek dan bersih, lepas perhiasan, dan pakai topi koki dengan benar',vi:'Giữ móng tay ngắn và sạch, không đeo trang sức và đội mũ đầu bếp đúng cách',ok:true},
          {zh:'只要手部清潔，其他個人衛生不影響食品安全',en:'Hand hygiene alone is sufficient; other personal hygiene doesn\'t affect food safety',id:'Kebersihan tangan saja sudah cukup; kebersihan pribadi lainnya tidak mempengaruhi keamanan pangan',vi:'Chỉ cần vệ sinh tay là đủ; vệ sinh cá nhân khác không ảnh hưởng đến an toàn thực phẩm',ok:false}],
    fb:{zh:'正確！食品從業人員應保持指甲短且無塗指甲油、不佩戴首飾（避免異物掉入食物）、正確佩戴廚師帽（遮住頭髮），是預防物理性污染的重要措施。',en:'Correct! Food workers should keep nails short and unpolished, remove all jewelry, and wear a proper chef\'s hat — all key measures against physical contamination.',id:'Benar! Pekerja pangan harus menjaga kuku pendek tanpa cat, lepas perhiasan, dan pakai topi koki untuk mencegah kontaminasi fisik.',vi:'Đúng! Người làm thực phẩm cần giữ móng tay ngắn không sơn, không đeo trang sức và đội mũ đầu bếp — biện pháp quan trọng ngăn nhiễm vật lý.'}},
   {q:{zh:'冰箱應定期進行哪些衛生管理？',en:'What hygiene maintenance should be done regularly for the refrigerator?',id:'Perawatan kebersihan apa yang harus dilakukan secara teratur untuk kulkas?',vi:'Cần thực hiện vệ sinh định kỳ nào cho tủ lạnh?'},
    opts:[{zh:'只要溫度正常就不需要清理',en:'No cleaning needed as long as temperature is normal',id:'Tidak perlu dibersihkan selama suhu normal',vi:'Không cần vệ sinh miễn là nhiệt độ bình thường',ok:false},
          {zh:'定期清除過期食材、擦拭內壁、確認溫度設定',en:'Regularly remove expired items, wipe the interior, and verify temperature settings',id:'Rutin hapus bahan kedaluwarsa, lap bagian dalam, dan verifikasi pengaturan suhu',vi:'Định kỳ loại bỏ thực phẩm hết hạn, lau bên trong và kiểm tra cài đặt nhiệt độ',ok:true},
          {zh:'每天用熱水沖洗冰箱內部',en:'Rinse the refrigerator interior with hot water every day',id:'Bilas bagian dalam kulkas dengan air panas setiap hari',vi:'Tráng nước nóng bên trong tủ lạnh mỗi ngày',ok:false}],
    fb:{zh:'正確！冰箱衛生管理包含定期清除過期食材、擦拭內壁與隔板，並確認冷藏溫度維持在4°C以下、冷凍在-18°C以下。',en:'Correct! Refrigerator hygiene includes regularly removing expired items, wiping the interior, and verifying fridge stays below 4°C and freezer below -18°C.',id:'Benar! Kebersihan kulkas meliputi hapus bahan kedaluwarsa, lap interior, dan pastikan suhu kulkas di bawah 4°C dan freezer di bawah -18°C.',vi:'Đúng! Vệ sinh tủ lạnh bao gồm loại bỏ thực phẩm hết hạn, lau bên trong và đảm bảo ngăn mát dưới 4°C, ngăn đông dưới -18°C.'}},
   {q:{zh:'廚房工作台每次使用後應如何清潔？',en:'How should the kitchen worktop be cleaned after each use?',id:'Bagaimana meja kerja dapur harus dibersihkan setelah setiap penggunaan?',vi:'Mặt bếp nên được vệ sinh thế nào sau mỗi lần sử dụng?'},
    opts:[{zh:'用濕布快速擦一下即可',en:'A quick wipe with a damp cloth is enough',id:'Usap cepat dengan kain basah sudah cukup',vi:'Lau nhanh bằng khăn ướt là đủ',ok:false},
          {zh:'以清潔劑或食品安全消毒液擦拭，並用乾淨乾布乾燥',en:'Wipe with detergent or food-safe sanitizer, then dry with a clean cloth',id:'Lap dengan deterjen atau sanitizer aman pangan, lalu keringkan dengan kain bersih',vi:'Lau bằng chất tẩy rửa hoặc dung dịch sát khuẩn an toàn thực phẩm, rồi lau khô bằng khăn sạch',ok:true},
          {zh:'只在一天工作結束後清潔一次',en:'Clean once at the end of the workday only',id:'Bersihkan sekali di akhir hari kerja saja',vi:'Chỉ vệ sinh một lần cuối ngày làm việc',ok:false}],
    fb:{zh:'正確！工作台在每次處理不同食材（尤其是生熟食之間）後應以清潔劑清洗並消毒，防止細菌殘留與交叉汙染。使用消毒液後讓其自然乾燥或用乾淨布擦拭，不需要再用清水沖洗。',en:'Correct! Worktops should be cleaned with detergent and sanitized after handling different ingredients (especially between raw and cooked foods) to prevent bacterial residue and cross-contamination. After sanitizing, air-dry or wipe with a clean cloth.',id:'Benar! Meja kerja harus dibersihkan dan disanitasi setelah menangani bahan berbeda untuk mencegah residu bakteri dan kontaminasi silang.',vi:'Đúng! Mặt bếp cần được làm sạch và sát khuẩn sau mỗi lần xử lý nguyên liệu khác nhau, đặc biệt giữa thực phẩm sống và chín, để ngăn vi khuẩn còn lại và nhiễm chéo.'}},
   {q:{zh:'廚師帽（Hair Net）的主要食品衛生功能是？',en:'The main food hygiene function of a chef\'s hat (or hair net) is?',id:'Fungsi kebersihan pangan utama topi koki (atau jaring rambut) adalah?',vi:'Chức năng vệ sinh thực phẩm chính của mũ đầu bếp (hoặc lưới tóc) là?'},
    opts:[{zh:'讓廚師看起來更專業',en:'Makes the chef look more professional',id:'Membuat koki terlihat lebih profesional',vi:'Làm đầu bếp trông chuyên nghiệp hơn',ok:false},
          {zh:'防止頭髮掉入食物中造成物理性汙染',en:'Prevents hair from falling into food, avoiding physical contamination',id:'Mencegah rambut jatuh ke makanan, menghindari kontaminasi fisik',vi:'Ngăn tóc rụng vào thức ăn, tránh ô nhiễm vật lý',ok:true},
          {zh:'防止廚師吸入廚房蒸氣',en:'Prevents chefs from inhaling kitchen steam',id:'Mencegah koki menghirup uap dapur',vi:'Ngăn đầu bếp hít hơi bếp',ok:false}],
    fb:{zh:'正確！頭髮是廚房中最常見的物理性異物之一。一根頭髮掉入食物不僅讓客人不適，也可能帶來細菌。廚師帽或髮網能有效防止頭髮脫落，是食品安全管理的重要規範。',en:'Correct! Hair is one of the most common physical contaminants in kitchens. A hair in food is unpleasant for diners and can carry bacteria. Chef hats or hair nets effectively prevent hair from falling, an important food safety regulation.',id:'Benar! Rambut adalah salah satu kontaminan fisik paling umum di dapur. Rambut di makanan tidak menyenangkan dan bisa membawa bakteri. Topi koki atau jaring rambut mencegah rambut jatuh.',vi:'Đúng! Tóc là một trong những tạp chất vật lý phổ biến nhất trong bếp. Một sợi tóc rơi vào thức ăn vừa gây khó chịu vừa có thể mang vi khuẩn. Mũ đầu bếp hoặc lưới tóc ngăn tóc rụng xuống, là quy định quan trọng trong an toàn thực phẩm.'}},
   {q:{zh:'廚房抹布應如何管理才能避免成為細菌溫床？',en:'How should kitchen cloths be managed to avoid becoming a breeding ground for bacteria?',id:'Bagaimana kain lap dapur harus dikelola untuk menghindari menjadi sarang bakteri?',vi:'Khăn bếp nên quản lý thế nào để tránh trở thành ổ vi khuẩn?'},
    opts:[{zh:'只要外觀看起來乾淨就繼續使用，不需要定期更換',en:'Keep using as long as it looks clean, no need to replace regularly',id:'Terus gunakan selama terlihat bersih, tidak perlu diganti secara berkala',vi:'Tiếp tục dùng miễn là trông còn sạch, không cần thay thường xuyên',ok:false},
          {zh:'每天更換並清洗，使用後立即晾乾，不同用途使用不同抹布',en:'Change and wash daily, dry immediately after use, and use separate cloths for different purposes',id:'Ganti dan cuci setiap hari, keringkan segera setelah digunakan, dan gunakan kain berbeda untuk tujuan berbeda',vi:'Thay và giặt hàng ngày, lau khô ngay sau khi dùng, và dùng khăn riêng cho các mục đích khác nhau',ok:true},
          {zh:'用微波爐加熱30秒即可消毒，可重複使用一週',en:'Microwave for 30 seconds to disinfect and reuse for a week',id:'Panaskan di microwave 30 detik untuk disinfeksi dan gunakan kembali selama seminggu',vi:'Hâm trong lò vi sóng 30 giây để khử trùng và dùng lại cả tuần',ok:false}],
    fb:{zh:'正確！廚房抹布潮濕的環境最容易孳生細菌，每天清洗更換、使用後立即晾乾是基本衛生要求；並應區分不同用途（清潔台面、擦拭餐具）使用不同抹布，避免交叉汙染。',en:'Correct! Damp cloths are ideal for bacterial growth. Daily washing and replacement, drying immediately after use, and using separate cloths for different purposes (countertops vs. dishes) are basic hygiene requirements.',id:'Benar! Kain basah sangat cocok untuk pertumbuhan bakteri. Cuci dan ganti setiap hari, keringkan segera, dan gunakan kain terpisah untuk tujuan berbeda.',vi:'Đúng! Khăn ẩm là môi trường lý tưởng cho vi khuẩn. Giặt và thay hàng ngày, lau khô ngay, và dùng khăn riêng cho các mục đích khác nhau (mặt bếp, chén đĩa) là yêu cầu vệ sinh cơ bản.'}},
   {q:{zh:'廚房工作人員在哪種情況下必須停止工作並離開廚房？',en:'Under which circumstance must a kitchen worker stop working and leave the kitchen?',id:'Dalam keadaan apa pekerja dapur harus berhenti bekerja dan meninggalkan dapur?',vi:'Trong trường hợp nào người làm bếp phải ngừng làm việc và rời khỏi bếp?'},
    opts:[{zh:'感到有些疲勞但沒有發燒',en:'Feeling somewhat tired but no fever',id:'Merasa agak lelah tetapi tidak demam',vi:'Cảm thấy hơi mệt nhưng không sốt',ok:false},
          {zh:'出現發燒、腹瀉、嘔吐、黃疸或手部有感染傷口',en:'Experiencing fever, diarrhea, vomiting, jaundice, or infected wounds on hands',id:'Mengalami demam, diare, muntah, kuning, atau luka terinfeksi di tangan',vi:'Bị sốt, tiêu chảy, nôn mửa, vàng da hoặc có vết thương nhiễm trùng ở tay',ok:true},
          {zh:'只是感冒打噴嚏，不需要停工',en:'Just a cold with sneezing — no need to stop working',id:'Hanya flu dengan bersin — tidak perlu berhenti bekerja',vi:'Chỉ bị cảm và hắt hơi — không cần ngừng làm việc',ok:false}],
    fb:{zh:'正確！食品從業人員若有發燒（38°C以上）、腹瀉、嘔吐、黃疸（可能為肝炎）或手部有感染傷口，必須立即停止接觸食品並離開廚房，因為這些情況可能通過食品傳播給消費者，造成食源性疾病爆發。感冒打噴嚏雖不列強制停工，但應佩戴口罩並避免直接接觸食品。',en:'Correct! Food handlers with fever (38°C+), diarrhea, vomiting, jaundice (possible hepatitis), or infected hand wounds must immediately stop handling food and leave the kitchen — these conditions can spread through food to consumers. A cold with sneezing is not mandatory for removal, but workers should wear a mask and avoid direct food contact.',id:'Benar! Pekerja pangan dengan demam (38°C+), diare, muntah, kuning (hepatitis mungkin), atau luka tangan yang terinfeksi harus segera berhenti menangani makanan.',vi:'Đúng! Người xử lý thực phẩm bị sốt (38°C+), tiêu chảy, nôn mửa, vàng da (có thể viêm gan) hoặc vết thương tay bị nhiễm trùng phải ngừng tiếp xúc thực phẩm và rời bếp ngay — các tình trạng này có thể lây qua thực phẩm đến người tiêu dùng.'}}
  ],

    opts:[{zh:'每天都吃同一種食物，以確保營養攝取穩定',en:'Eat the same foods every day for consistent nutrition',id:'Makan makanan yang sama setiap hari untuk nutrisi yang konsisten',vi:'Ăn cùng một loại thực phẩm mỗi ngày để đảm bảo dinh dưỡng ổn định',ok:false},
