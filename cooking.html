    fb:{zh:'正確！誠信是家庭幫傭最重要的職業操守。採購時應依照雇主指示或確認好的菜單執行，保留所有收據，詳細記錄每筆費用，並如實繳回找零。透明的財務紀錄能建立雙方信任，是長期合作的基礎。',en:'Correct! Integrity is the most important professional ethic for household helpers. Shop according to employer instructions, keep all receipts, record every expense in detail, and return all change honestly. Transparent records build trust.',id:'Benar! Integritas adalah etika profesional terpenting bagi pembantu rumah tangga. Belanja sesuai instruksi majikan, simpan semua kuitansi, catat setiap pengeluaran secara terperinci, dan kembalikan semua kembalian dengan jujur.',vi:'Đúng! Trung thực là phẩm chất nghề nghiệp quan trọng nhất của người giúp việc gia đình. Hãy mua sắm theo chỉ dẫn hoặc thực đơn đã xác nhận của chủ, lưu lại tất cả hóa đơn, ghi chi tiết từng khoản chi và trả lại toàn bộ tiền thừa. Sổ sách minh bạch xây dựng lòng tin lâu dài.'}},
   {q:{zh:'身為家庭幫傭，烹調前的個人衛生最重要的步驟是？',en:'As a household helper, what is the most important personal hygiene step before cooking?',id:'Sebagai pembantu rumah tangga, langkah kebersihan pribadi paling penting sebelum memasak adalah?',vi:'Là người giúp việc gia đình, bước vệ sinh cá nhân quan trọng nhất trước khi nấu ăn là gì?'},
    opts:[{zh:'穿上圍裙即可開始烹調',en:'Put on an apron and start cooking',id:'Kenakan apron dan mulai memasak',vi:'Mặc tạp dề và bắt đầu nấu ăn',ok:false},
          {zh:'以肥皂徹底洗手至少20秒，特別清潔指甲縫與手背，並確認無傷口或包紮妥當',en:'Wash hands thoroughly with soap for at least 20 seconds, especially between fingers and back of hands, and ensure no open wounds or proper bandaging',id:'Cuci tangan dengan sabun selama minimal 20 detik, terutama sela-sela jari dan punggung tangan, dan pastikan tidak ada luka terbuka atau perban yang tepat',vi:'Rửa tay bằng xà phòng ít nhất 20 giây, đặc biệt là kẽ ngón tay và mặt sau bàn tay, và đảm bảo không có vết thương hở hoặc đã băng bó kỹ',ok:true},
          {zh:'用清水沖洗雙手30秒即可',en:'Rinse hands with water for 30 seconds',id:'Bilas tangan dengan air selama 30 detik',vi:'Xả tay bằng nước trong 30 giây là đủ',ok:false}],
    fb:{zh:'正確！正確洗手是預防食源性疾病最有效的單一措施。正確步驟：①沖濕②打肥皂③搓洗手心手背指縫指甲20秒以上④沖洗⑤擦乾。有傷口時需加戴手套，避免污染食材。',en:'Correct! Proper handwashing is the single most effective measure to prevent foodborne illness. Steps: wet → soap → scrub palms, backs, between fingers, nails for 20+ seconds → rinse → dry. Use gloves if you have wounds.',id:'Benar! Mencuci tangan yang benar adalah tindakan paling efektif untuk mencegah penyakit bawaan makanan. Langkah: basahi → sabun → gosok telapak, punggung, sela jari, kuku selama 20+ detik → bilas → keringkan.',vi:'Đúng! Rửa tay đúng cách là biện pháp đơn lẻ hiệu quả nhất để ngăn ngừa bệnh truyền qua thực phẩm. Các bước: làm ướt tay → xoa xà phòng → chà lòng bàn tay, mặt sau, kẽ ngón tay và móng tay trong 20 giây trở lên → rửa sạch → lau khô. Nếu có vết thương, cần đeo găng tay để tránh làm ô nhiễm thực phẩm.'}},
   {q:{zh:'幫傭在廚房工作中，哪些情況屬於「職業倫理違規」？',en:'In kitchen work, which of the following constitutes a professional ethics violation for a helper?',id:'Dalam pekerjaan dapur, mana di antara berikut yang merupakan pelanggaran etika profesional bagi seorang pembantu?',vi:'Trong công việc bếp núc, điều nào sau đây là vi phạm đạo đức nghề nghiệp của người giúp việc?'},
    opts:[{zh:'主動詢問雇主關於飲食喜好，以便提供更好的服務',en:'Proactively asking the employer about food preferences to provide better service',id:'Secara proaktif menanyakan preferensi makanan majikan untuk memberikan layanan yang lebih baik',vi:'Chủ động hỏi chủ về sở thích ăn uống để cung cấp dịch vụ tốt hơn',ok:false},
          {zh:'私自食用雇主的食材，或將剩菜帶回自己房間',en:'Consuming the employer\'s food without permission, or taking leftover food back to your own room',id:'Mengonsumsi makanan majikan tanpa izin, atau membawa sisa makanan ke kamar sendiri',vi:'Ăn thực phẩm của chủ không được phép, hoặc mang thức ăn thừa về phòng riêng',ok:true},
          {zh:'向雇主報告食材快用完了，需要採購',en:'Reporting to the employer that ingredients are running low and need replenishment',id:'Melaporkan kepada majikan bahwa bahan hampir habis dan perlu diisi ulang',vi:'Báo với chủ là nguyên liệu sắp hết và cần mua thêm',ok:false}],
    fb:{zh:'正確！未經允許食用或帶走雇主食材是職業倫理的嚴重違規，不僅違反誠信原則，也可能引發信任危機。幫傭應對雇主的財物保持清晰的界限意識：飲食需獲得明確授權，如雇主提供的工作餐；其他均不可擅自取用。',en:'Correct! Taking or consuming employer food without permission is a serious professional ethics violation — it violates integrity and can trigger a trust crisis. Helpers must maintain clear boundaries around employer property: eat only what is explicitly authorized (e.g. provided work meals).',id:'Benar! Mengambil atau mengonsumsi makanan majikan tanpa izin adalah pelanggaran etika profesional yang serius. Pembantu harus menjaga batas yang jelas terhadap properti majikan.',vi:'Đúng! Lấy hoặc ăn thực phẩm của chủ không có phép là vi phạm đạo đức nghề nghiệp nghiêm trọng — vi phạm nguyên tắc trung thực và có thể gây khủng hoảng tin tưởng. Người giúp việc phải duy trì ranh giới rõ ràng với tài sản chủ: chỉ ăn những gì được ủy quyền rõ ràng.'}},
   {q:{zh:'幫傭在家庭廚房工作時，若廚房設備出現故障，應如何處理？',en:'If kitchen equipment breaks down while a helper is working, what is the correct course of action?',id:'Jika peralatan dapur rusak saat pembantu bekerja, apa tindakan yang benar?',vi:'Nếu thiết bị bếp bị hỏng trong khi người giúp việc đang làm việc, phương án nào là đúng?'},
    opts:[{zh:'自行嘗試修理，避免麻煩雇主',en:'Try to fix it yourself to avoid bothering the employer',id:'Coba perbaiki sendiri untuk menghindari merepotkan majikan',vi:'Tự cố gắng sửa để tránh làm phiền chủ',ok:false},
          {zh:'立即停止使用，告知雇主並等待指示，不可擅自決定處理方式',en:'Stop using it immediately, inform the employer, and wait for instructions — do not decide how to handle it yourself',id:'Segera berhenti menggunakan, beritahu majikan, dan tunggu instruksi — jangan memutuskan sendiri cara menanganinya',vi:'Ngừng sử dụng ngay lập tức, thông báo cho chủ và chờ hướng dẫn — không tự quyết định cách xử lý',ok:true},
          {zh:'繼續使用，完成工作後再告知雇主',en:'Continue using it and inform the employer after completing the work',id:'Terus gunakan dan beritahu majikan setelah pekerjaan selesai',vi:'Tiếp tục sử dụng và thông báo cho chủ sau khi hoàn thành công việc',ok:false}],
    fb:{zh:'正確！廚房設備屬於雇主財產，發現故障時應立即停止使用（避免損壞加劇或安全危險），並以誠實、清楚的方式告知雇主，等待雇主決定後續處理方式。自行維修可能造成更大損壞，是不適當的行為。',en:'Correct! Kitchen equipment belongs to the employer. If it breaks down, stop using it immediately (to prevent further damage or safety risks) and inform the employer clearly and honestly. Wait for the employer to decide the next steps. Attempting self-repair risks greater damage.',id:'Benar! Peralatan dapur milik majikan. Jika rusak, segera hentikan penggunaan dan beritahu majikan dengan jujur dan jelas. Tunggu keputusan majikan. Mencoba perbaikan sendiri dapat menyebabkan kerusakan lebih besar.',vi:'Đúng! Thiết bị bếp thuộc tài sản chủ. Nếu bị hỏng, ngừng sử dụng ngay (để tránh hư hỏng thêm hoặc nguy cơ an toàn) và thông báo cho chủ rõ ràng, trung thực. Chờ chủ quyết định bước tiếp theo. Tự sửa có nguy cơ gây hư hỏng lớn hơn.'}},
   {q:{zh:'幫傭如何正確處理「剩菜」或廚餘？',en:'How should a helper correctly handle leftovers and kitchen waste?',id:'Bagaimana pembantu harus menangani sisa makanan dan limbah dapur dengan benar?',vi:'Người giúp việc nên xử lý "thức ăn thừa" và chất thải bếp như thế nào cho đúng?'},
    opts:[{zh:'剩菜直接丟棄以保持廚房整潔',en:'Throw away all leftovers to keep the kitchen clean',id:'Buang semua sisa makanan agar dapur tetap bersih',vi:'Vứt bỏ tất cả thức ăn thừa để giữ bếp sạch sẽ',ok:false},
          {zh:'剩菜應詢問雇主意願後妥善處理，廚餘按家庭規定分類',en:'Ask the employer about leftovers and handle accordingly; sort kitchen waste per household rules',id:'Tanyakan kepada majikan tentang sisa makanan dan tangani sesuai; sortir sampah dapur sesuai aturan rumah tangga',vi:'Hỏi ý kiến chủ về thức ăn thừa rồi xử lý phù hợp; phân loại chất thải bếp theo quy định hộ gia đình',ok:true},
          {zh:'自行帶走所有剩菜，避免浪費',en:'Take all leftovers yourself to avoid waste',id:'Ambil semua sisa makanan sendiri untuk menghindari pemborosan',vi:'Tự lấy tất cả thức ăn thừa để tránh lãng phí',ok:false}],
    fb:{zh:'正確！剩菜的處置是雇主的決定，幫傭不應擅自丟棄或帶走。正確做法：①詢問雇主是否保留剩菜②若保留，應裝入密封容器並標記日期放入冷藏③廚餘（果皮、菜渣等）應按家庭規定或當地法規分類丟棄。處理廚餘的方式也是職業素養的體現。',en:'Correct! What to do with leftovers is the employer\'s decision — helpers should not throw them away or take them without asking. Correct process: ① Ask the employer whether to keep leftovers ② If kept, place in sealed containers with date labels in the fridge ③ Kitchen waste (peels, scraps) should be sorted per household rules or local regulations.',id:'Benar! Keputusan tentang sisa makanan ada pada majikan — pembantu tidak boleh membuang atau mengambilnya tanpa bertanya. Proses yang benar: ① Tanya majikan tentang sisa makanan ② Jika disimpan, masukkan ke wadah tertutup dengan label tanggal di kulkas ③ Sampah dapur harus disortir sesuai aturan.',vi:'Đúng! Quyết định về thức ăn thừa thuộc về chủ — người giúp việc không được tự ý vứt hay lấy đi mà không hỏi. Quy trình đúng: ① Hỏi chủ có giữ thức ăn thừa không ② Nếu giữ, cho vào hộp kín có ghi ngày tháng để tủ lạnh ③ Chất thải bếp (vỏ, bã) phân loại theo quy định hộ gia đình hoặc pháp luật địa phương.'}}
  ],
  /* Lv18 長照餐飲實務 */
  [
   {q:{zh:'長照機構使用的「質地改變飲食」分為幾個等級？',en:'How many levels does the "texture-modified diet" used in long-term care facilities have?',id:'Berapa tingkat "diet modifikasi tekstur" yang digunakan di fasilitas perawatan jangka panjang?',vi:'Chế độ ăn "điều chỉnh kết cấu" được sử dụng trong cơ sở chăm sóc dài hạn có bao nhiêu cấp độ?'},
    opts:[{zh:'2個等級（軟食與流質）',en:'2 levels (soft and liquid)',id:'2 tingkat (lunak dan cair)',vi:'2 cấp độ (mềm và lỏng)',ok:false},
          {zh:'國際上通常採用 IDDSI 7個等級（0–7）',en:'Internationally IDDSI uses 7 levels (0–7)',id:'IDDSI internasional menggunakan 7 tingkat (0–7)',vi:'Quốc tế dùng IDDSI với 7 cấp độ (0–7)',ok:true},
          {zh:'只有泥狀與正常兩種選擇',en:'Only two choices: purée or normal',id:'Hanya dua pilihan: pure atau normal',vi:'Chỉ hai lựa chọn: nghiền và bình thường',ok:false}],
    fb:{zh:'正確！IDDSI（國際吞嚥障礙飲食標準化倡議）將食物質地分為 0（稀流質）到 7（正常飲食）共 8 個等級。在長照環境中，根據個案的吞嚥能力選擇適當等級，既能確保安全，又能維持進食尊嚴與營養攝取。',en:'Correct! IDDSI (International Dysphagia Diet Standardization Initiative) classifies food textures from level 0 (thin liquids) to level 7 (regular food) — 8 levels total. In long-term care, the appropriate level is chosen based on the individual\'s swallowing ability, balancing safety, dignity, and nutrition.',id:'Benar! IDDSI mengklasifikasikan tekstur makanan dari level 0 (cairan encer) hingga 7 (makanan biasa) — 8 level. Dalam perawatan jangka panjang, level yang sesuai dipilih berdasarkan kemampuan menelan individu.',vi:'Đúng! IDDSI phân loại kết cấu thực phẩm từ cấp 0 (lỏng loãng) đến cấp 7 (thức ăn bình thường) — 8 cấp. Trong chăm sóc dài hạn, cấp phù hợp được chọn dựa trên khả năng nuốt của từng người.'}},
   {q:{zh:'製作「泥狀餐（Level 4）」時，食材必須達到什麼標準？',en:'When making "purée meals (Level 4)", what standard must the food meet?',id:'Saat membuat "makanan pure (Level 4)", standar apa yang harus dipenuhi?',vi:'Khi làm "cơm nghiền (Level 4)", thực phẩm phải đạt tiêu chuẩn gì?'},
    opts:[{zh:'用舌頭可以壓扁，但還有明顯顆粒感',en:'Can be mashed with tongue, but still has noticeable lumps',id:'Bisa dilumatkan dengan lidah, tapi masih ada gumpalan',vi:'Có thể nghiền bằng lưỡi nhưng vẫn còn các cục rõ ràng',ok:false},
          {zh:'質地均勻光滑，無顆粒、無纖維、不分層、以湯匙盛取時能保持形狀',en:'Smooth and homogenous, no lumps or fibres, no separation, holds shape on a spoon',id:'Halus dan homogen, tanpa gumpalan atau serat, tidak terpisah, mempertahankan bentuk di sendok',vi:'Mịn đồng nhất, không có cục hoặc sợi, không tách lớp, giữ hình dạng trên thìa',ok:true},
          {zh:'可以用叉子壓扁，保留部分食材原形',en:'Can be mashed with a fork, retaining some original food shapes',id:'Bisa ditekan dengan garpu, mempertahankan beberapa bentuk asli',vi:'Có thể nghiền bằng dĩa, giữ một phần hình dạng ban đầu',ok:false}],
    fb:{zh:'正確！IDDSI Level 4 泥狀食物標準：質地均勻、光滑無顆粒、無纖維、不會分層或流動、以湯匙舀起可保持形狀。製作時應使用食物調理機完全打勻，必要時過濾網篩，確保無任何顆粒，以防吞嚥時嗆咳。',en:'Correct! IDDSI Level 4 purée standard: smooth and homogenous, no lumps or fibres, does not flow or separate, holds shape on a spoon. Use a food processor to blend completely, strain through a sieve if needed, to ensure no particles and prevent aspiration.',id:'Benar! Standar pure IDDSI Level 4: halus dan homogen, tanpa gumpalan atau serat, tidak mengalir atau terpisah, mempertahankan bentuk di sendok. Gunakan food processor dan saring jika perlu.',vi:'Đúng! Tiêu chuẩn cơm nghiền IDDSI Level 4: mịn đồng nhất, không có cục hay sợi, không chảy hay tách lớp, giữ hình trên thìa. Dùng máy xay và lọc qua rây để đảm bảo không có hạt, tránh sặc.'}},
   {q:{zh:'糖尿病患者的飲食中，下列哪種主食的升糖指數（GI值）最低，最適合食用？',en:'Among the following staple foods, which has the lowest glycemic index (GI) and is most suitable for diabetics?',id:'Di antara makanan pokok berikut, mana yang memiliki indeks glikemik (GI) terendah dan paling cocok untuk penderita diabetes?',vi:'Trong các loại tinh bột sau, loại nào có chỉ số đường huyết (GI) thấp nhất và phù hợp nhất cho người tiểu đường?'},
    opts:[{zh:'白米飯（GI約72）',en:'White rice (GI ~72)',id:'Nasi putih (GI ~72)',vi:'Cơm trắng (GI ~72)',ok:false},
          {zh:'糙米（GI約55）或藜麥（GI約35）',en:'Brown rice (GI ~55) or quinoa (GI ~35)',id:'Beras merah (GI ~55) atau quinoa (GI ~35)',vi:'Gạo lứt (GI ~55) hoặc quinoa (GI ~35)',ok:true},
          {zh:'白吐司（GI約75）',en:'White toast (GI ~75)',id:'Roti tawar putih (GI ~75)',vi:'Bánh mì trắng (GI ~75)',ok:false}],
    fb:{zh:'正確！升糖指數（GI）衡量食物升高血糖的速度：GI≥70為高、56–69為中、≤55為低。糖尿病患者應優先選擇低GI食物如糙米、藜麥、地瓜、燕麥，並搭配蛋白質與蔬菜，延緩血糖上升速度。份量控制同樣重要。',en:'Correct! GI measures how fast food raises blood sugar: GI≥70 is high, 56–69 medium, ≤55 low. Diabetics should prioritize low-GI foods like brown rice, quinoa, sweet potato, oats, and pair them with protein and vegetables to slow blood sugar rise. Portion control is equally important.',id:'Benar! GI mengukur seberapa cepat makanan menaikkan gula darah: GI≥70 tinggi, 56-69 sedang, ≤55 rendah. Penderita diabetes harus memprioritaskan makanan GI rendah seperti beras merah, quinoa, ubi jalar.',vi:'Đúng! GI đo tốc độ tăng đường huyết: GI≥70 cao, 56-69 trung bình, ≤55 thấp. Người tiểu đường nên ưu tiên thực phẩm GI thấp như gạo lứt, quinoa, khoai lang, kết hợp với đạm và rau để làm chậm tăng đường.'}},
   {q:{zh:'腎臟病患者飲食中，最需要嚴格限制哪三種礦物質？',en:'In a renal diet, which three minerals must be most strictly controlled?',id:'Dalam diet ginjal, tiga mineral mana yang harus dikontrol paling ketat?',vi:'Trong chế độ ăn thận, ba khoáng chất nào cần kiểm soát chặt chẽ nhất?'},
    opts:[{zh:'鈣、鎂、鋅',en:'Calcium, magnesium, zinc',id:'Kalsium, magnesium, seng',vi:'Canxi, magiê, kẽm',ok:false},
          {zh:'鉀、磷、鈉（鹽分）',en:'Potassium, phosphorus, sodium (salt)',id:'Kalium, fosfor, natrium (garam)',vi:'Kali, phốt-pho, natri (muối)',ok:true},
          {zh:'鐵、碘、硒',en:'Iron, iodine, selenium',id:'Besi, yodium, selenium',vi:'Sắt, iốt, selen',ok:false}],
    fb:{zh:'正確！腎臟功能受損時，無法有效排除鉀（高血鉀會導致心律不整）、磷（高血磷會造成骨骼與血管鈣化）、鈉（導致水腫與高血壓）。腎臟病餐飲需依個別抽血數據調整，並諮詢腎臟科醫師與腎臟病衛教師。常見高鉀食物：香蕉、柳橙、番茄；高磷食物：乳製品、堅果、加工肉品。',en:'Correct! Damaged kidneys cannot effectively excrete potassium (high potassium causes arrhythmia), phosphorus (high phosphorus causes bone/vessel calcification), and sodium (causes edema and hypertension). Renal diet must be adjusted per individual lab values in consultation with a nephrologist. High-K foods: banana, orange, tomato; high-P: dairy, nuts, processed meat.',id:'Benar! Ginjal yang rusak tidak dapat membuang kalium (menyebabkan aritmia jantung), fosfor (kalsifikasi tulang/pembuluh darah), dan natrium (edema dan hipertensi). Diet ginjal harus disesuaikan dengan nilai lab individu.',vi:'Đúng! Thận tổn thương không thể bài tiết hiệu quả kali (gây rối loạn nhịp tim), phốt-pho (canxi hóa xương và mạch máu), và natri (phù nề và tăng huyết áp). Chế độ ăn thận phải điều chỉnh theo kết quả xét nghiệm của từng người.'}},
   {q:{zh:'為吞嚥困難（吞嚥障礙）的長者增稠液體時，最常使用哪種增稠劑？',en:'When thickening liquids for seniors with dysphagia, what thickener is most commonly used?',id:'Saat mengentalkan cairan untuk lansia dengan disfagia, pengental apa yang paling umum digunakan?',vi:'Khi làm đặc chất lỏng cho người cao tuổi bị khó nuốt, loại chất làm đặc nào phổ biến nhất?'},
    opts:[{zh:'玉米澱粉（加熱後才會增稠）',en:'Corn starch (only thickens when heated)',id:'Tepung maizena (hanya mengental saat dipanaskan)',vi:'Bột ngô (chỉ đặc lại khi đun nóng)',ok:false},
          {zh:'商業增稠粉（黃原膠或澱粉基底，可冷熱使用）',en:'Commercial thickening powder (xanthan gum or starch-based, works hot or cold)',id:'Bubuk pengental komersial (xanthan gum atau berbasis pati, bisa digunakan panas atau dingin)',vi:'Bột làm đặc thương mại (xanthan gum hoặc tinh bột, dùng được cả nóng lẫn lạnh)',ok:true},
          {zh:'食鹽（高濃度鹽水會增加黏稠度）',en:'Salt (high-concentration salt water increases viscosity)',id:'Garam (air garam konsentrasi tinggi meningkatkan viskositas)',vi:'Muối (nước muối nồng độ cao tăng độ nhớt)',ok:false}],
    fb:{zh:'正確！商業增稠粉（含黃原膠或改性澱粉）是長照環境中最安全、最便捷的液體增稠工具。可加入水、果汁、牛奶等各種液體，冷熱皆可使用，且稠度穩定不易分離。使用前需依產品說明與醫師或語言治療師指示，達到目標IDDSI等級（如Level 1–3稀釋至濃稠流質）。',en:'Correct! Commercial thickening powder (xanthan gum or modified starch) is the safest and most convenient thickening tool in long-term care. It works in water, juice, milk, and other liquids — hot or cold — with stable viscosity. Use per product instructions and guidance from a physician or speech-language pathologist to reach the target IDDSI level.',id:'Benar! Bubuk pengental komersial adalah alat pengental cairan yang paling aman dan nyaman dalam perawatan jangka panjang. Bekerja dalam air, jus, susu — panas atau dingin — dengan viskositas stabil.',vi:'Đúng! Bột làm đặc thương mại là công cụ làm đặc chất lỏng an toàn và tiện lợi nhất trong chăm sóc dài hạn. Dùng được cho nước, nước hoa quả, sữa — nóng hay lạnh — với độ nhớt ổn định. Dùng theo hướng dẫn sản phẩm và chỉ định của bác sĩ hoặc nhà trị liệu ngôn ngữ.'}},
   {q:{zh:'為慢性腎臟病患者準備蔬菜時，為什麼要先「煮水去鉀」再烹調？',en:'When preparing vegetables for CKD patients, why is "boiling to remove potassium" done before cooking?',id:'Saat menyiapkan sayuran untuk pasien PGK, mengapa "merebus untuk menghilangkan kalium" dilakukan sebelum memasak?',vi:'Khi chuẩn bị rau cho bệnh nhân CKD, tại sao phải "chần để loại bỏ kali" trước khi nấu?'},
    opts:[{zh:'讓蔬菜顏色更鮮豔',en:'Makes vegetables look more vibrant',id:'Membuat sayuran terlihat lebih cerah',vi:'Làm rau có màu sắc tươi hơn',ok:false},
          {zh:'鉀溶於水，煮水棄湯可減少蔬菜中約30–50%的鉀含量',en:'Potassium dissolves in water; boiling and discarding the water reduces vegetable potassium by ~30–50%',id:'Kalium larut dalam air; merebus dan membuang air mengurangi kalium sayuran ~30-50%',vi:'Kali tan trong nước; chần và bỏ nước đi giảm kali trong rau khoảng 30–50%',ok:true},
          {zh:'破壞蔬菜中的草酸，防止結石',en:'Destroys oxalic acid in vegetables to prevent kidney stones',id:'Menghancurkan asam oksalat dalam sayuran untuk mencegah batu ginjal',vi:'Phá hủy axit oxalic trong rau để ngăn sỏi thận',ok:false}],
    fb:{zh:'正確！「煮水去鉀法」：蔬菜切小丁後以大量清水煮沸5–10分鐘，棄湯瀝乾再烹調，可去除約30–50%的鉀。這是腎臟病飲食管理的重要技術，但不同蔬菜去鉀效果有別，需依營養師建議操作。根莖類（馬鈴薯、芋頭）也應先去皮切薄片泡水後再煮水去鉀。',en:'Correct! "Boiling to leach potassium": dice vegetables and boil in plenty of water for 5–10 minutes, discard the water and drain before cooking — removes ~30–50% potassium. This is a key technique in renal diet management. Effectiveness varies by vegetable; follow the dietitian\'s guidance. Root vegetables (potato, taro) should also be peeled, sliced thin, soaked in water, then boiled.',id:'Benar! "Merebus untuk melarutkan kalium": potong dadu sayuran dan rebus dalam banyak air selama 5-10 menit, buang air dan tiriskan sebelum memasak — menghilangkan ~30-50% kalium.',vi:'Đúng! "Chần để loại bỏ kali": thái nhỏ rau và đun trong nhiều nước 5–10 phút, bỏ nước đi và để ráo trước khi nấu — loại bỏ khoảng 30–50% kali. Đây là kỹ thuật quan trọng trong quản lý chế độ ăn thận. Hiệu quả khác nhau theo loại rau; làm theo hướng dẫn của chuyên gia dinh dưỡng.'}},
   {q:{zh:'長照餐飲製備中，「碎食餐（Minced & Moist，Level 5）」的特徵是？',en:'In long-term care food prep, what are the characteristics of "minced & moist diet (Level 5)"?',id:'Dalam persiapan makanan perawatan jangka panjang, apa karakteristik "makanan cincang & lembab (Level 5)"?',vi:'Trong chế biến thực phẩm chăm sóc dài hạn, đặc điểm của "chế độ ăn xay nhỏ & ẩm (Level 5)" là gì?'},
    opts:[{zh:'完全打成光滑泥狀，不保留任何食材形狀',en:'Completely blended to smooth purée with no original food shapes remaining',id:'Sepenuhnya diblender menjadi pure halus tanpa bentuk makanan asli yang tersisa',vi:'Xay hoàn toàn thành dạng nghiền mịn, không còn hình dạng gốc',ok:false},
          {zh:'食材切碎至4mm以下，質地柔軟濕潤，不需用力咀嚼，容易成型成糰',en:'Food cut to pieces ≤4mm, soft and moist in texture, requires minimal chewing, easily coheres into a bolus',id:'Makanan dipotong ≤4mm, tekstur lembut dan lembab, membutuhkan sedikit mengunyah, mudah membentuk bolus',vi:'Thực phẩm cắt nhỏ ≤4mm, kết cấu mềm và ẩm, ít cần nhai, dễ kết thành một khối',ok:true},
          {zh:'食材切成2–4公分大小的塊狀，以叉子壓得扁',en:'Food cut into 2–4 cm pieces that can be mashed with a fork',id:'Makanan dipotong menjadi potongan 2-4 cm yang bisa dilumatkan dengan garpu',vi:'Thực phẩm cắt thành miếng 2–4 cm có thể nghiền bằng dĩa',ok:false}],
    fb:{zh:'正確！IDDSI Level 5 碎食餐：食物切碎至4毫米以下，必須柔軟、濕潤、能夠黏合在一起（不散碎），吞嚥時不需大力咀嚼，適合牙齒缺失、咀嚼力弱但吞嚥功能尚可的長者。食物應避免混合不同質地（如湯中有大塊），防止嗆咳。',en:'Correct! IDDSI Level 5 minced & moist: food chopped to ≤4mm, soft, moist, and cohesive (does not crumble), requires minimal chewing before swallowing. Suitable for seniors with missing teeth or weak chewing but adequate swallowing. Avoid mixing textures (e.g., chunky solids in soup) to prevent aspiration.',id:'Benar! IDDSI Level 5 makanan cincang: makanan dipotong ≤4mm, lembut, lembab, dan kohesif, membutuhkan sedikit mengunyah. Cocok untuk lansia dengan gigi yang hilang atau mengunyah lemah.',vi:'Đúng! IDDSI Level 5 thức ăn xay nhỏ: thực phẩm cắt ≤4mm, mềm, ẩm và kết dính (không vụn), ít cần nhai trước khi nuốt. Phù hợp với người cao tuổi mất răng hoặc nhai yếu nhưng vẫn nuốt được. Tránh trộn lẫn các kết cấu khác nhau để phòng sặc.'}}
  ],
  /* Lv19 外籍幫傭廚房溝通 */
  [
   {q:{zh:'當雇主用中文口頭交代料理任務，但幫傭聽不懂某個詞時，最專業的處理方式是？',en:'When an employer gives verbal cooking instructions in Chinese and the helper doesn\'t understand a word, what is the most professional approach?',id:'Ketika majikan memberikan instruksi memasak lisan dalam bahasa Mandarin dan pembantu tidak mengerti suatu kata, apa pendekatan paling profesional?',vi:'Khi chủ đưa ra hướng dẫn nấu ăn bằng tiếng Trung và người giúp việc không hiểu một từ, cách tiếp cận chuyên nghiệp nhất là gì?'},
    opts:[{zh:'假裝聽懂，依自己的理解去做，不要讓雇主發現',en:'Pretend to understand and act on your own interpretation without letting the employer know',id:'Pura-pura mengerti dan bertindak berdasarkan interpretasi sendiri tanpa memberitahu majikan',vi:'Giả vờ hiểu và hành động theo cách hiểu của mình mà không cho chủ biết',ok:false},
          {zh:'立刻誠實說「不好意思，請問這個詞是什麼意思？可以再說一遍嗎？」或請雇主寫下來或比手勢說明',en:'Honestly say immediately "Sorry, what does that word mean? Could you repeat it?" or ask the employer to write it down or demonstrate',id:'Segera jujur berkata "Maaf, apa arti kata itu? Bisa diulangi?" atau minta majikan menuliskannya atau memberikan isyarat',vi:'Ngay lập tức thành thật nói "Xin lỗi, từ đó có nghĩa là gì? Có thể nói lại không?" hoặc yêu cầu chủ viết ra hoặc ra hiệu',ok:true},
          {zh:'等到料理做完，若雇主不滿意再問清楚',en:'Wait until the dish is done; if the employer is unsatisfied, then ask for clarification',id:'Tunggu sampai hidangan selesai; jika majikan tidak puas, baru minta klarifikasi',vi:'Đợi đến khi món ăn xong; nếu chủ không hài lòng thì mới hỏi lại',ok:false}],
    fb:{zh:'正確！「不懂就問」是廚房工作中最重要的溝通原則之一。假裝聽懂可能導致料理失誤、食材浪費、甚至食安問題（如過敏食材處理錯誤）。誠實提問不僅不失禮，反而展現責任感與專業態度。建議準備一本中文常用廚房詞彙筆記本，逐漸積累理解。',en:'Correct! "Ask when in doubt" is one of the most important communication principles in kitchen work. Pretending to understand can lead to cooking mistakes, food waste, or even safety issues (e.g. mishandling allergens). Asking honestly is not impolite — it shows responsibility and professionalism. Keep a notebook of common Chinese kitchen vocabulary to build understanding over time.',id:'Benar! "Tanya jika tidak mengerti" adalah prinsip komunikasi terpenting dalam pekerjaan dapur. Pura-pura mengerti dapat menyebabkan kesalahan memasak, pemborosan bahan, atau bahkan masalah keamanan. Bertanya dengan jujur bukan tidak sopan — itu menunjukkan tanggung jawab.',vi:'Đúng! "Hỏi khi không hiểu" là một trong những nguyên tắc giao tiếp quan trọng nhất trong công việc bếp. Giả vờ hiểu có thể dẫn đến sai sót nấu ăn, lãng phí thực phẩm, hoặc vấn đề an toàn (như xử lý nhầm thực phẩm gây dị ứng). Hỏi thẳng thắn không phải là vô lễ — đó thể hiện trách nhiệm và chuyên nghiệp.'}},
   {q:{zh:'看到菜單上寫「清蒸檸檬魚」，幫傭應如何理解這道菜的烹調方式？',en:'When the menu says "steamed lemon fish", how should a helper understand the cooking method?',id:'Ketika menu menuliskan "ikan lemon kukus", bagaimana pembantu harus memahami metode memasaknya?',vi:'Khi thực đơn ghi "cá hấp chanh", người giúp việc nên hiểu phương pháp nấu như thế nào?'},
    opts:[{zh:'先油炸魚，再淋上檸檬汁',en:'Deep-fry the fish first, then drizzle with lemon juice',id:'Goreng ikan terlebih dahulu, lalu siram dengan jus lemon',vi:'Chiên cá trước rồi rưới nước cốt chanh',ok:false},
          {zh:'以蒸的方式烹調整條魚，上桌前或烹調時加入檸檬調味',en:'Steam the whole fish; add lemon for flavor during cooking or before serving',id:'Kukus ikan utuh; tambahkan lemon untuk rasa saat memasak atau sebelum disajikan',vi:'Hấp nguyên con cá; thêm chanh để tạo vị khi nấu hoặc trước khi phục vụ',ok:true},
          {zh:'用平底鍋加油煎魚，搭配檸檬角',en:'Pan-fry the fish in oil, served with lemon wedges',id:'Goreng ikan dengan minyak di wajan datar, disajikan dengan irisan lemon',vi:'Chiên cá bằng chảo có dầu, kèm múi chanh',ok:false}],
    fb:{zh:'正確！菜單閱讀關鍵詞解析：「清蒸」= 以水蒸氣蒸熟，不加油、不煎炸，是保留食材原味與營養的烹調法。「檸檬魚」= 配合檸檬調味的魚料理。常見菜單烹調詞彙：紅燒=醬油滷汁燉煮、炒=快炒、燜=加蓋中小火燜熟、涼拌=不加熱拌醬料。積累這些關鍵詞是閱讀菜單的基礎。',en:'Correct! Menu reading key terms: 清蒸 (qīng zhēng) = steamed with no oil or frying, preserving natural flavor and nutrients. 檸檬魚 = fish dish with lemon flavor. Common cooking terms: 紅燒 = braised in soy sauce, 炒 = stir-fried, 燜 = covered low-heat braising, 涼拌 = cold-dressed without heat. Building this vocabulary is fundamental to reading menus.',id:'Benar! Kata kunci membaca menu: 清蒸 = dikukus tanpa minyak, mempertahankan rasa alami. 檸檬魚 = hidangan ikan dengan rasa lemon. Istilah memasak umum: 紅燒 = dimasak dalam saus kecap, 炒 = ditumis, 燜 = dimasak tertutup api kecil.',vi:'Đúng! Từ khóa đọc thực đơn: 清蒸 = hấp không dầu, giữ vị tự nhiên. 檸檬魚 = món cá với hương chanh. Từ nấu ăn phổ biến: 紅燒 = kho nước tương, 炒 = xào, 燜 = ninh kín lửa nhỏ, 涼拌 = trộn không gia nhiệt.'}},
   {q:{zh:'雇主給了一張採購清單，上面寫「老薑2塊、蔥1把、豆腐1盒、花椰菜1顆」，下列哪項採購回來最可能是「花椰菜」？',en:'The employer gives a shopping list: "2 pieces old ginger, 1 bunch scallions, 1 box tofu, 1 head cauliflower/broccoli". Which is most likely "花椰菜"?',id:'Majikan memberikan daftar belanja: "2 potong jahe tua, 1 ikat daun bawang, 1 kotak tahu, 1 kepala kembang kol/brokoli". Mana yang paling mungkin "花椰菜"?',vi:'Chủ đưa danh sách mua sắm: "2 miếng gừng già, 1 bó hành lá, 1 hộp đậu phụ, 1 cây súp lơ". Cái nào nhiều khả năng là "花椰菜"?'},
    opts:[{zh:'大蒜（整顆白色球狀蒜頭）',en:'Garlic (whole white bulb)',id:'Bawang putih (umbi putih utuh)',vi:'Tỏi (củ trắng tròn)',ok:false},
          {zh:'白花椰菜（白色密集花球）或青花椰（綠色花球，即「綠花菜」）',en:'White cauliflower (dense white florets) or broccoli (green florets, also called "green cauliflower")',id:'Kembang kol putih (kuntum putih padat) atau brokoli (kuntum hijau)',vi:'Súp lơ trắng (bông trắng dày) hoặc súp lơ xanh (bông xanh)',ok:true},
          {zh:'高麗菜（圓形、層狀葉片）',en:'Cabbage (round, layered leaves)',id:'Kubis (bulat, berlapis-lapis)',vi:'Bắp cải (tròn, có nhiều lớp lá)',ok:false}],
    fb:{zh:'正確！「花椰菜」是台灣對「花椰菜科」蔬菜的通稱：白花椰菜（白色）和青花椰菜/綠花菜（綠色，即西蘭花/Broccoli）。採購時若清單未指定顏色，應詢問雇主。辨認技巧：花球狀緊密小顆粒狀花朵、短莖粗壯。這類問題在採買清單溝通中很常見，不確定時立即詢問勝過買錯食材。',en:'Correct! "花椰菜" is the general term in Taiwan for cauliflower family vegetables: white cauliflower and 青花椰菜/brocoli (broccoli/Western broccoli). If the list doesn\'t specify the color, ask the employer. Recognition tip: dense compact florets, short thick stem. These questions are common when shopping — asking immediately beats buying the wrong item.',id:'Benar! "花椰菜" adalah istilah umum di Taiwan untuk sayuran keluarga kembang kol: kembang kol putih dan brokoli. Jika daftar tidak menentukan warna, tanya majikan.',vi:'Đúng! "花椰菜" là tên chung ở Đài Loan cho rau họ súp lơ: súp lơ trắng và bông cải xanh (broccoli). Nếu danh sách không chỉ rõ màu sắc, hãy hỏi chủ. Mẹo nhận biết: bông hoa dày đặc, cuống ngắn và dày.'}},
   {q:{zh:'食品包裝上的過敏原標示，台灣法規規定哪些是必須強制標示的「特定過敏原」？',en:'For allergen labeling on food packaging, which are "specified allergens" that must be mandatorily labeled under Taiwan regulations?',id:'Untuk pelabelan alergen pada kemasan makanan, mana yang merupakan "alergen tertentu" yang wajib dilabeli berdasarkan peraturan Taiwan?',vi:'Đối với nhãn chất gây dị ứng trên bao bì thực phẩm, đâu là "chất gây dị ứng xác định" phải được ghi bắt buộc theo quy định Đài Loan?'},
    opts:[{zh:'只有花生和蝦子',en:'Only peanuts and shrimp',id:'Hanya kacang tanah dan udang',vi:'Chỉ có lạc và tôm',ok:false},
          {zh:'包含甲殼類、蛋、魚、奶、花生、大豆、堅果類、芒果、芝麻、蕎麥及亞硫酸鹽等11大類',en:'Includes crustaceans, eggs, fish, milk, peanuts, soybeans, tree nuts, mango, sesame, buckwheat, and sulfites — 11 categories',id:'Termasuk krustasea, telur, ikan, susu, kacang tanah, kedelai, kacang pohon, mangga, wijen, soba, dan sulfit — 11 kategori',vi:'Bao gồm giáp xác, trứng, cá, sữa, lạc, đậu nành, hạt cây, xoài, mè, kiều mạch và sulfit — 11 loại',ok:true},
          {zh:'只有麩質（小麥）和乳製品',en:'Only gluten (wheat) and dairy',id:'Hanya gluten (gandum) dan susu',vi:'Chỉ có gluten (lúa mì) và sữa',ok:false}],
    fb:{zh:'正確！台灣食品安全衛生管理法規定，含特定過敏原成分的食品必須在包裝上清楚標示。主要11大類：①甲殼類②蛋③魚④奶⑤花生⑥大豆⑦堅果⑧芒果⑨芝麻⑩蕎麥⑪亞硫酸鹽（超過10ppm）。幫傭在採購與備料時，應養成閱讀過敏原標示的習慣，確認家中成員是否有相關過敏，避免誤用。',en:'Correct! Taiwan\'s Food Safety Regulations require food products containing specified allergens to be clearly labeled. The 11 main categories: ① crustaceans ② eggs ③ fish ④ milk ⑤ peanuts ⑥ soybeans ⑦ tree nuts ⑧ mango ⑨ sesame ⑩ buckwheat ⑪ sulfites (>10ppm). Helpers should make reading allergen labels a habit when shopping and prepping.',id:'Benar! Peraturan Keamanan Pangan Taiwan mewajibkan pelabelan jelas untuk produk yang mengandung alergen tertentu. 11 kategori utama: ① krustasea ② telur ③ ikan ④ susu ⑤ kacang tanah ⑥ kedelai ⑦ kacang pohon ⑧ mangga ⑨ wijen ⑩ soba ⑪ sulfit.',vi:'Đúng! Quy định An toàn Thực phẩm Đài Loan yêu cầu ghi nhãn rõ ràng cho sản phẩm chứa chất gây dị ứng xác định. 11 loại chính: ① giáp xác ② trứng ③ cá ④ sữa ⑤ lạc ⑥ đậu nành ⑦ hạt cây ⑧ xoài ⑨ mè ⑩ kiều mạch ⑪ sulfit.'}},
   {q:{zh:'幫傭在超市看到一個食材，標籤上寫「效期 2024/12/31」，現在是 2025/01/05，這個食材應該怎麼辦？',en:'A helper sees a product at the supermarket labeled "Best before 2024/12/31"; today is 2025/01/05. What should be done?',id:'Pembantu melihat produk di supermarket berlabel "Kadaluarsa 2024/12/31"; hari ini 2025/01/05. Apa yang harus dilakukan?',vi:'Người giúp việc thấy sản phẩm tại siêu thị ghi "HSD 2024/12/31", hôm nay là 2025/01/05. Nên làm gì?'},
    opts:[{zh:'只差幾天問題不大，可以購買，回家盡快使用',en:'Only a few days over, no big deal — buy it and use quickly at home',id:'Hanya beberapa hari lewat, tidak masalah — beli dan gunakan segera di rumah',vi:'Chỉ hơn vài ngày, không sao — mua về và dùng ngay',ok:false},
          {zh:'不應購買，效期已過的食品可能有食安疑慮，應選擇效期內的商品',en:'Do not buy it — expired products may pose food safety risks; choose one within its validity date',id:'Jangan beli — produk kadaluarsa mungkin menimbulkan risiko keamanan pangan; pilih yang masih dalam masa berlaku',vi:'Không nên mua — sản phẩm hết hạn có thể gây rủi ro an toàn thực phẩm; chọn sản phẩm còn hạn',ok:true},
          {zh:'看外觀和氣味，若正常就可以買',en:'Check appearance and smell; if normal, it\'s fine to buy',id:'Periksa penampilan dan bau; jika normal, aman untuk dibeli',vi:'Kiểm tra ngoại quan và mùi; nếu bình thường thì mua được',ok:false}],
    fb:{zh:'正確！「效期（保存期限）」是廠商保證食品品質與安全的最後日期，過期後不論外觀或氣味是否正常，均不應購買或食用。細菌與有害物質的積累不一定有明顯氣味或外觀變化。幫傭採購時應養成「先看效期，再看外觀」的習慣，並在預算內選擇效期最長的商品。回報給雇主決定是否購買折扣品也是專業態度。',en:'Correct! The "best before" or "expiry date" is the manufacturer\'s guarantee of food quality and safety. Once expired, do not buy or consume regardless of appearance or smell — bacterial accumulation or harmful substances may not be obvious. Helpers should make "check date first, then look" a shopping habit and choose products with the longest remaining shelf life within budget.',id:'Benar! "Tanggal kadaluarsa" adalah jaminan produsen tentang kualitas dan keamanan pangan. Setelah kadaluarsa, jangan beli atau konsumsi terlepas dari penampilan atau bau — akumulasi bakteri mungkin tidak terlihat atau tercium.',vi:'Đúng! "Hạn sử dụng" là cam kết của nhà sản xuất về chất lượng và an toàn thực phẩm. Sau khi hết hạn, không mua hay ăn bất kể ngoại quan hay mùi — sự tích tụ vi khuẩn có thể không rõ ràng. Người giúp việc nên tập thói quen "xem hạn trước, rồi nhìn ngoại quan".'}},
   {q:{zh:'雇主說「幫我準備晚餐，要有『主食、主菜、副菜、湯』」，以下哪個組合最符合？',en:'The employer says "please prepare dinner with \'a staple, a main dish, a side dish, and soup\'". Which combination fits best?',id:'Majikan berkata "tolong siapkan makan malam dengan \'makanan pokok, hidangan utama, lauk, dan sup\'". Kombinasi mana yang paling sesuai?',vi:'Chủ nói "làm tối với \'tinh bột chính, món chính, món phụ và súp\'". Tổ hợp nào phù hợp nhất?'},
    opts:[{zh:'白米飯＋水煮蛋＋泡麵＋生菜',en:'White rice + boiled egg + instant noodles + raw lettuce',id:'Nasi putih + telur rebus + mi instan + selada mentah',vi:'Cơm trắng + trứng luộc + mì gói + rau sống',ok:false},
          {zh:'白米飯（主食）＋清蒸魚（主菜）＋炒青菜（副菜）＋蘿蔔排骨湯（湯）',en:'White rice (staple) + steamed fish (main) + stir-fried vegetables (side) + radish spare-rib soup (soup)',id:'Nasi putih (pokok) + ikan kukus (utama) + sayuran tumis (lauk) + sup tulang iga lobak (sup)',vi:'Cơm trắng (tinh bột) + cá hấp (chính) + rau xào (phụ) + canh xương sườn củ cải (canh)',ok:true},
          {zh:'麵包＋炸薯條＋可樂＋沙拉',en:'Bread + fried fries + cola + salad',id:'Roti + kentang goreng + kola + salad',vi:'Bánh mì + khoai tây chiên + nước ngọt + salad',ok:false}],
    fb:{zh:'正確！理解菜單結構是幫傭廚房溝通的基礎：①主食 = 米飯、麵食、地瓜等碳水化合物來源②主菜 = 含蛋白質的核心料理（魚、肉、蛋、豆腐）③副菜 = 蔬菜料理（可一至二道）④湯 = 湯品（清湯、濃湯、煮湯）。台灣傳統家庭餐以此四元素為基本結構，理解後可幫助幫傭有效規劃菜單、採購清單與烹調順序。',en:'Correct! Understanding menu structure is fundamental to kitchen communication: ① staple = rice, noodles, sweet potato (carb source) ② main dish = protein-centered dish (fish, meat, eggs, tofu) ③ side dish = vegetable dish (one or two) ④ soup = soup course. This 4-element structure is the standard for traditional Taiwanese family meals, helping helpers plan menus, shopping lists, and cooking order.',id:'Benar! Memahami struktur menu adalah dasar komunikasi dapur: ① makanan pokok = nasi, mie, ubi jalar ② hidangan utama = hidangan berbasis protein ③ lauk = hidangan sayuran ④ sup = sup.',vi:'Đúng! Hiểu cấu trúc thực đơn là nền tảng giao tiếp bếp núc: ① tinh bột chính = cơm, mì, khoai lang ② món chính = món tập trung vào đạm ③ món phụ = món rau ④ canh = súp. Cấu trúc 4 yếu tố này là chuẩn bữa ăn gia đình Đài Loan truyền thống.'}},
   {q:{zh:'以下哪個廚房術語配對「中文→英文」是正確的？',en:'Which of the following "Chinese → English" kitchen vocabulary pairs is correct?',id:'Mana dari pasangan kosakata dapur "Mandarin → Inggris" berikut yang benar?',vi:'Cặp từ vựng bếp núc "Tiếng Trung → Tiếng Anh" nào sau đây đúng?'},
    opts:[{zh:'焯水=Bake、翻炒=Steam、醃漬=Fry',en:'焯水=Bake, 翻炒=Steam, 醃漬=Fry',id:'焯水=Panggang, 翻炒=Kukus, 醃漬=Goreng',vi:'焯水=Nướng, 翻炒=Hấp, 醃漬=Chiên',ok:false},
          {zh:'焯水=Blanch、翻炒=Stir-fry、醃漬=Marinate',en:'焯水=Blanch, 翻炒=Stir-fry, 醃漬=Marinate',id:'焯水=Blanch, 翻炒=Stir-fry, 醃漬=Marinate',vi:'焯水=Blanch, 翻炒=Stir-fry, 醃漬=Marinate',ok:true},
          {zh:'焯水=Roast、翻炒=Boil、醃漬=Grill',en:'焯水=Roast, 翻炒=Boil, 醃漬=Grill',id:'焯水=Panggang, 翻炒=Rebus, 醃漬=Bakar',vi:'焯水=Nướng lò, 翻炒=Luộc, 醃漬=Nướng',ok:false}],
    fb:{zh:'正確！常用廚房中英術語對照：焯水=Blanch（短時間熱水燙過）、翻炒=Stir-fry（大火快炒）、醃漬=Marinate（浸泡入味）、燉=Braise/Stew（長時間小火燜煮）、蒸=Steam（水蒸氣加熱）、炸=Deep-fry（高溫油炸）、煎=Pan-fry（少油中火煎）、烤=Roast/Bake（烤箱或炭烤）。外籍幫傭建議製作個人廚房術語雙語卡片，隨身攜帶查閱。',en:'Correct! Common kitchen vocabulary: 焯水=Blanch (briefly parboil), 翻炒=Stir-fry (high heat quick toss), 醃漬=Marinate (soak for flavor), 燉=Braise/Stew (low heat slow cook), 蒸=Steam, 炸=Deep-fry, 煎=Pan-fry, 烤=Roast/Bake. Foreign helpers are advised to make personal bilingual kitchen vocabulary cards to carry and reference.',id:'Benar! Kosakata dapur umum: 焯水=Blanch, 翻炒=Stir-fry, 醃漬=Marinate, 燉=Braise/Stew, 蒸=Steam, 炸=Deep-fry, 煎=Pan-fry, 烤=Roast/Bake. Pembantu asing disarankan membuat kartu kosakata dapur bilingual pribadi.',vi:'Đúng! Từ vựng bếp phổ biến: 焯水=Blanch (chần qua), 翻炒=Stir-fry (xào lửa lớn), 醃漬=Marinate (ngâm ướp), 燉=Braise/Stew (ninh lửa nhỏ), 蒸=Steam, 炸=Deep-fry, 煎=Pan-fry, 烤=Roast/Bake. Người giúp việc nước ngoài nên làm thẻ từ vựng bếp song ngữ riêng để tra cứu.'}}
  ],
  /* Lv20 食物過敏與飲食禁忌 */
  [
   {q:{zh:'「食物過敏」與「食物不耐症」最關鍵的差異是什麼？',en:'What is the most critical difference between a "food allergy" and "food intolerance"?',id:'Apa perbedaan paling kritis antara "alergi makanan" dan "intoleransi makanan"?',vi:'Sự khác biệt quan trọng nhất giữa "dị ứng thực phẩm" và "không dung nạp thực phẩm" là gì?'},
    opts:[{zh:'食物過敏只是腸胃不舒服，不耐症才會嚴重',en:'Food allergy is just stomach discomfort; intolerance is the serious one',id:'Alergi makanan hanya ketidaknyamanan perut; intoleransi adalah yang serius',vi:'Dị ứng thực phẩm chỉ là khó chịu dạ dày; không dung nạp mới nghiêm trọng',ok:false},
          {zh:'食物過敏是免疫系統反應，可能致命（過敏性休克）；食物不耐症是消化問題，很少危及生命',en:'Food allergy is an immune system reaction that can be fatal (anaphylaxis); food intolerance is a digestive issue and rarely life-threatening',id:'Alergi makanan adalah reaksi sistem imun yang bisa fatal (anafilaksis); intoleransi makanan adalah masalah pencernaan dan jarang mengancam jiwa',vi:'Dị ứng thực phẩm là phản ứng miễn dịch có thể gây tử vong (sốc phản vệ); không dung nạp thực phẩm là vấn đề tiêu hóa và hiếm khi đe dọa tính mạng',ok:true},
          {zh:'兩者完全相同，都只影響消化系統',en:'They are exactly the same, both only affecting the digestive system',id:'Keduanya sama persis, keduanya hanya mempengaruhi sistem pencernaan',vi:'Chúng hoàn toàn giống nhau, đều chỉ ảnh hưởng đến hệ tiêu hóa',ok:false}],
    fb:{zh:'正確！食物過敏是免疫系統將特定食物蛋白質誤認為威脅，啟動免疫反應。即使微量（如刀具上的殘留）也可能在數分鐘內引發蕁麻疹、氣喘、喉嚨腫脹，嚴重時導致過敏性休克（Anaphylaxis）危及生命。食物不耐症（如乳糖不耐）則是消化酵素不足或腸道問題，通常只造成腹脹、腹瀉等不適，少量攝取有時可耐受。',en:'Correct! Food allergy is the immune system mistakenly treating a specific food protein as a threat, triggering an immune response. Even trace amounts (e.g. knife residue) can cause hives, asthma, throat swelling, or life-threatening anaphylaxis within minutes. Food intolerance (e.g. lactose intolerance) involves insufficient digestive enzymes or gut issues, usually causing bloating and diarrhea — small amounts may sometimes be tolerated.',id:'Benar! Alergi makanan adalah sistem imun yang salah mengidentifikasi protein makanan tertentu sebagai ancaman. Bahkan jejak dapat menyebabkan gatal-gatal, asma, pembengkakan tenggorokan, atau anafilaksis yang mengancam jiwa.',vi:'Đúng! Dị ứng thực phẩm là hệ miễn dịch nhầm lẫn coi protein thực phẩm cụ thể là mối đe dọa. Ngay cả lượng nhỏ cũng có thể gây nổi mề đay, hen, sưng cổ họng, hoặc sốc phản vệ đe dọa tính mạng trong vài phút. Không dung nạp thực phẩm là vấn đề tiêu hóa, thường chỉ gây đầy bụng và tiêu chảy.'}},
   {q:{zh:'台灣食品安全衛生管理法規定的「11大特定過敏原」，以下哪一項不在其中？',en:'Which of the following is NOT included in Taiwan\'s "11 Specified Allergens" under the Food Safety Act?',id:'Mana dari berikut yang TIDAK termasuk dalam "11 Alergen Tertentu" Taiwan berdasarkan Undang-Undang Keamanan Pangan?',vi:'Cái nào KHÔNG nằm trong "11 Chất gây dị ứng xác định" của Đài Loan theo Luật An toàn Thực phẩm?'},
    opts:[{zh:'蕎麥、亞硫酸鹽',en:'Buckwheat, sulfites',id:'Soba, sulfit',vi:'Kiều mạch, sulfit',ok:false},
          {zh:'辣椒、咖啡',en:'Chili peppers, coffee',id:'Cabai, kopi',vi:'Ớt, cà phê',ok:true},
          {zh:'芒果、芝麻',en:'Mango, sesame',id:'Mangga, wijen',vi:'Xoài, mè',ok:false}],
    fb:{zh:'正確！台灣11大特定過敏原（依法規）：①甲殼類（蝦、蟹）②蛋③魚④奶（牛乳）⑤花生⑥大豆⑦堅果類（腰果、杏仁、核桃等）⑧芒果⑨芝麻⑩蕎麥⑪亞硫酸鹽（≥10ppm）。辣椒與咖啡不屬於法定必須標示的特定過敏原。廚房工作者應熟記這11大類，並在採購時主動確認食品標示。',en:'Correct! Taiwan\'s 11 specified allergens (by law): ① crustaceans (shrimp, crab) ② eggs ③ fish ④ milk (cow\'s milk) ⑤ peanuts ⑥ soybeans ⑦ tree nuts (cashew, almond, walnut, etc.) ⑧ mango ⑨ sesame ⑩ buckwheat ⑪ sulfites (≥10ppm). Chili peppers and coffee are not legally required allergen disclosures. Kitchen workers should memorize these 11 categories.',id:'Benar! 11 alergen tertentu Taiwan: ① krustasea ② telur ③ ikan ④ susu ⑤ kacang tanah ⑥ kedelai ⑦ kacang pohon ⑧ mangga ⑨ wijen ⑩ soba ⑪ sulfit. Cabai dan kopi bukan alergen yang diwajibkan.',vi:'Đúng! 11 chất gây dị ứng xác định của Đài Loan: ① giáp xác ② trứng ③ cá ④ sữa bò ⑤ lạc ⑥ đậu nành ⑦ hạt cây ⑧ xoài ⑨ mè ⑩ kiều mạch ⑪ sulfit (≥10ppm). Ớt và cà phê không phải chất gây dị ứng bắt buộc ghi nhãn.'}},
   {q:{zh:'為清真飲食（Halal）的穆斯林家庭準備餐食時，最重要的禁忌是？',en:'When preparing meals for a Muslim household following Halal dietary laws, the most critical restriction is?',id:'Saat menyiapkan makanan untuk keluarga Muslim yang mengikuti hukum diet Halal, pantangan paling kritis adalah?',vi:'Khi chuẩn bị bữa ăn cho gia đình Hồi giáo theo quy định Halal, kiêng kỵ quan trọng nhất là gì?'},
    opts:[{zh:'不能吃辛辣食物與大蒜',en:'Cannot eat spicy food or garlic',id:'Tidak bisa makan makanan pedas atau bawang putih',vi:'Không được ăn thức ăn cay và tỏi',ok:false},
          {zh:'嚴禁豬肉及其衍生物、未經清真屠宰的肉類、酒精（含酒精調味料如紹興酒、米酒）',en:'Strictly no pork or pork derivatives, no non-Halal-slaughtered meat, no alcohol (including cooking wine like Shaoxing wine or rice wine)',id:'Dilarang keras daging babi dan turunannya, daging yang tidak disembelih secara halal, alkohol (termasuk anggur masak seperti anggur Shaoxing atau arak nasi)',vi:'Cấm tuyệt đối thịt lợn và các sản phẩm từ lợn, thịt không được giết mổ theo chuẩn Halal, rượu cồn (kể cả rượu nấu ăn như rượu Thiệu Hưng hay rượu gạo)',ok:true},
          {zh:'不能吃牛肉，因為牛在伊斯蘭教中是聖獸',en:'Cannot eat beef because cattle are sacred in Islam',id:'Tidak bisa makan sapi karena sapi adalah hewan suci dalam Islam',vi:'Không được ăn thịt bò vì bò là động vật linh thiêng trong Hồi giáo',ok:false}],
    fb:{zh:'正確！清真飲食（Halal）核心禁忌：①絕對禁豬（含豬油、豬骨高湯、豬皮明膠等一切豬衍生物）②肉類須經清真屠宰（「以真主之名」屠宰並放血）③嚴禁酒精（含料理酒、啤酒麵糊等）。廚房工作者需特別注意：醬油膏、烏斯特黑醋、許多加工醬料都可能含豬肉衍生物或酒精，務必仔細閱讀標籤。為清真家庭料理時，建議使用獨立廚具避免混用。',en:'Correct! Halal core restrictions: ① Absolutely no pork (including lard, pork bone broth, gelatin from pork, and all pork derivatives) ② Meat must be Halal-slaughtered (slaughtered in the name of Allah with blood drained) ③ Strictly no alcohol (including cooking wine, beer batter, etc.). Note: many sauces and processed condiments may contain pork derivatives or alcohol — always read labels carefully. Use separate utensils when cooking for Halal households.',id:'Benar! Pantangan inti Halal: ① Dilarang keras babi (termasuk lemak babi, kaldu tulang babi, gelatin babi) ② Daging harus disembelih secara halal ③ Dilarang keras alkohol. Catatan: banyak saus dan bumbu olahan mungkin mengandung turunan babi atau alkohol.',vi:'Đúng! Hạn chế cốt lõi Halal: ① Tuyệt đối không có thịt lợn (kể cả mỡ lợn, nước dùng xương lợn, gelatin từ lợn) ② Thịt phải được giết mổ theo chuẩn Halal ③ Tuyệt đối không có rượu cồn. Lưu ý: nhiều nước sốt và gia vị chế biến có thể chứa sản phẩm từ lợn hoặc rượu — luôn đọc nhãn kỹ.'}},
   {q:{zh:'有人在進食後數分鐘內出現臉部腫脹、喉嚨緊縮、喘不過氣、皮膚起紅疹等症狀，這最可能是？',en:'Someone develops facial swelling, throat tightness, difficulty breathing, and skin rash within minutes of eating. This is most likely?',id:'Seseorang mengalami pembengkakan wajah, sesak tenggorokan, kesulitan bernapas, dan ruam kulit dalam beberapa menit setelah makan. Ini kemungkinan besar adalah?',vi:'Ai đó bị sưng mặt, cổ họng thắt, khó thở và nổi mẩn da trong vài phút sau khi ăn. Đây có thể là?'},
    opts:[{zh:'一般消化不良，休息一下即可',en:'Ordinary indigestion — just needs rest',id:'Gangguan pencernaan biasa — hanya butuh istirahat',vi:'Khó tiêu thông thường — chỉ cần nghỉ ngơi',ok:false},
          {zh:'過敏性休克（Anaphylaxis），屬醫療緊急狀況，必須立即撥打119並施打腎上腺素（EpiPen）',en:'Anaphylaxis — a medical emergency requiring immediate call to 119 and epinephrine injection (EpiPen)',id:'Anafilaksis — keadaan darurat medis yang membutuhkan panggilan 119 segera dan suntikan epinefrin (EpiPen)',vi:'Sốc phản vệ — tình huống khẩn cấp y tế cần gọi 119 ngay và tiêm epinephrine (EpiPen)',ok:true},
          {zh:'食物中毒，給予大量飲水即可緩解',en:'Food poisoning — drinking plenty of water will relieve symptoms',id:'Keracunan makanan — minum banyak air akan meringankan gejala',vi:'Ngộ độc thực phẩm — uống nhiều nước sẽ giảm triệu chứng',ok:false}],
    fb:{zh:'正確！過敏性休克（Anaphylaxis）是威脅生命的嚴重過敏反應，典型症狀：①皮膚：蕁麻疹、臉部/嘴唇/眼皮腫脹②呼吸：喉嚨腫脹導致呼吸困難、喘鳴③循環：血壓驟降、頭暈、意識不清。緊急處理：①立即撥打119（台灣）②若已備有腎上腺素自動注射器（EpiPen），立即注射大腿外側③讓患者平躺並抬高下肢（若昏迷則側躺）④保持呼吸道暢通，等待救援到達。不可給予任何飲食或藥物（除EpiPen外）。',en:'Correct! Anaphylaxis is a life-threatening severe allergic reaction. Typical symptoms: ① skin: hives, facial/lip/eyelid swelling ② respiratory: throat swelling causing breathing difficulty, wheezing ③ circulatory: sudden blood pressure drop, dizziness, loss of consciousness. Emergency response: ① Call 119 (Taiwan) immediately ② If an epinephrine auto-injector (EpiPen) is available, inject into the outer thigh immediately ③ Lay patient flat and elevate legs (side-recovery position if unconscious) ④ Keep airway clear; wait for help. Do not give food, drink, or medication (except EpiPen).',id:'Benar! Anafilaksis adalah reaksi alergi parah yang mengancam jiwa. Gejala khas: ① kulit: gatal-gatal, pembengkakan wajah/bibir ② pernapasan: pembengkakan tenggorokan yang menyebabkan kesulitan bernapas ③ sirkulasi: tekanan darah tiba-tiba turun. Darurat: ① Panggil 119 segera ② Jika ada EpiPen, suntikkan ke paha luar.',vi:'Đúng! Sốc phản vệ là phản ứng dị ứng nghiêm trọng đe dọa tính mạng. Triệu chứng điển hình: ① da: nổi mề đay, sưng mặt/môi ② hô hấp: cổ họng sưng gây khó thở ③ tuần hoàn: huyết áp giảm đột ngột. Xử lý khẩn cấp: ① Gọi 119 ngay ② Nếu có EpiPen, tiêm vào đùi ngoài ③ Cho nằm và nâng chân, đợi cấp cứu.'}},
   {q:{zh:'廚房「交叉接觸（Cross-Contact）」是指什麼？為何對過敏者危險？',en:'What is "cross-contact" in the kitchen, and why is it dangerous for allergy sufferers?',id:'Apa itu "kontak silang" di dapur, dan mengapa berbahaya bagi penderita alergi?',vi:'"Tiếp xúc chéo" trong bếp là gì và tại sao nguy hiểm cho người bị dị ứng?'},
    opts:[{zh:'廚師同時料理多道菜，效率的烹調方式',en:'A chef cooking multiple dishes simultaneously — an efficient cooking approach',id:'Koki memasak beberapa hidangan sekaligus — pendekatan memasak yang efisien',vi:'Đầu bếp nấu nhiều món cùng lúc — phương pháp nấu hiệu quả',ok:false},
          {zh:'過敏原從含有過敏原的食物「轉移」到原本不含過敏原的食物（如刀具、砧板、雙手、油炸油的殘留），即使極微量也可能引發嚴重過敏反應',en:'Allergens "transferring" from allergen-containing food to originally allergen-free food (via knives, boards, hands, frying oil residue) — even trace amounts can trigger severe reactions',id:'Alergen "berpindah" dari makanan yang mengandung alergen ke makanan yang awalnya bebas alergen (melalui pisau, talenan, tangan, minyak goreng sisa) — bahkan jejak kecil dapat memicu reaksi parah',vi:'Chất gây dị ứng "chuyển sang" từ thực phẩm có chứa chất gây dị ứng sang thực phẩm ban đầu không có chất gây dị ứng (qua dao, thớt, tay, dầu chiên còn sót) — ngay cả lượng nhỏ cũng có thể gây phản ứng nghiêm trọng',ok:true},
          {zh:'食物在冰箱中交叉放置導致細菌感染',en:'Cross-placement of foods in the refrigerator leading to bacterial contamination',id:'Penempatan makanan yang bersilang di kulkas menyebabkan kontaminasi bakteri',vi:'Đặt thực phẩm chồng chéo trong tủ lạnh dẫn đến ô nhiễm vi khuẩn',ok:false}],
    fb:{zh:'正確！交叉接觸（Cross-Contact）是過敏管理中最難防範的風險之一。常見情境：①用同一刀切過堅果再切蔬菜②炸過含花生食品的油繼續炸薯條③手摸過含奶食品後未洗手再處理「無奶」食品④同一砧板切生蝦後切「不含蝦」的料理。預防措施：①為過敏者備份獨立刀具、砧板（標記顏色）②油炸食品需使用獨立鍋與新鮮食用油③料理前徹底洗手④清潔後以熱水沖洗所有接觸器具。注意：「清洗過」不等於「零過敏原」，蛋白質難以完全去除。',en:'Correct! Cross-contact is one of the hardest allergen risks to prevent. Common scenarios: ① using the same knife for nuts then vegetables ② frying chips in oil previously used for peanut-containing food ③ touching dairy then handling "dairy-free" items without washing hands ④ cutting "shrimp-free" dishes on the same board used for raw shrimp. Prevention: ① separate dedicated utensils and boards (color-coded) for allergy sufferers ② use a separate pot and fresh oil for frying ③ wash hands thoroughly before cooking ④ rinse all contact surfaces with hot water after washing. Note: "washed" ≠ "allergen-free" — proteins are hard to fully remove.',id:'Benar! Kontak silang adalah salah satu risiko alergen yang paling sulit dicegah. Skenario umum: ① menggunakan pisau yang sama untuk kacang lalu sayuran ② menggoreng kentang dalam minyak yang sebelumnya digunakan untuk makanan mengandung kacang. Pencegahan: peralatan terpisah yang didedikasikan.',vi:'Đúng! Tiếp xúc chéo là một trong những rủi ro dị ứng khó phòng ngừa nhất. Tình huống phổ biến: ① dùng cùng dao cho hạt rồi cắt rau ② chiên khoai tây trong dầu đã dùng cho thực phẩm có lạc. Phòng ngừa: dụng cụ riêng biệt dành riêng cho người dị ứng.'}},
   {q:{zh:'家庭中有人需要「無麩質飲食（Gluten-Free）」，麩質主要存在於哪些食材中？',en:'A family member needs a "gluten-free diet". Which foods mainly contain gluten?',id:'Anggota keluarga membutuhkan "diet bebas gluten". Makanan mana yang terutama mengandung gluten?',vi:'Một thành viên gia đình cần "chế độ ăn không gluten". Thực phẩm nào chủ yếu chứa gluten?'},
    opts:[{zh:'米飯、馬鈴薯、玉米',en:'Rice, potato, corn',id:'Nasi, kentang, jagung',vi:'Gạo, khoai tây, ngô',ok:false},
          {zh:'小麥（含麵粉、麵包、麵條、饅頭）、大麥、黑麥及其衍生加工品',en:'Wheat (including flour, bread, noodles, steamed buns), barley, rye, and their processed products',id:'Gandum (termasuk tepung, roti, mie, mantou), barli, rye, dan produk olahannya',vi:'Lúa mì (kể cả bột, bánh mì, mì, bánh bao), lúa mạch, lúa mạch đen và các sản phẩm chế biến',ok:true},
          {zh:'豆腐、豆漿、所有豆類製品',en:'Tofu, soy milk, all soy products',id:'Tahu, susu kedelai, semua produk kedelai',vi:'Đậu phụ, sữa đậu nành, tất cả sản phẩm đậu',ok:false}],
    fb:{zh:'正確！麩質（Gluten）是小麥、大麥、黑麥中的蛋白質，對乳糜瀉（Celiac Disease）患者或麩質敏感者會引發腸道損傷或嚴重不適。常見含麩質食品：麵粉、麵包、饅頭、包子、麵條（拉麵、義大利麵）、餃子皮、醬油（傳統釀造含小麥）、許多加工食品。天然無麩質食材：白米、糙米、玉米、馬鈴薯、地瓜、豆類、新鮮肉類與蔬果。為無麩質家庭烹調時，須使用獨立廚具並確認所有醬料標示（包括醬油須選無麩質版本）。',en:'Correct! Gluten is a protein in wheat, barley, and rye. For people with celiac disease or gluten sensitivity, it causes intestinal damage or severe discomfort. Common gluten-containing foods: flour, bread, steamed buns, noodles (ramen, pasta), dumpling wrappers, soy sauce (traditional brewing contains wheat), many processed foods. Naturally gluten-free: white rice, brown rice, corn, potato, sweet potato, legumes, fresh meat and produce. When cooking for a gluten-free household, use dedicated utensils and check all sauce labels (including choosing gluten-free soy sauce).',id:'Benar! Gluten adalah protein dalam gandum, barli, dan rye. Untuk penderita penyakit celiac atau sensitivitas gluten, menyebabkan kerusakan usus. Makanan mengandung gluten umum: tepung, roti, mie, kulit pangsit, kecap (mengandung gandum). Bebas gluten alami: beras, jagung, kentang, kacang-kacangan.',vi:'Đúng! Gluten là protein trong lúa mì, lúa mạch và lúa mạch đen. Với người bị celiac hoặc nhạy cảm với gluten, gây tổn thương ruột. Thực phẩm chứa gluten phổ biến: bột, bánh mì, mì, vỏ há cảo, nước tương (chứa lúa mì). Tự nhiên không có gluten: gạo, ngô, khoai tây, đậu, thịt và rau tươi.'}},
   {q:{zh:'台灣傳統佛教素食（「全素」）與一般西方素食（Vegetarian）最重要的差異是？',en:'What is the most important difference between traditional Taiwanese Buddhist "vegan" (全素) and Western vegetarianism?',id:'Apa perbedaan paling penting antara vegan Buddha Taiwan tradisional (全素) dan vegetarianisme Barat?',vi:'Sự khác biệt quan trọng nhất giữa "thuần chay" Phật giáo Đài Loan (全素) và ăn chay kiểu phương Tây là gì?'},
    opts:[{zh:'台灣全素可以吃蛋和奶，西方素食不行',en:'Taiwanese full vegan can eat eggs and dairy; Western vegetarianism cannot',id:'Vegan penuh Taiwan bisa makan telur dan susu; vegetarianisme Barat tidak',vi:'Thuần chay Đài Loan được ăn trứng và sữa; ăn chay phương Tây thì không',ok:false},
          {zh:'台灣佛教全素除不吃一切肉類外，還禁食「五辛」（蔥、蒜、韭、薤、洋蔥），而一般西方素食不限制蔥蒜',en:'Taiwanese Buddhist full vegan avoids all meat AND the "Five Pungent Roots" (scallion, garlic, chives, shallot/Chinese garlic, onion); Western vegetarianism does not restrict these',id:'Vegan penuh Buddha Taiwan menghindari semua daging DAN "Lima Umbi Pedas" (daun bawang, bawang putih, kucai, bawang merah, bawang); vegetarianisme Barat tidak membatasi ini',vi:'Thuần chay Phật giáo Đài Loan kiêng cả thịt lẫn "Ngũ tân" (hành lá, tỏi, hẹ, nén, hành tây); ăn chay phương Tây không hạn chế các loại này',ok:true},
          {zh:'台灣全素不能吃豆腐，西方素食可以',en:'Taiwanese full vegan cannot eat tofu; Western vegetarianism can',id:'Vegan penuh Taiwan tidak bisa makan tahu; vegetarianisme Barat bisa',vi:'Thuần chay Đài Loan không được ăn đậu phụ; ăn chay phương Tây thì được',ok:false}],
    fb:{zh:'正確！台灣佛教素食的「五辛（五葷）」禁忌：蔥、大蒜、韭菜、薤（野蒜）、洋蔥（依各宗派解釋略有差異）。五辛被認為有刺激性，影響修行心境。因此台灣全素料理完全不使用蔥蒜類調味，改以薑、香菜、九層塔等替代。一般西方素食（Vegetarian）只禁肉類（有些包含魚，有些不含），對蔥蒜無限制。廚房工作者服務素食家庭前，務必確認是「全素（無五辛）」「蛋奶素」還是「蛋素」「奶素」等類型。',en:'Correct! Taiwan Buddhist vegetarianism\'s "Five Pungent Roots (五辛)" restriction: scallions, garlic, chives, shallots/Chinese garlic, onions (slight variations by sect). These are considered stimulating and disruptive to meditation. Therefore, Taiwanese 全素 cooking uses no allium aromatics at all, substituting ginger, cilantro, basil, etc. Western vegetarianism only avoids meat (some include fish exclusions); no restrictions on alliums. Always clarify whether a vegetarian family wants 全素 (no five pungents), 蛋奶素 (lacto-ovo), 蛋素, or 奶素.',id:'Benar! Pantangan "Lima Umbi Pedas" vegetarianisme Buddha Taiwan: daun bawang, bawang putih, kucai, bawang merah, bawang. Dianggap merangsang dan mengganggu meditasi. Vegetarianisme Barat hanya menghindari daging; tidak ada batasan pada bawang-bawangan.',vi:'Đúng! Kiêng "Ngũ tân" của đạo Phật Đài Loan: hành lá, tỏi, hẹ, nén, hành tây (có sự khác biệt nhỏ theo từng tông phái). Được coi là kích thích và ảnh hưởng đến tu hành. Ăn chay phương Tây chỉ kiêng thịt; không hạn chế hành tỏi. Luôn hỏi rõ loại ăn chay trước khi nấu.'}},
   {q:{zh:'在含過敏原食品旁邊擺放「無過敏原」食品，下列哪項描述最能說明為什麼這樣做是危險的？',en:'Placing "allergen-free" food next to allergen-containing food — which statement best explains why this is dangerous?',id:'Menempatkan makanan "bebas alergen" di sebelah makanan yang mengandung alergen — pernyataan mana yang paling menjelaskan mengapa ini berbahaya?',vi:'Đặt thực phẩm "không chứa chất gây dị ứng" cạnh thực phẩm có chứa chất gây dị ứng — phát biểu nào giải thích rõ nhất tại sao điều này nguy hiểm?'},
    opts:[{zh:'視覺上容易讓人取錯食物',en:'Visually it\'s easy to pick up the wrong food by mistake',id:'Secara visual mudah mengambil makanan yang salah',vi:'Nhìn thị giác dễ lấy nhầm thức ăn',ok:false},
          {zh:'食物蛋白質（過敏原）可透過空氣接觸、液體飛濺或直接接觸轉移至鄰近食品，即使肉眼不可見的微量也足以引發嚴重過敏反應',en:'Food proteins (allergens) can transfer to adjacent foods via airborne particles, liquid splashes, or direct contact — invisible trace amounts are sufficient to trigger severe allergic reactions',id:'Protein makanan (alergen) dapat berpindah ke makanan yang berdekatan melalui partikel udara, percikan cairan, atau kontak langsung — jumlah jejak yang tidak terlihat sudah cukup memicu reaksi alergi parah',vi:'Protein thực phẩm (chất gây dị ứng) có thể chuyển sang thực phẩm lân cận qua không khí, văng chất lỏng hoặc tiếp xúc trực tiếp — lượng nhỏ không nhìn thấy bằng mắt thường cũng đủ gây phản ứng dị ứng nghiêm trọng',ok:true},
          {zh:'過敏原食品的氣味會影響無過敏原食品的味道',en:'The smell of allergen-containing food will affect the flavor of allergen-free food',id:'Bau makanan yang mengandung alergen akan mempengaruhi rasa makanan bebas alergen',vi:'Mùi thực phẩm chứa chất gây dị ứng sẽ ảnh hưởng đến vị của thực phẩm không có chất gây dị ứng',ok:true}],
    fb:{zh:'正確！（此題有兩個正確選項；微量轉移是核心危險）食物過敏原（蛋白質）的轉移途徑：①液體飛濺：切蝦時飛濺的蝦汁落在旁邊的沙拉上②直接接觸：花生醬桶的刀勺碰觸其他食品容器③空氣傳播：部分高度敏感者對空氣中的過敏原顆粒（如花生粉塵、蒸煮海鮮蒸氣）也會反應。管理原則：①過敏者的食品應獨立備製、獨立存放②使用顏色標記系統區隔（如藍色標記=無花生）③備料時過敏者的食品「最先處理」（廚具最乾淨時）④告知用餐者任何不確定的成分。',en:'Correct! (This question has two valid points; invisible transfer is the core danger.) Allergen transfer routes: ① liquid splash: shrimp juice splashing onto a nearby salad while cutting ② direct contact: utensils from a peanut butter jar touching other food containers ③ airborne: highly sensitive individuals may react to airborne allergen particles (peanut dust, cooking seafood steam). Management: ① allergen-free foods must be prepared and stored separately ② use a color-coding system ③ prepare allergen-free items FIRST when utensils are cleanest ④ inform diners of any uncertain ingredients.',id:'Benar! Jalur transfer alergen: ① percikan cairan ② kontak langsung ③ udara. Manajemen: ① makanan bebas alergen harus disiapkan dan disimpan secara terpisah ② gunakan sistem pengkodean warna ③ siapkan item bebas alergen PERTAMA.',vi:'Đúng! Đường lây truyền chất gây dị ứng: ① văng chất lỏng ② tiếp xúc trực tiếp ③ không khí. Quản lý: ① thực phẩm không chứa chất gây dị ứng phải được chuẩn bị và bảo quản riêng ② dùng hệ thống mã màu ③ chuẩn bị món không dị ứng TRƯỚC khi dụng cụ sạch nhất.'}}
  ]
];

    items:[
      {icon:'🔥',zh:'油炸安全 3 大原則',en:'3 Deep-Frying Safety Rules',desc:{zh:'①油量不超過鍋深1/3。②全程保持通風、不離開爐邊。③油溫超過250°C會自燃，出現白煙立即關火。一旦起火：關火→蓋鍋蓋（隔絕氧氣），絕對不可潑水！',en:'①Fill max 1/3 of pot. ②Stay present, keep ventilated. ③Oil auto-ignites above 250°C — white smoke = turn off heat. If fire: off heat → cover pot (cut oxygen). NEVER pour water!',id:'①Isi maks 1/3 panci. ②Tetap ada, ventilasi. ③Minyak terbakar otomatis di atas 250°C — asap putih = matikan api. Jika terbakar: tutup panci, JANGAN air!',vi:'①Đổ tối đa 1/3 nồi. ②Luôn có mặt, thông gió. ③Dầu tự bốc cháy trên 250°C — khói trắng = tắt bếp. Nếu cháy: đậy nắp, KHÔNG đổ nước!'}},
      {icon:'🟦',zh:'瓦斯安全 SOP',en:'Gas Safety SOP',desc:{zh:'聞到瓦斯味：①不開燈/不開關電器。②立即關閉瓦斯總開關。③打開所有門窗通風。④離開室內後再打電話。每日離開廚房前確認旋鈕全關，定期（每3個月）檢查橡膠管。',en:'Smell gas: ①No lights/switches. ②Close main gas valve. ③Open all doors/windows. ④Call from outside. Before leaving kitchen daily: confirm all knobs off. Check rubber hose every 3 months.',id:'Bau gas: ①Jangan nyalakan lampu. ②Tutup katup gas utama. ③Buka semua pintu/jendela. ④Telepon dari luar. Periksa selang karet setiap 3 bulan.',vi:'Ngửi mùi gas: ①Không bật đèn. ②Đóng van gas chính. ③Mở tất cả cửa. ④Gọi điện từ bên ngoài. Kiểm tra ống cao su mỗi 3 tháng.'}},
      {icon:'💧',zh:'防滑與地板安全',en:'Slip & Floor Safety',desc:{zh:'廚房地板意外佔所有廚房事故60%以上。預防三步驟：①穿有防滑底的廚房鞋。②所有液體滴落立即用乾布擦乾並放置濕地警示牌。③繁忙時段在爐前鋪防滑橡膠墊。',en:'Floor accidents = 60%+ of kitchen injuries. Prevent: ①Wear non-slip kitchen shoes. ②Dry all spills immediately + wet floor sign. ③Use anti-slip rubber mat in front of stove during busy hours.',id:'Kecelakaan lantai = 60%+ cedera dapur. Cegah: ①Sepatu dapur anti-slip. ②Keringkan tumpahan segera + tanda lantai basah. ③Karpet karet di depan kompor.',vi:'Tai nạn sàn = 60%+ chấn thương bếp. Phòng ngừa: ①Giày bếp chống trượt. ②Lau khô ngay + biển cảnh báo. ③Thảm cao su trước bếp khi bận.'}},
      {icon:'⚡',zh:'用電安全要點',en:'Electrical Safety',desc:{zh:'①濕手禁止觸碰任何電器（包括開關）。②電線不可橫跨水槽、爐台或置物架。③不可多個大功率電器共用同一插座。④定期（每6個月）檢查電線外皮是否破損，發現破裂立即更換。',en:'①Never touch appliances with wet hands. ②Cords must not cross sink, stove, or racks. ③Do not share outlets between high-wattage appliances. ④Check cords every 6 months for damage.',id:'①Jangan sentuh peralatan dengan tangan basah. ②Kabel tidak boleh melintasi wastafel atau kompor. ③Jangan berbagi stopkontak peralatan berdaya tinggi. ④Periksa kabel setiap 6 bulan.',vi:'①Không chạm thiết bị tay ướt. ②Dây điện không qua bồn rửa. ③Không dùng chung ổ cắm thiết bị công suất cao. ④Kiểm tra dây điện 6 tháng một lần.'}},
      {icon:'🩹',zh:'燙傷緊急處理（5步驟）',en:'Burn First Aid (5 Steps)',desc:{zh:'① 沖：立即以流動冷水沖15–20分鐘（不可用冰水）。② 脫：輕輕移除衣物和飾品（若黏住皮膚不可強行撕除）。③ 泡：持續在冷水中浸泡保持涼爽。④ 蓋：用乾淨紗布或保鮮膜輕蓋傷口。⑤ 送：面積大於手掌或起水泡立即就醫。絕對禁止：牙膏、醬油、沙拉油等民間偏方！',en:'①Cool: cold running water 15–20 min (not ice). ②Remove: gently remove clothing/jewelry (do not tear if stuck). ③Soak: keep in cool water. ④Cover: clean gauze or cling wrap. ⑤Send: seek medical help if larger than palm or blistered. NEVER: toothpaste, soy sauce, or folk remedies!',id:'①Dinginkan: air mengalir 15–20 menit. ②Lepas: pakaian/perhiasan perlahan. ③Rendam: tetap dalam air dingin. ④Tutup: kain kasa bersih. ⑤Kirim ke dokter jika lebih besar dari telapak tangan. JANGAN: pasta gigi atau obat tradisional!',vi:'①Làm mát: nước lạnh chảy 15–20 phút. ②Gỡ: quần áo/đồ trang sức nhẹ nhàng. ③Ngâm: tiếp tục ngâm nước lạnh. ④Che: gạc sạch hoặc màng bọc. ⑤Đến bệnh viện nếu lớn hơn lòng bàn tay. KHÔNG: kem đánh răng hay thuốc dân gian!'}},
      {icon:'🆘',zh:'廚房緊急應變清單',en:'Kitchen Emergency Checklist',desc:{zh:'必須記住/張貼的資訊：①急救電話（台灣119）。②最近的滅火器位置（乾粉型ABC，每年檢驗）。③急救箱位置（含無菌紗布、OK繃、燙傷膏）。④廚房發生火災先拉警報、疏散人員，再考慮滅火。',en:'Must know/post: ①Emergency number (119). ②Fire extinguisher location (dry powder ABC, inspect yearly). ③First aid kit location (sterile gauze, bandages, burn gel). ④Kitchen fire: alarm first, evacuate, then consider extinguishing.',id:'Harus tahu: ①Nomor darurat. ②Lokasi alat pemadam (tipe ABC, periksa tahunan). ③Lokasi kotak P3K. ④Kebakaran dapur: alarm dulu, evakuasi, baru padamkan.',vi:'Phải biết: ①Số khẩn cấp (113). ②Vị trí bình chữa cháy (loại ABC). ③Vị trí hộp sơ cứu. ④Cháy bếp: báo động trước, di tản, rồi mới chữa cháy.'}}

  {
    title:{zh:'刀工技法完全指南',en:'Complete Knife Skills Guide',id:'Panduan Teknik Pisau Lengkap',vi:'Hướng dẫn kỹ thuật dao toàn diện'},
    visual:{
      title:{zh:'六大刀工技法圖解對照',en:'6 Knife Cuts Visual Reference'},
      html:`<table class="kvtable" style="margin:0">
        <thead><tr><th>刀法</th><th>英文</th><th>尺寸</th><th>適用</th></tr></thead>

          <tr><td>🟨 切丁 Dice</td><td>Dice</td><td>0.5/1/2cm³</td><td>燉煮、沙拉</td></tr>

          <div style="font-size:10.5px;color:#555">指尖向內彎曲，以指節引導刀面——切割最安全的手勢。</div>
        </div>
        <div style="flex:1;min-width:120px;background:rgba(26,114,72,.05);border:1px solid rgba(26,114,72,.2);border-radius:6px;padding:7px">
          <div style="font-size:11px;font-weight:600;color:#1a7248;margin-bottom:4px">✅ 夾刀式握刀</div>
          <div style="font-size:10.5px;color:#555">拇指與食指夾住刀跟，其餘三指環繞刀柄，標準職業握法。</div>
        </div>
      </div>`

    items:[
      {icon:'✋',zh:'正確握刀法（夾刀式）',en:'Correct Grip: Pinch Grip',desc:{zh:'大拇指與食指夾住刀跟（刀身最寬處），其餘三指環繞刀柄。這是專業廚師標準握法：①控制力道精準。②刀具不易滑落。③減少手腕疲勞。初學者常犯錯誤：食指放在刀面上——這樣施力不均、容易割傷！',en:'Pinch the blade heel (widest part) between thumb and index finger; wrap remaining fingers around handle. Benefits: ①precise control ②prevents slipping ③reduces wrist fatigue. Beginner mistake: placing index finger on the flat — causes uneven force and cuts!',id:'Jepit tumit bilah antara ibu jari dan jari telunjuk; jari lainnya melingkupi gagang. Manfaat: ①kontrol tepat ②mencegah tergelincir ③kurangi kelelahan. Kesalahan pemula: jari telunjuk di sisi bilah!',vi:'Kẹp gót lưỡi dao giữa ngón cái và ngón trỏ; các ngón khác ôm cán dao. Lợi ích: ①kiểm soát chính xác ②không trượt ③giảm mỏi cổ tay. Lỗi phổ biến: đặt ngón trỏ lên thân dao!'}},
      {icon:'🐾',zh:'貓爪式保護手（關鍵技法）',en:'Claw Grip: Protecting Your Hand',desc:{zh:'非慣用手保護食材的標準姿勢：指尖向內彎曲（如貓爪），以第一指節引導刀面側面向下切割。好處：①指尖縮進，物理性保護。②指節當作刀面導軌，讓每刀距離均等。③切割速度加快。練習方法：先用大黃瓜慢速練習，待動作自然後再提速。',en:'Guiding hand position: curl fingertips inward (like cat paws); let knuckles guide the flat of the blade. Benefits: ①physical fingertip protection ②knuckles as blade guide for even cuts ③faster cutting. Practice: start slow with a cucumber, speed up once natural.',id:'Posisi tangan pengarah: tekuk ujung jari ke dalam (seperti cakar kucing); buku jari memandu sisi pisau. Manfaat: ①proteksi ujung jari ②potongan merata ③lebih cepat. Latihan: mulai lambat dengan mentimun.',vi:'Vị trí tay dẫn: cong đầu ngón tay vào trong (như móng mèo); đốt ngón dẫn thân dao. Lợi ích: ①bảo vệ đầu ngón tay ②cắt đều ③nhanh hơn. Luyện: bắt đầu chậm với dưa leo.'}},
      {icon:'🔪',zh:'六大刀工技法對照表',en:'6 Knife Cuts Reference',desc:{zh:'①切片（Slice）：厚度一致，適合炒菜。②切絲（Julienne）：3mm×5cm，炒絲瓜、醬菜。③切丁（Dice）：大2cm、中1cm、細0.5cm，燉煮、沙拉。④切段（Chunk）：3–5cm，紅燒、燉湯。⑤剁碎（Mince）：<2mm，蒜末薑末醬料。⑥切末（Fine chop）：2–3mm，蔥花香料。',en:'①Slice: even thickness for stir-fry. ②Julienne: 3mm×5cm for salads. ③Dice: 2cm large/1cm medium/0.5cm brunoise. ④Chunk: 3–5cm for braises/soups. ⑤Mince: <2mm for garlic/ginger/sauces. ⑥Fine chop: 2–3mm for herbs/scallions.',id:'①Iris: ketebalan merata. ②Julienne: 3mm×5cm. ③Dadu: 2cm besar/1cm sedang/0.5cm halus. ④Potongan: 3–5cm untuk rebusan. ⑤Cincang: <2mm untuk bumbu. ⑥Cacah halus: 2–3mm untuk rempah.',vi:'①Thái lát: độ dày đều. ②Sợi: 3mm×5cm. ③Hạt lựu: 2cm lớn/1cm vừa/0.5cm nhỏ. ④Miếng: 3–5cm cho hầm. ⑤Băm: <2mm cho tỏi/gừng. ⑥Băm nhuyễn: 2–3mm cho gia vị.'}},
      {icon:'🗡️',zh:'刀具種類與用途',en:'Knife Types & Uses',desc:{zh:'①主廚刀（18–21cm）：萬用，切肉切菜剁碎皆宜，廚房首選。②蔬菜刀（15cm）：輕盈，適合切葉菜、水果。③去骨刀（細長）：緊貼骨頭分割肉類，刃薄彎曲設計。④麵包刀（鋸齒）：切硬皮麵包不壓扁，不適合切肉蔬菜。⑤削皮刀：去除蔬果外皮，輕巧靈活。',en:'①Chef knife (18–21cm): all-purpose, meat and veg. ②Santoku/veg knife (15cm): light, leafy veg and fruit. ③Boning knife (thin flexible): meat off bone, follows curves. ④Bread knife (serrated): hard crusts without crushing. ⑤Paring knife: peeling, small precision work.',id:'①Pisau chef (18–21cm): serbaguna. ②Pisau sayur (15cm): ringan. ③Pisau tulang (fleksibel tipis): daging dari tulang. ④Pisau roti (bergerigi): kerak keras. ⑤Pisau pengupas: mengupas.',vi:'①Dao đầu bếp (18–21cm): đa năng. ②Dao rau (15cm): nhẹ. ③Dao gỡ xương (mỏng linh hoạt): tách thịt. ④Dao bánh mì (răng cưa): vỏ cứng. ⑤Dao gọt vỏ: gọt vỏ rau củ.'}},
      {icon:'🔧',zh:'磨刀與保養',en:'Knife Sharpening & Care',desc:{zh:'鈍刀是危險的刀！判斷是否需磨刀：用刀腹輕壓番茄皮，若無法切入即需磨刀。磨刀方法：①磨刀石：20度角推磨，兩面各磨10–15次（最佳方法）。②磨刀棒：日常維護，每次烹調前快速修整。③電動磨刀器：方便但損耗較大。保養：每次使用後立即手洗擦乾，不可放入洗碗機，以防鋼材氧化。',en:'A dull knife is a dangerous knife! Test: press blade against tomato skin — if it slips, sharpen it. Methods: ①whetstone at 20°: best, 10–15 strokes each side ②honing steel: quick daily maintenance ③electric sharpener: convenient but removes more metal. Care: hand wash immediately after use, never dishwasher.',id:'Pisau tumpul itu berbahaya! Tes: tekan ke kulit tomat — kalau tergelincir, perlu diasah. Metode: ①batu asah 20°: terbaik ②pengasah baja: perawatan harian ③listrik: nyaman tapi lebih boros. Perawatan: cuci tangan segera setelah digunakan.',vi:'Dao cùn là dao nguy hiểm! Kiểm tra: ép vào vỏ cà chua — nếu trượt là cần mài. Cách mài: ①đá mài 20°: tốt nhất ②gậy mài: bảo dưỡng hàng ngày ③máy mài: tiện nhưng hao dao. Bảo quản: rửa tay ngay sau khi dùng, không rửa máy.'}},
      {icon:'🗂️',zh:'砧板選擇與衛生管理',en:'Cutting Board Selection & Hygiene',desc:{zh:'材質比較：①木頭砧板：抑菌性佳但難清洗，適合生鮮以外用途。②塑膠砧板：容易清洗消毒，推薦用於生肉生魚。③竹砧板：環保但容易有裂縫藏菌。顏色分色系統（國際標準）：紅=生肉、黃=生禽肉、藍=生海鮮、綠=蔬果、白=熟食、棕=烘焙。每次使用後熱水清洗，每週以稀釋漂白水（1:99）浸泡消毒10分鐘。',en:'Materials: ①Wood: natural antibacterial but hard to sanitize — avoid raw meat. ②Plastic: easy to clean/sanitize — recommended for raw meat/fish. ③Bamboo: eco-friendly but prone to cracks. Color system: Red=raw meat, Yellow=raw poultry, Blue=raw seafood, Green=produce, White=cooked, Brown=bakery. Hot-water wash after each use; weekly soak in diluted bleach (1:99) for 10 min.',id:'Bahan: ①Kayu: antibakteri alami tapi sulit disterilkan. ②Plastik: mudah dibersihkan, untuk daging mentah. ③Bambu: ramah lingkungan tapi mudah retak. Sistem warna: Merah=daging mentah, Kuning=unggas, Biru=seafood, Hijau=sayuran, Putih=matang, Coklat=roti.',vi:'Vật liệu: ①Gỗ: kháng khuẩn tự nhiên nhưng khó khử trùng. ②Nhựa: dễ vệ sinh, dùng cho thịt sống. ③Tre: thân thiện môi trường nhưng dễ nứt. Màu sắc: Đỏ=thịt sống, Vàng=gia cầm, Xanh=hải sản, Xanh lá=rau, Trắng=thức ăn chín, Nâu=bánh mì.'}}

    tip:{zh:'💡 刀工練習黃金三法則：①慢→準→快（先求準確再提速）。②每天練習比偶爾練習效果好3倍。③切大黃瓜是最佳基礎練習——食材大、好拿、練習貓爪式節奏感。',en:'💡 3 Golden Rules of Knife Practice: ①Slow → Accurate → Fast. ②Daily practice 3× more effective than occasional. ③Cucumber is the best beginner practice — large, easy to hold, great for claw rhythm.',id:'💡 3 Aturan Emas: ①Lambat → Akurat → Cepat. ②Latihan harian 3× lebih efektif. ③Mentimun adalah latihan pemula terbaik.',vi:'💡 3 quy tắc vàng luyện dao: ①Chậm → Chính xác → Nhanh. ②Luyện hàng ngày hiệu quả gấp 3. ③Dưa leo là bài tập tốt nhất cho người mới.'}

  {
    title:{zh:'火候掌控完全指南',en:'Complete Heat Control Guide',id:'Panduan Lengkap Kontrol Api',vi:'Hướng dẫn kiểm soát lửa toàn diện'},
    visual:{

    items:[
      {icon:'🌡️',zh:'四段火候對照表',en:'4-Level Heat Reference',desc:{zh:'🔴大火（180°C+）：快炒、爆香、煮沸、燒滾—食材快速上色，水分迅速蒸發。🟡中火（140–180°C）：煎（兩面金黃）、煮湯、炒蛋—平穩加熱，兩面均勻熟透。🟢小火（100–140°C）：慢燉、滷、保溫—湯汁入味、食材軟嫩不焦底。🔵微火（60–100°C）：保溫、蒸蛋定形—維持溫度不繼續烹調。',en:'🔴High (180°C+): stir-fry, searing, boiling — fast browning, rapid moisture loss. 🟡Medium (140–180°C): pan-frying, soup, scrambled egg — even heat, both sides done. 🟢Low (100–140°C): braise, stew, keep warm — deep flavor, tender not burned. 🔵Keep warm (60–100°C): holding temp, setting steamed egg.',id:'🔴Besar (180°C+): tumis, menumis, merebus. 🟡Sedang (140–180°C): goreng, sup, telur orak-arik. 🟢Kecil (100–140°C): rebus lambat, semur. 🔵Hangat (60–100°C): menjaga suhu.',vi:'🔴Lớn (180°C+): xào, phi thơm, đun sôi. 🟡Vừa (140–180°C): chiên, nấu súp, trứng xào. 🟢Nhỏ (100–140°C): hầm, kho. 🔵Ấm (60–100°C): giữ nhiệt.'}},
      {icon:'🥢',zh:'竹筷測油溫（5段判斷法）',en:'Chopstick Oil Test (5 Levels)',desc:{zh:'將竹筷末端插入油中觀察：①無任何反應：油溫低於100°C，太冷勿下料。②出現細小緩慢氣泡：約120–140°C，適合低溫油浸（Oil poaching）。③持續穩定細氣泡：約160°C，一般炸物最佳溫度，外皮酥脆。④快速大量氣泡：約180°C，適合迅速上色的快炸。⑤劇烈冒泡+白煙：超過200°C，過熱危險，立即關小火！',en:'Insert dry chopstick end into oil: ①No reaction: below 100°C — too cold. ②Small slow bubbles: 120–140°C — oil poaching. ③Steady small bubbles: ~160°C — ideal for most frying, crispy result. ④Rapid large bubbles: ~180°C — quick fry for browning. ⑤Violent bubbles + white smoke: 200°C+ — dangerously hot, reduce heat immediately!',id:'Masukkan ujung sumpit ke dalam minyak: ①Tidak ada reaksi: di bawah 100°C. ②Gelembung kecil lambat: 120–140°C. ③Gelembung kecil stabil: ~160°C ideal. ④Gelembung besar cepat: ~180°C. ⑤Gelembung hebat + asap: 200°C+, kurangi api!',vi:'Cắm đũa vào dầu: ①Không phản ứng: dưới 100°C. ②Bong bóng nhỏ chậm: 120–140°C. ③Bong bóng nhỏ ổn định: ~160°C — lý tưởng. ④Bong bóng lớn nhanh: ~180°C. ⑤Sôi bùng + khói trắng: 200°C+, nguy hiểm!'}},
      {icon:'🍳',zh:'六大烹調法火候對應',en:'6 Cooking Methods × Heat Level',desc:{zh:'①快炒（Stir-fry）→大火全程。②炸（Deep-fry）→中大火維持160–180°C。③煎（Pan-fry）→中火，下鍋前先熱鍋至水滴即蒸發。④蒸（Steam）→中大火保持蒸氣量足夠。⑤燉滷（Braise）→大火燒開後轉小火維持微沸。⑥烤（Bake/Roast）→依食材：雞肉190°C、蛋糕170°C、麵包220°C。',en:'①Stir-fry → high heat throughout. ②Deep-fry → medium-high, hold 160–180°C. ③Pan-fry → medium; hot pan test: water droplet evaporates instantly. ④Steam → medium-high, maintain good steam. ⑤Braise → bring to boil on high, then reduce to low simmer. ⑥Bake/Roast → chicken 190°C, cake 170°C, bread 220°C.',id:'①Tumis → api besar. ②Goreng → sedang-besar, 160–180°C. ③Goreng datar → sedang, uji panas wajan. ④Kukus → sedang-besar. ⑤Rebus lambat → besar lalu kecil. ⑥Panggang → ayam 190°C, kue 170°C, roti 220°C.',vi:'①Xào → lửa lớn suốt. ②Chiên ngập → lửa vừa-lớn, giữ 160–180°C. ③Chiên chảo → lửa vừa. ④Hấp → lửa vừa-lớn. ⑤Hầm → sôi lửa lớn rồi giảm lửa nhỏ. ⑥Nướng → gà 190°C, bánh 170°C, bánh mì 220°C.'}},
      {icon:'📊',zh:'鍋具材質與導熱特性',en:'Pan Material & Heat Characteristics',desc:{zh:'①不鏽鋼：導熱均勻但慢，耐高溫，適合煎肉上色。使用前需充分預熱（30–60秒）。②鑄鐵：保溫性極佳，適合長時間燉煮和烤箱使用，但很重、需要開鍋養護。③不沾鍋：中小火使用，勿空燒，不可使用金屬鏟，壽命約2–3年需更換。④銅鍋：導熱最快、最均勻，專業廚房首選，價格高。選擇原則：新手推薦不沾鍋，進階推薦不鏽鋼。',en:'①Stainless steel: even but slow heat, high-temp safe, good searing — preheat 30–60 sec. ②Cast iron: excellent heat retention, ideal for long braises and oven use — heavy, needs seasoning. ③Non-stick: medium-low heat only, no empty heating, no metal utensils, replace every 2–3 years. ④Copper: fastest and most even heat, professional choice, expensive. Recommendation: non-stick for beginners, stainless for advanced.',id:'①Stainless: panas merata tapi lambat, tahan suhu tinggi. ②Besi cor: retensi panas sangat baik. ③Anti lengket: api sedang-kecil saja, ganti tiap 2–3 tahun. ④Tembaga: panas paling merata, mahal.',vi:'①Thép không gỉ: nhiệt đều nhưng chậm. ②Gang: giữ nhiệt tốt, nặng. ③Chống dính: lửa vừa-nhỏ, thay 2–3 năm. ④Đồng: nhanh nhất và đều nhất, đắt tiền.'}}
    ],

    tip:{zh:'💡 「鍋熱油冷食材新」是炒出鑊氣的關鍵：①大火把鍋燒到冒煙。②再下冷油搖均。③油溫升起後立刻下食材大火快炒。這樣食材不黏鍋、快速上色、保留鮮脆！',en:'💡 \"Hot pan, cool oil, fresh ingredients\" — the secret to wok hei: ①Heat pan until it smokes on high. ②Add cold oil and swirl. ③Once oil shimmers, add ingredients and stir-fry fast. Result: nothing sticks, quick browning, crispy texture!',id:'💡 \"Wajan panas, minyak dingin, bahan segar\" — rahasia wok hei: ①Panaskan wajan sampai berasap. ②Tambah minyak dingin. ③Segera tambah bahan dan tumis cepat.',vi:'💡 \"Chảo nóng, dầu nguội, nguyên liệu tươi\" — bí quyết wok hei: ①Đun nóng chảo đến khi bốc khói. ②Cho dầu lạnh vào xoáy đều. ③Khi dầu nóng, cho nguyên liệu vào xào nhanh.'}

  /* Lv4 食材保存 ── 大幅擴充 */
  {
    title:{zh:'食材保存完全指南',en:'Complete Food Storage Guide',id:'Panduan Lengkap Penyimpanan Bahan',vi:'Hướng dẫn bảo quản thực phẩm toàn diện'},
    visual:{
      title:{zh:'冰箱分層黃金佈局',en:'Optimal Fridge Layout'},
      html:`<div style="border:2px solid #aaa;border-radius:10px;overflow:hidden;font-size:10.5px;max-width:420px;margin:0 auto">
        <div style="background:#c0d8f0;padding:6px 10px;text-align:center;font-weight:600;font-size:11px;color:#1a2a4a">🚪 冰箱門架 / Door Shelf — ⚠️ 溫度最不穩定</div>
        <div style="padding:4px 8px;border-bottom:1px dashed #ccc;background:#e8f5ee;display:flex;gap:8px;align-items:center">
          <span style="font-size:16px">🍳</span>
          <div><strong style="color:#1a5c30">上層</strong> — 熟食・剩菜・起司<br><span style="color:#555">Cooked food · Leftovers · Cheese</span></div>

        <div style="padding:4px 8px;border-bottom:1px dashed #ccc;background:#f5f5f5;display:flex;gap:8px;align-items:center">
