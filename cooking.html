        <div style="padding:4px 8px;border-bottom:1px dashed #ccc;background:#fdecea;display:flex;gap:8px;align-items:center">
          <span style="font-size:16px">🥩</span>
          <div><strong style="color:#b71c1c">下層（最冷）</strong> — 生肉・生禽・生海鮮<br><span style="color:#555">Raw meat · Poultry · Seafood</span></div>
        </div>
        <div style="padding:4px 8px;background:#d4edda;display:flex;gap:8px;align-items:center">
          <span style="font-size:16px">🥦</span>
          <div><strong style="color:#1a5c30">蔬果抽屜</strong> — 葉菜・水果・蔬菜<br><span style="color:#555">Produce drawer · High humidity</span></div>
        </div>
      </div>
      <div style="margin-top:6px;font-size:10.5px;color:#888;text-align:center">冰箱設定 3–5°C ｜ 冷凍設定 -18°C 以下</div>`
    },
    items:[
      {icon:'🌡️',zh:'溫度帶完整對照',en:'Complete Temperature Reference',desc:{zh:'🔵冷凍（-18°C以下）：細菌完全停止繁殖，可長期保存。❄️冷藏（3–5°C）：細菌生長緩慢，短期保存安全。⚠️危險溫度帶（5–60°C）：細菌每20分鐘繁殖一倍，食物不可停留超過2小時。✅安全熟食（75°C+）：多數病原菌（含沙門氏菌、大腸桿菌）在此溫度1分鐘內死亡。🔴保溫（60°C以上）：熟食可安全保溫，但超過4小時品質下降。',en:'🔵Freezer (-18°C below): bacteria inactive, long-term storage. ❄️Fridge (3–5°C): slow growth, safe short-term. ⚠️Danger zone (5–60°C): bacteria double every 20 min, max 2 hours. ✅Safe cook temp (75°C+): kills Salmonella, E.coli in 1 min. 🔴Hot hold (60°C+): safe holding, but quality drops after 4 hours.',id:'🔵Freezer (-18°C): bakteri tidak aktif. ❄️Kulkas (3–5°C): pertumbuhan lambat. ⚠️Zona bahaya (5–60°C): bakteri berlipat ganda tiap 20 menit, maks 2 jam. ✅Suhu masak aman (75°C+): membunuh bakteri. 🔴Pemanas (60°C+): aman, tapi kualitas turun setelah 4 jam.',vi:'🔵Tủ đông (-18°C): vi khuẩn bất hoạt. ❄️Tủ lạnh (3–5°C): tăng trưởng chậm. ⚠️Vùng nguy hiểm (5–60°C): vi khuẩn nhân đôi mỗi 20 phút, tối đa 2 giờ. ✅Nhiệt độ nấu an toàn (75°C+): tiêu diệt vi khuẩn. 🔴Giữ ấm (60°C+): an toàn, nhưng chất lượng giảm sau 4 giờ.'}},
      {icon:'❄️',zh:'冷藏食材保存期限表',en:'Refrigerator Shelf Life Table',desc:{zh:'🥩生肉（豬牛）：1–2天。🍗生禽肉：1–2天。🐟生魚海鮮：1–2天（越新鮮越好，當天食用最佳）。🥚雞蛋：3–4週（直立尖端朝下保鮮更久）。🥦葉菜類：3–5天（套袋後放蔬果抽屜）。🧀起司：軟質7–14天、硬質1個月。🍳熟食：2–3天（密封容器冷藏）。注意：超過期限即使外觀正常也可能已有細菌增殖，請確認後再食用。',en:'🥩Raw pork/beef: 1–2 days. 🍗Raw poultry: 1–2 days. 🐟Raw fish/seafood: 1–2 days (eat same day if possible). 🥚Eggs: 3–4 weeks (store pointed end down). 🥦Leafy veg: 3–5 days (bag + produce drawer). 🧀Cheese: soft 7–14 days, hard 1 month. 🍳Cooked food: 2–3 days (sealed container). Note: past date = may have bacteria even if looks normal.',id:'🥩Daging mentah: 1–2 hari. 🍗Unggas mentah: 1–2 hari. 🐟Ikan/seafood: 1–2 hari. 🥚Telur: 3–4 minggu. 🥦Sayuran daun: 3–5 hari. 🧀Keju: lunak 7–14 hari, keras 1 bulan. 🍳Makanan matang: 2–3 hari.',vi:'🥩Thịt heo/bò sống: 1–2 ngày. 🍗Gia cầm sống: 1–2 ngày. 🐟Cá/hải sản sống: 1–2 ngày. 🥚Trứng: 3–4 tuần. 🥦Rau lá: 3–5 ngày. 🧀Phô mai: mềm 7–14 ngày, cứng 1 tháng. 🍳Thức ăn chín: 2–3 ngày.'}},
      {icon:'🧊',zh:'冷凍食材保存期限表',en:'Freezer Shelf Life Table',desc:{zh:'🥩生牛豬肉：3–4個月。🍗生禽肉：9–12個月。🐟生魚：3–6個月。🦐蝦貝類：3–6個月。🥦燙熟蔬菜：8–12個月（生蔬菜不宜直接冷凍，組織會損壞）。🍚白飯：1–2個月（分裝密封袋）。重要提醒：冷凍只能抑制細菌、不能殺菌；解凍後請儘快食用，不可重複冷凍！',en:'🥩Raw beef/pork: 3–4 months. 🍗Raw poultry: 9–12 months. 🐟Raw fish: 3–6 months. 🦐Shrimp/shellfish: 3–6 months. 🥦Blanched veg: 8–12 months (raw veg cells break in freezer). 🍚Cooked rice: 1–2 months (in sealed portions). Important: freezing suppresses bacteria but does not kill; thaw and use quickly, never refreeze!',id:'🥩Daging sapi/babi: 3–4 bulan. 🍗Unggas: 9–12 bulan. 🐟Ikan: 3–6 bulan. 🦐Udang: 3–6 bulan. 🥦Sayuran blanched: 8–12 bulan. 🍚Nasi: 1–2 bulan. Penting: jangan bekukan ulang!',vi:'🥩Thịt bò/heo: 3–4 tháng. 🍗Gia cầm: 9–12 tháng. 🐟Cá: 3–6 tháng. 🦐Tôm/nghêu: 3–6 tháng. 🥦Rau chần: 8–12 tháng. 🍚Cơm: 1–2 tháng. Quan trọng: không tái đông lạnh!'}},
      {icon:'🔄',zh:'正確解凍3大方法',en:'3 Safe Thawing Methods',desc:{zh:'✅方法①冷藏解凍（最安全）：提前一晚放入冷藏室（4°C），全程保持低溫。大型肉塊需24–48小時。✅方法②冷水解凍（較快）：密封袋裝好食材後浸泡冷水，每30分鐘換水一次，1–2小時完成。✅方法③微波解凍（最快）：使用微波爐解凍模式，解凍後需立即烹調。❌禁止：在室溫下隔夜解凍（5–60°C危險帶）、用熱水解凍（外層已進入危險帶而內部仍凍）。',en:'✅①Fridge thaw (safest): overnight at 4°C. Large cuts need 24–48 hours. ✅②Cold water thaw (faster): sealed bag in cold water, change water every 30 min, done in 1–2 hours. ✅③Microwave thaw (fastest): use defrost mode; cook immediately after. ❌NEVER: room temperature overnight (danger zone), hot water (outside in danger zone while inside still frozen).',id:'✅①Pencairan kulkas (paling aman): semalam di 4°C. ✅②Air dingin (lebih cepat): kantong tertutup dalam air dingin, ganti air tiap 30 menit. ✅③Microwave (tercepat): gunakan mode defrost, masak segera. ❌JANGAN: suhu ruang semalam, air panas.',vi:'✅①Rã đông tủ lạnh (an toàn nhất): qua đêm ở 4°C. ✅②Nước lạnh (nhanh hơn): túi kín trong nước lạnh, thay nước 30 phút/lần. ✅③Lò vi sóng (nhanh nhất): dùng chế độ rã đông, nấu ngay. ❌KHÔNG: để ở nhiệt độ phòng qua đêm, dùng nước nóng.'}},
      {icon:'🏺',zh:'常溫食材保存技巧',en:'Room Temperature Storage Tips',desc:{zh:'根莖類：馬鈴薯、洋蔥、大蒜→避光通風陰涼處，2–4週。地瓜→勿與馬鈴薯放一起（地瓜會讓馬鈴薯發芽加速）。番茄→未熟番茄室溫催熟，已熟轉冷藏。香蕉→與其他水果分開放（香蕉會加速其他水果老化）。米→密封防潮防蟲，6個月。乾燥穀物、豆類→密封容器保存6–12個月。',en:'Root veg: potatoes, onions, garlic → dark, ventilated, cool; 2–4 weeks. Sweet potato → keep away from potatoes (accelerates sprouting). Tomatoes → ripen on counter, refrigerate when ripe. Bananas → separate from other fruit (ethylene speeds ripening of others). Rice → sealed, cool, dry; 6 months. Dry grains/legumes → sealed container, 6–12 months.',id:'Sayuran akar: kentang, bawang, bawang putih → tempat gelap, ventilasi. Ubi jalar → pisahkan dari kentang. Tomat → matangkan di suhu ruang, simpan di kulkas saat matang. Pisang → pisahkan dari buah lain.',vi:'Rau củ: khoai tây, hành, tỏi → nơi tối, thông gió. Khoai lang → tách khỏi khoai tây. Cà chua → chín ở nhiệt độ phòng, rồi để tủ lạnh. Chuối → tách khỏi trái cây khác.'}},
      {icon:'📦',zh:'冰箱收納黃金佈局',en:'Optimal Fridge Layout',desc:{zh:'冰箱分層原則（由上至下）：🏅上層（最穩定溫度）：熟食、剩菜、起司——直接食用的食品放最上層，防止被生食汁液汙染。🥚中層：蛋類、乳製品、醬料——溫度穩定，不受開關門影響。🥩下層（最冷）：生肉、生禽、生海鮮——分開密封包裝，防止汁液滴落汙染下方。🥦蔬果抽屜：葉菜、水果——高濕度保鮮。🚪門架：飲料、調味料——溫度最不穩定，不放蛋和生肉。',en:'Fridge zone layout (top to bottom): 🏅Upper (most stable temp): cooked food, leftovers, cheese — ready-to-eat at top, never contaminated by raw drips. 🥚Middle: eggs, dairy, condiments — stable temp away from door fluctuation. 🥩Lower (coldest): raw meat, poultry, seafood — sealed separately to contain drips. 🥦Produce drawer: veg and fruit — high humidity. 🚪Door shelf: drinks, sauces — unstable temp, never store eggs or raw meat here.',id:'Tata letak kulkas (atas ke bawah): 🏅Atas: makanan matang. 🥚Tengah: telur, susu. 🥩Bawah: daging mentah. 🥦Laci sayuran. 🚪Rak pintu: minuman, saus.',vi:'Bố trí tủ lạnh (trên xuống): 🏅Trên: thức ăn chín. 🥚Giữa: trứng, sữa. 🥩Dưới: thịt sống. 🥦Ngăn rau. 🚪Cửa: nước uống, gia vị.'}}
    ],

    tip:{zh:'💡 保存食材的「FIFO 原則」（先進先出）：新買的食材放後面，舊的移前面，每次從最前面取用。在食材上貼日期標籤，這個習慣可以減少家庭食材浪費30%以上！',en:'💡 FIFO (First In, First Out): put new items behind, old ones in front, always take from the front. Label food with dates — this habit alone can cut household food waste by 30%+!',id:'💡 FIFO (First In, First Out): letakkan barang baru di belakang, lama di depan. Beri label tanggal — kebiasaan ini bisa mengurangi pemborosan makanan 30%+!',vi:'💡 Nguyên tắc FIFO (nhập trước xuất trước): để đồ mới phía sau, cũ phía trước. Ghi nhãn ngày — thói quen này giúp giảm lãng phí thực phẩm hơn 30%!'}

  {

    visual:{

    items:[
      {icon:'🥢',zh:'炒 Stir-fry',en:'Stir-fry — 大火快炒',desc:{zh:'大火+少油+快速翻炒，全程不超過3–5分鐘。適合葉菜、嫩肉、海鮮。關鍵技巧：①鍋要夠熱（冒煙再下油）。②食材要乾燥（水分多會降溫出水）。③分批下鍋（一次太多食材降溫）。④醬料最後30秒下鍋。成功標誌：食材保持翠綠脆口、帶有鑊氣香氣。',en:'High heat + little oil + rapid tossing, max 3–5 min. Best for leafy veg, tender meat, seafood. Keys: ①Pan must be very hot (smoke before oil). ②Ingredients must be dry (moisture lowers temp). ③Fry in batches (too much food = temperature drop). ④Sauce in last 30 sec. Success: green color preserved, crispy texture, wok hei aroma.',id:'Api besar + sedikit minyak + aduk cepat, maks 3–5 menit. Terbaik untuk sayuran daun, daging muda, seafood. Kunci: ①Wajan sangat panas. ②Bahan harus kering. ③Masak bertahap. ④Saus di 30 detik terakhir.',vi:'Lửa lớn + ít dầu + đảo nhanh, tối đa 3–5 phút. Tốt cho rau lá, thịt non, hải sản. Bí quyết: ①Chảo phải rất nóng. ②Nguyên liệu phải khô. ③Chiên từng mẻ. ④Nước sốt vào 30 giây cuối.'}},
      {icon:'🫕',zh:'燉滷 Braise',en:'Braise/Stew — 小火慢煮',desc:{zh:'液體（水/高湯/醬油）+小火慢煮30分鐘–數小時，適合豬腳、牛腩、滷蛋、豆乾、根莖類。關鍵技巧：①大火燒開後轉小火（維持微沸，非滾沸）。②前30分鐘加蓋，後段開蓋收汁。③加入八角、月桂葉、桂皮等香料可增加層次。④滷汁可反覆使用（老滷），風味越陳越香。成功標誌：肉質軟爛入味、湯汁濃稠香醇。',en:'Liquid (water/broth/soy sauce) + low heat for 30 min–hours. Best for pork knuckle, beef brisket, braised eggs, tofu, root veg. Keys: ①Boil first then reduce to low (gentle simmer, not rolling boil). ②Lid on first 30 min, lid off to reduce later. ③Add star anise, bay leaf, cinnamon for depth. ④Braise liquid can be reused (master stock). Success: tender, flavorful, rich reduced broth.',id:'Cairan + api kecil selama 30 menit–berjam-jam. Terbaik untuk kaki babi, iga sapi, telur rebus, tahu. Kunci: ①Didihkan lalu kecilkan api. ②Tutup 30 menit pertama, buka untuk mengurangi. ③Tambahkan rempah untuk kedalaman rasa. ④Kaldu bisa digunakan berulang.',vi:'Dịch + lửa nhỏ 30 phút đến vài giờ. Tốt cho giò heo, brisket, trứng kho, đậu hũ, rau củ. Bí quyết: ①Đun sôi rồi giảm lửa nhỏ. ②Đậy nắp 30 phút đầu, mở nắp để cạn. ③Thêm hồi, lá nguyệt quế, quế. ④Nước kho có thể dùng lại.'}},
      {icon:'♨️',zh:'蒸 Steam',en:'Steam — 中大火',desc:{zh:'蒸汽加熱（對流），不直接接觸水，最大程度保留食材原味、色澤與水溶性維生素。適合魚（清蒸）、蛋（茶碗蒸）、蔬菜（保色）、年糕點心。關鍵技巧：①水滾後再放食材（確保溫度足夠）。②蒸魚：中火蒸8–12分鐘（視厚度），不可過久（肉質變老）。③蒸蛋：小火或關火燜熟（避免氣泡蜂巢狀）。④起鍋時注意蒸汽燙傷，用布巾隔熱。',en:'Steam heat (convection) — no direct water contact, best for preserving water-soluble vitamins, color, and natural flavor. Best for fish (steamed), egg custard, vegetables (color preservation), dim sum. Keys: ①Wait for boiling before adding food. ②Fish: medium heat 8–12 min (by thickness), do not overcook. ③Egg custard: low heat or residual heat (prevents bubbles). ④Caution: steam burns when removing lid.',id:'Panas uap (konveksi), terbaik untuk vitamin larut air dan warna alami. Terbaik untuk ikan kukus, custard telur, sayuran, dim sum. Kunci: ①Tunggu hingga mendidih. ②Ikan: api sedang 8–12 menit. ③Custard telur: api kecil. ④Hati-hati uap panas.',vi:'Nhiệt hơi nước (đối lưu), tốt nhất để bảo tồn vitamin tan trong nước và màu sắc. Tốt cho cá hấp, trứng hấp, rau củ, dim sum. Bí quyết: ①Chờ sôi mới cho thức ăn vào. ②Cá: lửa vừa 8–12 phút. ③Trứng hấp: lửa nhỏ. ④Cẩn thận hơi nước bỏng.'}},
      {icon:'🍳',zh:'煎 Pan-fry',en:'Pan-fry — 中火',desc:{zh:'少油+平底鍋+中火，利用鍋面直接接觸加熱（傳導），兩面上色後內部熟透。適合雞腿排、豆腐、魚排、荷包蛋、漢堡排。關鍵技巧：①鍋熱油冷（下油後再加熱至閃爍再下食材）。②下鍋後不急著翻面（等自然釋放，不黏鍋時再翻）。③蓋上鍋蓋可縮短熟成時間（利用蒸汽）。④雞腿排皮面先下（逼出皮下油脂，皮更酥脆）。',en:'Little oil + flat pan + medium heat, direct contact cooking (conduction). Brown both sides then cooked through. Best for chicken thighs, tofu, fish fillet, fried eggs, burger patties. Keys: ①Hot pan, cool oil (add oil then heat until shimmering, then add food). ②Do not rush to flip (wait until it releases naturally — not sticking means ready). ③Cover with lid to speed cooking (steam assists). ④Chicken skin side down first (renders fat, crispier skin).',id:'Sedikit minyak + wajan datar + api sedang. Terbaik untuk paha ayam, tahu, fillet ikan, telur mata sapi, patty burger. Kunci: ①Wajan panas, minyak dingin. ②Jangan terburu-buru membalik. ③Tutup dengan penutup. ④Ayam: sisi kulit di bawah dulu.',vi:'Ít dầu + chảo phẳng + lửa vừa. Tốt cho đùi gà, đậu hũ, phi lê cá, trứng ốp la, bánh patty. Bí quyết: ①Chảo nóng, dầu nguội. ②Không vội lật. ③Đậy nắp để nhanh chín. ④Gà: da xuống trước.'}},
      {icon:'🔥',zh:'烤 Bake/Roast',en:'Bake/Roast — 烤箱加熱',desc:{zh:'烤箱以輻射熱與對流同時加熱食材，不需翻炒，適合體積較大的食材。Bake（烘焙）180–200°C：蛋糕、麵包、餅乾。Roast（烤制）190–220°C：雞腿、豬肋排、蔬菜。關鍵技巧：①烤箱預熱10–15分鐘（溫度不穩影響熟度）。②雞肉中心溫度需達75°C。③烤蔬菜前淋橄欖油+撒鹽，平鋪不重疊（重疊會悶蒸而非烤脆）。④最後5分鐘開上火（Broil）可快速上色增香。',en:'Oven uses radiant + convection heat simultaneously, great for large items. Bake 180–200°C: cakes, bread, cookies. Roast 190–220°C: chicken, ribs, vegetables. Keys: ①Preheat 10–15 min (unstable temp = uneven cooking). ②Chicken must reach 75°C internal. ③Toss veg in olive oil + salt, spread in single layer (overlapping = steaming not crisping). ④Last 5 min broil for quick browning.',id:'Oven menggunakan panas radiasi + konveksi. Bake 180–200°C: kue, roti. Roast 190–220°C: ayam, iga babi, sayuran. Kunci: ①Panaskan oven 10–15 menit. ②Ayam harus 75°C internal. ③Sayuran: minyak + garam, sebar rata. ④5 menit terakhir: broil untuk kecokelatan.',vi:'Lò nướng dùng nhiệt bức xạ + đối lưu. Nướng 180–200°C: bánh, bánh mì. Quay 190–220°C: gà, sườn, rau. Bí quyết: ①Làm nóng lò 10–15 phút. ②Gà phải đạt 75°C bên trong. ③Rau: dầu + muối, trải đều. ④5 phút cuối: broil để vàng.'}},
      {icon:'🫧',zh:'炸 Deep-fry',en:'Deep-fry — 浸油加熱',desc:{zh:'食材完全浸入熱油（160–180°C）中加熱，快速形成酥脆外皮。適合雞塊、薯條、天婦羅、油條。關鍵技巧：①油量：食材完全浸沒，鍋不超過1/3滿。②溫度控制：入鍋降溫→提高火力補溫，維持160–180°C。③食材先擦乾（水分爆油危險）。④炸完撈起後放廚房紙巾吸油。⑤廢油不可倒入水槽，冷卻後裝袋丟棄或送至回收點。安全：全程不離開爐邊，無蓋操作！',en:'Food fully submerged in hot oil (160–180°C), rapidly forming crispy crust. Best for fried chicken, fries, tempura, crullers. Keys: ①Oil level: food fully covered, never fill pot over 1/3. ②Temperature: compensate when food drops temp, hold 160–180°C. ③Pat food completely dry (moisture causes oil splatter). ④Drain on paper towels after frying. ⑤Dispose of used oil properly (not down the drain). Safety: NEVER leave stove unattended, NEVER cover!',id:'Makanan direndam penuh dalam minyak panas (160–180°C). Kunci: ①Minyak: tutupi makanan, jangan lebih dari 1/3 panci. ②Suhu: pertahankan 160–180°C. ③Keringkan makanan sebelum digoreng. ④Tiriskan di atas tisu. ⑤Buang minyak bekas dengan benar.',vi:'Thực phẩm ngập hoàn toàn trong dầu nóng (160–180°C). Bí quyết: ①Dầu: ngập thức ăn, không quá 1/3 nồi. ②Nhiệt độ: giữ 160–180°C. ③Lau khô thức ăn trước. ④Để ráo trên giấy thấm. ⑤Xử lý dầu thải đúng cách.'}}
    ],
    safeRows:[
      {ok:true,zh:'炒菜前確認鍋子已充分熱鍋（冒煙）再下油',en:'Ensure pan is fully hot (smoking) before adding oil for stir-fry'},
      {ok:true,zh:'炸物食材下鍋前用廚房紙巾徹底擦乾水分',en:'Pat frying ingredients completely dry before adding to hot oil'},
      {ok:true,zh:'蒸魚用溫度計確認中心溫度達63°C以上',en:'Use thermometer to confirm fish center reaches 63°C when steaming'},
      {ok:true,zh:'烤箱使用前預熱10–15分鐘',en:'Preheat oven 10–15 minutes before use'},
      {ok:true,zh:'炸油量不超過鍋深1/3，全程不離爐邊',en:'Keep frying oil below 1/3 of pot depth; never leave stove unattended'},
      {ok:false,zh:'炸物時蓋上鍋蓋（蒸汽積累，掀蓋時爆噴）',en:'Covering pot during deep-frying (steam buildup causes dangerous splatter on opening)'},
      {ok:false,zh:'未擦乾的食材直接放入熱油（水油爆炸性噴濺）',en:'Adding wet food directly to hot oil (water causes explosive splattering)'},
      {ok:false,zh:'憑外觀顏色判斷雞肉是否熟透（應以溫度計為準）',en:'Judging chicken doneness by color alone (always verify with a thermometer)'}
    ],
    tip:{zh:'💡 烹調方式選擇口訣：「嫩炒蒸、韌燉滷、薄煎烤、炸酥脆」。健康優先選蒸，鮮味優先選炒，軟爛入味選燉，外皮酥脆選炸。依食材質地和目標口感靈活搭配！',en:'💡 Cooking method mantra: \"Tender→stir-fry/steam; Tough→braise; Thin→pan-fry/roast; Crispy→deep-fry.\" Health first=steam; fresh flavor=stir-fry; tender and savory=braise; crunch=fry. Choose by texture goal!',id:'💡 Tips: \"Lembut→tumis/kukus; Keras→rebus; Tipis→goreng/panggang; Renyah→goreng rendam.\" Pilih berdasarkan tekstur yang diinginkan!',vi:'💡 Mẹo: \"Non→xào/hấp; Dai→hầm; Mỏng→chiên/nướng; Giòn→chiên ngập.\" Sức khỏe=hấp; hương vị tươi=xào; mềm đậm=hầm; giòn=chiên. Chọn theo mục tiêu kết cấu!'}
  },
  /* Lv6 食品衛生 ── 擴充 */
  {
    title:{zh:'食品衛生完全指南',en:'Complete Food Hygiene Guide',id:'Panduan Lengkap Kebersihan Pangan',vi:'Hướng dẫn vệ sinh thực phẩm toàn diện'},
    visual:{
      title:{zh:'砧板顏色分色系統 & 七步洗手圖解',en:'Color Board System & 7-Step Handwashing'},
      html:`<div style="display:flex;gap:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:160px">
          <div style="font-size:10.5px;font-weight:600;color:#8a2800;margin-bottom:5px">🎨 砧板顏色系統 (HACCP)</div>
          <div style="display:flex;flex-direction:column;gap:3px">
            <div style="display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:5px;background:#fdecea;border:1px solid #f5c6c2"><span style="font-size:14px">🔴</span><span style="font-size:10.5px"><strong>紅</strong> — 生肉（豬牛羊）Raw meat</span></div>
            <div style="display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:5px;background:#fff8e1;border:1px solid #ffe082"><span style="font-size:14px">🟡</span><span style="font-size:10.5px"><strong>黃</strong> — 生禽肉（雞鴨）Raw poultry</span></div>
            <div style="display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:5px;background:#e3f2fd;border:1px solid #90caf9"><span style="font-size:14px">🔵</span><span style="font-size:10.5px"><strong>藍</strong> — 生海鮮（魚蝦蟹）Raw seafood</span></div>
            <div style="display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:5px;background:#e8f5e9;border:1px solid #a5d6a7"><span style="font-size:14px">🟢</span><span style="font-size:10.5px"><strong>綠</strong> — 蔬果 Produce</span></div>
            <div style="display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:5px;background:#f5f5f5;border:1px solid #bdbdbd"><span style="font-size:14px">⬜</span><span style="font-size:10.5px"><strong>白</strong> — 熟食 Cooked food</span></div>
            <div style="display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:5px;background:#efebe9;border:1px solid #bcaaa4"><span style="font-size:14px">🟤</span><span style="font-size:10.5px"><strong>棕</strong> — 烘焙麵包 Bakery</span></div>
          </div>
        </div>
        <div style="flex:1;min-width:160px">
          <div style="font-size:10.5px;font-weight:600;color:#8a2800;margin-bottom:5px">🙌 七步洗手法（各20秒）</div>
          <div style="display:flex;flex-direction:column;gap:3px">
            <div style="padding:3px 7px;border-radius:4px;background:#f0f4ff;border:1px solid #c5cae9;font-size:10px">① 濕潤雙手，塗抹洗手液</div>
            <div style="padding:3px 7px;border-radius:4px;background:#f0f4ff;border:1px solid #c5cae9;font-size:10px">② 手心相對，搓洗手掌</div>
            <div style="padding:3px 7px;border-radius:4px;background:#f0f4ff;border:1px solid #c5cae9;font-size:10px">③ 手心蓋手背，搓洗手背（左右互換）</div>
            <div style="padding:3px 7px;border-radius:4px;background:#f0f4ff;border:1px solid #c5cae9;font-size:10px">④ 十指交叉，搓洗指縫</div>
            <div style="padding:3px 7px;border-radius:4px;background:#f0f4ff;border:1px solid #c5cae9;font-size:10px">⑤ 握住拇指旋轉搓洗</div>
            <div style="padding:3px 7px;border-radius:4px;background:#f0f4ff;border:1px solid #c5cae9;font-size:10px">⑥ 指尖在掌心打圈搓洗</div>
            <div style="padding:3px 7px;border-radius:4px;background:#e8f5ee;border:1px solid #a5d6a7;font-size:10px">⑦ 流水沖淨，紙巾擦乾 ✓</div>
          </div>
          <div style="margin-top:4px;font-size:10px;color:#888">全程至少 20 秒 = 哼兩次生日快樂歌</div>
        </div>
      </div>`
    },
    items:[
      {icon:'🙌',zh:'七步洗手法（完整版）',en:'7-Step Handwashing (Full Version)',desc:{zh:'①濕潤雙手（流水）②塗抹洗手液 ③搓洗手掌（手心相對搓） ④搓洗手背（手心蓋手背，左右互換） ⑤搓洗指縫（十指交叉） ⑥搓洗拇指（另一手握住旋轉）⑦搓洗指尖（指尖在掌心打圈）。全程至少20秒（等同哼兩次「生日快樂歌」）。最後以流水沖淨，用乾淨紙巾擦乾。必須洗手時機：處理食物前、如廁後、碰觸生肉後、打噴嚏/咳嗽後、觸碰手機/金錢後。',en:'①Wet hands ②Apply soap ③Rub palms ④Rub backs (alternate) ⑤Interlace fingers ⑥Rub thumbs (rotate) ⑦Rub fingertips in palm. Total: 20 seconds minimum (sing \"Happy Birthday\" twice). Rinse well, dry with clean paper towel. Mandatory times: before handling food, after toilet, after raw meat contact, after sneezing/coughing, after phone/money.',id:'①Basahi ②Sabun ③Telapak ④Punggung (bergantian) ⑤Sela jari ⑥Ibu jari (putar) ⑦Ujung jari. Total: minimum 20 detik. Wajib: sebelum menangani makanan, setelah toilet, daging mentah, bersin/batuk, ponsel/uang.',vi:'①Làm ướt ②Xà phòng ③Lòng bàn tay ④Mu bàn tay (luân phiên) ⑤Giữa các ngón ⑥Ngón cái (xoay) ⑦Đầu ngón. Tổng cộng: tối thiểu 20 giây. Bắt buộc: trước khi xử lý thức ăn, sau khi đi vệ sinh, sau thịt sống, sau hắt hơi/ho, sau điện thoại/tiền.'}},
      {icon:'🎨',zh:'砧板顏色分色系統',en:'Color-Coded Cutting Board System',desc:{zh:'國際廚房分色標準（HACCP）：🔴紅=生肉（豬牛羊）。🟡黃=生禽肉（雞鴨）。🔵藍=生海鮮（魚蝦蟹）。🟢綠=蔬果、水果。⬜白=熟食（已煮熟可直接食用）。🟤棕=麵包、烘焙。分色管理能有效防止交叉汙染。砧板保養：每次使用後用熱水+清潔劑清洗；每週用稀釋漂白水（1:99比例）浸泡10分鐘消毒；有深刮痕的砧板應立即更換（刮痕藏菌）。',en:'International color system (HACCP): 🔴Red=raw meat (pork/beef/lamb). 🟡Yellow=raw poultry (chicken/duck). 🔵Blue=raw seafood (fish/shrimp/crab). 🟢Green=vegetables and fruit. ⬜White=cooked food (ready to eat). 🟤Brown=bread and bakery. Color coding prevents cross-contamination. Care: hot water + soap after each use; weekly soak in diluted bleach (1:99) for 10 min; replace boards with deep scratches immediately.',id:'Sistem warna internasional (HACCP): 🔴Merah=daging sapi/babi. 🟡Kuning=unggas. 🔵Biru=seafood. 🟢Hijau=sayuran/buah. ⬜Putih=matang. 🟤Coklat=roti. Perawatan: cuci dengan air panas setiap penggunaan; rendam pemutih encer (1:99) seminggu sekali; ganti jika ada goresan dalam.',vi:'Hệ thống màu quốc tế (HACCP): 🔴Đỏ=thịt đỏ sống. 🟡Vàng=gia cầm sống. 🔵Xanh=hải sản sống. 🟢Xanh lá=rau củ. ⬜Trắng=thức ăn chín. 🟤Nâu=bánh mì. Bảo quản: rửa nước nóng + xà phòng mỗi lần; ngâm nước tẩy pha loãng (1:99) 10 phút mỗi tuần; thay thớt có vết cắt sâu.'}},
      {icon:'🦠',zh:'食中毒四大原因',en:'4 Causes of Food Poisoning',desc:{zh:'① 汙染（Contamination）：生熟食交叉接觸、不潔環境或器具——預防：分色砧板、洗手、清潔廚具。② 增殖（Proliferation）：食物在5–60°C危險溫度帶停留過久（每20分鐘細菌量翻倍）——預防：熱食保持60°C以上，冷食保持5°C以下，室溫下不超過2小時。③ 加熱不足（Insufficient heating）：未達到足夠溫度殺滅病原菌——預防：肉類中心溫度75°C，蛋類全熟，海鮮蒸煮至肉質不透明。④ 個人衛生不良（Poor personal hygiene）：帶菌者的手直接汙染食物——預防：七步洗手、生病不進廚房、戴手套。',en:'①Contamination: raw/cooked cross-contact, dirty environment — prevent with color boards, handwashing, clean equipment. ②Proliferation: food left in danger zone 5–60°C (bacteria double every 20 min) — hot food above 60°C, cold food below 5°C, max 2 hours at room temp. ③Insufficient heating: not killing pathogens — meat center 75°C, eggs fully cooked, seafood opaque. ④Poor personal hygiene: carriers contaminate food — 7-step handwash, stay out of kitchen when ill, use gloves.',id:'①Kontaminasi: kontak silang mentah/matang — cegah dengan talenan berwarna dan cuci tangan. ②Proliferasi: makanan di zona bahaya 5–60°C — panas >60°C, dingin <5°C, maks 2 jam. ③Pemanasan tidak cukup: tidak membunuh patogen — daging 75°C. ④Kebersihan buruk: operator sakit = risiko kontaminasi.',vi:'①Ô nhiễm: tiếp xúc chéo sống/chín — phòng ngừa bằng thớt màu và rửa tay. ②Sinh sôi: để ở vùng nguy hiểm 5–60°C (vi khuẩn nhân đôi 20 phút) — nóng >60°C, lạnh <5°C, tối đa 2 giờ. ③Nấu không đủ: không diệt vi khuẩn — thịt 75°C. ④Vệ sinh kém: người bệnh = nguy cơ ô nhiễm.'}},
      {icon:'🧹',zh:'廚具清潔與消毒',en:'Utensil Cleaning & Disinfection',desc:{zh:'清潔流程（去汙→消毒→乾燥三步驟）：①清潔（去除可見汙垢）：溫水+清潔劑刷洗，油膩鍋具用小蘇打去油。②消毒（殺滅微生物）：沸水澆淋60秒、或紫外線燈照射20分鐘、或漂白水（1:99）浸泡10分鐘。③乾燥：自然晾乾或擦乾，避免潮濕環境（濕潤環境是細菌溫床）。不同廚具消毒頻率：砧板每週一次；刀具每次使用後手洗立即擦乾；海綿每週更換（海綿是廚房細菌最多的物品）。',en:'Cleaning flow (clean → disinfect → dry): ①Clean (remove visible dirt): warm water + dish soap; use baking soda for greasy pots. ②Disinfect (kill microorganisms): pour boiling water for 60 sec, OR UV lamp 20 min, OR diluted bleach (1:99) soak 10 min. ③Dry: air dry or towel dry — moisture breeds bacteria. Frequency: boards weekly; knives — hand wash and dry immediately after each use; sponges — replace weekly (most bacteria-laden kitchen item).',id:'Alur: bersihkan → disinfeksi → keringkan. ①Bersihkan: air hangat + sabun, gunakan baking soda untuk berminyak. ②Disinfeksi: air mendidih 60 detik, UV 20 menit, atau pemutih (1:99) 10 menit. ③Keringkan. Frekuensi: talenan mingguan; pisau langsung dicuci dan dikeringkan; spons ganti mingguan.',vi:'Quy trình: làm sạch → khử trùng → làm khô. ①Làm sạch: nước ấm + xà phòng, dùng baking soda cho đồ dầu mỡ. ②Khử trùng: nước sôi 60 giây, đèn UV 20 phút, hoặc nước tẩy (1:99) 10 phút. ③Làm khô. Tần suất: thớt hàng tuần; dao rửa và lau khô ngay sau mỗi lần; bọt biển thay hàng tuần.'}},
      {icon:'🌡️',zh:'溫度與食安的關係',en:'Temperature & Food Safety',desc:{zh:'關鍵溫度記憶口訣「3-5-60-75」：3°C = 冷藏最低安全溫度下限（不可超過5°C）。5°C = 細菌開始活躍繁殖（5–60°C為危險帶）。60°C = 保溫最低溫度（熟食必須保持60°C以上）。75°C = 食材中心溫度安全門檻（確保殺滅沙門氏菌、大腸桿菌）。特殊情況：帶殼蛋63°C（蛋黃半熟）或74°C（全熟）；絞肉類需達71°C；整塊牛排最低63°C（靜置3分鐘）。',en:'Key temperature mnemonic \"3-5-60-75\": 3°C = min fridge temp (must not exceed 5°C). 5°C = bacteria start multiplying fast (5–60°C is danger zone). 60°C = minimum hot-hold temp (cooked food must stay above). 75°C = safe center temp for most foods (kills Salmonella, E.coli). Exceptions: shell eggs 63°C (runny yolk) or 74°C (fully set); ground meat 71°C; whole steak min 63°C (rest 3 min).',id:'\"3-5-60-75\": 3°C=batas bawah kulkas. 5°C=bakteri mulai aktif. 60°C=suhu pemanasan minimum. 75°C=suhu pusat makanan yang aman. Khusus: telur 63°C atau 74°C; daging cincang 71°C; steak utuh min 63°C.',vi:'\"3-5-60-75\": 3°C=nhiệt độ tủ lạnh tối thiểu. 5°C=vi khuẩn bắt đầu nhân lên. 60°C=nhiệt độ giữ ấm tối thiểu. 75°C=nhiệt độ lõi an toàn. Ngoại lệ: trứng 63°C hoặc 74°C; thịt xay 71°C; bít tết nguyên miếng 63°C.'}},
      {icon:'🏷️',zh:'FIFO 先進先出原則',en:'FIFO — First In, First Out',desc:{zh:'FIFO是廚房食材管理最重要的原則：新買入的食材放在後方，舊食材移至前方，每次從最前方取用。執行方法：①冰箱：新食材推入後，舊食材拉出至前排。②乾貨架：新貨上架前，舊貨先下架移至前排。③食材貼標籤：以防水筆或標籤紙記錄開封日期，方便判斷先後順序。FIFO可減少食材浪費30%以上、降低過期食品造成食安事故的風險。',en:'FIFO is the most important kitchen stock-management principle: new items go behind, old items move to the front, always use from the front. How to execute: ①Fridge: push new items back, pull old items forward. ②Dry goods shelf: bring old stock forward before adding new. ③Label everything: use waterproof marker or sticker to record opening date. FIFO reduces food waste by 30%+ and lowers food safety risk from expired items.',id:'FIFO adalah prinsip manajemen bahan dapur terpenting: barang baru di belakang, lama di depan, ambil dari depan. Cara: ①Kulkas: dorong baru ke belakang, tarik lama ke depan. ②Rak kering: lama ke depan sebelum stok baru. ③Beri label: catat tanggal pembukaan. FIFO mengurangi pemborosan 30%+.',vi:'FIFO là nguyên tắc quản lý thực phẩm quan trọng nhất: hàng mới để sau, hàng cũ đưa ra trước, luôn lấy từ phía trước. Cách thực hiện: ①Tủ lạnh: đẩy hàng mới vào sau, kéo hàng cũ ra trước. ②Kệ khô: đưa hàng cũ ra trước khi nhập mới. ③Dán nhãn: ghi ngày mở hàng. FIFO giảm lãng phí 30%+.'}}
    ],

    tip:{zh:'💡 食安三原則記憶法「洗分煮」：洗=徹底洗手、清潔廚具；分=生熟食分開、分色砧板；煮=烹調達足夠溫度（75°C）。每次下廚前三秒鐘想一下這三個字，可以預防9成以上的食中毒事故。',en:'💡 Food safety mantra: \"CLEAN · SEPARATE · COOK\". Clean=thorough handwashing and equipment cleaning. Separate=raw from cooked, color-coded boards. Cook=reach safe temperatures (75°C center). Think these 3 words for 3 seconds before every cooking session — prevents 90%+ of food poisoning.',id:'💡 Mantra keamanan pangan: \"BERSIH · PISAH · MASAK\". Bersih=cuci tangan dan peralatan. Pisah=mentah dari matang. Masak=suhu aman (75°C). Pikirkan 3 kata ini sebelum memasak.',vi:'💡 Khẩu hiệu an toàn thực phẩm: \"SẠCH · TÁCH · NẤU\". Sạch=rửa tay và dụng cụ. Tách=sống khỏi chín. Nấu=đạt nhiệt độ an toàn (75°C). Nghĩ 3 từ này trước mỗi lần nấu.'}

    items:[
      {icon:'🥗',zh:'均衡餐盤原則',en:'Balanced Plate Principles',desc:{zh:'Harvard健康餐盤比例：🥦蔬菜½（深色蔬菜優先：花椰菜、菠菜、紅蘿蔔；澱粉蔬菜如馬鈴薯不計入）。🍗蛋白質¼（多樣化輪換：魚2次/週、禽肉2次/週、豆腐1次、蛋2–3次；盡量減少紅肉和加工肉品）。🌾全穀類¼（糙米、地瓜、燕麥、全麥麵包；白飯、白麵條較低纖維）。補充：每餐3種顏色以上食材；搭配水（不是含糖飲料）；健康油脂（橄欖油、堅果少量）。',en:'Harvard Healthy Plate: 🥦Veg ½ (dark veg priority: broccoli, spinach, carrot; starchy veg like potato doesn\'t count). 🍗Protein ¼ (rotate: fish 2x/week, poultry 2x, tofu 1x, eggs 2–3x; minimize red and processed meat). 🌾Whole grains ¼ (brown rice, sweet potato, oats, whole wheat; white rice/noodles lower fiber). Plus: 3+ colors per meal; water not sugary drinks; healthy fats (olive oil, nuts in moderation).',id:'Piring Sehat Harvard: 🥦Sayuran ½ (sayuran gelap: brokoli, bayam, wortel). 🍗Protein ¼ (rotasi: ikan 2x/minggu, unggas 2x, tahu 1x, telur 2–3x). 🌾Biji-bijian utuh ¼ (beras merah, ubi jalar, oat). Tambahan: 3+ warna per makan; air, bukan minuman manis.',vi:'Đĩa Khỏe Harvard: 🥦Rau ½ (rau tối màu: bông cải, rau bina, cà rốt). 🍗Protein ¼ (xoay: cá 2x/tuần, gia cầm 2x, đậu hũ 1x, trứng 2–3x). 🌾Ngũ cốc nguyên hạt ¼ (gạo lứt, khoai lang, yến mạch). Thêm: 3+ màu mỗi bữa; nước lọc, không đồ uống đường.'}},
      {icon:'📅',zh:'一週菜單設計框架',en:'Weekly Menu Design Framework',desc:{zh:'規劃步驟：①確認家庭成員人數與特殊飲食需求（過敏、素食、慢性病）。②決定每日主蛋白質來源，同一蛋白質不連續兩天出現。③選擇當週當季蔬菜（通常最便宜也最新鮮）。④考量烹調時間：週間忙碌選快手菜（30分鐘內），週末可選費時料理。⑤確保週內有至少2次魚類料理。示範週菜單：週一雞/週二魚/週三豆腐/週四豬/週五蛋/週六牛/週日海鮮，蔬菜每日輪換不重複。',en:'Planning steps: ①Confirm household size and dietary needs (allergies, vegetarian, chronic illness). ②Decide main protein for each day — same protein not on consecutive days. ③Choose that week\'s seasonal vegetables (cheapest and freshest). ④Consider cooking time: weekdays choose quick meals (under 30 min), weekends more elaborate. ⑤Ensure at least 2 fish meals per week. Sample rotation: Mon chicken/Tue fish/Wed tofu/Thu pork/Fri egg/Sat beef/Sun seafood; rotate vegetables daily.',id:'Langkah perencanaan: ①Anggota keluarga & kebutuhan diet. ②Protein utama per hari, tidak berulang. ③Sayuran musiman minggu ini. ④Waktu memasak: hari kerja <30 menit, akhir pekan lebih rumit. ⑤Min 2x ikan per minggu. Rotasi: Sen ayam/Sel ikan/Rab tahu/Kam babi/Jum telur/Sab sapi/Min seafood.',vi:'Bước lên kế hoạch: ①Số thành viên & nhu cầu ăn đặc biệt. ②Protein chính mỗi ngày, không lặp liên tiếp. ③Rau củ theo mùa trong tuần. ④Thời gian nấu: ngày thường <30 phút, cuối tuần phức tạp hơn. ⑤Ít nhất 2 bữa cá/tuần. Luân phiên: T2 gà/T3 cá/T4 đậu hũ/T5 heo/T6 trứng/T7 bò/CN hải sản.'}},
      {icon:'🛒',zh:'採購清單製作技巧',en:'Shopping List Strategy',desc:{zh:'有效採購清單的製作步驟：①根據一週菜單，列出所有需要的食材。②按照超市區域分類整理：「生鮮區」（肉/魚/蔬果）→「冷藏區」（蛋/乳製品）→「常溫乾貨區」（米/調味料/罐頭）→「冷凍區」最後逛。③標記數量與規格（400g豬五花、2隻雞腿）避免買多或買少。④手機拍下常用調味料存量，避免重複購買。採購順序：先逛乾貨→冷藏→最後取生鮮冷凍，使冷凍食品在袋中停留時間最短，保持品質。',en:'Steps for an effective shopping list: ①List all ingredients from the weekly menu. ②Organize by store zone: \"Fresh\" (meat/fish/produce) → \"Refrigerated\" (eggs/dairy) → \"Dry goods\" (rice/condiments/canned) → \"Frozen\" last. ③Specify quantities and cut (400g pork belly, 2 chicken thighs) to avoid over- or under-buying. ④Photo your condiment shelf before going — avoid buying duplicates. Shopping order: dry goods → refrigerated → fresh/frozen last (minimizes time in bag).',id:'Langkah: ①Daftar semua bahan dari menu mingguan. ②Kelompokkan: segar → dingin → kering → beku (terakhir). ③Tentukan jumlah & spesifikasi. ④Foto rak bumbu sebelum pergi. Urutan: kering → dingin → segar/beku terakhir.',vi:'Bước: ①Liệt kê tất cả nguyên liệu từ thực đơn tuần. ②Phân nhóm: tươi → lạnh → khô → đông lạnh (cuối). ③Ghi số lượng & quy cách. ④Chụp ảnh kệ gia vị trước khi đi. Thứ tự mua: khô → lạnh → tươi/đông cuối.'}},
      {icon:'💰',zh:'預算控制與節省技巧',en:'Budget Control & Saving Tips',desc:{zh:'節省飲食預算5大策略：①選當季食材（比非當季便宜20–40%，且更新鮮）。②以雞蛋、豆腐替代部分肉類（每公克蛋白質成本最低）。③整塊肉比切好的便宜20–30%（自己切，練刀工）。④計畫採購避免衝動消費（有清單者比無清單者少花15–20%）。⑤一鍋多吃：滷肉汁可拌飯、煮湯；炒菜剩醬汁可做炒飯基底。台灣市場採購建議：週末早市最便宜（新鮮且商家急售）；量販店大包裝分裝冷凍最經濟。',en:'5 budget strategies: ①Choose seasonal produce (20–40% cheaper and fresher). ②Replace some meat with eggs and tofu (cheapest protein per gram). ③Buy whole cuts (20–30% cheaper than pre-cut; practice knife skills). ④Plan shopping list (list shoppers spend 15–20% less than non-list shoppers). ⑤One-pot economy: braising sauce = rice topping or soup base; stir-fry sauce = fried rice base. Market tips: early Saturday market is cheapest; bulk stores + portion freezing is most economical.',id:'5 strategi anggaran: ①Bahan musiman (20–40% lebih murah). ②Ganti sebagian daging dengan telur/tahu. ③Beli daging utuh (20–30% lebih murah). ④Daftar belanja (hemat 15–20%). ⑤Manfaatkan sisa: saus semur untuk nasi, sisa tumis untuk nasi goreng.',vi:'5 chiến lược ngân sách: ①Thực phẩm theo mùa (rẻ hơn 20–40%). ②Thay một phần thịt bằng trứng/đậu hũ. ③Mua thịt nguyên miếng (rẻ hơn 20–30%). ④Lập danh sách mua sắm (tiết kiệm 15–20%). ⑤Tận dụng nước kho cho cơm, nước xào cho cơm rang.'}},
      {icon:'♻️',zh:'廚餘減量與食材利用',en:'Food Waste Reduction & Full Utilization',desc:{zh:'台灣每年家庭廚餘超過300萬噸，其中30%可避免。減少廚餘五步驟：①計畫採購（最根本的減廢方式）。②先用先出（FIFO），快過期的食材優先烹調。③葉菜梗/花椰菜莖→炒菜或煮湯不要丟。④肉骨+蔬菜邊角料→熬成高湯冷凍備用。⑤剩飯→炒飯或米飯沙拉；剩菜→隔日便當。延長保存：羅勒/香菜洗乾淨→冰鮮；多餘香草葉→橄欖油浸漬或製成冰磚。',en:'Taiwan generates 3 million+ tons of household food waste annually; 30% is avoidable. 5 steps to reduce: ①Plan your shopping (most effective). ②FIFO — cook expiring items first. ③Vegetable stems/broccoli stalks → stir-fry or soup (don\'t discard). ④Meat bones + vegetable scraps → simmer into stock, freeze in portions. ⑤Leftover rice → fried rice or rice salad; leftover dishes → next-day lunch. Extending fresh herbs: wash basil/cilantro, refrigerate; extra leaves → olive oil infusion or herb ice cubes.',id:'5 langkah kurangi sampah dapur: ①Rencanakan belanja. ②FIFO — masak yang akan kedaluwarsa dulu. ③Batang sayuran → tumis atau sup. ④Tulang + sisa sayuran → kaldu, beku. ⑤Nasi sisa → nasi goreng; lauk sisa → bekal besok.',vi:'5 bước giảm rác thực phẩm: ①Lên kế hoạch mua sắm. ②FIFO — nấu đồ sắp hết hạn trước. ③Cuống rau/thân súp lơ → xào hoặc nấu súp. ④Xương + rau thừa → nấu nước dùng, đông lạnh. ⑤Cơm thừa → cơm rang; đồ ăn thừa → cơm hộp ngày mai.'}},
      {icon:'🌿',zh:'食材季節性對照',en:'Seasonal Ingredient Calendar',desc:{zh:'台灣四季當令食材參考：🌸春（3–5月）：蘆筍、豌豆、草莓、綠竹筍、桑椹。☀️夏（6–8月）：苦瓜、絲瓜、秋葵、芒果、西瓜、玉米。🍂秋（9–11月）：南瓜、番薯、柿子、蓮霧、蓮藕。❄️冬（12–2月）：高麗菜、蘿蔔、菠菜、茼蒿、橘子、柳丁。全年皆有：雞蛋、豆腐、豬肉、基本葉菜（小白菜、青江菜）。選擇當季食材三大優點：①最便宜（供過於求）。②最新鮮（成熟後就近採收）。③最營養（在最佳時節生長）。',en:'Taiwan seasonal guide: 🌸Spring (Mar–May): asparagus, peas, strawberries, bamboo shoots, mulberries. ☀️Summer (Jun–Aug): bitter melon, loofah, okra, mango, watermelon, corn. 🍂Autumn (Sep–Nov): pumpkin, sweet potato, persimmon, wax apple, lotus root. ❄️Winter (Dec–Feb): cabbage, daikon, spinach, chrysanthemum greens, tangerines, oranges. Year-round: eggs, tofu, pork, basic greens (bok choy, pak choy). 3 reasons to buy seasonal: ①Cheapest (oversupply). ②Freshest (harvested at peak). ③Most nutritious (grown in ideal conditions).',id:'Panduan musiman Taiwan: 🌸Semi (Mar–Mei): asparagus, kacang polong, stroberi. ☀️Panas (Jun–Agu): pare, kacang okra, mangga, semangka. 🍂Gugur (Sep–Nov): labu, ubi jalar, biji teratai. ❄️Dingin (Des–Feb): kol, lobak, bayam. Sepanjang tahun: telur, tahu, daging babi.',vi:'Lịch thực phẩm theo mùa Đài Loan: 🌸Xuân (3–5): măng tây, đậu Hà Lan, dâu tây. ☀️Hè (6–8): khổ qua, mướp, đậu bắp, xoài, dưa hấu. 🍂Thu (9–11): bí đỏ, khoai lang, hồng. ❄️Đông (12–2): bắp cải, củ cải, rau bina. Quanh năm: trứng, đậu hũ, thịt heo.'}}
    ],

    tip:{zh:'💡 每週固定一天（推薦週日下午）執行「菜單規劃三步驟」：①10分鐘決定7天主菜。②10分鐘搭配蔬菜與烹調方式。③10分鐘列採購清單。每週只需30分鐘，可節省15%以上飲食費用、減少30%食材浪費，是最具CP值的廚房管理習慣。',en:'💡 Every week on a fixed day (recommend Sunday afternoon), run the \"3-step menu plan\": ①10 min: decide 7-day main protein. ②10 min: pair vegetables and cooking methods. ③10 min: write shopping list. Just 30 min a week saves 15%+ on food bills and reduces waste by 30% — the highest-ROI kitchen habit.',id:'💡 Setiap minggu pada hari tetap (rekomendasi Minggu sore), lakukan \"3 langkah perencanaan menu\": ①10 menit: tentukan protein utama 7 hari. ②10 menit: padukan sayuran dan metode memasak. ③10 menit: tulis daftar belanja. Hanya 30 menit/minggu untuk hemat 15%+ biaya makan.',vi:'💡 Mỗi tuần một ngày cố định (gợi ý chiều Chủ nhật), thực hiện \"3 bước lên thực đơn\": ①10 phút: quyết định protein chính 7 ngày. ②10 phút: kết hợp rau và phương pháp nấu. ③10 phút: viết danh sách mua sắm. Chỉ 30 phút/tuần tiết kiệm 15%+ chi phí thực phẩm.'}

  /* Lv8 台灣家庭常見料理 ── 知識卡片 */
  {
    title:{zh:'台灣家庭常見料理完整指南',en:'Common Taiwanese Home Cooking Complete Guide',id:'Panduan Lengkap Masakan Rumahan Taiwan',vi:'Hướng dẫn toàn diện món ăn gia đình Đài Loan phổ biến'},
    visual:{
      title:{zh:'台灣家常料理速查卡',en:'Taiwan Home Cooking Quick Reference'},
      html:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
        <div style="background:linear-gradient(135deg,#8a2800,#c04000);color:#fff;border-radius:8px;padding:9px">
          <div style="font-size:11px;font-weight:700;margin-bottom:4px">🍗 三杯料理</div>
          <div style="font-size:10px;opacity:.92;line-height:1.6">醬油 : 米酒 : 麻油 = 1:1:1<br>九層塔起鍋前放，大火逼香即熄火<br>適用：雞、蝦、透抽、杏鮑菇</div>
        </div>
        <div style="background:linear-gradient(135deg,#1a4a2a,#2a7248);color:#fff;border-radius:8px;padding:9px">
          <div style="font-size:11px;font-weight:700;margin-bottom:4px">🥩 紅燒滷味</div>
          <div style="font-size:10px;opacity:.92;line-height:1.6">醬油:水:糖 ≈ 1:3:0.5<br>川燙去血水→小火慢燉1–1.5h<br>老滷水過濾煮沸後冷藏或冷凍</div>
        </div>
        <div style="background:linear-gradient(135deg,#1a3a6a,#2a5aaa);color:#fff;border-radius:8px;padding:9px">
          <div style="font-size:11px;font-weight:700;margin-bottom:4px">🌿 台式快炒</div>
          <div style="font-size:10px;opacity:.92;line-height:1.6">熱鍋多油→爆香蒜末→大火快炒<br>全程1–2分鐘，鍋氣是靈魂<br>起鍋前才加鹽（避免出水）</div>
        </div>
        <div style="background:linear-gradient(135deg,#4a2a00,#7a5000);color:#fff;border-radius:8px;padding:9px">

        </div>
      </div>`
    },
    items:[
      {icon:'🍗',zh:'三杯料理技法',en:'Three-Cup Cooking Technique',desc:{zh:'三杯料理是台灣家庭最具代表性的料理之一。【標準比例】醬油：米酒：麻油 = 1:1:1（等量，現代版可調整糖量平衡鹹甜）。【必備材料】大量蒜頭、老薑片（與食材同炒）、新鮮九層塔（靈魂）。【烹調步驟】①中火以麻油爆香薑片至捲邊②放入食材（雞塊等）翻炒上色③加入醬油與米酒④轉小火加蓋燜10分鐘⑤轉大火收汁⑥放入九層塔大火逼香立即熄火。【關鍵】九層塔必須最後放、大火逼香後立刻關火，過熟則香氣消散變黑。三杯系列：雞（最經典）、蝦、透抽（花枝）、杏鮑菇（素食版）。',en:'Three-cup cooking is one of Taiwan's most iconic home dishes. Standard ratio: soy sauce : rice wine : sesame oil = 1:1:1. Must-haves: plenty of garlic, old ginger slices, fresh Taiwanese basil (the soul). Steps: ① sauté ginger in sesame oil until curled ② add main ingredient and stir-fry to color ③ add soy sauce and rice wine ④ reduce to low heat, cover and braise 10 min ⑤ high heat to reduce sauce ⑥ add basil, flash on high heat, immediately turn off. Key: basil goes in last; turn off heat immediately after blooming or it turns black and loses aroma.'}},
      {icon:'🥩',zh:'紅燒與滷味基礎',en:'Red-Braise & Lu Flavor Fundamentals',desc:{zh:'台式紅燒滷味的萬用滷汁比例：醬油:水:糖 ≈ 1:3:0.5，可依口味加入八角（1–2顆）、桂皮（1小段）、月桂葉（2片）、米酒（去腥）。【川燙步驟】肉類先以沸水川燙2–3分鐘，去除血水與雜質，確保滷汁清澈。【燉煮原則】轉小火慢燉——豬五花控肉需1–1.5小時，雞腿滷味約30–40分鐘，豆干15–20分鐘。小火讓膠原蛋白轉化為明膠（軟透Q彈），大火則讓外皮收縮變硬。【老滷水管理】過濾殘渣→趁熱大火煮沸殺菌→冷卻後冷藏或冷凍→每次使用前再煮沸→定期補充醬油、米酒與香料。',en:'Universal braising ratio: soy sauce : water : sugar ≈ 1:3:0.5, with optional star anise (1–2), cinnamon stick (1 small), bay leaves (2), rice wine. Blanch step: blanch meat in boiling water 2–3 min to remove blood and impurities for a clear broth. Braising: low heat — pork belly needs 1–1.5 hrs, chicken thighs 30–40 min, dried tofu 15–20 min. Low heat converts collagen to gelatin (soft and springy); high heat tightens the skin. Old braising liquid management: filter → boil while hot → refrigerate or freeze → reboil before each use → periodically replenish.'}},
      {icon:'🌿',zh:'台式快炒技法',en:'Taiwanese-Style Stir-Fry Techniques',desc:{zh:'台式快炒的核心是「鍋氣（Wok Hei）」：食材接觸高溫鐵鍋瞬間產生的梅納反應香氣。【熱鍋三原則】①鍋要夠熱（大火熱鍋至冒煙）②油要夠多（不是大量，但要足夠潤鍋）③食材要分批下（一次下太多會降溫出水）。【加鹽時機】起鍋前才加鹽——早加鹽會使蔬菜細胞脫水出水，導致失去脆度。【蔬菜類大火快炒口訣】先梗後葉、全程大火、1–2分鐘出鍋。【肉類快炒】先過油（或乾煸）逼出香氣，再下配菜一起炒，最後沿鍋邊嗆入醬油或料理酒，會聽到「滋！」的爆香聲——這就是鍋氣的來源。',en:'The core of Taiwanese stir-frying is "wok hei" (鍋氣): the Maillard reaction aromas created when ingredients hit the very hot wok. Three hot-wok principles: ① hot enough wok (high heat until smoking) ② enough oil (not a lot, but enough to coat) ③ ingredients in batches (too much at once cools the wok and causes water release). Salt timing: add salt only at the end — early salt causes cell dehydration and loss of crispness. Vegetable stir-fry rule: stems first then leaves, high heat throughout, 1–2 min total. Meat stir-fry: sear meat first to lock in flavor, add vegetables, then splash soy sauce or wine along the edge of the wok — the "tsz!" sizzle is wok hei.'}},
      {icon:'🍲',zh:'台式湯品與粥品要訣',en:'Taiwanese Soup & Congee Essentials',desc:{zh:'台式家常湯品的精髓是「清淡鮮甜、食材本味」，不需要複雜高湯。【蛤蜊絲瓜湯要訣】蛤蜊泡鹽水吐沙1–2小時→薑片去腥→絲瓜半透明時入蛤蜊→一開口立即關火→少量鹽調味。【蘿蔔排骨湯】排骨川燙去血水→冷水入鍋大火煮沸→轉小火慢燉40–60分鐘→蘿蔔切大塊入鍋後再燉20分鐘→起鍋加鹽（不可過早加鹽，會讓肉質變柴）。【台式清粥】米:水 = 1:10–12，大火煮沸後轉小火加蓋煮20–30分鐘，偶爾攪拌防黏鍋。小菜配粥：滷蛋、豆腐乳、炒鹹菜、肉鬆。',en:'The essence of Taiwanese home soups is "clear, naturally sweet, ingredient-forward" — no complex stock needed. Clam and loofah soup: purge clams in salted water 1–2 hrs → ginger to remove fishy odor → add clams when loofah is semi-translucent → turn off heat the moment they open → season lightly with salt. Radish spare-rib soup: blanch ribs → cold water start, bring to boil → low heat 40–60 min → add large radish pieces and braise 20 more min → salt only at the end (early salt toughens the meat). Taiwanese congee: rice:water = 1:10–12, bring to boil then low heat 20–30 min covered, stir occasionally to prevent sticking.'}},
      {icon:'🥚',zh:'蒸蛋與清蒸魚技法',en:'Steamed Eggs & Steamed Fish Techniques',desc:{zh:'【台式蒸蛋】黃金比例：蛋:水（或高湯）= 1:2 至 1:2.5，加少許鹽與醬油。四步驟：①蛋液打散後加水②過細篩去除泡沫與繫帶③輕攪不打發④中小火蒸，鍋蓋留縫（夾筷子防滴水）。蒸8–12分鐘，表面微微晃動即可。坑洞的原因：大火或密封鍋蓋導致水蒸氣滴落。可加入豆腐、蝦仁、滷肉等配料豐富口感。【台式清蒸魚】步驟：①魚身劃刀（幫助熟透均勻）②魚腹塞薑片③大火蒸8–12分鐘（視魚大小）④倒掉腥水⑤鋪薑絲蔥絲⑥淋醬油⑦澆熱油（180°C）爆香——最後的熱油步驟是整道菜香氣提升的關鍵，切勿省略。',en:'Steamed eggs: golden ratio egg:liquid = 1:2 to 1:2.5, with a little salt and soy sauce. Four steps: ① mix egg and liquid ② strain through fine sieve to remove foam and chalaza ③ stir gently, never whisk ④ medium-low heat with lid gap. Steam 8–12 min until just barely set. Pitting cause: high heat or sealed lid allows condensation drips. Optional add-ins: tofu, shrimp, braised pork. Steamed fish: ① score the fish ② stuff ginger slices in belly ③ steam on high 8–12 min ④ pour off the fishy liquid ⑤ top with ginger and scallion shreds ⑥ drizzle soy sauce ⑦ pour hot oil (~180°C) — this final hot oil step is the key to the dish's aroma and must not be skipped.'}},
      {icon:'🍱',zh:'台式便當菜設計原則',en:'Taiwanese Bento Box Design Principles',desc:{zh:'台式便當設計以「均衡、耐放、食安」為三大核心。【主菜選擇】滷排骨、炸雞排、紅燒肉、薑燒豬肉、照燒雞——要求完全熟透、有調味（有鹽分保水）、不易出水。【副菜搭配】3–4種小菜：①炒蔬菜（高麗菜、空心菜、青椒）②滷味（豆干、海帶、滷蛋）③豆類（毛豆、玉米）④根莖類（炒紅蘿蔔絲）。【食安三大禁忌】①生食或半生不熟的食材②易出水食材（新鮮番茄切片、生菜、豆腐切片）③剛炸好的炸物（水蒸氣回軟、油脂氧化）。【裝盒步驟】食材冷卻至室溫再裝盒（避免水蒸氣悶壞）→主菜放一側，飯在中間，小菜分格擺放→米飯稍微按實（防散落）。台鐵便當黃金組合：滷排骨＋白米飯＋滷蛋＋豆干＋筍片＋炒高麗菜，歷久不衰的原因正是以上三大核心的完美體現。',en:'Three core principles: balanced, shelf-stable, food-safe. Main dishes: braised pork ribs, fried chicken cutlet, red-braised pork, ginger pork, teriyaki chicken — must be fully cooked, seasoned (salt helps retain moisture), not watery. Side dishes (3–4): ① stir-fried vegetables ② braised items (dried tofu, kelp, braised egg) ③ legumes (edamame, corn) ④ root vegetables. Three food safety prohibitions: ① raw or undercooked ingredients ② watery ingredients (fresh sliced tomatoes, raw greens, fresh tofu) ③ freshly fried food (steam makes it soggy, oil oxidizes). Boxing steps: cool to room temperature first → place main on one side, rice in center, sides arranged in sections → slightly press the rice. Taiwan Railway Bento gold standard: braised ribs + white rice + braised egg + dried tofu + bamboo shoots + stir-fried cabbage — a timeless combination embodying all three core principles.'}}
    ],

    tip:{zh:'💡 台灣家庭料理的精髓在於「新鮮食材＋簡單調味＋掌握火候」。三杯的麻油香、控肉的滷汁光澤、蒸蛋的嫩滑、清蒸魚的熱油爆香——每一道菜背後都是台灣幾代家庭廚房的智慧積累。食材新鮮是前提，技法正確是橋梁，用心料理是靈魂。',en:"💡 The essence of Taiwanese home cooking is 'fresh ingredients + simple seasoning + mastering heat.' The sesame fragrance of Three-Cup dishes, the glossy braising sauce of braised pork belly, the silky smoothness of steamed eggs, the hot-oil bloom of steamed fish — behind each dish is the accumulated wisdom of generations of Taiwanese home kitchens. Fresh ingredients are the premise, correct technique is the bridge, and cooking with care is the soul.",id:'💡 Esensi masakan rumah Taiwan adalah "bahan segar + bumbu sederhana + menguasai api." Aroma wijen dalam masakan Tiga Cangkir, kilap saus braised pork, kelembutan telur kukus, wangi minyak panas ikan kukus — di balik setiap hidangan adalah kebijaksanaan dapur rumah tangga Taiwan lintas generasi.',vi:'💡 Tinh hoa ẩm thực gia đình Đài Loan là "nguyên liệu tươi + gia vị đơn giản + kiểm soát lửa". Hương dầu mè trong món Ba Ly, nước kho bóng mịn của thịt kho tàu, sự mềm mịn của trứng hấp, hương bùng khi rưới dầu nóng lên cá hấp — mỗi món đều là trí tuệ tích lũy của nhiều thế hệ bếp gia đình Đài Loan.'}

    items:[
      {icon:'⚖️',zh:'基礎調味黃金比例',en:'Golden Seasoning Ratios',desc:{zh:'萬用滷汁比例「醬油:水:糖=1:3:0.5」；糖醋比例「糖:醋:水=1:1:1」，可依酸甜喜好調整。鹹度測試：先少量加入，邊煮邊嚐——鹽分會隨水分蒸發而濃縮，建議起鍋前再做最後調味。替換參考：1大匙醬油≈3/4小匙鹽。',en:'All-purpose braising ratio \"soy sauce:water:sugar = 1:3:0.5\". Sweet-sour ratio \"sugar:vinegar:water = 1:1:1\", adjust to taste. Salt test: add gradually and taste as you go — saltiness concentrates as liquid evaporates, so finalize seasoning near the end. Substitution: 1 tbsp soy sauce ≈ 3/4 tsp salt.',id:'Rasio kaldu serbaguna \"kecap:air:gula = 1:3:0.5\". Rasio asam-manis \"gula:cuka:air = 1:1:1\", sesuaikan rasa. Tes garam: tambahkan sedikit demi sedikit sambil mencicipi — rasa asin makin pekat saat air menguap, koreksi terakhir mendekati akhir masak. Substitusi: 1 sdm kecap ≈ 3/4 sdt garam.',vi:'Tỷ lệ nước kho万用 \"nước tương:nước:đường = 1:3:0.5\". Tỷ lệ chua ngọt \"đường:giấm:nước = 1:1:1\", điều chỉnh theo khẩu vị. Thử độ mặn: thêm từ từ và nếm liên tục — vị mặn đậm hơn khi nước bốc hơi, nêm lại lần cuối gần cuối khi nấu. Thay thế: 1 muỗng canh nước tương ≈ 3/4 muỗng cà phê muối.'}},
      {icon:'🍶',zh:'三大常見醬汁基底',en:'3 Common Sauce Bases',desc:{zh:'①紅燒醬汁：醬油+糖+薑蒜+八角，小火慢燉至濃稠，適合滷肉、紅燒魚。②糖醋醬汁：糖、醋、番茄醬、太白粉水勾芡，先炒香蒜末再下醬汁。③蒜辣醬：蒜末、辣椒、醬油、香油快速爆香，適合涼拌或沾醬。三者皆可冷藏保存3–5天，使用乾淨湯匙取用避免汙染。',en:'①Braised sauce: soy sauce + sugar + ginger/garlic + star anise, simmer low until thickened — for braised pork or fish. ②Sweet-sour sauce: sugar, vinegar, ketchup, cornstarch slurry — sauté garlic first, then add sauce. ③Garlic-chili sauce: minced garlic, chili, soy sauce, sesame oil, quickly fried — for dipping or cold dishes. All keep refrigerated 3–5 days; use a clean spoon each time.',id:'①Saus braised: kecap + gula + jahe/bawang putih + bunga lawang, masak pelan hingga kental — untuk daging/ikan kecap. ②Saus asam manis: gula, cuka, saus tomat, larutan maizena — tumis bawang putih dulu. ③Saus bawang-cabai: bawang putih, cabai, kecap, minyak wijen ditumis cepat. Semua tahan 3–5 hari di kulkas; gunakan sendok bersih.',vi:'①Nước kho: nước tương + đường + gừng/tỏi + hồi, ninh nhỏ lửa cho sệt — dùng kho thịt/cá. ②Sốt chua ngọt: đường, giấm, sốt cà chua, bột năng — phi tỏi trước rồi cho sốt vào. ③Sốt tỏi-ớt: tỏi băm, ớt, nước tương, dầu mè phi nhanh. Tất cả giữ lạnh 3–5 ngày; dùng muỗng sạch mỗi lần.'}},
      {icon:'🥩',zh:'醃肉入味與嫩化技巧',en:'Marinating & Tenderizing Meat',desc:{zh:'醃肉四元素：①鹽（基礎調味，幫助保水）。②糖（平衡鹹度、幫助上色）。③酸性物質（檸檬汁、優格、醋——分解蛋白質使肉質軟嫩，但浸泡不超過30分鐘以免肉質過爛）。④油脂（鎖住水分、幫助香料附著）。建議時間：薄肉片15–30分鐘、整塊肉2–24小時（冷藏中進行）。醃料中加入太白粉或蛋白可形成保護層，避免烹調時水分流失。',en:'4 elements of marinating: ①Salt (base seasoning, retains moisture). ②Sugar (balances saltiness, helps browning). ③Acid (lemon juice, yogurt, vinegar — breaks down protein for tenderness, but limit to 30 min or meat turns mushy). ④Fat/oil (locks in moisture, helps spices adhere). Suggested times: thin slices 15–30 min, whole cuts 2–24 hrs (refrigerated). Adding cornstarch or egg white forms a protective layer that reduces moisture loss during cooking.',id:'4 elemen marinasi: ①Garam (bumbu dasar, menjaga kelembapan). ②Gula (menyeimbangkan rasa asin, membantu kecoklatan). ③Asam (jeruk nipis, yogurt, cuka — melembutkan protein, maks 30 menit agar tidak lembek). ④Lemak/minyak (mengikat kelembapan, membantu rempah menempel). Waktu: potongan tipis 15–30 menit, daging utuh 2–24 jam (di kulkas). Tambahkan maizena atau putih telur untuk lapisan pelindung saat dimasak.',vi:'4 yếu tố ướp: ①Muối (gia vị cơ bản, giữ độ ẩm). ②Đường (cân bằng độ mặn, giúp lên màu). ③Axit (nước cốt chanh, sữa chua, giấm — làm mềm protein, tối đa 30 phút để thịt không nhũn). ④Dầu/mỡ (giữ ẩm, giúp gia vị bám). Thời gian: lát mỏng 15–30 phút, miếng nguyên 2–24 giờ (trong tủ lạnh). Thêm bột năng hoặc lòng trắng trứng tạo lớp bảo vệ giảm mất nước khi nấu.'}},
      {icon:'🥒',zh:'蔬菜醃漬基礎流程',en:'Basic Vegetable Pickling Process',desc:{zh:'簡易醃漬蔬菜（如小黃瓜、蘿蔔）四步驟：①蔬菜切好後以鹽抓醃出水（約1小時），去除多餘水分使口感脆。②調配醃汁：糖、醋、鹽、水按比例煮開放涼（或不加熱快速醃法）。③蔬菜與醃汁放入乾淨容器中，完全浸泡。④冷藏至少2–4小時入味，可保存1–2週。快速醃漬適合當天食用，長時間發酵類（如韓式泡菜）則需額外控制鹽度與溫度。',en:'4 steps for quick pickled vegetables (cucumber, radish): ①Salt and massage cut vegetables to draw out water (~1 hr) for crispness. ②Mix brine: sugar, vinegar, salt, water — boil and cool (or skip heating for a quick pickle). ③Place vegetables and brine in a clean container, fully submerged. ④Refrigerate at least 2–4 hrs; keeps 1–2 weeks. Quick pickles are for same-day eating; longer fermented pickles (kimchi) need careful salt and temperature control.',id:'4 langkah acar cepat (timun, lobak): ①Garami dan remas sayuran untuk mengeluarkan air (~1 jam) agar renyah. ②Campur air acar: gula, cuka, garam, air — rebus lalu dinginkan (atau tanpa dipanaskan untuk acar cepat). ③Masukkan sayuran dan air acar ke wadah bersih, terendam penuh. ④Dinginkan minimal 2–4 jam; tahan 1–2 minggu. Acar cepat untuk hari itu; acar fermentasi (kimchi) perlu kontrol garam dan suhu lebih ketat.',vi:'4 bước ngâm chua nhanh (dưa leo, củ cải): ①Trộn muối và bóp rau để ra nước (~1 giờ) cho giòn. ②Pha nước ngâm: đường, giấm, muối, nước — đun sôi rồi để nguội (hoặc không đun để ngâm nhanh). ③Cho rau và nước ngâm vào hộp sạch, ngập hoàn toàn. ④Để lạnh ít nhất 2–4 giờ; giữ được 1–2 tuần. Ngâm nhanh dùng trong ngày; loại lên men (kim chi) cần kiểm soát muối và nhiệt độ kỹ hơn.'}},
      {icon:'🧫',zh:'發酵醃漬安全須知',en:'Fermentation Safety Basics',desc:{zh:'在家發酵（如泡菜、酸菜）須注意：①鹽水濃度約2–5%，過低易長雜菌、過高則發酵太慢。②容器與器具務必徹底清潔消毒（沸水燙過或酒精擦拭），避免雜菌污染。③蔬菜需完全浸泡於液面下，可用乾淨重物壓住，避免接觸空氣長黴。④發酵溫度建議18–22°C，溫度過高會加速發酵但風味與安全性下降。⑤若出現異常臭味、變色、黏液或發霉，應立即丟棄，不可食用。',en:'Home fermentation (kimchi, sauerkraut) cautions: ①Brine concentration ~2–5% — too low risks unwanted bacteria, too high slows fermentation. ②Thoroughly clean/sanitize containers and tools (boiling water or alcohol) to prevent contamination. ③Keep vegetables fully submerged below the liquid using a clean weight, to avoid mold from air exposure. ④Ideal fermentation temp 18–22°C; higher speeds it up but reduces flavor and safety. ⑤Discard immediately if you notice off smells, discoloration, sliminess, or mold — never eat it.',id:'Catatan fermentasi rumahan (kimchi, asinan): ①Konsentrasi air garam ~2–5% — terlalu rendah berisiko bakteri liar, terlalu tinggi memperlambat fermentasi. ②Sterilkan wadah dan alat (air mendidih atau alkohol) untuk mencegah kontaminasi. ③Sayuran harus terendam penuh dengan pemberat bersih agar tidak terkena udara dan berjamur. ④Suhu fermentasi ideal 18–22°C; lebih tinggi mempercepat tapi mengurangi rasa dan keamanan. ⑤Buang segera jika ada bau aneh, perubahan warna, lendir, atau jamur — jangan dimakan.',vi:'Lưu ý lên men tại nhà (kim chi, dưa cải): ①Nồng độ nước muối ~2–5% — quá thấp dễ sinh vi khuẩn lạ, quá cao làm lên men chậm. ②Vệ sinh kỹ hộp và dụng cụ (nước sôi hoặc cồn) để tránh ô nhiễm. ③Rau phải ngập hoàn toàn dưới nước bằng vật nặng sạch, tránh tiếp xúc không khí gây nấm mốc. ④Nhiệt độ lên men lý tưởng 18–22°C; cao hơn nhanh hơn nhưng giảm hương vị và an toàn. ⑤Bỏ ngay nếu có mùi lạ, đổi màu, nhớt hoặc nấm mốc — không được ăn.'}},
      {icon:'🧊',zh:'醬料保存與標籤管理',en:'Sauce Storage & Labeling',desc:{zh:'自製醬料保存原則：①裝入乾淨密封玻璃罐或容器，避免塑膠吸味。②貼標籤記錄製作日期，原則上「先進先出」。③一般醬汁冷藏可存3–5天，含生蛋（如美乃滋）類醬料應在2天內用完。④發酵類醬料（味噌、辣椒醬）因鹽分高可存放數週至數月。⑤取用時使用乾淨乾燥的湯匙，避免將口水或其他食材帶入污染整罐醬料。⑥若聞到酸敗異味或表面長黴，應整罐丟棄不可只刮除表面。',en:'Storage principles for homemade sauces: ①Use clean, sealed glass jars/containers — avoid plastic that absorbs odors. ②Label with the made date; follow first-in-first-out. ③Most sauces keep refrigerated 3–5 days; sauces with raw egg (e.g. mayonnaise) should be used within 2 days. ④High-salt fermented sauces (miso, chili paste) can last weeks to months. ⑤Always use a clean, dry spoon to avoid cross-contaminating the whole jar. ⑥If you smell rancidity or see mold on the surface, discard the entire jar — don\'t just scrape it off.',id:'Prinsip penyimpanan saus buatan sendiri: ①Gunakan toples kaca bersih dan kedap — hindari plastik yang menyerap bau. ②Beri label tanggal pembuatan; ikuti prinsip first-in-first-out. ③Kebanyakan saus tahan 3–5 hari di kulkas; saus dengan telur mentah (mayones) habiskan dalam 2 hari. ④Saus fermentasi bergaram tinggi (miso, sambal) tahan berminggu-minggu hingga berbulan-bulan. ⑤Gunakan sendok bersih dan kering setiap kali. ⑥Jika berbau tengik atau berjamur, buang seluruh toples — jangan hanya mengambil jamurnya.',vi:'Nguyên tắc bảo quản nước sốt tự làm: ①Dùng lọ kính sạch, đậy kín — tránh nhựa hút mùi. ②Ghi nhãn ngày làm; theo nguyên tắc nhập trước xuất trước. ③Hầu hết nước sốt giữ lạnh 3–5 ngày; sốt có trứng sống (mayonnaise) dùng trong 2 ngày. ④Sốt lên men nhiều muối (miso, tương ớt) giữ được vài tuần đến vài tháng. ⑤Luôn dùng muỗng sạch và khô. ⑥Nếu có mùi ôi hoặc nấm mốc, bỏ cả lọ — không chỉ gạt bỏ phần mốc.'}}
    ],

    tip:{zh:'💡 調味小口訣「先少後多、邊煮邊嚐」：起鍋前才做最後調味，因為水分蒸發會讓味道變濃。醃漬與發酵則謹記「乾淨、密封、控制溫度與鹽度」三大原則，安全與美味才能兼顧。',en:'💡 Seasoning rule of thumb: \"start light, taste as you go\" — finalize seasoning near the end since flavors concentrate as liquid evaporates. For pickling/fermenting, remember \"clean, sealed, control temperature and salt\" for both safety and flavor.',id:'💡 Aturan bumbu: \"mulai sedikit, cicipi terus\" — koreksi rasa terakhir karena rasa makin pekat saat air menguap. Untuk acar/fermentasi, ingat \"bersih, kedap, kontrol suhu dan garam\" demi keamanan dan rasa.',vi:'💡 Quy tắc nêm gia vị: \"bắt đầu ít, nếm liên tục\" — nêm lại lần cuối vì vị sẽ đậm hơn khi nước bốc hơi. Với ngâm chua/lên men, nhớ \"sạch, kín, kiểm soát nhiệt độ và muối\" để vừa an toàn vừa ngon.'}

    items:[
      {icon:'🧊',zh:'豆腐處理技巧',en:'Tofu Preparation Techniques',desc:{zh:'烹調前先用鹽水浸泡或撒鹽靜置10–20分鐘，能去除多餘水分，使豆腐口感更紮實，煎炒時不易碎、更容易上色入味。瀝乾後可用紙巾或重物按壓加速脫水。嫩豆腐適合涼拌、煮湯；老豆腐（板豆腐）適合煎、炸、紅燒。',en:'Before cooking, salt or brine tofu and let it sit 10–20 minutes to draw out excess moisture — this firms up the texture so it holds together when pan-fried and browns more easily. Pat dry or press with a weight to speed dehydration. Soft tofu suits cold dishes and soups; firm tofu suits frying, braising, and pan-searing.',id:'Sebelum memasak, garami atau rendam tahu dalam air garam 10–20 menit untuk mengeluarkan kelembapan berlebih — membuat tekstur lebih padat agar tidak hancur saat digoreng. Tahu lunak cocok untuk hidangan dingin dan sup; tahu keras cocok untuk digoreng dan dimasak braised.',vi:'Trước khi nấu, ướp muối hoặc ngâm đậu phụ trong nước muối 10–20 phút để rút bớt nước — giúp kết cấu chắc hơn, không vỡ khi chiên. Đậu phụ non phù hợp món lạnh và canh; đậu phụ cứng phù hợp chiên và kho.'}},
      {icon:'🍄',zh:'蔬食鮮味（Umami）來源',en:'Sources of Umami in Plant-Based Cooking',desc:{zh:'植物性食材中天然麩胺酸豐富的來源包括味噌、醬油、香菇（乾香菇泡水後鮮味更濃）、昆布、番茄、海藻等，是取代肉類鮮味的關鍵。烹調時可將乾香菇、昆布泡水製成「蔬食高湯」，作為湯品、燉煮料理的鮮味基底。多種鮮味來源組合使用，效果更佳。',en:'Plant-based ingredients rich in natural glutamates — miso, soy sauce, shiitake mushrooms (dried ones intensify when rehydrated), kombu, tomatoes, and seaweed — are key to replacing meat-derived umami. Soak dried shiitake and kombu to make a \"plant-based dashi\" as a base for soups and stews. Combining multiple umami sources gives the best depth of flavor.',id:'Bahan nabati kaya glutamat alami — miso, kecap, jamur shiitake (kering lebih kuat setelah direndam), kombu, tomat, dan rumput laut — adalah kunci pengganti umami daging. Rendam shiitake kering dan kombu untuk membuat \"kaldu nabati\". Menggabungkan beberapa sumber umami memberi rasa lebih dalam.',vi:'Nguyên liệu thuần chay giàu glutamate tự nhiên — tương miso, nước tương, nấm shiitake (loại khô càng đậm khi ngâm nước), tảo kombu, cà chua, rong biển — là chìa khóa thay thế umami của thịt. Ngâm nấm shiitake khô và kombu để làm \"nước dùng chay\" cho súp và món hầm. Kết hợp nhiều nguồn umami cho hương vị đậm đà hơn.'}},
      {icon:'🥗',zh:'蔬食營養均衡要點',en:'Nutritional Balance for Plant-Based Diets',desc:{zh:'全素飲食者最需注意補充維生素B12，因其主要存在於動物性食物中，缺乏可能導致神經系統問題；建議透過營養補充劑或強化食品（如強化豆漿、營養酵母）攝取。此外也應留意鐵質（搭配維生素C食物提升吸收）、鈣質（豆腐、芝麻、深綠色蔬菜）與Omega-3（核桃、亞麻籽、奇亞籽）的均衡攝取。',en:'Vegans should pay special attention to vitamin B12, since it occurs mainly in animal foods — deficiency can cause neurological issues; supplements or fortified foods (e.g. fortified soy milk, nutritional yeast) help meet this need. Also pay attention to iron (pair with vitamin C foods for better absorption), calcium (tofu, sesame, dark leafy greens), and Omega-3 (walnuts, flaxseed, chia seeds).',id:'Vegan harus memperhatikan vitamin B12, karena terutama ada pada produk hewani — kekurangan dapat menyebabkan masalah neurologis; suplemen atau makanan yang diperkaya (susu kedelai fortifikasi, ragi nutrisi) membantu. Perhatikan juga zat besi (dengan makanan vitamin C), kalsium (tahu, wijen, sayuran hijau gelap), dan Omega-3 (kenari, biji rami, chia).',vi:'Người ăn thuần chay cần chú ý vitamin B12, vì chủ yếu có trong thực phẩm động vật — thiếu hụt có thể gây vấn đề thần kinh; bổ sung hoặc dùng thực phẩm tăng cường (sữa đậu nành tăng cường, men dinh dưỡng) giúp đáp ứng nhu cầu. Cũng cần chú ý sắt (kết hợp thực phẩm giàu vitamin C), canxi (đậu phụ, mè, rau xanh đậm) và Omega-3 (óc chó, hạt lanh, hạt chia).'}}
    ],
    safeRows:[
      {ok:true,zh:'烹調前用鹽水浸泡或撒鹽豆腐10–20分鐘去除多餘水分',en:'Salt or brine tofu for 10–20 minutes before cooking to remove excess moisture'},
      {ok:true,zh:'使用味噌、醬油、香菇、昆布等天然鮮味食材增添風味',en:'Use natural umami ingredients like miso, soy sauce, shiitake, and kombu to boost flavor'},
      {ok:true,zh:'乾香菇與昆布泡水製作蔬食高湯作為湯底',en:'Rehydrate dried shiitake and kombu to make a plant-based stock base'},
      {ok:true,zh:'全素飲食者透過補充劑或強化食品攝取維生素B12',en:'Vegans get vitamin B12 through supplements or fortified foods'},
      {ok:true,zh:'搭配維生素C食物食用以提升植物性鐵質吸收率',en:'Pair iron-rich plant foods with vitamin C sources to improve absorption'},
      {ok:false,zh:'豆腐未經處理直接下鍋油炸，導致大量出水濺油',en:'Frying untreated tofu directly, causing excess water release and oil splatter'},
      {ok:false,zh:'僅用鹽和糖調味，忽略鮮味來源導致味道單薄',en:'Seasoning only with salt and sugar while ignoring umami sources, resulting in flat flavor'},
      {ok:false,zh:'長期全素飲食卻未留意B12、鐵、鈣等營養素補充',en:'Following a vegan diet long-term without attention to B12, iron, and calcium intake'}
    ],
    tip:{zh:'💡 蔬食料理的關鍵在於「處理」與「層次」：豆腐先處理去水才能煎出金黃外殼；善用味噌、香菇、昆布等天然鮮味來源疊加風味，就能做出不輸肉類的濃郁口感。同時別忘了關注B12、鐵、鈣、Omega-3等營養素，讓蔬食既美味又均衡。',en:'💡 The key to plant-based cooking is \"preparation\" and \"layering\": pre-treating tofu to remove water lets it pan-fry to a golden crust; layering natural umami sources like miso, shiitake, and kombu creates depth that rivals meat dishes. Don\'t forget to track B12, iron, calcium, and Omega-3 for a tasty and balanced plant-based diet.',id:'💡 Kunci masak nabati adalah \"persiapan\" dan \"lapisan rasa\": tahu yang diproses dulu menghasilkan kulit emas saat digoreng; melapisi sumber umami alami seperti miso, shiitake, dan kombu menciptakan kedalaman rasa setara daging. Jangan lupa perhatikan B12, zat besi, kalsium, dan Omega-3 untuk diet nabati yang lezat dan seimbang.',vi:'💡 Bí quyết nấu ăn thuần chay là \"sơ chế\" và \"tạo tầng vị\": đậu phụ được sơ chế trước sẽ có lớp vỏ vàng giòn khi chiên; kết hợp các nguồn umami tự nhiên như miso, nấm shiitake và kombu tạo độ đậm đà sánh ngang món thịt. Đừng quên chú ý B12, sắt, canxi và Omega-3 để chế độ ăn thuần chay vừa ngon vừa cân bằng.'}

  /* Lv11 高湯與湯品基礎 ── 新增 */
  {
    title:{zh:'高湯與湯品基礎完全指南',en:'Complete Stock & Soup Basics Guide',id:'Panduan Lengkap Dasar Kaldu & Sup',vi:'Hướng dẫn cơ bản nước dùng & súp toàn diện'},
    visual:{
      title:{zh:'雞高湯製作步驟圖解',en:'Chicken Stock Step-by-Step'},
      html:`<div class="ksteps" style="margin:0">
        <div class="kstep"><div class="kstep-num">1</div><div class="kstep-txt"><strong>冷水下鍋</strong>：雞骨架+薑片+冷水 → 開火<br><span style="color:#888;font-size:10px">Cold water start → bones + ginger + heat on</span></div></div>
        <div class="kstep"><div class="kstep-num">2</div><div class="kstep-txt"><strong>撈除浮沫</strong>：水滾前持續撈清白色浮沫<br><span style="color:#888;font-size:10px">Before boiling — skim all white foam thoroughly</span></div></div>
        <div class="kstep"><div class="kstep-num">3</div><div class="kstep-txt"><strong>轉小火慢煮</strong>：維持微滾（不沸騰），不攪動，1.5–2小時<br><span style="color:#888;font-size:10px">Gentle simmer (not boiling), no stirring, 1.5–2 hours</span></div></div>
        <div class="kstep"><div class="kstep-num">4</div><div class="kstep-txt"><strong>過濾雜質</strong>：細篩網或紗布過濾湯中固體<br><span style="color:#888;font-size:10px">Strain through fine sieve or cheesecloth</span></div></div>
        <div class="kstep"><div class="kstep-num">5</div><div class="kstep-txt"><strong>最後調鹽</strong>：接近完成才加鹽，冷卻後分裝冷凍<br><span style="color:#888;font-size:10px">Season at the end, cool fast then portion & freeze</span></div></div>
      </div>
      <div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">
        <span style="background:#e8f5ee;border:1px solid #a5d6a7;border-radius:4px;padding:3px 8px;font-size:10.5px;color:#1a5c30">✅ 冷水起鍋→湯清</span>
        <span style="background:#fdecea;border:1px solid #f5c6c2;border-radius:4px;padding:3px 8px;font-size:10.5px;color:#b71c1c">❌ 大火猛滾→湯濁</span>
        <span style="background:#e8f5ee;border:1px solid #a5d6a7;border-radius:4px;padding:3px 8px;font-size:10.5px;color:#1a5c30">✅ 最後加鹽→風味足</span>
        <span style="background:#fdecea;border:1px solid #f5c6c2;border-radius:4px;padding:3px 8px;font-size:10.5px;color:#b71c1c">❌ 早加鹽→鹹度失控</span>
      </div>`
    },
    items:[
      {icon:'🐔',zh:'雞高湯製作步驟',en:'Chicken Stock Steps',desc:{zh:'冷水放入雞骨／雞架與薄薑片，開火後轉小火，水滾前撈除浮沫，小火維持微滾1.5–2小時，過程中不要攪動以免湯濁，起鍋前再加鹽調味。',en:'Start with cold water, chicken bones/carcass, and a few ginger slices. Bring to a gentle simmer over low heat, skim foam before it boils, maintain a gentle simmer for 1.5–2 hours without stirring (to avoid clouding), and season with salt only at the end.',id:'Mulai dengan air dingin, tulang/karkas ayam, dan beberapa iris jahe. Didihkan perlahan dengan api kecil, angkat buih sebelum mendidih, pertahankan mendidih perlahan 1,5–2 jam tanpa diaduk (agar tidak keruh), dan beri garam hanya di akhir.',vi:'Bắt đầu với nước lạnh, xương/khung gà, và vài lát gừng. Đun sôi lăn tăn với lửa nhỏ, hớt bọt trước khi sôi, giữ sôi lăn tăn 1,5–2 giờ không khuấy (để tránh đục), và chỉ nêm muối vào cuối.'}},
      {icon:'🥬',zh:'蔬菜高湯基礎組合',en:'Vegetable Stock Base',desc:{zh:'經典蔬菜高湯比例為洋蔥:紅蘿蔔:西芹約2:1:1，切大塊增加釋出風味的表面積，避免使用十字花科蔬菜（如花椰菜、高麗菜）以免產生苦味與異味，小火熬煮30–45分鐘即可，不需久煮。',en:'A classic vegetable stock ratio is onion:carrot:celery about 2:1:1. Cut into large pieces for more surface area to release flavor. Avoid cruciferous vegetables (broccoli, cabbage) as they can turn bitter and odorous. Simmer gently for 30–45 minutes — no need to cook longer.',id:'Rasio kaldu sayur klasik adalah bawang bombay:wortel:seledri sekitar 2:1:1. Potong besar untuk permukaan lebih luas. Hindari sayuran cruciferous (brokoli, kubis) karena bisa pahit dan berbau. Masak perlahan 30–45 menit saja.',vi:'Tỷ lệ nước dùng rau cổ điển là hành tây:cà rốt:cần tây khoảng 2:1:1. Cắt miếng to để tăng diện tích tỏa hương vị. Tránh rau họ cải (bông cải, bắp cải) vì có thể gây vị đắng và mùi lạ. Ninh nhỏ lửa 30–45 phút là đủ.'}},
      {icon:'🦴',zh:'大骨湯前置處理：焯水',en:'Bone Broth Prep: Blanching',desc:{zh:'大骨或雞骨先放入冷水中煮至沸騰3–5分鐘，撈出後用清水沖洗掉表面血水與雜質，再重新加入乾淨冷水開始熬煮，這個步驟可大幅減少湯的腥味與浮渣，是熬出清湯的關鍵。',en:'Place bones in cold water and bring to a boil for 3–5 minutes, then drain and rinse off surface blood and impurities under running water. Start the actual simmer with fresh cold water. This step greatly reduces off-odors and scum, key to a clear broth.',id:'Letakkan tulang dalam air dingin, didihkan 3–5 menit, lalu tiriskan dan bilas darah/kotoran di permukaan dengan air mengalir. Mulai memasak sebenarnya dengan air dingin baru. Langkah ini sangat mengurangi bau dan kotoran, kunci kaldu jernih.',vi:'Cho xương vào nước lạnh, đun sôi 3–5 phút, rồi vớt ra rửa sạch máu/tạp chất bề mặt dưới vòi nước. Bắt đầu ninh thật với nước lạnh mới. Bước này giảm đáng kể mùi hôi và cặn, chìa khóa cho nước dùng trong.'}},
      {icon:'🍲',zh:'常見湯品三大分類',en:'3 Common Soup Categories',desc:{zh:'①清湯（如：蘿蔔排骨湯）— 湯色清澈，重視原汁原味。②濃湯／羹湯（如：玉米濃湯、酸辣湯）— 透過食材打碎、太白粉或鮮奶油增加濃稠度。③燉湯（如：藥膳雞湯）— 長時間小火慢燉，使食材軟爛、湯味濃郁。依湯品類型選擇對應的火候與時間，是做出好湯的第一步。',en:'①Clear soup (e.g., radish pork rib soup) — clear broth focused on natural flavor. ②Thick soup/cream soup (e.g., corn chowder, hot & sour soup) — thickened with blended ingredients, cornstarch, or cream. ③Braised/stewed soup (e.g., herbal chicken soup) — long, slow simmer for tender ingredients and rich flavor. Matching heat and time to the soup type is the first step to a good soup.',id:'①Sup bening (misal: sup tulang lobak) — kuah jernih, fokus rasa alami. ②Sup kental/krim (misal: sup jagung, sup asam pedas) — dikentalkan dengan bahan diblender, maizena, atau krim. ③Sup rebus lama (misal: sup ayam herbal) — dimasak lama dengan api kecil agar bahan lembut dan rasa kaya.',vi:'①Súp trong (ví dụ: canh sườn củ cải) — nước trong, chú trọng vị tự nhiên. ②Súp đặc/kem (ví dụ: súp ngô, súp chua cay) — làm đặc bằng nguyên liệu xay, bột năng hoặc kem. ③Súp hầm (ví dụ: gà hầm thuốc bắc) — ninh lâu lửa nhỏ để nguyên liệu mềm và vị đậm đà.'}},
      {icon:'🧂',zh:'湯品調味時機與澄清技巧',en:'Seasoning Timing & Clarifying',desc:{zh:'調味應在湯品熬煮接近完成時才加鹽，過早加鹽會使蛋白質提早凝固、影響鮮味釋出，且久煮會使鹹度濃縮過鹹。澄清技巧：撈除表面浮沫與油脂、用細濾網或紗布過濾雜質，可使湯色更清亮、口感更細緻。',en:'Add salt near the end of cooking — adding it too early can cause proteins to set prematurely and reduce flavor release, and prolonged cooking will concentrate saltiness too much. Clarifying tips: skim foam and fat from the surface, and strain through a fine sieve or cheesecloth for a clearer, smoother result.',id:'Tambahkan garam menjelang akhir masak — terlalu awal membuat protein mengeras lebih cepat dan mengurangi rasa, dan memasak lama akan membuat terlalu asin. Tips menjernihkan: angkat buih dan lemak di permukaan, saring dengan saringan halus atau kain kasa.',vi:'Nêm muối gần cuối khi nấu — nêm quá sớm khiến protein đông sớm và giảm vị ngọt, nấu lâu sẽ làm quá mặn. Mẹo làm trong: hớt bọt và mỡ trên mặt, lọc qua rây mịn hoặc vải mỏng.'}},
      {icon:'🧊',zh:'高湯保存與分裝技巧',en:'Stock Storage & Portioning',desc:{zh:'熬好的高湯應盡快降溫（可用冰水浴加速），分裝成小份（如製冰盒、密封袋）冷凍保存，可存放2–3個月，需要時取出所需份量即可，避免重複加熱整批高湯造成風味流失與衛生風險。冷藏保存則建議3–4天內使用完畢。',en:'Cool finished stock quickly (an ice bath speeds this up), then portion into small containers (e.g., ice cube trays, freezer bags) and freeze for up to 2–3 months. Take out only what you need to avoid repeatedly reheating the whole batch, which loses flavor and raises hygiene risks. If refrigerated, use within 3–4 days.',id:'Dinginkan kaldu yang sudah jadi secepat mungkin (rendaman air es membantu), lalu bagi ke wadah kecil (nampan es batu, kantong freezer) dan bekukan hingga 2–3 bulan. Ambil hanya yang dibutuhkan agar tidak memanaskan ulang seluruh batch. Jika di kulkas, gunakan dalam 3–4 hari.',vi:'Làm lạnh nhanh nước dùng đã nấu (ngâm đá giúp nhanh hơn), rồi chia thành phần nhỏ (khay đá, túi đông lạnh) và đông lạnh tới 2–3 tháng. Chỉ lấy ra phần cần dùng để tránh hâm lại cả mẻ làm mất hương vị. Nếu để tủ lạnh, dùng trong 3–4 ngày.'}}
    ],

      {ok:false,zh:'整批高湯反覆加熱多次後才用完',en:'Repeatedly reheating the whole batch of stock before using it up'}
    ],
    tip:{zh:'💡 一鍋好湯的關鍵口訣「冷水起、小火滾、勤撈沫、晚下鹽」：冷水下鍋讓風味慢慢釋出，小火維持清澈，隨時撈除浮沫雜質，最後才調味，就能熬出清澈鮮美的高湯，是中西式湯品共通的基本功。',en:'💡 The golden rule for great stock: \"cold start, gentle simmer, skim often, season last\" — starting with cold water lets flavors release slowly, gentle heat keeps it clear, regular skimming removes impurities, and seasoning at the end gives a clear, flavorful stock. This is a universal foundation for both Chinese and Western soups.',id:'💡 Kunci kaldu enak: \"mulai dingin, mendidih perlahan, sering angkat buih, garam di akhir\" — air dingin membuat rasa keluar perlahan, api kecil menjaga kejernihan, angkat buih secara rutin, dan beri garam di akhir untuk kaldu jernih dan gurih. Ini dasar universal untuk sup gaya Tionghoa maupun Barat.',vi:'💡 Bí quyết nước dùng ngon: \"bắt đầu lạnh, sôi lăn tăn, hớt bọt thường xuyên, nêm muối cuối cùng\" — nước lạnh giúp hương vị tan ra chậm, lửa nhỏ giữ độ trong, hớt bọt thường xuyên loại bỏ tạp chất, và nêm gia vị cuối cùng cho nước dùng trong và đậm đà. Đây là nền tảng chung cho cả súp kiểu Trung và Tây.'}
  },
  /* Lv12 食材辨識與採購 ── 新增 */
  {
    title:{zh:'食材辨識與採購完全指南',en:'Complete Ingredient ID & Shopping Guide',id:'Panduan Lengkap Identifikasi & Belanja Bahan',vi:'Hướng dẫn nhận biết & mua nguyên liệu toàn diện'},
    visual:{
      title:{zh:'食材新鮮度速查圖解：看・摸・聞・壓',en:'Freshness Check: Look · Touch · Smell · Press'},
      html:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
        <div style="background:#e8f5ee;border:1px solid #a5d6a7;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🐟 魚類 Fish</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            👁️ 眼睛清澈凸出<br>
            🔴 魚鰓鮮紅無黏液<br>
            👆 肉質按壓有彈性<br>
            👃 淡淡海腥味（非惡臭）
          </div>
        </div>
        <div style="background:#fce4ec;border:1px solid #f48fb1;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🥩 肉類 Meat</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            🌸 豬肉粉紅、牛肉鮮紅<br>
            ✋ 肉面有光澤不黏滑<br>
            💪 按壓有彈性回彈<br>

          </div>
        </div>
        <div style="background:#e3f2fd;border:1px solid #90caf9;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🥦 蔬菜 Vegetables</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            🌿 葉片挺立、色澤鮮亮<br>
            💧 無黃葉、軟爛或斑點<br>
            ✋ 根莖表面硬實<br>
            👃 無發酵酸腐氣味
          </div>
        </div>
        <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🍑 水果 Fruits</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            🎨 色澤均勻、無壓傷<br>
            ✋ 手感硬實（視種類）<br>

      <div style="margin-top:6px;background:#f5f5f5;border-radius:6px;padding:6px 10px;font-size:10.5px;color:#555">

      </div>`

    items:[
      {icon:'🐟',zh:'海鮮新鮮度判斷要點',en:'Seafood Freshness Checkpoints',desc:{zh:'魚類：眼睛清澈凸出、魚鰓鮮紅無黏液、魚身按壓有彈性會回彈、魚鱗緊附不易脫落。蝦類：外殼透亮有光澤、頭尾緊連身體、無變黑現象。蛤蜊／貝類：購買時應仍緊閉或輕觸會閉合，聞起來應有淡淡海水味而非腥臭味。',en:'Fish: clear, bulging eyes; bright red, slime-free gills; flesh that springs back when pressed; scales that adhere tightly. Shrimp: translucent, shiny shell; head and tail firmly attached to the body; no black discoloration. Clams/shellfish: shells should be tightly closed or close when tapped, with a faint sea smell rather than a foul odor.',id:'Ikan: mata jernih menonjol; insang merah cerah tanpa lendir; daging kenyal saat ditekan; sisik menempel kuat. Udang: cangkang bening berkilau; kepala dan ekor menyatu kuat dengan badan; tidak menghitam. Kerang: cangkang harus tertutup rapat atau menutup saat disentuh, berbau laut tipis bukan bau busuk.',vi:'Cá: mắt trong lồi; mang đỏ tươi không nhớt; thịt đàn hồi khi ấn; vảy dính chặt. Tôm: vỏ trong sáng bóng; đầu và đuôi gắn chặt với thân; không bị đen. Sò/nghêu: vỏ phải khép chặt hoặc khép lại khi chạm, có mùi biển nhẹ chứ không phải mùi hôi.'}},
      {icon:'🥩',zh:'肉類新鮮度判斷要點',en:'Meat Freshness Checkpoints',desc:{zh:'豬肉：呈淡粉紅色，脂肪潔白，表面略濕潤但不黏手，按壓有彈性。雞肉：皮膚呈淡黃或淡粉色，無異味，肉質緊實。牛肉：呈鮮紅色，脂肪呈乳白或淡黃色，紋理清晰。所有肉類若出現灰綠色、表面黏液過多或散發酸臭異味，皆應避免購買。',en:'Pork: pale pink with white fat, slightly moist but not sticky surface, springs back when pressed. Chicken: pale yellow or pink skin, no off-odor, firm flesh. Beef: bright red with creamy white or pale yellow fat, clear marbling. Avoid any meat that is grayish-green, excessively slimy, or has a sour/foul smell.',id:'Babi: merah muda pucat dengan lemak putih, permukaan sedikit lembap tapi tidak lengket, kenyal saat ditekan. Ayam: kulit kuning pucat atau merah muda, tanpa bau, daging padat. Sapi: merah cerah dengan lemak krem atau kuning pucat, serat jelas. Hindari daging yang abu-abu kehijauan, terlalu berlendir, atau berbau asam/busuk.',vi:'Thịt heo: màu hồng nhạt với mỡ trắng, bề mặt hơi ẩm nhưng không nhớt, đàn hồi khi ấn. Thịt gà: da vàng nhạt hoặc hồng, không có mùi lạ, thịt chắc. Thịt bò: màu đỏ tươi với mỡ trắng kem hoặc vàng nhạt, vân thịt rõ. Tránh thịt có màu xám xanh, quá nhớt, hoặc có mùi chua/hôi.'}},
      {icon:'🥦',zh:'蔬果新鮮度判斷要點',en:'Produce Freshness Checkpoints',desc:{zh:'葉菜類：葉片挺立、色澤鮮綠、無黃葉或軟爛斑點。根莖類（紅蘿蔔、馬鈴薯）：表面硬實、無發芽或皺縮。水果：依香氣判斷熟度（如鳳梨、芒果底部聞起來應有自然果香），避免表皮有壓傷凹陷或滲出汁液。整體原則：用「看色澤、摸軟硬、聞氣味」三步驟快速檢查。',en:'Leafy greens: crisp, upright leaves with vibrant green color, no yellowing or mushy spots. Root vegetables (carrots, potatoes): firm surface, no sprouting or shriveling. Fruit: judge ripeness by aroma (e.g., pineapple and mango should smell fragrant at the base), and avoid bruised, dented, or leaking skin. General rule: \"look at color, feel firmness, smell the aroma\" as a quick 3-step check.',id:'Sayuran daun: daun tegak, hijau cerah, tanpa bagian kuning atau lembek. Sayuran akar (wortel, kentang): permukaan keras, tidak bertunas atau keriput. Buah: nilai kematangan dari aroma (nanas, mangga harus beraroma di bagian bawah), hindari kulit memar atau bocor. Aturan umum: \"lihat warna, raba kekerasan, cium aroma\".',vi:'Rau lá: lá đứng, xanh tươi, không vàng hoặc nhũn. Rau củ (cà rốt, khoai tây): bề mặt cứng, không mọc mầm hoặc nhăn nheo. Trái cây: đánh giá độ chín qua mùi hương (dứa, xoài nên có mùi thơm ở đáy), tránh vỏ bị bầm hoặc chảy nước. Quy tắc chung: \"nhìn màu, sờ độ cứng, ngửi mùi\".'}},
      {icon:'🏷️',zh:'食品標籤與保存期限解讀',en:'Reading Food Labels & Expiry Dates',desc:{zh:'標籤上應留意：①有效日期／保存期限（此日期前品質安全無虞，購買時應選擇較晚的日期）。②保存方式（常溫、冷藏、冷凍）需依標示正確存放。③成分表：成分依含量多寡排序，第一項即為主要成分。④過敏原標示：對特定食材過敏者務必確認。開封後即使尚未到期，也應依「開封後建議天數」儘快食用完畢。',en:'On labels, check: ①Expiry/best-before date (the food is safe and good quality before this date — choose later dates when shopping). ②Storage instructions (ambient, refrigerated, frozen) — store as directed. ③Ingredient list — ingredients are listed by quantity, with the first being the main ingredient. ④Allergen labeling — essential for those with food allergies. Even before expiry, follow \"use within X days after opening\" guidance.',id:'Pada label, perhatikan: ①Tanggal kedaluwarsa (makanan aman sebelum tanggal ini — pilih tanggal yang lebih lama saat berbelanja). ②Instruksi penyimpanan (suhu ruang, kulkas, beku) — simpan sesuai petunjuk. ③Daftar bahan — diurutkan berdasarkan jumlah, yang pertama adalah bahan utama. ④Label alergen — penting bagi yang memiliki alergi.',vi:'Trên nhãn, kiểm tra: ①Ngày hết hạn (thực phẩm an toàn trước ngày này — chọn ngày xa hơn khi mua). ②Hướng dẫn bảo quản (thường, lạnh, đông) — bảo quản theo chỉ dẫn. ③Danh sách thành phần — xếp theo số lượng, thành phần đầu là chính. ④Nhãn dị ứng — quan trọng với người có dị ứng thực phẩm.'}},
      {icon:'🧂',zh:'常見調味料與辛香料辨識',en:'Common Seasonings & Spices ID',desc:{zh:'醬油：依顏色與用途分「生抽」（淡色、調味提鮮）與「老抽」（深色、上色用）。醋：分「白醋」（清香、適合醃漬）、「烏醋」（風味濃郁、適合台式料理）、「米酒醋」（溫和、適合涼拌）。辛香料：八角（滷味常用，呈星形）、花椒（麻味來源，顆粒小）、肉桂（甜香，條狀或粉狀）。認識這些基本款，才能依食譜正確選用。',en:'Soy sauce: classified by color/use — \"light soy sauce\" (thin, for seasoning and umami) vs \"dark soy sauce\" (thick, for color). Vinegar: \"white vinegar\" (mild, for pickling), \"black vinegar\" (rich flavor, for Taiwanese dishes), \"rice vinegar\" (mild, for cold dishes). Spices: star anise (star-shaped, common in braises), Sichuan peppercorn (small, numbing flavor), cinnamon (sweet aroma, stick or powder). Knowing these basics helps you follow recipes correctly.',id:'Kecap: berdasarkan warna/penggunaan — \"kecap asin/encer\" (untuk rasa dan umami) vs \"kecap manis/kental\" (untuk warna). Cuka: \"cuka putih\" (ringan, untuk acar), \"cuka hitam\" (rasa kaya, untuk masakan Taiwan), \"cuka beras\" (ringan, untuk hidangan dingin). Rempah: bunga lawang (bentuk bintang, untuk masakan kuah), merica Sichuan (kecil, rasa kebas), kayu manis (aroma manis, batang atau bubuk).',vi:'Nước tương: theo màu/dùng — \"tương nhạt\" (loãng, để nêm và tạo umami) và \"tương đậm\" (đặc, để tạo màu). Giấm: \"giấm trắng\" (nhẹ, để ngâm chua), \"giấm đen\" (đậm vị, cho món Đài Loan), \"giấm gạo\" (nhẹ, cho món trộn). Gia vị: hồi (hình sao, dùng kho), tiêu Tứ Xuyên (nhỏ, gây tê), quế (thơm ngọt, dạng thanh hoặc bột).'}},
      {icon:'💰',zh:'採購預算與比價技巧',en:'Budgeting & Price Comparison',desc:{zh:'①以「單位價格」（每100克或每公斤價格）比較不同包裝大小的商品，避免被「特大包裝看似便宜」誤導。②列好採購清單並設定每週預算，到場後依清單採購可減少衝動消費。③優先選擇當季食材，價格通常較便宜且品質較佳。④冷凍食品與乾貨可在促銷時適量囤貨，但生鮮食材應依需求量購買，避免過期浪費。⑤善用「先進先出」原則整理採購回來的食材。',en:'①Compare \"unit price\" (per 100g or per kg) across different package sizes — large packages aren\'t always cheaper. ②Make a shopping list with a weekly budget and stick to it to reduce impulse buying. ③Prioritize seasonal ingredients, which are usually cheaper and better quality. ④Frozen and dry goods can be stocked up during sales, but buy fresh ingredients only in needed quantities to avoid waste. ⑤Apply \"first-in-first-out\" when organizing what you bring home.',id:'①Bandingkan \"harga per unit\" (per 100g atau per kg) antar ukuran kemasan — kemasan besar tidak selalu lebih murah. ②Buat daftar belanja dengan anggaran mingguan dan patuhi untuk mengurangi pembelian impulsif. ③Prioritaskan bahan musiman, biasanya lebih murah dan berkualitas. ④Makanan beku dan kering bisa ditimbun saat promo, tapi bahan segar beli sesuai kebutuhan. ⑤Terapkan \"first-in-first-out\" saat menyimpan belanjaan.',vi:'①So sánh \"giá trên đơn vị\" (mỗi 100g hoặc mỗi kg) giữa các kích cỡ gói — gói lớn không phải lúc nào cũng rẻ hơn. ②Lập danh sách mua sắm với ngân sách hàng tuần và tuân theo để giảm mua sắm bốc đồng. ③Ưu tiên nguyên liệu theo mùa, thường rẻ hơn và chất lượng tốt hơn. ④Thực phẩm đông lạnh và khô có thể mua khi giảm giá, nhưng thực phẩm tươi chỉ mua theo nhu cầu. ⑤Áp dụng \"nhập trước xuất trước\" khi sắp xếp đồ mua về.'}}
    ],
    safeRows:[

      {ok:true,zh:'比較單位價格而非只看包裝總價',en:'Compare unit prices rather than total package price'},
      {ok:true,zh:'優先選購當季且即將到期日較晚的食材',en:'Prioritize seasonal items with later expiry dates'},
      {ok:true,zh:'依保存方式（冷藏／冷凍／常溫）正確存放食材',en:'Store ingredients correctly per their labeled storage method'},

      {ok:false,zh:'忽略食品標籤上的有效日期與保存方式',en:'Ignoring the expiry date and storage instructions on food labels'}
    ],
    tip:{zh:'💡 採購三步驟口訣「看標籤、比單價、列清單」：出門前先列好清單與預算，到場後用單位價格比較商品，並隨手檢查有效日期與新鮮度三大指標（看色澤、摸軟硬、聞氣味），就能用最划算的價格買到最新鮮的食材。',en:'💡 The 3-step shopping rule: \"check labels, compare unit prices, follow your list\" — make a list and budget before you go, compare unit prices in-store, and check expiry dates plus the 3 freshness signs (color, firmness, smell) to get the freshest ingredients at the best value.',id:'💡 Aturan belanja 3 langkah: \"cek label, bandingkan harga per unit, ikuti daftar\" — buat daftar dan anggaran sebelum berangkat, bandingkan harga per unit di toko, dan periksa tanggal kedaluwarsa serta 3 tanda kesegaran (warna, kekerasan, aroma) untuk mendapatkan bahan paling segar dengan harga terbaik.',vi:'💡 Quy tắc mua sắm 3 bước: \"kiểm tra nhãn, so sánh giá đơn vị, theo danh sách\" — lập danh sách và ngân sách trước khi đi, so sánh giá đơn vị tại cửa hàng, và kiểm tra ngày hết hạn cùng 3 dấu hiệu tươi (màu, độ cứng, mùi) để mua được nguyên liệu tươi nhất với giá tốt nhất.'}
