   {q:{zh:'在預算有限的情況下，如何透過菜單規劃減少餐費支出？',en:'With a limited budget, how can menu planning help reduce food costs?',id:'Dengan anggaran terbatas, bagaimana perencanaan menu membantu mengurangi biaya makanan?',vi:'Với ngân sách hạn chế, lên kế hoạch thực đơn giúp giảm chi phí ăn uống như thế nào?'},
    opts:[{zh:'每天外食，避免在家備料浪費',en:'Eat out every day to avoid wasting food at home',id:'Makan di luar setiap hari untuk menghindari pemborosan bahan di rumah',vi:'Ăn ngoài mỗi ngày để tránh lãng phí thực phẩm ở nhà',ok:false},
          {zh:'提前規劃週菜單，批量採購當季食材，減少食材浪費',en:'Plan the weekly menu in advance, buy seasonal ingredients in bulk, and minimize waste',id:'Rencanakan menu mingguan sebelumnya, beli bahan musiman dalam jumlah besar, dan minimalkan pemborosan',vi:'Lên thực đơn tuần trước, mua nguyên liệu theo mùa số lượng lớn và giảm lãng phí',ok:true},
          {zh:'只買高價食材，品質好代表物超所值',en:'Only buy expensive ingredients — high quality means better value',id:'Hanya beli bahan mahal — kualitas tinggi berarti lebih hemat',vi:'Chỉ mua nguyên liệu đắt tiền — chất lượng cao đồng nghĩa đáng đồng tiền',ok:false}],
    fb:{zh:'正確！提前規劃週菜單，依清單集中採購當季食材，能有效避免衝動購買和食材過期浪費。當季食材通常價格低且新鮮度最佳。',en:'Correct! Planning the weekly menu in advance and buying seasonal ingredients in bulk reduces impulse purchases and food spoilage. Seasonal ingredients are usually the cheapest and freshest.',id:'Benar! Merencanakan menu mingguan dan membeli bahan musiman dalam jumlah besar mengurangi pembelian impulsif dan pemborosan.',vi:'Đúng! Lên thực đơn tuần trước và mua nguyên liệu theo mùa giảm mua bốc đồng và lãng phí. Nguyên liệu theo mùa thường rẻ và tươi nhất.'}},
   {q:{zh:'份量計算時，成人每日建議攝取的蛋白質食物份量大約是？',en:'When calculating portions, approximately how much protein food should an adult consume daily?',id:'Saat menghitung porsi, berapa banyak makanan protein yang harus dikonsumsi orang dewasa setiap hari?',vi:'Khi tính khẩu phần, người lớn nên ăn bao nhiêu thực phẩm giàu đạm mỗi ngày?'},
    opts:[{zh:'每天至少500克',en:'At least 500 g per day',id:'Setidaknya 500 g per hari',vi:'Ít nhất 500 g mỗi ngày',ok:false},
          {zh:'約3–8份，每份約35克（一份相當於大拇指大小）',en:'About 3–8 servings, ~35 g each (roughly thumb-sized)',id:'Sekitar 3–8 porsi, ~35 g per porsi (sekitar ukuran ibu jari)',vi:'Khoảng 3–8 phần, mỗi phần khoảng 35 g (cỡ ngón cái)',ok:true},
          {zh:'每天只需要吃一次，不用特別計算',en:'Once a day is enough, no need to calculate',id:'Sehari sekali sudah cukup, tidak perlu menghitung',vi:'Một lần mỗi ngày là đủ, không cần tính',ok:false}],
    fb:{zh:'正確！依台灣每日飲食指南，成人每日建議攝取3–8份豆魚蛋肉類，每份約35克，依個人體重與活動量調整。菜單規劃時可依此估算食材用量。',en:'Correct! Taiwan\'s dietary guidelines recommend 3–8 daily servings of protein foods for adults, ~35 g each, adjusted for weight and activity. Use this to estimate ingredient amounts when planning.',id:'Benar! Panduan diet Taiwan merekomendasikan 3–8 porsi makanan protein per hari untuk orang dewasa, ~35 g per porsi.',vi:'Đúng! Hướng dẫn dinh dưỡng Đài Loan khuyến nghị 3–8 phần thực phẩm đạm mỗi ngày cho người lớn, ~35 g mỗi phần.'}},
   {q:{zh:'製作一週菜單時，如何確保每天攝取足夠的蔬菜？',en:'When creating a weekly menu, how do you ensure adequate daily vegetable intake?',id:'Saat membuat menu mingguan, bagaimana memastikan asupan sayuran harian yang cukup?',vi:'Khi lên thực đơn tuần, làm thế nào để đảm bảo lượng rau củ đủ mỗi ngày?'},
    opts:[{zh:'只在週末吃大量蔬菜補足',en:'Only eat large amounts of vegetables on weekends to compensate',id:'Hanya makan banyak sayuran di akhir pekan untuk mengimbangi',vi:'Chỉ ăn nhiều rau vào cuối tuần để bù đắp',ok:false},
          {zh:'每餐至少規劃一到兩道蔬菜料理，選用不同顏色蔬菜',en:'Plan at least one to two vegetable dishes per meal using different colored vegetables',id:'Rencanakan setidaknya satu hingga dua hidangan sayuran per makan menggunakan sayuran berbeda warna',vi:'Lên kế hoạch ít nhất một đến hai món rau mỗi bữa, chọn rau nhiều màu khác nhau',ok:true},
          {zh:'每天只吃一種固定蔬菜，確保食材利用最大化',en:'Eat only one fixed vegetable each day to maximize ingredient use',id:'Makan hanya satu sayuran tetap setiap hari untuk memaksimalkan penggunaan bahan',vi:'Chỉ ăn một loại rau cố định mỗi ngày để tối đa hóa việc sử dụng nguyên liệu',ok:false}],
    fb:{zh:'正確！每餐規劃1–2道蔬菜料理，並搭配不同顏色（深綠、橘紅、紫色等）的蔬菜，能確保每日蔬菜攝取量，也能獲得多元的植化素與維生素。',en:'Correct! Planning 1–2 vegetable dishes per meal with a variety of colors (dark green, orange, purple, etc.) ensures adequate daily vegetable intake and diverse phytonutrients and vitamins.',id:'Benar! Merencanakan 1–2 hidangan sayuran per makan dengan berbagai warna memastikan asupan sayuran harian yang cukup dan beragam nutrisi.',vi:'Đúng! Lên kế hoạch 1–2 món rau mỗi bữa với nhiều màu sắc khác nhau đảm bảo lượng rau đủ mỗi ngày và cung cấp đa dạng phytonutrients và vitamin.'}},
   {q:{zh:'設計菜單時，什麼是「五感均衡」原則？',en:'When designing a menu, what does the "five-sense balance" principle refer to?',id:'Saat mendesain menu, apa yang dimaksud dengan prinsip "keseimbangan panca indera"?',vi:'Khi thiết kế thực đơn, nguyên tắc "cân bằng ngũ giác" là gì?'},
    opts:[{zh:'每道菜都要用五種以上的食材',en:'Every dish must use more than five ingredients',id:'Setiap hidangan harus menggunakan lebih dari lima bahan',vi:'Mỗi món phải dùng hơn năm nguyên liệu',ok:false},
          {zh:'注意色澤、香氣、口感、味道、溫度的多樣化，讓用餐體驗豐富',en:'Pay attention to variety in color, aroma, texture, taste, and temperature for a rich dining experience',id:'Perhatikan variasi warna, aroma, tekstur, rasa, dan suhu untuk pengalaman makan yang kaya',vi:'Chú ý đa dạng về màu sắc, hương thơm, kết cấu, hương vị và nhiệt độ để có trải nghiệm ăn uống phong phú',ok:true},
          {zh:'每道菜均衡攝取五種主要調味料',en:'Each dish should contain five main seasonings in balance',id:'Setiap hidangan harus mengandung lima bumbu utama secara seimbang',vi:'Mỗi món nên chứa năm gia vị chính cân bằng',ok:false}],
    fb:{zh:'正確！優秀的菜單設計需考慮五感：視覺（食材顏色搭配多樣）、嗅覺（香氣豐富不單一）、觸覺（軟硬口感對比）、味覺（酸甜苦鹹鮮均衡）、聽覺（如脆食的聲音）。整體用餐體驗才能令人滿意。',en:'Correct! Great menu design addresses all five senses: sight (diverse colors), smell (varied aromas), touch/texture (soft vs crispy contrast), taste (balanced sour, sweet, bitter, salty, umami), and sound (crunch). This creates a satisfying overall experience.',id:'Benar! Desain menu yang baik mempertimbangkan semua panca indera: penglihatan (warna beragam), penciuman (aroma bervariasi), tekstur (kontras lembut-renyah), rasa (seimbang), dan suara (kerenyahan).',vi:'Đúng! Thiết kế thực đơn tốt chú ý đến cả năm giác quan: thị giác (màu sắc đa dạng), khứu giác (mùi thơm phong phú), xúc giác (tương phản mềm-giòn), vị giác (cân bằng chua ngọt đắng mặn umami), thính giác (tiếng giòn). Tổng thể mới tạo trải nghiệm ăn uống thỏa mãn.'}},
   {q:{zh:'準備宴客菜時，哪項原則最能控制成本又確保品質？',en:'When preparing banquet dishes, which principle best controls costs while ensuring quality?',id:'Saat menyiapkan hidangan jamuan, prinsip mana yang paling baik dalam mengendalikan biaya sekaligus memastikan kualitas?',vi:'Khi chuẩn bị tiệc, nguyên tắc nào kiểm soát chi phí tốt nhất trong khi vẫn đảm bảo chất lượng?'},
    opts:[{zh:'全部使用最便宜的食材',en:'Use the cheapest ingredients for everything',id:'Gunakan bahan termurah untuk segalanya',vi:'Dùng nguyên liệu rẻ nhất cho tất cả',ok:false},
          {zh:'規劃一到兩道重點菜使用優質食材，其餘搭配當季食材控制成本',en:'Plan one or two highlight dishes with premium ingredients; use seasonal ingredients for the rest to manage costs',id:'Rencanakan satu atau dua hidangan unggulan dengan bahan premium; gunakan bahan musiman untuk yang lainnya untuk mengelola biaya',vi:'Lên kế hoạch một hoặc hai món điểm nhấn với nguyên liệu cao cấp; dùng nguyên liệu theo mùa cho phần còn lại để kiểm soát chi phí',ok:true},
          {zh:'每道菜都使用高檔食材，不計成本',en:'Use premium ingredients in every dish regardless of cost',id:'Gunakan bahan premium di setiap hidangan tanpa memperhitungkan biaya',vi:'Dùng nguyên liệu cao cấp cho mọi món bất kể chi phí',ok:false}],
    fb:{zh:'正確！宴客菜的預算控制技巧是「主角食材升級、配角食材平民化」：挑選1–2道能讓賓客印象深刻的重點菜使用優質食材，其餘配菜搭配當季便宜的時令蔬菜，兼顧品質與成本。',en:'Correct! The budget control strategy for banquets is "upgrade the star, keep the supporting cast simple" — use premium ingredients for 1-2 standout dishes, and seasonal or budget-friendly ingredients for the rest, balancing quality and cost.',id:'Benar! Strategi kontrol anggaran untuk jamuan adalah "tingkatkan bintang, jaga pendukung tetap sederhana" — gunakan bahan premium untuk 1-2 hidangan utama, dan bahan musiman untuk yang lainnya.',vi:'Đúng! Chiến lược kiểm soát ngân sách cho tiệc là "nâng cấp ngôi sao, giữ phụ đơn giản" — dùng nguyên liệu cao cấp cho 1-2 món điểm nhấn, và nguyên liệu theo mùa cho phần còn lại, cân bằng chất lượng và chi phí.'}},
   {q:{zh:'什麼是「備量（PAR Level）」在菜單規劃中的作用？',en:'What is the role of "PAR level" in menu planning?',id:'Apa peran "tingkat PAR" dalam perencanaan menu?',vi:'"Mức PAR" có vai trò gì trong lên thực đơn?'},
    opts:[{zh:'計算每道菜的卡路里',en:'Calculate calories in each dish',id:'Menghitung kalori dalam setiap hidangan',vi:'Tính calo của mỗi món',ok:false},
          {zh:'設定食材的最低備存量，確保食材不斷貨並減少浪費',en:'Set minimum stock levels for ingredients to ensure supply and reduce waste',id:'Menetapkan tingkat stok minimum untuk bahan untuk memastikan pasokan dan mengurangi pemborosan',vi:'Thiết lập mức dự trữ tối thiểu cho nguyên liệu để đảm bảo cung ứng và giảm lãng phí',ok:true},
          {zh:'計算服務客人所需的最多員工人數',en:'Calculate the maximum number of staff needed to serve customers',id:'Menghitung jumlah maksimum staf yang dibutuhkan untuk melayani pelanggan',vi:'Tính số nhân viên tối đa cần để phục vụ khách hàng',ok:false}],
    fb:{zh:'正確！PAR Level（Periodic Automatic Replenishment，定期自動補充量）是每種食材在補貨前應維持的最低安全庫存量。設定PAR Level能確保常用食材不斷貨，同時避免過多囤積造成食材過期浪費，是專業廚房食材管理的重要工具。',en:'Correct! PAR Level (Periodic Automatic Replenishment) is the minimum safe stock level for each ingredient before reordering. Setting PAR levels ensures staples don\'t run out while avoiding overstocking and waste — a key professional kitchen inventory tool.',id:'Benar! PAR Level adalah tingkat stok aman minimum untuk setiap bahan sebelum memesan ulang. Menetapkan tingkat PAR memastikan bahan dasar tidak kehabisan stok sambil menghindari penumpukan berlebihan.',vi:'Đúng! Mức PAR (Periodic Automatic Replenishment) là mức tồn kho an toàn tối thiểu cho mỗi nguyên liệu trước khi đặt hàng lại. Thiết lập mức PAR đảm bảo nguyên liệu chủ yếu không hết hàng trong khi tránh tích trữ quá mức gây lãng phí.'}}
  ],
  /* Lv8 台灣家庭常見料理 */
  [
   {q:{zh:'「三杯雞」的「三杯」傳統上是指哪三種材料等量調配？',en:'In "Three-Cup Chicken", what are the three traditional equal-part ingredients?',id:'Dalam "Ayam Tiga Cangkir", apa tiga bahan tradisional yang takarannya sama?',vi:'Trong "Gà Ba Ly", ba nguyên liệu truyền thống ngang nhau là gì?'},
    opts:[{zh:'醬油、米酒、麻油',en:'Soy sauce, rice wine, sesame oil',id:'Kecap, arak nasi, minyak wijen',vi:'Nước tương, rượu gạo, dầu mè',ok:true},
          {zh:'醬油、糖、水',en:'Soy sauce, sugar, water',id:'Kecap, gula, air',vi:'Nước tương, đường, nước',ok:false},
          {zh:'醬油、辣椒醬、米酒',en:'Soy sauce, chili paste, rice wine',id:'Kecap, saus cabai, arak nasi',vi:'Nước tương, tương ớt, rượu gạo',ok:false}],
    fb:{zh:'正確！三杯雞的「三杯」是：醬油（鹹香）、米酒（去腥增香）、麻油（香氣）各一杯等量，九層塔（台灣羅勒）是靈魂食材，起鍋前放入大火逼出香氣立即熄火。三杯系列還可做三杯蝦、三杯透抽、三杯杏鮑菇。現代家庭版常加入糖與蒜頭調整風味。',en:'Correct! The "Three Cups" are: soy sauce (savory), rice wine (aroma, removes fishy odor), and sesame oil (fragrance) — one cup each. Taiwanese basil (九層塔) is the soul ingredient; add it at the end and turn off the heat immediately to bloom its aroma. The "Three Cup" method also works for shrimp, squid, and king oyster mushrooms.',id:'Benar! "Tiga Cangkir" adalah: kecap, arak nasi, dan minyak wijen — masing-masing satu cangkir. Kemangi Taiwan adalah bahan jiwa; tambahkan di akhir dan matikan api segera.',vi:'Đúng! "Ba ly" là: nước tương, rượu gạo và dầu mè — mỗi thứ một ly. Húng quế Đài Loan là linh hồn; thêm vào cuối và tắt lửa ngay lập tức.'}},
   {q:{zh:'台式紅燒肉（控肉）要讓豬皮軟透Q彈，最關鍵的步驟是？',en:'For Taiwanese braised pork belly, the most critical step for soft, springy skin is?',id:'Untuk babi kecap Taiwan, langkah paling kritis untuk kulit yang lembut dan kenyal adalah?',vi:'Cho thịt kho tàu Đài Loan, bước quan trọng nhất để da mềm và dai là gì?'},
    opts:[{zh:'大火快炒讓外皮上色後，直接盛盤',en:'High-heat sear to color the skin, then serve directly',id:'Tumis api besar untuk mewarnai kulit, lalu langsung disajikan',vi:'Áp chảo lửa lớn để da lên màu rồi dọn ngay',ok:false},
          {zh:'沸水川燙去血水後，以醬油、米酒、冰糖小火慢燉1–1.5小時，膠原蛋白轉化為明膠',en:'Blanch in boiling water to remove blood, then braise with soy sauce, rice wine, and rock sugar on low heat 1–1.5 hrs until collagen converts to gelatin',id:'Blanch dalam air mendidih untuk menghilangkan darah, lalu rebus dengan kecap, arak nasi, gula batu api kecil 1–1,5 jam hingga kolagen berubah menjadi gelatin',vi:'Chần trong nước sôi loại huyết, rồi kho bằng nước tương, rượu gạo, đường phèn lửa nhỏ 1–1,5 giờ cho collagen chuyển thành gelatin',ok:true},
          {zh:'用壓力鍋15分鐘快速完成',en:'Use a pressure cooker to finish in 15 minutes',id:'Gunakan panci presto untuk selesai dalam 15 menit',vi:'Dùng nồi áp suất để hoàn thành trong 15 phút',ok:false}],
    fb:{zh:'正確！台式控肉的靈魂在「小火長燉」：先川燙去除血水與雜質，再用醬油、米酒、冰糖、八角等紅燒汁，轉小火慢燉至少1–1.5小時。長時間小火讓豬皮的膠原蛋白（Collagen）充分轉化為明膠（Gelatin），造就軟透Q彈的口感，醬汁也因明膠而變得濃稠光亮。壓力鍋雖快，但無法達到同樣的風味層次與口感。',en:'Correct! The soul of Taiwanese braised pork belly is "low heat, long time": blanch first to remove blood and impurities, then braise in soy sauce, rice wine, rock sugar, and star anise on low heat for at least 1–1.5 hours. Long, low-heat cooking converts collagen in the skin to gelatin, creating a melt-soft springy texture and a rich, glossy sauce.',id:'Benar! Jiwa babi kecap Taiwan adalah "api kecil, waktu lama": blanch dulu, lalu rebus dalam kecap, arak nasi, gula batu, dan bunga lawang api kecil minimal 1–1,5 jam. Kolagen berubah menjadi gelatin, menciptakan tekstur lembut kenyal.',vi:'Đúng! Linh hồn của thịt kho tàu Đài Loan là "lửa nhỏ, thời gian dài": chần trước, rồi kho bằng nước tương, rượu gạo, đường phèn, hồi lửa nhỏ ít nhất 1–1,5 giờ. Collagen trong da chuyển thành gelatin tạo kết cấu mềm dai và nước sốt sánh bóng.'}},
   {q:{zh:'台式蒸蛋要達到光滑嫩滑不起洞，蛋液與液體的黃金比例及關鍵技巧是？',en:'For silky, pore-free Taiwanese steamed eggs, the golden ratio and key technique is?',id:'Untuk telur kukus Taiwan yang halus tanpa pori, rasio emas dan teknik kunci adalah?',vi:'Để có trứng hấp Đài Loan mịn không lỗ, tỷ lệ vàng và kỹ thuật chính là gì?'},
    opts:[{zh:'蛋:液 = 1:1，大火蒸5分鐘',en:'Egg:liquid = 1:1, steam on high heat 5 min',id:'Telur:cairan = 1:1, kukus api besar 5 menit',vi:'Trứng:lỏng = 1:1, hấp lửa lớn 5 phút',ok:false},
          {zh:'蛋:液 = 1:2～2.5，過篩去氣泡，中小火8–12分鐘，鍋蓋留縫防冷凝水滴落',en:'Egg:liquid = 1:2–2.5, strain to remove bubbles, medium-low heat 8–12 min, leave lid gap to prevent condensation drips',id:'Telur:cairan = 1:2–2,5, saring untuk menghilangkan gelembung, api sedang-kecil 8–12 menit, biarkan celah tutup',vi:'Trứng:lỏng = 1:2–2,5, lọc bỏ bọt, lửa vừa-nhỏ 8–12 phút, hé nắp tránh nước đọng',ok:true},
          {zh:'蛋:液 = 2:1，電鍋外鍋加水蒸',en:'Egg:liquid = 2:1, steam in rice cooker with water in outer pot',id:'Telur:cairan = 2:1, kukus dengan rice cooker',vi:'Trứng:lỏng = 2:1, hấp bằng nồi cơm điện',ok:false}],
    fb:{zh:'正確！台式蒸蛋黃金比例：蛋：水（或高湯）= 1:2 至 1:2.5，加少許鹽與醬油調味。四大關鍵技巧：①蛋液過細篩去除氣泡與繫帶②輕攪不打發以減少泡沫③中小火蒸（或電鍋外鍋加少量水）④鍋蓋留縫（夾筷子），防水蒸氣凝結後滴落造成表面坑洞。蒸8–12分鐘，中心略晃即可。大火和密封鍋蓋是蛋面坑洞的兩大主因。',en:'Correct! Golden ratio: egg to liquid (water or stock) = 1:2 to 1:2.5, with a little salt and soy sauce. Four key techniques: ① strain egg mixture through a fine sieve to remove bubbles and chalaza ② stir gently, never whisk ③ medium-low heat ④ leave a gap in the lid to prevent condensation dripping on the surface. Steam 8–12 minutes until just barely set in the center. High heat and a fully sealed lid are the two main causes of pitting.',id:'Benar! Rasio emas: telur ke cairan = 1:2 hingga 1:2,5. Empat teknik kunci: ① saring gelembung ② aduk perlahan ③ api sedang-kecil ④ biarkan celah di tutup. Kukus 8–12 menit.',vi:'Đúng! Tỷ lệ vàng: trứng và lỏng = 1:2 đến 1:2,5. Bốn kỹ thuật chính: ① lọc qua rây ② khuấy nhẹ không đánh ③ lửa vừa-nhỏ ④ hé nắp tránh nước đọng. Hấp 8–12 phút.'}},
   {q:{zh:'台式清蒸魚蒸好後，最後「淋熱油」這個步驟的目的是？',en:'In Taiwanese steamed fish, what is the purpose of the final step of pouring hot oil over it?',id:'Dalam ikan kukus Taiwan, apa tujuan langkah terakhir menuangkan minyak panas di atasnya?',vi:'Trong cá hấp kiểu Đài Loan, mục đích của bước cuối rưới dầu nóng là gì?'},
    opts:[{zh:'補充魚肉流失的油脂',en:'Replenish the fat lost from the fish',id:'Mengisi kembali lemak yang hilang dari ikan',vi:'Bổ sung chất béo bị mất từ cá',ok:false},
          {zh:'熱油（約180°C）瞬間爆香薑絲蔥絲，激發揮發性香氣，並與醬油融合產生醬香層次',en:'Hot oil (~180°C) instantly blooms the ginger and scallion, releasing volatile aromatics and merging with soy sauce to create layered fragrance',id:'Minyak panas (~180°C) seketika meledakkan jahe dan daun bawang, melepaskan aroma volatil dan menyatu dengan kecap',vi:'Dầu nóng (~180°C) lập tức bùng hương gừng hành, giải phóng hương dễ bay hơi và hòa với nước tương tạo lớp mùi phức',ok:true},
          {zh:'讓魚皮變脆',en:'Make the fish skin crispy',id:'Membuat kulit ikan menjadi renyah',vi:'Làm da cá giòn',ok:false}],
    fb:{zh:'正確！「淋熱油逼香」是台式（和廣式）清蒸魚最關鍵的風味步驟：蒸好後先倒掉腥水，鋪上薑絲蔥絲，淋醬油，最後澆上加熱至冒煙的熱油（約180°C）。高溫油瞬間接觸薑蔥時產生「梅納反應」，大量揮發性香氣成分被激發；油與醬油的接觸也增強醬香層次感。整個步驟在5秒內完成，卻是整道菜香氣的靈魂所在。',en:'Correct! "Hot oil blooming" is the most critical flavor step in Taiwanese (and Cantonese) steamed fish: after steaming, pour off the fishy liquid, top with ginger and scallion shreds, drizzle with soy sauce, then pour smoking-hot oil (~180°C) over everything. The high-temperature oil hitting the aromatics triggers a near-instant Maillard-adjacent reaction, releasing abundant volatile fragrance. The oil mixing with soy sauce also adds layered depth. The whole step takes 5 seconds, yet it is the soul of the dish's aroma.',id:'Benar! "Menyiram minyak panas" adalah langkah rasa paling kritis: setelah dikukus, buang air berbau amis, letakkan jahe dan daun bawang, siramkan kecap, lalu tuangkan minyak panas ~180°C.',vi:'Đúng! "Rưới dầu nóng" là bước hương vị quan trọng nhất: sau khi hấp, đổ bỏ nước tanh, rải gừng hành, thêm nước tương, rồi rưới dầu nóng ~180°C. Dầu nóng lập tức bùng hương, giải phóng hợp chất dễ bay hơi và hòa quyện với nước tương.'}},
   {q:{zh:'台灣家庭「老滷水」每次使用後的正確保存方式是？',en:'After each use of Taiwanese "aged braising liquid" (old lu shui), the correct storage method is?',id:'Setelah setiap penggunaan "cairan rebus tua" Taiwan (lao lu shui), cara penyimpanan yang benar adalah?',vi:'Sau mỗi lần dùng "nước kho cũ" của Đài Loan (lao lu shui), cách bảo quản đúng là?'},
    opts:[{zh:'直接室溫放涼後加蓋靜置，下次取用前微波加熱',en:'Let cool at room temperature, cover and rest; microwave before next use',id:'Biarkan dingin suhu ruang, tutup dan diamkan; microwave sebelum penggunaan berikutnya',vi:'Để nguội nhiệt độ phòng, đậy nắp; vi sóng trước lần dùng kế',ok:false},
          {zh:'過濾殘渣後趁熱煮沸殺菌，冷卻後冷藏（1週內用）或冷凍（最長3個月）；每次使用前再次煮沸，定期補充醬油、米酒與新鮮香料',en:'Filter out solids, boil while hot to sterilize, cool then refrigerate (use within 1 week) or freeze (up to 3 months); reboil before each use, periodically replenish soy sauce, rice wine, and fresh spices',id:'Saring padatan, didihkan saat masih panas untuk sterilisasi, dinginkan lalu kulkas (gunakan dalam 1 minggu) atau beku (hingga 3 bulan); didihkan lagi sebelum penggunaan, tambahkan kecap, arak nasi, dan rempah secara berkala',vi:'Lọc bã, đun sôi khi còn nóng để tiệt khuẩn, để nguội rồi để lạnh (dùng trong 1 tuần) hoặc đông (tối đa 3 tháng); đun sôi lại trước mỗi lần dùng, định kỳ bổ sung nước tương, rượu gạo và gia vị mới',ok:true},
          {zh:'老滷水每次只能使用一次，必須重新調配新的滷汁',en:'Old braising liquid can only be used once; always make fresh',id:'Cairan rebus tua hanya bisa digunakan sekali; selalu buat yang baru',vi:'Nước kho cũ chỉ dùng một lần; luôn làm mới',ok:false}],
    fb:{zh:'正確！台灣家庭的「老滷水」越煮越香、越用越有深度，是可以傳承的珍貴料理資產。正確維護五步驟：①使用後過濾殘渣（肉骨、香料）②趁熱大火煮沸確保殺菌（夏天需每天煮沸）③冷卻後密封冷藏（1週內再用）或冷凍（最長3個月）④每次使用前必須再次大火煮沸⑤定期補充醬油補充鹹度、加入米酒去腥、放入新鮮香料（八角、桂皮、月桂葉）提振香氣。室溫放涼靜置是最危險的行為，細菌在30–40°C下繁殖最快。',en:'Correct! Taiwanese "old braising liquid" deepens in flavor with every use — it is a precious culinary inheritance. Five correct maintenance steps: ① filter out solids (bones, spent spices) after each use ② bring to a boil while hot to sterilize (daily in summer) ③ cool and refrigerate (reuse within 1 week) or freeze (up to 3 months) ④ always bring to a boil again before each use ⑤ periodically replenish soy sauce for saltiness, add rice wine to remove odors, add fresh spices (star anise, cinnamon, bay leaf) to restore fragrance.',id:'Benar! Lima langkah perawatan: ① saring padatan ② didihkan saat masih panas (setiap hari di musim panas) ③ dinginkan dan simpan di kulkas (1 minggu) atau beku (3 bulan) ④ selalu didihkan lagi sebelum digunakan ⑤ tambahkan kecap, arak nasi, rempah segar secara berkala.',vi:'Đúng! Năm bước bảo quản đúng: ① lọc bã ② đun sôi khi còn nóng (hàng ngày vào mùa hè) ③ để nguội rồi để lạnh (1 tuần) hoặc đông lạnh (3 tháng) ④ luôn đun sôi lại trước khi dùng ⑤ định kỳ bổ sung nước tương, rượu gạo và gia vị mới.'}},
   {q:{zh:'台式蛤蜊絲瓜湯讓湯頭清甜的核心做法是？',en:'The core technique for a clear, naturally sweet Taiwanese loofah and clam soup is?',id:'Teknik inti untuk sup loofah dan kerang Taiwan yang bening dan manis alami adalah?',vi:'Kỹ thuật cốt lõi cho canh mướp và nghêu Đài Loan trong và ngọt tự nhiên là?'},
    opts:[{zh:'加入大量雞高湯與味精提鮮',en:'Add plenty of chicken stock and MSG for flavor',id:'Tambahkan banyak kaldu ayam dan MSG',vi:'Thêm nhiều nước dùng gà và bột ngọt',ok:false},
          {zh:'蛤蜊事先泡鹽水吐沙；水滾後放薑片與絲瓜；蛤蜊一開口立即關火；僅以少量鹽調味',en:'Purge clams in salted water first; add ginger and loofah after water boils; turn off heat the moment clams open; season with only a little salt',id:'Rendam kerang dalam air garam dulu; tambahkan jahe dan loofah setelah air mendidih; matikan api saat kerang terbuka; beri sedikit garam saja',vi:'Ngâm nghêu trong nước muối nhả cát trước; cho gừng và mướp sau khi nước sôi; tắt lửa ngay khi nghêu mở; chỉ nêm ít muối',ok:true},
          {zh:'用豬大骨熬製高湯2小時以上作為湯底',en:'Use pork bone broth simmered 2+ hours as the soup base',id:'Gunakan kaldu tulang babi yang direbus lebih dari 2 jam',vi:'Dùng nước dùng xương heo hầm hơn 2 giờ làm nước dùng',ok:false}],
    fb:{zh:'正確！台式蛤蜊絲瓜湯的精髓是「讓食材本身說話」：①蛤蜊提前泡入1–2%鹽水（或撒鹽）1–2小時，讓其充分吐沙，確保湯頭清澈②水沸後先放薑片去腥，再放絲瓜（約0.5公分斜切）③絲瓜呈半透明時放入蛤蜊④蛤蜊一開口立即關火（過熟則肉質縮硬腥味重）⑤最後僅加少量鹽，善用蛤蜊本身的海鮮鮮味（麩胺酸＋琥珀酸）。台式家常湯品的最大魅力就是「清淡鮮甜，無需複雜調味」。',en:'Correct! The soul of this soup is "letting the ingredients speak": ① purge clams in 1–2% salted water for 1–2 hours for a clear broth ② add ginger after water boils, then add loofah (sliced diagonally ~0.5cm) ③ add clams when loofah is semi-translucent ④ turn off heat the moment clams open (overcooking makes them tough and fishier) ⑤ only a little salt needed — rely on the clams' natural umami (glutamic acid + succinic acid). The greatest charm of Taiwanese home soups is "clear, naturally sweet, no complex seasoning."',id:'Benar! ① Rendam kerang dalam air asin 1–2% selama 1–2 jam ② tambahkan jahe setelah air mendidih, lalu loofah ③ tambahkan kerang saat loofah setengah bening ④ matikan api saat kerang terbuka ⑤ hanya sedikit garam.',vi:'Đúng! ① Ngâm nghêu trong nước muối 1–2% 1–2 giờ ② cho gừng sau khi nước sôi, rồi mướp ③ cho nghêu khi mướp trong ④ tắt lửa khi nghêu mở ⑤ chỉ ít muối.'}},
   {q:{zh:'台式「大火快炒」空心菜要保持翠綠與脆口，下列哪種方法最正確？',en:'To keep stir-fried water spinach vivid green and crisp, which method is most correct?',id:'Untuk menjaga bayam air yang ditumis tetap hijau cerah dan renyah, metode mana yang paling benar?',vi:'Để rau muống xào giữ xanh rực và giòn, phương pháp nào đúng nhất?'},
    opts:[{zh:'中火慢炒讓菜完全熟透，起鍋前加鹽',en:'Medium heat slow stir-fry until fully cooked, add salt before plating',id:'Tumis perlahan api sedang hingga matang sempurna, garam sebelum diangkat',vi:'Xào chậm lửa vừa cho đến khi chín, cho muối trước khi múc',ok:false},
          {zh:'熱鍋多油，蒜末爆香後最大火快炒全程1–2分鐘，先下菜梗後下菜葉，起鍋前才下鹽',en:'Very hot wok with plenty of oil, bloom garlic then max-heat stir-fry 1–2 min total, stems first then leaves, add salt only just before plating',id:'Wajan sangat panas banyak minyak, tumis bawang putih lalu api maksimal 1–2 menit, batang dulu lalu daun, garam baru sebelum diangkat',vi:'Chảo rất nóng nhiều dầu, phi tỏi rồi lửa lớn nhất 1–2 phút, cuống trước rồi lá, chỉ cho muối sát lúc múc ra',ok:true},
          {zh:'先以滾水燙過再下鍋炒，確保熟透不失色',en:'Blanch in boiling water first then stir-fry to ensure fully cooked without color loss',id:'Blanch dalam air mendidih dulu lalu tumis agar matang sempurna',vi:'Chần trong nước sôi trước rồi xào để đảm bảo chín không mất màu',ok:false}],
    fb:{zh:'正確！空心菜快炒三大要訣：①鍋要夠熱——冷鍋冷油會讓菜出水變爛。②大火全程——高溫（180°C以上）瞬間鎖住水分，葉綠素在快速加熱下保持鮮綠；若以中小火慢炒超過2–3分鐘，葉綠素因酸性氧化轉為黃綠色。③先梗後葉、最後才加鹽——梗較硬需先下鍋；鹽過早加入會使細胞脫水出水，蔬菜變軟爛。全程1–2分鐘，「鍋氣」（Wok Hei）就是台式快炒的靈魂。',en:'Correct! Three secrets for stir-fried water spinach: ① hot enough wok — cold wok makes the greens water-log and go limp ② high heat throughout — temperatures above 180°C instantly seal moisture; chlorophyll stays vivid green with rapid heating; medium-slow heat for over 2–3 minutes causes acid oxidation and yellowing ③ stems first then leaves, salt last — stems need more time; early salt causes cell dehydration and limpness. 1–2 minutes total — "wok hei" (鍋氣) is the soul of Taiwanese stir-frying.',id:'Benar! Tiga rahasia: ① wajan cukup panas ② api besar sepanjang waktu ③ batang dulu lalu daun, garam terakhir. Seluruhnya 1–2 menit — "wok hei" adalah jiwa tumisan Taiwan.',vi:'Đúng! Ba bí quyết: ① chảo đủ nóng ② lửa lớn suốt ③ cuống trước rồi lá, muối cuối cùng. Toàn bộ 1–2 phút — "wok hei" (鍋氣) là linh hồn của xào kiểu Đài Loan.'}},
   {q:{zh:'設計台式便當菜時，以下哪個食材選擇最不適合？',en:'When designing dishes for a Taiwanese bento box, which ingredient choice is LEAST suitable?',id:'Saat mendesain hidangan untuk bento Taiwan, pilihan bahan mana yang PALING tidak cocok?',vi:'Khi thiết kế món cơm hộp Đài Loan, lựa chọn nguyên liệu nào KÉM phù hợp nhất?'},
    opts:[{zh:'滷排骨、豆干、炒高麗菜',en:'Braised pork ribs, dried tofu, stir-fried cabbage',id:'Tulang iga babi kecap, tahu kering, kubis tumis',vi:'Sườn heo kho, đậu phụ khô, bắp cải xào',ok:false},
          {zh:'新鮮番茄切片、生菜沙拉、剛炸好的炸物',en:'Fresh sliced tomatoes, raw salad greens, freshly fried food',id:'Tomat segar iris, salad sayuran segar, makanan yang baru digoreng',vi:'Cà chua tươi thái lát, rau salad sống, đồ chiên mới',ok:true},
          {zh:'水煮花椰菜、炒蛋、紅燒豆腐',en:'Boiled broccoli, scrambled eggs, red-braised tofu',id:'Brokoli rebus, telur orak-arik, tahu kecap merah',vi:'Súp lơ luộc, trứng bác, đậu phụ kho',ok:false}],
    fb:{zh:'正確！台式便當設計有幾項關鍵食安原則：①避免易出水食材——新鮮番茄切片、生菜等高水分食材在便當中會出水，讓其他菜餚受潮、加速腐壞。②避免未完全熟透或生食——生菜沙拉在密封便當盒內（尤其夏天）極易孳菌。③炸物裝入便當後會因水蒸氣回軟，失去酥脆口感，且油脂較易氧化。適合便當的食材應：①完全熟透②不易出水③耐放（滷、炒、煮類）。台鐵便當組合：滷排骨、白米飯、滷蛋、豆干、筍片、炒高麗菜，是歷久不衰的黃金組合。',en:'Correct! Key food safety principles for Taiwanese bento: ① avoid watery ingredients — fresh sliced tomatoes and raw greens release water in the bento box, making other dishes soggy and accelerating spoilage ② avoid raw foods — raw salad greens in a sealed bento (especially in summer) are prone to rapid bacterial growth ③ freshly fried food loses its crispness from steam and the oil is more prone to oxidation. Good bento ingredients: ① fully cooked ② low water release ③ shelf-stable (braised, stir-fried, boiled). Taiwan Railway Bento combo — braised pork ribs, white rice, braised egg, dried tofu, bamboo shoots, stir-fried cabbage — is the timeless gold standard.',id:'Benar! Prinsip bento Taiwan: ① hindari bahan berair ② hindari makanan mentah ③ makanan goreng kehilangan kerenyahan. Bahan bento yang baik: matang sempurna, tidak berair, tahan lama.',vi:'Đúng! Nguyên tắc cơm hộp Đài Loan: ① tránh nguyên liệu dễ ra nước ② tránh thực phẩm sống ③ đồ chiên mất giòn vì hơi nước. Nguyên liệu cơm hộp tốt: chín kỹ, ít ra nước, bền.'}},
   {q:{zh:'蚵仔煎（台式牡蠣煎）的外層Q彈口感，主要來自加入哪種食材？',en:'The chewy, springy outer layer of Taiwanese oyster omelette (o-a-jian) comes primarily from which ingredient?',id:'Lapisan luar yang kenyal dari omelet tiram Taiwan (o-a-jian) terutama berasal dari bahan apa?',vi:'Lớp ngoài dai giòn của trứng hàu Đài Loan (o-a-jian) chủ yếu đến từ nguyên liệu nào?'},
    opts:[{zh:'低筋麵粉（小麥粉）',en:'Cake flour (low-gluten wheat flour)',id:'Tepung terigu protein rendah',vi:'Bột mì protein thấp',ok:false},
          {zh:'番薯粉（地瓜粉）或太白粉，加水調成粉漿，加熱後形成半透明Q彈的特殊質地',en:'Sweet potato starch or tapioca starch, mixed with water into a slurry; when heated, forms a semi-transparent chewy-springy texture',id:'Tepung ubi jalar atau tepung tapioka, dicampur air menjadi adonan; dipanaskan membentuk tekstur kenyal semi-transparan',vi:'Bột khoai lang hoặc bột năng, pha nước thành bột lỏng; khi đun nóng tạo kết cấu dai bán trong suốt',ok:true},
          {zh:'在來米粉（米穀粉）',en:'Non-glutinous rice flour',id:'Tepung beras non-glutinous',vi:'Bột gạo không dẻo',ok:false}],
    fb:{zh:'正確！蚵仔煎的靈魂材料是「番薯粉（地瓜粉）」或「太白粉（木薯澱粉）」：加水調成稀粉漿後與蛋液結合，在高溫熱油的平底鍋（或鐵板）上先鋪成薄餅狀煎至底部定型微脆，翻面後繼續煎，最終形成外層微脆、內層半透明Q彈的獨特口感。三大必備材料：①新鮮蚵仔（牡蠣）——鮮甜海味②番薯粉漿——Q彈基底③雞蛋——黏合與色澤。最後搭配台式甜辣醬（沙茶醬加番茄醬調成），是夜市代表性小吃。',en:'Correct! The soul of oyster omelette is sweet potato starch (番薯粉) or tapioca starch: mixed with water into a thin slurry, combined with egg, spread on a very hot oiled griddle and cooked until the base sets and is slightly crispy, then flipped — creating a crispy-outside, semi-transparent chewy-inside texture. Three essential ingredients: ① fresh oysters (sweet sea flavor) ② sweet potato starch slurry (chewy base) ③ egg (binding and color). Finished with Taiwanese sweet chili sauce.',id:'Benar! Jiwa omelet tiram adalah tepung ubi jalar atau tapioka: dicampur air menjadi adonan encer, digabung dengan telur, dimasak di wajan panas hingga bagian bawah agak renyah, lalu dibalik.',vi:'Đúng! Linh hồn của trứng hàu là bột khoai lang hoặc bột năng: pha nước thành bột lỏng, kết hợp với trứng, chiên trên chảo nóng cho đến khi đáy định hình và hơi giòn rồi lật.'}},
   {q:{zh:'台灣家庭「滷蛋」要做到入味又不橡皮化，關鍵步驟是？',en:'For well-flavored Taiwanese braised eggs without rubbery egg whites, the key steps are?',id:'Untuk telur rebus Taiwan yang berasam tanpa putih telur kenyal, langkah kunci adalah?',vi:'Để trứng kho Đài Loan ngấm vị mà lòng trắng không dai, bước chính là gì?'},
    opts:[{zh:'生蛋直接放入大火沸騰的滷水中煮20分鐘',en:'Place raw eggs directly in vigorously boiling braising liquid and cook 20 minutes',id:'Masukkan telur mentah langsung ke dalam cairan rebus mendidih keras dan masak 20 menit',vi:'Cho trứng sống thẳng vào nước kho sôi mạnh và đun 20 phút',ok:false},
          {zh:'先煮全熟水煮蛋剝殼、以牙籤戳孔，再放入微滾（非沸騰）滷水中浸泡30–60分鐘後關火繼續泡',en:'First hard-boil and peel, poke holes with a toothpick, then place in gently simmering (not boiling) braising liquid for 30–60 min, turn off heat and continue soaking',id:'Pertama rebus matang dan kupas, tusuk dengan tusuk gigi, lalu rendam dalam cairan rebus yang hampir mendidih (tidak mendidih) selama 30–60 menit, matikan api dan terus rendam',vi:'Trước tiên luộc chín bóc vỏ, châm lỗ bằng tăm, rồi ngâm trong nước kho sôi nhẹ (không sôi mạnh) 30–60 phút, tắt lửa và tiếp tục ngâm',ok:true},
          {zh:'生蛋連殼放入冷的滷水中從冷水一起煮起',en:'Place shell-on raw eggs in cold braising liquid and bring to a boil together',id:'Masukkan telur mentah berkulit ke dalam cairan rebus dingin dan didihkan bersama',vi:'Cho trứng sống còn vỏ vào nước kho lạnh và đun sôi cùng',ok:false}],
    fb:{zh:'正確！台式滷蛋兩大步驟：第一步——將雞蛋冷水下鍋煮至全熟（水沸後再煮8–10分鐘），立刻放入冷水冰鎮（防止蛋黃表面氧化變灰），冷卻後剝殼，用牙籤在蛋白上戳數個小孔，幫助滷汁從孔洞滲入。第二步——放入微滾（約90°C，非大滾沸騰）的滷水中浸泡30–60分鐘後關火，繼續泡至入味（冷藏隔夜更佳）。滷水大火沸騰會使蛋白過度加熱（持續超過100°C）而蛋白質過度交聯，口感橡皮化；微滾才能讓滷汁緩慢滲入同時保持嫩滑。',en:'Correct! Two key steps for Taiwanese braised eggs: Step 1 — hard-boil from cold water (8–10 min after boiling), immediately ice in cold water (prevents gray yolk surface oxidation), peel, and poke several small holes in the egg white with a toothpick to allow braising liquid to penetrate. Step 2 — place in gently simmering (~90°C, NOT vigorously boiling) braising liquid for 30–60 min, turn off heat and continue soaking (overnight refrigeration is even better). Vigorous boiling causes over-heating of the egg white (sustained above 100°C), over-crosslinking proteins and creating a rubbery texture; gentle simmering allows slow flavor penetration while keeping the whites tender.',id:'Benar! Dua langkah kunci: Langkah 1 — rebus matang dari air dingin, segera dinginkan dengan air dingin, kupas, tusuk lubang kecil. Langkah 2 — rendam dalam cairan rebus yang hampir mendidih (~90°C) 30–60 menit, matikan api dan terus rendam.',vi:'Đúng! Hai bước chính: Bước 1 — luộc chín từ nước lạnh, ngay lập tức ngâm nước lạnh, bóc vỏ, châm vài lỗ nhỏ. Bước 2 — ngâm trong nước kho sôi nhẹ (~90°C, KHÔNG sôi mạnh) 30–60 phút, tắt lửa và tiếp tục ngâm.'}}
  ],
  /* Lv9 醃漬與醬料調味 */
  [
   {q:{zh:'紅燒滷汁常用的萬用比例「醬油:水:糖」大約是？',en:'A common all-purpose braising ratio \"soy sauce:water:sugar\" is about?',id:'Rasio kaldu serbaguna \"kecap:air:gula\" yang umum adalah?',vi:'Tỷ lệ nước kho thông dụng \"nước tương:nước:đường\" khoảng?'},
    opts:[{zh:'1:3:0.5',en:'1:3:0.5',id:'1:3:0.5',vi:'1:3:0.5',ok:true},
          {zh:'3:1:1',en:'3:1:1',id:'3:1:1',vi:'3:1:1',ok:false},
          {zh:'1:1:3',en:'1:1:3',id:'1:1:3',vi:'1:1:3',ok:false}],
    fb:{zh:'正確！醬油:水:糖約1:3:0.5是常用的萬用滷汁基礎比例，可依個人口味微調鹹甜。',en:'Correct! Soy sauce:water:sugar ≈ 1:3:0.5 is a common all-purpose braising ratio, adjustable to taste.',id:'Benar! Kecap:air:gula ≈ 1:3:0.5 adalah rasio kaldu serbaguna yang umum, bisa disesuaikan rasa.',vi:'Đúng! Nước tương:nước:đường ≈ 1:3:0.5 là tỷ lệ kho万用 phổ biến, có thể điều chỉnh theo khẩu vị.'}},
   {q:{zh:'使用檸檬汁或醋醃肉時，建議的浸泡時間是？',en:'When marinating meat with lemon juice or vinegar, the recommended soaking time is?',id:'Saat marinasi daging dengan jeruk nipis atau cuka, waktu rendam yang disarankan adalah?',vi:'Khi ướp thịt với nước cốt chanh hoặc giấm, thời gian ngâm khuyến nghị là?'},
    opts:[{zh:'越久越入味越好',en:'The longer the better',id:'Semakin lama semakin baik',vi:'Càng lâu càng ngon',ok:false},
          {zh:'不超過30分鐘',en:'No more than 30 minutes',id:'Tidak lebih dari 30 menit',vi:'Không quá 30 phút',ok:true},
          {zh:'至少浸泡3小時',en:'At least 3 hours',id:'Setidaknya 3 jam',vi:'Ít nhất 3 giờ',ok:false}],
    fb:{zh:'正確！酸性醃料會分解蛋白質讓肉質軟嫩，但浸泡過久（超過30分鐘）會使肉質變得過於軟爛、口感不佳。',en:'Correct! Acidic marinades break down protein for tenderness, but soaking too long (over 30 min) makes meat mushy.',id:'Benar! Marinasi asam melembutkan protein, tapi terlalu lama (lebih 30 menit) membuat daging terlalu lembek.',vi:'Đúng! Nước ướp có axit làm mềm protein, nhưng ngâm quá lâu (hơn 30 phút) sẽ làm thịt nhũn, mất ngon.'}},
   {q:{zh:'製作醃漬蔬菜（如泡菜、醃黃瓜）時，蔬菜應如何放置？',en:'When making pickled vegetables (e.g. kimchi, pickled cucumber), how should the vegetables be placed?',id:'Saat membuat acar sayuran (kimchi, acar timun), bagaimana sayuran harus diletakkan?',vi:'Khi làm rau ngâm chua (kim chi, dưa leo ngâm), rau nên được đặt như thế nào?'},
    opts:[{zh:'完全浸泡於醃汁液面下',en:'Fully submerged below the brine surface',id:'Terendam penuh di bawah permukaan air acar',vi:'Ngập hoàn toàn dưới mặt nước ngâm',ok:true},
          {zh:'露出液面接觸空氣風味較佳',en:'Exposed to air above the liquid for better flavor',id:'Terbuka ke udara di atas cairan untuk rasa lebih baik',vi:'Để hở trên mặt nước cho hương vị tốt hơn',ok:false},
          {zh:'放在容器最上層即可，不需壓住',en:'Just place on top of the container, no need to weigh down',id:'Letakkan di atas wadah saja, tidak perlu pemberat',vi:'Chỉ cần đặt trên cùng hộp, không cần đè',ok:false}],
    fb:{zh:'正確！蔬菜必須完全浸泡於醃汁中，可用乾淨重物壓住，避免接觸空氣導致長黴或雜菌滋生。',en:'Correct! Vegetables must be fully submerged in the brine, weighed down with a clean object, to prevent air exposure and mold growth.',id:'Benar! Sayuran harus terendam penuh dalam air acar, gunakan pemberat bersih untuk mencegah kontak udara dan jamur.',vi:'Đúng! Rau phải ngập hoàn toàn trong nước ngâm, dùng vật nặng sạch đè xuống để tránh tiếp xúc không khí gây nấm mốc.'}},
   {q:{zh:'製作醬油膏時，加入太白粉（澱粉）的主要作用是？',en:'When making soy sauce paste, what is the main function of adding starch?',id:'Saat membuat saus kecap, apa fungsi utama menambahkan tepung kanji?',vi:'Khi làm tương nước tương, tác dụng chính của việc thêm bột năng là gì?'},
    opts:[{zh:'增加鹹味',en:'Increase saltiness',id:'Menambah rasa asin',vi:'Tăng vị mặn',ok:false},
          {zh:'增稠，讓醬汁更濃郁附著在食材上',en:'Thicken the sauce so it coats the food more richly',id:'Mengentalkan saus agar lebih kental menempel pada makanan',vi:'Làm đặc sốt để bám tốt hơn vào thực phẩm',ok:true},
          {zh:'減少鹹度讓醬汁更清爽',en:'Reduce saltiness for a lighter sauce',id:'Mengurangi rasa asin untuk saus yang lebih ringan',vi:'Giảm độ mặn cho sốt nhẹ hơn',ok:false}],
    fb:{zh:'正確！澱粉（太白粉）加熱後會糊化，使醬汁變濃稠且光亮，更能包覆食材表面，讓料理的外觀和口味更有層次。這是勾芡（thickening）技術的核心原理。',en:'Correct! Starch gelatinizes when heated, thickening and glossing the sauce so it better coats food surfaces, adding visual appeal and depth of flavor. This is the core of the thickening technique.',id:'Benar! Pati menggelatin saat dipanaskan, mengentalkan dan mengkilapkan saus agar lebih baik melapisi permukaan makanan.',vi:'Đúng! Tinh bột gelatin hóa khi đun nóng, làm đặc và bóng sốt để bám tốt hơn lên bề mặt thực phẩm, tăng thẩm mỹ và độ phong phú của hương vị.'}},
   {q:{zh:'製作沙拉醬（油醋醬）時，油與醋的基本比例通常是？',en:'When making vinaigrette, what is the typical basic ratio of oil to vinegar?',id:'Saat membuat vinaigrette, berapa rasio dasar minyak dan cuka yang biasa digunakan?',vi:'Khi làm sốt dầu giấm, tỷ lệ cơ bản thông thường của dầu và giấm là?'},
    opts:[{zh:'油:醋 = 1:1',en:'Oil:Vinegar = 1:1',id:'Minyak:Cuka = 1:1',vi:'Dầu:Giấm = 1:1',ok:false},
          {zh:'油:醋 = 3:1',en:'Oil:Vinegar = 3:1',id:'Minyak:Cuka = 3:1',vi:'Dầu:Giấm = 3:1',ok:true},
          {zh:'油:醋 = 1:3',en:'Oil:Vinegar = 1:3',id:'Minyak:Cuka = 1:3',vi:'Dầu:Giấm = 1:3',ok:false}],
    fb:{zh:'正確！傳統油醋醬的基本比例為油:醋 = 3:1，油的比例較高以平衡醋的酸度。可依口味調整，加入芥末、蜂蜜、香草等提升風味層次。',en:'Correct! The classic vinaigrette ratio is oil:vinegar = 3:1, with more oil to balance the acidity. Adjust to taste and add mustard, honey, or herbs for extra complexity.',id:'Benar! Rasio vinaigrette klasik adalah minyak:cuka = 3:1, dengan lebih banyak minyak untuk menyeimbangkan keasaman.',vi:'Đúng! Tỷ lệ sốt dầu giấm cổ điển là dầu:giấm = 3:1, dầu nhiều hơn để cân bằng độ chua. Điều chỉnh theo khẩu vị và thêm mù tạt, mật ong hoặc thảo mộc để tăng độ phức tạp.'}},
   {q:{zh:'醃肉時，加入「料理酒」的主要作用是？',en:'When marinating meat, what is the main purpose of adding "cooking wine"?',id:'Saat marinasi daging, apa fungsi utama menambahkan "arak masak"?',vi:'Khi ướp thịt, tác dụng chính của việc thêm "rượu nấu ăn" là gì?'},
    opts:[{zh:'讓肉的顏色變深',en:'Make the meat color darker',id:'Membuat warna daging lebih gelap',vi:'Làm màu thịt đậm hơn',ok:false},
          {zh:'去除腥味、幫助入味，並讓肉質更嫩',en:'Remove gamey odor, help flavor absorption, and tenderize the meat',id:'Menghilangkan bau amis, membantu penyerapan rasa, dan mengempukkan daging',vi:'Khử mùi tanh, giúp thấm vị và làm mềm thịt',ok:true},
          {zh:'增加肉的保存期限',en:'Extend the meat\'s shelf life',id:'Memperpanjang masa simpan daging',vi:'Kéo dài thời gian bảo quản thịt',ok:false}],
    fb:{zh:'正確！料理酒（如米酒、紹興酒）含有酒精能與腥臭味物質結合並在加熱時揮發，同時酒中的有機酸能幫助肉類軟化，使調味料更容易滲入肉中。',en:'Correct! Cooking wine (e.g., rice wine, Shaoxing wine) contains alcohol that binds with odor compounds and evaporates with heat; its organic acids also tenderize meat and help seasonings penetrate.',id:'Benar! Arak masak mengandung alkohol yang mengikat senyawa bau dan menguap saat dipanaskan; asam organiknya juga mengempukkan daging dan membantu bumbu meresap.',vi:'Đúng! Rượu nấu ăn chứa cồn liên kết với hợp chất mùi và bay hơi khi đun nóng; axit hữu cơ trong đó cũng làm mềm thịt và giúp gia vị ngấm sâu hơn.'}},
   {q:{zh:'以下哪種調味料屬於「酸味」調味料？',en:'Which of the following condiments is a "sour" seasoning?',id:'Kondimen mana dari berikut ini yang merupakan bumbu "asam"?',vi:'Loại gia vị nào sau đây thuộc nhóm gia vị "chua"?'},
    opts:[{zh:'醬油',en:'Soy sauce',id:'Kecap',vi:'Nước tương',ok:false},
          {zh:'白醋',en:'White vinegar',id:'Cuka putih',vi:'Giấm trắng',ok:true},
          {zh:'味噌',en:'Miso',id:'Miso',vi:'Tương miso',ok:false}],
    fb:{zh:'正確！白醋主要成分是醋酸，屬於酸味調味料，常用於提亮料理色澤、去除腥味、製作泡菜或油醋醬。醬油和味噌屬於鹹鮮味（umami）調味料。',en:'Correct! White vinegar is mainly acetic acid — a sour condiment used to brighten dish colors, remove odors, make pickles or vinaigrette. Soy sauce and miso are savory/umami seasonings.',id:'Benar! Cuka putih mengandung asam asetat — bumbu asam yang digunakan untuk mencerahkan warna masakan, menghilangkan bau amis, membuat acar atau vinaigrette.',vi:'Đúng! Giấm trắng chủ yếu là axit acetic — gia vị chua dùng để tăng độ sáng màu món ăn, khử mùi tanh, làm dưa muối hoặc sốt dầu giấm.'}},
   {q:{zh:'「糖醋」口味料理中，糖與醋的比例應該是？',en:'In "sweet and sour" cooking, what is the typical ratio of sugar to vinegar?',id:'Dalam masakan "manis asam", berapa rasio gula dan cuka yang biasa digunakan?',vi:'Trong món "chua ngọt", tỷ lệ đường và giấm thường là bao nhiêu?'},
    opts:[{zh:'糖:醋 = 1:3（以酸為主）',en:'Sugar:Vinegar = 1:3 (more sour)',id:'Gula:Cuka = 1:3 (lebih asam)',vi:'Đường:Giấm = 1:3 (chua hơn)',ok:false},
          {zh:'糖:醋 = 1:1（酸甜均衡）',en:'Sugar:Vinegar = 1:1 (balanced sweet-sour)',id:'Gula:Cuka = 1:1 (manis-asam seimbang)',vi:'Đường:Giấm = 1:1 (cân bằng)',ok:true},
          {zh:'糖:醋 = 5:1（以甜為主）',en:'Sugar:Vinegar = 5:1 (more sweet)',id:'Gula:Cuka = 5:1 (lebih manis)',vi:'Đường:Giấm = 5:1 (ngọt hơn)',ok:false}],
    fb:{zh:'正確！傳統糖醋醬的基礎比例為糖:醋 = 1:1，達到酸甜均衡的口感。可依個人喜好或菜式（如糖醋排骨傾向偏甜、涼拌料理傾向偏酸）做微調，再加入番茄醬增色及增加層次感。',en:'Correct! The classic sweet-and-sour base ratio is sugar:vinegar = 1:1 for balanced flavor. Adjust to preference or dish style (spare ribs lean sweeter, salads lean more sour), and add ketchup for color and complexity.',id:'Benar! Rasio dasar manis-asam klasik adalah gula:cuka = 1:1 untuk rasa seimbang. Sesuaikan sesuai selera atau gaya masakan.',vi:'Đúng! Tỷ lệ cơ bản chua ngọt cổ điển là đường:giấm = 1:1 để có hương vị cân bằng. Điều chỉnh theo sở thích hoặc phong cách món (sườn ngọt hơn, salad chua hơn).'}},
   {q:{zh:'製作泡菜或發酵食品時，加鹽的主要目的除了調味外還有？',en:'When making kimchi or fermented foods, what is another main purpose of adding salt besides seasoning?',id:'Saat membuat kimchi atau makanan fermentasi, apa tujuan utama lain menambahkan garam selain bumbu?',vi:'Khi làm kim chi hoặc thực phẩm lên men, ngoài tạo vị, mục đích chính khác của việc thêm muối là gì?'},
    opts:[{zh:'讓蔬菜顏色更鮮豔',en:'Make vegetables more vibrant in color',id:'Membuat sayuran lebih cerah warnanya',vi:'Làm rau có màu sắc tươi hơn',ok:false},
          {zh:'抑制雜菌生長，創造有利益生菌（乳酸菌）發酵的環境',en:'Inhibit harmful bacteria and create an environment favorable for beneficial bacteria (lactobacilli) to ferment',id:'Menghambat bakteri berbahaya dan menciptakan lingkungan yang menguntungkan bakteri baik (lactobacilli) untuk fermentasi',vi:'Ức chế vi khuẩn có hại và tạo môi trường thuận lợi cho vi khuẩn có lợi (lactobacillus) lên men',ok:true},
          {zh:'讓蔬菜更快軟化',en:'Soften vegetables faster',id:'Melunakkan sayuran lebih cepat',vi:'Làm mềm rau nhanh hơn',ok:false}],
    fb:{zh:'正確！鹽在發酵食品中扮演選擇性培養基的角色。高鹽環境能抑制多數致病菌與雜菌的生長，同時耐鹽的乳酸菌得以存活並進行乳酸發酵，產生乳酸使環境酸化，進一步保護食品安全並賦予獨特風味。',en:'Correct! Salt acts as a selective culture medium in fermented foods. High salt concentrations inhibit most pathogens and undesirable bacteria while allowing salt-tolerant lactobacilli to survive and conduct lactic acid fermentation, acidifying the environment for food safety and unique flavor.',id:'Benar! Garam bertindak sebagai media selektif dalam makanan fermentasi. Konsentrasi garam tinggi menghambat patogen sementara bakteri asam laktat yang toleran garam dapat bertahan untuk melakukan fermentasi.',vi:'Đúng! Muối đóng vai trò môi trường nuôi cấy chọn lọc trong thực phẩm lên men. Nồng độ muối cao ức chế đa số vi khuẩn gây bệnh trong khi vi khuẩn lactic chịu muối tồn tại và thực hiện lên men, axit hóa môi trường để bảo vệ an toàn thực phẩm.'}},
   {q:{zh:'日式高湯「昆布柴魚出汁」的標準做法是？',en:'What is the standard method for making Japanese "kombu and katsuobushi dashi"?',id:'Apa metode standar untuk membuat "kaldu kombu dan katsuobushi" Jepang?',vi:'Phương pháp tiêu chuẩn để làm "dashi kombu và katsuobushi" theo phong cách Nhật Bản là gì?'},
    opts:[{zh:'昆布和柴魚一起煮沸30分鐘',en:'Boil kombu and katsuobushi together for 30 minutes',id:'Rebus kombu dan katsuobushi bersama selama 30 menit',vi:'Đun sôi kombu và katsuobushi cùng nhau trong 30 phút',ok:false},
          {zh:'昆布冷水泡發後中火加熱至即將沸騰，撈起昆布後加入柴魚，靜置後過濾',en:'Soak kombu in cold water, heat on medium until just before boiling, remove kombu, add katsuobushi, steep, then strain',id:'Rendam kombu dalam air dingin, panaskan hingga hampir mendidih, angkat kombu, tambahkan katsuobushi, diamkan, lalu saring',vi:'Ngâm kombu trong nước lạnh, đun ở lửa vừa đến gần sôi, vớt kombu ra, thêm katsuobushi, ngâm rồi lọc',ok:true},
          {zh:'直接用熱水沖泡昆布和柴魚粉',en:'Steep instant kombu and katsuobushi powder in hot water',id:'Seduh instan kombu dan bubuk katsuobushi dalam air panas',vi:'Hãm ngay bột kombu và katsuobushi trong nước nóng',ok:false}],
    fb:{zh:'正確！正統的一番出汁做法：①昆布以冷水泡發30分鐘②中火加熱至80°C（即將沸騰）前取出昆布，避免高溫產生黏液③加入柴魚花，關火靜置5分鐘④輕輕過濾。此過程萃取出昆布的麩胺酸與柴魚的肌苷酸，兩者相乘產生最大鮮味。',en:'Correct! Classic ichiban-dashi: soak kombu in cold water 30 min → heat to 80°C (just before boiling) and remove kombu (to avoid sliminess) → add katsuobushi, turn off heat, steep 5 min → gently strain. This extracts glutamate from kombu and inosinate from katsuobushi for maximum synergistic umami.',id:'Benar! Ichiban-dashi klasik: rendam kombu 30 menit → panaskan hingga 80°C (sebelum mendidih) dan angkat kombu → tambahkan katsuobushi, matikan api, diamkan 5 menit → saring.',vi:'Đúng! Ichiban-dashi cổ điển: ngâm kombu 30 phút → đun đến 80°C (trước khi sôi) và vớt kombu ra → thêm katsuobushi, tắt lửa, ngâm 5 phút → lọc nhẹ. Quá trình này chiết xuất glutamate từ kombu và inosinate từ katsuobushi tạo umami cộng hưởng tối đa.'}}
  ],
  /* Lv10 蔬食料理入門 */
  [
   {q:{zh:'豆腐在烹調前，用鹽水浸泡或撒鹽靜置的主要目的是？',en:'What is the main purpose of salting or brining tofu before cooking?',id:'Apa tujuan utama merendam atau menggarami tahu sebelum memasak?',vi:'Mục đích chính của việc ngâm muối đậu phụ trước khi nấu là gì?'},
    opts:[{zh:'增加鹹味',en:'Add saltiness',id:'Menambah rasa asin',vi:'Thêm vị mặn',ok:false},
          {zh:'去除多餘水分，使口感更紮實',en:'Draw out excess moisture for a firmer texture',id:'Mengeluarkan kelebihan air untuk tekstur lebih padat',vi:'Rút bớt nước để kết cấu chắc hơn',ok:true},

   {q:{zh:'蔬食料理中，哪一種食材最常用來取代肉類帶來「鮮味（Umami）」？',en:'In plant-based cooking, which ingredient is most commonly used to add umami flavor instead of meat?',id:'Dalam masak nabati, bahan apa yang paling umum digunakan untuk menambah umami sebagai pengganti daging?',vi:'Trong nấu ăn thuần chay, nguyên liệu nào phổ biến nhất để thay thế vị umami của thịt?'},
    opts:[{zh:'白糖',en:'White sugar',id:'Gula putih',vi:'Đường trắng',ok:false},
          {zh:'味噌、醬油或香菇',en:'Miso, soy sauce, or shiitake mushrooms',id:'Miso, kecap, atau jamur shiitake',vi:'Tương miso, nước tương hoặc nấm shiitake',ok:true},
          {zh:'檸檬汁',en:'Lemon juice',id:'Air lemon',vi:'Nước cốt chanh',ok:false}],
    fb:{zh:'正確！味噌、醬油、香菇、昆布等都含有天然麩胺酸，是蔬食料理增添深層鮮味的關鍵。',en:'Correct! Miso, soy sauce, shiitake mushrooms, and kombu all contain natural glutamates — key to building deep umami in plant-based dishes.',id:'Benar! Miso, kecap, jamur shiitake, dan kombu mengandung glutamat alami — kunci membangun umami dalam masak nabati.',vi:'Đúng! Miso, nước tương, nấm shiitake và tảo kombu đều chứa glutamate tự nhiên — chìa khóa tạo umami cho món chay.'}},
   {q:{zh:'從營養均衡角度看，蔬食飲食者最需要特別注意補充哪種營養素？',en:'From a nutritional balance perspective, which nutrient do plant-based eaters need to be most mindful of supplementing?',id:'Dari sudut pandang gizi seimbang, nutrisi apa yang perlu diperhatikan oleh pemakan nabati?',vi:'Từ góc độ dinh dưỡng cân bằng, người ăn chay cần bổ sung dưỡng chất nào nhất?'},
    opts:[{zh:'維生素C',en:'Vitamin C',id:'Vitamin C',vi:'Vitamin C',ok:false},
          {zh:'維生素B12',en:'Vitamin B12',id:'Vitamin B12',vi:'Vitamin B12',ok:true},
          {zh:'碳水化合物',en:'Carbohydrates',id:'Karbohidrat',vi:'Carbohydrate',ok:false}],
    fb:{zh:'正確！維生素B12主要存在於動物性食物中，全素食者須透過補充劑或強化食品攝取，以避免神經系統問題。',en:'Correct! Vitamin B12 is found mainly in animal products. Vegans must supplement or eat fortified foods to avoid neurological issues.',id:'Benar! Vitamin B12 terutama ditemukan dalam produk hewani. Vegan harus suplemen atau makan makanan yang diperkaya untuk mencegah masalah neurologis.',vi:'Đúng! Vitamin B12 chủ yếu có trong thực phẩm động vật. Người ăn thuần chay cần bổ sung hoặc ăn thực phẩm tăng cường để tránh vấn đề thần kinh.'}},
   {q:{zh:'烹調豆腐時，哪種方式能讓豆腐表面最容易上色（金黃）？',en:'When cooking tofu, which method most easily achieves a golden-brown surface?',id:'Saat memasak tahu, metode mana yang paling mudah menghasilkan permukaan berwarna keemasan?',vi:'Khi nấu đậu phụ, phương pháp nào dễ đạt được bề mặt vàng nâu nhất?'},
    opts:[{zh:'直接加入滾水中煮',en:'Boil it directly in hot water',id:'Rebus langsung dalam air panas',vi:'Luộc thẳng trong nước nóng',ok:false},
          {zh:'用廚房紙巾擦乾水分後，以熱油中火煎',en:'Pat dry with paper towels, then pan-fry on medium heat with hot oil',id:'Keringkan dengan tisu dapur, lalu goreng dengan minyak panas di api sedang',vi:'Lau khô bằng khăn giấy, rồi chiên với dầu nóng lửa vừa',ok:true},
          {zh:'用冷油低溫煎製',en:'Pan-fry in cold oil at low temperature',id:'Goreng dalam minyak dingin dengan api kecil',vi:'Chiên trong dầu lạnh ở nhiệt độ thấp',ok:false}],
    fb:{zh:'正確！豆腐表面含有大量水分，煎前充分擦乾，用熱油中火煎能使表面快速脫水並產生梅納反應（Maillard reaction），形成金黃酥脆的外皮。',en:'Correct! Tofu\'s high moisture content means you must pat it dry before frying. Hot oil on medium heat causes rapid moisture evaporation and the Maillard reaction, creating a golden crispy surface.',id:'Benar! Tahu mengandung banyak air, jadi keringkan sebelum digoreng. Minyak panas di api sedang menyebabkan penguapan cepat dan reaksi Maillard, menghasilkan permukaan keemasan.',vi:'Đúng! Đậu phụ chứa nhiều nước, nên lau khô trước khi chiên. Dầu nóng ở lửa vừa gây bốc hơi nhanh và phản ứng Maillard, tạo bề mặt vàng giòn.'}},
   {q:{zh:'蔬食飲食中，要攝取足夠的鐵質，最好搭配哪種食物一起吃？',en:'In a plant-based diet, what should you pair with iron-rich plant foods to improve iron absorption?',id:'Dalam diet nabati, apa yang harus dipasangkan dengan makanan nabati kaya zat besi untuk meningkatkan penyerapan zat besi?',vi:'Trong chế độ ăn thuần chay, nên ăn kèm gì với thực phẩm giàu sắt để cải thiện hấp thu sắt?'},
    opts:[{zh:'高鈣食品（如豆腐）',en:'High-calcium foods (e.g., tofu)',id:'Makanan tinggi kalsium (seperti tahu)',vi:'Thực phẩm giàu canxi (như đậu phụ)',ok:false},
          {zh:'富含維生素C的食物（如彩椒、柑橘類）',en:'Foods rich in vitamin C (e.g., bell peppers, citrus fruits)',id:'Makanan kaya vitamin C (seperti paprika, buah sitrus)',vi:'Thực phẩm giàu vitamin C (như ớt chuông, trái cây họ cam quýt)',ok:true},
          {zh:'富含脂肪的食物（如酪梨）',en:'Foods rich in fat (e.g., avocado)',id:'Makanan kaya lemak (seperti alpukat)',vi:'Thực phẩm giàu chất béo (như bơ)',ok:false}],
    fb:{zh:'正確！植物性食物中的鐵質為非血基質鐵，吸收率較動物性食物低。同時攝取富含維生素C的食物（如彩椒、柑橘類）能將非血基質鐵轉化為更易吸收的形式，顯著提升吸收率。',en:'Correct! Plant-based iron is non-heme iron, which has lower absorption than animal iron. Pairing it with vitamin C-rich foods (bell peppers, citrus) converts non-heme iron to a more absorbable form, significantly improving absorption.',id:'Benar! Zat besi nabati adalah zat besi non-heme, yang penyerapannya lebih rendah. Memasangkannya dengan makanan kaya vitamin C mengubahnya menjadi bentuk yang lebih mudah diserap.',vi:'Đúng! Sắt từ thực vật là sắt non-heme, hấp thu kém hơn sắt động vật. Ăn kèm với thực phẩm giàu vitamin C chuyển sắt non-heme thành dạng dễ hấp thu hơn.'}},
   {q:{zh:'以下哪種食材是蔬食飲食中優質的植物性蛋白質來源？',en:'Which of the following is an excellent plant-based protein source for a vegan diet?',id:'Mana dari berikut ini yang merupakan sumber protein nabati yang sangat baik untuk diet vegan?',vi:'Nguyên liệu nào sau đây là nguồn đạm thực vật tốt cho chế độ ăn thuần chay?'},
    opts:[{zh:'白米飯',en:'White rice',id:'Nasi putih',vi:'Cơm trắng',ok:false},
          {zh:'毛豆（大豆）',en:'Edamame (soybeans)',id:'Edamame (kedelai)',vi:'Đậu edamame (đậu nành)',ok:true},
          {zh:'高麗菜',en:'Cabbage',id:'Kubis',vi:'Cải bắp',ok:false}],
    fb:{zh:'正確！毛豆（大豆）含有完整的必需胺基酸，蛋白質品質接近動物性蛋白，是蔬食飲食中最優質的蛋白質來源之一。其他優質植物蛋白來源還包括天貝、豆腐、扁豆、鷹嘴豆等。',en:'Correct! Edamame/soybeans contain all essential amino acids and protein quality close to animal protein — one of the best plant-based protein sources. Other quality sources include tempeh, tofu, lentils, and chickpeas.',id:'Benar! Edamame/kedelai mengandung semua asam amino esensial dan kualitas protein mendekati protein hewani — salah satu sumber protein nabati terbaik.',vi:'Đúng! Đậu nành chứa đầy đủ axit amin thiết yếu và chất lượng đạm gần với đạm động vật — một trong những nguồn đạm thực vật tốt nhất.'}},
   {q:{zh:'蔬食料理中常用「昆布」增添鮮味，其主要鮮味成分是？',en:'Kombu is commonly used in plant-based cooking to add umami. What is its main umami compound?',id:'Kombu sering digunakan dalam masakan nabati untuk menambah umami. Apa senyawa umami utamanya?',vi:'Tảo kombu thường dùng trong nấu ăn thuần chay để tăng umami. Hợp chất umami chính của nó là gì?'},
    opts:[{zh:'鈉（鹽分）',en:'Sodium (saltiness)',id:'Natrium (rasa asin)',vi:'Natri (vị mặn)',ok:false},
          {zh:'麩胺酸（Glutamate）',en:'Glutamate',id:'Glutamat',vi:'Glutamate',ok:true},
          {zh:'葡萄糖（糖分）',en:'Glucose (sweetness)',id:'Glukosa (rasa manis)',vi:'Glucose (vị ngọt)',ok:false}],
    fb:{zh:'正確！昆布富含麩胺酸（L-glutamate），是「第五味」鮮味（Umami）的主要來源之一。昆布高湯（昆布出汁）是日式及蔬食料理中增添鮮味的基礎，且完全植物性。',en:'Correct! Kombu is rich in L-glutamate, one of the primary sources of umami (the fifth taste). Kombu dashi is a foundation of Japanese and plant-based cooking for adding depth — and it\'s completely plant-based.',id:'Benar! Kombu kaya L-glutamat, salah satu sumber utama umami (rasa kelima). Kaldu kombu adalah dasar masakan Jepang dan nabati untuk menambahkan kedalaman.',vi:'Đúng! Kombu giàu L-glutamate, một trong những nguồn umami chính (vị thứ năm). Nước dùng kombu là nền tảng của ẩm thực Nhật Bản và nấu ăn thuần chay.'}},
   {q:{zh:'豆腐依照質地分類，哪種豆腐最適合用於「炸豆腐」或「照燒豆腐」？',en:'By texture classification, which type of tofu is best for "fried tofu" or "teriyaki tofu"?',id:'Berdasarkan klasifikasi tekstur, jenis tahu mana yang paling cocok untuk "tahu goreng" atau "tahu teriyaki"?',vi:'Theo phân loại kết cấu, loại đậu phụ nào phù hợp nhất cho "đậu phụ chiên" hoặc "đậu phụ teriyaki"?'},
    opts:[{zh:'嫩豆腐（絹豆腐）',en:'Silken tofu',id:'Tahu sutra lembut',vi:'Đậu phụ mềm (silken)',ok:false},
          {zh:'板豆腐（硬豆腐）',en:'Firm tofu',id:'Tahu padat',vi:'Đậu phụ cứng (firm)',ok:true},
          {zh:'豆腐花（豆花）',en:'Tofu pudding (douhua)',id:'Puding tahu (douhua)',vi:'Tàu hủ (douhua)',ok:false}],
    fb:{zh:'正確！板豆腐（硬豆腐）含水量低、質地緊實，在油炸或煎製時能維持形狀，外皮容易上色酥脆；嫩豆腐含水量高容易在高溫處理時破碎，較適合涼拌、蒸製或湯品中使用。',en:'Correct! Firm tofu has lower moisture and denser texture, holding its shape when frying or grilling with a nicely crisped exterior. Silken tofu has high moisture and crumbles easily at high heat — better for cold dishes, steaming, or soups.',id:'Benar! Tahu padat memiliki tekstur lebih rapat dan kadar air lebih rendah, mempertahankan bentuk saat digoreng dengan eksterior renyah. Tahu lembut mudah hancur pada panas tinggi.',vi:'Đúng! Đậu phụ cứng ít nước và chắc hơn, giữ hình dạng khi chiên với vỏ giòn; đậu phụ mềm nhiều nước dễ vỡ khi đun nhiệt cao — thích hợp hơn cho gỏi, hấp hoặc súp.'}},
   {q:{zh:'蔬食料理的「天貝（Tempeh）」是用什麼製成的？',en:'What is "tempeh" in plant-based cooking made from?',id:'Apa yang dimaksud "tempeh" dalam masakan nabati?',vi:'"Tempeh" trong nấu ăn thuần chay được làm từ gì?'},
    opts:[{zh:'小麥麵粉發酵製成',en:'Fermented wheat flour',id:'Tepung gandum yang difermentasi',vi:'Bột mì lên men',ok:false},
          {zh:'黃豆接種麴菌（Rhizopus）發酵壓製而成',en:'Soybeans inoculated with Rhizopus mold and fermented into a firm cake',id:'Kedelai yang diinokulasi dengan jamur Rhizopus dan difermentasi menjadi kue padat',vi:'Đậu nành được cấy nấm Rhizopus và lên men thành bánh chắc',ok:true},
          {zh:'豆腐鹽漬後製成',en:'Tofu salted and pressed',id:'Tahu yang digarami dan dipres',vi:'Đậu phụ ướp muối và ép',ok:false}],
    fb:{zh:'正確！天貝（Tempeh）是源自印尼的傳統發酵食品，以黃豆接種根黴菌（Rhizopus）發酵24–48小時，形成緊實的餅狀，富含蛋白質、益生菌和植物固醇，是蔬食飲食中極佳的蛋白質與發酵食品來源。',en:'Correct! Tempeh is a traditional Indonesian fermented food. Soybeans are inoculated with Rhizopus mold and fermented for 24–48 hours, forming a firm cake rich in protein, probiotics, and plant sterols — an excellent protein and fermented food source for plant-based diets.',id:'Benar! Tempeh adalah makanan fermentasi tradisional Indonesia. Kedelai diinokulasi dengan jamur Rhizopus dan difermentasi 24–48 jam, membentuk kue padat kaya protein, probiotik, dan fitosterol.',vi:'Đúng! Tempeh là thực phẩm lên men truyền thống Indonesia. Đậu nành được cấy nấm Rhizopus và lên men 24–48 giờ, tạo thành bánh chắc giàu protein, probiotic và phytosterol — nguồn đạm và thực phẩm lên men tuyệt vời cho chế độ ăn thuần chay.'}}
  ],
  /* Lv11 高湯與湯品基礎 ── 新增 */
  [
   {q:{zh:'製作清澈雞高湯時，雞肉與骨頭應該如何下鍋？',en:'For a clear chicken stock, how should the chicken and bones go into the pot?',id:'Untuk kaldu ayam jernih, bagaimana ayam dan tulang dimasukkan?',vi:'Để có nước dùng gà trong, gà và xương nên cho vào nồi như thế nào?'},
    opts:[{zh:'冷水下鍋，慢慢加熱',en:'Cold water, heat gradually',id:'Air dingin, panaskan perlahan',vi:'Nước lạnh, đun từ từ',ok:true},
          {zh:'滾水下鍋，快速煮滾',en:'Boiling water, bring to rapid boil',id:'Air mendidih, didihkan cepat',vi:'Nước sôi, đun nhanh',ok:false},
          {zh:'先用大火炸過再加水',en:'Deep-fry first then add water',id:'Goreng dulu lalu tambah air',vi:'Chiên trước rồi thêm nước',ok:false}],
    fb:{zh:'正確！冷水下鍋慢慢加熱，可讓蛋白質緩慢釋出並隨浮沫一起撈除，湯頭才會清澈。',en:'Correct! Starting with cold water and heating slowly lets proteins release gradually so foam can be skimmed, keeping the stock clear.',id:'Benar! Memulai dengan air dingin dan memanaskan perlahan membuat protein keluar bertahap sehingga buih bisa diangkat.',vi:'Đúng! Bắt đầu với nước lạnh và đun từ từ giúp protein thoát ra dần để có thể hớt bọt, giữ nước dùng trong.'}},
   {q:{zh:'焯水（汆燙）大骨或肉類的主要目的是？',en:'What is the main purpose of blanching bones or meat before making stock?',id:'Apa tujuan utama merebus sebentar tulang atau daging sebelum membuat kaldu?',vi:'Mục đích chính của việc chần xương hoặc thịt trước khi nấu nước dùng là gì?'},
    opts:[{zh:'讓肉變得更軟嫩',en:'Make the meat more tender',id:'Membuat daging lebih lembut',vi:'Làm thịt mềm hơn',ok:false},
          {zh:'去除血水與雜質，減少腥味與浮沫',en:'Remove blood and impurities, reducing odor and foam',id:'Menghilangkan darah dan kotoran, mengurangi bau dan buih',vi:'Loại bỏ máu và tạp chất, giảm mùi và bọt',ok:true},
          {zh:'幫助肉類上色',en:'Help the meat brown',id:'Membantu daging berwarna',vi:'Giúp thịt lên màu',ok:false}],
    fb:{zh:'正確！焯水可去除大量血水與雜質，讓後續熬煮的湯頭更清澈、氣味更乾淨。',en:'Correct! Blanching removes much of the blood and impurities, resulting in a cleaner-tasting, clearer stock.',id:'Benar! Merebus sebentar menghilangkan banyak darah dan kotoran, menghasilkan kaldu yang lebih jernih dan bersih rasanya.',vi:'Đúng! Chần loại bỏ phần lớn máu và tạp chất, cho nước dùng trong và sạch hơn.'}},
   {q:{zh:'熬煮高湯時，要保持湯頭清澈，火候應該如何控制？',en:'To keep the stock clear while simmering, how should the heat be controlled?',id:'Untuk menjaga kaldu tetap jernih saat dimasak, bagaimana api harus dikontrol?',vi:'Để giữ nước dùng trong khi ninh, lửa nên kiểm soát như thế nào?'},
    opts:[{zh:'全程大火滾煮，縮短時間',en:'Boil rapidly throughout to save time',id:'Didihkan keras sepanjang waktu untuk hemat waktu',vi:'Đun sôi mạnh suốt thời gian để tiết kiệm thời gian',ok:false},
          {zh:'保持小火微滾，並隨時撈除浮沫油脂',en:'Keep at a gentle simmer, skimming foam and fat regularly',id:'Pertahankan api kecil mendidih perlahan, sambil rutin mengangkat buih dan lemak',vi:'Giữ lửa nhỏ sôi lăn tăn, thường xuyên hớt bọt và mỡ',ok:true},
          {zh:'熬煮中途加入大量冷水',en:'Add a large amount of cold water midway',id:'Tambahkan banyak air dingin di tengah proses',vi:'Thêm nhiều nước lạnh giữa quá trình',ok:false}],
    fb:{zh:'正確！大滾會讓油脂與雜質乳化混入湯中變混濁，小火微滾並撈除浮沫，湯頭才會清澈鮮美。',en:'Correct! Rapid boiling emulsifies fat and impurities into the broth, making it cloudy. A gentle simmer with regular skimming keeps it clear and flavorful.',id:'Benar! Mendidih keras membuat lemak dan kotoran teremulsi ke dalam kaldu sehingga keruh. Mendidih perlahan sambil mengangkat buih membuat kaldu jernih dan gurih.',vi:'Đúng! Sôi mạnh làm mỡ và tạp chất nhũ hóa vào nước dùng gây đục. Sôi lăn tăn và hớt bọt thường xuyên giữ nước dùng trong và ngon.'}},
   {q:{zh:'製作高湯時，為什麼建議加入蔬菜根莖（如洋蔥、胡蘿蔔、西芹）？',en:'Why is it recommended to add root vegetables (e.g., onion, carrot, celery) when making stock?',id:'Mengapa disarankan menambahkan sayuran akar (seperti bawang, wortel, seledri) saat membuat kaldu?',vi:'Tại sao nên thêm rau củ cứng (như hành tây, cà rốt, cần tây) khi nấu nước dùng?'},
    opts:[{zh:'增加湯的顏色',en:'Add color to the soup',id:'Menambah warna pada sup',vi:'Thêm màu sắc cho súp',ok:false},
          {zh:'提供甜味、風味層次與香氣，使湯底更豐富',en:'Add sweetness, flavor depth, and aroma to enrich the stock base',id:'Menambah rasa manis, kedalaman rasa, dan aroma untuk memperkaya dasar kaldu',vi:'Thêm vị ngọt, chiều sâu hương vị và mùi thơm để làm phong phú nền nước dùng',ok:true},
          {zh:'讓高湯更快煮好',en:'Make the stock cook faster',id:'Membuat kaldu lebih cepat matang',vi:'Giúp nước dùng nấu nhanh hơn',ok:false}],
    fb:{zh:'正確！洋蔥帶甜味與鮮味、胡蘿蔔增色澤與甜度、西芹提供清新香氣與鮮味，三者合稱「Mirepoix（蔬菜香料底）」，是西式高湯的基礎食材，能讓湯底更有層次。',en:'Correct! Onion adds sweetness and savory depth, carrot adds color and sweetness, and celery provides fresh aroma — together called "Mirepoix," the base for Western stocks, adding complexity.',id:'Benar! Bawang menambah manis dan gurih, wortel menambah warna dan manis, seledri memberikan aroma segar — bersama disebut "Mirepoix", dasar kaldu Barat.',vi:'Đúng! Hành tây thêm ngọt và đậm đà, cà rốt thêm màu và ngọt, cần tây tạo mùi thơm tươi mát — cùng gọi là "Mirepoix", nền tảng nước dùng kiểu Tây.'}},
   {q:{zh:'高湯熬好後，要長期保存應如何處理？',en:'After making stock, what is the best way to store it long-term?',id:'Setelah membuat kaldu, cara terbaik untuk menyimpannya jangka panjang adalah?',vi:'Sau khi nấu xong nước dùng, cách tốt nhất để bảo quản lâu dài là gì?'},
    opts:[{zh:'放入冰箱冷藏，可保存3個月',en:'Refrigerate; it keeps for 3 months',id:'Simpan di kulkas; tahan 3 bulan',vi:'Cất tủ lạnh; bảo quản được 3 tháng',ok:false},
          {zh:'冷卻後分裝入容器，冷凍保存可達1–3個月',en:'Cool, portion into containers, and freeze — keeps for 1–3 months',id:'Dinginkan, bagi ke wadah, dan bekukan — tahan 1–3 bulan',vi:'Để nguội, chia vào hộp và đông lạnh — bảo quản được 1–3 tháng',ok:true},
          {zh:'直接在室溫下放置即可',en:'Leave at room temperature',id:'Biarkan di suhu ruang',vi:'Để ở nhiệt độ phòng là được',ok:false}],
    fb:{zh:'正確！高湯冷卻後應分裝入密封容器，冷凍可保存1–3個月。冷藏只能保存3–4天。可製作成冰塊方便日後取用適量，是廚師節省時間的好習慣。',en:'Correct! After cooling, portion stock into sealed containers and freeze for 1–3 months. Refrigerated stock lasts only 3–4 days. Freezing in ice cube trays is a convenient way to use small amounts later.',id:'Benar! Setelah didinginkan, bagi kaldu ke wadah tertutup dan bekukan selama 1–3 bulan. Di kulkas hanya tahan 3–4 hari.',vi:'Đúng! Sau khi nguội, chia nước dùng vào hộp kín và đông lạnh 1–3 tháng. Tủ lạnh chỉ bảo quản được 3–4 ngày. Đông thành khối đá rất tiện dùng lượng nhỏ sau này.'}},
   {q:{zh:'什麼是「濃縮高湯（Glace）」？',en:'What is a "glace" (concentrated stock)?',id:'Apa itu "glace" (kaldu pekat)?',vi:'"Glace" (nước dùng cô đặc) là gì?'},
    opts:[{zh:'加了大量香料的高湯',en:'Stock with a lot of added spices',id:'Kaldu dengan banyak rempah tambahan',vi:'Nước dùng thêm nhiều gia vị',ok:false},
          {zh:'高湯經過長時間煮沸減量，濃縮至原始體積的1/4或更少',en:'Stock simmered long enough to reduce to 1/4 or less of its original volume',id:'Kaldu yang direbus lama hingga berkurang menjadi 1/4 atau kurang dari volume aslinya',vi:'Nước dùng được đun lâu cho đến khi cô lại còn 1/4 hoặc ít hơn thể tích ban đầu',ok:true},
          {zh:'冷藏後表面結成的油脂層',en:'The fat layer that solidifies on top when refrigerated',id:'Lapisan lemak yang membeku di atas saat didinginkan',vi:'Lớp mỡ đông đặc trên bề mặt khi để lạnh',ok:false}],
    fb:{zh:'正確！Glace（如Glace de viande）是將高湯長時間熬煮濃縮至原始體積的1/10以內，形成高度濃縮的膠狀精華，少量即可大幅提升料理的鮮味與濃郁度。',en:'Correct! Glace (e.g., glace de viande) is stock reduced to 1/10 or less of its volume through prolonged simmering, creating a highly concentrated gelatinous essence that dramatically boosts flavor.',id:'Benar! Glace (seperti glace de viande) adalah kaldu yang direduksi hingga 1/10 atau kurang dari volumenya, menghasilkan esensi gelatin yang sangat pekat.',vi:'Đúng! Glace (như glace de viande) là nước dùng cô lại đến 1/10 thể tích hoặc ít hơn, tạo ra tinh chất cô đặc cao có thể tăng đáng kể hương vị món ăn.'}},
   {q:{zh:'烹調西式濃湯（Cream Soup）時，最後加入鮮奶油的時機是？',en:'When making Western cream soup, when should you add the cream?',id:'Saat membuat sup krim Barat, kapan waktu menambahkan krim?',vi:'Khi nấu súp kem kiểu Tây, thời điểm nào nên thêm kem?'},
    opts:[{zh:'一開始就加入，與其他食材一起煮',en:'At the very beginning, cooking with other ingredients',id:'Di awal sekali, memasak dengan bahan lain',vi:'Ngay từ đầu, nấu cùng các nguyên liệu khác',ok:false},
          {zh:'湯底完成、熄火前或盛碗前加入，避免過度加熱導致乳脂分離',en:'After the soup base is done, just before serving or turning off heat, to avoid excessive heat causing the fat to separate',id:'Setelah sup selesai, sesaat sebelum disajikan atau mematikan api, untuk menghindari panas berlebih yang menyebabkan lemak memisah',vi:'Sau khi nền súp xong, ngay trước khi tắt lửa hoặc múc ra, để tránh nhiệt quá cao làm mỡ tách ra',ok:true},
          {zh:'加鮮奶油前先煮沸，讓鮮奶油充分融入湯中',en:'Boil the cream first, then add it so it blends fully into the soup',id:'Rebus krim terlebih dahulu, lalu tambahkan agar menyatu sepenuhnya dengan sup',vi:'Đun sôi kem trước rồi mới thêm để nó hòa tan đều vào súp',ok:false}],
    fb:{zh:'正確！鮮奶油（Heavy Cream）過度加熱會導致乳脂蛋白質分解、油脂分離，影響湯的口感與外觀。應在湯底完成後，轉小火或熄火後再加入，攪拌均勻即可。',en:'Correct! Heavy cream that overheats can cause fat-protein breakdown and separation, ruining the texture and appearance. Add it after the soup base is done, on low heat or off heat, then stir to combine.',id:'Benar! Krim berat yang terlalu panas menyebabkan pemisahan lemak-protein, merusak tekstur dan penampilan. Tambahkan setelah sup selesai, di api kecil atau matikan api.',vi:'Đúng! Kem đặc đun quá nhiệt gây tách béo-protein, làm hỏng kết cấu và ngoại quan. Thêm sau khi nền súp xong, ở lửa nhỏ hoặc tắt lửa, rồi khuấy đều.'}},
   {q:{zh:'熬製雞高湯時，浮沫應該如何處理？',en:'When simmering chicken stock, how should the foam that appears be handled?',id:'Saat memasak kaldu ayam, bagaimana busa yang muncul harus ditangani?',vi:'Khi hầm nước dùng gà, bọt nổi lên cần xử lý như thế nào?'},
    opts:[{zh:'留著一起煮，增加高湯風味',en:'Leave it in — it adds flavor to the stock',id:'Biarkan saja — itu menambah rasa pada kaldu',vi:'Để yên — nó thêm hương vị cho nước dùng',ok:false},
          {zh:'用湯勺撇除浮沫，保持高湯清澈',en:'Skim off the foam with a ladle to keep the stock clear',id:'Singkirkan busa dengan sendok untuk menjaga kaldu tetap jernih',vi:'Vớt bọt bằng muôi để giữ nước dùng trong',ok:true},
          {zh:'用濾網過濾整鍋高湯去除浮沫',en:'Strain the entire stock through a sieve to remove foam',id:'Saring seluruh kaldu melalui saringan untuk menghilangkan busa',vi:'Lọc toàn bộ nước dùng qua rây để loại bọt',ok:false}],
    fb:{zh:'正確！熬高湯初期的浮沫主要由血水、蛋白質及雜質構成，若不撇除會使高湯混濁並帶有異味。應在開始沸騰的前10–15分鐘用湯勺持續撇除，待浮沫減少後轉小火繼續熬製，即可得到清澈的高湯。',en:'Correct! The foam that appears early in stock-making is mainly blood, protein, and impurities. If not removed, it makes the stock cloudy with off-flavors. Skim continuously during the first 10–15 minutes, then reduce to a simmer for clear stock.',id:'Benar! Busa yang muncul awal pembuatan kaldu terutama adalah darah, protein, dan kotoran. Jika tidak dihilangkan, kaldu menjadi keruh. Singkirkan terus-menerus selama 10–15 menit pertama.',vi:'Đúng! Bọt xuất hiện khi bắt đầu hầm chủ yếu là huyết, protein và tạp chất. Nếu không vớt, nước dùng sẽ đục và có mùi lạ. Vớt liên tục trong 10–15 phút đầu, sau đó hạ lửa để có nước dùng trong.'}},
   {q:{zh:'高湯熬好後，如何判斷高湯的品質是否達到標準？',en:'After stock is done, how can you tell if its quality meets standard?',id:'Setelah kaldu selesai, bagaimana Anda bisa mengetahui apakah kualitasnya memenuhi standar?',vi:'Sau khi nước dùng xong, làm sao biết chất lượng đạt tiêu chuẩn?'},
    opts:[{zh:'顏色越深越好，代表味道越濃',en:'Deeper color is always better — it means stronger flavor',id:'Warna lebih gelap selalu lebih baik — artinya rasa lebih kuat',vi:'Màu càng đậm càng tốt — có nghĩa là vị càng đậm đà',ok:false},
          {zh:'冷卻後應輕微凝膠化（膠質豐富），色澤清澈金黃，無雜異味',en:'After cooling it should lightly gel (rich gelatin), with a clear golden color and no off-flavors',id:'Setelah dingin harus sedikit mengental (kaya gelatin), dengan warna keemasan jernih dan tanpa rasa asing',vi:'Sau khi nguội nên hơi đặc lại (giàu gelatin), màu vàng trong và không có mùi lạ',ok:true},
          {zh:'只要聞起來有香氣就是好高湯',en:'Good smell alone indicates good stock',id:'Bau yang baik saja sudah menandakan kaldu yang baik',vi:'Chỉ cần có mùi thơm là nước dùng tốt',ok:false}],
    fb:{zh:'正確！優質高湯的判斷標準：①冷卻後因豐富的膠原蛋白轉化的明膠而輕微凝固，代表骨膠質萃取充分②色澤清澈透明不混濁③氣味純正無雜味④鹹淡適中（未調味高湯本身應清淡）。深色不代表好，反而可能是熬製過度或有焦苦味。',en:'Correct! Quality stock standards: ① Lightly gels when cold (rich collagen converted to gelatin — good extraction) ② Clear and transparent, not cloudy ③ Clean aroma, no off-flavors ④ Mild flavor (unseasoned stock should be subtle). Deep color does not mean better — it may mean overcooked or bitter.',id:'Benar! Standar kaldu berkualitas: ① Sedikit mengental saat dingin (gelatin kaya — ekstraksi baik) ② Jernih dan bening ③ Aroma bersih ④ Rasa ringan (kaldu tak dibumbui harus halus).',vi:'Đúng! Tiêu chuẩn nước dùng tốt: ① Hơi đặc lại khi nguội (gelatin phong phú — chiết xuất tốt) ② Trong suốt ③ Mùi thuần ④ Vị nhẹ. Màu đậm không phải tốt hơn — có thể là hầm quá hoặc có vị đắng khét.'}},
   {q:{zh:'在湯品中加入「太白粉水（澱粉水）」的作用是？',en:'What is the purpose of adding "starch slurry" (water mixed with starch) to a soup?',id:'Apa tujuan menambahkan "larutan tepung kanji" ke dalam sup?',vi:'Mục đích của việc thêm "nước bột năng" vào súp là gì?'},
    opts:[{zh:'讓湯品顏色更鮮豔',en:'Make the soup color more vibrant',id:'Membuat warna sup lebih cerah',vi:'Làm màu súp tươi hơn',ok:false},
          {zh:'增稠湯品，提升口感黏稠度，讓食材與湯汁更好地融合',en:'Thicken the soup, improve texture consistency, and help ingredients integrate better with the broth',id:'Mengentalkan sup, meningkatkan kekentalan tekstur, dan membantu bahan menyatu lebih baik dengan kaldu',vi:'Làm đặc súp, cải thiện độ sệt, và giúp nguyên liệu hòa quyện tốt hơn với nước dùng',ok:true},
          {zh:'讓湯品更清淡',en:'Make the soup lighter in flavor',id:'Membuat sup lebih ringan rasanya',vi:'Làm súp nhẹ hơn về hương vị',ok:false}],
    fb:{zh:'正確！太白粉水（澱粉+水均勻混合）加入湯品後，澱粉遇熱糊化，使湯汁變稠並具有光澤感，能讓食材均勻裹覆湯汁、口感更飽滿。注意需先將太白粉充分溶於冷水，再邊攪拌邊慢慢加入滾湯，避免結塊。',en:'Correct! Starch slurry (starch mixed with cold water) gelatinizes when added to hot soup, thickening it and giving it a glossy finish that coats ingredients evenly and improves mouthfeel. Always dissolve starch in cold water first, then stir in slowly while mixing.',id:'Benar! Larutan tepung kanji menggelatin saat ditambahkan ke sup panas, mengentalkan dan memberikan kilap, melapisi bahan secara merata.',vi:'Đúng! Nước bột năng (bột hòa tan với nước lạnh) khi thêm vào súp nóng sẽ gelatin hóa, làm đặc và tạo độ bóng, bám đều nguyên liệu và cải thiện độ sệt. Luôn pha bột với nước lạnh trước rồi khuấy từ từ vào.'}}
  ],

  [
   {q:{zh:'挑選新鮮魚類時，下列哪一項是正確的判斷依據？',en:'When choosing fresh fish, which of the following is a correct indicator?',id:'Saat memilih ikan segar, mana indikator yang benar?',vi:'Khi chọn cá tươi, dấu hiệu nào sau đây là đúng?'},

          {zh:'眼睛清澈凸出、魚鰓鮮紅、按壓肉質有彈性',en:'Clear, bulging eyes; bright red gills; firm flesh that springs back',id:'Mata jernih menonjol, insang merah cerah, daging kenyal saat ditekan',vi:'Mắt trong lồi, mang đỏ tươi, thịt đàn hồi khi ấn',ok:true},
          {zh:'魚身散發強烈腥臭味',en:'Strong fishy/rotten odor',id:'Bau busuk yang kuat',vi:'Mùi tanh nồng nặc',ok:false}],
    fb:{zh:'正確！新鮮魚的眼睛清澈凸出、魚鰓鮮紅無黏液、按壓魚肉會立即回彈，這些都是判斷新鮮度的重要指標。',en:'Correct! Fresh fish has clear, bulging eyes, bright red gills without slime, and flesh that springs back when pressed — all key freshness indicators.',id:'Benar! Ikan segar memiliki mata jernih menonjol, insang merah cerah tanpa lendir, dan daging yang kembali saat ditekan — semua indikator kesegaran penting.',vi:'Đúng! Cá tươi có mắt trong lồi, mang đỏ tươi không nhớt, và thịt đàn hồi trở lại khi ấn — đều là dấu hiệu quan trọng để nhận biết độ tươi.'}},
   {q:{zh:'食品包裝上同時標示「製造日期」與「有效日期（保存期限）」，採購時應優先注意哪一項？',en:'When food packaging shows both a \"manufacture date\" and an \"expiry date\", which should you prioritize when shopping?',id:'Saat kemasan makanan menampilkan \"tanggal produksi\" dan \"tanggal kedaluwarsa\", mana yang harus diprioritaskan?',vi:'Khi bao bì thực phẩm có cả \"ngày sản xuất\" và \"ngày hết hạn\", nên ưu tiên điều gì khi mua?'},
    opts:[{zh:'製造日期，越接近今天越好',en:'Manufacture date — the closer to today, the better',id:'Tanggal produksi — semakin baru semakin baik',vi:'Ngày sản xuất — càng gần hôm nay càng tốt',ok:false},
          {zh:'有效日期，確保購買後有足夠時間食用完畢',en:'Expiry date — to ensure enough time to use the product after purchase',id:'Tanggal kedaluwarsa — memastikan cukup waktu untuk menggunakan produk',vi:'Ngày hết hạn — để đảm bảo có đủ thời gian sử dụng sau khi mua',ok:true},
          {zh:'兩者皆不重要，依外觀判斷即可',en:'Neither matters — judge by appearance alone',id:'Keduanya tidak penting — cukup lihat penampilan',vi:'Cả hai không quan trọng — chỉ cần nhìn bề ngoài',ok:false}],
    fb:{zh:'正確！有效日期（保存期限）代表食品在此日期前品質與安全無虞，採購時應確認有效日期是否足夠涵蓋你預計使用的時間，避免買回家後很快過期。',en:'Correct! The expiry date indicates the product remains safe and good quality until that date. Check that it leaves enough time before you plan to use the product, so it doesn\'t expire too soon after purchase.',id:'Benar! Tanggal kedaluwarsa menunjukkan produk aman dan berkualitas hingga tanggal tersebut. Pastikan ada cukup waktu sebelum Anda berencana menggunakannya.',vi:'Đúng! Ngày hết hạn cho biết sản phẩm vẫn an toàn và chất lượng đến ngày đó. Hãy kiểm tra để có đủ thời gian sử dụng trước khi sản phẩm hết hạn.'}},
   {q:{zh:'要在預算內採購又能確保新鮮度，最有效的做法是？',en:'To shop within budget while ensuring freshness, what is the most effective approach?',id:'Untuk berbelanja sesuai anggaran sambil memastikan kesegaran, apa pendekatan paling efektif?',vi:'Để mua sắm trong ngân sách mà vẫn đảm bảo độ tươi, cách hiệu quả nhất là gì?'},
    opts:[{zh:'依採購清單按計畫購買，並優先選擇當季食材',en:'Shop with a planned list and prioritize seasonal ingredients',id:'Berbelanja dengan daftar terencana dan memilih bahan musiman',vi:'Mua theo danh sách có kế hoạch và ưu tiên nguyên liệu theo mùa',ok:true},
          {zh:'只買最便宜的品牌，不考慮新鮮度',en:'Buy only the cheapest brand regardless of freshness',id:'Beli hanya merek termurah tanpa memperhatikan kesegaran',vi:'Chỉ mua thương hiệu rẻ nhất, không quan tâm độ tươi',ok:false},
          {zh:'看到促銷就大量購買囤貨',en:'Stockpile large quantities whenever there\'s a sale',id:'Menimbun dalam jumlah besar setiap ada promo',vi:'Mua trữ số lượng lớn mỗi khi có giảm giá',ok:false}],
    fb:{zh:'正確！依計畫清單採購可避免衝動購買與浪費，當季食材通常價格較低且新鮮度與營養較佳，是兼顧預算與品質的關鍵習慣。',en:'Correct! Shopping with a planned list avoids impulse buying and waste, and seasonal ingredients are usually cheaper, fresher, and more nutritious — a key habit for balancing budget and quality.',id:'Benar! Berbelanja dengan daftar terencana menghindari pembelian impulsif dan pemborosan, dan bahan musiman biasanya lebih murah, segar, dan bergizi.',vi:'Đúng! Mua theo danh sách có kế hoạch tránh mua sắm bốc đồng và lãng phí, nguyên liệu theo mùa thường rẻ hơn, tươi hơn và bổ dưỡng hơn.'}},
   {q:{zh:'挑選新鮮雞蛋時，下列哪個判斷方式最可靠？',en:'When choosing fresh eggs, which method is most reliable?',id:'Saat memilih telur segar, metode mana yang paling dapat diandalkan?',vi:'Khi chọn trứng tươi, phương pháp nào đáng tin cậy nhất?'},
    opts:[{zh:'蛋殼顏色越白越新鮮',en:'Whiter shells mean fresher eggs',id:'Cangkang lebih putih berarti lebih segar',vi:'Vỏ trứng trắng hơn là tươi hơn',ok:false},
          {zh:'將蛋放入冷水中，沉底者較新鮮，浮起者較不新鮮',en:'Place eggs in cold water; those that sink are fresher, those that float are less fresh',id:'Letakkan telur dalam air dingin; yang tenggelam lebih segar, yang mengapung kurang segar',vi:'Thả trứng vào nước lạnh; trứng chìm thì tươi hơn, trứng nổi thì kém tươi hơn',ok:true},
          {zh:'蛋越大越新鮮',en:'Larger eggs are fresher',id:'Telur lebih besar berarti lebih segar',vi:'Trứng to hơn là tươi hơn',ok:false}],
    fb:{zh:'正確！新鮮雞蛋氣室小，放入水中會沉底；隨時間增加，蛋內水分蒸發、氣室擴大，浮力增加，較不新鮮的蛋會站立甚至漂浮。這是判斷雞蛋新鮮度的簡單有效方法。',en:'Correct! Fresh eggs have a small air cell and sink. As they age, moisture evaporates and the air cell grows, increasing buoyancy. Less-fresh eggs stand upright or float — a simple and effective freshness test.',id:'Benar! Telur segar memiliki ruang udara kecil dan tenggelam. Seiring waktu, kelembapan menguap dan ruang udara membesar, meningkatkan daya apung.',vi:'Đúng! Trứng tươi có buồng khí nhỏ và chìm xuống. Theo thời gian, độ ẩm bay hơi và buồng khí lớn lên, lực nổi tăng. Trứng kém tươi đứng thẳng hoặc nổi lên.'}},
   {q:{zh:'挑選新鮮蔬菜時，下列哪個指標最能代表蔬菜的新鮮度？',en:'When selecting fresh vegetables, which indicator best represents freshness?',id:'Saat memilih sayuran segar, indikator mana yang paling mewakili kesegaran?',vi:'Khi chọn rau tươi, chỉ số nào thể hiện độ tươi tốt nhất?'},
    opts:[{zh:'顏色越深越好',en:'Deeper color is always better',id:'Warna lebih gelap selalu lebih baik',vi:'Màu càng đậm càng tốt',ok:false},
          {zh:'葉片挺立飽滿、切面濕潤有光澤、無枯黃或腐爛',en:'Upright firm leaves, moist and glossy cut surfaces, no yellowing or rot',id:'Daun tegak dan segar, permukaan potongan lembap dan mengkilap, tidak ada kuning atau busuk',vi:'Lá đứng thẳng và căng, bề mặt cắt ẩm và bóng, không vàng héo hay thối',ok:true},
          {zh:'重量越重越好，代表水分足夠',en:'Heavier is always better — it means adequate moisture',id:'Lebih berat selalu lebih baik — artinya kelembapan yang cukup',vi:'Nặng hơn là tốt hơn — nghĩa là đủ nước',ok:false}],
    fb:{zh:'正確！新鮮蔬菜的最佳指標是：葉片挺立不萎軟、切面或斷裂處濕潤有光澤、顏色鮮亮無枯黃斑點、聞起來有自然清香。重量只是參考，不同蔬菜差異大。',en:'Correct! The best freshness indicators are: upright firm leaves (not wilted), moist and glossy cut/broken surfaces, bright colors without yellowing or spots, and a natural fresh aroma. Weight is just a rough guide.',id:'Benar! Indikator kesegaran terbaik: daun tegak tidak layu, permukaan potong lembap dan mengkilap, warna cerah tanpa bercak kuning, dan aroma segar alami.',vi:'Đúng! Dấu hiệu tươi tốt nhất: lá đứng thẳng không héo, bề mặt cắt ẩm và bóng, màu sắc tươi sáng không vàng, mùi thơm tự nhiên.'}},
   {q:{zh:'採購食材時，「有機農產品」與「一般農產品」的主要差異是？',en:'When shopping, what is the main difference between "organic" and "conventional" produce?',id:'Saat berbelanja, apa perbedaan utama antara produk "organik" dan "konvensional"?',vi:'Khi mua sắm, sự khác biệt chính giữa nông sản "hữu cơ" và "thông thường" là gì?'},
    opts:[{zh:'有機農產品不含任何水分，所以保存更久',en:'Organic produce contains no moisture, so it lasts longer',id:'Produk organik tidak mengandung kelembapan, sehingga lebih tahan lama',vi:'Nông sản hữu cơ không chứa độ ẩm nên bảo quản lâu hơn',ok:false},
