          {zh:'有機農產品使用較少或不使用合成農藥與化學肥料',en:'Organic produce uses little or no synthetic pesticides or chemical fertilizers',id:'Produk organik menggunakan sedikit atau tidak ada pestisida sintetis dan pupuk kimia',vi:'Nông sản hữu cơ sử dụng ít hoặc không dùng thuốc trừ sâu tổng hợp và phân bón hóa học',ok:true},
          {zh:'有機農產品的營養價值一定比一般農產品高兩倍以上',en:'Organic produce definitely has more than twice the nutritional value of conventional produce',id:'Produk organik pasti memiliki nilai gizi lebih dari dua kali produk konvensional',vi:'Nông sản hữu cơ chắc chắn có giá trị dinh dưỡng cao hơn gấp đôi so với nông sản thông thường',ok:false}],
    fb:{zh:'正確！有機農產品是依照有機農業規範栽培，限制或不使用合成農藥、化學肥料與基因改造生物。但有機並不代表完全無農藥，且營養含量的優勢研究尚未有一致結論。',en:'Correct! Organic produce is grown according to organic farming standards, limiting or avoiding synthetic pesticides, chemical fertilizers, and GMOs. However, organic doesn\'t mean zero pesticides, and nutritional advantages are not yet conclusive.',id:'Benar! Produk organik ditanam sesuai standar pertanian organik, membatasi pestisida sintetis, pupuk kimia, dan GMO.',vi:'Đúng! Nông sản hữu cơ được trồng theo tiêu chuẩn nông nghiệp hữu cơ, hạn chế thuốc trừ sâu tổng hợp, phân bón hóa học và GMO. Nhưng hữu cơ không có nghĩa là không có thuốc, và lợi thế dinh dưỡng chưa có kết luận nhất quán.'}},
   {q:{zh:'採購海鮮時，下列哪個現象代表蝦子不新鮮？',en:'When buying seafood, which sign indicates that shrimp is not fresh?',id:'Saat membeli seafood, tanda mana yang menunjukkan udang tidak segar?',vi:'Khi mua hải sản, dấu hiệu nào cho thấy tôm không tươi?'},
    opts:[{zh:'蝦頭與蝦身連接緊實',en:'The head is firmly attached to the body',id:'Kepala menempel erat pada tubuh',vi:'Đầu gắn chắc vào thân',ok:false},
          {zh:'蝦頭出現黑化或呈現脫離狀態，蝦身軟塌無彈性',en:'The head is blackening or detaching, and the body is soft and not springy',id:'Kepala menghitam atau terlepas, dan tubuh lembek tanpa elastisitas',vi:'Đầu bị đen hoặc rời ra, thân mềm nhão không đàn hồi',ok:true},
          {zh:'蝦子顏色為半透明淺灰色',en:'The shrimp has a translucent light gray color',id:'Udang berwarna abu-abu muda transparan',vi:'Tôm có màu xám nhạt trong suốt',ok:false}],
    fb:{zh:'正確！新鮮蝦子蝦頭緊實、蝦殼有光澤、蝦身透明偏灰或偏綠、按壓有彈性。蝦頭變黑是氧化與細菌活動的結果，蝦身軟塌代表蛋白質已開始降解，都是不新鮮的明顯跡象。',en:'Correct! Fresh shrimp has a firm head, glossy shell, translucent gray-green body, and springs back when pressed. A blackening head indicates oxidation and bacterial activity; a limp body means protein degradation has begun — both clear signs of poor freshness.',id:'Benar! Udang segar memiliki kepala yang kencang, cangkang berkilap, tubuh transparan abu-abu-hijau, dan elastis saat ditekan. Kepala yang menghitam menunjukkan oksidasi dan aktivitas bakteri.',vi:'Đúng! Tôm tươi có đầu chắc, vỏ bóng, thân trong xanh xám và đàn hồi khi ấn. Đầu đen là dấu hiệu oxy hóa và vi khuẩn hoạt động; thân nhão nghĩa là protein đã bắt đầu phân giải.'}},
   {q:{zh:'如何辨識豬肉是否新鮮？',en:'How can you tell if pork is fresh?',id:'Bagaimana cara mengetahui apakah daging babi segar?',vi:'Làm thế nào để nhận biết thịt heo tươi?'},
    opts:[{zh:'顏色越深紅越新鮮',en:'The darker red the color, the fresher it is',id:'Semakin merah tua warnanya semakin segar',vi:'Màu đỏ càng đậm càng tươi',ok:false},
          {zh:'顏色粉紅均勻、質地緊實有彈性、氣味無異味',en:'Even pink color, firm and springy texture, no unusual odor',id:'Warna merah muda merata, tekstur padat dan kenyal, tidak ada bau tidak biasa',vi:'Màu hồng đều, kết cấu chắc và đàn hồi, không có mùi lạ',ok:true},
          {zh:'肉表面有少量黏液代表新鮮',en:'A little slime on the surface indicates freshness',id:'Sedikit lendir di permukaan menunjukkan kesegaran',vi:'Ít chất nhớt trên bề mặt cho thấy thịt tươi',ok:false}],
    fb:{zh:'正確！新鮮豬肉的判斷標準：①顏色粉紅均勻自然，無灰色或暗紅②按壓後迅速回彈，不留指印③氣味清淡自然，無酸臭或腐敗味④表面乾燥不黏滑（有黏液代表開始變質）。購買後應儘快冷藏或冷凍。',en:'Correct! Fresh pork standards: ① Even, natural pink color — no gray or dark red ② Springs back quickly when pressed ③ Mild, natural smell — no sour or putrid odor ④ Surface is dry, not slimy (sliminess indicates spoilage begins). Refrigerate or freeze promptly after purchase.',id:'Benar! Standar daging babi segar: ① Warna merah muda merata ② Kembali cepat saat ditekan ③ Bau ringan alami ④ Permukaan kering, tidak berlendir.',vi:'Đúng! Tiêu chuẩn thịt heo tươi: ① Màu hồng đều tự nhiên ② Đàn hồi nhanh khi ấn ③ Mùi nhẹ tự nhiên, không chua hay thối ④ Bề mặt khô, không nhớt (có nhớt là bắt đầu hỏng). Cần cho vào tủ lạnh hoặc đông ngay sau khi mua.'}},
   {q:{zh:'採購豆腐時，怎樣判斷豆腐是否新鮮？',en:'When buying tofu, how can you tell if it is fresh?',id:'Saat membeli tahu, bagaimana Anda bisa mengetahui apakah segar?',vi:'Khi mua đậu phụ, làm sao biết có tươi không?'},
    opts:[{zh:'只需確認包裝完整即可',en:'Just check that the packaging is intact',id:'Cukup periksa kemasannya utuh',vi:'Chỉ cần kiểm tra bao bì nguyên vẹn',ok:false},
          {zh:'顏色白淨、質地緊實、聞起來有淡淡豆香、浸泡液清澈',en:'White and clean color, firm texture, mild soy fragrance, clear soaking liquid',id:'Warna putih bersih, tekstur padat, aroma kedelai ringan, cairan rendaman jernih',vi:'Màu trắng sạch, kết cấu chắc, mùi đậu nhẹ, nước ngâm trong',ok:true},
          {zh:'顏色越黃越代表是純天然豆腐',en:'A more yellow color means it is all-natural tofu',id:'Warna lebih kuning berarti tahu alami',vi:'Màu càng vàng càng là đậu phụ tự nhiên',ok:false}],
    fb:{zh:'正確！新鮮豆腐應呈現白淨均勻的顏色（略帶米白屬正常），質地緊實有韌性，帶有淡淡的豆香，浸泡液清澈不混濁。若豆腐呈現黃色、有酸味、質地鬆散或浸液混濁，均代表已開始變質，不宜食用。',en:'Correct! Fresh tofu should be a clean white color (slight off-white is normal), firm and resilient, with a mild soy fragrance and clear soaking liquid. Yellowing, sour smell, crumbly texture, or cloudy liquid all indicate spoilage.',id:'Benar! Tahu segar harus berwarna putih bersih, padat dan kenyal, dengan aroma kedelai ringan dan cairan rendaman jernih. Warna kuning, bau asam, tekstur hancur, atau cairan keruh menunjukkan kerusakan.',vi:'Đúng! Đậu phụ tươi nên có màu trắng sạch (hơi kem là bình thường), chắc và đàn hồi, mùi đậu nhẹ và nước ngâm trong. Màu vàng, mùi chua, kết cấu bở hoặc nước đục đều là dấu hiệu đã hỏng.'}},
   {q:{zh:'在台灣菜市場採購肉品時，選擇「溫體肉」還是「冷藏肉」比較安全？',en:'When shopping for meat at a Taiwanese market, is "warm-body meat" or "refrigerated meat" safer?',id:'Saat berbelanja daging di pasar Taiwan, mana yang lebih aman: "daging hangat" atau "daging dingin"?',vi:'Khi mua thịt tại chợ Đài Loan, "thịt ôn thể" hay "thịt lạnh" an toàn hơn?'},
    opts:[{zh:'溫體肉因為最新鮮，絕對更安全',en:'Warm-body meat is definitely safer because it is freshest',id:'Daging hangat pasti lebih aman karena paling segar',vi:'Thịt ôn thể chắc chắn an toàn hơn vì tươi nhất',ok:false},
          {zh:'冷藏肉因為全程維持低溫，細菌數量受到控制，食品安全較有保障',en:'Refrigerated meat is safer because cold-chain control keeps bacterial counts low',id:'Daging dingin lebih aman karena kontrol rantai dingin menjaga jumlah bakteri tetap rendah',vi:'Thịt lạnh an toàn hơn vì kiểm soát chuỗi lạnh giữ vi khuẩn ở mức thấp',ok:true},
          {zh:'兩者食品安全完全相同，選擇哪種都一樣',en:'Both are identical in food safety, no difference',id:'Keduanya identik dalam keamanan pangan, tidak ada perbedaan',vi:'Cả hai giống nhau về an toàn thực phẩm, không khác biệt',ok:false}],
    fb:{zh:'正確！溫體肉雖然新鮮，但在市場常溫中展售時已進入5–60°C危險溫度帶，細菌開始增殖；冷藏肉經過屠宰後全程冷鏈管理（4°C以下），細菌增殖受到抑制，食品安全風險較低。從食品安全的角度，冷藏肉是更安全的選擇。',en:'Correct! While warm-body meat is fresh, it enters the 5–60°C danger zone during open-market display and bacteria begin multiplying. Refrigerated meat is kept below 4°C throughout the cold chain after slaughter, suppressing bacterial growth. From a food safety perspective, refrigerated meat is the safer choice.',id:'Benar! Meskipun daging hangat segar, saat dipajang di pasar suhu ruang, bakteri mulai berkembang biak. Daging dingin dijaga di bawah 4°C sepanjang rantai dingin setelah penyembelihan.',vi:'Đúng! Mặc dù thịt ôn thể tươi hơn, nhưng khi bày bán ở chợ nhiệt độ phòng, vi khuẩn bắt đầu sinh sôi trong vùng nguy hiểm. Thịt lạnh được giữ dưới 4°C suốt chuỗi lạnh sau giết mổ, ức chế vi khuẩn. Về an toàn thực phẩm, thịt lạnh là lựa chọn an toàn hơn.'}}
  ],
  /* Lv13 烘焙入門 */
  [
   {q:{zh:'使用烤箱前，正確的預熱步驟是？',en:'What is the correct preheating step before using an oven?',id:'Apa langkah pemanasan awal yang benar sebelum menggunakan oven?',vi:'Bước làm nóng lò nướng đúng cách là gì?'},
    opts:[{zh:'放入食材後再開始加熱',en:'Put food in first, then start heating',id:'Masukkan makanan dulu, lalu mulai memanaskan',vi:'Cho thức ăn vào trước rồi mới bật lò',ok:false},
          {zh:'先將烤箱預熱至指定溫度，再放入食材',en:'Preheat the oven to the target temperature first, then add food',id:'Panaskan oven ke suhu yang ditentukan dulu, lalu masukkan makanan',vi:'Làm nóng lò đến nhiệt độ yêu cầu trước, rồi mới cho thức ăn vào',ok:true},
          {zh:'預熱與否對烘焙結果沒有影響',en:'Preheating makes no difference to baking results',id:'Pemanasan awal tidak berpengaruh pada hasil pemanggangan',vi:'Làm nóng lò trước không ảnh hưởng đến kết quả nướng',ok:false}],
    fb:{zh:'正確！預熱確保食材一入爐即受到穩定均勻的熱能，是烘焙成功的基礎。未預熱會導致成品膨脹不良、底部受熱不均。',en:'Correct! Preheating ensures food receives stable, even heat from the moment it enters the oven — the foundation of successful baking. Skipping it causes poor rise and uneven cooking.',id:'Benar! Pemanasan awal memastikan makanan menerima panas stabil dan merata sejak masuk oven — dasar keberhasilan memanggang.',vi:'Đúng! Làm nóng lò giúp thức ăn nhận được nhiệt ổn định và đều từ lúc vào lò — nền tảng của nướng bánh thành công.'}},
   {q:{zh:'製作蛋糕時使用低筋麵粉的主要原因是？',en:'Why is low-gluten (cake) flour used for making cakes?',id:'Mengapa tepung rendah gluten digunakan untuk membuat kue?',vi:'Tại sao dùng bột mì ít gluten khi làm bánh?'},
    opts:[{zh:'低筋麵粉比較便宜',en:'Low-gluten flour is cheaper',id:'Tepung rendah gluten lebih murah',vi:'Bột ít gluten rẻ hơn',ok:false},
          {zh:'低筋麵粉蛋白質含量低，成品口感較鬆軟細緻',en:'Low protein content results in a softer, more tender crumb',id:'Kandungan protein rendah menghasilkan tekstur lebih lembut dan halus',vi:'Hàm lượng protein thấp cho kết cấu bánh mềm và mịn hơn',ok:true},
          {zh:'低筋麵粉吸水性最強，不容易失敗',en:'Low-gluten flour absorbs the most water, making it foolproof',id:'Tepung rendah gluten paling banyak menyerap air sehingga tidak mudah gagal',vi:'Bột ít gluten hấp thụ nhiều nước nhất nên không dễ thất bại',ok:false}],
    fb:{zh:'正確！低筋麵粉蛋白質（麩質）含量約8–9%，能形成較少的麵筋網絡，讓蛋糕體更鬆軟；高筋麵粉則適合製作需要嚼勁的麵包。',en:'Correct! Cake flour has ~8–9% protein (gluten), forming less gluten network for a softer, more tender cake. Bread flour with higher protein creates the chewy structure needed for bread.',id:'Benar! Tepung kue memiliki ~8–9% protein (gluten), membentuk jaringan gluten lebih sedikit untuk kue yang lebih lembut.',vi:'Đúng! Bột mì làm bánh có ~8–9% protein, tạo ít mạng gluten hơn cho bánh mềm mịn. Bột mì nhiều gluten phù hợp làm bánh mì cần độ dai.'}},
   {q:{zh:'食譜要求泡打粉（Baking Powder），其主要作用是？',en:'When a recipe calls for baking powder, its main function is?',id:'Saat resep membutuhkan baking powder, fungsi utamanya adalah?',vi:'Khi công thức yêu cầu bột nở, tác dụng chính của nó là gì?'},
    opts:[{zh:'增加甜味',en:'Add sweetness',id:'Menambah rasa manis',vi:'Thêm vị ngọt',ok:false},
          {zh:'產生二氧化碳氣泡，使成品膨脹鬆軟',en:'Generate CO₂ bubbles to make the product rise and become light',id:'Menghasilkan gelembung CO₂ agar produk mengembang dan ringan',vi:'Tạo bong bóng CO₂ làm sản phẩm nở và nhẹ xốp',ok:true},
          {zh:'防止麵糊變色',en:'Prevent the batter from discoloring',id:'Mencegah adonan berubah warna',vi:'Ngăn bột biến màu',ok:false}],
    fb:{zh:'正確！泡打粉在接觸液體與熱能時會釋放二氧化碳，形成無數小氣泡，使成品在烤箱中膨脹並產生鬆軟的組織。',en:'Correct! Baking powder releases CO₂ when it contacts liquid and heat, creating countless tiny bubbles that make the product rise in the oven and produce a light, airy texture.',id:'Benar! Baking powder melepaskan CO₂ saat bersentuhan dengan cairan dan panas, menciptakan gelembung kecil yang membuat produk mengembang di oven.',vi:'Đúng! Bột nở giải phóng CO₂ khi tiếp xúc với chất lỏng và nhiệt, tạo bong bóng nhỏ làm sản phẩm nở trong lò và có kết cấu nhẹ, xốp.'}},
   {q:{zh:'奶油「打發」（cream）的正確描述是？',en:'What best describes "creaming" butter?',id:'Apa deskripsi yang tepat untuk "mengocok" mentega?',vi:'Mo ta dung ve ky thuat danh bong bo la gi?'},
    opts:[{zh:'將奶油加熱融化後混合糖',en:'Melt butter then mix with sugar',id:'Lelehkan mentega lalu campur gula',vi:'Dun chay bo roi tron duong',ok:false},
          {zh:'將室溫軟化的奶油與糖一起攪打至蓬鬆泛白',en:'Beat softened butter with sugar until light and fluffy',id:'Kocok mentega lunak suhu ruang dengan gula hingga mengembang',vi:'Danh bo mem cung duong cho den khi bong nhe va trang',ok:true},
          {zh:'將冷藏奶油切小塊後直接使用',en:'Cut cold butter into small cubes and use directly',id:'Potong mentega dingin menjadi dadu kecil dan gunakan langsung',vi:'Cat bo lanh thanh khoi nho roi dung truc tiep',ok:false}],
    fb:{zh:'正確！打發奶油需使用室溫軟化的奶油，與糖一起攪打讓空氣進入，形成蓬鬆質地，是製作奶油蛋糕的關鍵步驟。',en:'Correct! Creaming requires softened butter at room temperature — beating it with sugar incorporates air, creating a light texture essential for butter cakes.',id:'Benar! Mengocok mentega memerlukan mentega lunak suhu ruang untuk menciptakan tekstur ringan yang penting untuk kue.',vi:'Dung! Danh bong bo can dung bo mem o nhiet do phong de khong khi vao, tao ket cau bong xop, la buoc then chot cho banh bo.'}},
   {q:{zh:'烘焙時，雞蛋的主要功能不包括下列哪項？',en:'Which is NOT a main function of eggs in baking?',id:'Fungsi utama telur dalam memanggang yang bukan termasuk berikut?',vi:'Dau KHONG phai chuc nang chinh cua trung trong nuong banh?'},
    opts:[{zh:'提供結構與凝固力',en:'Provide structure and coagulation',id:'Memberikan struktur dan koagulasi',vi:'Cung cap cau truc va kha nang dong dac',ok:false},
          {zh:'增加色澤與風味',en:'Add color and flavor',id:'Menambah warna dan rasa',vi:'Tang mau sac va huong vi',ok:false},
          {zh:'取代所有麵粉的功能',en:'Replace all the functions of flour',id:'Menggantikan semua fungsi tepung',vi:'Thay the toan bo chuc nang cua bot mi',ok:true}],
    fb:{zh:'正確！雞蛋能提供結構、乳化、色澤與風味，但無法取代麵粉形成麵筋網絡、支撐整體骨架的主要功能。',en:'Correct! Eggs provide structure, emulsification, color, and flavor, but cannot replace the main role of flour — forming gluten networks that support the overall structure.',id:'Benar! Telur memberikan struktur, emulsifikasi, warna, dan rasa, tetapi tidak dapat menggantikan peran utama tepung dalam membentuk jaringan gluten.',vi:'Dung! Trung cung cap cau truc, nhu hoa, mau sac va huong vi, nhung khong the thay the chuc nang chinh cua bot mi la tao mang gluten.'}},
   {q:{zh:'下列哪種油脂最適合製作層次分明的酥皮麵糰（如可頌）？',en:'Which fat is best for making laminated dough with distinct layers (e.g. croissants)?',id:'Lemak mana yang paling cocok untuk membuat adonan berlapis?',vi:'Loai chat beo nao phu hop nhat de lam bot nhieu lop (nhu banh sung bo)?'},
    opts:[{zh:'橄欖油',en:'Olive oil',id:'Minyak zaitun',vi:'Dau o liu',ok:false},
          {zh:'豬油',en:'Lard',id:'Lemak babi',vi:'Mo lon',ok:false},
          {zh:'片狀奶油（乾式奶油）',en:'Sheet butter (dry butter)',id:'Mentega lembaran (mentega kering)',vi:'Bo tam (bo kho)',ok:true}],
    fb:{zh:'正確！製作可頌等千層酥皮需使用含水量低、可塑性高的片狀奶油，才能在折疊時形成清晰的油脂與麵糰層次，烤後呈現蓬鬆酥脆的效果。',en:'Correct! Laminated pastry like croissants needs low-moisture, pliable sheet butter so fat layers stay distinct during folding and create flaky results after baking.',id:'Benar! Pastri berlapis seperti croissant memerlukan mentega lembaran berkadar air rendah agar lapisan lemak tetap jelas saat dilipat.',vi:'Dung! Banh nhieu lop nhu croissant can dung bo tam it nuoc de lop chat beo giu nguyen khi gap va tao ket cau xop gion sau khi nuong.'}},
   {q:{zh:'烘焙成品出爐後，應如何處理才能避免底部受潮？',en:'After baking, what should you do to prevent the bottom from getting soggy?',id:'Setelah memanggang, apa yang harus dilakukan untuk mencegah bagian bawah menjadi lembek?',vi:'Sau khi nuong xong, can lam gi de day banh khong bi am?'},
    opts:[{zh:'立刻放入密封容器保存',en:'Immediately seal in an airtight container',id:'Segera simpan dalam wadah kedap udara',vi:'Day kin ngay vao hop bao quan',ok:false},
          {zh:'移至冷卻架上散熱，讓底部蒸氣散發',en:'Transfer to a cooling rack so steam can escape from the bottom',id:'Pindahkan ke rak pendingin agar uap di bagian bawah bisa keluar',vi:'Chuyen sang gia lam nguoi de hoi nuoc thoat ra khoi day banh',ok:true},
          {zh:'繼續放在烤盤上靜置即可',en:'Leave it on the baking tray to rest',id:'Biarkan saja di atas loyang',vi:'De nguyen tren khay nuong la duoc',ok:false}],
    fb:{zh:'正確！剛出爐的烘焙品底部有殘餘蒸氣，若直接留在烤盤上會使底部變濕軟；放在鐵網冷卻架上能讓空氣從四面流通，保持酥脆。',en:'Correct! Freshly baked goods have residual steam on the bottom; leaving them on the tray traps moisture. A cooling rack allows air to circulate on all sides, keeping the crust crisp.',id:'Benar! Produk yang baru dipanggang memiliki uap sisa di bagian bawah; membiarkannya di loyang akan menjebak kelembapan. Rak pendingin memungkinkan sirkulasi udara dari semua sisi.',vi:'Dung! Banh vua ra lo co hoi nuoc con dong o day; de tren khay se giu am lam day uot. Gia lam nguoi cho khong khi luu thong bon phia, giu banh gion.'}},
   {q:{zh:'烘焙中，加入糖的功能除了甜味外還有？',en:'In baking, besides sweetness, what else does sugar provide?',id:'Dalam memanggang, selain rasa manis, apa lagi yang diberikan gula?',vi:'Trong làm bánh, ngoài vị ngọt, đường còn cung cấp gì?'},
    opts:[{zh:'只提供甜味，沒有其他功能',en:'Only sweetness, no other functions',id:'Hanya rasa manis, tidak ada fungsi lain',vi:'Chỉ vị ngọt, không có chức năng khác',ok:false},
          {zh:'幫助上色（焦糖化）、保濕、軟化麵筋，延長保存期限',en:'Aids browning (caramelization), retains moisture, softens gluten, and extends shelf life',id:'Membantu pencoklatan (karamelisasi), mempertahankan kelembapan, melunakkan gluten, dan memperpanjang umur simpan',vi:'Giúp tạo màu (caramel hóa), giữ ẩm, làm mềm gluten và kéo dài thời hạn sử dụng',ok:true},
          {zh:'增加麵筋形成量，讓成品更有嚼勁',en:'Increases gluten formation for a chewier product',id:'Meningkatkan pembentukan gluten untuk produk yang lebih kenyal',vi:'Tăng sự hình thành gluten cho sản phẩm dai hơn',ok:false}],
    fb:{zh:'正確！糖在烘焙中扮演多重角色：①焦糖化反應（150–160°C）使表面金黃上色②吸濕保濕功能讓成品維持柔軟③干擾麵筋網絡形成讓蛋糕更鬆軟④抑制微生物生長延長保存。減糖時應考慮這些功能可能受到影響。',en:'Correct! Sugar plays multiple roles in baking: ① Caramelization (150–160°C) for golden browning ② Humectant properties that keep products moist ③ Interferes with gluten formation for a softer texture ④ Inhibits microbial growth to extend shelf life. Reducing sugar affects all these functions.',id:'Benar! Gula memainkan banyak peran dalam memanggang: ① Karamelisasi untuk pencoklatan ② Mempertahankan kelembapan ③ Melunakkan gluten ④ Menghambat mikroba untuk umur simpan lebih lama.',vi:'Đúng! Đường đóng nhiều vai trò trong làm bánh: ① Caramel hóa (150–160°C) tạo màu vàng ② Giữ ẩm giúp sản phẩm mềm ③ Ức chế tạo gluten cho bánh mềm hơn ④ Ức chế vi sinh vật kéo dài hạn dùng. Giảm đường ảnh hưởng tất cả các chức năng này.'}},
   {q:{zh:'製作戚風蛋糕時，為什麼要將蛋白打發至「乾性發泡」再與蛋黃糊混合？',en:'When making chiffon cake, why must egg whites be beaten to "stiff peaks" before folding into the yolk batter?',id:'Saat membuat chiffon cake, mengapa putih telur harus dikocok hingga "puncak kaku" sebelum dicampurkan ke adonan kuning telur?',vi:'Khi làm bánh chiffon, tại sao phải đánh lòng trắng trứng đến "đỉnh cứng" trước khi trộn vào bột lòng đỏ?'},
    opts:[{zh:'乾性發泡的蛋白霜更容易與蛋黃糊混合均勻',en:'Stiff-peak meringue mixes more easily with the yolk batter',id:'Meringue puncak kaku lebih mudah dicampurkan dengan adonan kuning telur',vi:'Meringue đỉnh cứng dễ trộn đều với bột lòng đỏ hơn',ok:false},
          {zh:'乾性發泡含有最大量的空氣，可支撐蛋糕在烤箱中膨脹且不易消泡',en:'Stiff peaks contain maximum air, supporting the cake\'s rise in the oven while being stable enough to resist deflating',id:'Puncak kaku mengandung udara maksimum, mendukung pengembangan kue di oven sambil cukup stabil untuk tidak kempes',vi:'Đỉnh cứng chứa lượng không khí tối đa, hỗ trợ bánh nở trong lò trong khi đủ ổn định để không xẹp',ok:true},
          {zh:'只要蛋白打發即可，無需刻意打到乾性發泡',en:'Any level of whipping is fine — no need for stiff peaks specifically',id:'Tingkat kocok apa pun oke — tidak perlu puncak kaku secara khusus',vi:'Bất kỳ mức độ đánh nào cũng ổn — không cần đỉnh cứng cụ thể',ok:false}],
    fb:{zh:'正確！乾性發泡（stiff peaks）的蛋白霜氣室最為穩定，混入蛋黃糊後不易消泡，能提供足夠的支撐力讓蛋糕在高溫烤箱中持續膨脹，形成輕盈細緻的蛋糕體。未打到乾性發泡則氣泡不穩定，烘焙後蛋糕容易回縮塌陷。',en:'Correct! Stiff-peak meringue has the most stable air cells, resisting deflation when folded into the yolk batter. It provides enough support for the cake to keep rising in the hot oven, creating a light, fine crumb. Under-whipped meringue produces unstable bubbles that cause the cake to sink after baking.',id:'Benar! Meringue puncak kaku memiliki sel udara paling stabil, tahan terhadap kempes saat dilipat ke adonan. Ini memberikan dukungan cukup untuk kue terus mengembang.',vi:'Đúng! Meringue đỉnh cứng có tế bào khí ổn định nhất, chống xẹp khi trộn vào bột. Nó cung cấp đủ sức chịu đựng để bánh tiếp tục nở trong lò nóng, tạo kết cấu nhẹ và mịn.'}}
  ],
  /* Lv14 節慶料理與宴客技巧 */
  [
   {q:{zh:'宴客時，規劃菜色最重要的原則是？',en:'When hosting a dinner party, the most important principle for menu planning is?',id:'Saat menjamu tamu, prinsip terpenting perencanaan menu adalah?',vi:'Khi chiêu đãi khách, nguyên tắc quan trọng nhất để lên thực đơn là gì?'},
    opts:[{zh:'所有菜色都需要現炒現做，不可提前準備',en:'All dishes must be cooked fresh on the spot, no advance prep allowed',id:'Semua hidangan harus dimasak saat itu juga, tidak boleh disiapkan lebih awal',vi:'Tất cả món phải nấu tươi tại chỗ, không được chuẩn bị trước',ok:false},
          {zh:'菜色冷熱搭配，部分可提前備好，減少上菜前的手忙腳亂',en:'Mix hot and cold dishes; prep some in advance to avoid last-minute chaos',id:'Padukan hidangan panas-dingin; siapkan sebagian lebih awal untuk menghindari kepanikan',vi:'Kết hợp món nóng lạnh; chuẩn bị trước một số món để tránh lộn xộn phút chót',ok:true},
          {zh:'只準備一道主菜即可，避免過於複雜',en:'Prepare only one main dish to avoid complexity',id:'Siapkan hanya satu hidangan utama untuk menghindari kerumitan',vi:'Chỉ chuẩn bị một món chính để tránh phức tạp',ok:false}],
    fb:{zh:'正確！成功的宴客菜單應包含冷盤（可提前做）、熱炒（現做）與主食，這樣分工安排能讓廚師在上菜前從容不迫，也能保證每道菜的品質。',en:'Correct! A successful party menu should include cold dishes (make ahead), hot stir-fries (cook to order), and a main. This split approach lets the cook stay calm before service and maintains quality.',id:'Benar! Menu pesta yang sukses harus mencakup hidangan dingin (buat lebih awal), tumisan panas (masak saat itu), dan makanan utama.',vi:'Đúng! Thực đơn tiệc thành công nên có món nguội (làm trước), món xào nóng (nấu tại chỗ) và món chính.'}},
   {q:{zh:'宴客前一天最應該完成哪些準備工作？',en:'What preparation work should ideally be completed the day before a dinner party?',id:'Pekerjaan persiapan apa yang idealnya diselesaikan sehari sebelum pesta makan malam?',vi:'Công việc chuẩn bị nào nên hoàn thành một ngày trước buổi tiệc?'},
    opts:[{zh:'所有菜色全部烹調完成，隔天加熱即可',en:'Cook all dishes completely, just reheat the next day',id:'Masak semua hidangan sepenuhnya, tinggal dipanaskan keesokan harinya',vi:'Nấu chín tất cả món, hôm sau chỉ hâm nóng lại',ok:false},
          {zh:'完成醃漬備料、切配食材、製作醬汁與可提前做的冷盤',en:'Complete marinating, cutting/prepping ingredients, making sauces, and any make-ahead cold dishes',id:'Selesaikan marinasi, memotong/mempersiapkan bahan, membuat saus, dan hidangan dingin yang bisa dibuat lebih awal',vi:'Hoàn thành ướp gia vị, cắt/sơ chế nguyên liệu, làm nước sốt và các món nguội làm trước được',ok:true},
          {zh:'等當天再做所有準備，才能確保最新鮮',en:'Do all preparation on the day for maximum freshness',id:'Lakukan semua persiapan di hari H untuk kesegaran maksimal',vi:'Làm tất cả vào ngày tiệc để đảm bảo tươi nhất',ok:false}],
    fb:{zh:'正確！提前完成醃漬、切配與醬汁製作，不僅讓食材更入味，也能讓宴客當天只需專注在烹調，大幅降低時間壓力與出錯機率。',en:'Correct! Completing marinating, prepping, and sauce-making the day before not only deepens flavors but also lets you focus solely on cooking on the day, dramatically reducing time pressure and mistakes.',id:'Benar! Menyelesaikan marinasi, persiapan, dan pembuatan saus sehari sebelumnya tidak hanya memperdalam rasa tetapi juga memungkinkan Anda fokus hanya pada memasak di hari H.',vi:'Đúng! Hoàn thành ướp, sơ chế và làm nước sốt từ hôm trước không chỉ giúp gia vị ngấm hơn mà còn cho phép bạn chỉ tập trung nấu vào ngày tiệc.'}},
   {q:{zh:'節慶宴客最後一道菜「甜點」的主要作用是？',en:'What is the main role of \"dessert\" as the final course at a festive dinner?',id:'Apa peran utama \"dessert\" sebagai hidangan terakhir di pesta perayaan?',vi:'Vai trò chính của \"tráng miệng\" trong bữa tiệc lễ hội là gì?'},
    opts:[{zh:'甜點只是額外選項，沒有功能性意義',en:'Dessert is just an optional extra with no functional significance',id:'Dessert hanyalah pilihan tambahan tanpa makna fungsional',vi:'Tráng miệng chỉ là món thêm tùy chọn, không có ý nghĩa chức năng',ok:false},
          {zh:'作為餐宴句點，帶給賓客愉悅的收尾感受，並象徵對賓客的心意',en:'A sweet finish that leaves guests with a pleasant final impression, symbolizing care and warmth',id:'Penutup manis yang memberi kesan akhir yang menyenangkan, melambangkan perhatian kepada tamu',vi:'Kết thúc ngọt ngào tạo ấn tượng cuối tốt cho khách, tượng trưng cho sự quan tâm',ok:true},
          {zh:'補充正餐不足的熱量',en:'Make up for any calories lacking from the main meal',id:'Menambah kalori yang kurang dari makanan utama',vi:'Bổ sung calo còn thiếu từ bữa chính',ok:false}],
    fb:{zh:'正確！甜點是宴席的收尾，能在賓客心中留下美好的最後印象。在文化上，節慶甜點也象徵主人對賓客的心意與祝福，是整場宴會評價的重要一環。',en:'Correct! Dessert closes the meal on a high note, leaving guests with a lasting positive impression. Culturally, festive sweets also symbolize the host\'s care and well-wishes — a key part of the overall reception.',id:'Benar! Dessert menutup hidangan dengan nada tinggi, meninggalkan kesan positif yang bertahan. Secara budaya, manisan perayaan juga melambangkan perhatian dan harapan baik dari tuan rumah.',vi:'Đúng! Tráng miệng kết thúc bữa ăn ở đỉnh cao, để lại ấn tượng tốt lâu dài cho khách. Về văn hóa, đồ ngọt lễ hội tượng trưng cho sự quan tâm và chúc phúc của chủ nhà.'}},
   {q:{zh:'宴客時，哪種擺盤技巧最能提升菜餚的視覺吸引力？',en:'Which plating technique best enhances the visual appeal of a dish at a banquet?',id:'Teknik plating mana yang paling meningkatkan daya tarik visual hidangan dalam jamuan?',vi:'Kỹ thuật trình bày nào giúp tăng sức hấp dẫn thị giác của món ăn trong tiệc?'},
    opts:[{zh:'將所有食材堆成一大堆放在盤中央',en:'Pile all ingredients into a large mound at the center',id:'Tumpuk semua bahan dalam tumpukan besar di tengah piring',vi:'Chất tất cả nguyên liệu thành đống lớn ở giữa đĩa',ok:false},
          {zh:'善用留白、色彩對比與醬汁點綴，讓食材有層次感',en:'Use negative space, color contrast, and sauce accents to create layered visual depth',id:'Gunakan ruang kosong, kontras warna, dan hiasan saus untuk menciptakan kedalaman visual berlapis',vi:'Dùng khoảng trống, tương phản màu sắc và điểm xốt để tạo chiều sâu thị giác có lớp lang',ok:true},
          {zh:'盡量把食材壓扁以節省空間',en:'Flatten ingredients as much as possible to save space',id:'Ratakan bahan sebanyak mungkin untuk menghemat ruang',vi:'Dàn phẳng nguyên liệu để tiết kiệm diện tích',ok:false}],
    fb:{zh:'正確！專業擺盤講究「留白」（給視線休息的空間）、色彩搭配與高低層次，讓整道菜在視覺上如同一件藝術品，提升賓客的用餐期待感。',en:'Correct! Professional plating emphasizes negative space, color harmony, and height variation — making the dish look like a work of art and heightening guests appreciation.',id:'Benar! Plating profesional menekankan ruang kosong, harmoni warna, dan variasi ketinggian — membuat hidangan tampak seperti karya seni.',vi:'Đúng! Trình bày chuyên nghiệp chú trọng khoảng trống, hài hòa màu sắc và chiều cao — khiến món ăn như một tác phẩm nghệ thuật và tăng sự hồi hộp cho khách.'}},
   {q:{zh:'宴客菜單設計時，下列哪項原則最重要？',en:'When designing a banquet menu, which principle is most important?',id:'Saat merancang menu jamuan, prinsip mana yang paling penting?',vi:'Khi thiết kế thực đơn tiệc, nguyên tắc nào quan trọng nhất?'},
    opts:[{zh:'所有菜色都使用同一種主要食材以節省成本',en:'Use the same main ingredient for all dishes to save cost',id:'Gunakan bahan utama yang sama untuk semua hidangan agar hemat biaya',vi:'Dùng cùng một nguyên liệu chính cho tất cả món để tiết kiệm chi phí',ok:false},
          {zh:'考量烹調方法多樣性、食材搭配均衡與賓客飲食限制',en:'Consider cooking method variety, ingredient balance, and guests dietary restrictions',id:'Pertimbangkan variasi metode memasak, keseimbangan bahan, dan pantangan diet tamu',vi:'Cân nhắc sự đa dạng phương pháp nấu, cân bằng nguyên liệu và hạn chế ăn uống của khách',ok:true},
          {zh:'只選擇最昂貴的食材以顯示誠意',en:'Choose only the most expensive ingredients to show sincerity',id:'Pilih hanya bahan paling mahal untuk menunjukkan ketulusan',vi:'Chỉ chọn nguyên liệu đắt nhất để thể hiện sự thành tâm',ok:false}],
    fb:{zh:'正確！優秀的宴客菜單需兼顧煎炒蒸燉等多元烹調手法、葷素搭配均衡，並事先了解賓客的飲食禁忌（如過敏、宗教限制），才能讓所有人賓至如歸。',en:'Correct! A great banquet menu balances diverse cooking methods, protein-vegetable harmony, and awareness of guests dietary needs so everyone feels welcome.',id:'Benar! Menu jamuan yang baik menyeimbangkan metode memasak yang beragam, harmoni protein-sayuran, dan kesadaran akan kebutuhan diet tamu.',vi:'Đúng! Thực đơn tiệc tốt cân bằng phương pháp nấu đa dạng, hài hòa thịt-rau, và nắm rõ nhu cầu ăn uống của khách để mọi người đều cảm thấy được chào đón.'}},
   {q:{zh:'宴客當天，哪類料理最適合「預先完全做好」以減少當場壓力？',en:'On the day of the banquet, which type of dish is best to fully prepare in advance?',id:'Pada hari jamuan, jenis hidangan mana yang paling baik disiapkan sepenuhnya di muka?',vi:'Ngày tiệc, loại món nào phù hợp nhất để chuẩn bị hoàn toàn trước nhằm giảm áp lực?'},
    opts:[{zh:'需現炒、現炸的熱菜',en:'Stir-fried or deep-fried hot dishes',id:'Hidangan panas yang perlu ditumis atau digoreng saat itu',vi:'Món nóng cần xào hoặc chiên ngay lúc đó',ok:false},
          {zh:'涼拌菜、醬汁與甜點',en:'Cold salads, sauces, and desserts',id:'Salad dingin, saus, dan makanan penutup',vi:'Salad nguội, nước sốt và tráng miệng',ok:true},
          {zh:'所有菜色都應在當天現做',en:'All dishes should be cooked fresh on the day',id:'Semua hidangan harus dibuat segar pada hari itu',vi:'Tất cả món đều nên làm mới vào ngày tiệc',ok:false}],
    fb:{zh:'正確！涼拌菜、各式醬汁與甜點通常可提前一天製作，且放置後風味更佳；留下熱炒與需要現做的菜色在宴客當天處理，才是時間管理的聰明策略。',en:'Correct! Cold salads, sauces, and desserts can often be made a day ahead and often taste better rested. Reserving stir-fries for the day itself is smart time management.',id:'Benar! Salad dingin, saus, dan makanan penutup sering dapat dibuat sehari sebelumnya dan biasanya lebih enak setelah didiamkan.',vi:'Đúng! Salad nguội, nước sốt và tráng miệng thường làm được trước một ngày và thường ngon hơn sau khi để. Để lại món xào cho ngày tiệc là quản lý thời gian thông minh.'}},
   {q:{zh:'節慶宴席上菜順序的傳統原則為何？',en:'What is the traditional order of courses at a festive Chinese banquet?',id:'Apa urutan hidangan tradisional dalam perjamuan meriah Tionghoa?',vi:'Thứ tự phục vụ món truyền thống trong tiệc lễ Trung Hoa là gì?'},
    opts:[{zh:'先上甜點，最後上湯品',en:'Serve dessert first, soup last',id:'Sajikan makanan penutup lebih dulu, sup terakhir',vi:'Phục vụ tráng miệng trước, súp sau cùng',ok:false},
          {zh:'冷盤→熱炒→主菜→湯品→主食→甜點',en:'Cold plates → stir-fries → main dishes → soup → staple → dessert',id:'Hidangan dingin → tumisan → hidangan utama → sup → makanan pokok → makanan penutup',vi:'Đĩa nguội → xào → món chính → súp → tinh bột → tráng miệng',ok:true},
          {zh:'所有菜色同時上桌',en:'Serve all dishes at the same time',id:'Sajikan semua hidangan sekaligus',vi:'Dọn tất cả món cùng lúc',ok:false}],
    fb:{zh:'正確！中式宴席傳統順序為冷盤→熱炒→主菜（魚、肉）→湯品→主食（飯麵）→甜點，節奏感讓賓客能逐步品嚐每道菜，保持期待與專注。',en:'Correct! Traditional Chinese banquet order: cold plates → stir-fries → main dishes (fish, meat) → soup → staple (rice/noodles) → dessert. This pacing lets guests savor each course.',id:'Benar! Urutan jamuan Tionghoa tradisional: hidangan dingin → tumisan → hidangan utama → sup → makanan pokok → makanan penutup.',vi:'Đúng! Thứ tự tiệc Trung Hoa truyền thống: đĩa nguội → xào → món chính → súp → tinh bột → tráng miệng. Nhịp này giúp khách thưởng thức từng món một.'}},
   {q:{zh:'製作節慶甜點（如年糕、湯圓）時，使用糯米粉的特性是？',en:'When making festive desserts (e.g., nian gao, tangyuan), what is the characteristic of glutinous rice flour?',id:'Saat membuat kue perayaan (seperti nian gao, tangyuan), apa karakteristik tepung beras ketan?',vi:'Khi làm bánh lễ hội (như bánh nếp, bánh trôi), đặc tính của bột gạo nếp là gì?'},
    opts:[{zh:'完全無黏性，適合做鬆軟的蛋糕',en:'Completely non-sticky, good for making fluffy cakes',id:'Sama sekali tidak lengket, cocok untuk membuat kue yang lembut',vi:'Hoàn toàn không dính, thích hợp làm bánh xốp',ok:false},
          {zh:'含有高量支鏈澱粉，遇熱後具有高黏性與Q彈口感',en:'High in amylopectin, becomes highly sticky and chewy when heated',id:'Tinggi amilopektin, menjadi sangat lengket dan kenyal saat dipanaskan',vi:'Giàu amylopectin, trở nên rất dính và dai khi đun nóng',ok:true},
          {zh:'吸水性最差，需要大量水才能成糰',en:'Very low water absorption — needs a lot of water to form dough',id:'Daya serap air sangat rendah — membutuhkan banyak air untuk membentuk adonan',vi:'Khả năng hút nước rất thấp, cần nhiều nước để tạo thành bột',ok:false}],
    fb:{zh:'正確！糯米粉含有約98%的支鏈澱粉（Amylopectin），加熱糊化後黏性極高，形成Q彈有嚼勁的口感，是湯圓、年糕、麻糬等傳統節慶食品的基礎食材。',en:'Correct! Glutinous rice flour contains ~98% amylopectin; after gelatinization it becomes extremely sticky and forms the chewy texture characteristic of tangyuan, nian gao, and mochi.',id:'Benar! Tepung beras ketan mengandung ~98% amilopektin; setelah gelatinasi menjadi sangat lengket dan membentuk tekstur kenyal khas dari tangyuan, nian gao, dan mochi.',vi:'Đúng! Bột gạo nếp chứa ~98% amylopectin; sau khi gelatin hóa trở nên rất dính và tạo kết cấu dai đặc trưng của bánh trôi, bánh nếp và mochi.'}},
   {q:{zh:'宴客時食物保溫的安全溫度下限是多少？',en:'What is the minimum safe holding temperature for food at a banquet?',id:'Berapa suhu penyimpanan aman minimum untuk makanan saat perjamuan?',vi:'Nhiệt độ giữ ấm an toàn tối thiểu cho thức ăn trong tiệc là bao nhiêu?'},
    opts:[{zh:'40°C以上即可',en:'Above 40°C is sufficient',id:'Di atas 40°C sudah cukup',vi:'Trên 40°C là đủ',ok:false},
          {zh:'60°C以上，防止危險溫度帶（5–60°C）中細菌滋生',en:'Above 60°C, to stay above the danger zone (5–60°C) where bacteria multiply',id:'Di atas 60°C, untuk tetap di atas zona bahaya (5–60°C) tempat bakteri berkembang biak',vi:'Trên 60°C, để ở trên vùng nguy hiểm (5–60°C) nơi vi khuẩn sinh sôi',ok:true},
          {zh:'30°C以上就安全了',en:'Above 30°C is safe',id:'Di atas 30°C aman',vi:'Trên 30°C là an toàn',ok:false}],
    fb:{zh:'正確！宴客時熱食應保持在60°C以上，以避開5–60°C的細菌繁殖危險溫度帶。若食物在此溫度帶停留超過2小時，細菌可能大量增殖至危險程度，導致食物中毒風險大增。',en:'Correct! Hot food at banquets should be kept above 60°C to avoid the 5–60°C bacterial growth danger zone. If food stays in this zone for over 2 hours, bacteria can multiply to dangerous levels, greatly increasing the food poisoning risk.',id:'Benar! Makanan panas dalam jamuan harus dijaga di atas 60°C untuk menghindari zona bahaya 5–60°C tempat bakteri berkembang biak. Jika makanan berada di zona ini lebih dari 2 jam, bakteri bisa berkembang ke tingkat berbahaya.',vi:'Đúng! Thức ăn nóng trong tiệc phải giữ trên 60°C để tránh vùng nguy hiểm 5–60°C nơi vi khuẩn sinh sôi. Nếu thức ăn ở vùng này hơn 2 giờ, vi khuẩn có thể tăng đến mức nguy hiểm, tăng nguy cơ ngộ độc thực phẩm.'}}
  ],
  /* Lv15 HACCP食品安全管理 */
  [
   {q:{zh:'HACCP的全稱是什麼？',en:'What does HACCP stand for?',id:'Apa kepanjangan dari HACCP?',vi:'HACCP là viết tắt của gì?'},
    opts:[{zh:'危害分析重要管制點',en:'Hazard Analysis and Critical Control Points',id:'Analisis Bahaya dan Titik Kendali Kritis',vi:'Phân tích mối nguy và điểm kiểm soát tới hạn',ok:true},
          {zh:'高溫自動烹調控制系統',en:'High-temperature Automatic Cooking Control System',id:'Sistem Kontrol Memasak Otomatis Suhu Tinggi',vi:'Hệ thống kiểm soát nấu ăn tự động nhiệt độ cao',ok:false},
          {zh:'健康評估與認證程序',en:'Health Assessment and Certification Procedure',id:'Prosedur Penilaian dan Sertifikasi Kesehatan',vi:'Quy trình đánh giá và chứng nhận sức khỏe',ok:false}],
    fb:{zh:'正確！HACCP（危害分析重要管制點）是一套系統性的食品安全管理方法，透過識別、評估與控制食品生產過程中的潛在危害，確保食品安全。',en:'Correct! HACCP (Hazard Analysis and Critical Control Points) is a systematic food safety management approach that identifies, evaluates, and controls potential hazards throughout food production.',id:'Benar! HACCP adalah pendekatan manajemen keamanan pangan sistematis yang mengidentifikasi, mengevaluasi, dan mengendalikan potensi bahaya dalam produksi pangan.',vi:'Đúng! HACCP là phương pháp quản lý an toàn thực phẩm có hệ thống, nhận diện, đánh giá và kiểm soát các mối nguy tiềm ẩn trong quá trình sản xuất thực phẩm.'}},
   {q:{zh:'食品安全中的「危害」包含哪三大類？',en:'Which three categories do food safety hazards include?',id:'Apa tiga kategori bahaya keamanan pangan?',vi:'Ba loại mối nguy an toàn thực phẩm bao gồm những gì?'},
    opts:[{zh:'生物性、化學性、物理性',en:'Biological, Chemical, Physical',id:'Biologis, Kimia, Fisik',vi:'Sinh học, hóa học, vật lý',ok:true},
          {zh:'溫度性、濕度性、時間性',en:'Temperature, Humidity, Time',id:'Suhu, Kelembapan, Waktu',vi:'Nhiệt độ, độ ẩm, thời gian',ok:false},
          {zh:'細菌性、黴菌性、病毒性',en:'Bacterial, Mold, Viral',id:'Bakteri, Jamur, Virus',vi:'Vi khuẩn, nấm mốc, vi rút',ok:false}],
    fb:{zh:'正確！食品危害三大類：生物性（細菌、病毒、寄生蟲）、化學性（農藥、添加劑）、物理性（碎骨、金屬異物）。全面掌握這三類才能有效防控。',en:'Correct! Three food hazard categories: biological (bacteria, viruses, parasites), chemical (pesticides, additives), and physical (bone fragments, metal). Understanding all three is key to prevention.',id:'Benar! Tiga kategori bahaya pangan: biologis (bakteri, virus, parasit), kimia (pestisida, aditif), dan fisik (pecahan tulang, logam). Memahami ketiganya penting untuk pencegahan.',vi:'Đúng! Ba loại mối nguy: sinh học (vi khuẩn, vi-rút, ký sinh trùng), hóa học (thuốc trừ sâu, phụ gia), vật lý (mảnh xương, kim loại). Hiểu rõ cả ba loại là then chốt để phòng ngừa.'}},
   {q:{zh:'防止食品交叉污染最基本的措施是？',en:'What is the most basic measure to prevent cross-contamination?',id:'Apa tindakan paling mendasar untuk mencegah kontaminasi silang?',vi:'Biện pháp cơ bản nhất để ngăn ngừa ô nhiễm chéo là gì?'},
    opts:[{zh:'生食與熟食使用不同顏色砧板與刀具分開處理',en:'Use different colored cutting boards and knives for raw and cooked foods',id:'Gunakan talenan dan pisau berbeda warna untuk makanan mentah dan matang',vi:'Dùng thớt và dao khác màu cho thực phẩm sống và chín',ok:true},
          {zh:'所有食材統一使用同一把刀處理以節省時間',en:'Use one knife for all ingredients to save time',id:'Gunakan satu pisau untuk semua bahan untuk menghemat waktu',vi:'Dùng một con dao cho tất cả nguyên liệu để tiết kiệm thời gian',ok:false},
          {zh:'每隔兩小時清洗一次砧板即可',en:'Clean the cutting board every two hours',id:'Bersihkan talenan setiap dua jam',vi:'Rửa thớt mỗi hai giờ là đủ',ok:false}],
    fb:{zh:'正確！交叉污染是食品安全最常見的危害。生食（尤其是肉類）含有病原菌，必須與熟食、蔬果完全分開，使用不同顏色砧板與刀具是最直觀的防控方法。',en:'Correct! Cross-contamination is one of the most common food safety hazards. Raw foods (especially meat) carry pathogens and must be kept separate from cooked foods using color-coded equipment.',id:'Benar! Kontaminasi silang adalah bahaya keamanan pangan yang paling umum. Makanan mentah (terutama daging) mengandung patogen dan harus dipisahkan dari makanan matang.',vi:'Đúng! Ô nhiễm chéo là mối nguy an toàn thực phẩm phổ biến nhất. Thực phẩm sống (nhất là thịt) chứa mầm bệnh và phải tách riêng khỏi thực phẩm chín bằng dụng cụ phân màu.'}},
   {q:{zh:'冷鏈管理中，冷藏食品的安全運輸溫度應維持在？',en:'In cold chain management, what temperature should refrigerated food be maintained during transport?',id:'Dalam manajemen rantai dingin, suhu berapa yang harus dipertahankan untuk makanan yang didinginkan?',vi:'Trong quản lý chuỗi lạnh, nhiệt độ vận chuyển thực phẩm lạnh cần duy trì là bao nhiêu?'},
    opts:[{zh:'0°C以下',en:'Below 0°C',id:'Di bawah 0°C',vi:'Dưới 0°C',ok:false},
          {zh:'7°C以下（最佳4°C以下）',en:'Below 7°C (ideally below 4°C)',id:'Di bawah 7°C (idealnya di bawah 4°C)',vi:'Dưới 7°C (lý tưởng là dưới 4°C)',ok:true},
          {zh:'15°C以下',en:'Below 15°C',id:'Di bawah 15°C',vi:'Dưới 15°C',ok:false}],
    fb:{zh:'正確！冷藏食品在整個供應鏈中應維持在7°C以下，最佳溫度為4°C以下。一旦溫度超標，致病菌便會快速繁殖，稱為「冷鏈斷鏈」，是食安事故的重要原因。',en:'Correct! Refrigerated food should be maintained below 7°C throughout the supply chain, ideally below 4°C. Any temperature breach allows pathogens to multiply rapidly — called a "cold chain break".',id:'Benar! Makanan yang didinginkan harus dipertahankan di bawah 7°C sepanjang rantai pasokan, idealnya di bawah 4°C. Pelanggaran suhu memungkinkan patogen berkembang biak dengan cepat.',vi:'Đúng! Thực phẩm lạnh phải duy trì dưới 7°C trong toàn bộ chuỗi cung ứng, lý tưởng là dưới 4°C. Vi phạm nhiệt độ khiến mầm bệnh nhân lên nhanh chóng — gọi là tình trạng đứt chuỗi lạnh.'}},
   {q:{zh:'FIFO原則是指？',en:'What does the FIFO principle mean?',id:'Apa yang dimaksud dengan prinsip FIFO?',vi:'Nguyên tắc FIFO có nghĩa là gì?'},
    opts:[{zh:'先進先出：先到的食材先使用，避免過期',en:'First In First Out: use older stock first to prevent expiry',id:'Masuk pertama keluar pertama: gunakan stok lama terlebih dahulu untuk mencegah kadaluarsa',vi:'Nhập trước xuất trước: dùng hàng cũ trước để tránh hết hạn',ok:true},
          {zh:'快速冷凍原則：食材需在最短時間內冷凍',en:'Fast freeze: freeze ingredients as quickly as possible',id:'Pembekuan cepat: bekukan bahan secepat mungkin',vi:'Đông lạnh nhanh: đông lạnh nguyên liệu càng nhanh càng tốt',ok:false},
          {zh:'食品安全認證：通過認證的食品才可使用',en:'Food safety certification: only certified foods may be used',id:'Sertifikasi keamanan pangan: hanya makanan bersertifikat yang boleh digunakan',vi:'Chứng nhận an toàn thực phẩm: chỉ dùng thực phẩm được chứng nhận',ok:false}],
    fb:{zh:'正確！FIFO（先進先出）是庫存管理的黃金法則：新購入的食材放在後面，舊的放在前面先取用。正確執行FIFO能有效減少食材過期浪費，並降低食用過期食品的風險。',en:'Correct! FIFO (First In First Out) is the golden rule of inventory management: place new stock at the back and use older stock first. Proper FIFO reduces waste and minimizes the risk of using expired food.',id:'Benar! FIFO adalah aturan emas manajemen inventaris: taruh stok baru di belakang dan gunakan stok lama terlebih dahulu. FIFO yang tepat mengurangi pemborosan dan meminimalkan risiko menggunakan makanan kadaluarsa.',vi:'Đúng! FIFO là quy tắc vàng của quản lý hàng tồn: đặt hàng mới vào phía sau, dùng hàng cũ trước. Thực hiện FIFO đúng cách giúp giảm lãng phí và giảm rủi ro sử dụng thực phẩm hết hạn.'}},
   {q:{zh:'食品追溯系統的主要目的是？',en:'What is the main purpose of a food traceability system?',id:'Apa tujuan utama sistem keterlacakan pangan?',vi:'Mục đích chính của hệ thống truy xuất nguồn gốc thực phẩm là gì?'},
    opts:[{zh:'加快食品的烹調速度',en:'Speed up food cooking time',id:'Mempercepat waktu memasak',vi:'Tăng tốc độ nấu ăn',ok:false},
          {zh:'能夠追蹤食品從產地到餐桌的完整流向，發生問題時迅速召回',en:'Track food from farm to table and enable rapid recall when problems occur',id:'Melacak makanan dari ladang ke meja dan memungkinkan penarikan cepat saat terjadi masalah',vi:'Truy vết thực phẩm từ nơi sản xuất đến bàn ăn và thu hồi nhanh khi có vấn đề',ok:true},
          {zh:'減少食材採購的成本支出',en:'Reduce food procurement costs',id:'Mengurangi biaya pengadaan pangan',vi:'Giảm chi phí mua nguyên liệu',ok:false}],
    fb:{zh:'正確！食品追溯系統能記錄食品在供應鏈中每個環節的資訊（產地、加工廠、運輸、銷售），一旦發生食安事故，能迅速鎖定問題批次並執行召回，保護消費者安全。',en:'Correct! A food traceability system records information at every supply chain stage (origin, processing, transport, sale). When a food safety incident occurs, it enables rapid identification and recall of affected batches.',id:'Benar! Sistem keterlacakan pangan mencatat informasi di setiap tahap rantai pasokan. Ketika insiden keamanan pangan terjadi, sistem ini memungkinkan identifikasi cepat dan penarikan batch yang terpengaruh.',vi:'Đúng! Hệ thống truy xuất nguồn gốc ghi lại thông tin ở mỗi giai đoạn của chuỗi cung ứng (nơi sản xuất, nhà máy chế biến, vận chuyển, bán hàng). Khi xảy ra sự cố an toàn thực phẩm, hệ thống cho phép xác định nhanh và thu hồi lô hàng bị ảnh hưởng, bảo vệ người tiêu dùng.'}},
   {q:{zh:'廚房溫度計應如何校正？',en:'How should a kitchen thermometer be calibrated?',id:'Bagaimana cara mengkalibrasi termometer dapur?',vi:'Nên chuẩn chỉnh nhiệt kế bếp như thế nào?'},
    opts:[{zh:'每年送廠商維修一次',en:'Send to the manufacturer for repair once a year',id:'Kirimkan ke produsen untuk diperbaiki setahun sekali',vi:'Gửi nhà sản xuất sửa một năm một lần',ok:false},
          {zh:'放入冰水混合物中應顯示0°C，放入沸水應顯示100°C（依海拔調整）',en:'Should read 0°C in ice water and 100°C in boiling water (adjusted for altitude)',id:'Harus menunjukkan 0°C di air es dan 100°C di air mendidih (disesuaikan dengan ketinggian)',vi:'Phải hiện 0°C trong nước đá và 100°C trong nước sôi (điều chỉnh theo độ cao)',ok:true},
          {zh:'只要外觀無損壞即視為正常',en:'As long as it looks undamaged it is considered accurate',id:'Selama tampilannya tidak rusak dianggap akurat',vi:'Miễn là bên ngoài không hư là coi như chính xác',ok:false}],
    fb:{zh:'正確！廚房溫度計的標準校正法：冰水法（冰水混合物應顯示0°C）或沸水法（沸水應顯示100°C，高海拔需修正）。定期校正確保溫度讀數準確，是HACCP管制的基礎。',en:'Correct! Standard thermometer calibration: ice water method (should read 0°C) or boiling water method (should read 100°C, adjusted for altitude). Regular calibration ensures accurate readings — a HACCP foundation.',id:'Benar! Kalibrasi termometer standar: metode air es (harus menunjukkan 0°C) atau metode air mendidih (harus menunjukkan 100°C, disesuaikan dengan ketinggian). Kalibrasi rutin memastikan pembacaan yang akurat.',vi:'Đúng! Cách chuẩn chỉnh nhiệt kế tiêu chuẩn: phương pháp nước đá (phải hiện 0°C) hoặc phương pháp nước sôi (phải hiện 100°C, điều chỉnh theo độ cao). Chuẩn chỉnh định kỳ đảm bảo độ chính xác — là nền tảng của HACCP.'}},
   {q:{zh:'在HACCP管制中，「關鍵管制點（CCP）」的定義是？',en:'In HACCP management, what is a "Critical Control Point (CCP)"?',id:'Dalam manajemen HACCP, apa definisi "Titik Kendali Kritis (CCP)"?',vi:'Trong quản lý HACCP, "Điểm kiểm soát tới hạn (CCP)" được định nghĩa như thế nào?'},
    opts:[{zh:'任何食品處理的操作步驟',en:'Any food handling operation step',id:'Setiap langkah operasi penanganan pangan',vi:'Bất kỳ bước xử lý thực phẩm nào',ok:false},
          {zh:'可以施加控制措施，防止或消除食品安全危害的特定步驟',en:'A specific step where control can be applied to prevent, eliminate, or reduce a food safety hazard',id:'Langkah spesifik di mana kontrol dapat diterapkan untuk mencegah, menghilangkan, atau mengurangi bahaya keamanan pangan',vi:'Bước cụ thể có thể áp dụng biện pháp kiểm soát để ngăn ngừa, loại bỏ hoặc giảm thiểu mối nguy an toàn thực phẩm',ok:true},
          {zh:'每次出廠前的最終品質檢查',en:'Final quality check before each shipment',id:'Pemeriksaan kualitas akhir sebelum setiap pengiriman',vi:'Kiểm tra chất lượng cuối cùng trước mỗi lô hàng',ok:false}],
    fb:{zh:'正確！關鍵管制點（CCP）是食品安全管理的核心概念。在食品生產流程中，CCP是能有效預防、消除或降低危害的特定步驟，如加熱殺菌（溫度管制）、冷鏈維護等。每個CCP需要設定關鍵限值與監控程序。',en:'Correct! CCP is the core concept of HACCP. In food production, a CCP is a specific step where hazards can be effectively prevented, eliminated, or reduced — e.g., heat treatment (temperature control), cold chain maintenance. Each CCP requires critical limits and monitoring procedures.',id:'Benar! CCP adalah konsep inti HACCP. Dalam produksi pangan, CCP adalah langkah spesifik di mana bahaya dapat dicegah, dihilangkan, atau dikurangi secara efektif.',vi:'Đúng! CCP là khái niệm cốt lõi của HACCP. Trong sản xuất thực phẩm, CCP là bước cụ thể có thể ngăn ngừa, loại bỏ hoặc giảm mối nguy một cách hiệu quả — như xử lý nhiệt, duy trì chuỗi lạnh. Mỗi CCP cần giới hạn tới hạn và quy trình giám sát.'}},
   {q:{zh:'食品業的「交叉污染」最常見的發生場景是？',en:'In food service, what is the most common scenario for cross-contamination?',id:'Dalam bisnis pangan, apa skenario paling umum untuk kontaminasi silang?',vi:'Trong kinh doanh thực phẩm, tình huống nhiễm chéo phổ biến nhất là gì?'},
    opts:[{zh:'在通風良好的廚房工作',en:'Working in a well-ventilated kitchen',id:'Bekerja di dapur dengan ventilasi baik',vi:'Làm việc trong bếp thông thoáng',ok:false},
          {zh:'同一砧板先切生肉再切蔬菜，或洗手後又觸摸生肉再處理熟食',en:'Using the same board for raw meat then vegetables, or touching raw meat after handwashing and then handling cooked food',id:'Menggunakan talenan yang sama untuk daging mentah lalu sayuran, atau menyentuh daging mentah setelah cuci tangan lalu menangani makanan matang',vi:'Dùng cùng thớt cho thịt sống rồi rau, hoặc sau khi rửa tay chạm vào thịt sống rồi xử lý thức ăn chín',ok:true},
          {zh:'在打開窗戶的環境下烹調',en:'Cooking with windows open',id:'Memasak dengan jendela terbuka',vi:'Nấu ăn với cửa sổ mở',ok:false}],
    fb:{zh:'正確！交叉污染最常發生在：①同一器具接觸不同食材（砧板、刀具未分開）②雙手在接觸生食後未洗手又接觸熟食③生食滴液汙染下方熟食（冰箱擺放不當）。HACCP要求建立完整的隔離程序來預防。',en:'Correct! Cross-contamination most commonly occurs from: ① same utensils contacting different foods (boards/knives not separated) ② hands touching raw food then cooked food without handwashing ③ raw food drips contaminating cooked food below (improper fridge storage). HACCP requires comprehensive separation procedures.',id:'Benar! Kontaminasi silang paling sering terjadi dari: ① peralatan yang sama menyentuh berbagai makanan ② tangan menyentuh makanan mentah lalu matang tanpa mencuci tangan ③ cairan makanan mentah mengontaminasi makanan matang di bawahnya.',vi:'Đúng! Nhiễm chéo thường xảy ra nhất từ: ① cùng dụng cụ tiếp xúc thực phẩm khác nhau ② tay chạm thực phẩm sống rồi thức ăn chín mà không rửa tay ③ dịch từ thực phẩm sống nhỏ vào thức ăn chín bên dưới (tủ lạnh sắp xếp sai). HACCP yêu cầu quy trình tách biệt toàn diện.'}},
   {q:{zh:'食品安全「5S管理」中，「清潔（Seiso）」是指？',en:'In food safety "5S management", what does "Seiso" (Clean) refer to?',id:'Dalam "manajemen 5S" keamanan pangan, apa yang dimaksud "Seiso" (Bersih)?',vi:'Trong "quản lý 5S" an toàn thực phẩm, "Seiso" (Vệ sinh) có nghĩa là gì?'},
    opts:[{zh:'整理工作區域，去除不必要的物品',en:'Organize the work area and remove unnecessary items',id:'Atur area kerja dan buang barang yang tidak perlu',vi:'Sắp xếp khu vực làm việc và loại bỏ đồ không cần thiết',ok:false},
          {zh:'清潔工作場所，維持整潔狀態，確保食品安全環境',en:'Clean the workplace and maintain cleanliness to ensure a food-safe environment',id:'Bersihkan tempat kerja dan jaga kebersihan untuk memastikan lingkungan aman pangan',vi:'Làm sạch nơi làm việc và duy trì sạch sẽ để đảm bảo môi trường an toàn thực phẩm',ok:true},
          {zh:'統一工作流程，讓所有員工依照相同方式工作',en:'Standardize work processes so all employees work the same way',id:'Standarisasi proses kerja agar semua karyawan bekerja dengan cara yang sama',vi:'Tiêu chuẩn hóa quy trình làm việc để tất cả nhân viên làm theo cùng một cách',ok:false}],
    fb:{zh:'正確！食品業「5S管理」（源自日本）：①整理（Seiri）②整頓（Seiton）③清潔（Seiso）④清潔標準化（Seiketsu）⑤素養/持續（Shitsuke）。Seiso（清潔）要求對工作環境、設備與器具進行定期清潔消毒，是食品安全的基礎。',en:'Correct! Food industry 5S management (from Japan): ① Sort ② Set in order ③ Shine (Seiso) ④ Standardize ⑤ Sustain. Seiso requires regular cleaning and sanitizing of the work environment, equipment, and utensils — a food safety foundation.',id:'Benar! 5S manajemen industri pangan: ① Ringkas ② Rapi ③ Resik (Seiso) ④ Rawat ⑤ Rajin. Seiso mengharuskan pembersihan dan sanitasi lingkungan kerja, peralatan secara rutin.',vi:'Đúng! Quản lý 5S ngành thực phẩm: ① Sàng lọc ② Sắp xếp ③ Sạch sẽ (Seiso) ④ Săn sóc ⑤ Sẵn sàng. Seiso yêu cầu vệ sinh và sát khuẩn định kỳ môi trường làm việc, thiết bị và dụng cụ — là nền tảng an toàn thực phẩm.'}}
  ],
  /* Lv16 長者餐製作 */
  [
   {q:{zh:'製作長者軟質餐時，食材質地的目標硬度標準為何？',en:'What is the target texture standard for senior soft diet food?',id:'Apa standar tekstur target untuk makanan lembut lansia?',vi:'Tiêu chuẩn độ mềm mục tiêu cho món ăn mềm của người cao tuổi là gì?'},
    opts:[{zh:'可用舌頭壓碎，不需牙齒咀嚼',en:'Can be mashed with the tongue, no chewing required',id:'Dapat dilumatkan dengan lidah, tidak perlu dikunyah',vi:'Có thể nghiền bằng lưỡi, không cần nhai',ok:true},
          {zh:'與一般成人飲食相同硬度',en:'Same texture as regular adult diet',id:'Tekstur sama dengan makanan orang dewasa biasa',vi:'Độ cứng tương tự chế độ ăn người lớn bình thường',ok:false},
          {zh:'必須完全打成流質狀態',en:'Must be completely blended into liquid form',id:'Harus sepenuhnya diblender menjadi cair',vi:'Phải hoàn toàn xay thành dạng lỏng',ok:false}],
    fb:{zh:'正確！長者軟質餐的目標是食物可以被舌頭或牙齦輕鬆壓碎，適合牙齒脫落或咀嚼力減退的長者。過軟（流質）反而可能影響吞嚥安全，需根據個別需求調整。',en:'Correct! Senior soft diet targets foods that can be easily mashed with the tongue or gums — suitable for seniors with missing teeth or reduced chewing ability. Too liquid may actually impair swallowing safety.',id:'Benar! Makanan lembut lansia ditargetkan bisa dilumatkan dengan mudah menggunakan lidah atau gusi — cocok untuk lansia dengan gigi yang copot atau kemampuan mengunyah berkurang.',vi:'Đúng! Món ăn mềm cho người cao tuổi nhằm vào thực phẩm có thể dễ dàng nghiền bằng lưỡi hoặc lợi, phù hợp với người cao tuổi rụng răng hoặc giảm khả năng nhai. Quá lỏng lại có thể ảnh hưởng đến an toàn khi nuốt, cần điều chỉnh theo nhu cầu từng người.'}},
   {q:{zh:'為長者製作碎食餐時，食材的切碎大小應不超過多少？',en:'When preparing minced meals for seniors, food pieces should not exceed what size?',id:'Saat menyiapkan makanan cincang untuk lansia, potongan makanan tidak boleh melebihi ukuran berapa?',vi:'Khi chuẩn bị cơm nghiền cho người cao tuổi, miếng thức ăn không nên vượt quá kích thước nào?'},
    opts:[{zh:'0.5公分（約黃豆大小）',en:'0.5 cm (about the size of a soybean)',id:'0,5 cm (sekitar ukuran kacang kedelai)',vi:'0,5 cm (khoảng cỡ hạt đậu tương)',ok:true},
          {zh:'2公分（約一般骰子大小）',en:'2 cm (about the size of a regular die)',id:'2 cm (sekitar ukuran dadu biasa)',vi:'2 cm (khoảng cỡ viên xúc xắc)',ok:false},
          {zh:'5公分（約半個手掌大小）',en:'5 cm (about half a palm size)',id:'5 cm (sekitar setengah telapak tangan)',vi:'5 cm (khoảng nửa lòng bàn tay)',ok:false}],
    fb:{zh:'正確！長者碎食餐的食材建議切成0.5公分以下（約黃豆大小），能幫助咀嚼功能下降的長者安全進食，又能保留食材的色澤與部分口感，比完全打碎更有進食樂趣。',en:'Correct! Minced diet food should be cut to under 0.5 cm (soybean-sized), helping seniors with reduced chewing ability eat safely while preserving some texture and visual appeal compared to fully pureed food.',id:'Benar! Makanan cincang sebaiknya dipotong di bawah 0,5 cm (seukuran kedelai), membantu lansia dengan kemampuan mengunyah berkurang makan dengan aman sambil mempertahankan beberapa tekstur.',vi:'Đúng! Thực phẩm cơm nghiền nên được cắt dưới 0,5 cm (cỡ hạt đậu tương), giúp người cao tuổi giảm khả năng nhai ăn an toàn, trong khi vẫn giữ được phần kết cấu và màu sắc tự nhiên, hấp dẫn hơn so với xay nhuyễn hoàn toàn.'}},
   {q:{zh:'長者吞嚥困難（吞嚥障礙）時，哪種食物最危險？',en:'For seniors with dysphagia (swallowing difficulty), which food type is most dangerous?',id:'Untuk lansia dengan disfagia (kesulitan menelan), jenis makanan mana yang paling berbahaya?',vi:'Đối với người cao tuổi mắc khó nuốt, loại thực phẩm nào nguy hiểm nhất?'},
    opts:[{zh:'稀薄液體（如清水、果汁、稀湯）',en:'Thin liquids (e.g. water, juice, thin soup)',id:'Cairan encer (misalnya air putih, jus, sup encer)',vi:'Chất lỏng loãng (ví dụ nước, nước ép, súp loãng)',ok:true},
          {zh:'質地均一的濃稠泥糊狀食物',en:'Uniformly thick pureed food',id:'Makanan puree kental yang teksturnya seragam',vi:'Thực phẩm xay đặc đồng đều',ok:false},
          {zh:'切碎的軟嫩蔬菜',en:'Finely chopped soft vegetables',id:'Sayuran lunak yang dipotong halus',vi:'Rau mềm cắt nhỏ',ok:false}],
    fb:{zh:'正確！吞嚥障礙長者最易嗆到的是稀薄液體，因為流速快、難以控制。建議使用增稠劑將液體調整為適當濃稠度（如蜂蜜狀或布丁狀），可大幅降低吸入性肺炎的風險。',en:'Correct! Seniors with dysphagia most commonly choke on thin liquids because they flow too fast to control. Using thickeners to achieve honey or pudding consistency greatly reduces aspiration pneumonia risk.',id:'Benar! Lansia dengan disfagia paling mudah tersedak cairan encer karena mengalir terlalu cepat. Menggunakan pengental untuk mencapai konsistensi madu atau puding sangat mengurangi risiko pneumonia aspirasi.',vi:'Đúng! Người cao tuổi mắc khó nuốt dễ bị sặc nhất với chất lỏng loãng vì chảy quá nhanh, khó kiểm soát. Dùng chất làm đặc để đạt độ sánh như mật ong hoặc bánh pudding giúp giảm đáng kể nguy cơ viêm phổi do hít sặc.'}},
   {q:{zh:'為患有高血壓的長者製作低鹽餐，每日鈉攝取量應控制在？',en:'For seniors with hypertension, daily sodium intake for a low-sodium diet should be limited to?',id:'Untuk lansia penderita hipertensi, asupan natrium harian untuk diet rendah natrium harus dibatasi?',vi:'Đối với người cao tuổi bị tăng huyết áp, lượng natri hàng ngày trong chế độ ăn ít muối cần giới hạn ở mức nào?'},
    opts:[{zh:'每日不超過2000毫克（約一茶匙食鹽）',en:'No more than 2000 mg per day (about one teaspoon of salt)',id:'Tidak lebih dari 2000 mg per hari (sekitar satu sendok teh garam)',vi:'Không quá 2000 mg mỗi ngày (khoảng một thìa cà phê muối)',ok:true},
          {zh:'每日不超過5000毫克',en:'No more than 5000 mg per day',id:'Tidak lebih dari 5000 mg per hari',vi:'Không quá 5000 mg mỗi ngày',ok:false},
          {zh:'鹽分完全禁止使用',en:'Salt must be completely prohibited',id:'Garam harus sepenuhnya dilarang',vi:'Muối phải cấm hoàn toàn',ok:false}],
    fb:{zh:'正確！世衛組織建議成人每日鈉攝取量不超過2000毫克（約5克食鹽），高血壓長者更應嚴格控制。低鹽烹調技巧包括：以香草、檸檬汁、薑蒜增鮮，減少醬油、蠔油等高鹽調味料的用量。',en:'Correct! WHO recommends adults consume no more than 2000 mg sodium daily (about 5g salt); seniors with hypertension should be stricter. Low-sodium cooking tips: use herbs, lemon juice, ginger/garlic for flavor instead of soy sauce.',id:'Benar! WHO merekomendasikan tidak lebih dari 2000 mg natrium per hari (sekitar 5g garam); lansia hipertensi harus lebih ketat. Tips memasak rendah sodium: gunakan herba, jus lemon, jahe/bawang putih untuk rasa.',vi:'Đúng! WHO khuyến nghị người lớn không tiêu thụ quá 2000 mg natri mỗi ngày (khoảng 5g muối); người cao tuổi tăng huyết áp cần chặt chẽ hơn. Mẹo nấu ăn ít muối: dùng rau thơm, nước cốt chanh, gừng và tỏi để tạo vị, thay cho nước tương hoặc dầu hào.'}},
   {q:{zh:'為糖尿病長者規劃飲食時，下列哪種做法最正確？',en:'When planning meals for seniors with diabetes, which approach is most correct?',id:'Saat merencanakan makan untuk lansia penderita diabetes, pendekatan mana yang paling benar?',vi:'Khi lập kế hoạch bữa ăn cho người cao tuổi mắc đái tháo đường, phương pháp nào là đúng nhất?'},
    opts:[{zh:'完全禁止米飯、麵食等主食',en:'Completely prohibit rice, noodles and other staples',id:'Larang sepenuhnya nasi, mie dan makanan pokok lainnya',vi:'Cấm hoàn toàn cơm, mì và các loại tinh bột khác',ok:false},
          {zh:'採用固定分量的均衡飲食，並注意升糖指數（GI值）選擇低GI食材',en:'Use fixed-portion balanced meals and select low GI foods based on glycemic index',id:'Gunakan makanan seimbang porsi tetap dan pilih makanan GI rendah berdasarkan indeks glikemik',vi:'Dùng bữa ăn cân bằng với phần ăn cố định và chọn thực phẩm có chỉ số đường huyết (GI) thấp',ok:true},
          {zh:'只要不吃甜食，飲食無需特別控制',en:'As long as sweets are avoided, no other dietary control is needed',id:'Selama menghindari makanan manis, tidak perlu kontrol diet lain',vi:'Miễn là tránh đồ ngọt, không cần kiểm soát chế độ ăn khác',ok:false}],
    fb:{zh:'正確！糖尿病長者飲食管理重點：固定每餐主食分量（不需完全禁止），優先選擇低升糖指數（GI＜55）的食材如糙米、燕麥、地瓜，並均衡攝取蛋白質與膳食纖維，配合醫師與營養師建議。',en:'Correct! Diabetic senior meal management: fix portion sizes per meal (no need to ban staples), prioritize low GI foods (GI<55) like brown rice, oats, sweet potato, and balance protein and fiber — in consultation with doctors and dietitians.',id:'Benar! Manajemen makan lansia diabetik: tetapkan ukuran porsi per makan (tidak perlu melarang makanan pokok), prioritaskan makanan GI rendah (GI<55) seperti beras merah, oat, ubi jalar.',vi:'Đúng! Quản lý bữa ăn cho người cao tuổi mắc đái tháo đường: cố định khẩu phần mỗi bữa (không cần cấm hoàn toàn tinh bột), ưu tiên thực phẩm GI thấp (GI<55) như gạo lứt, yến mạch, khoai lang, đồng thời cân bằng protein và chất xơ theo hướng dẫn của bác sĩ và chuyên gia dinh dưỡng.'}},
   {q:{zh:'長者進食時，哪個姿勢最能預防嗆咳？',en:'Which posture best prevents choking in seniors during meals?',id:'Postur mana yang paling baik mencegah tersedak pada lansia saat makan?',vi:'Tư thế nào tốt nhất để phòng ngừa nghẹn ở người cao tuổi khi ăn?'},
    opts:[{zh:'半躺姿勢，頭略微後仰',en:'Semi-reclined with head slightly tilted back',id:'Setengah berbaring dengan kepala sedikit miring ke belakang',vi:'Tư thế nửa nằm, đầu hơi ngả ra sau',ok:false},
          {zh:'端正坐姿，上身挺直，下巴微收',en:'Upright sitting posture, spine straight, chin slightly tucked',id:'Postur duduk tegak, tulang belakang lurus, dagu sedikit ditarik',vi:'Tư thế ngồi thẳng, cột sống thẳng, cằm hơi thu vào',ok:true},
          {zh:'完全躺平，避免費力抬頭',en:'Completely flat, to avoid straining the neck',id:'Berbaring rata sepenuhnya untuk menghindari membebani leher',vi:'Nằm bẹt hoàn toàn để tránh căng cổ',ok:false}],
    fb:{zh:'正確！進食時應採端正坐姿，上身挺直且下巴微收（頭略向前傾約15–20度），這能讓喉嚨結構更有利於吞嚥，使食物進入食道而非氣管，有效預防嗆咳與吸入性肺炎。',en:'Correct! During meals, sit upright with spine straight and chin slightly tucked (head tilted slightly forward 15–20°). This aligns the throat structure to guide food into the esophagus, not the airway.',id:'Benar! Saat makan, duduk tegak dengan tulang belakang lurus dan dagu sedikit ditarik (kepala sedikit miring ke depan 15-20°). Ini menyelaraskan struktur tenggorokan untuk mengarahkan makanan ke kerongkongan.',vi:'Đúng! Khi ăn nên ngồi thẳng, cột sống thẳng và cằm hơi thu vào (đầu hơi nghiêng về phía trước 15-20 độ). Tư thế này giúp cấu trúc cổ họng hướng thức ăn vào thực quản thay vì đường thở, hiệu quả phòng ngừa nghẹn và viêm phổi hít sặc.'}},
   {q:{zh:'長者餐的蛋白質攝取量建議為何？（與一般成人相比）',en:'What is the recommended protein intake for seniors compared to regular adults?',id:'Berapa asupan protein yang direkomendasikan untuk lansia dibandingkan dengan orang dewasa biasa?',vi:'Lượng protein khuyến nghị cho người cao tuổi so với người lớn bình thường là bao nhiêu?'},
    opts:[{zh:'應比一般成人少，因為長者消化能力弱',en:'Should be less than regular adults due to weaker digestion',id:'Harus lebih sedikit dari orang dewasa biasa karena pencernaan lebih lemah',vi:'Nên ít hơn người lớn bình thường vì tiêu hóa yếu hơn',ok:false},
          {zh:'應比一般成人多（每公斤體重約1.2–1.5克），以預防肌少症',en:'Should be higher than regular adults (about 1.2–1.5g per kg body weight) to prevent sarcopenia',id:'Harus lebih tinggi dari orang dewasa biasa (sekitar 1,2-1,5g per kg berat badan) untuk mencegah sarkopenia',vi:'Nên cao hơn người lớn bình thường (khoảng 1,2-1,5g mỗi kg thể trọng) để phòng ngừa suy cơ',ok:true},
          {zh:'與一般成人完全相同，無需調整',en:'Same as regular adults, no adjustment needed',id:'Sama dengan orang dewasa biasa, tidak perlu penyesuaian',vi:'Giống người lớn bình thường, không cần điều chỉnh',ok:false}],
    fb:{zh:'正確！長者因肌肉合成效率下降，反而需要比一般成人更多的蛋白質（建議每公斤體重1.2–1.5克，一般成人約0.8克），以預防肌少症。優質蛋白質來源包括：雞蛋、豆腐、魚肉、雞肉等易消化的食材。',en:'Correct! Seniors need more protein than regular adults (1.2–1.5g/kg vs. 0.8g/kg for adults) due to reduced muscle synthesis efficiency, to prevent sarcopenia. Good sources: eggs, tofu, fish, chicken.',id:'Benar! Lansia membutuhkan lebih banyak protein dari orang dewasa biasa (1,2-1,5g/kg vs. 0,8g/kg) karena efisiensi sintesis otot berkurang, untuk mencegah sarkopenia. Sumber protein baik: telur, tahu, ikan, ayam.',vi:'Đúng! Người cao tuổi cần nhiều protein hơn người lớn bình thường (1,2-1,5g/kg so với 0,8g/kg) do hiệu quả tổng hợp cơ giảm, nhằm phòng ngừa suy cơ. Nguồn protein tốt và dễ tiêu hóa gồm: trứng, đậu phụ, cá, thịt gà.'}},
   {q:{zh:'替長者準備飯食時，以下哪種食材最有利於補充鈣質？',en:'When preparing meals for seniors, which food is most beneficial for calcium supplementation?',id:'Saat menyiapkan makanan untuk lansia, makanan mana yang paling bermanfaat untuk suplemen kalsium?',vi:'Khi chuẩn bị bữa ăn cho người cao tuổi, thực phẩm nào có lợi nhất cho bổ sung canxi?'},
    opts:[{zh:'白米飯',en:'White rice',id:'Nasi putih',vi:'Cơm trắng',ok:false},
          {zh:'板豆腐、小魚乾、深綠色蔬菜',en:'Firm tofu, small dried fish, dark green vegetables',id:'Tahu padat, ikan kering kecil, sayuran hijau tua',vi:'Đậu phụ cứng, cá khô nhỏ, rau lá xanh đậm',ok:true},
          {zh:'砂糖與白麵粉',en:'Sugar and white flour',id:'Gula dan tepung terigu',vi:'Đường và bột mì trắng',ok:false}],
    fb:{zh:'正確！長者預防骨質疏鬆需要足夠的鈣質，建議每日攝取1000–1200毫克。優質食物來源包括：板豆腐（以碳酸鈣點製）、小魚乾（連骨食用）、深綠色蔬菜（如菠菜、羽衣甘藍）、乳製品等。鈣質吸收也需要維生素D的協助，可藉由適度日曬或攝取強化食品獲取。',en:'Correct! Seniors need 1000–1200 mg calcium daily to prevent osteoporosis. Best food sources: firm tofu (made with calcium carbonate), small dried fish (eaten with bones), dark green vegetables (spinach, kale), and dairy. Vitamin D is needed for calcium absorption — through moderate sun exposure or fortified foods.',id:'Benar! Lansia membutuhkan 1000–1200 mg kalsium per hari untuk mencegah osteoporosis. Sumber makanan terbaik: tahu padat, ikan kering kecil, sayuran hijau tua, dan susu.',vi:'Đúng! Người cao tuổi cần 1000–1200 mg canxi mỗi ngày để phòng ngừa loãng xương. Nguồn thực phẩm tốt: đậu phụ cứng (làm bằng canxi carbonat), cá khô nhỏ (ăn cả xương), rau lá xanh đậm và sữa. Vitamin D cần thiết cho hấp thu canxi — qua phơi nắng vừa phải hoặc thực phẩm tăng cường.'}},
   {q:{zh:'製作長者的「碎食餐」時，應使用哪種方式讓食物更安全？',en:'When making "minced meals" for seniors, which technique makes the food safer?',id:'Saat membuat "makanan cincang" untuk lansia, teknik mana yang membuat makanan lebih aman?',vi:'Khi làm "cơm nghiền" cho người cao tuổi, kỹ thuật nào giúp thực phẩm an toàn hơn?'},
    opts:[{zh:'食物直接切碎後就可以上桌，不需要其他處理',en:'Cut food up and serve directly, no other processing needed',id:'Potong makanan dan sajikan langsung, tidak perlu pengolahan lain',vi:'Cắt thức ăn và dọn ra ngay, không cần xử lý thêm',ok:false},
          {zh:'食物充分煮軟後再切碎，確保質地均勻且無硬塊',en:'Cook food until thoroughly soft first, then mince to ensure even texture and no hard pieces',id:'Masak makanan hingga benar-benar lunak dulu, lalu cincang untuk memastikan tekstur merata dan tidak ada potongan keras',vi:'Nấu chín mềm hoàn toàn trước, rồi mới nghiền để đảm bảo kết cấu đều và không có miếng cứng',ok:true},
          {zh:'使用生的食材切碎，確保最多的營養素保留',en:'Use raw ingredients and mince them to preserve maximum nutrients',id:'Gunakan bahan mentah dan cincang untuk mempertahankan nutrisi maksimal',vi:'Dùng nguyên liệu sống nghiền để giữ tối đa dinh dưỡng',ok:false}],
    fb:{zh:'正確！製作長者碎食餐的正確流程：①先將食材煮至完全軟熟（以確保熟度與安全）②再用刀切碎或食物剪剪碎至適當大小（通常不超過0.5公分）③確保碎食質地均勻，無殘留較硬的部分。先煮軟再切碎能確保食物熟透且質地一致，讓長者安全吞嚥。',en:'Correct! The correct process for senior minced meals: ① Cook ingredients until completely soft first (to ensure doneness and safety) ② Then mince with a knife or food scissors to appropriate size (usually no more than 0.5 cm) ③ Ensure even texture with no hard pieces remaining. Cook-then-mince ensures thorough cooking and consistent texture for safe swallowing.',id:'Benar! Proses yang benar untuk makanan cincang lansia: ① Masak bahan hingga benar-benar lunak dulu ② Kemudian cincang dengan pisau atau gunting makanan hingga ukuran yang sesuai ③ Pastikan tekstur merata tanpa potongan keras.',vi:'Đúng! Quy trình đúng cho cơm nghiền người cao tuổi: ① Nấu nguyên liệu cho đến khi hoàn toàn mềm (đảm bảo độ chín và an toàn) ② Sau đó nghiền bằng dao hoặc kéo cắt thức ăn đến kích thước phù hợp (thường không quá 0,5 cm) ③ Đảm bảo kết cấu đều, không có mảnh cứng. Nấu mềm rồi nghiền đảm bảo thức ăn chín kỹ và kết cấu nhất quán để nuốt an toàn.'}},
   {q:{zh:'長者餐飲中，「少量多餐」的建議主要是因為？',en:'In senior meal planning, "small frequent meals" is recommended mainly because?',id:'Dalam perencanaan makan lansia, "makan sedikit tapi sering" direkomendasikan terutama karena?',vi:'Trong kế hoạch bữa ăn của người cao tuổi, "ăn ít nhiều bữa" được khuyến nghị chủ yếu vì?'},
    opts:[{zh:'長者不喜歡吃大量食物',en:'Seniors do not like eating large amounts',id:'Lansia tidak suka makan dalam jumlah besar',vi:'Người cao tuổi không thích ăn lượng lớn',ok:false},
          {zh:'長者胃容量縮小且消化能力減弱，少量多餐能維持穩定血糖並確保足夠營養攝取',en:'Seniors have reduced stomach capacity and digestion; small frequent meals maintain stable blood sugar and ensure adequate nutrition',id:'Lansia memiliki kapasitas perut berkurang dan pencernaan melemah; makan sedikit tapi sering menjaga gula darah stabil dan memastikan nutrisi yang cukup',vi:'Người cao tuổi có dung tích dạ dày giảm và tiêu hóa yếu; ăn ít nhiều bữa giúp duy trì đường huyết ổn định và đảm bảo đủ dinh dưỡng',ok:true},
          {zh:'少量多餐可以節省食材與烹調成本',en:'Small frequent meals save on ingredients and cooking costs',id:'Makan sedikit tapi sering menghemat bahan dan biaya memasak',vi:'Ăn ít nhiều bữa tiết kiệm nguyên liệu và chi phí nấu ăn',ok:false}],
    fb:{zh:'正確！長者常有胃容量縮小、消化酶分泌減少等生理變化，一次大量進食容易引起不適。少量多餐（如一天5–6餐）能減輕消化負擔、維持穩定血糖、同時確保每日總熱量與營養素攝取達標。每餐份量約為一般成人的1/2至2/3。',en:'Correct! Seniors often have reduced stomach capacity and fewer digestive enzymes, making large meals uncomfortable. Small frequent meals (e.g. 5–6 per day) reduce digestive burden, maintain steady blood sugar, and ensure total daily nutrient intake is met. Each meal should be about 1/2 to 2/3 of a regular adult portion.',id:'Benar! Lansia sering memiliki kapasitas perut berkurang dan enzim pencernaan lebih sedikit, sehingga makan banyak sekaligus tidak nyaman. Makan sedikit tapi sering (5-6 kali sehari) mengurangi beban pencernaan dan menjaga gula darah stabil.',vi:'Đúng! Người cao tuổi thường có dung tích dạ dày giảm và ít enzyme tiêu hóa hơn, ăn nhiều một lúc dễ khó chịu. Ăn ít nhiều bữa (5-6 bữa/ngày) giảm gánh nặng tiêu hóa, duy trì đường huyết ổn định và đảm bảo tổng lượng dinh dưỡng mỗi ngày. Mỗi bữa khoảng 1/2 đến 2/3 khẩu phần người lớn bình thường.'}}
  ],
  /* Lv17 家庭幫傭實務料理 */
  [
   {q:{zh:'為雇主家庭準備早餐時，下列哪項最重要的考量是？',en:'When preparing breakfast for the employer household, what is the most important consideration?',id:'Saat menyiapkan sarapan untuk keluarga majikan, apa pertimbangan terpenting?',vi:'Khi chuẩn bị bữa sáng cho gia đình chủ, điều quan trọng nhất cần xem xét là gì?'},
    opts:[{zh:'準備最豪華昂貴的食材以顯示用心',en:'Use the most expensive ingredients to show dedication',id:'Gunakan bahan paling mahal untuk menunjukkan dedikasi',vi:'Dùng nguyên liệu đắt nhất để thể hiện sự tận tâm',ok:false},
          {zh:'了解家庭成員的飲食喜好、過敏原與健康需求，並準時完成',en:'Understand family members dietary preferences, allergens, and health needs, and complete on time',id:'Pahami preferensi makan anggota keluarga, alergen, dan kebutuhan kesehatan, serta selesaikan tepat waktu',vi:'Hiểu sở thích ăn uống, dị ứng và nhu cầu sức khỏe của các thành viên trong gia đình, và hoàn thành đúng giờ',ok:true},
          {zh:'每天準備相同的早餐以節省備料時間',en:'Prepare the same breakfast every day to save prep time',id:'Siapkan sarapan yang sama setiap hari untuk menghemat waktu persiapan',vi:'Chuẩn bị bữa sáng giống nhau mỗi ngày để tiết kiệm thời gian',ok:false}],
    fb:{zh:'正確！家庭幫傭料理的首要原則是了解雇主家庭的需求：各成員的口味偏好、食物過敏原、健康限制（如低糖、低鹽）及宗教飲食規範，並確保在約定時間準備好，是專業幫傭的基本素養。',en:'Correct! The first principle of household cooking is understanding the family: each member preferences, allergies, health restrictions (e.g. low sugar, low sodium), and religious dietary rules — completed punctually.',id:'Benar! Prinsip pertama memasak rumah tangga adalah memahami keluarga: preferensi setiap anggota, alergi, batasan kesehatan (misalnya rendah gula, rendah sodium), dan aturan diet agama.',vi:'Đúng! Nguyên tắc đầu tiên trong việc nấu ăn cho gia đình chủ là hiểu rõ gia đình: sở thích, dị ứng, hạn chế sức khỏe (như ít đường, ít muối) và quy định ăn uống theo tôn giáo của từng thành viên, đồng thời hoàn thành đúng giờ đã hẹn.'}},
   {q:{zh:'製作便當時，下列哪項食品安全守則最重要？',en:'When making bento boxes, which food safety rule is most important?',id:'Saat membuat bento, aturan keamanan pangan mana yang paling penting?',vi:'Khi làm hộp cơm, quy tắc an toàn thực phẩm nào quan trọng nhất?'},
    opts:[{zh:'食材完全煮熟，且便當需完全冷卻後再蓋蓋，避免水蒸氣悶熱導致細菌滋生',en:'Cook food thoroughly, and cool bento completely before closing the lid to prevent steam buildup and bacterial growth',id:'Masak makanan hingga matang sempurna, dan dinginkan bento sepenuhnya sebelum menutup tutupnya untuk mencegah uap panas dan pertumbuhan bakteri',vi:'Nấu chín kỹ, và để hộp cơm nguội hoàn toàn trước khi đóng nắp để tránh hơi nước và vi khuẩn phát triển',ok:true},
          {zh:'便當趁熱蓋蓋才能保溫',en:'Close the lid while hot to retain warmth',id:'Tutup saat masih panas untuk menjaga kehangatan',vi:'Đóng nắp khi còn nóng để giữ ấm',ok:false},
          {zh:'生菜沙拉放入便當最健康',en:'Adding raw salad to bento is healthiest',id:'Menambahkan salad mentah ke dalam bento adalah yang paling sehat',vi:'Thêm salad sống vào hộp cơm là lành mạnh nhất',ok:false}],
    fb:{zh:'正確！便當食安黃金守則：①食材必須煮熟②便當冷卻至室溫再蓋蓋（避免蒸氣悶壞）③需在4小時內食用或冷藏④避免放生食。趁熱蓋蓋會產生大量水蒸氣，反而加速細菌繁殖。',en:'Correct! Bento food safety golden rules: food must be fully cooked; cool to room temperature before closing lid (to avoid steam); consume within 4 hours or refrigerate; avoid raw foods.',id:'Benar! Aturan emas keamanan bento: makanan harus matang sempurna; dinginkan ke suhu kamar sebelum menutup tutup; konsumsi dalam 4 jam atau simpan di kulkas; hindari makanan mentah.',vi:'Đúng! Quy tắc vàng an toàn hộp cơm: thức ăn phải nấu chín kỹ; để nguội đến nhiệt độ phòng trước khi đóng nắp (tránh đọng hơi nước); ăn trong vòng 4 giờ hoặc bảo quản lạnh; tránh dùng thực phẩm sống. Đóng nắp khi còn nóng sẽ tạo nhiều hơi nước, khiến vi khuẩn sinh sôi nhanh hơn.'}},
   {q:{zh:'為家中老人準備飲食時，除了質地軟化之外，還需特別注意什麼？',en:'When preparing meals for elderly at home, besides soft texture, what else requires special attention?',id:'Saat menyiapkan makanan untuk lansia di rumah, selain tekstur lembut, apa lagi yang perlu diperhatikan?',vi:'Khi chuẩn bị bữa ăn cho người già trong nhà, ngoài kết cấu mềm, còn cần chú ý điều gì?'},
    opts:[{zh:'儘量選用重口味的調味料以增進食慾',en:'Use strong seasonings to stimulate appetite',id:'Gunakan bumbu kuat untuk merangsang nafsu makan',vi:'Dùng gia vị đậm để kích thích thèm ăn',ok:false},
          {zh:'注意補充鈣質、維他命D與優質蛋白質，並減少高鈉、高糖的調味',en:'Pay attention to calcium, vitamin D, and quality protein intake, while reducing high-sodium and high-sugar seasonings',id:'Perhatikan asupan kalsium, vitamin D, dan protein berkualitas sambil mengurangi bumbu tinggi sodium dan gula',vi:'Chú ý bổ sung canxi, vitamin D và protein chất lượng, đồng thời giảm gia vị nhiều muối và đường',ok:true},
          {zh:'老人消化不好，建議每天只吃兩餐',en:'Seniors have poor digestion so two meals a day is recommended',id:'Lansia memiliki pencernaan yang buruk sehingga dua kali makan sehari disarankan',vi:'Người cao tuổi tiêu hóa kém nên khuyên ăn hai bữa mỗi ngày',ok:false}],
    fb:{zh:'正確！長者常見的營養問題包括：鈣質與維他命D不足（易骨質疏鬆）、蛋白質攝取不足（易肌少症）。烹調時應減少鹽、糖與油，改用天然食材增味，並少量多餐，照顧長者消化能力。',en:'Correct! Common senior nutrition issues: insufficient calcium and vitamin D (risk of osteoporosis), inadequate protein (sarcopenia risk). Cook with less salt, sugar, oil; use natural ingredients for flavor; offer small frequent meals.',id:'Benar! Masalah gizi umum lansia: kalsium dan vitamin D tidak cukup (risiko osteoporosis), protein tidak cukup (risiko sarkopenia). Masak dengan lebih sedikit garam, gula, minyak; gunakan bahan alami untuk rasa.',vi:'Đúng! Vấn đề dinh dưỡng phổ biến ở người cao tuổi gồm: thiếu canxi và vitamin D (nguy cơ loãng xương), thiếu protein (nguy cơ suy cơ). Nên nấu với ít muối, đường, dầu; dùng nguyên liệu tự nhiên để tăng vị, và chia thành nhiều bữa nhỏ trong ngày.'}},
   {q:{zh:'為兒童準備餐食時，下列哪項原則最有助於培養均衡飲食習慣？',en:'When preparing meals for children, which principle best helps develop balanced eating habits?',id:'Saat menyiapkan makanan untuk anak-anak, prinsip mana yang paling membantu mengembangkan kebiasaan makan seimbang?',vi:'Khi chuẩn bị bữa ăn cho trẻ em, nguyên tắc nào tốt nhất giúp hình thành thói quen ăn uống cân bằng?'},
    opts:[{zh:'只準備孩子喜歡的食物，避免造成進食抗拒',en:'Only prepare foods children like to avoid mealtime resistance',id:'Hanya siapkan makanan yang disukai anak untuk menghindari penolakan makan',vi:'Chỉ chuẩn bị món trẻ thích để tránh bị từ chối ăn',ok:false},
          {zh:'每餐包含五色蔬果（紅黃綠白紫），以有趣的擺盤吸引兒童進食多樣化食物',en:'Include five-color vegetables and fruits (red, yellow, green, white, purple) and use fun plating to encourage variety',id:'Sertakan sayur dan buah lima warna (merah, kuning, hijau, putih, ungu) dan gunakan plating menarik untuk mendorong variasi',vi:'Bao gồm rau quả năm màu (đỏ, vàng, xanh, trắng, tím) và trang trí vui mắt để khuyến khích ăn đa dạng',ok:true},
          {zh:'不給孩子吃零食，以確保正餐能吃飽',en:'No snacks for children to ensure they eat full meals',id:'Tidak ada camilan untuk anak agar mereka makan kenyang saat makan',vi:'Không cho trẻ ăn vặt để đảm bảo ăn no bữa chính',ok:false}],
    fb:{zh:'正確！兒童餐色彩豐富的五色蔬果不只提供不同的植化素與營養素，鮮豔的顏色與可愛的擺盤也能提升孩子的食慾與對飲食的好奇心，是引導兒童接受多樣化食物的有效方法。',en:'Correct! Five-color vegetables provide different phytonutrients, and colorful, fun plating boosts children appetite and curiosity about food — an effective way to encourage variety in children diets.',id:'Benar! Sayur lima warna menyediakan fitokimia berbeda, dan plating berwarna-warni yang menyenangkan meningkatkan nafsu makan anak dan rasa ingin tahu tentang makanan.',vi:'Đúng! Rau quả năm màu cung cấp nhiều dưỡng chất thực vật khác nhau, còn cách trang trí vui mắt giúp tăng cảm giác thèm ăn và sự tò mò của trẻ với thực phẩm — là cách hiệu quả để khuyến khích trẻ ăn đa dạng hơn.'}},
   {q:{zh:'幫傭在雇主家中烹煮宴客菜時，哪項做法最為專業？',en:'When cooking banquet dishes at the employer home, which practice is most professional?',id:'Saat memasak hidangan jamuan di rumah majikan, praktik mana yang paling profesional?',vi:'Khi nấu món tiệc tại nhà chủ, cách làm nào chuyên nghiệp nhất?'},
    opts:[{zh:'完全依照自己家鄉的習慣烹調，展現個人特色',en:'Cook entirely according to your home country customs to showcase personal style',id:'Masak sepenuhnya sesuai kebiasaan kampung halaman untuk menampilkan gaya pribadi',vi:'Nấu hoàn toàn theo phong tục quê hương để thể hiện phong cách cá nhân',ok:false},
          {zh:'事先與雇主確認菜單、客人數量與飲食限制，並提前準備可預做的食材與醬汁',en:'Confirm menu, guest count, and dietary restrictions with employer in advance, and prep ingredients and sauces ahead of time',id:'Konfirmasi menu, jumlah tamu, dan pantangan diet dengan majikan terlebih dahulu, dan siapkan bahan dan saus sebelumnya',vi:'Xác nhận trước với chủ về thực đơn, số khách và hạn chế ăn uống, đồng thời chuẩn bị trước nguyên liệu và nước sốt',ok:true},
          {zh:'依照自己的判斷決定菜色，不需要與雇主溝通',en:'Decide the menu by your own judgment without consulting the employer',id:'Tentukan menu berdasarkan penilaian sendiri tanpa berkonsultasi dengan majikan',vi:'Tự quyết định thực đơn theo phán đoán cá nhân mà không cần trao đổi với chủ',ok:false}],
    fb:{zh:'正確！專業幫傭烹煮宴客菜的工作流程：①事前溝通確認菜單與賓客需求②評估採購清單與預算③提前1–2天預做可準備的食材（醃漬、備料、熬湯）④宴客當天專注現做料理⑤注意上菜時間安排，這是展現專業素養的關鍵。',en:'Correct! Professional household banquet cooking workflow: confirm menu and guest needs → assess shopping list and budget → prep ingredients 1-2 days ahead (marinades, stock, mise en place) → cook fresh on the day → manage serving timing.',id:'Benar! Alur kerja memasak jamuan rumah tangga profesional: konfirmasi menu dan kebutuhan tamu → nilai daftar belanja dan anggaran → siapkan bahan 1-2 hari sebelumnya → masak segar pada hari itu → kelola waktu penyajian.',vi:'Đúng! Quy trình nấu món tiệc gia đình chuyên nghiệp: xác nhận thực đơn và nhu cầu khách → đánh giá danh sách mua sắm và ngân sách → chuẩn bị trước 1-2 ngày (ướp, sơ chế, nấu nước dùng) → nấu món tươi ngay trong ngày tiệc → quản lý thời gian phục vụ.'}},
   {q:{zh:'幫傭處理雇主家中食材採購時，下列哪項做法最正確？',en:'When handling grocery shopping for the employer household, which approach is most correct?',id:'Saat menangani belanja bahan makanan untuk rumah tangga majikan, pendekatan mana yang paling benar?',vi:'Khi xử lý việc mua sắm thực phẩm cho gia đình chủ, phương pháp nào là đúng nhất?'},
    opts:[{zh:'自行決定採購項目與數量，不需告知雇主',en:'Decide what to buy independently without informing the employer',id:'Tentukan apa yang dibeli secara mandiri tanpa memberi tahu majikan',vi:'Tự quyết định mua gì mà không cần báo với chủ',ok:false},
          {zh:'根據雇主提供的清單或確認的菜單採購，詳細記錄收據與花費，剩餘零錢如實繳回',en:'Shop based on the employer list or confirmed menu, keep detailed receipts and expense records, return all change honestly',id:'Belanja berdasarkan daftar majikan atau menu yang dikonfirmasi, simpan kuitansi dan catatan pengeluaran terperinci, kembalikan semua kembalian dengan jujur',vi:'Mua theo danh sách hoặc thực đơn đã được chủ xác nhận, lưu hóa đơn và ghi chi tiết, trả lại toàn bộ tiền thừa một cách trung thực',ok:true},
          {zh:'儘量選購最便宜的食材以節省雇主開支',en:'Always buy the cheapest ingredients to save the employer money',id:'Selalu beli bahan termurah untuk menghemat uang majikan',vi:'Luôn mua nguyên liệu rẻ nhất để tiết kiệm tiền cho chủ',ok:false}],
