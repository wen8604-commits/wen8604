  /* Lv13 烘焙入門 */
  {
    title:{zh:'烘焙入門完全指南',en:'Baking Basics Complete Guide',id:'Panduan Lengkap Dasar Memanggang',vi:'Hướng dẫn toàn diện cơ bản làm bánh'},
    visual:{
      title:{zh:'烘焙關鍵工具與材料一覽',en:'Key Baking Tools & Ingredients Overview'},
      html:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
        <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🌡️ 溫度控制</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            預熱：至少提前15分鐘<br>
            蛋糕：160–180°C<br>
            餅乾：170–190°C<br>
            麵包：180–220°C
          </div>
        </div>
        <div style="background:#f3e5f5;border:1px solid #ce93d8;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🌾 麵粉類型</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            低筋 8–9% → 蛋糕、餅乾<br>
            中筋 10–12% → 包子、饅頭<br>
            高筋 12–14% → 麵包、pizza
          </div>
        </div>
        <div style="background:#e8f5ee;border:1px solid #a5d6a7;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🧪 膨鬆劑</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            泡打粉：遇液+熱釋CO₂<br>
            小蘇打：需酸性材料活化<br>
            酵母：生物發酵，需時間
          </div>
        </div>
        <div style="background:#fce4ec;border:1px solid #f48fb1;border-radius:8px;padding:8px">
          <div style="font-size:14px;margin-bottom:4px">🧈 油脂處理</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">
            室溫軟化：按壓留印不融<br>
            融化奶油：隔水加熱最穩<br>
            植物油：適合濕潤蛋糕體
          </div>
        </div>
      </div>`
    },
    sections:[
      {
        heading:{zh:'烘焙基本原則',en:'Core Baking Principles'},
        body:{zh:'烘焙是精確的科學。與一般炒菜不同，烘焙的材料比例、溫度與操作順序直接決定成敗。每次烘焙前務必：①確認食材在室溫（雞蛋、奶油提前30分鐘回溫）②精確秤量材料（勿以目測）③依序加入材料（通常是乾濕分開再混合）。',
         en:'Baking is a precise science. Unlike stir-frying, exact ratios, temperature, and order of operations determine success or failure. Before every bake: ① ensure ingredients are at room temp (eggs and butter out 30 min ahead) ② weigh accurately (no eyeballing) ③ add ingredients in order (usually mix dry and wet separately before combining).'}

         en:"A successful party menu follows the principle of \"balance hot and cold, balance complex and simple.\" Suggested ratio: 1–2 cold dishes (make-ahead), 2–3 hot stir-fries (cook-to-order), 1 main starch, 1 soup, 1 dessert. Don't choose the most technically difficult dish for every course — even a simple cold salad can be a memorable highlight."}

    sections:[
      {
        heading:{zh:'HACCP七大原則',en:'The 7 Principles of HACCP'},
        body:{zh:'HACCP（危害分析重要管制點）是國際通用的食品安全管理體系，由七大原則組成：①進行危害分析（找出所有潛在危害）②確認重要管制點CCP（必須管控的關鍵步驟）③建立管制界限（如溫度標準）④建立監測系統（定時量測記錄）⑤建立矯正措施（超標時的應對方案）⑥建立驗證程序（確認系統有效執行）⑦建立紀錄與文件管理（留存所有監測記錄）。',
         en:'HACCP (Hazard Analysis and Critical Control Points) is a globally recognized food safety system built on 7 principles: ① Conduct hazard analysis ② Identify Critical Control Points (CCPs) ③ Establish critical limits (e.g. temperature standards) ④ Set up a monitoring system (regular measurement and recording) ⑤ Establish corrective actions (responses when limits are exceeded) ⑥ Establish verification procedures (confirm the system works) ⑦ Establish record-keeping and documentation (retain all monitoring records).',
         id:'HACCP adalah sistem keamanan pangan yang diakui secara global, dibangun di atas 7 prinsip: ① Analisis bahaya ② Identifikasi Titik Kendali Kritis (CCP) ③ Tetapkan batas kritis ④ Sistem pemantauan ⑤ Tindakan korektif ⑥ Prosedur verifikasi ⑦ Pencatatan dan dokumentasi.',
         vi:'HACCP là hệ thống an toàn thực phẩm được công nhận toàn cầu, xây dựng trên 7 nguyên tắc: ① Phân tích mối nguy ② Xác định Điểm Kiểm Soát Tới Hạn (CCP) ③ Thiết lập giới hạn tới hạn ④ Hệ thống giám sát ⑤ Biện pháp khắc phục ⑥ Thủ tục xác minh ⑦ Lưu trữ hồ sơ.'}
      },
      {
        heading:{zh:'冷鏈管理與FIFO實務',en:'Cold Chain Management & FIFO in Practice'},
        body:{zh:'冷鏈管理要求食品在整個供應鏈維持安全溫度：冷藏7°C以下（最佳4°C）、冷凍-18°C以下。收貨時務必檢查溫度並記錄，發現斷鏈應拒收或立即上報。FIFO（先進先出）是倉儲管理的核心：新品放後方，舊品置前方優先使用。每件食材應清楚標示收貨日期與效期。正確執行FIFO可減少食材浪費，並防止過期食品流入餐桌。',
         en:'Cold chain management requires food to maintain safe temperatures throughout the supply chain: refrigerated below 7°C (ideally 4°C), frozen below -18°C. Always check and record temperature upon delivery; reject or report any cold chain break immediately. FIFO (First In First Out) is the core of storage management: place new stock at the back, older stock at the front for priority use. Every item should be clearly labeled with receipt date and expiry. Proper FIFO reduces waste and prevents expired food from reaching the table.',
         id:'Manajemen rantai dingin mengharuskan makanan mempertahankan suhu aman: kulkas di bawah 7°C (idealnya 4°C), beku di bawah -18°C. Selalu periksa dan catat suhu saat penerimaan; tolak atau laporkan segera jika ada gangguan rantai dingin. FIFO adalah inti manajemen penyimpanan: taruh stok baru di belakang, stok lama di depan untuk digunakan lebih dulu.',
         vi:'Quản lý chuỗi lạnh yêu cầu thực phẩm duy trì nhiệt độ an toàn: lạnh dưới 7°C (lý tưởng 4°C), đông lạnh dưới -18°C. Luôn kiểm tra và ghi lại nhiệt độ khi nhận hàng; từ chối hoặc báo cáo ngay nếu có sự cố chuỗi lạnh. FIFO là cốt lõi của quản lý kho: đặt hàng mới phía sau, hàng cũ phía trước để dùng trước.'}

    ],
    tip:{zh:'💡 HACCP的精髓在於「預防」而非「事後補救」。與其在食安事故發生後追查原因，不如在每個關鍵步驟事先設防。即使是家庭廚房，落實分色砧板、溫度管理與FIFO，就已掌握HACCP最核心的精神。',
     en:"💡 The essence of HACCP is prevention, not reaction. Rather than tracing the cause after a food safety incident, set defenses at every critical step beforehand. Even in a home kitchen, using color-coded boards, managing temperatures, and applying FIFO captures the core spirit of HACCP.",
     id:'💡 Inti HACCP adalah pencegahan, bukan reaksi. Daripada melacak penyebab setelah insiden keamanan pangan, pasang pertahanan di setiap langkah kritis sebelumnya. Bahkan di dapur rumah, menggunakan talenan berkode warna, mengelola suhu, dan menerapkan FIFO sudah mencerminkan semangat inti HACCP.',
     vi:'💡 Tinh thần của HACCP là phòng ngừa, không phải phản ứng. Thay vì truy tìm nguyên nhân sau sự cố an toàn thực phẩm, hãy thiết lập biện pháp bảo vệ tại mỗi bước quan trọng từ trước. Ngay cả trong bếp gia đình, dùng thớt phân màu, quản lý nhiệt độ và áp dụng FIFO đã nắm bắt được tinh thần cốt lõi của HACCP.'}

  /* Lv16 長者餐製作 */

    visual:{
      title:{zh:'長者飲食五大調整原則',en:'5 Key Dietary Adjustments for Seniors'},

        </div>

    sections:[
      {
        heading:{zh:'長者的生理特性與飲食需求',en:'Senior Physiology & Dietary Needs'},
        body:{zh:'隨著年齡增長，長者出現多項生理變化影響飲食需求：①咀嚼能力下降（牙齒退化）→食材需切細或軟化②消化功能減弱→少量多餐較適宜③骨質疏鬆風險提高→增加鈣質（乳製品、豆腐、小魚）攝取④肌肉量流失（肌少症）→每餐需含足夠優質蛋白⑤口渴感遲鈍→容易脫水，需主動補水。了解這些特性，才能設計真正適合長者的餐食。',
         en:'As people age, several physiological changes affect dietary needs: ① Reduced chewing ability (tooth deterioration) → food must be finely cut or softened ② Weakened digestion → smaller, more frequent meals are preferable ③ Increased risk of osteoporosis → more calcium (dairy, tofu, small fish) needed ④ Muscle loss (sarcopenia) → each meal needs adequate quality protein ⑤ Dulled thirst sensation → prone to dehydration, must proactively hydrate. Understanding these factors is essential to designing meals that truly serve seniors.',
         id:'Seiring bertambahnya usia, beberapa perubahan fisiologis memengaruhi kebutuhan gizi: ① Kemampuan mengunyah berkurang → makanan perlu dipotong halus atau dilunakkan ② Pencernaan melemah → makan porsi kecil lebih sering ③ Risiko osteoporosis meningkat → butuh lebih banyak kalsium ④ Kehilangan massa otot (sarkopenia) → setiap makan butuh protein berkualitas yang cukup ⑤ Rasa haus yang tumpul → mudah dehidrasi, perlu hidrasi aktif.',
         vi:'Khi già đi, một số thay đổi sinh lý ảnh hưởng đến nhu cầu dinh dưỡng: ① Khả năng nhai giảm → thức ăn cần thái nhỏ hoặc làm mềm ② Tiêu hóa suy yếu → nên ăn ít hơn và nhiều bữa ③ Nguy cơ loãng xương tăng → cần thêm canxi ④ Mất khối cơ (sarcopenia) → mỗi bữa cần đủ protein chất lượng ⑤ Cảm giác khát cùn → dễ mất nước, cần chủ động bổ sung nước.'}
      },
      {
        heading:{zh:'長者軟食與糊食製作技巧',en:'Soft & Pureed Food Preparation Techniques'},
        body:{zh:'當長者咀嚼或吞嚥困難時，需製作軟食或糊食。軟食：食材蒸至筷子能輕易穿透、肉類選擇魚肉或雞胸肉燉至鬆軟、蔬菜煮熟後切小塊。糊食（適合吞嚥障礙者）：食材煮熟後以食物調理機打成均勻糊狀，加入高湯或牛奶調整濃稠度，注意保留食物原色與風味以維持食慾。製作長者餐前，務必詢問家屬或醫療人員關於吞嚥能力等級與禁忌食材。',
         en:'When seniors have difficulty chewing or swallowing, soft or pureed foods are needed. Soft foods: steam ingredients until chopsticks pass through easily; choose fish or chicken breast braised until tender; cut cooked vegetables into small pieces. Pureed foods (for swallowing difficulties): blend cooked ingredients in a food processor to a smooth consistency, adjust thickness with stock or milk, and preserve the original color and flavor to maintain appetite. Always consult family or medical staff about swallowing ability levels and restricted foods before preparing senior meals.',
         id:'Ketika lansia kesulitan mengunyah atau menelan, diperlukan makanan lunak atau makanan haluskan. Makanan lunak: kukus bahan hingga sumpit mudah menembusnya; pilih ikan atau dada ayam yang direbus hingga empuk; potong sayuran matang menjadi potongan kecil. Makanan haluskan: blender bahan matang hingga halus rata, sesuaikan kekentalan dengan kaldu atau susu, pertahankan warna dan rasa asli untuk menjaga selera makan.',
         vi:'Khi người cao tuổi khó nhai hoặc nuốt, cần chuẩn bị thức ăn mềm hoặc nhuyễn. Thức ăn mềm: hấp nguyên liệu đến khi đũa xuyên qua dễ dàng; chọn cá hoặc ức gà hầm đến mềm; cắt nhỏ rau đã nấu chín. Thức ăn nhuyễn: xay nguyên liệu đã nấu bằng máy xay đến khi mịn, điều chỉnh độ đặc bằng nước dùng hoặc sữa, giữ màu sắc và hương vị nguyên bản để duy trì cảm giác ngon miệng.'}

    tip:{zh:'💡 長者餐的核心不只是「好消化」，更是「有尊嚴的飲食體驗」。即使是軟食，也要注意擺盤色彩與食物原形，讓長者仍能感受到飲食的樂趣。定期詢問長者的飲食喜好與身體狀況，才能持續提供真正符合需求的餐食。',
     en:"💡 The heart of senior cooking isn't just digestibility — it's a dignified dining experience. Even soft foods should be plated with color and recognizable shapes so seniors can still enjoy eating. Regularly asking about their preferences and health conditions ensures meals continue to truly meet their needs.",
     id:'💡 Inti dari masakan lansia bukan hanya mudah dicerna, tetapi juga pengalaman makan yang bermartabat. Bahkan makanan lunak harus disajikan dengan warna dan bentuk yang dapat dikenali agar lansia masih dapat menikmati makan. Tanyakan secara rutin preferensi dan kondisi kesehatan mereka untuk terus menyediakan makanan yang benar-benar sesuai.',
     vi:'💡 Cốt lõi của nấu ăn cho người cao tuổi không chỉ là dễ tiêu hóa mà còn là trải nghiệm ăn uống đúng phẩm giá. Ngay cả thức ăn mềm cũng nên được trình bày với màu sắc và hình dạng nhận ra được để người cao tuổi vẫn có thể thưởng thức bữa ăn. Thường xuyên hỏi về sở thích và tình trạng sức khỏe để đảm bảo bữa ăn tiếp tục đáp ứng đúng nhu cầu.'}

  /* Lv17 家庭幫傭實務料理 */
  {
    title:{zh:'家庭幫傭實務料理完全指南',en:'Household Helper Practical Cooking Complete Guide',id:'Panduan Lengkap Masakan Praktis Asisten Rumah Tangga',vi:'Hướng dẫn toàn diện Nấu ăn Thực tiễn cho Người giúp việc'},
    visual:{
      title:{zh:'幫傭廚房工作流程：從採購到上桌',en:'Helper Kitchen Workflow: From Shopping to Table'},
      html:`<div style="display:flex;flex-direction:column;gap:5px">
        <div style="background:#e3f2fd;border-left:4px solid #2196f3;border-radius:0 8px 8px 0;padding:8px">
          <div style="font-size:12px;font-weight:600;color:#1565c0">① 溝通確認</div>
          <div style="font-size:10.5px;color:#333;line-height:1.6">與雇主確認菜單・人數・飲食禁忌・預算</div>

        <div style="background:#e8f5ee;border-left:4px solid #4caf50;border-radius:0 8px 8px 0;padding:8px">

          <div style="font-size:10.5px;color:#333;line-height:1.6">列清單・比價挑新鮮・保留所有收據・如實回報花費</div>

          <div style="font-size:12px;font-weight:600;color:#e65100">③ 備料mise en place</div>

    sections:[
      {
        heading:{zh:'跨文化飲食適應能力',en:'Cross-Cultural Dietary Adaptation'},
        body:{zh:'家庭幫傭常需在異文化環境中提供餐飲服務，跨文化飲食適應是核心能力。首要原則：以雇主家庭的飲食偏好為主，不以自己家鄉的習慣為準。學習步驟：①主動詢問雇主喜好的料理類型與口味偏好②觀察家庭日常用餐習慣（飲食時間、份量、禁忌）③學習當地常見食材與基本料理方法④遇到不熟悉的食材或料理，誠實告知並主動學習，勝過假裝熟練。尊重飲食禁忌（如宗教飲食規定、過敏原）是職業素養的基本要求。',
         en:'Household helpers often provide food service in cross-cultural environments — dietary adaptation is a core competency. The primary principle: follow the employer family\'s food preferences, not your own home country habits. Learning steps: ① Proactively ask about preferred cuisine types and flavor preferences ② Observe daily household eating habits (meal times, portions, restrictions) ③ Learn local common ingredients and basic cooking methods ④ When facing unfamiliar ingredients or dishes, be honest and proactively learn — this is always better than pretending to know. Respecting dietary restrictions (religious dietary laws, allergens) is a fundamental professional requirement.',
         id:'Pembantu rumah tangga sering memberikan layanan makan di lingkungan lintas budaya — adaptasi diet adalah kompetensi inti. Prinsip utama: ikuti preferensi makan keluarga majikan, bukan kebiasaan kampung halaman sendiri. Langkah belajar: ① Tanyakan secara proaktif tentang jenis masakan dan preferensi rasa yang disukai ② Amati kebiasaan makan rumah tangga sehari-hari ③ Pelajari bahan-bahan umum setempat dan metode memasak dasar ④ Saat menghadapi bahan atau masakan yang tidak familiar, jujurlah dan belajar secara proaktif. Menghormati pantangan diet (hukum diet agama, alergen) adalah persyaratan profesional dasar.',
         vi:'Người giúp việc gia đình thường cung cấp dịch vụ ăn uống trong môi trường đa văn hóa — khả năng thích nghi ẩm thực là năng lực cốt lõi. Nguyên tắc chính: tuân theo sở thích ăn uống của gia đình chủ, không dựa vào thói quen quê hương của mình. Các bước học hỏi: ① Chủ động hỏi về loại ẩm thực và khẩu vị ưa thích ② Quan sát thói quen ăn uống hàng ngày của gia đình ③ Học các nguyên liệu địa phương phổ biến và phương pháp nấu cơ bản ④ Khi gặp nguyên liệu hoặc món ăn không quen, hãy thành thật và chủ động học hỏi. Tôn trọng các hạn chế ăn uống (luật ăn kiêng tôn giáo, chất gây dị ứng) là yêu cầu nghề nghiệp cơ bản.'}
      },
      {
        heading:{zh:'採購誠信與財務透明',en:'Shopping Integrity & Financial Transparency'},
        body:{zh:'採購管理是幫傭最容易引發雇主信任問題的環節。專業做法的三大原則：①依照雇主確認的菜單或清單採購，不自行增減項目②保留所有購物收據，詳細記錄每筆花費，剩餘零錢全數如實繳回③如需自行判斷（如食材售罄需替換），立即告知雇主並說明替換原因。誠信不只是道德要求，更是建立長期雇傭關係的基礎。一旦財務不透明，即使只是一次失誤，都可能永久損害雙方信任。',
         en:'Grocery management is the area most likely to create trust issues between helpers and employers. Three principles of professional practice: ① Shop according to the employer\'s confirmed menu or list — don\'t add or remove items on your own ② Keep all receipts, record every expense in detail, and return all change honestly ③ If independent judgment is needed (e.g. an ingredient is sold out and must be substituted), inform the employer immediately and explain the reason. Integrity isn\'t just a moral requirement — it\'s the foundation of a long-term employment relationship. Even a single instance of financial opacity can permanently damage mutual trust.',
         id:'Manajemen belanja adalah area yang paling mungkin menimbulkan masalah kepercayaan antara pembantu dan majikan. Tiga prinsip praktik profesional: ① Belanja sesuai menu atau daftar yang dikonfirmasi majikan ② Simpan semua kuitansi, catat setiap pengeluaran secara terperinci, dan kembalikan semua kembalian dengan jujur ③ Jika penilaian mandiri diperlukan, beri tahu majikan segera dan jelaskan alasannya. Integritas bukan hanya persyaratan moral — ini adalah fondasi hubungan kerja jangka panjang.',
         vi:'Quản lý mua sắm là lĩnh vực dễ gây ra vấn đề tin tưởng giữa người giúp việc và chủ nhà nhất. Ba nguyên tắc thực hành chuyên nghiệp: ① Mua sắm theo thực đơn hoặc danh sách đã xác nhận của chủ, không tự thêm bớt ② Giữ tất cả hóa đơn, ghi lại từng khoản chi tiết và trả lại toàn bộ tiền thừa một cách trung thực ③ Nếu cần tự phán đoán, hãy thông báo cho chủ ngay và giải thích lý do. Trung thực không chỉ là yêu cầu đạo đức — đó là nền tảng của quan hệ lao động lâu dài.'}
      }
    ],

    tip:{zh:'💡 優秀的家庭幫傭廚師有三項核心素養：①廚藝技能（持續學習當地料理）②溝通能力（清楚表達、主動詢問）③職業誠信（財務透明、承諾必守）。廚藝可以透過練習快速提升，但誠信與溝通才是建立長期信任關係、讓自己在職場上不可取代的根本。',
     en:"💡 An excellent household cooking helper has three core qualities: ① Culinary skills (continuously learning local cuisine) ② Communication ability (express clearly, ask proactively) ③ Professional integrity (financial transparency, keeping commitments). Cooking skills can improve quickly through practice, but integrity and communication are what build long-term trust and make you irreplaceable in the workplace.",
     id:'💡 Pembantu masak rumah tangga yang unggul memiliki tiga kualitas inti: ① Keterampilan memasak (terus belajar masakan lokal) ② Kemampuan komunikasi (ungkapkan dengan jelas, tanya secara proaktif) ③ Integritas profesional (transparansi keuangan, menepati komitmen). Keterampilan memasak dapat ditingkatkan dengan cepat melalui latihan, tetapi integritas dan komunikasi yang membangun kepercayaan jangka panjang.',
     vi:'💡 Người giúp việc nấu ăn gia đình xuất sắc có ba phẩm chất cốt lõi: ① Kỹ năng nấu ăn (liên tục học ẩm thực địa phương) ② Khả năng giao tiếp (diễn đạt rõ ràng, hỏi chủ động) ③ Liêm chính nghề nghiệp (minh bạch tài chính, giữ cam kết). Kỹ năng nấu ăn có thể cải thiện nhanh qua thực hành, nhưng liêm chính và giao tiếp mới là điều xây dựng niềm tin lâu dài và khiến bạn không thể thay thế trong công việc.'}

    visual:{

    items:[
      {icon:'🍵',zh:'軟質餐（Level 6）製備要點',en:'Soft Diet (Level 6) Preparation Key Points',desc:{zh:'目標：叉子可壓扁，舌頭可輕易碾碎。切割：所有食材切成1.5cm以下。烹調：延長烹調時間使食材充分軟化。避免：硬殼類（蝦殼、魚骨）、纖維粗糙的蔬菜（芹菜莖、竹筍）、堅果種子、口感脆硬的食物（薯片、生菜）。適合族群：咀嚼力下降但吞嚥功能正常的長者。',en:'Goal: can be mashed by fork, tongue can easily crush. Cut all ingredients to ≤1.5cm. Extend cooking time to soften thoroughly. Avoid: shells (shrimp shell, fish bones), coarse fibrous vegetables (celery stalks, bamboo shoots), nuts and seeds, crispy hard foods. Suitable for: seniors with reduced chewing ability but normal swallowing.'}},
      {icon:'🥣',zh:'碎食餐（Level 5）製備要點',en:'Minced & Moist Diet (Level 5) Preparation Key Points',desc:{zh:'目標：食材切碎至4mm以下，質地柔軟濕潤能黏合成糰。製作步驟：①煮熟至軟②以食物剪或刀切碎至4mm以下③確認質地柔軟能黏合④適量加入醬汁或湯汁保持濕潤。避免：混合不同質地（如有固體的湯品）、乾燥鬆散食物（炒飯、麵包屑）、黏性食物（糯米、麻糬）、長條纖維（豆芽、芹菜）。',en:'Goal: food cut to ≤4mm, soft and moist, coheres together. Steps: ① cook until soft ② cut with food scissors or knife to ≤4mm ③ confirm soft texture that coheres ④ add appropriate sauce or broth to maintain moisture. Avoid: mixed textures (soups with solid chunks), dry crumbly foods (fried rice, breadcrumbs), sticky foods (glutinous rice, mochi), long fibres.'}},
      {icon:'🫙',zh:'泥狀餐（Level 4）製備要點',en:'Purée Diet (Level 4) Preparation Key Points',desc:{zh:'目標：質地均勻光滑、無顆粒、無纖維、不分層、以湯匙盛取保持形狀。製作步驟：①食材充分煮熟②用食物調理機完全打碎③必要時加入高湯或水調整稠度④以細網篩過濾確保無顆粒⑤盛盤時用模具塑形（維持尊嚴）。增稠技巧：用馬鈴薯泥、南瓜泥或玉米澱粉增加稠度。注意：每類食物分開處理，避免混色混味。',en:'Goal: smooth, homogenous, no lumps, no fibres, does not separate, holds shape on spoon. Steps: ① cook thoroughly ② blend completely in food processor ③ add stock or water if needed to adjust consistency ④ strain through fine-mesh sieve ⑤ use moulds for plating (to maintain dignity). Thickening tips: use mashed potato, pumpkin purée, or cornstarch. Note: process each food separately to preserve color and flavor.'}},
      {icon:'💊',zh:'糖尿病餐飲原則',en:'Diabetic Diet Principles',desc:{zh:'①定時定量：每天固定三餐，必要時加兩次點心，避免血糖大幅波動。②選低GI食物：糙米、燕麥、地瓜、豆類（GI≤55）取代白米飯、白麵包。③均衡搭配：每餐應有蛋白質（抑制血糖上升）＋蔬菜（膳食纖維）＋低GI主食。④限制精製糖：避免含糖飲料、甜點、果汁（即使天然水果也應控量）。⑤控制份量：使用標準份量容器（如量米杯）避免主食過量。⑥烹調方式：蒸煮優於油炸，避免勾芡濃醬（澱粉增加GI）。',en:'① Regular timing and portions: fixed three meals daily, optional two snacks, avoiding blood sugar swings. ② Low-GI foods: brown rice, oats, sweet potato, legumes (GI≤55) instead of white rice/bread. ③ Balanced plate: each meal needs protein (slows glucose rise) + vegetables (dietary fiber) + low-GI staple. ④ Limit refined sugar: avoid sugary drinks, desserts, juice. ⑤ Portion control. ⑥ Cooking: steaming and boiling over frying; avoid heavy starchy sauces.'}},
      {icon:'🫘',zh:'腎臟病餐飲原則',en:'Renal Diet Principles',desc:{zh:'三限一補原則：①限鉀：高鉀蔬果先去皮切小、大量清水煮沸棄湯（去鉀法）。高鉀食物避免：香蕉、柳橙、番茄、菠菜、堅果。②限磷：避免乳製品、堅果、加工食品、含磷添加物（看標籤中的「磷酸」成分）。③限鈉（鹽）：減少醬油、味精、加工食品，用天然香料增味。④補充優質蛋白：雞蛋白、魚肉、瘦肉（依醫師指示份量）。⚠️重要：腎臟病飲食須依個別抽血報告調整，務必諮詢腎臟科醫師與腎臟病衛教師，切勿自行調整。',en:'Three-limit principle: ① Limit potassium: peel and dice vegetables, boil in large amounts of water and discard the liquid (potassium-leaching method). High-K foods to avoid: banana, orange, tomato, spinach, nuts. ② Limit phosphorus: avoid dairy, nuts, processed food, phosphate additives. ③ Limit sodium: reduce soy sauce, MSG, processed food; use natural aromatics. ④ Quality protein: egg whites, fish, lean meat (per physician guidance). ⚠️ Important: renal diet must be adjusted per individual lab results. Always consult the nephrologist and renal dietitian.'}}

    tip:{zh:'💡 長照餐飲的核心是「安全第一、尊嚴第二」：安全是指預防嗆咳吸入性肺炎（長照機構第一死因之一）；尊嚴是指讓長輩仍能感受到飲食的樂趣——即使是泥狀餐，也可以用模具塑形成食材原形，讓長輩看到「這是魚」「這是青菜」，維持進食的期待與愉悅感。每一口食物都是生活品質的體現。',
     en:"💡 The core of long-term care catering is 'safety first, dignity second': safety means preventing aspiration pneumonia (one of the top causes of death in care facilities); dignity means letting seniors still enjoy the pleasure of eating — even purée meals can be shaped with moulds to resemble the original food, so seniors can see 'this is fish', 'this is vegetables', maintaining anticipation and joy at mealtimes. Every bite reflects quality of life.",
     id:'💡 Inti dari katering perawatan jangka panjang adalah "keamanan dulu, martabat kedua": keamanan berarti mencegah pneumonia aspirasi; martabat berarti membiarkan lansia masih merasakan kesenangan makan — bahkan makanan pure bisa dibentuk seperti makanan aslinya.',
     vi:'💡 Cốt lõi của ăn uống trong chăm sóc dài hạn là "an toàn trước, phẩm giá sau": an toàn là phòng ngừa viêm phổi hít sặc; phẩm giá là để người cao tuổi vẫn cảm nhận được niềm vui ăn uống — ngay cả cơm nghiền cũng có thể tạo hình giống thực phẩm gốc bằng khuôn, để người cao tuổi thấy "đây là cá", "đây là rau".'}

  /* Lv19 外籍幫傭廚房溝通 */
  {
    title:{zh:'外籍幫傭廚房溝通完整指南',en:'Kitchen Communication Guide for Foreign Helpers',id:'Panduan Komunikasi Dapur untuk Pembantu Asing',vi:'Hướng dẫn giao tiếp bếp núc cho người giúp việc nước ngoài'},
    visual:{

    items:[
      {icon:'🗣️',zh:'口頭交辦理解技巧',en:'Understanding Verbal Instructions',desc:{zh:'①聽完整句再反應：不要雇主說到一半就回答，先聽完全句再確認。②複述確認：「所以您要我先炒蔥蒜，再放雞肉，最後加醬油，對嗎？」③不懂馬上問：不要假裝聽懂，立即提問比做錯更好。④善用輔助工具：手機翻譯APP（Google翻譯）、廚房術語雙語卡。⑤記錄要點：隨身帶小筆記本，將常用指示與食材名稱記下來。',en:'① Listen to complete sentences before responding. ② Repeat back to confirm: "So you want me to fry garlic first, then add chicken, finally add soy sauce — is that right?" ③ Ask immediately if unsure — asking beats doing it wrong. ④ Use tools: translation app (Google Translate), bilingual kitchen vocabulary cards. ⑤ Take notes: carry a small notebook to write down common instructions and ingredient names.'}},
      {icon:'📋',zh:'菜單識讀關鍵詞',en:'Menu Reading Key Terms',desc:{zh:'烹調方式詞：清蒸（Steam）、紅燒（Braise in soy sauce）、炒（Stir-fry）、燜（Slow braise covered）、炸（Deep-fry）、涼拌（Cold-dressed）、煎（Pan-fry）、烤（Bake/Roast）。食材狀態詞：切片（Sliced）、切丁（Diced）、切絲（Julienned）、剁碎（Minced）、整塊（Whole piece）、去骨（Deboned）。調味詞：鹹淡適中（Moderate salt）、少鹽（Low sodium）、不辣（No spice）、微辣（Mildly spicy）。數量詞：一人份（For one）、兩人份（For two）、一大鍋（A big pot）。',en:'Cooking terms: 清蒸(Steam), 紅燒(Braise in soy sauce), 炒(Stir-fry), 燜(Slow braise), 炸(Deep-fry), 涼拌(Cold-dressed), 煎(Pan-fry), 烤(Bake/Roast). Ingredient prep: 切片(Sliced), 切丁(Diced), 切絲(Julienned), 剁碎(Minced), 整塊(Whole), 去骨(Deboned). Seasoning: 鹹淡適中(Moderate salt), 少鹽(Low sodium), 不辣(No spice), 微辣(Mildly spicy). Quantity: 一人份(For one), 兩人份(For two).'}},
      {icon:'🛒',zh:'採購清單溝通策略',en:'Shopping List Communication Strategies',desc:{zh:'①拿到清單立刻確認：逐項確認不懂的食材名稱，不要到了市場才發現不認識。②拍照記憶：若雇主有特定品牌或包裝，請雇主拍照讓你比對。③不確定時買對的：遇到不熟悉食材，可以用手機查圖片後請店員協助，或向雇主發送現場照片確認。④記錄價格：保留所有收據，若有估算誤差主動說明。⑤替代品處理：若食材缺貨，立即用即時通訊告知雇主，詢問是否有可接受的替代品。',en:'① Confirm immediately upon receiving the list: go through each unfamiliar item before leaving. ② Photo reference: ask employer to photograph specific brands or packaging. ③ When unsure: search images on phone, ask store staff for help, or send a photo to the employer for confirmation. ④ Record prices: keep all receipts; proactively explain any budget differences. ⑤ Handling substitutions: if an item is out of stock, immediately notify the employer via messaging and ask about acceptable alternatives.'}},
      {icon:'🏷️',zh:'食材標示解讀重點',en:'Key Points for Reading Food Labels & Packaging',desc:{zh:'①效期（保存期限）：格式通常為年/月/日（2025/12/31）或月/年，過期不買。②淨重（Net Weight）：實際食材重量，排除包裝重量，採購計算用此數字。③過敏原標示：台灣規定11大類需標示，購買前需核對家庭成員的過敏項目。④成分表（Ingredients）：排列順序代表含量多寡（第一個最多），可判斷是否含特定食材。⑤營養標示：糖尿病患注意「碳水化合物（糖）」，腎臟病患注意「鈉」與「磷」的含量。⑥原產地：部分雇主有特定偏好（如台灣本地食材）。',en:'① Expiry date: usually in Y/M/D format (2025/12/31) or M/Y; never buy expired products. ② Net weight: actual food weight excluding packaging; use this number for calculations. ③ Allergen labels: Taiwan mandates 11 categories; check against family members\' allergies before purchase. ④ Ingredients list: listed in descending order by amount; helps identify specific components. ⑤ Nutrition facts: diabetics check "carbohydrates/sugars"; renal patients check sodium and phosphorus. ⑥ Country of origin: some employers have specific preferences.'}},
      {icon:'⚠️',zh:'過敏與飲食禁忌溝通',en:'Communicating Allergies & Dietary Restrictions',desc:{zh:'①主動詢問：入職初期主動詢問家庭成員的食物過敏原、不耐症、宗教飲食禁忌與個人偏好，並記錄在個人備忘錄中。②標記高風險食材：在廚房備忘板上標示「禁用食材」清單（如蝦蟹過敏、堅果過敏）。③採購時逐項確認：特別注意加工食品標籤中的隱藏過敏原（如「含牛奶衍生物」「可能含堅果」）。④烹調時徹底清潔：若需料理過敏原食材（如為其他人），確保砧板、刀具、鍋具完全洗淨後再處理。⑤不確定就詢問，不猜測。',en:'① Ask proactively: at the start of employment, actively ask about each family member\'s food allergies, intolerances, religious dietary rules, and personal preferences — write them down. ② Label high-risk ingredients: post a "forbidden ingredients" list on the kitchen board. ③ Check labels when shopping: pay special attention to hidden allergens in processed foods. ④ Thorough cleaning: if cooking allergen foods for others, fully wash boards, knives, and pots before handling. ⑤ Ask when unsure, never guess.'}}

     en:"💡 Language is the most powerful kitchen tool. Even without perfect fluency, 'an attitude of honest communication' is itself the highest professional quality — what employers most appreciate is not perfect Chinese, but the phrase 'I'm not sure, may I confirm?' Learning 3–5 new kitchen vocabulary words per week and using them in practice will lead to significant improvement in kitchen communication skills within three months.",

    items:[
      {icon:'⚠️',zh:'台灣11大特定過敏原完整清單',en:'Taiwan\'s 11 Specified Allergens — Complete List',desc:{zh:'①甲殼類：蝦、蟹、龍蝦（含蝦醬、蝦米）②蛋：雞蛋、鴨蛋及蛋製品（蛋黃醬、蛋白霜）③魚：所有魚類及魚製品（魚露、魚板）④奶（牛乳）：牛奶及乳製品（奶油、起司、優格）⑤花生：花生及花生製品（花生醬、花生油）⑥大豆：豆腐、豆漿、醬油（含大豆）、味噌⑦堅果類：腰果、杏仁、核桃、夏威夷豆、開心果（含堅果油）⑧芒果：新鮮芒果及含芒果成分加工品⑨芝麻：白/黑芝麻、麻油、芝麻醬（tahini）⑩蕎麥：蕎麥麵、蕎麥茶、含蕎麥澱粉製品⑪亞硫酸鹽（≥10ppm）：葡萄酒、乾果、部分醃漬品及蝦類（防腐劑）。注意：花生屬豆科（非堅果類），對花生過敏者不一定對堅果類過敏，反之亦然。',en:'① Crustaceans: shrimp, crab, lobster (incl. shrimp paste, dried shrimp) ② Eggs: chicken/duck eggs and products (mayo, meringue) ③ Fish: all fish and fish products (fish sauce, fish cake) ④ Milk (cow): milk and dairy (butter, cheese, yogurt) ⑤ Peanuts: peanuts and products (peanut butter, peanut oil) ⑥ Soybeans: tofu, soy milk, soy sauce, miso ⑦ Tree nuts: cashew, almond, walnut, macadamia, pistachio (incl. nut oils) ⑧ Mango: fresh mango and mango-containing processed products ⑨ Sesame: white/black sesame, sesame oil, tahini ⑩ Buckwheat: soba noodles, buckwheat tea, buckwheat starch products ⑪ Sulfites (≥10ppm): wine, dried fruit, some pickled products, shrimp (preservative). Note: peanuts are legumes (not tree nuts) — peanut allergy ≠ tree nut allergy.'}},
      {icon:'🕌',zh:'宗教飲食禁忌對照表',en:'Religious Dietary Restrictions Reference',desc:{zh:'【清真（Halal）—— 伊斯蘭教】禁：豬肉及一切衍生物（豬油、明膠、豬骨高湯）、酒精（含料理酒）、非清真屠宰的肉類、血。可：雞/牛/羊肉（清真屠宰）、魚海鮮、蔬果、米麥。\n【猶太飲食（Kosher）—— 猶太教】禁：豬肉、海鮮貝類、肉奶同食（需間隔數小時）、非潔食屠宰肉類。\n【全素（全植物性）—— 佛教】禁：所有肉類（含魚）、蛋、奶、五辛（蔥蒜韭薤洋蔥）。\n【蛋奶素（Lacto-Ovo Vegetarian）】禁：肉類（含魚）。可：蛋、奶、蔬果。\n【純素（Vegan，非宗教）】禁：所有動物性產品（肉、蛋、奶、蜂蜜）。\n⚠️ 確認前請務必直接詢問當事人，宗教飲食習慣有個人差異。',en:'[Halal — Islam] Forbidden: pork and all derivatives (lard, gelatin, pork broth), alcohol (incl. cooking wine), non-Halal-slaughtered meat, blood. Permitted: chicken/beef/lamb (Halal-slaughtered), fish, produce, rice/wheat.\n[Kosher — Judaism] Forbidden: pork, shellfish, mixing meat and dairy (hours apart), non-kosher-slaughtered meat.\n[Full Vegan — Buddhism] Forbidden: all meat (incl. fish), eggs, dairy, Five Pungent Roots (scallion, garlic, chives, shallot, onion).\n[Lacto-Ovo Vegetarian] Forbidden: all meat (incl. fish). Permitted: eggs, dairy.\n[Vegan — secular] Forbidden: all animal products (meat, eggs, dairy, honey).\n⚠️ Always ask the individual directly — religious dietary practices vary personally.'}},
      {icon:'🔬',zh:'過敏原的隱藏來源——容易被忽略的食材',en:'Hidden Allergen Sources — Often Overlooked',desc:{zh:'【花生】：棒棒糖、部分人造奶油、花生油（精煉後通常無過敏原但仍有風險）、亞洲醬料（沙嗲醬、打拋醬）。【牛奶】：部分麵包（奶油內餡）、餅乾、巧克力、火腿（乳酸）、人造奶油（可能含乳蛋白）。【雞蛋】：麵包屑（日式パン粉含蛋）、義大利麵（新鮮蛋麵）、蛋黃醬（沙拉醬）、部分義式薄餅（Wafer）。【麩質/小麥】：醬油（傳統釀造含小麥）、烏斯特醬（Worcestershire）、部分味噌、食醋（麥芽醋）、肉類加工品（炸雞麵衣）。【大豆】：豆腐、毛豆、醬油、味噌、韓式辣椒醬（含大豆）。⚠️原則：「含過敏原成分」比「可能含有」的風險更高；過敏者對後者也應謹慎。',en:'[Peanuts]: lollipops, some margarines, peanut oil (refined may be safe but still risky), Asian sauces (satay, pad thai sauce). [Milk]: some bread (butter fillings), cookies, chocolate, ham (lactic acid), margarine. [Eggs]: Japanese breadcrumbs (panko contains egg), fresh pasta, mayonnaise, some wafers. [Gluten/Wheat]: traditional soy sauce, Worcestershire sauce, some miso, malt vinegar, processed meat (fried chicken coating). [Soy]: tofu, edamame, soy sauce, miso, Korean hot pepper paste.'}},
      {icon:'🏷️',zh:'過敏原標示閱讀技巧',en:'How to Read Allergen Labels',desc:{zh:'台灣食品標示規定：①過敏原必須在「成分」欄位或另立「過敏原資訊」欄標示②警告文句如「本品含有OO」「可能含有OO痕量」需注意區別——「含有」代表確定存在；「可能含有痕量」代表工廠有交叉接觸風險（嚴重過敏者需避免）。閱讀步驟：①先找「過敏原資訊」或「注意」欄位②逐一核對家庭過敏原清單③查看成分表中的細項（如「植物油」是否含花生油、醬油是否為傳統含麥版本）④不確定就不買，或聯絡廠商確認。注意：進口食品過敏原標示規範與台灣不同，需更謹慎。',en:'Taiwan food labeling rules: ① allergens must appear in the ingredients or a separate "Allergen Information" field ② "Contains OO" (confirmed present) vs "May contain traces of OO" (cross-contact risk at factory; severe allergy sufferers should avoid both). Reading steps: ① find "Allergen Information" or "Caution" section first ② cross-check against the household allergen list ③ scan ingredient details (e.g. is "vegetable oil" peanut oil? Is the soy sauce a traditional wheat-containing version?) ④ if unsure, don\'t buy or contact the manufacturer. Note: imported food allergen labeling differs from Taiwan standards — be extra cautious.'}},
      {icon:'🛡️',zh:'廚房過敏管理完整操作流程',en:'Complete Kitchen Allergen Management Procedure',desc:{zh:'【準備階段】①確認家庭過敏原清單並貼在廚房明顯位置②採購前核對所有食材標示③為過敏者備份獨立廚具（砧板、刀、鍋、碗盤），並以顏色標記（如藍色=無花生）。【烹調階段】①過敏者的食物最先備製（此時廚具最乾淨）②烹調中避免同一器具接觸不同過敏等級食物③油炸食品：使用全新食用油，獨立炸鍋④烹調過敏原食品（如蝦）時注意飛濺。【盛裝階段】①過敏者的餐點獨立盛裝，標記清楚②不混放於同一容器③上桌前再次確認食材來源。【緊急應對】①熟記過敏症狀②知道EpiPen存放位置③確認119急救流程。',en:'[Preparation] ① Confirm allergen list and post in visible kitchen area ② check all food labels before shopping ③ dedicated utensils for allergy sufferers (boards, knives, pots, plates) color-coded. [Cooking] ① cook allergen-free food FIRST (utensils cleanest) ② avoid same utensil contacting different allergen categories ③ deep-frying: use fresh oil in a dedicated fryer ④ watch for splashing when cooking allergens. [Plating] ① plate allergen-free food separately and label clearly ② no mixing in same container ③ confirm ingredients once more before serving. [Emergency] ① memorize allergy symptoms ② know where EpiPen is stored ③ know the 119 emergency procedure.'}}

    tip:{zh:'💡 食物過敏的黃金守則：「寧可問清楚，不要猜。」在過敏管理中，任何猜測都是風險。即使是「很可能沒有」的過敏原也必須確認。廚房工作者對過敏的正確態度是：把每一個過敏聲明當作生命攸關的資訊認真對待——因為對某些人來說，它確實就是。',
     en:"💡 The golden rule of food allergy management: 'Ask rather than guess.' Any assumption in allergen management is a risk. Even a 'very unlikely' allergen must be confirmed. The correct kitchen attitude toward allergy is to treat every allergy declaration as life-critical information — because for some people, it truly is.",

function applyI18N(){
  document.querySelectorAll('[data-i]').forEach(function(el){
    var k=el.getAttribute('data-i');
    var v=t(k);
    if(v)el.textContent=v;
  });
}

function calcPct(){
  var total=0,done=0;
  MODS.forEach(function(m){total+=getTotal(m);done+=getDoneCount(m);});
  return total>0?Math.round(done/total*100):0;
}

function updateProgressUI(){
  var p=calcPct();
  var fill=document.getElementById('hero-prog-fill');
  var label=document.getElementById('hero-prog-label');
  if(fill) fill.style.width=p+'%';
  if(label) label.textContent='整體 '+p+'%';
}

function buildSidebar(){
  var el=document.getElementById('sb-modules');
  if(!el)return;
  var html='';
  MODS.forEach(function(m,i){
    var label=m.titles[curLang]||m.titles.zh;
    var isDone=isModDone(m);
    var isAct=(i===curMod && curView==='levels');

function switchLesTab(btn,name){
  var lesbody=btn.closest('.lesbody');
  if(!lesbody)return;
  lesbody.querySelectorAll('.les-tab').forEach(function(b){b.classList.remove('act')});
  btn.classList.add('act');
  lesbody.querySelectorAll('.les-tabpanel').forEach(function(p){p.classList.remove('act')});
  var panel=lesbody.querySelector('#les-tab-'+name);
  if(panel)panel.classList.add('act');
}

function toggleTopicDone(modIdx,topicIdx,tickEl){
  var m=MODS[modIdx];
  var tp=m.topics[topicIdx];
  var row=tickEl.closest('.trow');
  var dotEl=row?row.querySelector('.tdot'):null;
  var tagEl=row?row.querySelector('.ttag'):null;
  var isDone=tickEl.classList.contains('checked');
  if(isDone){
    tp.s=0;
    tickEl.classList.remove('checked');tickEl.textContent='';tickEl.title=t('topic.mark');
    if(dotEl)dotEl.className='tdot dot-next';
    if(tagEl){tagEl.className='ttag tag-nx';tagEl.textContent=t('tag.next');}
  }else{
    tp.s=2;
    tickEl.classList.add('checked');tickEl.textContent='✓';tickEl.title=t('topic.unmark');
    if(dotEl)dotEl.className='tdot dot-done';
    if(tagEl){tagEl.className='ttag tag-done';tagEl.textContent=t('tag.done');}
  }
  // done 由 getDoneCount(m) 動態計算，無需手動同步
  updateProgressUI();buildSidebar();buildLevelPath();
}

function renderQuiz(){
  var qi_set=Math.min(curMod,QUIZZES.length-1);

  var qi=quizState.q%qs.length;

  var totalQ=qs.length;
  var curQNum=qi+1;
  var pct=Math.round(quizState.q/totalQ*100);

  var html='<div class=\"sechd\"><h2>'+t('quiz.title')+' — '+MODS[curMod].titles[curLang]+'</h2><div class=\"ln\"></div></div>';

  // 進度區塊

  html+='<div class=\"quiz-prog-row\">';
  var qCounterLabel=curLang==='en'?('Q '+curQNum):curLang==='id'?('Soal '+curQNum):curLang==='vi'?('Câu '+curQNum):('第 '+curQNum+' 題');
  var qTotalLabel=curLang==='en'?('/'+totalQ):curLang==='id'?('/'+totalQ):curLang==='vi'?('/'+totalQ):('共'+totalQ+'題');

  html+='<span style=\"font-size:13px;font-weight:600;color:#8a2800;margin-left:3px\">'+quizState.score+'</span>';
  html+='<span style=\"font-size:11px;color:var(--color-text-tertiary);margin-left:1px\"> / '+totalQ+'</span>';
  html+='</div>';
  // 第二行：進度點點
  html+='<div class=\"quiz-dots\">';
  for(var di=0;di<totalQ;di++){
    var dotCls='quiz-dot';
    if(di<quizState.q) dotCls+=' done';
    else if(di===quizState.q) dotCls+=' cur';
    html+='<div class=\"'+dotCls+'\" title=\"第'+(di+1)+'題\"></div>';
  }
  html+='</div>';
  // 第三行：進度條
  html+='<div class=\"quiz-prog-row\">';
  html+='<div class=\"qptrack\"><div class=\"qpfill\" style=\"width:'+pct+'%\"></div></div>';
  html+='<span class=\"quiz-prog-label\">'+pct+'%</span>';
  html+='</div>';
  html+='</div>';

  html+='<div class=\"quiz-wrap\"><div class=\"quiz-q\">'+(q.q[curLang]||q.q.zh)+'</div>';
  html+='<div class=\"quiz-opts\">';
  q.opts.forEach(function(o,oi){
    html+='<button class=\"qopt\" onclick=\"answerQ(this,'+o.ok+',\''+encodeURIComponent(q.fb[curLang]||q.fb.zh)+'\')\">'+(o[curLang]||o.zh)+'</button>';

  html+='</div><div class=\"quiz-fb\" id=\"quiz-fb\"></div></div>';
  html+='<div class=\"quick\"><button class=\"qbtn pri\" id=\"quiz-next-btn\" style=\"display:none\" onclick=\"nextQ()\">'+t('quiz.next')+'</button></div>';
  return html;
}

// ── P4 LocalStorage 進度保存與載入（schemaVersion 防升級炸裂）──
var LS_KEY='culinary_platform_progress';
var LS_SCHEMA_VERSION=1;
function saveProgress(){
  try{
    var payload={
      version:LS_SCHEMA_VERSION,
      // 只存 topics[].s（0/1/2），不存 done（動態計算）
      data:MODS.map(function(m){
        return{topics:m.topics.map(function(tp){return tp.s||0})};
      })
    };
    localStorage.setItem(LS_KEY,JSON.stringify(payload));
  }catch(e){}
}
function loadProgress(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    var payload=JSON.parse(raw);

    // schemaVersion 相容處理
    if(payload && typeof payload.version==='number'){
      // 現行 schema v1
      if(payload.version===LS_SCHEMA_VERSION && Array.isArray(payload.data)){
        payload.data.forEach(function(saved,i){
          if(!MODS[i])return;
          var m=MODS[i];
          (saved.topics||[]).forEach(function(s,ti){
            if(m.topics[ti])m.topics[ti].s=s;
          });
        });
      } else {
        // 未知版本 → 捨棄，不讀取（避免結構錯亂）
        console.warn('[loadProgress] 未知 schema version:',payload.version,', 清空舊資料');
        localStorage.removeItem(LS_KEY);
      }
    } else if(Array.isArray(payload)){
      // 相容舊版（無 version 欄位的直接陣列格式）
      payload.forEach(function(saved,i){
        if(!MODS[i])return;
        var m=MODS[i];
        (saved.topics||[]).forEach(function(s,ti){
          if(m.topics[ti])m.topics[ti].s=s;
        });
      });
    }
  }catch(e){
    console.warn('[loadProgress] 解析失敗，略過：',e);
  }
}

function qcShuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}
  return a;
}

function qcStartSession(){
  var pool=[];
  if(qcState.mode==='all'){
    QUIZZES.forEach(function(qs,mi){qs.forEach(function(q,qi){pool.push({q:q,mi:mi,qi:qi});});});
  } else if(qcState.mode==='single'){
    var mi=qcState.selMod;var qs=QUIZZES[mi]||[];
    qs.forEach(function(q,qi){pool.push({q:q,mi:mi,qi:qi});});
  } else if(qcState.mode==='weak'){
    MODS.forEach(function(m,mi){
      var wd=qcState.weakData[mi];if(!wd)return;
      var qs=QUIZZES[mi]||[];
      Object.keys(wd).forEach(function(k){if(wd[k].wrong>0&&qs[k])pool.push({q:qs[k],mi:mi,qi:parseInt(k)});});
    });
    if(!pool.length){alert(t('qc.weak.none'));return;}
  } else {
    QUIZZES.forEach(function(qs,mi){qs.forEach(function(q,qi){pool.push({q:q,mi:mi,qi:qi});});});
  }
  pool=qcShuffle(pool).slice(0,qcState.count);
  if(!pool.length)return;
  qcState.pool=pool;qcState.poolIdx=0;qcState.score=0;qcState.answered=false;qcState.modScores={};
  pool.forEach(function(p){
    if(!qcState.modScores[p.mi])qcState.modScores[p.mi]={correct:0,total:0};
    qcState.modScores[p.mi].total++;
  });
  document.getElementById('content').innerHTML=renderQCQuiz();
}

function qcAnswerQ(btn,isOk,mi,qi,fbEnc){
  if(qcState.answered)return;
  qcState.answered=true;
  btn.classList.add(isOk?'correct':'wrong');
  if(isOk){qcState.score++;qcState.modScores[mi].correct++;}
  if(!qcState.weakData[mi])qcState.weakData[mi]={};
  if(!qcState.weakData[mi][qi])qcState.weakData[mi][qi]={wrong:0,attempts:0};
  qcState.weakData[mi][qi].attempts++;
  if(!isOk)qcState.weakData[mi][qi].wrong++;
  qcSaveData();
  btn.closest('.quiz-opts').querySelectorAll('.qopt').forEach(function(b){b.setAttribute('disabled','');b.style.cursor='default';});
  var fb=document.getElementById('quiz-fb');if(fb)fb.textContent=decodeURIComponent(fbEnc);
  var nb=document.getElementById('quiz-next-btn');if(nb)nb.style.display='';
}

function qcNextQ(){
  qcState.poolIdx++;qcState.answered=false;
  if(qcState.poolIdx>=qcState.pool.length)qcShowResult();
  else document.getElementById('content').innerHTML=renderQCQuiz();
}

function qcShowResult(){
  var total=qcState.pool.length;var score=qcState.score;
  var pct=Math.round(score/Math.max(1,total)*100);
  var emoji=pct>=90?'🏆':pct>=70?'⭐':pct>=50?'👍':'📖';
  var msg=pct>=90?'太厲害了！':pct>=70?'答得不錯！':pct>=50?'繼續加油！':'多練習幾次吧！';
  var modeLabels={all:'全模組綜合',single:'指定模組',weak:'弱點練習',rand:'隨機抽題'};
  qcHistory.push({mode:qcState.mode,label:modeLabels[qcState.mode],score:score,total:total,ts:Date.now()});
  if(qcHistory.length>30)qcHistory=qcHistory.slice(-30);
  qcSaveData();
  var html='<div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:24px 20px;text-align:center;margin-bottom:14px">';
  html+='<div style="font-size:40px;margin-bottom:10px">'+emoji+'</div>';
  html+='<div style="font-size:15px;font-weight:600;margin-bottom:4px">'+msg+'</div>';
  html+='<div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:16px">'+modeLabels[qcState.mode]+' 完成</div>';
  html+='<div style="display:flex;justify-content:center;gap:12px;margin-bottom:16px">';
  html+='<div style="background:var(--color-background-secondary);border-radius:8px;padding:10px 18px"><div style="font-size:26px;font-weight:700;color:#8a2800;line-height:1">'+score+'</div><div style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px">答對</div></div>';
  html+='<div style="background:var(--color-background-secondary);border-radius:8px;padding:10px 18px"><div style="font-size:26px;font-weight:700;color:var(--color-text-secondary);line-height:1">'+total+'</div><div style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px">總題數</div></div>';
  html+='<div style="background:var(--color-background-secondary);border-radius:8px;padding:10px 18px"><div style="font-size:26px;font-weight:700;color:'+(pct>=70?'#1a7248':'#c0392b')+';line-height:1">'+pct+'%</div><div style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px">正確率</div></div>';
  html+='</div>';
  html+='<div style="height:6px;background:var(--color-background-tertiary);border-radius:3px;overflow:hidden;margin:0 auto;max-width:260px">';
  html+='<div style="height:100%;width:'+pct+'%;background:'+(pct>=70?'#1a7248':'#8a2800')+';border-radius:3px;transition:width .6s ease"></div></div></div>';
  var modKeys=Object.keys(qcState.modScores);
  if(modKeys.length>1){
    html+='<div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:14px;margin-bottom:14px">';
    html+='<div style="font-size:12px;font-weight:600;margin-bottom:10px">'+t('qc.res.breakdown')+'</div>';
    html+='<div class="qr-breakdown">';
    modKeys.forEach(function(k){
      var s=qcState.modScores[k];var mp=Math.round(s.correct/Math.max(1,s.total)*100);
      var col=mp>=70?'#1a7248':'#c0392b';var m=MODS[parseInt(k)];
      html+='<div class="qr-br-row"><span class="qr-br-emoji">'+(m.emoji||'📚')+'</span>';
      html+='<span class="qr-br-label">'+(m.titles[curLang]||m.titles.zh)+'</span>';
      html+='<div class="qr-br-bar"><div class="qr-br-fill" style="width:'+mp+'%;background:'+col+'"></div></div>';
      html+='<span class="qr-br-val">'+s.correct+'/'+s.total+'</span></div>';
    });
    html+='</div></div>';
  }
  html+='<div class="quick" style="justify-content:center">';
  html+='<button class="qbtn pri" onclick="showView(\'home\')">'+t('btn.continue')+'</button>';
  html+='<button class="qbtn" onclick="showView(\'quizcenter\')">再練一次</button></div>';
  document.getElementById('content').innerHTML=html;
}

// 攔截 toggleTopicDone 在每次打勾後自動儲存
var _origToggle=toggleTopicDone;
toggleTopicDone=function(modIdx,topicIdx,tickEl){
  _origToggle(modIdx,topicIdx,tickEl);
  saveProgress();
};

// 首次加載初始化（GitHub Pages: 自動偵測裝置）
loadProgress();
qcLoadData();
autoDetectDevice();   // 依真實視窗寬度選擇 mobile/tablet/desktop
showView('home');
updateStatCounts();
</script>
</div>
</body>
