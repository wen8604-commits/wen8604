<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外籍看護訓練學習平台 v23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ── Tokens ── */
:root{
  --g900:#063D31;--g800:#085041;--g700:#0A6652;--g600:#158866;
  --g500:#1D9E75;--g400:#2FBD8C;--g300:#5DCAA5;--g200:#9FE1CB;
  --g100:#D4F3E8;--g50:#EAF8F2;
  --gray-900:#111;--gray-700:#374151;--gray-600:#4B5563;
  --gray-500:#6B7280;--gray-400:#9CA3AF;--gray-300:#D1D5DB;
  --gray-200:#E5E7EB;--gray-100:#F3F4F6;--gray-50:#F9FAFB;
  --red-700:#B91C1C;--red-500:#EF4444;--red-50:#FEF2F2;--red-100:#FEE2E2;
  --amber-700:#B45309;--amber-50:#FFFBEB;--amber-100:#FEF3C7;
  --blue-700:#1D4ED8;--blue-50:#EFF6FF;--blue-100:#DBEAFE;
  --purple-700:#6D28D9;--purple-50:#F5F3FF;--purple-100:#EDE9FE;
  --white:#fff;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;
  --sh-xs:0 1px 2px rgba(0,0,0,.06);
  --sh-sm:0 1px 4px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.05);
  --sh-md:0 4px 16px rgba(0,0,0,.09);
  --sh-lg:0 8px 28px rgba(0,0,0,.12);
  --font:'Noto Sans TC','Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:#EFF2F7;min-height:100dvh;color:var(--gray-900);font-size:15px}

/* Layout replaced by sidebar CSS above */

/* ═══════ HOME ═══════ */
.home-header{margin-bottom:22px}
.home-kicker{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--g600);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.home-title{font-size:24px;font-weight:900;color:var(--gray-900);line-height:1.3}
.home-sub{margin-top:6px;font-size:13px;color:var(--gray-500);line-height:1.6}
@media(min-width:600px){.home-title{font-size:28px}}

/* ── Overall progress dashboard ── */
.overall-progress{
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-xl);
  padding:18px 20px;margin-bottom:24px;
  box-shadow:var(--sh-sm);
}
.overall-progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.overall-progress-label{font-size:12px;font-weight:800;color:var(--g700);letter-spacing:.4px;text-transform:uppercase}
.overall-progress-reset{
  font-size:11px;font-weight:700;color:var(--gray-400);
  background:none;border:none;cursor:pointer;font-family:var(--font);
  display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;
  transition:all .15s;
}
.overall-progress-reset:hover{color:var(--red-700);background:var(--red-50)}
.progress-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.progress-stat{
  background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--r-md);
  padding:12px;text-align:center;
}
.progress-stat-val{font-size:22px;font-weight:900;color:var(--g800);line-height:1}
.progress-stat-lbl{font-size:11px;color:var(--gray-500);margin-top:5px;font-weight:600}
.overall-bar-wrap{margin-top:14px}
.overall-bar-label{display:flex;justify-content:space-between;margin-bottom:6px}
.overall-bar-text{font-size:12px;color:var(--gray-500);font-weight:600}
.overall-bar-pct{font-size:12px;font-weight:800;color:var(--g700)}
.overall-bar-bg{background:var(--gray-200);border-radius:6px;height:8px;overflow:hidden}
.overall-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--g700),var(--g400));transition:width .4s ease}

/* Unit cards grid */
.section-title{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gray-500);margin-bottom:14px}
.units-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:540px){.units-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.units-grid{grid-template-columns:repeat(2,1fr);gap:14px}}

/* Unit card */
.unit-card{
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);
  overflow:hidden;cursor:pointer;transition:all .18s ease;
  box-shadow:var(--sh-xs);
  display:flex;flex-direction:column;
}
.unit-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--g200)}
.unit-card-top{
  padding:16px 16px 12px;display:flex;align-items:flex-start;gap:12px;flex:1;
}
.unit-card-icon{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:21px;color:#fff;
}
.unit-card-num{
  position:absolute;top:-4px;right:-4px;
  width:18px;height:18px;border-radius:50%;background:#fff;
  font-size:9px;font-weight:900;color:var(--gray-700);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.unit-card-icon-wrap{position:relative;flex-shrink:0}
.unit-card-info{flex:1;min-width:0}
.unit-card-title{font-size:14.5px;font-weight:800;color:var(--gray-900);line-height:1.35;margin-bottom:4px}
.unit-card-desc{font-size:12px;color:var(--gray-500);line-height:1.6}
.unit-card-footer{
  border-top:1px solid var(--gray-100);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.unit-card-tags{display:flex;gap:5px;flex-wrap:wrap}
.unit-tag{font-size:10px;font-weight:700;color:var(--g700);background:var(--g50);
  border:1px solid var(--g100);border-radius:20px;padding:3px 8px}
/* mini progress on card */
.unit-card-progress{display:flex;align-items:center;gap:6px;flex-shrink:0}
.unit-card-prog-bar{width:40px;height:4px;border-radius:4px;background:var(--gray-200);overflow:hidden}
.unit-card-prog-fill{height:100%;border-radius:4px;background:var(--g500)}
.unit-card-prog-text{font-size:10px;font-weight:700;color:var(--gray-500);white-space:nowrap}

/* ═══════ UNIT DETAIL VIEW ═══════ */
.unit-detail-header{
  display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;
}
.back-btn{
  display:flex;align-items:center;gap:6px;
  border:1.5px solid var(--gray-200);background:#fff;
  border-radius:var(--r-md);padding:8px 14px;font-family:var(--font);
  font-size:12.5px;font-weight:700;color:var(--gray-600);cursor:pointer;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
  flex-shrink:0;
}
.back-btn:hover{background:var(--gray-100);border-color:var(--gray-300)}
.unit-detail-title-wrap{flex:1;min-width:0}
.unit-detail-kicker{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--g600);margin-bottom:3px}
.unit-detail-name{font-size:19px;font-weight:900;color:var(--gray-900);line-height:1.3}
@media(min-width:600px){.unit-detail-name{font-size:22px}}

/* unit progress strip */
.unit-progress-strip{
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:18px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.unit-progress-bar-wrap{flex:1;min-width:120px}
.unit-progress-bar-label{display:flex;justify-content:space-between;margin-bottom:6px}
.unit-progress-bar-text{font-size:11.5px;color:var(--gray-500);font-weight:600}
.unit-progress-bar-pct{font-size:11.5px;font-weight:800;color:var(--g700)}
.unit-progress-bg{background:var(--gray-200);border-radius:6px;height:7px;overflow:hidden}
.unit-progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--g700),var(--g400));transition:width .4s}
.unit-progress-stats{display:flex;gap:14px;flex-shrink:0}
.unit-progress-stat{text-align:center}
.unit-progress-stat-val{font-size:16px;font-weight:900;color:var(--g800);line-height:1}
.unit-progress-stat-lbl{font-size:10px;color:var(--gray-500);font-weight:600;margin-top:3px}

/* Lesson list */
.lesson-list{display:grid;gap:8px}
.lesson-row{
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-md);
  cursor:pointer;transition:all .15s;overflow:hidden;
}
.lesson-row:hover{border-color:var(--g300);box-shadow:var(--sh-sm)}
.lesson-row.is-correct{border-left:4px solid var(--g400)}
.lesson-row.is-wrong{border-left:4px solid var(--red-500)}

.lesson-row-head{
  display:flex;align-items:center;gap:10px;padding:13px 14px;
}
.lesson-num-badge{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:#fff;
}
.lesson-row-info{flex:1;min-width:0}
.lesson-row-title{font-size:13.5px;font-weight:700;color:var(--gray-900);line-height:1.35}
.lesson-row-status{font-size:11px;margin-top:3px}
.lesson-status-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;
}
.lesson-status-badge.correct{color:var(--g800);background:var(--g50);border:1px solid var(--g100)}
.lesson-status-badge.wrong{color:var(--red-700);background:var(--red-50);border:1px solid var(--red-100)}
.lesson-status-badge.pending{color:var(--gray-400);background:var(--gray-50);border:1px solid var(--gray-100)}
.lesson-row-chevron{color:var(--gray-400);font-size:18px;flex-shrink:0;transition:transform .18s}

/* Lesson detail panel */
.lesson-panel{padding:0 14px 16px}
.lesson-fields{display:grid;gap:9px}
.lesson-field{
  border:1.5px solid var(--gray-200);border-radius:var(--r-md);
  background:var(--gray-50);overflow:hidden;
}
.lesson-field-label{
  display:flex;align-items:center;gap:7px;padding:10px 13px;
  font-size:11.5px;font-weight:800;color:var(--gray-700);
  background:#fff;border-bottom:1px solid var(--gray-100);
}
.lesson-field-label i{font-size:14px;color:var(--g600)}
.lesson-field.quiz-field .lesson-field-label{color:var(--purple-700)}
.lesson-field.quiz-field .lesson-field-label i{color:var(--purple-700)}
.lesson-field-body{padding:11px 13px;font-size:13.5px;line-height:1.75;color:var(--gray-700)}

/* wrong case style */
.lesson-field.wrong-field{border-color:var(--red-100)}
.lesson-field.wrong-field .lesson-field-label{background:var(--red-50);border-color:var(--red-100);color:var(--red-700)}
.lesson-field.wrong-field .lesson-field-label i{color:var(--red-500)}

/* demo field */
.lesson-field.demo-field{border-color:var(--g100)}
.lesson-field.demo-field .lesson-field-label{background:var(--g50);border-color:var(--g100);color:var(--g800)}
.lesson-field.demo-field .lesson-field-label i{color:var(--g600)}

/* ── Icon legend ── */
.lesson-icons-grid{display:flex;flex-wrap:wrap;gap:8px}
.lesson-icon-item{
  display:flex;align-items:center;gap:7px;
  background:#fff;border:1.5px solid var(--gray-200);border-radius:20px;
  padding:6px 13px;font-size:13px;font-weight:700;color:var(--gray-700);
}
.lesson-icon-item .ico{font-size:17px;line-height:1}

/* ── Care flow diagram ── */
.lesson-flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.lesson-flow-step{
  display:flex;align-items:center;gap:11px;
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-md);
  padding:10px 14px;font-size:13px;font-weight:700;color:var(--gray-800);
}
.lesson-flow-step .flow-num{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:var(--g100);color:var(--g800);font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.lesson-flow-arrow{
  display:flex;justify-content:center;color:var(--g400);font-size:15px;
  line-height:1;padding:2px 0;
}

/* Lesson nav row */
.lesson-nav-row{
  display:flex;gap:8px;margin-top:14px;
}
.lesson-nav-btn{
  flex:1;padding:11px 12px;border-radius:var(--r-md);border:1.5px solid var(--gray-200);
  background:#fff;font-family:var(--font);font-size:12.5px;font-weight:800;
  color:var(--gray-700);cursor:pointer;transition:all .15s;text-align:center;
  -webkit-tap-highlight-color:transparent;
}
.lesson-nav-btn:hover:not(:disabled){background:var(--gray-100)}
.lesson-nav-btn:disabled{opacity:.4;cursor:default}
.lesson-nav-btn.primary{
  background:linear-gradient(135deg,var(--g800),var(--g500));
  border-color:transparent;color:#fff;
}
.lesson-nav-btn.primary:hover:not(:disabled){opacity:.9}

/* ── Toast notice ── */
.lp-action-notice{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,14px);z-index:500;
  background:rgba(6,61,49,.95);color:#fff;border-radius:11px;
  padding:11px 20px;font-size:14px;line-height:1.45;
  box-shadow:0 6px 28px rgba(6,61,49,.35);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:min(480px,calc(100vw - 32px));text-align:center;
}
.lp-action-notice.show{opacity:1;transform:translate(-50%,0)}


/* ═══════ QUIZ MODE ═══════ */
.quiz-mode-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.quiz-mode-meta{flex:1;min-width:0}
.quiz-mode-kicker{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--purple-700);margin-bottom:3px}
.quiz-mode-title{font-size:19px;font-weight:900;color:var(--gray-900);line-height:1.3}
@media(min-width:600px){.quiz-mode-title{font-size:22px}}

.quiz-progress-bar-wrap{background:var(--gray-200);border-radius:5px;height:7px;margin-bottom:22px;overflow:hidden}
.quiz-progress-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--purple-700),#8B5CF6);transition:width .35s}

.quiz-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-sm);margin-bottom:14px}
.quiz-card-num{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--purple-700);margin-bottom:10px}
.quiz-card-q{font-size:15px;font-weight:800;color:var(--gray-900);line-height:1.65;margin-bottom:18px}
.quiz-choices{display:grid;gap:9px}
.quiz-choice{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 15px;border-radius:11px;
  border:2px solid var(--gray-200);background:#fff;
  font-family:var(--font);font-size:13.5px;color:var(--gray-700);
  cursor:pointer;text-align:left;line-height:1.55;
  transition:all .15s;-webkit-tap-highlight-color:transparent;width:100%;
}
.quiz-choice:hover:not(:disabled){border-color:var(--g300);background:var(--g50)}
.quiz-choice:disabled{cursor:default}
.quiz-choice-letter{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;background:var(--purple-100);color:var(--purple-700);
}
.quiz-choice.correct{border-color:var(--g300);background:var(--g50)}
.quiz-choice.correct .quiz-choice-letter{background:var(--g500);color:#fff}
.quiz-choice.wrong.selected{border-color:var(--red-100);background:var(--red-50)}
.quiz-choice.wrong .quiz-choice-letter{background:var(--red-500);color:#fff}
.quiz-answer-bar{
  margin-top:12px;padding:12px 15px;border-radius:10px;
  font-size:13px;font-weight:700;line-height:1.65;
}
.quiz-answer-bar.ok{background:var(--g50);color:var(--g800);border:1.5px solid var(--g100)}
.quiz-answer-bar.no{background:var(--red-50);color:var(--red-700);border:1.5px solid var(--red-100)}
.quiz-tip-bar{
  margin-top:8px;padding:10px 15px;border-radius:10px;font-size:12px;
  background:var(--amber-50);color:var(--amber-700);border:1.5px solid var(--amber-100);line-height:1.65;
}
.quiz-next-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  margin-top:12px;width:100%;padding:13px;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--g800),var(--g500));
  border:none;color:#fff;font-family:var(--font);font-size:13.5px;font-weight:800;
  cursor:pointer;transition:opacity .15s;-webkit-tap-highlight-color:transparent;
}
.quiz-next-btn:hover{opacity:.9}

/* Quiz result screen */
.quiz-result{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-xl);padding:36px 28px;text-align:center;box-shadow:var(--sh-md)}
.quiz-result-score{font-size:56px;font-weight:900;color:var(--g800);line-height:1}
.quiz-result-total{font-size:15px;color:var(--gray-500);margin-top:6px}
.quiz-result-label{font-size:13.5px;font-weight:700;color:var(--gray-700);margin-top:18px;margin-bottom:22px}
.quiz-result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.quiz-result-btn{
  padding:11px 24px;border-radius:var(--r-md);font-family:var(--font);
  font-size:13.5px;font-weight:800;cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.quiz-result-btn.primary{background:linear-gradient(135deg,var(--g800),var(--g500));border:none;color:#fff}
.quiz-result-btn.secondary{background:#fff;border:2px solid var(--gray-200);color:var(--gray-700)}
.quiz-result-btn:hover{opacity:.9}

/* Quiz button on unit detail header */
.quiz-mode-btn{
  display:flex;align-items:center;gap:7px;
  border:none;background:linear-gradient(135deg,var(--purple-700),#8B5CF6);
  color:#fff;border-radius:var(--r-md);padding:8px 16px;font-family:var(--font);
  font-size:12.5px;font-weight:800;cursor:pointer;
  transition:opacity .15s;-webkit-tap-highlight-color:transparent;
  flex-shrink:0;
}
.quiz-mode-btn:hover{opacity:.88}

/* Unit card — quiz shortcut button */
.unit-card-quiz-btn{
  display:flex;align-items:center;gap:4px;
  padding:5px 12px;border-radius:20px;font-size:10.5px;font-weight:800;
  border:2px solid var(--purple-100);background:var(--purple-50);color:var(--purple-700);
  cursor:pointer;font-family:var(--font);transition:all .15s;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.unit-card-quiz-btn:hover{background:var(--purple-100)}

/* ── Accessibility ── */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── Touch: no hover transforms ── */
@media(hover:none){
  .unit-card:hover{transform:none;box-shadow:var(--sh-xs)}
  .lesson-row:hover{border-color:var(--gray-200);box-shadow:none}
}

/* ── Reduced motion ── */
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Small phone ── */
/* ── Sub-navigation tab bar ── */
.subnav{
  background:#fff;border-bottom:1.5px solid var(--gray-200);
  display:flex;align-items:center;padding:0 20px;gap:4px;
  position:sticky;top:56px;z-index:190;
  box-shadow:0 1px 4px rgba(0,0,0,.04);flex-shrink:0;
}
.subnav-tab{
  display:flex;align-items:center;gap:7px;padding:0 14px;height:44px;
  font-family:var(--font);font-size:13px;font-weight:700;color:var(--gray-500);
  background:none;border:none;border-bottom:2.5px solid transparent;
  cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;
  white-space:nowrap;
}
.subnav-tab:hover{color:var(--gray-700)}
.subnav-tab.on{color:var(--g700);border-bottom-color:var(--g600)}
.subnav-tab.quiz-tab.on{color:var(--purple-700);border-bottom-color:var(--purple-700)}
.subnav-tab-badge{
  font-size:10px;font-weight:800;
  background:var(--gray-100);color:var(--gray-500);
  border-radius:20px;padding:2px 7px;
}
.subnav-tab.on .subnav-tab-badge{background:var(--g100);color:var(--g700)}
.subnav-tab.quiz-tab.on .subnav-tab-badge{background:var(--purple-100);color:var(--purple-700)}

/* ═══════ QUIZ CENTER ═══════ */
.qc-header{margin-bottom:22px}
.qc-kicker{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--purple-700);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.qc-title{font-size:24px;font-weight:900;color:var(--gray-900);line-height:1.3}
.qc-sub{margin-top:6px;font-size:13px;color:var(--gray-500);line-height:1.6}
@media(min-width:600px){.qc-title{font-size:28px}}

/* Quiz center stats panel */
.qc-stats-panel{
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-xl);
  padding:18px 20px;margin-bottom:24px;box-shadow:var(--sh-sm);
}
.qc-stats-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.qc-stats-label{font-size:12px;font-weight:800;color:var(--purple-700);letter-spacing:.4px;text-transform:uppercase}
.qc-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:479px){.qc-stats-grid{grid-template-columns:repeat(2,1fr)}}
.qc-stat{
  background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--r-md);
  padding:12px;text-align:center;
}
.qc-stat-val{font-size:22px;font-weight:900;line-height:1}
.qc-stat-val.total{color:var(--gray-700)}
.qc-stat-val.answered{color:var(--purple-700)}
.qc-stat-val.correct{color:var(--g700)}
.qc-stat-val.accuracy{color:var(--amber-700)}
.qc-stat-lbl{font-size:11px;color:var(--gray-500);margin-top:5px;font-weight:600}
.qc-bar-wrap{margin-top:14px}
.qc-bar-label{display:flex;justify-content:space-between;margin-bottom:6px}
.qc-bar-text{font-size:12px;color:var(--gray-500);font-weight:600}
.qc-bar-pct{font-size:12px;font-weight:800;color:var(--purple-700)}
.qc-bar-bg{background:var(--gray-200);border-radius:6px;height:8px;overflow:hidden}
.qc-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--purple-700),#8B5CF6);transition:width .4s ease}

/* Quiz unit cards grid */
.qc-units-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:540px){.qc-units-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.qc-units-grid{grid-template-columns:repeat(2,1fr);gap:14px}}

/* Quiz unit card */
.qc-unit-card{
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);
  overflow:hidden;cursor:pointer;transition:all .18s ease;
  box-shadow:var(--sh-xs);display:flex;flex-direction:column;
}
.qc-unit-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--purple-100)}
.qc-unit-card-body{padding:16px;display:flex;align-items:flex-start;gap:12px;flex:1}
.qc-unit-card-icon{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:21px;color:#fff;
}
.qc-unit-card-info{flex:1;min-width:0}
.qc-unit-card-title{font-size:14px;font-weight:800;color:var(--gray-900);line-height:1.35;margin-bottom:4px}
.qc-unit-card-count{font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:5px}
.qc-unit-card-footer{
  border-top:1px solid var(--gray-100);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
/* status dots row */
.qc-dot-row{display:flex;gap:3px;flex-wrap:wrap;flex:1}
.qc-dot{
  width:16px;height:16px;border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:8px;
}
.qc-dot.correct{background:var(--g100);color:var(--g700)}
.qc-dot.wrong{background:var(--red-100);color:var(--red-700)}
.qc-dot.pending{background:var(--gray-100);color:var(--gray-400)}
/* unit accuracy badge */
.qc-acc-badge{
  font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px;flex-shrink:0;
}
.qc-acc-badge.high{background:var(--g50);color:var(--g700);border:1px solid var(--g100)}
.qc-acc-badge.mid{background:var(--amber-50);color:var(--amber-700);border:1px solid var(--amber-100)}
.qc-acc-badge.low{background:var(--red-50);color:var(--red-700);border:1px solid var(--red-100)}
.qc-acc-badge.none{background:var(--gray-50);color:var(--gray-400);border:1px solid var(--gray-100)}
/* start quiz button inside card footer */
.qc-start-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 14px;border-radius:20px;font-size:11px;font-weight:800;
  border:none;background:linear-gradient(135deg,var(--purple-700),#8B5CF6);color:#fff;
  cursor:pointer;font-family:var(--font);transition:opacity .15s;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.qc-start-btn:hover{opacity:.88}

.qc-mode-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:24px}
@media(min-width:720px){.qc-mode-grid{grid-template-columns:repeat(2,1fr)}}
.qc-mode-card{
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--sh-xs);display:flex;align-items:flex-start;gap:13px;
  cursor:pointer;transition:all .18s ease;min-height:120px;
}
.qc-mode-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--purple-100)}
.qc-mode-card.disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:var(--sh-xs)}
.qc-mode-icon{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:21px;flex-shrink:0;background:linear-gradient(135deg,var(--purple-700),#8B5CF6);
}
.qc-mode-body{flex:1;min-width:0}
.qc-mode-title{font-size:14.5px;font-weight:900;color:var(--gray-900);line-height:1.35;margin-bottom:5px}
.qc-mode-desc{font-size:12.5px;color:var(--gray-500);line-height:1.6;margin-bottom:10px}
.qc-mode-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.qc-mode-pill{
  font-size:10.5px;font-weight:800;border-radius:20px;padding:3px 9px;
  background:var(--purple-50);color:var(--purple-700);border:1px solid var(--purple-100);
}
.qc-mode-action{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;color:var(--g700);
}
.qc-integrated-note{
  background:var(--purple-50);border:1.5px solid var(--purple-100);color:var(--purple-700);
  border-radius:var(--r-md);padding:11px 14px;font-size:12.5px;line-height:1.6;margin-bottom:16px;
  display:flex;align-items:flex-start;gap:9px;font-weight:700;
}

/* Quiz mode — enhanced header with stats */
.quiz-hdr-stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.quiz-hdr-stat{
  display:flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;color:var(--gray-500);
}
.quiz-hdr-stat-icon{font-size:14px}
.quiz-hdr-stat-val{font-weight:800;color:var(--gray-700)}

@media(max-width:379px){.qc-stats-grid{grid-template-columns:repeat(2,1fr)}}

/* ── Rich lesson content ── */
.lesson-keypoints{display:grid;gap:7px}
.lesson-kp-item{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-md);padding:10px 13px}
.lesson-kp-num{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;margin-top:1px}
.lesson-kp-text{font-size:13px;line-height:1.65;color:var(--gray-700)}
.lesson-kp-text strong{font-weight:800;color:var(--gray-900)}

.lesson-caution{border-radius:var(--r-md);padding:13px 15px;display:flex;align-items:flex-start;gap:11px;background:var(--amber-50);border:1.5px solid var(--amber-100);margin-bottom:0}
.lesson-caution.danger{background:var(--red-50);border-color:var(--red-100)}
.lesson-caution.info{background:var(--blue-50);border-color:var(--blue-100)}
.lesson-caution-icon{font-size:20px;line-height:1;flex-shrink:0;margin-top:1px}
.lesson-caution-title{font-size:12px;font-weight:800;color:var(--amber-700);margin-bottom:4px}
.lesson-caution.danger .lesson-caution-title{color:var(--red-700)}
.lesson-caution.info .lesson-caution-title{color:var(--blue-700)}
.lesson-caution-text{font-size:13px;line-height:1.65;color:var(--gray-700)}

.lesson-vocab-grid{display:grid;gap:8px}
@media(min-width:480px){.lesson-vocab-grid{grid-template-columns:repeat(2,1fr)}}
.lesson-vocab-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-md);padding:11px 13px}
.lesson-vocab-term{font-size:13px;font-weight:800;color:var(--g800);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.lesson-vocab-def{font-size:12px;line-height:1.6;color:var(--gray-600)}

.lesson-scenario{background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:var(--r-md);overflow:hidden}
.lesson-scenario-header{background:linear-gradient(90deg,var(--g800),var(--g600));color:#fff;padding:9px 14px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
.lesson-scenario-body{padding:13px 14px}
.lesson-scenario-line{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.lesson-scenario-line:last-child{margin-bottom:0}
.lesson-scenario-role{font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.lesson-scenario-role.care{background:var(--g100);color:var(--g800)}
.lesson-scenario-role.elder{background:var(--blue-100);color:var(--blue-700)}
.lesson-scenario-line-text{font-size:13px;line-height:1.6;color:var(--gray-700)}

.lesson-compare{width:100%;border-collapse:collapse;font-size:12.5px}
.lesson-compare th{background:var(--gray-100);font-weight:800;color:var(--gray-700);padding:9px 12px;text-align:left;border:1px solid var(--gray-200)}
.lesson-compare td{padding:9px 12px;border:1px solid var(--gray-200);color:var(--gray-700);line-height:1.55;vertical-align:top}
.lesson-compare td:first-child{font-weight:700;color:var(--gray-900);background:var(--gray-50)}
.lesson-compare .ok-cell{background:var(--g50);color:var(--g800)}
.lesson-compare .no-cell{background:var(--red-50);color:var(--red-700)}

.lesson-info-pills{display:flex;flex-wrap:wrap;gap:8px}
.lesson-info-pill{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-md);padding:8px 13px}
.lesson-info-pill-icon{font-size:20px;line-height:1}
.lesson-info-pill-label{font-size:10px;font-weight:800;color:var(--gray-500);letter-spacing:.3px;text-transform:uppercase}
.lesson-info-pill-val{font-size:13px;font-weight:700;color:var(--gray-900);margin-top:1px}

/* ═══════ SIDEBAR LAYOUT ═══════ */
.app-layout{display:flex;min-height:100dvh;flex-direction:column}
.app-body{display:flex;flex:1;min-height:0;overflow:hidden}

/* Sidebar */
.sidebar{
  width:260px;flex-shrink:0;background:#fff;
  border-right:1.5px solid var(--gray-200);
  display:flex;flex-direction:column;
  overflow:hidden;transition:transform .25s ease;
  position:relative;z-index:100;
}
.sidebar-header{
  padding:14px 16px 12px;border-bottom:1.5px solid var(--gray-100);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.sidebar-brand-icon{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--g800),var(--g500));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;
}
.sidebar-brand-text{flex:1;min-width:0}
.sidebar-brand-name{font-size:13px;font-weight:800;color:var(--gray-900);line-height:1.2}
.sidebar-brand-sub{font-size:10px;color:var(--gray-500);margin-top:2px}

/* Sidebar main tabs */
.sidebar-tabs{display:flex;padding:10px 10px 0;gap:4px;flex-shrink:0}
.sidebar-tab{
  flex:1;padding:7px 6px;border-radius:8px;border:none;background:none;
  font-family:var(--font);font-size:11.5px;font-weight:700;color:var(--gray-500);
  cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;
  -webkit-tap-highlight-color:transparent;
}
.sidebar-tab.on{background:var(--g50);color:var(--g700)}
.sidebar-tab.quiz-t.on{background:var(--purple-50);color:var(--purple-700)}
.sidebar-tab-badge{
  font-size:9.5px;font-weight:800;
  background:var(--gray-100);color:var(--gray-500);
  border-radius:20px;padding:1px 5px;
}
.sidebar-tab.on .sidebar-tab-badge{background:var(--g100);color:var(--g700)}
.sidebar-tab.quiz-t.on .sidebar-tab-badge{background:var(--purple-100);color:var(--purple-700)}

/* Sidebar progress mini */
.sidebar-progress{
  margin:10px 10px 0;padding:10px 12px;background:var(--g50);
  border:1px solid var(--g100);border-radius:10px;flex-shrink:0;
}
.sidebar-progress-label{font-size:10px;font-weight:800;color:var(--g700);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
.sidebar-progress-stats{display:flex;gap:0;margin-bottom:7px}
.sidebar-progress-stat{flex:1;text-align:center}
.sidebar-progress-stat-val{font-size:16px;font-weight:900;color:var(--g800);line-height:1}
.sidebar-progress-stat-lbl{font-size:9px;color:var(--gray-500);font-weight:600;margin-top:2px}
.sidebar-progress-bar-bg{background:rgba(0,0,0,.08);border-radius:4px;height:5px;overflow:hidden}
.sidebar-progress-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g700),var(--g400));transition:width .4s}

/* Sidebar nav scroll area */
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 8px 20px;overscroll-behavior:contain}
.sidebar-nav::-webkit-scrollbar{width:3px}
.sidebar-nav::-webkit-scrollbar-track{background:transparent}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:3px}

/* Unit group */
.sidebar-unit-group{margin-bottom:4px;border-radius:10px;overflow:hidden;border:1px solid var(--gray-100)}
.sidebar-unit-btn{
  width:100%;display:flex;align-items:center;gap:9px;
  padding:9px 10px;background:#fff;border:none;cursor:pointer;
  font-family:var(--font);text-align:left;transition:background .15s;
  -webkit-tap-highlight-color:transparent;
}
.sidebar-unit-btn:hover{background:var(--gray-50)}
.sidebar-unit-btn.active{background:var(--g50)}
.sidebar-unit-icon{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;
}
.sidebar-unit-info{flex:1;min-width:0}
.sidebar-unit-name{font-size:12px;font-weight:800;color:var(--gray-900);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-unit-meta{font-size:10px;color:var(--gray-400);margin-top:1px;display:flex;align-items:center;gap:4px}
.sidebar-unit-chevron{color:var(--gray-400);font-size:14px;flex-shrink:0;transition:transform .2s}
.sidebar-unit-btn.open .sidebar-unit-chevron{transform:rotate(90deg)}

/* Lesson items under unit */
.sidebar-lessons{background:var(--gray-50);border-top:1px solid var(--gray-100)}
.sidebar-lesson-item{
  display:flex;align-items:center;gap:8px;padding:7px 10px 7px 16px;
  cursor:pointer;transition:background .12s;border:none;background:none;
  width:100%;font-family:var(--font);text-align:left;
  -webkit-tap-highlight-color:transparent;
}
.sidebar-lesson-item:hover{background:var(--gray-100)}
.sidebar-lesson-item.active{background:var(--g50)}
.sidebar-lesson-dot{
  width:16px;height:16px;border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:8px;
}
.sidebar-lesson-dot.correct{background:var(--g100);color:var(--g700)}
.sidebar-lesson-dot.wrong{background:var(--red-100);color:var(--red-700)}
.sidebar-lesson-dot.pending{background:var(--gray-200);color:var(--gray-400)}
.sidebar-lesson-title{font-size:11.5px;color:var(--gray-700);line-height:1.35;flex:1;font-weight:600}
.sidebar-lesson-item.active .sidebar-lesson-title{color:var(--g800);font-weight:800}

/* Sidebar quiz section */
.sidebar-quiz-menu{padding:4px}
.sidebar-quiz-item{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  cursor:pointer;border:none;background:none;width:100%;font-family:var(--font);
  text-align:left;transition:background .12s;
  -webkit-tap-highlight-color:transparent;
}
.sidebar-quiz-item:hover{background:var(--purple-50)}
.sidebar-quiz-item.active{background:var(--purple-50)}
.sidebar-quiz-item-icon{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;background:linear-gradient(135deg,var(--purple-700),#8B5CF6);
}
.sidebar-quiz-item-name{font-size:12px;font-weight:700;color:var(--gray-800);line-height:1.3}
.sidebar-quiz-item-meta{font-size:10px;color:var(--gray-400);margin-top:1px}
.sidebar-quiz-unit-list{padding:4px}
.sidebar-quiz-unit-item{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  cursor:pointer;border:none;background:none;width:100%;font-family:var(--font);
  text-align:left;transition:background .12s;-webkit-tap-highlight-color:transparent;
}
.sidebar-quiz-unit-item:hover{background:var(--purple-50)}
.sidebar-quiz-unit-item-dot{
  width:22px;height:22px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
}
.sidebar-quiz-unit-item-name{font-size:11.5px;font-weight:700;color:var(--gray-700);flex:1;line-height:1.3}

/* Sidebar footer - lang switcher */
.sidebar-footer{
  border-top:1.5px solid var(--gray-100);padding:10px 10px;
  flex-shrink:0;display:flex;align-items:center;gap:6px;
}
.sidebar-footer-label{font-size:10px;font-weight:700;color:var(--gray-400);flex-shrink:0}
.sidebar-lang-btns{display:flex;gap:4px;flex:1}
.sidebar-lb{
  flex:1;padding:5px 4px;border-radius:6px;border:1.5px solid var(--gray-200);
  background:#fff;font-family:var(--font);font-size:17px;font-weight:700;
  color:var(--gray-500);cursor:pointer;transition:all .14s;
  -webkit-tap-highlight-color:transparent;text-align:center;line-height:1.2;
}
.sidebar-lb.on{background:var(--g700);border-color:var(--g700);color:#fff}
.sidebar-lb:hover:not(.on){background:var(--gray-50)}
.sidebar-reset-btn{
  display:flex;align-items:center;gap:4px;padding:5px 8px;border-radius:6px;
  font-size:10px;font-weight:700;color:var(--gray-400);background:none;border:none;
  cursor:pointer;transition:all .15s;font-family:var(--font);white-space:nowrap;
}
.sidebar-reset-btn:hover{color:var(--red-700);background:var(--red-50)}

/* Topbar (mobile only) */
.topbar{
  display:none;
  background:#fff;border-bottom:1.5px solid var(--gray-200);
  height:52px;align-items:center;
  padding:0 16px;gap:12px;position:sticky;top:0;z-index:300;
  box-shadow:0 2px 8px rgba(0,0,0,.07);flex-shrink:0;
}
.topbar-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.topbar-brand-icon{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--g800),var(--g500));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;
}
.topbar-brand-text{display:flex;flex-direction:column}
.topbar-brand-name{font-size:13px;font-weight:800;color:var(--gray-900);line-height:1.25}
.topbar-brand-sub{font-size:10px;color:var(--gray-500);margin-top:1px}
.topbar-spacer{flex:1}
.topbar-menu-btn{
  width:36px;height:36px;border-radius:9px;border:1.5px solid var(--gray-200);
  background:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--gray-600);font-size:18px;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.topbar-lang{display:flex;gap:3px}
.topbar-lb{
  padding:5px 7px;border-radius:7px;border:1.5px solid var(--gray-200);
  background:#fff;font-family:var(--font);font-size:18px;font-weight:700;
  color:var(--gray-500);cursor:pointer;transition:all .14s;
  -webkit-tap-highlight-color:transparent;line-height:1.2;
}
.topbar-lb.on{background:var(--g700);border-color:var(--g700);color:#fff}

/* subnav — mobile tab bar */
.subnav{display:none}

/* Main content area */
.main-area{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column;background:#EFF2F7}
.content{flex:1;padding:24px 20px 56px;max-width:960px;margin:0 auto;width:100%}

/* Mobile sidebar overlay */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);
  z-index:200;opacity:0;transition:opacity .25s;
}
.sidebar-overlay.show{display:block;opacity:1}

/* Sidebar section divider */
.sidebar-section-label{
  font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:var(--gray-400);padding:10px 12px 5px;
}

/* ── Mobile ── */
@media(max-width:767px){
  .topbar{display:flex}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:250;
    transform:translateX(-100%);box-shadow:var(--sh-lg);
  }
  .sidebar.open{transform:translateX(0)}
  .app-body{padding-top:0}
}
@media(min-width:768px){
  .app-layout{overflow:hidden;height:100dvh}
  .app-body{overflow:hidden}
  .sidebar{height:100%;overflow:hidden}
  .main-area{height:100%;overflow-y:auto}
}
@media(min-width:768px) and (max-width:1023px){
  .sidebar{width:220px}
  .content{padding:20px 18px 48px}
}
@media(min-width:1024px){
  .content{padding:28px 36px 60px}
}

<div class="app-layout">

    <div class="topbar-lang">

      <button class="topbar-lb" id="tb-lb-id" onclick="setLang('id')">🇮🇩</button>
      <button class="topbar-lb" id="tb-lb-en" onclick="setLang('en')">🇺🇸</button>
      <button class="topbar-lb" id="tb-lb-vi" onclick="setLang('vi')">🇻🇳</button>
    </div>
  </header>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="app-body">
    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar" id="sidebar">
      <!-- Brand -->
      <div class="sidebar-header">
        <div class="sidebar-brand-icon"><i class="ti ti-first-aid-kit"></i></div>
        <div class="sidebar-brand-text">
          <div class="sidebar-brand-name" id="sb-brand-name">看護訓練平台</div>
          <div class="sidebar-brand-sub" id="sb-brand-sub">外籍照護培訓系統</div>
        </div>
      </div>
      <!-- Main tabs -->
      <div class="sidebar-tabs">
        <button class="sidebar-tab on" id="sb-tab-course" onclick="switchTab('course');closeSidebar()">
          <i class="ti ti-books" style="font-size:14px"></i>
          <span id="sb-tab-course-label">課程</span>
          <span class="sidebar-tab-badge" id="sb-tab-course-badge">100</span>
        </button>
        <button class="sidebar-tab quiz-t" id="sb-tab-quiz" onclick="switchTab('quiz');closeSidebar()">
          <i class="ti ti-help-circle" style="font-size:14px"></i>
          <span id="sb-tab-quiz-label">測驗</span>
          <span class="sidebar-tab-badge" id="sb-tab-quiz-badge">400題</span>
        </button>
      </div>
      <!-- Mini progress -->
      <div class="sidebar-progress" id="sb-progress" style="display:none">
        <div class="sidebar-progress-label" id="sb-progress-label">整體進度</div>
        <div class="sidebar-progress-stats">
          <div class="sidebar-progress-stat">
            <div class="sidebar-progress-stat-val" id="sb-stat-answered">0</div>
            <div class="sidebar-progress-stat-lbl" id="sb-stat-answered-lbl">已答</div>
          </div>
          <div class="sidebar-progress-stat">
            <div class="sidebar-progress-stat-val" id="sb-stat-correct">0</div>
            <div class="sidebar-progress-stat-lbl" id="sb-stat-correct-lbl">答對</div>
          </div>
          <div class="sidebar-progress-stat">
            <div class="sidebar-progress-stat-val" id="sb-stat-pct">0%</div>
            <div class="sidebar-progress-stat-lbl" id="sb-stat-pct-lbl">正確率</div>
          </div>
        </div>
        <div class="sidebar-progress-bar-bg">
          <div class="sidebar-progress-bar-fill" id="sb-progress-fill" style="width:0%"></div>
        </div>
      </div>
      <!-- Nav -->
      <div class="sidebar-nav" id="sb-nav"></div>
      <!-- Footer: lang + reset -->
      <div class="sidebar-footer">
        <span class="sidebar-footer-label" id="sb-lang-label">語言</span>
        <div class="sidebar-lang-btns">
          <button class="sidebar-lb on" id="sb-lb-zh" onclick="setLang('zh')">🇹🇼</button>
          <button class="sidebar-lb" id="sb-lb-id" onclick="setLang('id')">🇮🇩</button>
          <button class="sidebar-lb" id="sb-lb-en" onclick="setLang('en')">🇺🇸</button>
          <button class="sidebar-lb" id="sb-lb-vi" onclick="setLang('vi')">🇻🇳</button>
        </div>
        <button class="sidebar-reset-btn" onclick="resetProgress()" title="重置進度">
          <i class="ti ti-refresh" style="font-size:12px"></i>
        </button>
      </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <div class="main-area">
      <div class="content" id="main-content"></div>
    </div>
  </div>
</div>

function getCourseUnits(){
  if(lang === 'zh') return COURSE_PLAN_UNITS;
  const tbl = UNIT_I18N[lang];
  if(!tbl) return COURSE_PLAN_UNITS;
  return COURSE_PLAN_UNITS.map((u,i)=>{
    const t = tbl[i];
    if(!t) return u;
    return {...u, title:t[0], desc:t[1], tags:t[2], outcomes:t[3], lessons:t[4]};
  });
}

    flow:['接收家屬交辦事項','依照護計畫執行','觀察長者反應','遇到不確定立刻問家屬','完成後紀錄'],
    quiz:{q:'看護可以自行調整藥物嗎？',opts:['不可以，只能提醒、紀錄與回報','可以，只要藥量不超過兩倍','可以，有經驗的看護可以判斷','不確定時可以先試試看'],correct:0}},

  {no:'03',
    text:'照護者要非常清楚自己的角色邊界：「協助、觀察、陪伴、提醒」是本分，但遇到醫療決定、金錢管理、家庭衝突或法律事務，務必請家屬或專業人員處理，不要自行決定。',
    keypoints:['<strong>工作範圍內（可以做）</strong>：協助日常活動、觀察身體狀況、陪伴說話、提醒服藥、回報異常','<strong>超出範圍（請家屬處理）</strong>：醫療判斷、藥物調整、金錢代管、家庭糾紛調解','<strong>遇到要求的處理步驟</strong>：先安撫→確認照護計畫→聯絡家屬→依指示處理','<strong>拒絕不合理要求的方法</strong>：溫和但明確，例如「這個我需要先問家屬確認」'],
    scenario:{title:'情境：長者要求多吃藥',lines:[{role:'elder',text:'Siti，我頭痛，幫我多拿一顆止痛藥來。'},{role:'care',text:'阿公，我知道您不舒服，先請您坐著休息。'},{role:'care',text:'藥物的事我需要先問家屬，我現在打電話給大兒子，好嗎？'},{role:'elder',text:'哎，就一顆嘛，沒關係啦。'},{role:'care',text:'我了解，但用藥一定要按照醫師指示，我馬上聯絡家屬，請您等我一下。'}]},
    caution:{type:'amber',icon:'⚡',title:'邊界設定很重要',text:'為了讓長者開心而答應超出工作範圍的要求，最終可能傷害長者健康、讓看護承擔法律責任，對雙方都有危險。溫和但明確的拒絕，才是真正的照顧。'},
    demo:'長者說要用你的手機轉帳給親戚，照護者應說：「阿公，金錢的事我不能幫您操作，我幫您撥電話給兒子，請他來協助，好嗎？」',
    wrong:'為了讓長者開心，答應帶他外出散步卻沒有告知家屬，或答應他多吃一顆藥「試試看」，或替長者保管存摺和印章。',
    icons:[{icon:'🤝',label:'協助本分'},{icon:'👀',label:'觀察回報'},{icon:'🚧',label:'超出範圍'},{icon:'☎',label:'請示家屬'}],
    flow:['聽到長者的需求或要求','判斷是否在工作範圍內','若超出範圍：安撫長者並說明需聯絡家屬','聯絡家屬或主要負責人','依家屬指示處理並紀錄'],
    quiz:{q:'遇到超出工作範圍的要求時應怎麼辦？',opts:['先停止，確認照護計畫並回報家屬','立刻答應，讓長者開心最重要','用自己的判斷快速決定','忽略不回應，繼續做其他工作'],correct:0}},

  {no:'04',
    text:'尊重長者的隱私與身體尊嚴，是照護工作最基本的原則。進行任何涉及身體的照護（洗澡、更衣、如廁、清潔），都必須事先告知、遮蔽身體、關上門或拉上窗簾，確保只有必要的人在場。',
    keypoints:['<strong>告知原則</strong>：任何照護動作前，先說明要做什麼，讓長者有心理準備','<strong>遮蔽原則</strong>：只露出正在清潔的部位，其他部位用毛巾或被子蓋住','<strong>空間隱私</strong>：關門、拉簾，避免家庭其他成員或訪客看見','<strong>拍照禁止</strong>：絕對不能拍攝長者身體或私密部位，不能轉傳給他人'],
    infopills:[{icon:'🗣️',label:'第一步',val:'先說明要做什麼'},{icon:'🚪',label:'第二步',val:'關門拉簾'},{icon:'🧣',label:'第三步',val:'遮蔽保暖'},{icon:'👀',label:'第四步',val:'只露必要部位'}],
    vocab:[{icon:'🙏',term:'身體尊嚴',def:'即使長者無法自行行動，也有權利不讓不必要的人看到自己的身體'},{icon:'📵',term:'個人資料保護',def:'長者的病情、身體狀況、照片，不能在未取得同意的情況下分享給他人'},{icon:'🔒',term:'知情同意',def:'任何照護行為前，需讓長者知道並盡量取得其同意'}],
    caution:{type:'danger',icon:'⚠️',title:'嚴禁行為',text:'拍攝長者身體照片並傳送給他人，無論是分享給家屬、朋友或社群媒體，在台灣都可能違反個人資料保護法，情節嚴重者可面臨法律責任。'},
    scenario:{title:'情境：協助更衣',lines:[{role:'care',text:'阿嬤，我現在要幫您換衣服了，可以嗎？'},{role:'elder',text:'嗯，好啊。'},{role:'care',text:'（關門，拉上窗簾）我先幫您把外衣脫掉，先從右手這邊開始。'},{role:'care',text:'（用毛巾遮蓋上半身）好了，現在幫您穿新衣服，先穿比較沒有力氣的左手邊。'}]},
    demo:'協助更衣前先說「我要幫您換衣服了」，關門後拉上窗簾，每脫一件立刻用毛巾蓋上，只露出正在穿脫的部位。全程保持溫和說話，讓長者知道每個步驟。',
    wrong:'沒有敲門就直接進入房間掀開棉被，或用手機拍攝長者換衣過程「回報家屬」，或讓門開著讓其他人看見。',
    icons:[{icon:'🗣',label:'先告知'},{icon:'🚪',label:'關門拉簾'},{icon:'🙈',label:'遮蔽身體'},{icon:'📵',label:'禁止拍照'}],
    flow:['敲門並告知要進行什麼照護','關上門窗確保隱私','遮蔽身體，只露出必要部位','輕柔說明每個動作步驟','完成後確認長者舒適'],
    quiz:{q:'協助洗澡前第一步是什麼？',opts:['先告知長者並保護隱私','立刻把浴室水放好','先準備毛巾和衣服','確認家屬是否在家'],correct:0}},

  {no:'05',
    text:'照護計畫（Care Plan）是每天工作的核心依據，記錄著長者的疾病診斷、過敏史、用藥時間與劑量、飲食限制、活動禁忌、移位方式，以及緊急聯絡人名單。上工第一天，最重要的事情就是仔細閱讀這份文件。',
    keypoints:['<strong>疾病與過敏</strong>：知道長者有哪些病，對哪些藥物或食物過敏','<strong>用藥時間</strong>：記錄每種藥的名稱、劑量、服藥時間，不能自行更改','<strong>飲食限制</strong>：如糖尿病要控糖、心臟病要少鹽、腎病要限水','<strong>移位禁忌</strong>：例如某側肢體不能用力、不能自行翻身等','<strong>緊急聯絡</strong>：家屬電話、主治醫師、就近診所或醫院地址'],
    vocab:[{icon:'📋',term:'照護計畫',def:'記錄長者所有健康資訊與照護指示的文件，由醫師或護理師訂定'},{icon:'💊',term:'醫囑',def:'醫師給予的用藥、飲食、活動等具體指示，照護者必須依照執行'},{icon:'🍽️',term:'飲食禁忌',def:'因疾病而需要避免的食物，如高血壓避免高鹽食物'},{icon:'🔄',term:'移位',def:'協助長者從床移到輪椅、或從椅子站起等位置改變的動作'}],
    infopills:[{icon:'📋',label:'文件查閱',val:'每日開始前'},{icon:'❓',label:'不懂就問',val:'立刻詢問家屬'},{icon:'✅',label:'確認重點',val:'過敏+用藥+禁忌'}],
    compare:{cols:['確認項目','要問清楚的問題'],rows:[['疾病診斷','長者有哪些慢性病？最近有什麼變化？'],['藥物管理','哪些時間給哪些藥？有幾顆？'],['飲食限制','哪些食物不能吃？軟硬度有要求嗎？'],['活動能力','可以自己走路嗎？需要輔具嗎？'],['緊急聯絡','家屬電話？不在家怎麼辦？']]},
    demo:'上工第一天：打開照護計畫，依序確認──(1)長者有哪些病 (2)有無過敏 (3)藥物清單與時間 (4)飲食限制 (5)移位方式 (6)家屬聯絡方式。有任何不清楚，當場請家屬說明，並做筆記。',
    wrong:'只聽家屬口頭說明，沒有實際看照護計畫文件。或遇到問題時靠之前在其他家庭的照護經驗判斷，沒有確認這位長者的個別狀況。',
    icons:[{icon:'📋',label:'照護計畫'},{icon:'💊',label:'用藥資訊'},{icon:'🍽',label:'飲食禁忌'},{icon:'☎',label:'緊急聯絡'}],
    flow:['拿到照護計畫文件','確認疾病清單與過敏史','確認用藥時間與劑量','確認飲食與活動禁忌','記下緊急聯絡人電話','看不懂或有疑問立即詢問'],
    quiz:{q:'照護計畫看不懂時應該怎麼做？',opts:['立即詢問家屬或負責人，不能自己猜','先照自己理解的方式嘗試','等遇到問題再說','請同事幫忙但不回報家屬'],correct:0}},

  {no:'06',
    text:'建立固定的每日工作流程，是避免遺漏照護事項的最好方法。一個完整的工作日分成五個時段：晨間照護、早餐與用藥、上午活動陪同、午休觀察、下午到晚間清潔與紀錄。',
    infopills:[{icon:'🌅',label:'06:00–08:00',val:'晨間照護'},{icon:'🍳',label:'08:00–09:00',val:'早餐 + 用藥'},{icon:'🚶',label:'09:00–11:30',val:'活動陪同'},{icon:'😴',label:'12:00–14:00',val:'午休觀察'},{icon:'🌙',label:'18:00–21:00',val:'晚餐 + 就寢照護'}],
    keypoints:['<strong>晨間照護</strong>：口腔清潔、洗臉、更衣、測量生命徵象（如需要）','<strong>早餐與用藥</strong>：依飲食計畫備餐，提醒長者服用早餐藥物','<strong>活動陪同</strong>：室內散步、關節運動、陪談或看電視','<strong>午休觀察</strong>：確認長者安全入睡，觀察呼吸，整理環境','<strong>晚間照護</strong>：晚餐、晚間藥物、清潔、就寢前觀察'],
    scenario:{title:'情境：使用清單管理工作',lines:[{role:'care',text:'（早上八點，看著手機工作清單）早餐吃完✓，藥吃完✓，喝水200ml✓。'},{role:'care',text:'阿嬤，我們去客廳坐坐，曬曬太陽，好嗎？'},{role:'elder',text:'好啊，我腳有點酸。'},{role:'care',text:'（記錄：10:20 反映腳酸，今日走路時間略短，待觀察。）'}]},
    caution:{type:'info',icon:'💡',title:'工具推薦',text:'可以用手機備忘錄或紙本清單記錄每日工作，完成一項打勾一項。這樣不只能避免遺漏，也能讓交班更順暢，家屬一眼就知道今天做了什麼。'},
    demo:'準備一張紙本或手機清單，列出：口腔清潔、洗臉、早餐、用藥、喝水量、活動、午休、晚餐、晚間清潔、記錄。每完成一項打勾，下班前確認是否全部完成。',
    wrong:'想到什麼做什麼，結果忘記提醒下午的藥、忘記記錄飲水量，或因為趕時間跳過口腔清潔。到交班時說不清楚今天發生了什麼事。',
    icons:[{icon:'🌅',label:'晨間照護'},{icon:'🍚',label:'用餐用藥'},{icon:'🚶',label:'活動陪同'},{icon:'📝',label:'紀錄回報'}],
    flow:['晨間口腔、臉部清潔與更衣','早餐備餐與用藥提醒','上午室內外活動陪同','午休期間觀察安全','下午活動與補水','晚餐、晚間清潔、就寢照護','完成每日工作紀錄'],
    quiz:{q:'為什麼要有每日工作流程？',opts:['減少遺漏，讓照護更穩定','流程越複雜越好','讓家屬感覺有在工作','節省時間做其他事'],correct:0}},

  {no:'07',
    text:'與家屬的溝通品質，直接影響照護成效。好的回報應該包含：時間、事件、觀察到的具體事實、已採取的行動，以及詢問是否有進一步指示。使用事實描述，不用主觀感覺或情緒字眼。',
    compare:{cols:['情況','❌ 模糊說法','✅ 清楚說法'],rows:[['食量','今天吃得不多','午餐吃了約四分之一碗飯、半碗湯'],['精神','今天好像比較差','下午 14:30 長者嗜睡，叫名字無反應，持續約 20 分鐘'],['跌倒','差點跌倒','10:15 起身時站不穩，右手扶牆，無受傷，已觀察步態正常']]},
    keypoints:['<strong>固定時間回報</strong>：每天相同時段（如早上 9 點、晚上 8 點）傳訊或電話，讓家屬有預期','<strong>事實優先</strong>：說數字（吃了幾成飯、喝了多少水），不說感覺（「好像不太好」）','<strong>說明已處理</strong>：異常發生後你做了什麼，這樣家屬才能評估是否需要進一步處理','<strong>照片輔助</strong>：如有皮膚異常、傷口等，可拍照（不含隱私部位）讓家屬確認'],
    scenario:{title:'情境：傳送每日回報訊息',lines:[{role:'care',text:'王太太您好，今天日報：'},{role:'care',text:'早餐：吃完八成，喝牛奶 150ml，早晨藥已服用 8:10。'},{role:'care',text:'活動：上午在客廳走路約 10 分鐘，說腳有點酸，休息後改善。'},{role:'care',text:'午餐：只吃一半，說沒有食慾，下午體溫 36.8°C 正常。'},{role:'care',text:'目前異常：食慾下降，已是連續第二天，請問需要就醫嗎？'}]},
    demo:'每天晚餐後，用手機傳一則固定格式的日報給家屬：「早餐吃了___成，午餐___成，喝水___ml，服藥時間___，今日特別狀況___，已處理方式___，請問是否需要特別注意？」',
    wrong:'只有長者出大問題才聯絡家屬，或每次都只說「今天還好」「還可以」這種沒有資訊的回報，讓家屬無法判斷長者狀況。',
    icons:[{icon:'🕐',label:'固定時間'},{icon:'📊',label:'具體數據'},{icon:'☎',label:'及時回報'},{icon:'📷',label:'附照片'}],
    flow:['固定時間傳送日報','說明飲食與用藥狀況','描述活動與精神狀況','說明任何異常與已處理方式','詢問家屬是否有進一步指示'],
    quiz:{q:'好的回報應該包含什麼？',opts:['時間、事件、觀察到的事實與已做處理','只要說清楚感覺就夠了','等家屬問才回報','只說有問題，不說細節'],correct:0}},

  {no:'08',
    text:'照護現場最常發生的錯誤，往往不是不會做，而是太趕、沒問清楚、忘記檢查。避免錯誤的三個核心習慣：每次行動前先停一下、問清楚長者的感覺、完成後寫下紀錄。',
    keypoints:['<strong>趕時間的危險</strong>：移位太快容易跌倒，餵食太快造成嗆咳','<strong>未告知的危險</strong>：突然翻動長者身體，可能造成骨折或疼痛','<strong>忘記紀錄的危險</strong>：無法發現異常趨勢，交班不清楚','<strong>自行判斷的危險</strong>：看到血壓高就調藥，可能釀成嚴重事故'],
    compare:{cols:['情境','錯誤做法','正確做法'],rows:[['長者要站起來','直接抓手臂用力拉起','確認雙腳踩穩、告知「慢慢站」，再緩慢協助'],['餵食時間到','快速一口接一口','等長者完全吞下，觀察有無嗆咳再繼續'],['發現皮膚發紅','覺得沒事繼續照護','立刻拍照、記錄位置與大小，回報家屬']]},
    caution:{type:'danger',icon:'⚠️',title:'「趕時間」是照護現場最常見的危險因子',text:'照護沒有捷徑。一個動作花多 30 秒確認，可以避免長者跌倒骨折需要住院 6 週。慢一點、問清楚、留紀錄，是保護長者也保護自己的方法。'},
    demo:'每次協助移位前的「三確認」：① 地面乾燥無雜物 ② 長者告知「我要扶您站起來了」③ 確認長者腳踩穩、沒有頭暈，再緩慢協助起身。完成後記下時間與狀況。',
    wrong:'長者說「我要起來」就馬上抓手拉起，沒有問頭暈不暈、腳有沒有踩穩。或是移位後馬上走開，沒有確認長者坐穩。',
    icons:[{icon:'🐢',label:'動作慢'},{icon:'❓',label:'問清楚'},{icon:'✅',label:'安全檢查'},{icon:'📝',label:'留紀錄'}],
    flow:['行動前先停一下','告知長者即將進行的動作','確認環境安全（地面、輪椅、鞋子）','確認長者狀況（頭暈？腳踩穩？）','緩慢協助執行','完成後記錄時間與狀況'],
    quiz:{q:'避免照護錯誤的三個關鍵是什麼？',opts:['確認、溝通、紀錄','速度、效率、節省時間','依長者喜好做決定','看心情調整方式'],correct:0}},

  {no:'09',
    text:'照護倫理的核心是：把長者當成一個有感受、有選擇、有尊嚴的人，而不是一個需要被「管理」的對象。即使長者動作非常慢、同一句話重複問很多次、或情緒不好，照護者都應保持禮貌與耐心。',
    keypoints:['<strong>給選擇而非命令</strong>：「您要先喝水還是先洗臉？」比「去洗臉」更尊重','<strong>等待而非催促</strong>：長者自己慢慢扣扣子，比幫他全部做完更有價值','<strong>情緒不傳染</strong>：長者罵人或不配合，先理解他的不舒服，不要以牙還牙','<strong>不在長者面前抱怨</strong>：即使對現況不滿，也不在長者面前發洩'],
    scenario:{title:'情境：長者重複詢問',lines:[{role:'elder',text:'Siti，幾點了？'},{role:'care',text:'阿公，現在是下午兩點喔。'},{role:'elder',text:'（五分鐘後）幾點了？'},{role:'care',text:'現在兩點零五分，您等一下兒子三點會來看您喔。'},{role:'elder',text:'（又五分鐘）幾點了？兒子要來嗎？'},{role:'care',text:'（微笑）是的，兒子三點要來，還有一個小時，我們來聽廣播等他好嗎？'}]},
    vocab:[{icon:'🕊️',term:'耐心',def:'即使長者行為重複或情緒不穩，維持平和態度繼續照護'},{icon:'🗣️',term:'選擇性引導',def:'提供兩個選項讓長者自己選，既尊重自主又確保安全'},{icon:'💙',term:'同理心',def:'嘗試從長者的角度理解他的感受與行為，而非只看「問題行為」'}],
    caution:{type:'info',icon:'💡',title:'長者重複問同一個問題怎麼辦？',text:'這可能是失智初期症狀，也可能是焦慮。不要說「我說過了」或「你怎麼又問」，這樣只會讓長者更不安。每次都耐心回答，並試著用轉移注意力（如聽音樂、喝水）來舒緩焦慮。'},
    demo:'用「我慢慢幫您」代替「快一點」；用「您要先喝水還是先洗臉？」代替「去洗臉」；長者情緒激動時先說「我知道您不舒服，我在這裡陪您」，讓情緒先平緩再處理事情。',
    wrong:'長者慢吞吞在扣衣服鈕扣，忍不住說「你怎麼那麼慢」然後直接幫他全部扣好。或是長者又問一次幾點，沒好氣地說「說過了，你沒聽嗎」。',
    icons:[{icon:'🙏',label:'給選擇'},{icon:'🕊',label:'耐心'},{icon:'💬',label:'正向語言'},{icon:'😊',label:'友善態度'}],
    flow:['保持平和語氣與表情','先說明要做什麼，讓長者有準備','提供選擇讓長者自己決定','耐心等待，不催促','長者情緒激動時先安撫再照護'],
    quiz:{q:'照護時為什麼要給長者選擇？',opts:['維持尊嚴並提高配合度','節省時間','讓長者感覺自己做決定即可','照護計畫有規定'],correct:0}},

  {no:'10',
    text:'本課是第一單元的整合複習。外籍看護上工第一天，需要掌握五大核心：了解照護計畫、確認工作邊界、建立溝通方式、尊重隱私尊嚴、建立每日流程。這五件事做好，照護工作就有了穩固的基礎。',
    keypoints:['<strong>照護計畫</strong>：疾病、過敏、用藥、飲食、移位禁忌──一定要看，不懂就問','<strong>工作邊界</strong>：照護、觀察、提醒、回報──醫療決定、金錢管理交給家屬','<strong>溝通方式</strong>：固定時間、事實數據、說明已處理、詢問進一步指示','<strong>隱私尊嚴</strong>：告知、遮蔽、關門、禁止拍照','<strong>每日流程</strong>：晨間→早餐用藥→活動→午休→晚間→紀錄'],
    compare:{cols:['第一天必確認','目的'],rows:[['長者有哪些疾病和過敏','確保照護方式不造成傷害'],['用藥時間和藥物名稱','避免漏藥或給錯藥'],['飲食禁忌和食物質地','確保飲食安全'],['緊急聯絡人電話','緊急時知道找誰'],['環境安全確認（地面、浴室、走道）','預防跌倒']]},
    scenario:{title:'情境：上工第一天自我介紹',lines:[{role:'care',text:'王媽媽您好，我叫 Dewi，今天開始來照顧阿公。'},{role:'care',text:'我有幾件事想確認，可以請您說明照護計畫嗎？'},{role:'elder',text:'好的，阿公有糖尿病和高血壓，每天早晚各有藥...'},{role:'care',text:'（記錄中）好的，請問飲食上有什麼限制嗎？阿公的吞嚥能力如何？'},{role:'care',text:'我每天晚上八點會傳一則訊息給您，說明今天的狀況，有緊急事情我會直接打電話。'}]},
    caution:{type:'info',icon:'💡',title:'建立信任需要時間',text:'第一天家屬可能觀察你的一切，長者可能不配合或不說話。這很正常。保持禮貌、按照計畫做事、主動回報，三到五天後雙方會逐漸建立信任關係。'},
    demo:'第一天上工的三件最重要的事：① 坐下來仔細讀完照護計畫，有問題當場問清楚 ② 向長者自我介紹，用簡短友善的句子說明今天要做什麼 ③ 確認家屬的聯絡方式，並告知每天的回報時間。',
    wrong:'第一天只顧著打掃、煮飯，沒有看照護計畫，結果給了長者不能吃的食物。或是不敢問問題，遇到不確定就自己猜測處理。',
    icons:[{icon:'📋',label:'照護計畫'},{icon:'✅',label:'安全確認'},{icon:'🙏',label:'尊重尊嚴'},{icon:'☎',label:'溝通方式'}],
    flow:['閱讀照護計畫（疾病、過敏、用藥、飲食）','確認環境安全（走道、浴室、臥室）','向長者自我介紹','確認家屬聯絡方式與回報時間','按流程開始第一天的照護工作'],
    quiz:{q:'上工第一天最重要的三件事是什麼？',opts:['看照護計畫、確認安全、建立回報方式','打掃環境、煮飯、陪長者聊天','等家屬指示，什麼都不要自己做','先認識鄰居，確認環境安全'],correct:0}},
  {no:'11',text:'口腔清潔能預防口臭、感染與吸入性肺炎，應每天至少早晚各一次，協助長者洗臉、刷牙或清潔假牙。',demo:'協助長者坐起或抬高床頭，準備牙刷、牙膏、漱口杯與毛巾，刷牙後檢查口腔有無破皮或食物殘留。',wrong:'長者拒絕就直接跳過口腔清潔，或假牙整天未取下清潔。',icons:[{icon:'🪥',label:'牙刷牙膏'},{icon:'💧',label:'漱口'},{icon:'👃',label:'口腔檢查'},{icon:'⏰',label:'早晚各一次'}],flow:['準備牙刷漱口用品','協助坐起或抬高床頭','刷牙與漱口','清潔假牙','檢查口腔是否異常'],quiz:{q:'協助口腔清潔時，正確姿勢是？',opts:['抬高床頭或坐起，避免嗆咳','長者躺平最方便','站著彎腰清潔即可','由長者自己決定姿勢就好'],correct:0}},
  {no:'12',text:'無法下床的長者可用溫水擦澡，依由上到下、由乾淨到髒的部位清潔，過程中要觀察皮膚狀況並注意保暖。',demo:'先關門窗、準備溫水與毛巾，依序擦臉、頸、手、身體、背部與腳，邊擦邊蓋好保暖，避免長時間裸露。',wrong:'用同一條毛巾擦全身，或讓長者長時間裸露受涼。',icons:[{icon:'🛁',label:'溫水毛巾'},{icon:'🧣',label:'保暖'},{icon:'👀',label:'皮膚觀察'},{icon:'🚪',label:'關門隱私'}],flow:['準備溫水與毛巾','關門並注意保暖','由上到下依序擦拭','觀察皮膚狀況','穿衣蓋被保暖'],quiz:{q:'床上擦澡的正確順序原則是？',opts:['由乾淨到髒、由上到下','哪裡方便先擦哪裡','先擦背部再擦臉','長者指定順序即可'],correct:0}},
  {no:'13',text:'沐浴前要確認水溫、準備好衣物與毛巾，並在浴室放置防滑墊，避免長者在進出浴室或站立時滑倒。',demo:'先測試水溫約攝氏40度以下，地面放防滑墊，沐浴椅放穩固，協助坐下後再開始沐浴並全程陪同。',wrong:'水放好才去拿衣服，讓長者久候受涼；浴室地面濕滑卻沒有放防滑墊。',icons:[{icon:'🌡',label:'水溫適中'},{icon:'🧴',label:'沐浴用品'},{icon:'🪑',label:'沐浴椅'},{icon:'⚠',label:'防滑'}],flow:['準備衣物與毛巾','放置防滑墊','測試水溫','協助坐上沐浴椅','全程陪同沐浴'],quiz:{q:'沐浴前最重要的安全準備是？',opts:['確認水溫並做好防滑措施','先把水放滿即可','讓長者自己先進浴室','準備越多用品越好'],correct:0}},
  {no:'14',text:'更衣時動作要輕柔並先告知步驟，原則是先穿患側或無力側、先脫健側，過程中注意保暖避免受涼。',demo:'先說明接下來要更衣，依序協助穿脫上衣與下身，隨時用毛巾或被子蓋住尚未清潔的部位。',wrong:'動作粗暴拉扯手臂，或讓長者長時間裸露身體導致著涼。',icons:[{icon:'👕',label:'更衣'},{icon:'🦾',label:'先穿患側'},{icon:'🧣',label:'保暖'},{icon:'🗣',label:'告知步驟'}],flow:['告知更衣步驟','先穿患側再穿健側','脫衣先脫健側','過程中保暖遮蓋','確認穿著舒適'],quiz:{q:'協助穿衣服時應該先穿哪一側？',opts:['先穿患側或無力側','先穿健側比較快','哪一側都可以','由長者自己選擇'],correct:0}},
  {no:'15',text:'定期修剪指甲、梳理頭髮與清潔皮膚摺痕處（如腋下、腹股溝），可預防感染與皮膚問題，修剪指甲時動作要輕柔。',demo:'修剪前先泡水軟化指甲，剪成圓弧形避免剪太短，梳頭時順便檢查頭皮，並清潔皮膚摺痕處保持乾燥。',wrong:'指甲剪太短或剪到甲肉造成傷口感染；摺痕處長期未清潔導致濕疹或異味。',icons:[{icon:'✂',label:'指甲護理'},{icon:'💇',label:'頭髮梳理'},{icon:'🧴',label:'皮膚清潔'},{icon:'👀',label:'摺痕檢查'}],flow:['泡水軟化指甲','修剪成圓弧形','梳理頭髮並檢查頭皮','清潔皮膚摺痕處','觀察是否有異常'],quiz:{q:'修剪長者指甲時要注意什麼？',opts:['動作輕柔，避免剪到甲肉造成傷口','剪得越短越好','不需要先軟化指甲','可以用任何剪刀直接剪'],correct:0}},
  {no:'16',text:'尿布應依排泄狀況及時更換，更換時清潔會陰部要由前往後擦，避免將細菌帶向尿道造成感染。',demo:'準備新尿布、濕紙巾與看護墊，協助翻身後由前往後輕擦清潔，擦乾皮膚後再更換新尿布。',wrong:'尿布濕了沒有及時更換，或清潔方向由後往前造成感染風險。',icons:[{icon:'🩲',label:'更換尿布'},{icon:'🧻',label:'會陰清潔'},{icon:'🔄',label:'由前往後'},{icon:'👀',label:'皮膚檢查'}],flow:['準備新尿布與用品','協助翻身','由前往後清潔會陰部','擦乾並檢查皮膚','更換新尿布'],quiz:{q:'清潔會陰部時正確方向是？',opts:['由前往後清潔，避免感染','由後往前比較乾淨','哪個方向都可以','只需要清潔前面即可'],correct:0}},
  {no:'17',text:'協助如廁時要兼顧安全與隱私，並觀察排便排尿的次數、顏色、量與性狀，如有異常要紀錄並回報。',demo:'攙扶長者到馬桶並確認坐穩，給予隱私空間但留意安全，事後協助清潔並觀察排泄物狀況。',wrong:'沒有確認長者坐穩就離開，或完全不觀察排泄物狀況就直接沖掉。',icons:[{icon:'🚽',label:'如廁協助'},{icon:'👀',label:'排泄觀察'},{icon:'📝',label:'紀錄'},{icon:'☎',label:'異常回報'}],flow:['攙扶至廁所並確認坐穩','給予隱私並留意安全','陪同等待','協助清潔','觀察並紀錄排泄狀況'],quiz:{q:'協助如廁後，重要的工作是？',opts:['觀察並紀錄排泄物狀況，異常要回報','立刻離開準備下一件事','不需要特別觀察','只要沖水即可'],correct:0}},
  {no:'18',text:'長期臥床的長者要定時翻身（約每2小時一次），並保持床鋪平整乾燥，以降低壓瘡（褥瘡）發生的風險。',demo:'翻身時檢查骶尾、腳跟、手肘等壓力點皮膚是否發紅或破損，床單拉平無皺褶，必要時使用減壓墊。',wrong:'長時間沒有翻身，或床單潮濕、有皺褶卻沒有處理。',icons:[{icon:'🔄',label:'定時翻身'},{icon:'🛏',label:'床鋪平整'},{icon:'👀',label:'壓力點檢查'},{icon:'⏰',label:'每2小時一次'}],flow:['每2小時協助翻身','檢查壓力點皮膚','整理床單拉平無皺褶','使用減壓墊（如有需要）','紀錄翻身時間與皮膚狀況'],quiz:{q:'預防壓瘡最重要的做法是？',opts:['定時翻身並檢查壓力點皮膚','只要床單乾淨就好','長者自己會翻身不用管','等紅腫才開始處理'],correct:0}},
  {no:'19',text:'居家環境清潔的重點在於降低跌倒與感染風險，包括保持地面乾燥、走道暢通與定期消毒常碰觸的物品表面。',demo:'隨時擦乾地面水漬，移除走道上的雜物與電線，定期清潔扶手、門把與輪椅把手等常碰觸處。',wrong:'地面濕滑未處理，雜物堆放在走道造成絆倒風險。',icons:[{icon:'🧹',label:'地面清潔'},{icon:'🚧',label:'通道暢通'},{icon:'🧴',label:'消毒'},{icon:'💡',label:'照明充足'}],flow:['檢查地面是否乾燥','清除走道雜物','消毒常碰觸表面','確認照明充足','定期重複檢查'],quiz:{q:'居家環境清潔的主要目的是？',opts:['減少跌倒與感染風險','讓家裡看起來漂亮','節省打掃時間','方便家屬檢查'],correct:0}},
  {no:'20',text:'本課複習第二單元：清潔照護要注意安全、隱私、保暖與皮膚觀察，並落實居家環境清潔以降低風險。',demo:'老師示範一個情境，學員操作擦澡、更衣或尿布更換流程，並說出過程中要觀察的重點。',wrong:'只記得清潔步驟，卻忽略保暖、隱私或皮膚觀察。',icons:[{icon:'🛁',label:'清潔協助'},{icon:'🙏',label:'隱私保護'},{icon:'🧣',label:'保暖'},{icon:'👀',label:'皮膚觀察'}],flow:['準備清潔用品','告知並保護隱私','執行清潔協助','保暖並協助穿衣','觀察並紀錄回報'],quiz:{q:'進行身體清潔照護時，除了清潔本身還要注意？',opts:['隱私、保暖與皮膚觀察','速度越快越好','只要長者不抗議就好','清潔完即可，不用紀錄'],correct:0}},
  {no:'21',text:'長者飲食基本原則包括均衡營養、依個人疾病與咀嚼吞嚥能力調整質地與份量，並避免過鹹、過油、過硬的食物。',demo:'準備餐食前先確認長者牙齒、假牙與吞嚥狀況，搭配蔬菜、蛋白質與適量主食，份量依食慾調整。',wrong:'不論長者狀況都準備一般成人飲食，導致長者咬不動或吞嚥困難。',icons:[{icon:'🍚',label:'均衡飲食'},{icon:'🦷',label:'咀嚼能力'},{icon:'🧂',label:'少鹽少油'},{icon:'💧',label:'水分充足'}],flow:['確認長者牙齒與吞嚥狀況','選擇均衡食材','調整份量與質地','觀察進食情形','紀錄食量'],quiz:{q:'為長者準備餐食時最重要的原則是？',opts:['依咀嚼吞嚥能力調整食物質地並營養均衡','份量越多越好','口味越重越下飯','跟年輕人吃一樣即可'],correct:0}},
  {no:'22',text:'備餐前後要洗手，食材生熟要分開處理並徹底煮熟，剩餐要標示時間並冷藏，避免食物中毒。',demo:'烹調後盛裝適量份量，剩餘部分標明日期放入冰箱，下次食用前充分加熱後再給長者食用。',wrong:'食物在室溫放置過久才冷藏，或重複加熱多次後仍給長者食用。',icons:[{icon:'🧼',label:'洗手'},{icon:'🌡',label:'妥善保存'},{icon:'📅',label:'標示日期'},{icon:'🍱',label:'分裝'}],flow:['洗手並清潔備餐區','食材生熟分開','徹底煮熟食物','分裝並標示日期','冷藏保存並充分加熱'],quiz:{q:'食物保存最重要的是？',opts:['標示製作時間並依溫度妥善保存','只要外觀沒壞掉就能吃','放越久越省事','常溫放置比較方便'],correct:0}},
  {no:'23',text:'依長者咀嚼與吞嚥能力，將食物調整為一般、軟質、剪碎或泥狀，液體較稀時必要時可使用增稠劑調整濃度。',demo:'評估長者咀嚼狀況後，將肉類剪碎、蔬菜煮軟，吞嚥困難者可在液體中加增稠劑避免嗆咳。',wrong:'不評估能力就一律給予一般質地食物，或泥狀食物太稀導致誤吞。',icons:[{icon:'🥣',label:'泥狀食物'},{icon:'✂',label:'剪碎食物'},{icon:'🍲',label:'軟質食物'},{icon:'🦷',label:'依能力調整'}],flow:['評估咀嚼吞嚥能力','選擇適合的食物質地','切碎或攪打食物','液體加增稠劑（必要時）','分次少量餵食'],quiz:{q:'決定食物質地的依據是？',opts:['長者的咀嚼與吞嚥能力','看護自己方便準備','長者過去的口味','份量多少'],correct:0}},
  {no:'24',text:'餵食時應協助長者坐直至少90度，小口餵食並等待完全吞下後再餵下一口，避免邊吃邊說話或催促。',demo:'協助坐直並用靠墊穩固身體，每口餵食量適中，觀察吞嚥動作後再繼續，用餐後維持坐姿至少30分鐘。',wrong:'讓長者躺著或半坐姿進食，或一次餵太多、太快造成嗆咳。',icons:[{icon:'🪑',label:'坐直90度'},{icon:'🥄',label:'小口慢餵'},{icon:'⏱',label:'速度適中'},{icon:'👀',label:'觀察吞嚥'}],flow:['協助坐直至少90度','小口放入食物','等待完全吞下','確認口腔已清空','繼續下一口'],quiz:{q:'餵食時正確的姿勢與速度是？',opts:['坐直至少90度，小口慢慢餵','躺著餵比較輕鬆','一口餵越多越快越好','站著餵食方便清理'],correct:0}},
  {no:'25',text:'吞嚥困難常見徵兆包括進食時咳嗆、聲音變得濕濡、口中食物殘留或進食時間明顯變長，發現時要記錄並回報。',demo:'餵食時留意長者吞嚥動作，發現咳嗆或聲音改變立即暫停餵食，檢查口腔並記錄發生時間與情況。',wrong:'忽略長者進食時的咳嗆，繼續餵食，或不向家屬反映吞嚥狀況的變化。',icons:[{icon:'🥣',label:'食物'},{icon:'💧',label:'水分'},{icon:'⚠',label:'嗆咳'},{icon:'☎',label:'回報'}],flow:['觀察進食速度與動作','注意是否咳嗆或聲音改變','檢查口腔有無殘留','發現異常立即暫停','紀錄並回報家屬或醫護'],quiz:{q:'觀察吞嚥困難時要注意？',opts:['進食後是否咳嗆、聲音改變或口中殘留食物','只要長者說好吃就沒問題','吃得越快表示越順','不需要特別觀察'],correct:0}},
  {no:'26',text:'長者嗆咳時應立即停止餵食，協助坐直並身體前傾，鼓勵用力咳出異物，嚴重時依訓練協助拍背或哈姆立克法並通知119。',demo:'發現嗆咳立刻停止餵食，扶長者坐直前傾，鼓勵咳嗽；若無法呼吸或臉色發紫，立即呼叫119並依訓練施行急救。',wrong:'嗆咳時繼續餵食，或讓長者平躺、拍打背部方向錯誤。',icons:[{icon:'🛑',label:'停止餵食'},{icon:'🧍',label:'坐直前傾'},{icon:'👐',label:'拍背'},{icon:'☎',label:'119'}],flow:['立即停止餵食','協助坐直並身體前傾','鼓勵用力咳出','視情況拍背或求救','事後觀察並紀錄回報'],quiz:{q:'長者嗆咳時第一步應該？',opts:['立即停止餵食，讓長者坐直並前傾','繼續餵食讓他吃完','立刻給水沖下去','讓長者躺下休息'],correct:0}},
  {no:'27',text:'長者因口渴感降低容易脫水，應定時主動提供水分，並觀察尿量、尿色與口腔乾燥程度等脫水警訊。',demo:'每隔1-2小時主動提供少量水分或湯品，並記錄每日飲水總量，注意尿液顏色是否變深。',wrong:'等長者主動要求才給水，或整天忘記提供水分導致脫水。',icons:[{icon:'💧',label:'定時喝水'},{icon:'🕐',label:'每1-2小時'},{icon:'👁',label:'脫水徵兆'},{icon:'📝',label:'紀錄水量'}],flow:['定時主動提供水分','觀察尿量與尿色','留意口腔乾燥等徵兆','鼓勵少量多次飲用','紀錄每日飲水總量'],quiz:{q:'觀察脫水的警訊包括？',opts:['尿量減少、尿液顏色變深、口乾','長者說不渴就不用補水','只要三餐有喝湯就足夠','流汗多反而不需要補水'],correct:0}},
  {no:'28',text:'糖尿病與高血壓長者需定時定量進食，控制糖分與鹽分攝取，並依醫囑搭配藥物時間用餐。',demo:'依照護計畫安排三餐與點心時間，選擇低糖低鹽食材，並觀察用餐後血糖或血壓的反應。',wrong:'隨意給予含糖飲料或重鹹食物，或忽略用藥與用餐時間的配合。',icons:[{icon:'🍬',label:'控糖'},{icon:'🧂',label:'控鹽'},{icon:'🍽',label:'定時定量'},{icon:'📋',label:'遵照醫囑'}],flow:['確認飲食限制與醫囑','安排定時定量餐點','選擇低糖低鹽食材','配合用藥時間用餐','觀察並紀錄身體反應'],quiz:{q:'糖尿病長者飲食要注意？',opts:['定時定量並控制糖分攝取','可以隨時吃甜食當點心','份量越少越好不限制種類','完全不能吃水果'],correct:0}},
  {no:'29',text:'每日應記錄長者的食量比例、飲水量與用餐時間，發現食量明顯下降或異常時要主動回報家屬。',demo:'用餐後記錄「吃完八分、喝水200ml」等具體數據，連續數日食量下降時主動告知家屬。',wrong:'只寫「吃得不多」等模糊描述，或食量持續下降卻未回報。',icons:[{icon:'📝',label:'食量紀錄'},{icon:'💧',label:'水量紀錄'},{icon:'⏰',label:'用餐時間'},{icon:'☎',label:'異常回報'}],flow:['記錄每餐食量比例','記錄飲水量','記錄異常反應','發現持續下降即回報','保存紀錄供交班參考'],quiz:{q:'食量紀錄應包含哪些內容？',opts:['用餐時間、食量比例、飲水量與異常反應','只要寫吃完或沒吃完即可','只在長者抱怨時才紀錄','由家屬自己觀察記錄就好'],correct:0}},
  {no:'30',text:'本課整合第三單元：餵食前確認食物質地與長者狀況，餵食時注意姿勢與速度，過程中觀察吞嚥反應，並完整紀錄回報。',demo:'老師給一個長者進食情境，學員依序說出餐前準備、餵食姿勢、觀察重點與異常處理方式。',wrong:'只專注完成餵食動作，忽略質地確認、姿勢調整與吞嚥觀察。',icons:[{icon:'🥣',label:'食物質地'},{icon:'🪑',label:'正確姿勢'},{icon:'⚠',label:'嗆咳警覺'},{icon:'📝',label:'紀錄回報'}],flow:['確認飲食限制與質地','協助正確姿勢進食','小口慢餵並觀察吞嚥','發現異常立即處理','完整紀錄並回報'],quiz:{q:'進食照護情境中，最重要的整合原則是？',opts:['確認質地與姿勢、觀察吞嚥、異常立即處理並紀錄','只要餵完餐就完成任務','速度越快效率越高','長者要求什麼就給什麼，不需考量健康'],correct:0}},
  {no:'31',text:'防跌環境檢查包括移除地面雜物與電線、保持照明充足、確認長者穿著合適防滑鞋，並確認輪椅、助行器等輔具就在身邊。',demo:'移位或步行前先巡視周遭環境，清除地上物品與延長線，打開燈光，確認長者鞋子合腳且鞋底防滑。',wrong:'忽略地面有水漬或雜物，或讓長者穿拖鞋、襪子行走。',icons:[{icon:'🚧',label:'清除障礙'},{icon:'💡',label:'照明充足'},{icon:'👟',label:'防滑鞋'},{icon:'🦯',label:'輔具在旁'}],flow:['檢查地面是否乾燥無雜物','移除電線與障礙物','確認照明充足','確認穿著防滑鞋','確認輔具放在順手處'],quiz:{q:'防跌環境檢查的重點是什麼？',opts:['清除障礙物、確認地面乾燥與照明充足','只要長者覺得安全就好','移動越快越好','輔具放遠一點比較整齊'],correct:0}},
  {no:'32',text:'協助站立時應從前方或側面支撐，讓長者雙腳踩穩、身體略微前傾再緩慢起身；坐下時也要緩慢彎曲膝蓋，避免直接跌坐椅面。',demo:'請長者雙手扶住扶手或看護肩膀，身體前傾後緩慢站起，確認站穩後再移動，坐下時引導緩慢彎膝坐穩。',wrong:'直接從後方用力拉長者手臂讓他站起，或讓長者快速坐下造成跌坐受傷。',icons:[{icon:'🦶',label:'雙腳踩穩'},{icon:'🧍',label:'前傾起身'},{icon:'🐢',label:'動作放慢'},{icon:'🤲',label:'支撐到位'}],flow:['確認雙腳踩穩地面','身體略微前傾','緩慢協助起身','站穩後再移動','坐下時緩慢彎膝'],quiz:{q:'協助長者站起時，正確做法是？',opts:['讓長者雙腳踩穩、身體前傾後緩慢起身','直接用力拉手臂讓他站起','從背後抱起比較省力','站起速度越快越好'],correct:0}},
  {no:'33',text:'床到輪椅移位前要先將輪椅靠近床並鎖緊煞車、移開腳踏板，移位時讓長者抓住穩固支撐物，重心緩慢轉移到輪椅上。',demo:'將輪椅以適當角度靠近床邊並鎖煞車，協助長者站起後緩慢轉身，確認對準輪椅後再緩慢坐下。',wrong:'輪椅未鎖煞車就讓長者坐下，或移位過程動作過快造成跌倒。',icons:[{icon:'🛏',label:'輪椅靠床'},{icon:'🔒',label:'鎖緊煞車'},{icon:'🤝',label:'抓穩支撐'},{icon:'🐢',label:'緩慢轉位'}],flow:['輪椅靠床並鎖煞車','移開腳踏板','協助站起','緩慢轉身對準輪椅','緩慢坐下並調整姿勢'],quiz:{q:'床到輪椅移位前的第一步是？',opts:['將輪椅靠近床並鎖好煞車','直接抱起長者放到輪椅上','先移開腳踏板','請長者自己想辦法移動'],correct:0}},
  {no:'34',text:'上下輪椅時務必確認兩側煞車已鎖緊，並移開腳踏板避免絆倒；長者坐穩後再放下腳踏板讓雙腳穩定踩好。',demo:'停妥輪椅、鎖緊雙側煞車、移開腳踏板，協助長者坐入輪椅後再放下腳踏板並調整雙腳位置。',wrong:'只鎖一側煞車，或腳踏板未移開就讓長者站起導致絆倒。',icons:[{icon:'🔒',label:'雙側煞車'},{icon:'🦶',label:'腳踏板'},{icon:'⚠',label:'防夾傷'},{icon:'✅',label:'上下車前確認'}],flow:['停車並鎖緊雙側煞車','上下車前移開腳踏板','協助坐穩或站起','放下腳踏板','再次確認煞車狀態'],quiz:{q:'協助長者上下輪椅時應該？',opts:['先鎖緊煞車並移開腳踏板','腳踏板放著不用管','只鎖一側煞車即可','移動中才鬆開煞車'],correct:0}},
  {no:'35',text:'使用助行器或拐杖前，需將高度調整至使用者手腕自然下垂的高度；行走時遵循「先移動輔具、再移動較弱腳、最後移動較強腳」的步行原則。',demo:'協助調整助行器高度，示範並陪同長者依「輔具→弱腳→強腳」順序緩慢行走，過程中留意平衡。',wrong:'輔具高度過高或過低未調整，或長者使用時雙腳與輔具同時移動造成不穩。',icons:[{icon:'📏',label:'高度調整'},{icon:'🚶',label:'先輔具後腳'},{icon:'🦯',label:'拐杖助行器'},{icon:'🧍',label:'三點支撐'}],flow:['調整輔具高度至手腕位置','先移動輔具','再移動較弱側腳','最後移動較強側腳','重複步驟並保持平衡'],quiz:{q:'使用助行器或拐杖行走的正確順序是？',opts:['先移動輔具，再移動較弱腳，最後移動較強腳','先移動較強的腳最安全','輔具與雙腳同時移動','拐杖放在較強側使用'],correct:0}},

  catch(e){}

function rememberLesson(lno){
  learningLog.lastLesson = {lno, unitNo: Math.ceil(Number(lno)/10), savedAt: new Date().toISOString()};
  saveLearningLog();
}
function rememberAnswer(q, chosenIdx){
  const isRight = chosenIdx === q.quiz.correct;
  const qid = q.id || `${q.lno}-v1`;
  learningLog.questionAttempts = learningLog.questionAttempts || {};
  learningLog.questionAttempts[qid] = {
    id:qid,
    unitNo:q.unitNo || Math.ceil(Number(q.lno)/10),
    lno:q.lno,
    variantNo:Number.isInteger(q.variantNo) ? q.variantNo : 0,
    title:q.title,
    question:q.quiz.q,
    chosen:q.quiz.options[chosenIdx],
    correct:q.quiz.answer,
    isRight,
    savedAt:new Date().toISOString()
  };
  learningLog.wrongQuestionIds = learningLog.wrongQuestionIds || {};
  learningLog.wrongAnswers = learningLog.wrongAnswers || {};
  if(isRight){
    delete learningLog.wrongQuestionIds[qid];
    delete learningLog.wrongAnswers[qid];
    delete learningLog.wrongAnswers[q.lno];
  } else {
    learningLog.wrongQuestionIds[qid] = true;
    learningLog.wrongAnswers[qid] = {
      id:qid, lno:q.lno, title:q.title, question:q.quiz.q,
      chosen:q.quiz.options[chosenIdx], correct:q.quiz.answer,
      savedAt:new Date().toISOString()
    };
  }
  saveLearningLog();
}
function rememberQuizStart(unitNo, mode){
  learningLog.quizAttempts = learningLog.quizAttempts || {};
  const key = mode ? `${mode}:${unitNo || 'all'}` : String(unitNo);
  learningLog.quizAttempts[key] = (learningLog.quizAttempts[key] || 0) + 1;
  saveLearningLog();
}
function rememberUnitComplete(unitNo, correct, total){
  learningLog.unitCompletedAt = learningLog.unitCompletedAt || {};
  learningLog.unitCompletedAt[unitNo] = {
    completedAt:new Date().toISOString(),
    score:correct,
    total
  };
  saveLearningLog();
}
function rememberQuizComplete(mode, unitNo, correct, total){
  learningLog.quizCompletedAt = learningLog.quizCompletedAt || [];

  });

}

// ── PROGRESS STATS ──
function getStats(){
  const units = getCourseUnits();
  let total=0, answered=0, correct=0;
  units.forEach(u=>{
    u.lessons.forEach((title,idx)=>{
      total++;
      const lno = lessonKey(u.no, idx);
      const chosen = lessonQuizState[lno];
      if(Number.isInteger(chosen)){
        answered++;
        const quiz = getQuiz(u, title, idx, lno);
        if(chosen === quiz.correct) correct++;
      }
    });
  });
  return {
    total, answered, correct,
    completeRate: total ? Math.round(answered/total*100) : 0,
    correctRate: answered ? Math.round(correct/answered*100) : 0
  };
}
function getUnitStats(unit){
  let answered=0, correct=0;
  unit.lessons.forEach((title,idx)=>{
    const lno = lessonKey(unit.no, idx);
    const chosen = lessonQuizState[lno];
    if(Number.isInteger(chosen)){
      answered++;
      const quiz = getQuiz(unit, title, idx, lno);
      if(chosen === quiz.correct) correct++;
    }
  });
  return {answered, correct, total: unit.lessons.length};
}
function lessonKey(unitNo, idx){
  return String((unitNo-1)*10 + idx + 1).padStart(2,'0');
}

function parseExtraI18n(raw){
  return raw.trim().split('\n').reduce((map,line)=>{
    const [no, icons='', flow=''] = line.split('|');
    map[no] = {
      icons: icons.split(';').map(s=>s.trim()),
      flow: flow.split(';').map(s=>s.trim())
    };
    return map;
  }, {});
}

function labelToIcon(label){
  for(const [re, icon] of LABEL_ICON_MAP){
    if(re.test(label)) return icon;
  }
  return '💡';
}

function getManualExtras(lno){
  const manual = MANUAL[lno] || MANUAL_EXTRA_ZH[lno];
  if(!manual) return {};
  const i18n = MANUAL_EXTRA_I18N[lang] && MANUAL_EXTRA_I18N[lang][lno];
  const extras = {};
  if(Array.isArray(manual.icons) && manual.icons.length){
    extras.icons = manual.icons.map((item,idx)=>{
      // item may be {icon,label} (MANUAL 01-40) or a plain string (MANUAL_EXTRA_ZH 41-100)
      const isStr = typeof item === 'string';
      const baseLabel = isStr ? item : item.label;
      const baseIcon = isStr ? labelToIcon(baseLabel) : (item.icon || labelToIcon(baseLabel));
      return {
        icon: baseIcon,
        label: (i18n && i18n.icons && i18n.icons[idx]) || baseLabel
      };
    });
  }
  if(Array.isArray(manual.flow) && manual.flow.length){
    extras.flow = (i18n && i18n.flow && i18n.flow.length) ? i18n.flow : manual.flow;
  }
  return extras;
}

function makeI18nKeypoints(pack, labels, flow){
  return [
    `<strong>${pack.key[0]}</strong>: ${labels}`,
    `<strong>${pack.key[1]}</strong>: ${flow[0] || pack.answer}`,
    `<strong>${pack.key[2]}</strong>: ${flow[1] || labels}`,
    `<strong>${pack.key[3]}</strong>: ${flow[flow.length-1] || pack.answer}`
  ];
}

function makeI18nQuizOptions(pack, correctAnswer){
  const dists = Array.isArray(DISTRACTOR_BANKS[lang]) ? DISTRACTOR_BANKS[lang] : DISTRACTOR_BANKS.en;
  return [correctAnswer, dists[0], dists[1], dists[2]];
}

function buildDetailedI18nMaterial(unit, title, idx, lno){
  if(lang === 'zh') return null;
  const pack = DETAILED_I18N_PACK[lang] || DETAILED_I18N_PACK.en;
  const extras = getManualExtras(lno);
  const labels = (extras.icons || []).map(x=>x.label).filter(Boolean).join(', ') || title;
  const flow = (extras.flow || []).filter(Boolean);
  const flowText = flow.length ? flow.map((s,i)=>`${i+1}. ${s}`).join(' -> ') : pack.answer;
  const special = pack.specials && pack.specials[lno];
  const answer = (special && special.answer) || pack.answer;
  return {
    text: (special && special.text) || pack.text(title, unit, labels, flowText),
    keypoints: (special && special.keypoints) || makeI18nKeypoints(pack, labels, flow),
    caution: {type:'info', title:pack.cautionTitle, text:pack.cautionText},
    scenario: {title:pack.scenarioTitle, lines:pack.scenario(title)},
    demo: (special && special.demo) || pack.demo(title, flowText),
    wrong: (special && special.wrong) || pack.wrong(title, labels),
    ...extras,
    quiz: {q: pack.q(title), opts: makeI18nQuizOptions(pack, answer), correct: 0, answer}
  };
}

function richLabelsFrom(mat, title){
  return (mat.icons || []).map(x=>x.label).filter(Boolean).join(', ') || title;
}

function richFlowFrom(mat){
  return (mat.flow || []).filter(Boolean);
}

function buildRichMaterial(unit, title, idx, lno){
  const pack = RICH_DEPTH_PACK[lang] || RICH_DEPTH_PACK.zh;
  const extras = getManualExtras(lno);
  const labels = richLabelsFrom(extras, title);
  const flow = richFlowFrom(extras);
  const flowText = flow.length ? flow.map((s,i)=>`${i+1}. ${s}`).join(' -> ') : pack.answer;
  return {
    text: pack.deepText(title, unit, labels, flowText),
    keypoints: [
      `<strong>${pack.target}</strong>: ${title}`,
      `<strong>${pack.observe}</strong>: ${labels}`,
      `<strong>${pack.action}</strong>: ${flow[0] || pack.answer}`,
      `<strong>${pack.report}</strong>: ${flow[flow.length-1] || pack.answer}`
    ],
    caution:{type:'info', title:pack.cautionTitle, text:pack.cautionText},
    scenario:{title:pack.scenarioTitle, lines:pack.scenario(title)},
    compare:{cols:pack.compareCols, rows:pack.compareRows(title, labels)},
    demo: pack.demo(title, flowText),
    wrong: pack.wrong(title, labels),
    ...extras,
    quiz:{q:pack.q(title), opts:[pack.answer, ...(Array.isArray(DISTRACTOR_BANKS[lang]) ? DISTRACTOR_BANKS[lang] : DISTRACTOR_BANKS.zh[unit.no] || DISTRACTOR_BANKS.en).slice(0,3)], correct:0, answer:pack.answer}
  };
}

function enrichMaterialDepth(mat, unit, title, idx, lno){
  const pack = RICH_DEPTH_PACK[lang] || RICH_DEPTH_PACK.zh;
  const base = buildRichMaterial(unit, title, idx, lno);
  const merged = {...base, ...mat};
  const labels = richLabelsFrom(merged, title);
  if(!Array.isArray(merged.keypoints) || merged.keypoints.length < 4) merged.keypoints = base.keypoints;
  if(!merged.caution) merged.caution = base.caution;
  if(!merged.scenario) merged.scenario = base.scenario;
  if(!merged.compare) merged.compare = {cols:pack.compareCols, rows:pack.compareRows(title, labels)};
  if(!Array.isArray(merged.infopills) || !merged.infopills.length){
    merged.infopills = [
      {icon:'🎯',label:pack.target,val:title},
      {icon:'👀',label:pack.observe,val:labels},
      {icon:'📝',label:pack.report,val:pack.report}
    ];
  }
  if((merged.text || '').length < 150) merged.text = `${merged.text || ''} ${base.text}`.trim();
  if((merged.demo || '').length < 90) merged.demo = `${merged.demo || ''} ${base.demo}`.trim();
  if((merged.wrong || '').length < 90) merged.wrong = `${merged.wrong || ''} ${base.wrong}`.trim();
  if(!merged.quiz || (!Array.isArray(merged.quiz.opts) && !merged.quiz.answer)) merged.quiz = base.quiz;
  return merged;
}

function getMaterial(unit, title, idx, lno){
  // Try per-lesson i18n first (lessons 01-10 in all 4 languages)
  const i18nLesson = LESSON_I18N[lang] && LESSON_I18N[lang][lno];
  if(i18nLesson){
    const base = MANUAL[lno] || {};
    // icons and flow always come from MANUAL (language-independent structure)
    // vocab icon defaults: assign from a shared icon list if not present
    const VOCAB_ICONS = ['📋','🧓','🧠','🙏','✅','🚫','📝','☎','🤝','👀','🚧','🗣','🚪','🙈','📵','💊','🍽','🔄','🌅','🍚','🚶','🕐','📊','📷','🐢','❓','🕊','😊','💬','💙'];
    const PILL_ICONS  = ['⏰','👥','📞','🗣️','🚪','🧣','📋','❓','✅','🌅','🍳','🚶','😴','🌙'];
    const vocab = (i18nLesson.vocab||[]).map((v,i)=>({icon: VOCAB_ICONS[i]||'📌', ...v}));
    const infopills = (i18nLesson.infopills||[]).map((p,i)=>({icon: PILL_ICONS[i]||'📌', ...p}));
    return enrichMaterialDepth({
      ...i18nLesson,
      vocab,
      infopills,
      icons: base.icons || [],
      flow:  base.flow  || [],
      quiz:  base.quiz  || {}
    }, unit, title, idx, lno);
  }
  // zh fallback: use MANUAL directly (for lessons 01-10 when zh i18n somehow missing)
  if(lang === 'zh' && MANUAL[lno]) return enrichMaterialDepth(MANUAL[lno], unit, title, idx, lno);
  if(lang === 'zh') return buildRichMaterial(unit, title, idx, lno);
  // Other languages: build full per-lesson translated material from translated titles, icons, and care-flow steps.
  const detailed = buildDetailedI18nMaterial(unit, title, idx, lno);
  if(detailed) return enrichMaterialDepth(detailed, unit, title, idx, lno);
  const p = getLangPack();
  const outcome = unit.outcomes[idx % unit.outcomes.length] || '';
  return enrichMaterialDepth({
    text: `${p.textPrefix || 'This lesson covers'} "${title}". ${outcome}`,
    demo: `${p.practice || 'Demo'}: Explain the task, confirm environment and elder status, follow the care plan, then record and report.`,
    wrong: `${p.mistake || 'Wrong case'}: Starting without safety check or without informing the elder can cause injury or misunderstanding.`,
    ...getManualExtras(lno),
    quiz: {q: p.quizQuestion || `What is the best approach for "${title}"?`, answer: p.defaultAnswer || 'Check the care plan, confirm safety, and inform the elder before starting'}
  }, unit, title, idx, lno);
}
function getQuiz(unit, title, idx, lno){
  const mat = getMaterial(unit, title, idx, lno);
  const raw = mat.quiz;
  // Check LESSON_I18N for lang-specific quiz override (EN/ID/VI lessons 01-10)
  const i18nLesson = LESSON_I18N[lang] && LESSON_I18N[lang][lno];
  if(i18nLesson && i18nLesson.quizQ && Array.isArray(i18nLesson.quizOpts)){
    return {
      q: i18nLesson.quizQ,
      options: i18nLesson.quizOpts,
      correct: i18nLesson.quizCorrect !== undefined ? i18nLesson.quizCorrect : (raw && raw.correct) || 0,
      answer: i18nLesson.quizOpts[i18nLesson.quizCorrect !== undefined ? i18nLesson.quizCorrect : 0],
      tip: i18nLesson.quizTip || ''
    };
  }
  // Use explicit translated quiz options when the material provides them.
  if(raw && Array.isArray(raw.opts)){
    return {q: raw.q, options: raw.opts, correct: raw.correct, answer: raw.opts[raw.correct], tip: raw.tip || ''};
  }
  const p = getLangPack();
  const question = (raw && raw.q) || p.quizQuestion || `What is the best approach for "${title}"?`;
  const answer = (raw && raw.answer) || p.defaultAnswer || 'Check the care plan, confirm safety, and inform the elder before starting';
  const unitNo = unit.no;
  let dists;
  if(lang === 'zh'){
    dists = (DISTRACTOR_BANKS.zh[unitNo] || DISTRACTOR_BANKS.zh[1]).slice();
  } else {
    dists = (Array.isArray(DISTRACTOR_BANKS[lang]) ? DISTRACTOR_BANKS[lang] : DISTRACTOR_BANKS.en).slice();
  }
  const correctIdx = (unitNo * 7 + idx * 3) % 4;
  const opts = [];
  let d = 0;
  for(let i=0;i<4;i++) opts.push(i===correctIdx ? answer : dists[d++ % dists.length]);
  const tip = lang==='zh'
    ? `答錯時請回到「${title}」的課文與示範，找出安全檢查、尊重告知、紀錄回報三個關鍵。`
    : (p.tipPrefix || '');
  return {q: question, options: opts, correct: correctIdx, answer, tip};
}
function getLangPack(){
  const packs = {
    zh:{textPrefix:'本課主題是',mustKnow:'學員要理解',practice:'示範做法',mistake:'錯誤案例',
      quizQuestion:'進行這一課時，最適合的做法是什麼？',
      defaultAnswer:'先確認照護計畫、環境安全與長者狀態，再開始協助',
      tipPrefix:'請回到課文與示範，重新找出安全檢查、尊重告知、紀錄回報三個關鍵。'},
    id:{textPrefix:'Topik pelajaran ini adalah',mustKnow:'Peserta perlu memahami',practice:'Contoh praktik',mistake:'Contoh salah',
      quizQuestion:'Saat menjalankan pelajaran ini, tindakan yang paling tepat adalah apa?',
      defaultAnswer:'Periksa rencana perawatan, keamanan lingkungan, dan kondisi lansia sebelum mulai',
      tipPrefix:'Baca kembali teks dan contoh. Cari tiga kunci: cek keamanan, beri tahu dengan hormat, catat dan laporkan.'},
    en:{textPrefix:'This lesson focuses on',mustKnow:'Learners should understand',practice:'Demo',mistake:'Wrong case',
      quizQuestion:'When doing this lesson, what is the best first action?',
      defaultAnswer:'Check the care plan, environment safety, and the elder\'s condition before starting',
      tipPrefix:'Review the lesson text and demo. Find the three keys: safety check, respectful explanation, and clear records.'},
    vi:{textPrefix:'Bài học này tập trung vào',mustKnow:'Học viên cần hiểu',practice:'Làm mẫu',mistake:'Ví dụ sai',
      quizQuestion:'Khi thực hiện bài này, việc phù hợp nhất cần làm trước là gì?',
      defaultAnswer:'Kiểm tra kế hoạch chăm sóc, an toàn môi trường và tình trạng người cao tuổi trước khi bắt đầu',
      tipPrefix:'Đọc lại bài học và phần làm mẫu. Tìm ba điểm chính: kiểm tra an toàn, giải thích tôn trọng, ghi chép và báo cáo.'}
