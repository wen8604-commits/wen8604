function renderLessonRow(unit, title, idx, lno, isOpen, totalLessons, cp){
  const mat = getMaterial(unit, title, idx, lno);
  const lnoNum = Number(lno);
  const prevDisabled = lnoNum <= 1;
  const nextDisabled = lnoNum >= totalLessons;
  const chosen = lessonQuizState[lno];
  const hasAnswered = Number.isInteger(chosen);
  const isCorrect = hasAnswered && chosen === (()=>{const q=getQuiz(unit,title,idx,lno);return q.correct;})();
  const rowClass = hasAnswered ? (isCorrect ? ' is-correct' : ' is-wrong') : '';
  let statusBadge = '';
  if(hasAnswered){
    if(isCorrect){
      statusBadge = `<span class=\"lesson-status-badge correct\"><i class=\"ti ti-check" style="font-size:10px\"></i> ${cp.answerOk_short||'答對'}</span>`;
    } else {
      statusBadge = `<span class=\"lesson-status-badge wrong\"><i class=\"ti ti-x" style="font-size:10px\"></i> ${cp.answerNo_short||'答錯'}</span>`;
    }
  }

  // Render helpers
  function renderKeypoints(items, color){
    if(!items||!items.length) return '';
    return `<div class=\"lesson-keypoints\">${items.map((kp,i)=>`
      <div class=\"lesson-kp-item\">
        <span class=\"lesson-kp-num" style="background:${color}\">${i+1}</span>
        <span class=\"lesson-kp-text\">${kp}</span>
      </div>`).join('')}</div>`;
  }
  function renderCaution(item){
    if(!item) return '';
    const cls = item.type||'';
    const icon = item.type==='danger'?'⚠️':item.type==='info'?'💡':'⚡';
    return `<div class=\"lesson-caution ${cls}\">
      <span class=\"lesson-caution-icon\">${item.icon||icon}</span>
      <div><div class=\"lesson-caution-title\">${item.title||'注意'}</div>
      <div class=\"lesson-caution-text\">${item.text}</div></div>
    </div>`;
  }
  function renderVocab(items){
    if(!items||!items.length) return '';
    return `<div class=\"lesson-vocab-grid\">${items.map(v=>`
      <div class=\"lesson-vocab-card\">
        <div class=\"lesson-vocab-term\">${v.icon?`<span>${v.icon}</span>`:''}${v.term}</div>
        <div class=\"lesson-vocab-def\">${v.def}</div>
      </div>`).join('')}</div>`;
  }
  function renderScenario(sc){
    if(!sc) return '';
    return `<div class=\"lesson-scenario\">
      <div class=\"lesson-scenario-header\"><i class=\"ti ti-messages\"></i> ${sc.title||'情境對話'}</div>
      <div class=\"lesson-scenario-body\">${sc.lines.map(l=>`
        <div class=\"lesson-scenario-line\">
          <span class=\"lesson-scenario-role ${l.role==='care'?'care':'elder'}\">${l.role==='care'?(cp.roleCaregiver||'照護員'):(cp.roleElder||'長者')}</span>
          <span class=\"lesson-scenario-line-text\">${l.text}</span>
        </div>`).join('')}</div>
    </div>`;
  }
  function renderCompare(tbl){
    if(!tbl) return '';

function onLessonToggle(details, lno){
  if(details.open) setCurrentLesson(lno);
  const chevron = details.closest('.lesson-row').querySelector('.lesson-row-chevron');
  if(chevron) chevron.style.transform = details.open ? 'rotate(180deg)' : '';
}

function setCurrentLesson(lno){
  currentLessonNo = lno;
  rememberLesson(lno);
}

// answerQuiz moved to quiz mode

function moveLesson(delta, lno){
  const units = getCourseUnits();
  const totalLessons = units.reduce((s,u)=>s+u.lessons.length, 0);
  const next = Math.max(1, Math.min(totalLessons, Number(lno) + delta));
  const nextStr = String(next).padStart(2,'0');
  const nextUnitNo = Math.ceil(next/10);

  if(nextUnitNo !== currentUnitNo){
    currentUnitNo = nextUnitNo;
    currentLessonNo = nextStr;
    renderSidebar();
    renderUnitView();
    setTimeout(()=>{
      const el = document.getElementById('lr-'+nextStr);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 60);
  } else {
    // Close current, open next in same unit
    currentLessonNo = nextStr;
    // Close all details first
    document.querySelectorAll('.lesson-row details[open]').forEach(d=>d.removeAttribute('open'));
    const target = document.getElementById('lr-'+nextStr);
    if(target){
      const details = target.querySelector('details');
      if(details){
        details.setAttribute('open','');
        setTimeout(()=>target.scrollIntoView({behavior:'smooth', block:'start'}), 60);
      }
    }
  }
}

// QUIZ MODE (independent)
// ══════════════════════════════════════
const QUIZ_VARIANT_COUNT = 4;
const QUIZ_UNIT_DRAW_COUNT = 10;
const QUIZ_MIXED_DRAW_COUNT = 20;
const QUIZ_MOCK_DRAW_COUNT = 40;

let quizState = {
  unitNo: 1,
  mode: 'unit',
  questions: [],   // [{lno, title, idx, quiz}]
  current: 0,
  answers: [],     // chosen index per question, or null
};

function quizVariant(base, title, variantNo){
  if(variantNo === 0) return base;
  const options = base.options.slice();
  const answer = options[base.correct];
  const variantCopy = {
    zh:[
      '',
      `情境判斷：「${title}」時，哪一個做法最安全？`,
      `複習題：「${title}」最重要的照護原則是什麼？`,
      `錯誤辨識：「${title}」時，哪一個選項最應避免？`
    ],
    id:[
      '',
      `Penilaian situasi: Saat "${title}", tindakan mana yang paling aman?`,
      `Ulangan: Prinsip perawatan terpenting untuk "${title}" adalah apa?`,
      `Kenali kesalahan: Saat "${title}", pilihan mana yang harus dihindari?`
    ],
    en:[
      '',
      `Scenario check: During "${title}", which action is safest?`,
      `Review question: What is the most important care principle for "${title}"?`,
      `Mistake check: During "${title}", which choice should be avoided most?`
    ],
    vi:[
      '',
      `Tình huống: Khi "${title}", cách nào an toàn nhất?`,
      `Ôn tập: Nguyên tắc chăm sóc quan trọng nhất của "${title}" là gì?`,
      `Nhận biết lỗi: Khi "${title}", lựa chọn nào cần tránh nhất?`
    ]
  };
  const q = (variantCopy[lang] || variantCopy.zh)[variantNo] || base.q;
  return {...base, q, options, answer, correct:base.correct};
}
function shuffleItems(items){
  const arr = items.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function makeQuestionId(lno, variantNo){
  return `${lno}-v${variantNo+1}`;
}
function buildQuestionBank(unitNo, unit){
  return unit.lessons.flatMap((title, idx) => {
    const lno = lessonKey(unitNo, idx);
    const base = getQuiz(unit, title, idx, lno);
    return Array.from({length:QUIZ_VARIANT_COUNT}, (_,variantNo) => ({
      id:makeQuestionId(lno, variantNo),
      unitNo,
      unitTitle:unit.title,
      lno,
      title,
      idx,
      variantNo,
      quiz:quizVariant(base, title, variantNo)
    }));
  });
}
function buildFullQuestionBank(){
  return getCourseUnits().flatMap(u => buildQuestionBank(u.no, u));
}
function rebuildQuestionForCurrentLang(oldQuestion){
  if(!oldQuestion || !oldQuestion.id) return oldQuestion;
  const units = getCourseUnits();
  const unitNo = oldQuestion.unitNo || Math.ceil(Number(oldQuestion.lno)/10);
  const unit = units.find(u=>u.no===unitNo);
  if(!unit) return oldQuestion;
  const idx = Number.isInteger(oldQuestion.idx) ? oldQuestion.idx : ((Number(oldQuestion.lno)-1) % 10);
  const title = unit.lessons[idx];
  if(!title) return oldQuestion;
  const lno = lessonKey(unitNo, idx);
  const base = getQuiz(unit, title, idx, lno);
  const variantNo = Number.isInteger(oldQuestion.variantNo) ? oldQuestion.variantNo : 0;
  return {
    ...oldQuestion,
    id:makeQuestionId(lno, variantNo),
    unitNo,
    unitTitle:unit.title,
    lno,
    title,
    idx,
    variantNo,
    quiz:quizVariant(base, title, variantNo)
  };
}
function syncQuizStateLanguage(){
  if(!quizState || !Array.isArray(quizState.questions) || !quizState.questions.length) return;
  quizState.questions = quizState.questions.map(q => rebuildQuestionForCurrentLang(q));
}
function getQuizBankStats(){
  const bank = buildFullQuestionBank();
  const validIds = new Set(bank.map(q=>q.id));
  const attempts = learningLog.questionAttempts || {};
  let answered = 0, correct = 0;
  Object.keys(attempts).forEach(id=>{
    if(!validIds.has(id)) return;
    answered++;
    if(attempts[id] && attempts[id].isRight) correct++;
  });
  const wrongIds = Object.keys(learningLog.wrongQuestionIds || {}).filter(id=>validIds.has(id));
  return {
    total: bank.length,
    answered,
    correct,
    wrong: wrongIds.length,
    completeRate: bank.length ? Math.round(answered/bank.length*100) : 0,
    correctRate: answered ? Math.round(correct/answered*100) : 0
  };
}
function getUnitBankStats(unit){
  const bank = buildQuestionBank(unit.no, unit);
  const attempts = learningLog.questionAttempts || {};
  let answered = 0, correct = 0;
  bank.forEach(q=>{
    if(attempts[q.id]){
      answered++;
      if(attempts[q.id].isRight) correct++;
    }
  });
  return {answered, correct, total: bank.length};
}
function getWrongQuestionBank(){
  const bank = buildFullQuestionBank();
  const byId = new Map(bank.map(q=>[q.id,q]));
  return Object.keys(learningLog.wrongQuestionIds || {}).map(id=>byId.get(id)).filter(Boolean);
}
function buildMockQuestionSet(units){
  const perUnit = Math.max(1, Math.floor(QUIZ_MOCK_DRAW_COUNT / units.length));
  return units.flatMap(u=>shuffleItems(buildQuestionBank(u.no, u)).slice(0, perUnit)).slice(0, QUIZ_MOCK_DRAW_COUNT);
}
function getQuizTitle(state, unit, cp){
  if(state.mode === 'mixed') return cp.qcMixedTitle || '全題庫混合測驗';
  if(state.mode === 'mock') return cp.qcMockTitle || '綜合模擬測驗';
  if(state.mode === 'wrong') return cp.qcWrongTitle || '錯題強化練習';
  return unit ? unit.title : (cp.qcUnitTitle || '單元練習');
}
function openQuiz(unitNo, mode='unit'){
  currentView = 'quiz';
  mainTab = 'quiz';
  const units = getCourseUnits();
  let unit = units.find(u=>u.no===unitNo) || units[0];
  let bank = [];
  let drawCount = QUIZ_UNIT_DRAW_COUNT;

  if(mode === 'mixed'){
    unitNo = 0;
    bank = buildFullQuestionBank();
    drawCount = QUIZ_MIXED_DRAW_COUNT;
  } else if(mode === 'mock'){
    unitNo = 0;
    bank = buildMockQuestionSet(units);
    drawCount = QUIZ_MOCK_DRAW_COUNT;
  } else if(mode === 'wrong'){
    unitNo = 0;
    bank = getWrongQuestionBank();
    drawCount = Math.min(QUIZ_MIXED_DRAW_COUNT, bank.length);
    if(!bank.length){
      currentView = 'quiz-center';
      renderSidebar();
      renderQuizCenter();
      return;
    }
  } else {
    currentUnitNo = unitNo;
    bank = buildQuestionBank(unitNo, unit);
    drawCount = QUIZ_UNIT_DRAW_COUNT;
  }

  const questions = shuffleItems(bank).slice(0, Math.min(drawCount, bank.length));
  rememberQuizStart(unitNo, mode);
  quizState = {unitNo, mode, questions, current: 0, answers: Array(questions.length).fill(null), loggedComplete:false};
  renderSidebar();
  renderQuizView();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function goQuizCenter(){
  currentView = 'quiz-center';
  mainTab = 'quiz';
  renderSidebar();
  renderQuizCenter();
  window.scrollTo({top:0,behavior:'smooth'});
}

  // Check if showing result screen
  const allAnswered = answers.every(a => a !== null);
  const isDone = allAnswered && current >= total;

  if(isDone){
    const correct = answers.filter((a,i)=> a === questions[i].quiz.correct).length;
    if(!quizState.loggedComplete){
      if(quizState.mode === 'unit' && unit) rememberUnitComplete(unit.no, correct, total);
      rememberQuizComplete(quizState.mode, quizState.unitNo, correct, total);
      quizState.loggedComplete = true;
    }
    const pct = Math.round(correct/total*100);
    const emoji = pct===100?'🎉':pct>=70?'👍':pct>=50?'😊':'💪';
    // Build per-question review
    const reviewItems = questions.map((q,i)=>{
      const chosen = answers[i];
      const isRight = chosen === q.quiz.correct;
      const letters = ['A','B','C','D'];
      return `<div style=\"display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:9px;margin-bottom:6px;background:${isRight?'var(--g50)':'var(--red-50)'};border:1px solid ${isRight?'var(--g100)':'var(--red-100)'};\">
        <span style=\"font-size:12px;font-weight:900;color:${isRight?'var(--g700)':'var(--red-700)'};width:18px\">${isRight?'✓':'✗'}</span>
        <span style=\"font-size:12.5px;color:var(--gray-700);flex:1;line-height:1.45\">${q.quiz.q}</span>
        <span style=\"font-size:11px;font-weight:700;color:${isRight?'var(--g600)':'var(--red-600)'};flex-shrink:0\">${letters[q.quiz.correct]}</span>
      </div>`;
    }).join('');

    document.getElementById('main-content').innerHTML = `
    <div class=\"quiz-mode-header\">
      <button class=\"back-btn" onclick="goQuizCenter()\"><i class=\"ti ti-arrow-left" style="font-size:14px\"></i> ${cp.back}</button>
      <div class=\"quiz-mode-meta\">
        <div class=\"quiz-mode-kicker\">${cp.tabQuiz||'測驗中心'}</div>
        <div class=\"quiz-mode-title\">${quizTitle}</div>
      </div>
    </div>
    <div class=\"quiz-result\">
      <div style=\"font-size:42px;margin-bottom:10px\">${emoji}</div>
      <div class=\"quiz-result-score\">${correct}<span style=\"font-size:24px;color:var(--gray-400)\">/${total}</span></div>
      <div class=\"quiz-result-total\">${pct}%</div>
      <div class=\"quiz-result-label\">${cp.quizResultLabel||'測驗完成'}</div>
      <div class=\"quiz-result-actions\">
        <button class=\"quiz-result-btn primary" onclick="retryQuiz()\">${cp.quizRetry||'重新測驗'}</button>
        <button class=\"quiz-result-btn secondary" onclick="goQuizCenter()\">${cp.quizBackHome||'回測驗中心'}</button>
        ${unit?`<button class=\"quiz-result-btn secondary" onclick="openUnit(${unit.no})\">${cp.quizBackLesson||'回課文'}</button>`:''}
      </div>
      <div style=\"margin-top:20px;text-align:left\">
        <div style=\"font-size:11.5px;font-weight:800;color:var(--gray-500);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px\">${cp.qcReview||'題目回顧'}</div>
        ${reviewItems}
      </div>
    </div>`;
    return;
  }

  const q = questions[current];
  const chosen = answers[current];
  const answered = chosen !== null;
  const isCorrect = answered && chosen === q.quiz.correct;
  const letters = ['A','B','C','D'];
  const pctBar = Math.round((current / total) * 100);
  const isLast = current === total - 1;

  const opts = q.quiz.options.map((opt, oi) => {
    let cls = '';
    if(answered && oi === q.quiz.correct) cls = ' correct';
    if(answered && oi === chosen && oi !== q.quiz.correct) cls = ' wrong selected';
    else if(answered && oi === chosen) cls += ' selected';
    return `<button type=\"button" class="quiz-choice${cls}" ${answered?'disabled':''} onclick="quizAnswer(${oi})\">
      <div class=\"quiz-choice-letter\">${letters[oi]}</div>
      <div>${opt}</div>
    </button>`;
  }).join('');

  const resultHtml = answered ? `
    <div class=\"quiz-answer-bar ${isCorrect?'ok':'no'}\">${isCorrect?(cp.answerOk||'✓ 答對了！'):(cp.answerNo||'✗ 答錯了。')} ${cp.correctAnswer||'正確答案'}：${letters[q.quiz.correct]}. ${q.quiz.answer}</div>
    ${!isCorrect ? `<div class=\"quiz-tip-bar\">${cp.wrongTip||'提示'}: ${q.quiz.tip || ''}</div>` : ''}
    <button class=\"quiz-next-btn" onclick="quizNext()\">
      ${isLast ? (cp.quizFinish||'查看結果') : (cp.quizNext||'下一題 →')}
    </button>` : '';

  document.getElementById('main-content').innerHTML = `
  <div class=\"quiz-mode-header\">
    <button class=\"back-btn" onclick="goQuizCenter()\"><i class=\"ti ti-arrow-left" style="font-size:14px\"></i> ${cp.back}</button>
    <div class=\"quiz-mode-meta\">
      <div class=\"quiz-mode-kicker\">${cp.tabQuiz||'測驗中心'}</div>
      <div class=\"quiz-mode-title\">${quizTitle}</div>
    </div>
  </div>
  <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap\">
    <div style=\"display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--gray-500)\">
      <i class=\"ti ti-list-numbers" style="font-size:14px;color:var(--purple-700)\"></i>
      <span style=\"color:var(--gray-700)\">${(cp.quizOf||'第 %a 題，共 %b 題').replace('%a',current+1).replace('%b',total)}</span>
    </div>
    ${answeredCount>0?`<div style=\"display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--gray-500)\">
      <i class=\"ti ti-check" style="font-size:14px;color:var(--g600)\"></i>
      <span>${cp.qcCorrectSoFar||'已答對'} <span style=\"color:var(--g700)\">${correctCount}</span> / ${answeredCount}</span>
    </div>`:''}
  </div>
  <div class=\"quiz-progress-bar-wrap\">
    <div class=\"quiz-progress-bar-fill" style="width:${pctBar}%\"></div>
  </div>
  <div class=\"quiz-card\">
    <div class=\"quiz-card-num\">${(cp.quizOf||'第 %a 題，共 %b 題').replace('%a',current+1).replace('%b',total)}</div>
    <div class=\"quiz-card-q\">${q.quiz.q}</div>
    <div class=\"quiz-choices\">${opts}</div>
    ${resultHtml}
  </div>`;
}

function quizAnswer(chosenIdx){
  if(quizState.answers[quizState.current] !== null) return; // already answered
  const q = quizState.questions[quizState.current];
  quizState.answers[quizState.current] = chosenIdx;
  lessonQuizState[q.lno] = chosenIdx;
  rememberAnswer(q, chosenIdx);
  saveState();
  renderSidebar();
  renderQuizView();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function quizNext(){
  if(quizState.current < quizState.questions.length - 1){
    quizState.current++;
  } else {
    // Mark done
    quizState.current = quizState.questions.length;
  }
  renderQuizView();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function retryQuiz(){
  openQuiz(quizState.unitNo, quizState.mode || 'unit');
}

// ── RESET ──
function resetProgress(){
  const cp = UI_COPY[lang] || UI_COPY.zh;
  if(!confirm(cp.resetConfirm || '確定要重置所有答題進度嗎？')) return;
  lessonQuizState = {};
  learningLog = {};
  saveState();
  saveLearningLog();
  renderSidebar();
  if(currentView === 'quiz-center') renderQuizCenter();
  else renderHome();
}

// ── INIT ──
renderSidebar();
renderHome();
</script>
</body>
</html>
