<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外籍看護訓練學習平台 v10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ── Tokens ── */
:root{
  --g900:#063D31;--g800:#085041;--g700:#0A6652;--g600:#158866;
  --g500:#1D9E75;--g400:#2FBD8C;--g300:#5DCAA5;--g200:#9FE1CB;
  --g100:#D4F3E8;--g50:#EAF8F2;
  --gray-900:#111;--gray-700:#374151;--gray-600:#4B5563;
  --gray-500:#6B7280;--gray-400:#9CA3AF;--gray-300:#D1D5DB;
  --gray-200:#E5E7EB;--gray-100:#F3F4F6;--gray-50:#F9FAFB;
  --red-700:#B91C1C;--red-500:#EF4444;--red-50:#FEF2F2;--red-100:#FEE2E2;
  --amber-700:#B45309;--amber-50:#FFFBEB;--amber-100:#FEF3C7;
  --blue-700:#1D4ED8;--blue-50:#EFF6FF;--blue-100:#DBEAFE;
  --purple-700:#6D28D9;--purple-50:#F5F3FF;--purple-100:#EDE9FE;
  --white:#fff;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;
  --sh-xs:0 1px 2px rgba(0,0,0,.06);
  --sh-sm:0 1px 4px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.05);
  --sh-md:0 4px 16px rgba(0,0,0,.09);
  --sh-lg:0 8px 28px rgba(0,0,0,.12);
  --font:'Noto Sans TC','Inter',-apple-system,sans-serif;
  --sidebar-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:#F0F4F8;min-height:100dvh;color:var(--gray-900);font-size:15px}

/* ═══════ LAYOUT SHELL ═══════ */
.shell{display:flex;min-height:100dvh}

/* ═══════ SIDEBAR ═══════ */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:#fff;
  border-right:1px solid var(--gray-200);
  display:flex;flex-direction:column;
  position:fixed;left:0;top:0;bottom:0;z-index:300;
  overflow:hidden;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
@media(max-width:959px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--sh-lg)}
}
@media(min-width:960px){
  .main-area{margin-left:var(--sidebar-w)}
}

/* Sidebar overlay */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:290;backdrop-filter:blur(2px)}
.sb-overlay.show{display:block}

/* Sidebar top brand */
.sb-brand{
  padding:18px 16px 14px;
  border-bottom:1px solid var(--gray-100);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.sb-brand-info{display:flex;align-items:center;gap:10px}
.sb-brand-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--g800),var(--g500));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;flex-shrink:0;
}
.sb-brand-name{font-size:13px;font-weight:800;color:var(--gray-900);line-height:1.3}
.sb-brand-sub{font-size:10px;color:var(--gray-500);margin-top:1px}
.sb-close-btn{display:none;border:none;background:var(--gray-100);color:var(--gray-600);
  width:28px;height:28px;border-radius:7px;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px}
@media(max-width:959px){.sb-close-btn{display:flex}}

/* sidebar progress removed */

/* Sidebar nav scroll area */
.sb-nav{flex:1;overflow-y:auto;padding:8px 8px 10px;scrollbar-width:thin;scrollbar-color:var(--gray-200) transparent}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:2px}

/* Sidebar section label */
.sb-sec-label{
  font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--gray-400);padding:10px 8px 4px;
}

/* Sidebar unit button */
.sb-unit-btn{
  display:flex;align-items:center;gap:9px;
  padding:8px 9px;border-radius:var(--r-md);border:none;
  background:transparent;font-family:var(--font);
  cursor:pointer;width:100%;text-align:left;
  transition:background .14s;-webkit-tap-highlight-color:transparent;
}
.sb-unit-btn:hover{background:var(--gray-100)}
.sb-unit-btn.active{background:var(--g50)}
.sb-unit-icon{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:#fff;flex-shrink:0;
}
.sb-unit-text{flex:1;min-width:0}
.sb-unit-name{font-size:12px;font-weight:700;color:var(--gray-800);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-unit-btn.active .sb-unit-name{color:var(--g700)}
.sb-unit-prog{font-size:10px;color:var(--gray-400);margin-top:1px}
.sb-unit-btn.active .sb-unit-prog{color:var(--g600)}
.sb-unit-pct{
  font-size:9.5px;font-weight:800;color:var(--gray-400);
  background:var(--gray-100);padding:2px 6px;border-radius:20px;flex-shrink:0;
}
.sb-unit-btn.active .sb-unit-pct{color:var(--g700);background:var(--g100)}

/* Sidebar footer — language */
.sb-footer{padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--gray-100);flex-shrink:0}
.sb-lang-label{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--gray-400);margin-bottom:7px}
.sb-lang-row{display:flex;gap:5px}
.sb-lb{
  flex:1;padding:6px 4px;border-radius:7px;
  border:1px solid var(--gray-200);background:#fff;
  font-family:var(--font);font-size:11px;font-weight:700;
  color:var(--gray-500);cursor:pointer;transition:all .14s;
}
.sb-lb.on{background:var(--g700);border-color:var(--g700);color:#fff}

/* ═══════ MAIN AREA ═══════ */
.main-area{flex:1;min-width:0;display:flex;flex-direction:column}

/* ── Mobile topbar ── */
.topbar{
  background:#fff;border-bottom:1px solid var(--gray-200);
  height:52px;display:flex;align-items:center;
  padding:0 14px;gap:10px;position:sticky;top:0;z-index:200;
  box-shadow:var(--sh-xs);
}
@media(min-width:960px){.topbar{display:none}}
.topbar-menu-btn{
  width:36px;height:36px;border-radius:9px;border:none;
  background:var(--gray-100);color:var(--gray-700);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;font-size:18px;
  -webkit-tap-highlight-color:transparent;
}
.topbar-title{flex:1;font-size:13px;font-weight:800;color:var(--gray-900);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-lang{display:flex;gap:3px}
.topbar-lb{
  padding:5px 9px;border-radius:6px;border:1px solid var(--gray-200);
  background:#fff;font-family:var(--font);font-size:11px;font-weight:700;
  color:var(--gray-500);cursor:pointer;transition:all .14s;min-height:28px;
}
.topbar-lb.on{background:var(--g700);border-color:var(--g700);color:#fff}

/* ── Content wrapper ── */
.content{flex:1;padding:20px 20px 40px;max-width:960px;margin:0 auto;width:100%}
@media(min-width:600px){.content{padding:24px 28px 48px}}
@media(min-width:960px){.content{padding:28px 36px 52px}}

/* ═══════ HOME — course category view ═══════ */
.home-header{margin-bottom:24px}
.home-kicker{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--g600);margin-bottom:6px}
.home-title{font-size:22px;font-weight:900;color:var(--gray-900);line-height:1.3}
.home-sub{margin-top:5px;font-size:13px;color:var(--gray-500);line-height:1.6}
@media(min-width:600px){.home-title{font-size:26px}}

/* home progress strip removed */

/* Unit cards grid */
.units-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:540px){.units-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.units-grid{grid-template-columns:repeat(2,1fr);gap:14px}}

/* Unit card */
.unit-card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-lg);
  overflow:hidden;cursor:pointer;transition:all .18s ease;
  box-shadow:var(--sh-xs);
}
.unit-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--g200)}
.unit-card-top{
  padding:16px 16px 12px;display:flex;align-items:flex-start;gap:12px;
}
.unit-card-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#fff;
}
.unit-card-num{
  position:absolute;top:-4px;right:-4px;
  width:18px;height:18px;border-radius:50%;background:#fff;
  font-size:9px;font-weight:900;color:var(--gray-700);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.unit-card-icon-wrap{position:relative;flex-shrink:0}
.unit-card-info{flex:1;min-width:0}
.unit-card-title{font-size:14px;font-weight:800;color:var(--gray-900);line-height:1.35;margin-bottom:4px}
.unit-card-desc{font-size:12px;color:var(--gray-500);line-height:1.55}
.unit-card-footer{
  border-top:1px solid var(--gray-100);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.unit-card-tags{display:flex;gap:5px;flex-wrap:wrap}
.unit-tag{font-size:10px;font-weight:700;color:var(--g700);background:var(--g50);
  border:1px solid var(--g100);border-radius:20px;padding:3px 8px}
/* unit card progress removed */

/* ═══════ UNIT DETAIL VIEW ═══════ */
.unit-detail-header{
  display:flex;align-items:center;gap:10px;margin-bottom:20px;
}
.back-btn{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--gray-200);background:#fff;
  border-radius:var(--r-md);padding:7px 12px;font-family:var(--font);
  font-size:12px;font-weight:700;color:var(--gray-600);cursor:pointer;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
  flex-shrink:0;
}
.back-btn:hover{background:var(--gray-100)}
.unit-detail-title-wrap{flex:1;min-width:0}
.unit-detail-kicker{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--g600);margin-bottom:3px}
.unit-detail-name{font-size:18px;font-weight:900;color:var(--gray-900);line-height:1.3}
@media(min-width:600px){.unit-detail-name{font-size:21px}}

/* Lesson list */
.lesson-list{display:grid;gap:8px}
.lesson-row{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-md);
  cursor:pointer;transition:all .15s;overflow:hidden;
}
.lesson-row:hover{border-color:var(--g300);box-shadow:var(--sh-sm)}

.lesson-row-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
}
.lesson-num-badge{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:#fff;
}
.lesson-row-info{flex:1;min-width:0}
.lesson-row-title{font-size:13px;font-weight:700;color:var(--gray-900);line-height:1.35}
.lesson-row-status{font-size:11px;color:var(--gray-400);margin-top:2px}
.lesson-row-chevron{color:var(--gray-400);font-size:16px;flex-shrink:0;transition:transform .18s}
/* chevron rotation handled by onLessonToggle JS */

/* Lesson detail panel */
.lesson-panel{padding:0 14px 14px}
.lesson-fields{display:grid;gap:8px}
.lesson-field{
  border:1px solid var(--gray-200);border-radius:var(--r-md);
  background:var(--gray-50);overflow:hidden;
}
.lesson-field-label{
  display:flex;align-items:center;gap:6px;padding:9px 12px;
  font-size:11px;font-weight:800;color:var(--gray-700);
  background:#fff;border-bottom:1px solid var(--gray-100);
}
.lesson-field-label i{font-size:13px;color:var(--g600)}
.lesson-field.quiz-field .lesson-field-label{color:var(--purple-700)}
.lesson-field.quiz-field .lesson-field-label i{color:var(--purple-700)}
.lesson-field-body{padding:10px 12px;font-size:13px;line-height:1.7;color:var(--gray-700)}

/* quiz-in-lesson CSS moved to quiz mode */

/* Lesson nav row */
.lesson-nav-row{
  display:flex;gap:8px;margin-top:12px;
}
.lesson-nav-btn{
  flex:1;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--gray-200);
  background:#fff;font-family:var(--font);font-size:12px;font-weight:800;
  color:var(--gray-700);cursor:pointer;transition:all .15s;text-align:center;
  -webkit-tap-highlight-color:transparent;
}
.lesson-nav-btn:hover:not(:disabled){background:var(--gray-100)}
.lesson-nav-btn:disabled{opacity:.4;cursor:default}
.lesson-nav-btn.primary{
  background:linear-gradient(135deg,var(--g800),var(--g500));
  border-color:transparent;color:#fff;
}
.lesson-nav-btn.primary:hover:not(:disabled){opacity:.9}

/* ── Toast notice ── */
.lp-action-notice{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,12px);z-index:500;
  background:rgba(6,61,49,.95);color:#fff;border-radius:10px;
  padding:10px 18px;font-size:13.5px;line-height:1.45;
  box-shadow:0 6px 24px rgba(6,61,49,.35);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:min(480px,calc(100vw - 32px));text-align:center;
}
.lp-action-notice.show{opacity:1;transform:translate(-50%,0)}


/* ═══════ QUIZ MODE ═══════ */
.quiz-mode-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.quiz-mode-meta{flex:1;min-width:0}
.quiz-mode-kicker{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--purple-700);margin-bottom:3px}
.quiz-mode-title{font-size:18px;font-weight:900;color:var(--gray-900);line-height:1.3}
@media(min-width:600px){.quiz-mode-title{font-size:21px}}

.quiz-progress-bar-wrap{background:var(--gray-200);border-radius:4px;height:6px;margin-bottom:20px;overflow:hidden}
.quiz-progress-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g800),var(--g500));transition:width .3s}

.quiz-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);margin-bottom:14px}
.quiz-card-num{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--purple-700);margin-bottom:8px}
.quiz-card-q{font-size:14px;font-weight:800;color:var(--gray-900);line-height:1.6;margin-bottom:14px}
.quiz-choices{display:grid;gap:8px}
.quiz-choice{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 13px;border-radius:10px;
  border:1.5px solid var(--gray-200);background:#fff;
  font-family:var(--font);font-size:13px;color:var(--gray-700);
  cursor:pointer;text-align:left;line-height:1.5;
  transition:all .15s;-webkit-tap-highlight-color:transparent;width:100%;
}
.quiz-choice:hover:not(:disabled){border-color:var(--g300);background:var(--g50)}
.quiz-choice:disabled{cursor:default}
.quiz-choice-letter{
  width:24px;height:24px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;background:var(--purple-100);color:var(--purple-700);
}
.quiz-choice.correct{border-color:var(--g300);background:var(--g50)}
.quiz-choice.correct .quiz-choice-letter{background:var(--g500);color:#fff}
.quiz-choice.wrong.selected{border-color:var(--red-100);background:var(--red-50)}
.quiz-choice.wrong .quiz-choice-letter{background:var(--red-500);color:#fff}
.quiz-answer-bar{
  margin-top:10px;padding:10px 13px;border-radius:9px;
  font-size:12.5px;font-weight:700;line-height:1.6;
}
.quiz-answer-bar.ok{background:var(--g50);color:var(--g800);border:1px solid var(--g100)}
.quiz-answer-bar.no{background:var(--red-50);color:var(--red-700);border:1px solid var(--red-100)}
.quiz-tip-bar{
  margin-top:6px;padding:9px 13px;border-radius:9px;font-size:11.5px;
  background:var(--amber-50);color:var(--amber-700);border:1px solid var(--amber-100);line-height:1.6;
}
.quiz-next-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:10px;width:100%;padding:11px;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--g800),var(--g500));
  border:none;color:#fff;font-family:var(--font);font-size:13px;font-weight:800;
  cursor:pointer;transition:opacity .15s;-webkit-tap-highlight-color:transparent;
}
.quiz-next-btn:hover{opacity:.9}

/* Quiz result screen */
.quiz-result{background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-xl);padding:32px 24px;text-align:center;box-shadow:var(--sh-md)}
.quiz-result-score{font-size:52px;font-weight:900;color:var(--g800);line-height:1}
.quiz-result-total{font-size:14px;color:var(--gray-500);margin-top:4px}
.quiz-result-label{font-size:13px;font-weight:700;color:var(--gray-700);margin-top:16px;margin-bottom:20px}
.quiz-result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.quiz-result-btn{
  padding:10px 22px;border-radius:var(--r-md);font-family:var(--font);
  font-size:13px;font-weight:800;cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.quiz-result-btn.primary{background:linear-gradient(135deg,var(--g800),var(--g500));border:none;color:#fff}
.quiz-result-btn.secondary{background:#fff;border:1.5px solid var(--gray-200);color:var(--gray-700)}
.quiz-result-btn:hover{opacity:.9}

/* Quiz button on unit detail header */
.quiz-mode-btn{
  display:flex;align-items:center;gap:6px;
  border:none;background:linear-gradient(135deg,var(--purple-700),#8B5CF6);
  color:#fff;border-radius:var(--r-md);padding:7px 14px;font-family:var(--font);
  font-size:12px;font-weight:800;cursor:pointer;
  transition:opacity .15s;-webkit-tap-highlight-color:transparent;
  flex-shrink:0;
}
.quiz-mode-btn:hover{opacity:.88}

/* Unit card — quiz shortcut button */
.unit-card-quiz-btn{
  display:flex;align-items:center;gap:4px;
  padding:5px 11px;border-radius:20px;font-size:10px;font-weight:800;
  border:1.5px solid var(--purple-100);background:var(--purple-50);color:var(--purple-700);
  cursor:pointer;font-family:var(--font);transition:all .15s;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.unit-card-quiz-btn:hover{background:var(--purple-100)}

/* ── Accessibility ── */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── Touch: no hover transforms ── */
@media(hover:none){
  .unit-card:hover{transform:none;box-shadow:var(--sh-xs)}
  .lesson-row:hover{border-color:var(--gray-200);box-shadow:none}
}

/* ── Reduced motion ── */
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Small phone ── */
@media(max-width:379px){
  .content{padding:14px 12px 32px}
  .progress-stats{gap:12px}
  .topbar{padding:0 10px}
}
</style>
</head>
<body>
<h1 class="sr-only">外籍看護訓練學習平台</h1>

<div class="sb-overlay" id="sb-overlay" onclick="closeSidebar()"></div>

<div class="shell">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" id="sidebar">
    <!-- Brand -->
    <div class="sb-brand">
      <div class="sb-brand-info">
        <div class="sb-brand-icon"><i class="ti ti-first-aid-kit"></i></div>
        <div>
          <div class="sb-brand-name" id="sb-brand-name">看護訓練平台</div>
          <div class="sb-brand-sub" id="sb-brand-sub">外籍照護培訓系統</div>
        </div>
      </div>
      <button class="sb-close-btn" onclick="closeSidebar()"><i class="ti ti-x"></i></button>

// ── PROGRESS STATS ──
function getStats(){
  const units = getCourseUnits();
  let total=0, answered=0, correct=0;
  units.forEach(u=>{
    u.lessons.forEach((title,idx)=>{
      total++;
      const lno = lessonKey(u.no, idx);
      const chosen = lessonQuizState[lno];
      if(Number.isInteger(chosen)){
        answered++;
        const quiz = getQuiz(u, title, idx, lno);
        if(chosen === quiz.correct) correct++;
      }
    });
  });
  return {
    total, answered, correct,
    completeRate: total ? Math.round(answered/total*100) : 0,
    correctRate: answered ? Math.round(correct/answered*100) : 0
  };
}
function getUnitStats(unit){
  let answered=0, correct=0;
  unit.lessons.forEach((title,idx)=>{
    const lno = lessonKey(unit.no, idx);
    const chosen = lessonQuizState[lno];
    if(Number.isInteger(chosen)){
      answered++;
      const quiz = getQuiz(unit, title, idx, lno);
      if(chosen === quiz.correct) correct++;
    }
  });
  return {answered, correct, total: unit.lessons.length};
}
function lessonKey(unitNo, idx){
  return String((unitNo-1)*10 + idx + 1).padStart(2,'0');
}

// ── QUIZ LOGIC ──
function getMaterial(unit, title, idx, lno){
  if(lang === 'zh' && MANUAL[lno]) return MANUAL[lno];
  const p = getLangPack();
  const outcome = unit.outcomes[idx % unit.outcomes.length] || '';
  return {
    text: `${p.textPrefix || '本課主題是'}「${title}」。${unit.desc} ${outcome}`,
    demo: `${p.practice || '示範做法'}：先說明要做的事，確認環境安全與長者狀態，再依照照護計畫完成，最後記錄並回報。`,
    wrong: `${p.mistake || '錯誤案例'}：沒有先確認安全或沒有告知長者就直接操作，容易造成受傷或誤解。`,
    quiz: {q: p.quizQuestion || `進行「${title}」時，最適合的做法是什麼？`, answer: p.defaultAnswer || '先確認照護計畫、環境安全與長者狀態，再開始協助'}
  };
}
function getQuiz(unit, title, idx, lno){
  const mat = getMaterial(unit, title, idx, lno);
  const raw = mat.quiz;
  if(raw && Array.isArray(raw.opts)){
    return {q: raw.q, options: raw.opts, correct: raw.correct, answer: raw.opts[raw.correct], tip: ''};
  }
  const p = getLangPack();
  const question = (raw && raw.q) || p.quizQuestion || `進行「${title}」時，最適合的做法是什麼？`;
  const answer = (raw && raw.answer) || p.defaultAnswer || '先確認照護計畫、環境安全與長者狀態，再開始協助';
  const unitNo = unit.no;
  let dists;
  if(lang === 'zh'){
    dists = (DISTRACTOR_BANKS.zh[unitNo] || DISTRACTOR_BANKS.zh[1]).slice();
  } else {
    dists = (Array.isArray(DISTRACTOR_BANKS[lang]) ? DISTRACTOR_BANKS[lang] : DISTRACTOR_BANKS.en).slice();
  }
  const correctIdx = (unitNo * 7 + idx * 3) % 4;
  const opts = [];
  let d = 0;
  for(let i=0;i<4;i++) opts.push(i===correctIdx ? answer : dists[d++ % dists.length]);
  const tip = lang==='zh'
    ? `答錯時請回到「${title}」的課文與示範，找出安全檢查、尊重告知、紀錄回報三個關鍵。`
    : (p.tipPrefix || '');
  return {q: question, options: opts, correct: correctIdx, answer, tip};
}

  const packs = {
    zh:{textPrefix:'本課主題是',mustKnow:'學員要理解',practice:'示範做法',mistake:'錯誤案例',
      quizQuestion:'進行這一課時，最適合的做法是什麼？',
      defaultAnswer:'先確認照護計畫、環境安全與長者狀態，再開始協助',
      tipPrefix:'請回到課文與示範，重新找出安全檢查、尊重告知、紀錄回報三個關鍵。'},
    id:{textPrefix:'Topik pelajaran ini adalah',mustKnow:'Peserta perlu memahami',practice:'Contoh praktik',mistake:'Contoh salah',
      quizQuestion:'Saat menjalankan pelajaran ini, tindakan yang paling tepat adalah apa?',

      quizQuestion:'Khi thực hiện bài này, việc phù hợp nhất cần làm trước là gì?',
      defaultAnswer:'Kiểm tra kế hoạch chăm sóc, an toàn môi trường và tình trạng người cao tuổi trước khi bắt đầu',
      tipPrefix:'Đọc lại bài học và phần làm mẫu. Tìm ba điểm chính: kiểm tra an toàn, giải thích tôn trọng, ghi chép và báo cáo.'}

          <div class="unit-card-title">${u.title}</div>
          <div class="unit-card-desc">${u.desc}</div>
        </div>
      </div>
      <div class="unit-card-footer">
        <div class="unit-card-tags">${u.tags.map(t=>`<span class="unit-tag">${t}</span>`).join('')}</div>
        <button class="unit-card-quiz-btn" onclick="event.stopPropagation();openQuiz(${u.no})">
          <i class="ti ti-help-circle" style="font-size:12px"></i> ${cp.quizModeBtn||'測驗'}
        </button>
      </div>
    </div>`;
  });

  html += `</div>`;
  document.getElementById('main-content').innerHTML = html;
}

// ── OPEN UNIT ──
function openUnit(no){
  currentView = 'unit';
  currentUnitNo = no;
  const units = getCourseUnits();
  const unit = units.find(u=>u.no===no) || units[0];
  currentLessonNo = lessonKey(no, 0);
  renderSidebar();
  renderUnitView();
  if(window.innerWidth < 960) closeSidebar();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function goHome(){
  currentView = 'home';
  currentLessonNo = lessonKey(currentUnitNo, 0);
  renderSidebar();
  renderHome();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ── UNIT VIEW ──
function renderUnitView(){
  const cp = UI_COPY[lang] || UI_COPY.zh;
  const units = getCourseUnits();
  const unit = units.find(u=>u.no===currentUnitNo) || units[0];
  const us = getUnitStats(unit);
  const totalLessons = units.reduce((s,u)=>s+u.lessons.length, 0);

  let html = `
  <div class="unit-detail-header">
    <button class="back-btn" onclick="goHome()">${cp.back}</button>
    <div class="unit-detail-title-wrap">
      <div class="unit-detail-kicker">${(cp.unitLabel||'第 %n 單元').replace('%n',unit.no)}</div>
      <div class="unit-detail-name">${unit.title}</div>
    </div>
    <button class="quiz-mode-btn" onclick="openQuiz(${unit.no})">
      <i class="ti ti-help-circle"></i> ${cp.quizModeBtn||'開始測驗'}
    </button>
  </div>

  <div class="lesson-list">`;

  unit.lessons.forEach((title, idx) => {
    const lno = lessonKey(unit.no, idx);
    const isOpen = lno === currentLessonNo;
    html += renderLessonRow(unit, title, idx, lno, isOpen, totalLessons, cp);
  });

  html += `</div>`;
  document.getElementById('main-content').innerHTML = html;
}

function renderLessonRow(unit, title, idx, lno, isOpen, totalLessons, cp){
  const mat = getMaterial(unit, title, idx, lno);
  const lnoNum = Number(lno);
  const prevDisabled = lnoNum <= 1;
  const nextDisabled = lnoNum >= totalLessons;

  return `<div class="lesson-row" id="lr-${lno}">
    <details ${isOpen?'open':''} ontoggle="onLessonToggle(this,'${lno}')">
      <summary style="list-style:none;cursor:pointer">
        <div class="lesson-row-head">
          <div class="lesson-num-badge" style="background:${unit.color}">${lno}</div>
          <div class="lesson-row-info">
            <div class="lesson-row-title">${title}</div>
  
          </div>
          <i class="ti ti-chevron-down lesson-row-chevron"></i>
        </div>
      </summary>
      <div class="lesson-panel">
        <div class="lesson-fields">
          <div class="lesson-field">
            <div class="lesson-field-label"><i class="ti ti-book"></i>${cp.fieldText}</div>
            <div class="lesson-field-body">${mat.text}</div>
          </div>
          <div class="lesson-field">
            <div class="lesson-field-label"><i class="ti ti-user-check"></i>${cp.fieldDemo}</div>
            <div class="lesson-field-body">${mat.demo}</div>
          </div>
          <div class="lesson-field">
            <div class="lesson-field-label"><i class="ti ti-alert-triangle"></i>${cp.fieldWrong}</div>
            <div class="lesson-field-body">${mat.wrong}</div>
          </div>

        </div>
        <div class="lesson-nav-row">
          <button class="lesson-nav-btn" onclick="moveLesson(-1,'${lno}')" ${prevDisabled?'disabled':''}>${cp.prevLesson}</button>
          <button class="lesson-nav-btn primary" onclick="moveLesson(1,'${lno}')" ${nextDisabled?'disabled':''}>${cp.nextLesson}</button>
        </div>
      </div>
    </details>
  </div>`;
}

function onLessonToggle(details, lno){
  if(details.open) setCurrentLesson(lno);
  const chevron = details.closest('.lesson-row').querySelector('.lesson-row-chevron');
  if(chevron) chevron.style.transform = details.open ? 'rotate(180deg)' : '';
}

function setCurrentLesson(lno){
  currentLessonNo = lno;
}

// answerQuiz moved to quiz mode

function moveLesson(delta, lno){
  const units = getCourseUnits();
  const totalLessons = units.reduce((s,u)=>s+u.lessons.length, 0);
  const next = Math.max(1, Math.min(totalLessons, Number(lno) + delta));
  const nextStr = String(next).padStart(2,'0');
  const nextUnitNo = Math.ceil(next/10);

  if(nextUnitNo !== currentUnitNo){
    currentUnitNo = nextUnitNo;
    currentLessonNo = nextStr;
    renderSidebar();
    renderUnitView();
    setTimeout(()=>{
      const el = document.getElementById('lr-'+nextStr);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 60);
  } else {
    // Close current, open next in same unit
    currentLessonNo = nextStr;
    // Close all details first
    document.querySelectorAll('.lesson-row details[open]').forEach(d=>d.removeAttribute('open'));
    const target = document.getElementById('lr-'+nextStr);
    if(target){
      const details = target.querySelector('details');
      if(details){
        details.setAttribute('open','');
        setTimeout(()=>target.scrollIntoView({behavior:'smooth', block:'start'}), 60);
      }
    }
  }
}


// ══════════════════════════════════════
// QUIZ MODE (independent)
// ══════════════════════════════════════
let quizState = {
  unitNo: 1,
  questions: [],   // [{lno, title, idx, quiz}]
  current: 0,
  answers: [],     // chosen index per question, or null
};

function openQuiz(unitNo){
  currentView = 'quiz';
  currentUnitNo = unitNo;
  const units = getCourseUnits();
  const unit = units.find(u=>u.no===unitNo) || units[0];
  const totalLessons = units.reduce((s,u)=>s+u.lessons.length, 0);
  const questions = unit.lessons.map((title, idx) => {
    const lno = lessonKey(unitNo, idx);
    const quiz = getQuiz(unit, title, idx, lno);
    return {lno, title, idx, quiz};
  });
  quizState = {unitNo, questions, current: 0, answers: Array(questions.length).fill(null)};
  renderSidebar();
  renderQuizView();
  window.scrollTo({top: 0, behavior: 'smooth'});
  if(window.innerWidth < 960) closeSidebar();
}

function renderQuizView(){
  const cp = UI_COPY[lang] || UI_COPY.zh;
  const units = getCourseUnits();
  const unit = units.find(u=>u.no===quizState.unitNo);
  const {questions, current, answers} = quizState;
  const total = questions.length;

  // Check if showing result screen
  const allAnswered = answers.every(a => a !== null);
  const isDone = allAnswered && current >= total;

  if(isDone){
    const correct = answers.filter((a,i)=> a === questions[i].quiz.correct).length;
    const pct = Math.round(correct/total*100);
    const emoji = pct===100?'🎉':pct>=70?'👍':pct>=50?'😊':'💪';
    document.getElementById('main-content').innerHTML = `
    <div class="quiz-mode-header">
      <button class="back-btn" onclick="openUnit(${unit.no})">${cp.back}</button>
      <div class="quiz-mode-meta">
        <div class="quiz-mode-kicker">${cp.quizKicker||'單元測驗'}</div>
        <div class="quiz-mode-title">${unit.title}</div>
      </div>
    </div>
    <div class="quiz-result">
      <div style="font-size:40px;margin-bottom:8px">${emoji}</div>
      <div class="quiz-result-score">${correct}<span style="font-size:24px;color:var(--gray-400)">/${total}</span></div>
      <div class="quiz-result-total">${pct}%</div>
      <div class="quiz-result-label">${cp.quizResultLabel||'測驗完成'}</div>
      <div class="quiz-result-actions">
        <button class="quiz-result-btn primary" onclick="retryQuiz()">${cp.quizRetry||'重新測驗'}</button>
        <button class="quiz-result-btn secondary" onclick="openUnit(${unit.no})">${cp.quizBackLesson||'回課文'}</button>
        <button class="quiz-result-btn secondary" onclick="goHome()">${cp.quizBackHome||'回首頁'}</button>
      </div>
    </div>`;
    return;
  }

  const q = questions[current];
  const chosen = answers[current];
  const answered = chosen !== null;
  const isCorrect = answered && chosen === q.quiz.correct;
  const letters = ['A','B','C','D'];
  const pctBar = Math.round((current / total) * 100);
  const isLast = current === total - 1;

  const opts = q.quiz.options.map((opt, oi) => {
    let cls = '';
    if(answered && oi === q.quiz.correct) cls = ' correct';
    if(answered && oi === chosen && oi !== q.quiz.correct) cls = ' wrong selected';
    else if(answered && oi === chosen) cls += ' selected';
    return `<button type="button" class="quiz-choice${cls}" ${answered?'disabled':''} onclick="quizAnswer(${oi})">
      <div class="quiz-choice-letter">${letters[oi]}</div>
      <div>${opt}</div>
    </button>`;
  }).join('');

  const resultHtml = answered ? `
    <div class="quiz-answer-bar ${isCorrect?'ok':'no'}">${isCorrect?(cp.answerOk||'✓ 答對了！'):(cp.answerNo||'✗ 答錯了。')} ${cp.correctAnswer||'正確答案'}：${letters[q.quiz.correct]}. ${q.quiz.answer}</div>
    ${!isCorrect ? `<div class="quiz-tip-bar">${cp.wrongTip||'提示'}: ${q.quiz.tip || ''}</div>` : ''}
    <button class="quiz-next-btn" onclick="quizNext()">
      ${isLast ? (cp.quizFinish||'查看結果') : (cp.quizNext||'下一題 →')}
    </button>` : '';

  document.getElementById('main-content').innerHTML = `
  <div class="quiz-mode-header">
    <button class="back-btn" onclick="openUnit(${unit.no})">${cp.back}</button>
    <div class="quiz-mode-meta">
      <div class="quiz-mode-kicker">${cp.quizKicker||'單元測驗'}</div>
      <div class="quiz-mode-title">${unit.title}</div>
    </div>
  </div>
  <div class="quiz-progress-bar-wrap">
    <div class="quiz-progress-bar-fill" style="width:${pctBar}%"></div>
  </div>
  <div class="quiz-card">
    <div class="quiz-card-num">${(cp.quizOf||'第 %a 題，共 %b 題').replace('%a',current+1).replace('%b',total)}</div>
    <div class="quiz-card-q">${q.quiz.q}</div>
    <div class="quiz-choices">${opts}</div>
    ${resultHtml}
  </div>`;
}

function quizAnswer(chosenIdx){
  if(quizState.answers[quizState.current] !== null) return; // already answered
  quizState.answers[quizState.current] = chosenIdx;
  saveState();
  renderQuizView();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function quizNext(){
  if(quizState.current < quizState.questions.length - 1){
    quizState.current++;
  } else {
    // Mark done
    quizState.current = quizState.questions.length;
  }
  renderQuizView();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function retryQuiz(){
  openQuiz(quizState.unitNo);
}

// ── RESET ──
function resetProgress(){
  const cp = UI_COPY[lang] || UI_COPY.zh;
  if(!confirm(cp.resetConfirm || '確定要重置所有答題進度嗎？')) return;
  lessonQuizState = {};
  saveState();
  renderSidebar();
  renderHome();
}

// ── INIT ──
renderSidebar();
renderHome();
</script>
