<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外籍看護訓練學習平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ═══════════════════════════════════════════
   ENHANCED VISUAL OVERHAUL — 美化升級版
   ═══════════════════════════════════════════ */

/* ── Design tokens (extended) ── */
:root{
  --green-900:#063D31;
  --green-800:#085041;
  --green-700:#0A6652;
  --green-600:#158866;
  --green-500:#1D9E75;
  --green-400:#2FBD8C;
  --green-300:#5DCAA5;
  --green-200:#9FE1CB;
  --green-100:#D4F3E8;
  --green-50:#EAF8F2;
  --blue-900:#042C53;
  --blue-700:#0C447C;
  --blue-500:#1565C0;
  --blue-100:#BDD7F5;
  --blue-50:#E6F1FB;
  --amber-900:#412402;
  --amber-700:#633806;
  --amber-500:#E07B00;
  --amber-100:#FAC775;
  --amber-50:#FFF3DA;
  --red-900:#501313;
  --red-700:#791F1F;
  --red-500:#C0392B;
  --red-100:#F09595;
  --red-50:#FCEBEB;
  --purple-900:#26215C;
  --purple-700:#3730A3;
  --purple-50:#EEEDFE;
  --teal-500:#00897B;
  --gray-900:#111;
  --gray-700:#333;
  --gray-600:#444;
  --gray-500:#666;
  --gray-400:#888;
  --gray-300:#CCC;
  --gray-200:#DDD;
  --gray-100:#E5E5E5;
  --gray-50:#F5F5F5;
  --white:#fff;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.10);
  --shadow-lg:0 8px 32px rgba(0,0,0,.13);
  --shadow-xl:0 16px 48px rgba(0,0,0,.15);
  --shadow-green:0 4px 20px rgba(29,158,117,.25);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --radius-xl:28px;
  --font-sans:'Noto Sans TC','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}

/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0}

/* ── Base ── */
body{
  font-family:var(--font-sans);
  background:linear-gradient(160deg,#f0faf5 0%,#e8f4fd 50%,#f5f0ff 100%);
  background-attachment:fixed;
  min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom,16px);
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.lp-action-notice{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,12px);z-index:500;max-width:min(520px,calc(100vw - 32px));
  background:rgba(6,61,49,.96);color:#fff;border-radius:12px;padding:12px 18px;
  font-size:14px;line-height:1.45;box-shadow:0 8px 32px rgba(6,61,49,.4);
  border:1px solid rgba(255,255,255,.12);
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;
}
.lp-action-notice.show{opacity:1;transform:translate(-50%,0)}

/* ── Top bar ── */
.lp-topbar{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(29,158,117,.12);
  display:flex;align-items:center;justify-content:center;
  height:62px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 20px rgba(6,61,49,.08);
}
.lp-topbar-inner{
  width:100%;max-width:1200px;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.lp-back{
  display:flex;align-items:center;gap:7px;
  font-size:13px;color:var(--green-700);font-weight:500;
  cursor:pointer;border:1.5px solid var(--green-100);background:var(--green-50);
  border-radius:20px;padding:7px 14px;
  font-family:inherit;min-height:36px;
  -webkit-tap-highlight-color:transparent;
  transition:all .18s;
}
.lp-back:hover{background:var(--green-100);border-color:var(--green-200);transform:translateX(-2px)}
.lp-lang{display:flex;gap:3px;background:var(--green-50);border:1.5px solid var(--green-100);border-radius:24px;padding:4px}
.lp-lb{
  padding:6px 13px;border-radius:18px;border:none;
  background:transparent;font-size:12px;
  color:var(--gray-500);cursor:pointer;
  font-family:inherit;min-height:30px;
  -webkit-tap-highlight-color:transparent;
  transition:all .18s;
  font-weight:500;
}
.lp-lb.on{
  background:linear-gradient(135deg,var(--green-700),var(--green-500));
  color:#fff;font-weight:700;
  box-shadow:0 2px 8px rgba(29,158,117,.35);
}

/* ── Hero ── */
.lp-hero{
  background:linear-gradient(135deg, #042C1E 0%, var(--green-800) 40%, var(--green-600) 75%, #1AAA7E 100%);
  padding:0;overflow:hidden;position:relative;
}
.lp-hero-bg{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
/* Animated decorative blobs */
.lp-hero-circle1{
  position:absolute;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);
  top:-120px;right:-80px;
  animation:heroFloat1 8s ease-in-out infinite;
}
.lp-hero-circle2{
  position:absolute;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(93,202,165,.15),transparent 70%);
  bottom:-60px;left:20px;
  animation:heroFloat2 10s ease-in-out infinite;
}
.lp-hero-circle3{
  position:absolute;width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,.06);top:40px;right:180px;
  animation:heroFloat1 6s ease-in-out infinite reverse;
}
/* Extra decorative elements */
.lp-hero-dot-grid{
  position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:28px 28px;
  opacity:.5;
}
@keyframes heroFloat1{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.04)}}
@keyframes heroFloat2{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.06)}}

.lp-hero-inner{width:100%;max-width:1200px;margin:0 auto;padding:28px 20px 28px;position:relative;z-index:1}
.lp-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.lp-hero-left{flex:1;min-width:0}
.lp-hero-illo{
  width:96px;height:96px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
  border-radius:24px;
  border:1.5px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 8px 32px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2);
}
.lp-hero-illo svg{width:58px;height:58px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.2))}
.lp-unit-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.10));
  border:1px solid rgba(255,255,255,.28);
  border-radius:24px;padding:6px 14px;font-size:11px;color:rgba(255,255,255,.92);
  margin-bottom:11px;font-weight:600;letter-spacing:.4px;
  backdrop-filter:blur(4px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.lp-lesson-num{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:7px;letter-spacing:.6px;text-transform:uppercase;font-weight:500}
.lp-title{font-size:24px;font-weight:800;color:#fff;line-height:1.25;margin-bottom:7px;
  text-shadow:0 2px 12px rgba(0,0,0,.2);}
.lp-subtitle{font-size:11px;color:rgba(255,255,255,.5);line-height:1.6;letter-spacing:.2px}
.lp-prog-wrap{
  background:rgba(255,255,255,.11);border-radius:16px;
  padding:14px 16px;margin-top:18px;
  display:flex;align-items:center;gap:16px;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(6px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.lp-prog-info{flex:1}
.lp-prog-label{font-size:10px;color:rgba(255,255,255,.55);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.lp-prog-bg{width:100%;height:7px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.lp-prog-fill{
  height:7px;border-radius:4px;
  background:linear-gradient(90deg,#5DCAA5,#8EEDD0,#5DCAA5);
  background-size:200% 100%;
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.lp-prog-pct{font-size:26px;font-weight:800;color:#fff;line-height:1;
  text-shadow:0 2px 8px rgba(0,0,0,.15);}
.lp-prog-pct span{font-size:12px;font-weight:400;color:rgba(255,255,255,.65)}

/* ── Stats bar ── */
.lp-stats-outer{
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(29,158,117,.10);
  display:flex;justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
}
.lp-stats{
  display:flex;gap:0;
  width:100%;max-width:1200px;
}
.lp-stat{
  flex:1;padding:14px 8px;text-align:center;
  border-right:1px solid rgba(29,158,117,.10);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:background .18s;
}
.lp-stat:last-child{border-right:none}
.lp-stat:hover{background:var(--green-50)}
.lp-stat-icon-wrap{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--green-50),var(--green-100));
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--green-100);
}
.lp-stat-icon{font-size:16px;color:var(--green-600)}
.lp-stat-val{font-size:15px;font-weight:800;color:var(--gray-900)}
.lp-stat-lbl{font-size:10px;color:var(--gray-500);font-weight:500}

/* ── Section nav ── */
.sec-nav{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(29,158,117,.10);
  display:flex;overflow-x:auto;
  padding:0 6px;scrollbar-width:none;
  position:sticky;top:62px;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.04);
  justify-content:center;
}
.sec-nav-inner-wrap{
  display:flex;max-width:1200px;width:100%;overflow-x:auto;scrollbar-width:none;
}
.sec-nav-inner-wrap::-webkit-scrollbar{display:none}
.sec-tab{
  flex-shrink:0;padding:13px 10px;font-size:12px;
  color:var(--gray-500);cursor:pointer;
  border:none;background:transparent;font-family:inherit;
  border-bottom:3px solid transparent;white-space:nowrap;
  min-height:46px;-webkit-tap-highlight-color:transparent;
  transition:all .18s;display:flex;align-items:center;gap:5px;
  font-weight:500;
}
.sec-tab.on{
  color:var(--green-700);border-bottom-color:var(--green-500);font-weight:700;
}
.sec-tab:hover{color:var(--green-600);background:var(--green-50)}

/* ── Body ── */
.lp-body{
  padding:20px 16px 10px;
  display:flex;flex-direction:column;gap:14px;
  max-width:1200px;margin:0 auto;width:100%;
}

/* ── Section cards ── */
.sec-card{
  background:rgba(255,255,255,.92);
  border:1.5px solid rgba(29,158,117,.10);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .2s,transform .2s,border-color .2s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.sec-card:hover{
  box-shadow:var(--shadow-md);
  border-color:rgba(29,158,117,.2);
  transform:translateY(-1px);
}
.sec-card[data-open="true"]{
  box-shadow:var(--shadow-md);
  border-color:rgba(29,158,117,.22);
}
.sec-header{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .14s;
  position:relative;
}
.sec-header:hover{background:rgba(29,158,117,.03)}
.sec-icon-wrap{
  width:46px;height:46px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  border:1px solid rgba(255,255,255,.6);
}
.sec-icon-wrap i{font-size:20px}
.sec-hinfo{flex:1;min-width:0}
.sec-htag{font-size:10px;color:var(--gray-400);margin-bottom:3px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.sec-htitle{font-size:15px;font-weight:700;color:var(--gray-900);line-height:1.3}
.sec-meta{font-size:11px;color:var(--gray-400);margin-top:3px;line-height:1.4}
.sec-chevron{
  font-size:18px;color:var(--gray-300);flex-shrink:0;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  background:var(--gray-50);border-radius:50%;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
}
.sec-card[data-open="true"] .sec-chevron{
  transform:rotate(180deg);
  background:var(--green-50);color:var(--green-500);
}
.sec-body{
  padding:0 18px 18px;
  border-top:1.5px solid rgba(29,158,117,.08);
  animation:fadeSlide .24s cubic-bezier(.25,.46,.45,.94);
}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* ── Banner illustrations ── */
.sec-banner{
  margin:14px 0 12px;border-radius:14px;overflow:hidden;
  position:relative;height:100px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);
}

/* ── Why / intro blocks ── */
.why-block{
  padding-top:16px;
  font-size:14px;color:var(--gray-700);line-height:1.85;
}
.why-highlight{
  background:linear-gradient(135deg,var(--green-50),#f0fdf8);
  border-left:4px solid var(--green-400);
  padding:14px 16px;font-size:13px;color:var(--green-900);
  line-height:1.75;margin-top:14px;border-radius:0 12px 12px 0;
  display:flex;gap:12px;align-items:flex-start;
  box-shadow:0 2px 12px rgba(29,158,117,.10);
}
.why-highlight-icon{font-size:20px;color:var(--green-400);flex-shrink:0;margin-top:1px}

/* ── Steps ── */
.steps-list{padding-top:16px;display:flex;flex-direction:column;gap:0}
.step-row{
  display:flex;gap:14px;padding:13px 0;
  border-bottom:1px solid rgba(29,158,117,.06);
  position:relative;
  transition:background .15s;
  border-radius:8px;margin:0 -8px;padding:13px 8px;
}
.step-row:last-child{border-bottom:none}
.step-row:hover{background:var(--green-50)}
.step-left{display:flex;flex-direction:column;align-items:center}
.step-circle{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--green-600),var(--green-400));
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;flex-shrink:0;
  box-shadow:0 4px 12px rgba(29,158,117,.35);
}
.step-line{flex:1;width:2px;background:linear-gradient(to bottom,var(--green-200),transparent);margin:6px auto 0}
.step-row:last-child .step-line{display:none}
.step-txt{
  font-size:14px;font-weight:700;color:var(--gray-900);
  line-height:1.5;flex:1;padding-top:6px;
}
.step-note{font-size:12px;color:var(--gray-500);margin-top:4px;line-height:1.6;font-weight:400}
.step-tag{
  display:inline-block;margin-top:7px;
  background:linear-gradient(135deg,var(--green-100),var(--green-50));
  color:var(--green-800);
  font-size:10px;padding:3px 10px;border-radius:20px;
  font-weight:600;border:1px solid var(--green-100);
}

/* ── Demo right/wrong ── */
.demo-split{display:grid;grid-template-columns:1fr;gap:12px;padding-top:16px}
.demo-card{border-radius:14px;padding:16px;overflow:hidden;position:relative}
.demo-card.wrong{
  background:linear-gradient(135deg,#fff5f5,var(--red-50));
  border:1.5px solid var(--red-100);
}
.demo-card.right{
  background:linear-gradient(135deg,#f0fdf8,var(--green-50));
  border:1.5px solid var(--green-100);
}
.demo-card-head{display:flex;align-items:center;gap:10px;margin-bottom:13px;padding-bottom:11px;border-bottom:1px solid rgba(0,0,0,.06)}
.demo-card-head-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.demo-card.wrong .demo-card-head-icon{background:linear-gradient(135deg,#fecaca,var(--red-100));color:var(--red-700)}
.demo-card.right .demo-card-head-icon{background:linear-gradient(135deg,var(--green-100),var(--green-200));color:var(--green-800)}
.demo-card-title{font-size:14px;font-weight:800}
.demo-card.wrong .demo-card-title{color:var(--red-900)}
.demo-card.right .demo-card-title{color:var(--green-900)}
.demo-item{
  display:flex;gap:10px;align-items:flex-start;
  font-size:13px;line-height:1.65;margin-bottom:9px;
  padding:8px 10px;border-radius:9px;
  transition:background .15s;
}
.demo-item:last-child{margin-bottom:0}
.demo-item:hover{background:rgba(0,0,0,.03)}
.demo-item-dot{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;flex-shrink:0;margin-top:1px;font-weight:800;
}
.demo-item.w .demo-item-dot{background:linear-gradient(135deg,#fca5a5,var(--red-100));color:var(--red-700)}
.demo-item.r .demo-item-dot{background:linear-gradient(135deg,var(--green-200),var(--green-100));color:var(--green-800)}
.demo-item span{color:var(--gray-900)}

/* ── Alert rows ── */
.alert-list{padding-top:16px;display:flex;flex-direction:column;gap:10px}
.alert-row{
  display:flex;align-items:flex-start;gap:13px;
  border-radius:14px;padding:14px 16px;
  transition:transform .18s,box-shadow .18s;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.alert-row:hover{transform:translateX(3px);box-shadow:0 3px 12px rgba(0,0,0,.09)}
.alert-row-icon{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.07);
}
.alert-row-body{flex:1}
.alert-row-title{font-size:13px;font-weight:700;line-height:1.5}
.alert-row-sub{font-size:12px;margin-top:3px;line-height:1.5}

/* warn */
.alert-row.warn{background:linear-gradient(135deg,#fffbeb,var(--amber-50));border:1.5px solid var(--amber-100)}
.alert-row.warn .alert-row-icon{background:linear-gradient(135deg,#fed7aa,var(--amber-100));color:var(--amber-700)}
.alert-row.warn .alert-row-title{color:var(--amber-900)}
.alert-row.warn .alert-row-sub{color:var(--amber-700)}
/* notify */
.alert-row.notify{background:linear-gradient(135deg,#eff6ff,var(--blue-50));border:1.5px solid var(--blue-100)}
.alert-row.notify .alert-row-icon{background:linear-gradient(135deg,#bfdbfe,var(--blue-100));color:var(--blue-700)}
.alert-row.notify .alert-row-title{color:var(--blue-900)}
.alert-row.notify .alert-row-sub{color:var(--blue-700)}
/* er */
.alert-row.er{background:linear-gradient(135deg,#fff1f2,var(--red-50));border:1.5px solid var(--red-100)}
.alert-row.er .alert-row-icon{background:linear-gradient(135deg,#fecaca,var(--red-100));color:var(--red-700)}
.alert-row.er .alert-row-title{color:var(--red-900)}
.alert-row.er .alert-row-sub{color:var(--red-700)}
/* remind */
.alert-row.remind{background:linear-gradient(135deg,#f0fdf4,var(--green-50));border:1.5px solid var(--green-100)}
.alert-row.remind .alert-row-icon{background:linear-gradient(135deg,var(--green-100),var(--green-50));color:var(--green-600)}
.alert-row.remind .alert-row-title{color:var(--gray-900)}
.alert-row.remind .alert-row-sub{color:var(--green-700)}

/* ── Quiz ── */
.quiz-block{padding-top:16px}
.quiz-header{
  background:linear-gradient(135deg,#f5f3ff,var(--purple-50),#eef2ff);
  border-radius:14px;padding:16px;margin-bottom:16px;
  display:flex;gap:13px;align-items:flex-start;
  border:1.5px solid #d6d5f5;
  box-shadow:0 2px 12px rgba(38,33,92,.08);
}
.quiz-header-icon{font-size:24px;color:var(--purple-700)}
.quiz-q{font-size:14px;font-weight:700;color:var(--gray-900);line-height:1.65}
.quiz-opts{display:flex;flex-direction:column;gap:9px}
.quiz-opt{
  display:flex;align-items:center;gap:13px;
  padding:14px 16px;
  border:1.5px solid var(--gray-100);
  border-radius:12px;
  cursor:pointer;font-size:14px;color:var(--gray-900);
  background:linear-gradient(135deg,#fff,#fafafa);
  min-height:52px;-webkit-tap-highlight-color:transparent;
  transition:all .18s;
  font-family:inherit;text-align:left;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.quiz-opt:hover{
  border-color:var(--green-300);background:linear-gradient(135deg,#f0fdf8,var(--green-50));
  transform:translateX(4px);
  box-shadow:0 3px 12px rgba(29,158,117,.15);
}
.quiz-opt.correct{
  background:linear-gradient(135deg,#f0fdf4,var(--green-50));
  border-color:var(--green-400);color:var(--green-900);
  box-shadow:0 3px 16px rgba(29,158,117,.2);
}
.quiz-opt.wrong{
  background:linear-gradient(135deg,#fff1f2,var(--red-50));
  border-color:var(--red-100);color:var(--red-900);
}
.quiz-opt[disabled]{cursor:default;pointer-events:none;transform:none}
.quiz-opt-num{
  width:30px;height:30px;border-radius:50%;
  background:var(--gray-50);border:1.5px solid var(--gray-200);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;flex-shrink:0;
  transition:all .18s;
}
.quiz-opt.correct .quiz-opt-num{
  background:linear-gradient(135deg,var(--green-500),var(--green-400));
  border-color:var(--green-400);color:#fff;
  box-shadow:0 2px 8px rgba(29,158,117,.4);
}
.quiz-opt.wrong .quiz-opt-num{
  background:linear-gradient(135deg,var(--red-700),#c0392b);
  border-color:var(--red-700);color:#fff;
}
.quiz-result{
  margin-top:14px;padding:14px 16px;
  border-radius:12px;font-size:13px;line-height:1.65;
  display:flex;gap:11px;align-items:flex-start;
  animation:fadeSlide .3s ease;
}
.quiz-result.ok{
  background:linear-gradient(135deg,#f0fdf4,var(--green-50));
  color:var(--green-900);border:1.5px solid var(--green-100);
  box-shadow:0 2px 12px rgba(29,158,117,.12);
}
.quiz-result.no{
  background:linear-gradient(135deg,#fff1f2,var(--red-50));
  color:var(--red-900);border:1.5px solid var(--red-100);
}
.quiz-result-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.quiz-next-btn{
  margin-top:14px;width:100%;padding:16px;
  background:linear-gradient(135deg,var(--green-800),var(--green-600),var(--green-400));
  border:none;color:#fff;
  font-weight:800;font-size:15px;font-family:inherit;
  border-radius:14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 6px 24px rgba(29,158,117,.4);
  transition:all .2s;
  letter-spacing:.3px;
}
.quiz-next-btn:hover{
  opacity:.92;transform:translateY(-2px);
  box-shadow:0 10px 32px rgba(29,158,117,.45);
}

/* Extended course library */
.course-library{
  max-width:1200px;
  margin:0 auto;
  padding:10px 16px 22px;
}
.course-library-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:14px;
  margin:8px 0 14px;
}
.course-library-kicker{
  font-size:11px;
  color:var(--green-700);
  font-weight:800;
  letter-spacing:.6px;
  text-transform:uppercase;
  margin-bottom:5px;
}
.course-library-title{
  font-size:20px;
  line-height:1.35;
  color:var(--gray-900);
  font-weight:800;
}
.course-library-note{
  max-width:360px;
  font-size:12px;
  color:var(--gray-500);
  line-height:1.7;
  text-align:right;
}
.home-dashboard{
  display:grid;
  gap:12px;
  margin:0 0 18px;
}
.quiz-progress-panel{
  background:linear-gradient(135deg,#ffffff,#f5fbf8);
  border:1px solid rgba(29,158,117,.14);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  padding:16px;
}
.quiz-progress-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px;
}
.quiz-progress-title{
  font-size:16px;
  font-weight:900;
  color:var(--gray-900);
  line-height:1.35;
}
.quiz-progress-sub{
  margin-top:4px;
  color:var(--gray-500);
  font-size:12px;
  line-height:1.6;
}
.quiz-progress-ring{
  width:58px;
  height:58px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green-900);
  font-size:15px;
  font-weight:900;
  background:conic-gradient(var(--green-500) var(--quiz-progress,0%), var(--green-50) 0);
  position:relative;
}
.quiz-progress-ring::after{
  content:"";
  position:absolute;
  inset:7px;
  border-radius:50%;
  background:#fff;
}
.quiz-progress-ring span{position:relative;z-index:1}
.quiz-progress-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.quiz-progress-stat{
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  border-radius:12px;
  padding:10px;
}
.quiz-progress-val{
  font-size:20px;
  line-height:1;
  font-weight:900;
  color:var(--gray-900);
}
.quiz-progress-lbl{
  margin-top:5px;
  font-size:11px;
  color:var(--gray-500);
  font-weight:700;
}
.unit-menu{
  background:rgba(255,255,255,.94);
  border:1px solid rgba(29,158,117,.12);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  padding:14px;
}
.unit-menu-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
.unit-menu-title{
  font-size:15px;
  line-height:1.35;
  font-weight:900;
  color:var(--gray-900);
}
.unit-menu-note{
  font-size:11px;
  color:var(--gray-500);
  line-height:1.5;
  text-align:right;
}
.unit-menu-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.unit-menu-btn{
  border:1px solid rgba(29,158,117,.13);
  background:linear-gradient(135deg,#fff,#f7fcfa);
  border-radius:12px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:8px;
  text-align:left;
  font-family:inherit;
  cursor:pointer;
  min-height:50px;
  transition:all .18s ease;
}
.unit-menu-btn.active{
  border-color:rgba(29,158,117,.48);
  background:linear-gradient(135deg,var(--green-50),#fff);
  box-shadow:0 8px 22px rgba(29,158,117,.12);
}
.unit-menu-btn:hover{
  transform:translateY(-1px);
  border-color:rgba(29,158,117,.35);
  box-shadow:var(--shadow-sm);
}
.unit-menu-no{
  width:26px;
  height:26px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:#fff;
  font-size:11px;
  font-weight:900;
}
.unit-menu-text{
  min-width:0;
}
.unit-menu-name{
  font-size:12px;
  color:var(--gray-900);
  font-weight:800;
  line-height:1.35;
}
.unit-menu-count{
  margin-top:2px;
  font-size:10px;
  color:var(--gray-500);
}
.course-display-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(29,158,117,.12);
  border-radius:var(--radius-md);
  padding:12px 14px;
  margin:0 0 12px;
  box-shadow:var(--shadow-sm);
}
.course-display-title{
  min-width:0;
  font-size:14px;
  line-height:1.4;
  font-weight:900;
  color:var(--gray-900);
}
.course-display-sub{
  margin-top:2px;
  font-size:11px;
  line-height:1.4;
  color:var(--gray-500);
}
.course-display-actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}
.course-view-btn{
  border:1px solid rgba(29,158,117,.18);
  background:#fff;
  color:var(--green-800);
  border-radius:10px;
  padding:9px 10px;
  font-family:inherit;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.course-view-btn.on{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(135deg,var(--green-700),var(--green-500));
}
.lesson-workspace{
  display:grid;
  gap:14px;
}
.lesson-switcher{
  background:rgba(255,255,255,.94);
  border:1px solid rgba(29,158,117,.12);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  padding:14px;
}
.lesson-switcher-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.lesson-switcher-title{
  font-size:13px;
  font-weight:900;
  color:var(--gray-900);
}
.lesson-switcher-progress{
  font-size:11px;
  color:var(--gray-500);
  font-weight:700;
}
.lesson-switcher-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
}
.lesson-pill{
  border:1px solid rgba(29,158,117,.13);
  background:#fff;
  border-radius:10px;
  min-height:42px;
  padding:7px 5px;
  font-family:inherit;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  transition:all .18s ease;
}
.lesson-pill:hover{
  border-color:rgba(29,158,117,.35);
  transform:translateY(-1px);
}
.lesson-pill.active{
  border-color:transparent;
  background:linear-gradient(135deg,var(--green-700),var(--green-500));
  color:#fff;
  box-shadow:var(--shadow-green);
}
.lesson-pill-no{
  font-size:12px;
  line-height:1;
  font-weight:900;
}
.lesson-pill-status{
  font-size:10px;
  line-height:1;
  color:var(--gray-500);
}
.lesson-pill.active .lesson-pill-status{
  color:rgba(255,255,255,.78);
}
.lesson-focus{
  min-width:0;
}
.lesson-nav{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}
.lesson-nav-btn{
  border:1px solid rgba(29,158,117,.16);
  background:#fff;
  color:var(--green-800);
  border-radius:10px;
  min-height:42px;
  padding:10px 8px;
  font-family:inherit;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  text-align:center;
}
.lesson-nav-btn:disabled{
  opacity:.45;
  cursor:default;
}
.lesson-focus .course-card{
  border-color:rgba(29,158,117,.16);
  box-shadow:var(--shadow-md);
}
@media(max-width:520px){
  .course-library-head,.course-display-bar,.unit-menu-head{
    align-items:flex-start;
    flex-direction:column;
  }
  .course-library-note,.unit-menu-note{
    text-align:left;
  }
  .course-display-actions{
    width:100%;
  }
  .course-view-btn{
    flex:1;
  }
  .unit-menu-grid{
    grid-template-columns:1fr;
  }
  .lesson-switcher-grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
}
.course-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.course-unit{
  margin:18px 0 22px;
}
.course-unit-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.course-unit-badge{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
  font-weight:900;
  background:linear-gradient(135deg,var(--green-800),var(--green-500));
  flex-shrink:0;
}
.course-unit-title{
  font-size:17px;
  line-height:1.35;
  color:var(--gray-900);
  font-weight:900;
}
.course-unit-desc{
  font-size:12px;
  color:var(--gray-500);
  line-height:1.65;
}
.course-card{
  background:rgba(255,255,255,.94);
  border:1px solid rgba(29,158,117,.12);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.course-card.compact{
  min-height:100%;
}
.course-card.compact details{
  border-top:1px solid rgba(0,0,0,.06);
}
.lesson-summary{
  list-style:none;
  cursor:pointer;
  padding:12px 16px;
  background:linear-gradient(135deg,#fff,#f7fcfa);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  font-weight:900;
  color:var(--green-800);
}
.lesson-summary::-webkit-details-marker{display:none}
.lesson-summary i{
  color:var(--green-600);
  font-size:16px;
  transition:transform .18s ease;
}
.course-card.compact details[open] .lesson-summary i{
  transform:rotate(180deg);
}
.course-card-head{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:16px 16px 12px;
}
.course-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:21px;
  flex-shrink:0;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.course-num{
  min-width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
  font-weight:900;
  flex-shrink:0;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.course-title{
  font-size:16px;
  font-weight:800;
  color:var(--gray-900);
  line-height:1.4;
}
.course-goal{
  margin-top:4px;
  font-size:12px;
  color:var(--gray-500);
  line-height:1.65;
}
.course-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:0 16px 14px 70px;
}
.course-tag{
  font-size:11px;
  line-height:1;
  color:var(--green-800);
  background:var(--green-50);
  border:1px solid var(--green-100);
  border-radius:999px;
  padding:7px 9px;
  font-weight:700;
}
.course-detail{
  border-top:1px solid rgba(0,0,0,.06);
  background:linear-gradient(180deg,rgba(245,250,248,.88),rgba(255,255,255,.98));
  padding:14px 16px 16px;
}
.course-detail-title{
  font-size:12px;
  color:var(--green-700);
  font-weight:800;
  margin-bottom:9px;
}
.course-list{
  display:grid;
  gap:8px;
  list-style:none;
}
.course-list li{
  display:flex;
  gap:8px;
  font-size:13px;
  line-height:1.65;
  color:var(--gray-700);
}
.course-list li::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green-500);
  flex-shrink:0;
  margin-top:8px;
}
.course-card.compact .course-tags{
  padding-left:16px;
}
.course-card.compact .course-detail{
  padding-top:12px;
}
.lesson-fields{
  display:grid;
  gap:10px;
}
.lesson-field{
  border:1px solid rgba(29,158,117,.12);
  background:rgba(255,255,255,.78);
  border-radius:12px;
  padding:11px 12px;
}
.lesson-field-label{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--green-800);
  font-weight:900;
  margin-bottom:6px;
}
.lesson-field-label i{
  font-size:14px;
  color:var(--green-600);
}
.lesson-field-text{
  font-size:13px;
  line-height:1.75;
  color:var(--gray-700);
}
.lesson-field.quiz{
  background:linear-gradient(135deg,#f8f7ff,#fff);
  border-color:rgba(55,48,163,.16);
}
.lesson-field.quiz .lesson-field-label,
.lesson-field.quiz .lesson-field-label i{
  color:var(--purple-700);
}
.lesson-quiz-q{
  font-size:13px;
  line-height:1.7;
  color:var(--gray-900);
  font-weight:800;
  margin-bottom:10px;
}
.lesson-choice-list{
  display:grid;
  gap:7px;
  margin-bottom:10px;
}
.lesson-choice{
  display:grid;
  grid-template-columns:26px 1fr;
  gap:8px;
  align-items:start;
  width:100%;
  text-align:left;
  font-family:inherit;
  padding:8px 9px;
  border:1px solid rgba(55,48,163,.12);
  border-radius:10px;
  background:rgba(255,255,255,.82);
  font-size:12px;
  line-height:1.55;
  color:var(--gray-700);
  cursor:pointer;
  transition:all .18s ease;
}
.lesson-choice:hover:not(:disabled){
  border-color:rgba(55,48,163,.32);
  background:#fff;
  transform:translateY(-1px);
}
.lesson-choice:disabled{
  cursor:default;
}
.lesson-choice-letter{
  width:24px;
  height:24px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  color:var(--purple-700);
  background:var(--purple-50);
}
.lesson-choice.correct{
  border-color:rgba(29,158,117,.35);
  background:linear-gradient(135deg,#f0fdf8,#fff);
}
.lesson-choice.correct .lesson-choice-letter{
  color:#fff;
  background:linear-gradient(135deg,var(--green-700),var(--green-500));
}
.lesson-choice.wrong{
  border-color:rgba(192,57,43,.34);
  background:linear-gradient(135deg,#fff1f2,#fff);
}
.lesson-choice.wrong .lesson-choice-letter{
  color:#fff;
  background:linear-gradient(135deg,var(--red-700),var(--red-500));
}
.lesson-choice.selected:not(.correct):not(.wrong){
  border-color:rgba(55,48,163,.35);
}
.lesson-answer,.lesson-tip{
  font-size:12px;
  line-height:1.65;
  padding:8px 10px;
  border-radius:10px;
}
.lesson-answer{
  color:var(--gray-900);
  background:#fff;
  border:1px solid rgba(0,0,0,.08);
  margin-bottom:7px;
  font-weight:700;
}
.lesson-answer.ok{
  color:var(--green-900);
  background:var(--green-50);
  border-color:var(--green-100);
}
.lesson-answer.no{
  color:var(--red-900);
  background:var(--red-50);
  border-color:var(--red-100);
}
.lesson-tip{
  color:var(--amber-900);
  background:var(--amber-50);
  border:1px solid var(--amber-100);
}

/* ── Footer nav ── */
.lp-footer{
  display:none;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(29,158,117,.10);
  padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  position:sticky;bottom:0;z-index:100;
  box-shadow:0 -4px 20px rgba(0,0,0,.07);
}
.lp-footer-inner{width:100%;max-width:1200px;margin:0 auto;display:flex;gap:12px}
.btn-prev,.btn-next{
  flex:1;padding:14px 16px;font-size:14px;font-family:inherit;
  cursor:pointer;border-radius:14px;
  min-height:50px;-webkit-tap-highlight-color:transparent;
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-weight:700;
}
.btn-prev{
  background:var(--white);border:1.5px solid var(--gray-200);
  color:var(--gray-700);
}

// ── STATE ──
let lang = 'zh';
let openSecs = {0:true,1:true,2:false,3:false,4:false,5:false,6:false,7:false,8:false,9:false};
let quizAnswered = null;
let quizChosen = null;
let lessonQuizState = {};
let selectedCourseUnit = 1;
let selectedLessonNo = '01';
let courseViewMode = 'unit';

// ── HELPERS ──
if(typeof window.sendPrompt !== 'function'){
  window.sendPrompt = function(message){
    const t = LANG[lang] || LANG.zh;
    let noticeText = message;
    if(message.includes('返回') || message.includes('課程清單')) noticeText = t.back;
    if(message.includes('上一課')) noticeText = t.prev;
    if(message.includes('下一課')) noticeText = t.quizNextBtn || t.next;
    let notice = document.getElementById('lp-action-notice');
    if(!notice){
      notice = document.createElement('div');
      notice.id = 'lp-action-notice';
      notice.className = 'lp-action-notice';
      notice.setAttribute('role','status');
      notice.setAttribute('aria-live','polite');
      document.body.appendChild(notice);
    }
    notice.textContent = noticeText;
    notice.classList.add('show');
    clearTimeout(window.__lpNoticeTimer);
    window.__lpNoticeTimer = setTimeout(()=>notice.classList.remove('show'),2200);
    if(window.parent && window.parent !== window){
      window.parent.postMessage({type:'caregiver-training:navigation',prompt:message},'*');
    }
  };
}

function setLang(l){
  lang = l;
  quizAnswered = null;
  quizChosen = null;
  ['zh','id','en','vi'].forEach(x=>document.getElementById('lb-'+x).classList.toggle('on',x===l));
  const t = LANG[l];
  document.getElementById('back-txt').textContent = t.back;
  document.getElementById('unit-tag').textContent = t.unitTag;
  document.getElementById('lesson-num').textContent = t.lessonNum;
  document.getElementById('lesson-title').textContent = t.title;
  document.getElementById('lesson-subtitle').textContent = t.sub;
  document.getElementById('btn-prev-txt').textContent = t.prev;
  document.getElementById('btn-next-txt').textContent = t.next;
  if(document.getElementById('prog-label-txt')) document.getElementById('prog-label-txt').textContent = t.progLabel;
  // stats
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(t[k]) el.textContent = t[k];
  });
  renderSecNav();
  renderBody();
  renderCourseLibrary();
}

function renderSecNav(){
  const t = LANG[lang];
  const nav = document.getElementById('sec-nav');
  const tabs = SECTION_META.map((m,i)=>
    `<button class="sec-tab${openSecs[i]?' on':''}" onclick="toggleSec(${i})">
      <i class="ti ${m.icon}" style="font-size:13px;color:${openSecs[i]?m.ic:'#999'}"></i>
      ${t.secs[i]}
    </button>`
  ).join('');
  const quizTab = `<button class="sec-tab${openSecs[9]?' on':''}" onclick="toggleSec(9)">${t.quizLabel}</button>`;
  nav.innerHTML = tabs + quizTab;
}

function toggleSec(i){
  openSecs[i] = !openSecs[i];
  renderSecNav();
  renderBody();
}

function answerQuiz(chosen){
  const correctIdx = CONTENT[lang].quiz.correct;
  quizChosen = chosen;
  quizAnswered = (chosen===correctIdx)?'correct':'wrong';
  renderBody();
  setTimeout(()=>{
    const el=document.getElementById('quiz-card');
    if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
  },80);
}

function updateHeroProgress(){
  const s = getQuizProgressStats();
  const fill = document.querySelector('.lp-prog-fill');
  const pct = document.querySelector('.lp-prog-pct');
  if(fill) fill.style.width = Math.max(1,s.completeRate)+'%';
  if(pct) pct.innerHTML = s.completeRate+'<span>%</span>';
  // Also update stat bar quiz count
  const quizStat = document.querySelector('.lp-stat-val[data-quiz]');
  if(quizStat) quizStat.textContent = s.answered;
}

function answerLessonQuiz(lessonNo, chosen){
  lessonQuizState[lessonNo] = chosen;
  renderCourseLibrary();
  updateHeroProgress();
  setTimeout(()=>{
    const el = document.getElementById(`lesson-card-${lessonNo}`);
    if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
  },60);
}

function scrollToCourseUnit(unitNo){
  selectedCourseUnit = unitNo;
  selectedLessonNo = String((unitNo - 1) * 10 + 1).padStart(2,'0');
  courseViewMode = 'unit';
  renderCourseLibrary();
  setTimeout(()=>{
    const el = document.getElementById('course-library');
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },40);
}

function setCourseViewMode(mode){
  courseViewMode = mode === 'all' ? 'all' : 'unit';
  renderCourseLibrary();
  setTimeout(()=>{
    const el = document.getElementById('course-library');
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },40);
}

function selectCourseLesson(lessonNo){
  selectedLessonNo = lessonNo;
  selectedCourseUnit = Math.ceil(Number(lessonNo) / 10);
  courseViewMode = 'unit';
  renderCourseLibrary();
}

function moveCourseLesson(delta){
  const units = getCourseUnits();
  const totalLessons = units.reduce((sum,u)=>sum+u.lessons.length,0);
  const next = Math.min(totalLessons,Math.max(1,Number(selectedLessonNo) + delta));
  selectCourseLesson(String(next).padStart(2,'0'));
}

// ── RENDER ──
function renderBody(){
  const c = CONTENT[lang];
  const t = LANG[lang];
  const body = document.getElementById('lp-body');
  let html = '';

  SECTION_META.forEach((m,i)=>{
    const open = openSecs[i];
    let inner = '';
    const metaLabel = t.secMeta ? t.secMeta[i] : '';

    if(open){
      // Optional inline illustration for certain sections
      const illo = SEC_ILLOS[i] ? `<div style="margin:14px 0 4px;border-radius:10px;overflow:hidden">${SEC_ILLOS[i]}</div>` : '';

      if(i===0){
        inner = illo + `<div class="why-block">${c.why.desc}</div>`;

      } else if(i===1){
        inner = `<div class="why-block">
          <div class="why-highlight">
            <i class="ti ti-quote why-highlight-icon"></i>
            <div>${c.why.highlight}</div>
          </div></div>`;

      } else if(i===2){
        inner = illo + `<div class="steps-list">${
          c.steps.map((s,si)=>`<div class="step-row">

          </div>`).join('')

      } else if(i===3){
        inner = `<div class="demo-split">
          <div class="demo-card wrong">

          </div>`).join('')
        }</div>`;

      } else if(i===6){
        inner = `<div class="alert-list">${
          c.notify.map(n=>`<div class="alert-row notify">
            <div class="alert-row-icon"><i class="ti ti-phone"></i></div>
            <div class="alert-row-body">
              <div class="alert-row-title">${n.main||n}</div>
              ${n.sub?`<div class="alert-row-sub">${n.sub}</div>`:''}
            </div>
          </div>`).join('')
        }</div>`;

      } else if(i===7){
        inner = illo + `<div class="alert-list">${
          c.er.map(e=>`<div class="alert-row er">
            <div class="alert-row-icon"><i class="ti ti-ambulance"></i></div>
            <div class="alert-row-body">
              <div class="alert-row-title">${e.main||e}</div>
              ${e.sub?`<div class="alert-row-sub">${e.sub}</div>`:''}
            </div>
          </div>`).join('')
        }</div>`;

      } else if(i===8){
        inner = `<div class="alert-list">${
          c.remind.map(r=>`<div class="alert-row remind">
            <div class="alert-row-icon"><i class="ti ti-bulb"></i></div>
            <div class="alert-row-body">
              <div class="alert-row-title">${r.main||r}</div>
              ${r.sub?`<div class="alert-row-sub">${r.sub}</div>`:''}
            </div>
          </div>`).join('')
        }</div>`;
      }
    }

    html += `<div class="sec-card" data-open="${open}">
      <div class="sec-header" onclick="toggleSec(${i})">
        <div class="sec-icon-wrap" style="background:${m.bg}">
          <i class="ti ${m.icon}" style="color:${m.ic}"></i>
        </div>
        <div class="sec-hinfo">
          <div class="sec-htag">${t.secs[i]}</div>
          <div class="sec-htitle">${m.lbl ? m.lbl[lang] : ''}</div>
          ${metaLabel&&!open?`<div class="sec-meta">${metaLabel}</div>`:''}
        </div>
        <i class="ti ti-chevron-down sec-chevron"></i>
      </div>
      ${open?`<div class="sec-body">${inner}</div>`:''}
    </div>`;

  const quizOpen = openSecs[9];
  let quizInner = '';
  if(quizOpen){
    const q = c.quiz;

      let cls = '';

        if(oi===q.correct) cls=' correct';

      return `<button class="quiz-opt${cls}" ${answered?'disabled':''} onclick="answerQuiz(${oi})">

      <div class="quiz-header">

        <div class="quiz-q">${q.q}</div>

  html += `<div class="sec-card" id="quiz-card" data-open="${quizOpen}">
    <div class="sec-header" onclick="toggleSec(9)">
      <div class="sec-icon-wrap" style="background:#EEEDFE">

    ${quizOpen?`<div class="sec-body">${quizInner}</div>`:''}
  </div>`;

  body.innerHTML = html;
}

  {no:'01',text:'長期照護是長者因年老、疾病、失能或失智，需要長時間有人協助生活與安全。外籍看護的重點不是代替長者做所有事，而是在安全範圍內協助他保留能力與尊嚴。',demo:'先閱讀照護計畫，再觀察長者今天精神、走路、吃飯與情緒；用簡單句子向長者說明今天要協助的事項。',wrong:'以為照護只是打掃與煮飯，忽略長者的身體變化、情緒反應與安全風險。',quiz:'長期照護最重要的目標是什麼？答案：安全、尊重、維持生活功能，並即時回報異常。'},
  {no:'02',text:'外籍看護的工作包含日常照護、生活協助、陪同活動、觀察紀錄與回報，但不能自行診斷、改藥、做侵入性醫療或取代醫護人員。',demo:'家屬交代協助量血壓、提醒吃藥、記錄食量時，照護者照計畫執行並記錄；如果長者不舒服，立即回報家屬。',wrong:'看到長者血壓高就自己增加藥量，或聽鄰居建議更改照護方式。',quiz:'看護可以自行調整藥物嗎？答案：不可以，只能提醒、紀錄與回報。'},
  {no:'03',text:'照護者要清楚知道自己的角色：可以協助、觀察、陪伴、提醒，但遇到醫療判斷、金錢決定或家庭衝突時，要請家屬或專業人員處理。',demo:'長者要求多吃一顆藥時，照護者先安撫，再確認藥袋與家屬指示，不自行答應。',wrong:'為了讓長者開心而答應所有要求，包含不安全外出、改藥或吃不適合的食物。',quiz:'遇到超出工作範圍的要求時應怎麼辦？答案：先停止，確認照護計畫並回報家屬。'},
  {no:'04',text:'尊重長者隱私與尊嚴，是照護工作的基本原則。洗澡、更衣、如廁與身體清潔前，要先告知、遮蔽身體，並避免讓無關的人看見。',demo:'協助更衣前先說明「我要幫您換衣服」，拉上門簾或關門，只露出正在清潔的部位。',wrong:'沒有說明就直接掀被子、拍照傳訊息，或在別人面前討論長者身體狀況。',quiz:'協助洗澡前第一步是什麼？答案：先告知長者並保護隱私。'},
  {no:'05',text:'照護計畫記錄長者疾病、用藥、飲食、活動能力、禁忌與緊急聯絡方式，是每天工作的依據。看不懂時要問，不要猜。',demo:'上工第一天先確認診斷、過敏、藥物、飲食限制、移位方式與家屬聯絡順序。',wrong:'只聽口頭交代，不看照護計畫；遇到問題時憑以前經驗處理。',quiz:'照護計畫看不懂時應該怎麼做？答案：立即詢問家屬或負責人，不能自己猜。'},
  {no:'06',text:'每日工作流程可以分成晨間照護、用餐與用藥提醒、活動陪同、午休觀察、晚間清潔與紀錄回報。固定流程能減少漏做。',demo:'用紙本或手機清單勾選已完成事項，例如早餐、藥物提醒、排便、喝水、活動與睡眠。',wrong:'想到什麼做什麼，沒有固定順序，導致漏記藥物、漏補水或忘記回報異常。',quiz:'為什麼要有每日工作流程？答案：減少遺漏，讓照護更穩定。'},
  {no:'07',text:'與家屬溝通要固定時間、固定方式、固定內容。回報要用事實，不用情緒字眼，讓家屬能快速判斷狀況。',demo:'回報「午餐吃半碗飯、喝水 300ml、下午咳嗽 3 次、無發燒」，比說「今天好像不好」更清楚。',wrong:'只在嚴重時才回報，或用「很奇怪、很糟糕」這類模糊描述。',quiz:'好的回報應該包含什麼？答案：時間、事件、觀察到的事實與已做處理。'},
  {no:'08',text:'常見照護錯誤包括未確認安全、未告知長者、趕時間、忘記紀錄、自己做醫療判斷。避免錯誤的核心是慢一點、問清楚、留下紀錄。',demo:'移位前先檢查地面、鞋子、輪椅煞車與長者精神，再開始扶站。',wrong:'長者一說要起來，就直接拉手站起，沒有檢查頭暈或腳是否踩穩。',quiz:'避免照護錯誤的三個關鍵是什麼？答案：確認、溝通、紀錄。'},
  {no:'09',text:'照護倫理是把長者當成有感受、有選擇的人。即使長者動作慢、重複詢問或情緒不好，也要保持禮貌與耐心。',demo:'用「我慢慢幫您」「您想先喝水還是先洗臉」給長者選擇，而不是命令。',wrong:'用責備語氣說「你怎麼又忘了」，或在長者面前抱怨他很麻煩。',quiz:'照護時為什麼要給長者選擇？答案：維持尊嚴並提高配合度。'},
  {no:'10',text:'本課複習第一單元：外籍看護要理解角色、工作範圍、隱私尊重、照護計畫、每日流程與回報方式。',demo:'老師給一個上工第一天情境，學員依序說出要看哪些資料、問哪些問題、如何回報。',wrong:'只記得要做家事，卻說不出長者過敏、緊急聯絡人或移位禁忌。',quiz:'上工第一天最重要的三件事是什麼？答案：看照護計畫、確認安全、建立回報方式。'},

  {no:'11',text:'洗臉刷牙與口腔清潔可預防感染、口臭與吞嚥問題。長者若無法自己刷牙，看護要協助清潔牙齒、牙齦、舌頭與假牙。',demo:'準備牙刷、杯水、毛巾，讓長者坐穩；從外側牙面到內側輕刷，假牙取下後分開清洗。',wrong:'讓長者躺著漱口，或用太大力氣刷牙造成牙齦流血。',quiz:'口腔清潔時長者最好採什麼姿勢？答案：坐起或半坐臥，避免嗆到。'},
  {no:'12',text:'擦澡適合無法每天洗澡或體力較弱的長者。重點是保暖、保護隱私，並由乾淨部位到較髒部位。',demo:'先準備溫水、毛巾、乾衣服與尿布；一次只露出一個部位，擦完立刻擦乾蓋好。',wrong:'整個身體一次露出，水溫太冷，或清潔會陰後又用同一條毛巾擦臉。',quiz:'擦澡順序應該怎麼安排？答案：由乾淨到較髒，並保持保暖。'},
  {no:'13',text:'沐浴前要確認浴室安全，包含地面乾燥、防滑墊、扶手、水溫、衣物與緊急呼叫方式。',demo:'放水後先用手腕內側試水溫，確認拖鞋防滑，再扶長者慢慢進浴室坐穩。',wrong:'地板濕滑還讓長者自己走進浴室，或洗澡中離開去拿東西。',quiz:'沐浴前最重要的安全檢查是什麼？答案：防滑、水溫、扶手與用品是否備齊。'},
  {no:'14',text:'更衣不只是換衣服，也要注意保暖、皮膚、肢體疼痛與長者自主感。身體較弱的一側通常先穿後脫。',demo:'先告知要更衣，準備寬鬆衣物；穿衣時先穿患側，脫衣時先脫健側。',wrong:'硬拉手臂穿袖子，造成疼痛或拉傷；冬天更衣時間太久讓長者著涼。',quiz:'中風長者穿衣通常哪一側先穿？答案：患側先穿，健側先脫。'},
  {no:'15',text:'指甲、頭髮與皮膚清潔能減少感染與抓傷。清潔時要觀察紅腫、破皮、香港腳、頭皮傷口與異常分泌物。',demo:'洗頭前確認水溫與姿勢；剪指甲前先泡溫水軟化，剪平不要剪太深。',wrong:'把指甲剪得太短造成流血，或忽略腳趾縫濕氣與破皮。',quiz:'皮膚清潔時要觀察哪些異常？答案：紅腫、破皮、瘀青、壓痕、疼痛。'},
  {no:'16',text:'尿布更換與會陰清潔可預防尿布疹、泌尿道感染與異味。清潔方向要由前往後，避免把細菌帶到尿道。',demo:'戴手套，移除髒尿布後用溫水或濕紙巾由前往後擦拭，擦乾後再換乾淨尿布。',wrong:'由後往前擦，或皮膚還濕就包尿布，造成悶熱與破皮。',quiz:'會陰清潔方向為什麼要由前往後？答案：降低感染風險。'},
  {no:'17',text:'如廁協助要兼顧安全與尊嚴。排泄觀察包含次數、顏色、氣味、便秘、腹瀉、尿量與疼痛。',demo:'扶長者到馬桶前先確認鞋子、防滑與扶手；如廁後記錄排便型態與是否不舒服。',wrong:'催促長者快一點，或不關門、不遮蔽，讓長者感到羞辱。',quiz:'排便紀錄要注意哪些內容？答案：時間、量、形狀、顏色、是否疼痛。'},
  {no:'18',text:'床鋪整理可預防壓傷與跌落。床單要平整乾燥，身體突出部位如尾椎、腳跟、手肘要減少長時間壓迫。',demo:'翻身時先告知，拉近長者身體，使用枕頭支撐背部與膝蓋，確認床欄與呼叫鈴。',wrong:'床單皺成一團仍讓長者躺著，或直接拉手臂翻身。',quiz:'床單為什麼要平整？答案：減少摩擦、壓痕與壓傷風險。'},
  {no:'19',text:'居家環境清潔重點是防跌、防感染與物品定位。走道不可堆雜物，常用物品要固定位置。',demo:'每天檢查地面是否濕滑、電線是否外露、夜燈是否可用，廁所與床邊保持乾燥。',wrong:'清潔後地板未擦乾，或把助行器、眼鏡、呼叫鈴放到長者拿不到的地方。',quiz:'居家防跌最先檢查哪裡？答案：走道、床邊、浴室與廁所地面。'},
  {no:'20',text:'第二單元檢核長者清潔照護能力，學員要能準備用品、說明流程、保護隱私、完成清潔並記錄皮膚狀況。',demo:'老師指定擦澡情境，學員說出用品、水溫、遮蔽、清潔順序與異常回報內容。',wrong:'只做清潔動作，卻沒有觀察皮膚、沒有保暖、沒有回報破皮。',quiz:'清潔照護完成後必須做什麼？答案：擦乾保暖、整理環境、記錄與回報異常。'},

  {no:'21',text:'長者飲食要重視營養、安全與個人疾病限制。食物應依咀嚼能力、吞嚥能力、疾病與家屬指示調整。',demo:'備餐前確認是否有糖尿病、高血壓、腎臟病、過敏或吞嚥困難，再決定食物質地。',wrong:'長者想吃什麼就全部給，忽略鹽分、糖分、過敏與吞嚥風險。',quiz:'備餐前要先確認哪些資訊？答案：疾病限制、過敏、吞嚥能力與照護計畫。'},
  {no:'22',text:'備餐衛生包含洗手、生熟食分開、餐具清潔、食物煮熟與剩食保存。長者免疫力較弱，更要避免食物中毒。',demo:'處理食物前洗手，切生肉與熟食用不同砧板，剩菜冷藏並標記時間。',wrong:'用切生肉的刀直接切水果，或把室溫剩菜放很久再給長者吃。',quiz:'生熟食為什麼要分開？答案：避免細菌交叉污染。'},
  {no:'23',text:'軟質、泥狀與剪碎食物是為了幫助咀嚼與吞嚥，不是把所有食物隨便混在一起。食物仍要看得出種類並保持適當濕潤。',demo:'把肉剪小、蔬菜煮軟，必要時加湯汁調整濕度，讓長者容易吞下。',wrong:'食物太乾、太大塊，或把飯菜全部打成很稀卻沒有確認醫囑。',quiz:'吞嚥困難者食物太乾會有什麼風險？答案：容易嗆咳或卡住。'},
  {no:'24',text:'餵食時姿勢、速度與口量都很重要。長者應坐正，頭微微向前，小口慢餵，確認吞下後再給下一口。',demo:'一口約半湯匙，餵完觀察喉嚨吞嚥動作與口腔是否殘留。',wrong:'一邊聊天一邊快速餵，或長者還沒吞完就塞下一口。',quiz:'餵食時為什麼要小口慢餵？答案：降低嗆咳與誤吸風險。'},
  {no:'25',text:'吞嚥困難常見表現包含吃飯咳嗽、聲音變濕、食物含在嘴裡、流口水、吃很久或反覆肺炎。',demo:'餵食中若長者咳嗽，先停止，讓他坐正休息，觀察呼吸並回報家屬。',wrong:'看到咳嗽仍繼續餵，認為快吃完比較重要。',quiz:'聲音突然變濕可能代表什麼？答案：可能有吞嚥不安全或嗆入風險。'},
  {no:'26',text:'嗆咳時要先停止餵食，保持坐姿，鼓勵咳出，不可立刻灌水。若呼吸困難、臉色發紫或無法說話，要立即求救。',demo:'長者嗆咳後停止餵食，移開食物，觀察呼吸、咳嗽是否有效，必要時通知家屬或 119。',wrong:'用水把食物沖下去，或拍打太大力造成受傷。',quiz:'嗆咳時第一步是什麼？答案：停止餵食並讓長者保持坐正。'},
  {no:'27',text:'水分不足會造成便秘、頭暈、尿量減少、尿色變深、意識混亂。補水要分次少量，依疾病限制調整。',demo:'把一天喝水量分成早、中、晚與兩次點心時間記錄，觀察尿色與排尿次數。',wrong:'一天結束才一次要求喝很多水，或腎臟病、心臟病長者未依指示限水。',quiz:'脫水常見警訊有哪些？答案：尿少、尿色深、口乾、頭暈、精神變差。'},
  {no:'28',text:'糖尿病長者要注意定時定量、避免過甜；高血壓長者要注意少鹽、少加工食品。飲食調整要依家屬或醫囑。',demo:'準備餐點時少用醬油、醃製品與含糖飲料，並記錄實際食量。',wrong:'覺得長者沒胃口就給甜飲料或很鹹的配菜刺激食慾。',quiz:'高血壓飲食最需要注意什麼？答案：減少鹽分與加工食品。'},
  {no:'29',text:'食量紀錄要具體，例如半碗飯、三口菜、喝水 200ml。具體紀錄能幫助家屬判斷營養、水分與疾病變化。',demo:'記錄早餐：粥半碗、蛋一半、水 150ml、無嗆咳；午餐：飯三分之一碗、咳嗽兩次。',wrong:'只寫正常、不正常，沒有數量與時間，家屬無法追蹤變化。',quiz:'食量回報為什麼要寫數量？答案：方便比較變化並判斷是否需要處理。'},
  {no:'30',text:'第三單元演練整合備餐、餵食、吞嚥觀察、補水與食量紀錄。學員要能在安全狀態下完成一餐照護。',demo:'老師給吞嚥較慢的長者情境，學員示範坐姿、小口慢餵、停止處理嗆咳與紀錄。',wrong:'只注意把飯餵完，沒有觀察吞嚥、咳嗽、食量與水量。',quiz:'完成一餐照護後要回報哪三件事？答案：吃多少、喝多少、有無嗆咳或異常。'},

  {no:'31',text:'防跌要從環境開始。床邊、廁所、浴室、走道、樓梯是最容易跌倒的地方，要保持乾燥、明亮、無障礙。',demo:'每天早晚檢查地面、夜燈、拖鞋、助行器位置與廁所扶手。',wrong:'把雜物放走道，或地板剛拖完就讓長者走路。',quiz:'防跌環境檢查最重要的原則是什麼？答案：乾燥、明亮、動線清楚。'},
  {no:'32',text:'扶站與坐下要讓長者先坐穩、腳踩地、身體微向前，再慢慢站起。坐下時要確認椅子在身後。',demo:'口令說「一、二、三站起來」，照護者站在較弱側或前側保護，不拉扯手臂。',wrong:'直接拉長者手臂起身，或還沒確認椅子位置就讓他坐下。',quiz:'扶站前長者的腳應該在哪裡？答案：雙腳踩穩地面，靠近身體。'},
  {no:'33',text:'床到輪椅移位要先確認輪椅煞車、腳踏板收起、床高合適與長者是否頭暈。',demo:'讓長者坐床邊休息 30 秒，確認不頭暈，再協助站起轉身坐到輪椅。',wrong:'輪椅沒煞車就移位，或長者剛起床頭暈仍急著站。',quiz:'床椅移位前一定要先做什麼？答案：鎖輪椅煞車並確認長者狀態。'},
  {no:'34',text:'輪椅使用要確認煞車、腳踏板、坐姿與安全帶。推輪椅過門檻、斜坡或電梯時要放慢。',demo:'長者坐好後腳放腳踏板，手不要伸出輪子旁；停下時先煞車再協助起身。',wrong:'推輪椅太快，腳踏板沒放好，造成腳撞到地面或門框。',quiz:'輪椅停下協助起身前要先做什麼？答案：鎖煞車。'},
  {no:'35',text:'助行器與拐杖能增加穩定，但高度、使用順序與地面安全很重要。輔具不是拿著就安全，要學會正確用。',demo:'助行器先往前一小步，長者再移動腳步；照護者在旁保護，不催促。',wrong:'讓長者把助行器拿離地面走，或用不合高度的拐杖。',quiz:'使用助行器時應先移動什麼？答案：先移動助行器，再移動腳。'},
  {no:'36',text:'陪同步行時，照護者要走在長者較弱側或後側保護，注意步伐、呼吸、臉色與疲勞。',demo:'走路前先確認鞋子、防滑、路線與休息點；途中問「會不會喘或頭暈」。',wrong:'走在太前面讓長者跟不上，或邊滑手機邊陪走。',quiz:'陪走時要觀察哪些反應？答案：頭暈、喘、腳步不穩、臉色與疲勞。'},
  {no:'37',text:'床上翻身與肢體擺位可預防壓傷、關節僵硬與疼痛。翻身前要先告知並保護管線或尿布位置。',demo:'用枕頭支撐背部、膝蓋與腳跟，避免骨頭突出處長時間受壓。',wrong:'抓住手腕或肩膀硬拉翻身，造成疼痛或皮膚拉扯。',quiz:'翻身擺位為什麼要用枕頭支撐？答案：減少壓迫並維持舒適姿勢。'},
  {no:'38',text:'簡易關節活動能維持柔軟度，但不能造成疼痛。動作要慢，依照復健或家屬指示，不可勉強。',demo:'協助手臂、手腕、膝蓋、腳踝做小範圍活動，每次觀察表情與疼痛反應。',wrong:'覺得活動越大越好，硬把關節拉到疼痛位置。',quiz:'關節活動時出現疼痛應怎麼辦？答案：立即停止並回報。'},
  {no:'39',text:'跌倒後不要急著拉起。先確認意識、疼痛、出血、頭部撞擊、骨折可能與呼吸狀態。',demo:'讓長者保持原位，詢問哪裡痛，觀察頭部與四肢，通知家屬；嚴重時打 119。',wrong:'怕被責備就趕快扶起來，沒有檢查傷勢也沒有回報。',quiz:'跌倒後第一件事是什麼？答案：先確認安全與傷勢，不要立刻拉起。'},
  {no:'40',text:'第四單元測驗整合防跌、移位、輪椅、輔具、陪走、翻身與跌倒處理。重點是先安全檢查，再執行動作。',demo:'老師設計床到輪椅移位情境，學員依序說出煞車、腳踏板、頭暈、站立與坐下檢查。',wrong:'只把長者移到椅子上，卻漏掉煞車、鞋子、防滑與頭暈觀察。',quiz:'移位照護最重要的核心是什麼？答案：安全檢查、慢速協助、觀察反應。'},

  {no:'41',text:'常見慢性病包含高血壓、糖尿病、中風、心臟病、腎臟病與失智症。看護不負責診斷，但要知道照護限制與警訊。',demo:'閱讀照護計畫，整理每種疾病的飲食限制、活動限制、用藥提醒與需要回報的症狀。',wrong:'只記得疾病名稱，卻不知道長者不能吃什麼、何時要回報。',quiz:'看護面對慢性病最重要的任務是什麼？答案：照計畫照護、觀察變化、即時回報。'},
  {no:'42',text:'高血壓照護要注意定時量血壓、少鹽飲食、規律作息與頭痛、胸悶、暈眩等症狀。',demo:'量血壓前讓長者坐著休息 5 分鐘，手臂放平，記錄時間與數值。',wrong:'長者剛走路、剛洗澡或情緒激動就立刻量血壓，數字可能不準。',quiz:'量血壓前為什麼要休息？答案：讓數值較穩定，方便判斷。'},
  {no:'43',text:'糖尿病照護要注意定時用餐、低糖飲食、足部皮膚、低血糖與高血糖警訊。不可隨意延後用餐。',demo:'觀察是否冒冷汗、手抖、頭暈、意識變差；足部每天看有無破皮或紅腫。',wrong:'覺得長者胖就自行減少餐量，或讓糖尿病長者長時間沒吃東西。',quiz:'糖尿病長者足部破皮為什麼要回報？答案：傷口可能不易癒合並感染。'},
  {no:'44',text:'中風後常見單側無力、吞嚥困難、語言困難與跌倒風險。照護時要保護患側，也要鼓勵安全範圍內活動。',demo:'移位時站在較弱側保護，吃飯觀察嗆咳，說話時給長者足夠時間回答。',wrong:'拉扯患側手臂，或因長者說話慢就替他全部回答。',quiz:'中風後照護要特別注意哪三件事？答案：移位安全、吞嚥安全、患側保護。'},
  {no:'45',text:'心臟病長者若出現胸痛、胸悶、冒冷汗、呼吸困難、心跳很快或臉色蒼白，可能是緊急狀況。',demo:'讓長者停止活動、採舒適姿勢，立即通知家屬；症狀嚴重或持續時打 119。',wrong:'以為休息一下就好，繼續讓長者走路或洗澡。',quiz:'胸痛合併冒冷汗時應怎麼辦？答案：立即停止活動並通知家屬，必要時打 119。'},
  {no:'46',text:'用藥提醒的原則是對人、對藥、對時間、對劑量。看護不能自行停藥、加藥、換藥或把別人的藥給長者吃。',demo:'提醒前核對藥袋姓名、時間與顆數；吃完記錄時間，沒吃也要記錄原因。',wrong:'看到長者睡著就直接跳過藥，或把早上的藥移到晚上一起吃。',quiz:'用藥提醒四個確認是什麼？答案：人、藥、時間、劑量。'},
  {no:'47',text:'漏藥、錯藥與重複吃藥都要立即回報。不要自己補吃，因為不同藥物有不同處理方式。',demo:'發現藥盒還有早上的藥，先拍照或記錄，通知家屬確認下一步。',wrong:'怕被罵就不說，或自己決定下一餐吃兩倍。',quiz:'發現漏藥第一步是什麼？答案：停止自行處理並通知家屬或醫療人員。'},
  {no:'48',text:'體溫、脈搏與血壓是觀察身體變化的重要資料。記錄要包含日期、時間、數值、當時狀況與是否有症狀。',demo:'寫下「6/12 早上 8 點，血壓 135/82，脈搏 78，早餐前，無頭暈」。',wrong:'只寫正常，沒有數字；或量到異常數值沒有重測與回報。',quiz:'生命徵象紀錄為什麼要寫時間？答案：方便比較變化與判斷原因。'},
  {no:'49',text:'疼痛、腫脹與皮膚異常可能代表感染、跌倒傷害、壓傷或疾病變化。看護要觀察位置、大小、顏色、溫度與疼痛程度。',demo:'發現腳踝腫，記錄左右差異、是否紅熱、是否疼痛、何時開始，並通知家屬。',wrong:'只擦藥或按摩，沒有確認原因；若是骨折或感染可能更嚴重。',quiz:'發現不明腫脹時應記錄什麼？答案：位置、大小、顏色、疼痛、開始時間。'},
  {no:'50',text:'第五單元案例判斷整合慢性病、用藥、生命徵象與異常觀察。學員要能分辨可觀察、需通知家屬、需立即送醫的情境。',demo:'老師給三個案例：漏藥、胸悶、腳部破皮，學員判斷處理順序與回報內容。',wrong:'所有情況都等家屬問才說，或所有情況都自行處理。',quiz:'判斷異常時的三層分類是什麼？答案：持續觀察、通知家屬、立即求救。'},

  {no:'51',text:'失智症不是故意不聽話，而是記憶、判斷、語言或情緒調節能力退化。照護時要降低刺激、保持固定流程，並用簡短句子協助長者理解。',demo:'早上固定用同一句話提醒：「現在早上，我們先洗臉，再吃早餐。」搭配手勢指向洗臉用品。',wrong:'一直責備長者「你剛剛問過了」，或用太多指令讓長者更混亂。',quiz:'失智症照護溝通最重要的原則是什麼？答案：簡短、固定、耐心，先安撫再引導。'},
  {no:'52',text:'失智長者可能反覆問同一個問題，背後常是焦慮、不安全感或記憶無法保存。照護者要回應情緒，不要爭辯。',demo:'長者一直問「我要回家嗎？」可以回答：「您現在很擔心，我在這裡陪您，我們先喝水休息。」',wrong:'反覆說「我講很多次了」，讓長者覺得被否定而更焦慮。',quiz:'面對重複詢問時應先處理什麼？答案：先回應情緒，再用簡單方式轉移注意。'},
  {no:'53',text:'拒絕洗澡或吃飯常見原因包含害怕、太冷、疼痛、聽不懂、覺得被命令。先找原因，再改變方式。',demo:'拒絕洗澡時先問「是不是水太冷？」改成擦澡、分段清潔，或讓長者先選毛巾。',wrong:'用強迫方式拉去洗澡或硬塞食物，造成衝突與受傷。',quiz:'長者拒絕照護時第一步是什麼？答案：先停止，觀察原因並降低壓力。'},
  {no:'54',text:'日夜顛倒可能來自白天睡太多、活動不足、疼痛、焦慮或環境光線混亂。照護目標是建立穩定作息。',demo:'白天打開窗簾、安排簡單活動，晚上降低燈光與噪音，睡前固定如廁與清潔。',wrong:'白天讓長者一直睡，晚上睡不著時又責罵他吵鬧。',quiz:'改善日夜顛倒可先調整什麼？答案：白天光線與活動、晚上安靜與固定流程。'},
  {no:'55',text:'遊走與走失風險需要預防。常見原因是找廁所、想回家、焦慮或無聊。環境要安全，門口與危險區域要注意。',demo:'固定帶長者如廁，準備身份資料或聯絡卡，外出時保持在視線內。',wrong:'覺得長者只是散步就不注意，或把門完全鎖住卻沒有陪伴與安撫。',quiz:'預防走失要準備什麼？答案：陪伴看視、聯絡資料、固定活動與安全環境。'},
  {no:'56',text:'幻覺或妄想時，長者看到或相信的事對他來說很真實。不要直接否定，要先確保安全，再安撫情緒。',demo:'長者說有人在房間，可以回答：「您覺得害怕，我陪您看一下，現在這裡安全。」',wrong:'嘲笑長者「哪有人」，或大聲爭辯讓情緒升高。',quiz:'面對幻覺妄想時能不能直接爭辯？答案：不建議，應先安撫並確認安全。'},
  {no:'57',text:'情緒低落可能表現為不想吃、少說話、睡眠變差、哭泣或失去興趣。照護者要觀察持續時間與變化。',demo:'記錄「連續 3 天午餐少於半碗、很少說話」，並告知家屬討論是否需要評估。',wrong:'說「不要想太多」就結束，沒有紀錄與回報。',quiz:'情緒低落需要回報哪些資訊？答案：持續時間、食量睡眠變化、行為差異。'},
  {no:'58',text:'安撫語氣要慢、低、穩，身體距離要讓長者有安全感。靠太近、動作太快都可能讓長者害怕。',demo:'蹲低或側身靠近，保持一臂距離，用柔和語氣說：「我慢慢來，您不用急。」',wrong:'站在長者正前方壓迫他，或用很快很大的動作抓住他。',quiz:'安撫失智長者時語氣應該如何？答案：慢、低、穩，並保持安全距離。'},
  {no:'59',text:'照護策略要和家屬同步，例如喜歡的稱呼、安撫方式、禁忌話題、用餐習慣與睡眠習慣。',demo:'向家屬確認：「他緊張時通常聽什麼音樂？不喜歡別人怎麼叫他？」並記錄。',wrong:'每位照護者用不同方式，讓長者每天重新適應，增加混亂。',quiz:'為什麼要和家屬同步照護策略？答案：維持一致性，降低焦慮與衝突。'},
  {no:'60',text:'第六單元角色扮演訓練學員處理重複詢問、拒絕照護、幻覺、遊走與情緒低落。重點是先安撫，再安全引導。',demo:'老師扮演拒絕洗澡的長者，學員用三句話完成安撫、選擇與替代方案。',wrong:'只背理論，情境中仍用命令或爭辯方式處理。',quiz:'失智情境處理的順序是什麼？答案：安全、安撫、簡短說明、引導下一步。'},

  {no:'61',text:'需要立即打 119 的狀況包含意識不清、呼吸困難、胸痛、疑似中風、嚴重跌倒、抽搐、大量出血或臉色發紫。',demo:'先確認安全，請旁人協助打 119，同時準備地址、長者姓名、年齡、症狀與藥物資料。',wrong:'先傳訊息等家屬回覆很久，錯過黃金處理時間。',quiz:'打 119 時要說哪些資訊？答案：地址、症狀、年齡、意識呼吸狀態與聯絡人。'},
  {no:'62',text:'呼吸困難或胸痛可能是心肺急症。照護者不能讓長者繼續活動，要讓他休息並立即求助。',demo:'讓長者半坐臥，鬆開緊衣物，觀察嘴唇顏色與呼吸聲，立即通知家屬或 119。',wrong:'讓長者躺平或繼續走路，希望「運動一下會好」。',quiz:'呼吸困難時應採什麼原則？答案：停止活動、舒適姿勢、立即求助。'},
  {no:'63',text:'意識不清與抽搐需要保持呼吸道安全。不要塞東西進嘴巴，不要強壓四肢，避免二次傷害。',demo:'移開周圍硬物，讓長者側躺或頭偏一側，記錄抽搐時間並打 119。',wrong:'把湯匙或手指塞進嘴裡，可能造成受傷或窒息。',quiz:'抽搐時可以塞東西到嘴巴嗎？答案：不可以，應保護周圍安全並求救。'},
  {no:'64',text:'FAST 是中風快速判斷：Face 臉歪、Arm 手無力、Speech 說話不清、Time 立即送醫。',demo:'請長者微笑、雙手平舉、說一句簡單話；任一異常就立即通知家屬並打 119。',wrong:'等睡一覺看看，或按摩手腳拖延送醫。',quiz:'FAST 的 T 代表什麼？答案：Time，發現疑似中風要立即就醫。'},
  {no:'65',text:'嚴重跌倒後若有頭部撞擊、劇痛、無法站立、肢體變形、意識改變，不能隨意搬動。',demo:'讓長者保持原位，蓋薄毯保暖，檢查出血與意識，等待救援。',wrong:'怕地上冷就立刻拉起來，可能加重骨折或脊椎傷害。',quiz:'跌倒後什麼情況不能搬動？答案：疑似骨折、頭部撞擊、意識異常或劇痛。'},
  {no:'66',text:'發燒、咳嗽、痰變多、喘、精神變差可能是感染警訊。長者感染有時不一定高燒，精神變化也很重要。',demo:'記錄體溫、咳嗽次數、痰色、食量與精神，通知家屬是否就醫。',wrong:'只看有沒有高燒，忽略嗜睡、意識混亂與食量下降。',quiz:'感染觀察除了體溫還要看什麼？答案：精神、呼吸、食量、痰與活動力。'},
  {no:'67',text:'洗手與口罩是感染防護基本功。接觸食物、尿布、排泄物、傷口前後都要洗手。',demo:'用肥皂搓洗手心、手背、指縫、指尖、拇指與手腕至少 20 秒。',wrong:'只用水沖一下，或戴同一雙手套做完清潔又去備餐。',quiz:'手套可以取代洗手嗎？答案：不可以，戴手套前後仍需洗手。'},
  {no:'68',text:'嘔吐與腹瀉要注意脫水、感染與環境污染。清潔時要戴手套，污染物密封丟棄，地面消毒。',demo:'記錄次數、顏色、是否發燒與喝水量，清潔後洗手並通風。',wrong:'徒手清理嘔吐物，或清理後沒有消毒門把、馬桶與地面。',quiz:'嘔吐腹瀉最需要觀察什麼風險？答案：脫水、感染擴散與意識變化。'},

function getCourseUnits(){
  const translated = COURSE_PLAN_I18N[lang];
  if(!translated || lang === 'zh') return COURSE_PLAN_UNITS;
  return COURSE_PLAN_UNITS.map((unit,idx)=>{
    const t = translated[idx];
    if(!t) return unit;
    return {
      ...unit,
      title:t[0],
      desc:t[1],
      tags:t[2],
      outcomes:t[3],
      lessons:t[4]
    };
  });
}

function buildLocalizedLessonMaterial(unit,title,idx){
  const p = COURSE_LANG_PACKS[lang] || COURSE_LANG_PACKS.zh;
  const outcome = unit.outcomes[idx % unit.outcomes.length];
  const text = `${p.textPrefix}「${title}」。${p.mustKnow}：${unit.desc} ${outcome}`;
  const demo = `${p.practice}：先說明要做的事，確認環境安全與長者狀態，再依照照護計畫慢慢完成，最後記錄並回報重點。`;
  const wrong = `${p.mistake}：沒有先確認安全或沒有告知長者就直接操作，容易造成受傷、誤會或照護中斷。`;
  const quiz = {q:p.quizQuestion,answer:p.defaultAnswer};
  return {text,demo,wrong,quiz};
}

function buildLessonMaterial(unit,title,idx,lessonNo){
  if(lang === 'zh' && COURSE_MANUAL_MATERIALS[lessonNo]) return COURSE_MANUAL_MATERIALS[lessonNo];
  if(lang !== 'zh') return buildLocalizedLessonMaterial(unit,title,idx);
  const outcome = unit.outcomes[idx % unit.outcomes.length];
  const context = unit.desc.replace(/。$/,'');
  const isReview = /複習|檢核|測驗|演練|練習|結訓/.test(title);
  const text = isReview
    ? `本課把「${unit.title}」前面學過的內容整理成實作檢核。學員要能說出重點、做出正確步驟，並知道遇到不確定情況時要先停止、確認、回報。`
    : `本課主題是「${title}」。學員要先理解：${context}。實作時請記住「先確認安全，再尊重長者意願，最後清楚紀錄與回報」；本課完成後，${outcome}`;
  const demo = isReview
    ? `示範做法：老師提出一個家庭照護情境，請學員依序說明準備事項、執行步驟、觀察重點與回報方式。回答時要使用清楚、簡短、可執行的句子。`
    : `示範做法：開始前先向長者說明「我現在要協助您${title}」，確認環境安全與需要的用品；執行過程放慢速度，觀察長者表情、呼吸、疼痛或拒絕反應；結束後記錄結果並告知家屬重點。`;
  const wrong = isReview
    ? `錯誤案例：只背答案、不會實際操作；或遇到突發狀況時自己猜測處理，沒有確認家屬、照護計畫或醫療建議。`
    : `錯誤案例：沒有先說明就直接動手、忽略長者不舒服的反應，或因為趕時間省略安全檢查。若遇到異常仍繼續操作，容易造成跌倒、嗆咳、受傷或家屬誤解。`;
  const quiz = isReview
    ? `測驗題：完成「${title}」時，最重要的判斷原則是什麼？答案：能依照照護計畫、安全檢查、異常回報三個方向說明。`
    : `測驗題：進行「${title}」前，第一件事應該做什麼？答案：先確認照護計畫、環境安全與長者狀態，再開始協助。`;
  return { text, demo, wrong, quiz };
}

function normalizeQuiz(rawQuiz, unit, title, idx){
  const pack = COURSE_LANG_PACKS[lang] || COURSE_LANG_PACKS.zh;
  if(rawQuiz && typeof rawQuiz === 'object' && Array.isArray(rawQuiz.options)) return rawQuiz;
  const source = String((rawQuiz && rawQuiz.q) || rawQuiz || '');
  const cleaned = source.replace(/^測驗題：/,'').trim();
  const parts = cleaned.split('答案：');
  const question = ((rawQuiz && rawQuiz.q) || parts[0] || pack.quizQuestion || `進行「${title}」時，最適合的做法是什麼？`).trim();
  const answer = ((rawQuiz && rawQuiz.answer) || parts[1] || pack.defaultAnswer || '先確認照護計畫、環境安全與長者狀態，再開始協助。').replace(/。$/,'').trim();
  const unitNo = unit.no || Math.floor(idx / 10) + 1;
  const banks = {
    1:['直接依照自己的經驗處理，不需要再確認。','只要長者沒有抗議，就可以省略說明。','等家屬詢問時再回報，不必主動紀錄。'],
    2:['為了節省時間，可以不遮蔽身體直接清潔。','只要看起來乾淨，就不用觀察皮膚狀況。','所有部位都用同一條毛巾清潔即可。'],
    3:['先把餐點餵完，再處理咳嗽或不舒服。','食物越稀越安全，不需要確認吞嚥能力。','長者不想喝水時，可以整天不記錄水量。'],
    4:['直接拉手臂起身，速度快比較不累。','輪椅煞車可以等坐下後再鎖。','跌倒後先扶起來，再看有沒有受傷。'],
    5:['看護可以依照經驗自行調整藥物。','只要症狀不嚴重，就不需要記錄數值。','發現漏藥時，下次吃兩倍就可以補回來。'],
    6:['反覆糾正長者，讓他知道自己記錯了。','用命令方式快速完成照護，避免浪費時間。','長者出現幻覺時，立刻大聲否定他。'],
    7:['緊急時先等家屬回訊息，再決定是否求救。','抽搐時把物品塞進嘴裡，避免咬到舌頭。','疑似中風時先按摩休息，觀察到隔天。'],
    8:['紀錄只要寫正常或不好即可，不需要細節。','照片回報越完整越好，即使拍到私密部位也沒關係。','交班時只說已完成，不需要說未完成事項。'],
    9:['不懂家庭規則時先照自己的習慣做。','遇到壓力時完全忍耐，不需要說明需求。','外出陪同只要完成行程，不必回報狀況。'],
    10:['結訓後就不需要再學習新的照護方法。','只背答案即可，不需要在情境中練習。','回報時越長越好，不需要先說重點。']
  };
  const distractors = lang === 'zh' ? (banks[unitNo] || banks[1]) : pack.distractors;
  const correctIndex = (Number.parseInt(String(unitNo) + String(idx + 1), 10) % 4);
  const options = [];
  let d = 0;
  for(let i=0;i<4;i++){
    options.push(i===correctIndex ? answer : distractors[d++]);
  }
  return {
    q: question,
    options,
    correct: correctIndex,
    answer,
    tip: lang === 'zh'
      ? `答錯時請回到「${title}」的課文與示範，先找出安全檢查、尊重告知、紀錄回報三個關鍵，再重新判斷。`
      : pack.tipPrefix
  };
}

function renderLessonQuiz(rawQuiz, unit, title, idx, lessonNo){
  const quiz = normalizeQuiz(rawQuiz, unit, title, idx);
  const pack = COURSE_LANG_PACKS[lang] || COURSE_LANG_PACKS.zh;
  const letters = ['A','B','C','D'];
  const chosen = lessonQuizState[lessonNo];
  const answered = Number.isInteger(chosen);
  const isCorrect = answered && chosen === quiz.correct;
  const opts = quiz.options.map((opt,oi)=>{
    let cls = '';
    if(answered && oi === quiz.correct) cls += ' correct';
    if(answered && oi === chosen && oi !== quiz.correct) cls += ' wrong';
    if(answered && oi === chosen) cls += ' selected';
    return `<button type="button" class="lesson-choice${cls}" ${answered?'disabled':''} onclick="answerLessonQuiz('${lessonNo}',${oi})">
    <div class="lesson-choice-letter">${letters[oi]}</div>
    <div>${opt}</div>
  </button>`;
  }).join('');
  const result = answered
    ? `<div class="lesson-answer ${isCorrect?'ok':'no'}">${isCorrect?pack.answerOk:pack.answerNo} ${pack.correctAnswer}：${letters[quiz.correct]}。${quiz.answer}</div>
       <div class="lesson-tip">${pack.wrongTip}：${quiz.tip}</div>`
    : '';
  return `<div class="lesson-quiz">
    <div class="lesson-quiz-q">${quiz.q}</div>
    <div class="lesson-choice-list">${opts}</div>
    ${result}
  </div>`;
}

function getQuizProgressStats(){
  let total = 0;
  let answered = 0;
  let correct = 0;
  getCourseUnits().forEach(unit=>{
    unit.lessons.forEach((title,idx)=>{
      total += 1;
      const lessonNo = String((unit.no - 1) * 10 + idx + 1).padStart(2,'0');
      const chosen = lessonQuizState[lessonNo];
      if(Number.isInteger(chosen)){
        answered += 1;
        const material = buildLessonMaterial(unit,title,idx,lessonNo);
        const quiz = normalizeQuiz(material.quiz,unit,title,idx);
        if(chosen === quiz.correct) correct += 1;
      }
    });
  });
  const wrong = answered - correct;
  const completeRate = total ? Math.round(answered / total * 100) : 0;
  const correctRate = answered ? Math.round(correct / answered * 100) : 0;
  return {total,answered,correct,wrong,completeRate,correctRate};
}

function getUnitQuizStats(unit){
  let answered = 0;
  let correct = 0;
  unit.lessons.forEach((title,idx)=>{
    const lessonNo = String((unit.no - 1) * 10 + idx + 1).padStart(2,'0');
    const chosen = lessonQuizState[lessonNo];
    if(Number.isInteger(chosen)){
      answered += 1;
      const material = buildLessonMaterial(unit,title,idx,lessonNo);
      const quiz = normalizeQuiz(material.quiz,unit,title,idx);
      if(chosen === quiz.correct) correct += 1;
    }
  });
  return {answered,correct,total:unit.lessons.length};
}

function renderHomeDashboard(){
  const s = getQuizProgressStats();
  const pack = COURSE_LANG_PACKS[lang] || COURSE_LANG_PACKS.zh;
  const unitButtons = getCourseUnits().map(unit=>{
    const us = getUnitQuizStats(unit);
    return `<button type="button" class="unit-menu-btn${courseViewMode==='unit'&&selectedCourseUnit===unit.no?' active':''}" onclick="scrollToCourseUnit(${unit.no})">
    <span class="unit-menu-no" style="background:${unit.color}">${unit.no}</span>
    <span class="unit-menu-text">
      <span class="unit-menu-name">${unit.title}</span>
      <span class="unit-menu-count">${us.answered}/${us.total} · ${pack.lessonCount}</span>
    </span>
  </button>`;
  }).join('');
  return `<div class="home-dashboard">
    <section class="quiz-progress-panel">
      <div class="quiz-progress-top">
        <div>
          <div class="quiz-progress-title">${pack.progressTitle}</div>
          <div class="quiz-progress-sub">${pack.progressSub}</div>
        </div>
        <div class="quiz-progress-ring" style="--quiz-progress:${s.completeRate}%"><span>${s.completeRate}%</span></div>
      </div>
      <div class="quiz-progress-grid">
        <div class="quiz-progress-stat">
          <div class="quiz-progress-val">${s.answered}<span style="font-size:12px;color:var(--gray-400)">/${s.total}</span></div>
          <div class="quiz-progress-lbl">${pack.completed}</div>
        </div>
        <div class="quiz-progress-stat">
          <div class="quiz-progress-val">${s.correct}</div>
          <div class="quiz-progress-lbl">${pack.correct}</div>
        </div>
        <div class="quiz-progress-stat">
          <div class="quiz-progress-val">${s.correctRate}<span style="font-size:12px;color:var(--gray-400)">%</span></div>
          <div class="quiz-progress-lbl">${pack.accuracy}</div>
        </div>
      </div>
    </section>
    <section class="unit-menu">
      <div class="unit-menu-head">
        <div class="unit-menu-title">${pack.menuTitle}</div>
        <div class="unit-menu-note">${pack.menuNote}</div>
      </div>
      <div class="unit-menu-grid">${unitButtons}</div>
    </section>
  </div>`;
}

function renderCourseLibrary(){
  const root = document.getElementById('course-library');
  if(!root) return;
  const copy = COURSE_COPY[lang] || COURSE_COPY.zh;
  const pack = COURSE_LANG_PACKS[lang] || COURSE_LANG_PACKS.zh;
  const allUnits = getCourseUnits();
  const selectedUnit = allUnits.find(unit=>unit.no===selectedCourseUnit) || allUnits[0];
  const visibleUnits = courseViewMode === 'all' ? allUnits : [selectedUnit];
  const displayTitle = courseViewMode === 'all'
    ? copy.title
    : `${pack.currentUnit}：${selectedUnit.title}`;
  const renderLessonCard = (unit,title,idx,forceOpen=false)=>{
    const lessonNo = String((unit.no - 1) * 10 + idx + 1).padStart(2,'0');
    const material = buildLessonMaterial(unit,title,idx,lessonNo);
    const answered = Number.isInteger(lessonQuizState[lessonNo]);
    let cardExtra = '';
    if(answered){
      const quiz = normalizeQuiz(material.quiz,unit,title,idx);
      cardExtra = lessonQuizState[lessonNo] === quiz.correct ? ' answered-correct' : ' answered-wrong';
    }
    return `<article class="course-card compact${cardExtra}" id="lesson-card-${lessonNo}">
        <div class="course-card-head">
          <div class="course-num" style="background:${unit.color}">${lessonNo}</div>
          <div>
            <div class="course-title">${title}</div>
            <div class="course-goal">${unit.desc}</div>
          </div>
        </div>
        <div class="course-tags">${unit.tags.map(tag=>`<span class="course-tag">${tag}</span>`).join('')}</div>
        <details class="lesson-detail" ${forceOpen?'open':''}>
          <summary class="lesson-summary">
            <span>${pack.openMaterial}</span>
            <i class="ti ti-chevron-down"></i>
          </summary>
        <div class="course-detail">
          <div class="course-detail-title">${copy.detailTitle}</div>
          <div class="lesson-fields">
            <div class="lesson-field">
              <div class="lesson-field-label"><i class="ti ti-book"></i>${copy.fieldText}</div>
              <div class="lesson-field-text">${material.text}</div>
            </div>
            <div class="lesson-field">
              <div class="lesson-field-label"><i class="ti ti-user-check"></i>${copy.fieldDemo}</div>
              <div class="lesson-field-text">${material.demo}</div>
            </div>
            <div class="lesson-field">
              <div class="lesson-field-label"><i class="ti ti-alert-triangle"></i>${copy.fieldWrong}</div>
              <div class="lesson-field-text">${material.wrong}</div>
            </div>
            <div class="lesson-field quiz">
              <div class="lesson-field-label"><i class="ti ti-help-circle"></i>${copy.fieldQuiz}</div>
              ${renderLessonQuiz(material.quiz,unit,title,idx,lessonNo)}
            </div>
          </div>
        </div>
        </details>
      </article>`;
  };
  let courseContent = '';
  if(courseViewMode === 'unit'){
    const selectedIdx = Math.max(0,Math.min(selectedUnit.lessons.length - 1,Number(selectedLessonNo) - ((selectedUnit.no - 1) * 10) - 1));
    const selectedTitle = selectedUnit.lessons[selectedIdx];
    const unitStats = getUnitQuizStats(selectedUnit);
    const lessonPills = selectedUnit.lessons.map((title,idx)=>{
      const lessonNo = String((selectedUnit.no - 1) * 10 + idx + 1).padStart(2,'0');
      const answered = Number.isInteger(lessonQuizState[lessonNo]);
      let statusIcon = '·';
      let pillExtra = '';
      if(answered){
        const material = buildLessonMaterial(selectedUnit,title,idx,lessonNo);
        const quiz = normalizeQuiz(material.quiz,selectedUnit,title,idx);
        const isCorrect = lessonQuizState[lessonNo] === quiz.correct;
        statusIcon = isCorrect ? '✓' : '✗';
        pillExtra = isCorrect ? ' correct' : ' wrong';
      }
      return `<button type="button" class="lesson-pill${lessonNo===selectedLessonNo?' active':''}${pillExtra}" onclick="selectCourseLesson('${lessonNo}')">
        <span class="lesson-pill-no">${lessonNo}</span>
        <span class="lesson-pill-status">${statusIcon}</span>
      </button>`;
    }).join('');
    courseContent = `<section class="course-unit" id="course-unit-${selectedUnit.no}">
      <div class="course-unit-head">
        <div class="course-unit-badge">${selectedUnit.no}</div>
        <div>
          <div class="course-unit-title">${selectedUnit.title}</div>
          <div class="course-unit-desc">${selectedUnit.desc}</div>
        </div>
      </div>
      <div class="lesson-workspace">
        <aside class="lesson-switcher">
          <div class="lesson-switcher-head">
            <div class="lesson-switcher-title">${pack.lessonPicker}</div>
            <div class="lesson-switcher-progress">${unitStats.answered}/${unitStats.total}</div>
          </div>
          <div class="lesson-switcher-grid">${lessonPills}</div>
          <div class="lesson-nav">
            <button type="button" class="lesson-nav-btn" onclick="moveCourseLesson(-1)" ${Number(selectedLessonNo)<=1?'disabled':''}>${pack.prevLesson}</button>
            <button type="button" class="lesson-nav-btn" onclick="moveCourseLesson(1)" ${Number(selectedLessonNo)>=getCourseUnits().reduce((s,u)=>s+u.lessons.length,0)?'disabled':''}>${pack.nextLesson}</button>
          </div>
        </aside>
        <main class="lesson-focus">${renderLessonCard(selectedUnit,selectedTitle,selectedIdx,true)}</main>
      </div>
    </section>`;
  } else {
    courseContent = visibleUnits.map(unit=>{
      const lessonCards = unit.lessons.map((title,idx)=>renderLessonCard(unit,title,idx,false)).join('');
      return `<section class="course-unit" id="course-unit-${unit.no}">
        <div class="course-unit-head">
          <div class="course-unit-badge">${unit.no}</div>
          <div>
            <div class="course-unit-title">${unit.title}</div>
            <div class="course-unit-desc">${unit.desc}</div>
          </div>
        </div>
        <div class="course-grid">${lessonCards}</div>
      </section>`;
    }).join('');
  }
  root.innerHTML = `<div class="course-library-head">
    <div>
      <div class="course-library-kicker">${copy.kicker}</div>
      <div class="course-library-title">${copy.title}</div>
    </div>
    <div class="course-library-note">${copy.note}</div>
  </div>
  ${renderHomeDashboard()}
  <div class="course-display-bar">
    <div>
      <div class="course-display-title">${displayTitle}</div>
      <div class="course-display-sub">${courseViewMode === 'all' ? copy.note : selectedUnit.desc}</div>
    </div>
    <div class="course-display-actions">
      <button type="button" class="course-view-btn${courseViewMode==='unit'?' on':''}" onclick="setCourseViewMode('unit')">${pack.showUnit}</button>
      <button type="button" class="course-view-btn${courseViewMode==='all'?' on':''}" onclick="setCourseViewMode('all')">${pack.showAll}</button>
    </div>
  </div>
  ${courseContent}`;
}

// ── INIT ──
renderSecNav();
renderBody();
renderCourseLibrary();
updateHeroProgress();
</script>
